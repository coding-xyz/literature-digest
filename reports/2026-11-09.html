\\(δ_1/f\\)。并请回答：把 \\(ω_h/ω_l\\) 从 \\(10^{2}\\) 增到 \\(10^{4}\\)、或令 \\(θ/t_g<ω_l\\)，误差是否仍随 \\(δ_1/f\\) 坍缩到同一曲线？若同一 δ 下 OU 与 1/f 的 d⋄ 相差约 \\(10^{2}\\)，δ 作为普适控制参数的意义何在？","basis":"通读正文（第 1–487 行：摘要、引言、式(1)–(19)、图1–3 及图注、结论、参考文献 [1]–[44]）与全部补充材料（第 489–2262 行：S1 微扰推导式(S1)–(S18)、S2 Choi 矩阵与 diamond norm 约定式(S19)–(S25)、S3 OU 及 δ_OU 推导式(S26)–(S36)、图S1–S2、S4 带限 1/f 及 δ_1/f 推导式(S38)–(S50)、图S3–S4、S5 噪声生成与统计验证式(S51)–(S65)、表S1–S2、图S5–S16）。逐式核对了式(5)–(12)、(15)–(19)、(S2)、(S9)–(S14)、(S17)–(S18)、(S29)–(S33)、(S44)–(S50)、(S52)–(S56)，并用式(S44)重算了 I_1/f 中被丢弃项的量级；用图3(a)(c) 的纵轴倍率（×10⁻²、×10⁻⁴）与图S1 的平均保真度误差界估计了相对精度。说明：文件为 PDF 文本抽取版，图仅能读到坐标刻度与图注文字，无法逐像素检查数据点、误差棒与色标；图2 的 δ_OU,c=7.38、δ_1/f,c=25.7 等数值只能按正文引用，未能独立复算；未重算任何图，也未运行作者代码。"}},{"id":"arxiv-2611.06656","no":10,"topics":["测控与噪声"],"source":"arXiv","venue":"arXiv:2611.06656 [quant-ph]","published":"2026-11-04","title":"Flux Crosstalk Calibration from Zero Knowledge to High Precision in Fully Tunable Superconducting Circuits","title_zh":"无需直接驱动 coupler 的磁通串扰标定","authors":["Y. Gao","A. Galicia","J. R. Guimarães","Y. Haddad","Y. Liu","J. Cereijo","等 12 人"],"abstract":"Precise and independent flux control is essential for scalable superconducting processors built from frequency-tunable qubits and couplers, but flux crosstalk undermines it. Conventional calibration methods rely either on dedicated readout channels, which tunable couplers typically lack, or on readout schemes requiring extensive prior spectroscopy of the qubit and coupler. We demonstrate two independent methods that characterize coupler flux crosstalk without directly driving or measuring the couplers. The first method is zero-knowledge characterization, which exploits intrinsic coupler-resonator coupling to yield rapid and accurate estimates with no prior qubit or coupler spectroscopy, accelerating large scale bring-up. The second method is symmetric branch cancellation, which isolates crosstalk from other dispersive effects allowing for quantifying with high precision. Combined with an improved iterative procedure, these methods suppress residual coupler crosstalk below $5\\times10^{-5}$, providing a complete route from zero-knowledge initialization to high-precision crosstalk characterization in fully tunable architectures.","importance":4,"importance_reason":"磁通串扰标定可直接用于可调 coupler 的 bring-up。","summary":"两种不直接驱动/测量 coupler 的方法：零知识法利用 coupler–resonator 耦合快速估计，对称支路抵消法做高精度提取；残余 coupler crosstalk 压到 \\(5×10^{-5}\\) 以下。","problem":"可调 coupler 通常没有专用读出；传统磁通串扰标定依赖大量先验光谱，难以规模化 bring-up。","method":"zero-knowledge characterization：利用固有 coupler–resonator 耦合；symmetric branch cancellation：隔离串扰与其他色散效应；再接改进的迭代流程。","result":"无需直接驱动或测量 coupler；残余 coupler crosstalk \\(<5\\times10^{-5}\\)；给出从零知识初始化到高精度标定的完整路径。","contribution":"不直接驱动 coupler 也能标定串扰，把残余 crosstalk 压到 5e-5 以下，适合规模化 bring-up。","limitation":"针对特定可调 coupler 架构；未给出全芯片规模与长期漂移数据。","key_numbers":["<5×10⁻⁵ residual","no direct coupler drive","zero-knowledge"],"url":"https://arxiv.org/abs/2611.06656","pdf_url":"https://arxiv.org/pdf/2611.06656","doi":"","review":{"verdict":"大修","confidence":"中高","correctness":"Eq. (4) 的一阶展开只在 \\(|g_cq/δ|\\)≪1 且 SQUID 严格对称时成立，但全文从未给出 \\(g_cq\\)、δ 或 \\(g^{2}/δ^{2}\\) 的数值；SI SII 反而把 idling 点刻意取在 qubit–coupler anticrossing 附近以抬高灵敏度（prefactor 15–19 GHz/Φ0），这正是展开最不可靠的区域，故 Eq. (6)(7) 提取的 \\(m_cp\\) 可能混入未量化的高阶项与 coupler 非谐性修正。Eq. (2) 与 Eq. (3) 的用法互相矛盾：一旦按 Eq. (3) 把 δ 线性化，\\(f_r\\) 与 φ̄ 就无法同 \\(m_tp\\) 的标度分离（都是水平平移/标度自由度）；若改用未线性化的 Eq. (2)，则必须预设 SQUID 余弦模型 \\(f_c(φ)\\)，即已引入先验模型，\"zero knowledge\" 不成立。Fig. 2(c) 的 \\(m_tp=(−4.2±0.6)×10^{-4}\\) 是 14% 相对误差，且是在固定 \\(g_c-r\\)、\\(f_r\\)、φ̄、dfc/dφt 后单独拟合 \\(m_tp\\) 得到的，未给参数协方差，也未传播固定参数误差。Fig. 4(b) 横轴为 ±0.5 Φ0、残余虚线为 \\(±5×10^{-5}\\) Φ0，对应的斜率约为 \\(1×10^{-4}\\)，与正文 \"slopes below \\(5×10^{-5}\\)\" 相差 2 倍，量纲/定义存在未澄清的内部不一致。","weaknesses":"1) \"Zero knowledge\" 名实不符：正文第 199–213 行明确 ZKC 用于 coupler 前必须先对辅助 qubit 做 ZKC（否则其频率移动会拖动谐振器），SI S1 的 Fig. S1 即是这一步；再加上必须已知 \\(f_c^{max}>f_r>f_q^{max}\\) 的频率层级、谐振器频率与 Eq. (2) 的解析线型，实际是 \"无需对目标做直接谱学\"，而非摘要所称 \"no prior qubit or coupler spectroscopy\"。ZKC 的 0.25% 精度（SI S3）还是与 SBC 矩阵相减得到的，属循环验证，无独立真值。\n2) SBC 的假设与独立性被削弱：正文 227–229 行写明 \"If we assume that the residual crosstalk is sufficiently suppressed by prior ZKC calibration\"，即 SBC 的线性化建立在 ZKC 输出之上，与摘要/引言反复强调的 \"two independent methods\" 直接冲突；SBC 又需要 qubit spectroscopy、Ramsey 与对称点 \\(φ_L/φ_R\\)、δ 的已知值，正是引言用来批评传统方法的 \"extensive prior spectroscopy\"。此外 Eq. (5) 的分支翻转只抵消目标 qubit 自身的 ∂\\(f_q/\\)∂\\(φ_q\\) 项，不抵消 probe qubit 自身频率变化经共享 coupler 引起的 ZZ 型频移，因此 qubit–qubit 元素可能把非 flux-crosstalk 的色散位移算进矩阵。\n3) 残余 \\(<5×10^{-5}\\) 的计量学定义缺失且不自洽：未说明是单元素 1σ 拟合斜率、还是所有 probe 对目标贡献的合成上限、置信水平、N 次重复、每点 σ 与拟合协方差；SI S2 又以 \"standard error 超过 \\(5×10^{-4}\\) 就剔除数据\"（比宣称精度大 10 倍）处理近邻 probe，因此 \"all slopes below \\(5×10^{-5}\\)\" 是有条件的结论；Fig. 4(b) 的 \\(±5×10^{-5}\\) 虚线与 ±0.5 Φ0 扫描范围隐含斜率 \\(~1×10^{-4}\\)，与 \\(5×10^{-5}\\) 矛盾。残余量最终仍由被标定的 SBC 自身测得（自洽检验），无法排除 prefactor 误差、近 anticrossing 非线性、flux-line 绝对增益误差等共模系统项；而绝对增益（对角元被默认为 1）的标定流程完全没有交代。\n4) 规模与外推证据不足：芯片是 10 qubit + 9 coupler 的链，但矩阵与残余只在 Q0、C0、Q1、C1、Q2 这 5 个元素的 5×5 子矩阵（20 个非对角元）上给出；摘要的 \"residual coupler crosstalk below \\(5×10^{-5}\\)\" 实际只对 C0、C1 两个 coupler 成立（Fig. 4b 与 Fig. S2），未加限定。全 19×19（342 个非对角元）未测，没有任何单元素耗时、并行度或带机时数据，\"accelerating large scale bring-up\"、\"parallel characterization\"、\"rapid\" 均无量化支撑；也没有时间漂移、重复 cooldown 一致性、温度/磁场依赖、以及矩阵是否与工作 flux 点无关的任何检验。器件参数（\\(f_q\\)、\\(f_c\\)、\\(g_c-q\\)、\\(g_c-r\\)、非谐性、Ramsey T2*）与测量条件（probe 步长/点数、扫频范围）亦未列出。\n5) 对比不公平且只报最佳点：Fig. 4(b) 自称 \"a representative example\"（C0），Fig. S2 只补了 Q0/Q1/C1/Q2；ZKC 与 SBC 对比中唯一的例外恰是最大的 coupler–qubit 元素（C0←Q1：SBC 5.43 vs ZKC 6.46，相对误差约 19%），却被 \"one exception\" 一笔带过。与 [14,15,16,18] 等同类方法没有同芯片、同时间预算的正面比较，也没有给出标定前后 CZ 保真度/ZZ 残余的实验对照；[19,20] 的标题本身就是 \"无专用读出谐振器的 coupler 表征\"，而引言称该问题 \"has remained elusive\"，需正面回应。另外矩阵出现明显违反互易性的对：\\(m_{Q0\\)←Q1}=−2.45% 而 \\(m_{Q1\\)←Q0}=+0.47%，\\(m_{C1\\)←C0}=−1.66% 而 \\(m_{C0\\)←C1}=+1.34%；若 crosstalk 以互感为主应有 \\(M_ij=M_ji\\)（同号、量级相近），这类 3 个量级于 \\(5×10^{-5}\\) 的不对称既未解释，也可能是符号/定义错误，直接动摇整个线性矩阵图像。","overclaim":"摘要 \"zero-knowledge characterization ... with no prior qubit or coupler spectroscopy\" 与正文第 199–213 行 \"requires that it first be performed on the qubits\" 自相矛盾；研究问题部分 \"two independent methods\" 与 SBC 显式依赖 ZKC 先验抑制（第 227–229 行）矛盾；摘要 \"suppress residual coupler crosstalk below \\(5×10^{-5}\\)\" 未说明这只是 C0、C1 两个 coupler、5 元素子矩阵、且以剔除近邻数据点为条件、无误差棒；第 85 行 \"from zero knowledge to high fidelity operations\" 与结论 \"complete solution\" 在完全没有门保真度/ZZ 数据的情况下使用；第 214–216 行 \"in principle applicable across a broad range of architectures and coupling strengths\" 未在该频率层级（\\(f_c^{max}>f_r>f_q^{max}\\)）与对称结之外做任何演示；引言 \"straightforward and high-precision flux crosstalk calibration of tunable couplers without direct coupler spectroscopy has remained elusive\" 与作者自引的 [19,20]（标题即无专用读出 coupler 表征）明显冲突；\"we improved the iterative process\"（第 324–332 行）未给标准迭代与 Eq. (9) 改进迭代的收敛对比，只是断言。","citations":"必核对：(1) [16] X.-Y. Yang et al., Phys. Rev. Applied 25, 10.1103/42lc-rd4t (2026)——SBC 的对称点法直接来源，需核对其适用对象、精度与本文 delta，否则 SBC 的新颖性无法界定；(2) [14] Dai et al., PRX Quantum 2, 040313 (2021)——被引作 \"not directly applicable to couplers\"，但它本身处理大规模 flux 标定（含 coupler），需核对是否被低估；(3) [15] Dai et al., \"Optimizing for periodicity\", Quantum Sci. Technol. (2024)——引文写成卷 20，2024 年 QST 卷号应为 9，卷号/年份需核；(4) [18] Aguila et al., APL Quantum 3 (2026)——标题即 qubit–coupler 系统 flux crosstalk 的表征与抑制，是与本文最接近的竞品，却只在 [17–20] 中一笔带过，必须正面比较；(5) [19] C. Zhang et al., APL 122 (2023) 与 [20] X. Zhang et al., PR Applied 24 (2025)——标题分别是无专用读出谐振器的 coupler 表征与 coupler 表征优化，与 \"remained elusive\" 的表述冲突，需核对并改写；(6) [10] Kosen et al., PRX Quantum 5, 030350 (2024) 与 [12] Kaczmarek et al., IEEE TAS 36 (2026) 的卷/年需核；(7) SI 引 [1] Yan et al., PRL 120, 260504 (2018) 与 [2] Hutchings et al., PR Applied 8, 044003 (2017)——分别支撑 Γ∝\\(χ^{2}\\) 与 Γ∝df/dφ，需核对其适用器件与本文 flux-sensitive 偏置点是否一致；(8) [1] arXiv:2510.19928、[2] EPJ Quantum Technol. 13 (2026)、[7] arXiv:2609.31280 用于 \"scalable\" 动机，需核对编号与可引用性。","questions":"(1) 请给出 \\(5×10^{-5}\\) 的严格操作定义：是单元素 1σ 拟合斜率，还是所有 probe 对目标贡献的合成上限？并解释 Fig. 4(b) 中 ±0.5 Φ0 扫描范围与 \\(±5×10^{-5}\\) Φ0 残余虚线为何隐含 \\(~1×10^{-4}\\) 的斜率，而正文写 \"slopes below \\(5×10^{-5}\\)\"；同时给出每点 σ、拟合协方差矩阵、重复测量次数、以及因 \"standard error \\(>5×10^{-4}\\)\" 被剔除的数据比例。(2) Fig. 4(a) 中 \\(m_{Q0\\)←Q1}=−2.45% 而 \\(m_{Q1\\)←Q0}=+0.47%、\\(m_{C1\\)←C0}=−1.66% 而 \\(m_{C0\\)←C1}=+1.34%，若以互感为主应满足 \\(M_ij=M_ji\\)（同号同量级）：请说明这种符号与量级不对称的物理来源，或确认是否存在符号/定义错误；并说明 qubit 作目标时，probe qubit 频率变化经共享 coupler 产生的 ZZ 型频移是否混入了 Eq. (5) 的 \\(m_qp\\)。(3) 请分别给出：ZKC 在 coupler 上不先做 qubit ZKC 时的可行性与误差；SBC 从单位矩阵（完全不做 ZKC）单独收敛所需迭代次数与最终精度；以及把矩阵从左下 5×5 推广到全 19×19 的实测耗时、两次标定间的漂移与重复 cooldown 一致性；若器件不满足 \\(f_c^{max}>f_r>f_q^{max}\\) 或 SQUID 结不对称，两方法是否仍成立？","basis":"通读全文：正文第 1–438 行（摘要、引言、Fig. 1–4 与图注、Eq. (1)–(9)、结论、致谢、参考文献 [1]–[20]）＋补充材料第 439–704 行全部四节（SI–SIV、Fig. S1–S4 与图注、Eq. (S1)–(S6)、SI 参考文献）。逐条核对了 Eq. (4)(5)(6)(7) 的推导与符号、Fig. 4(a) 与 Fig. S3(a)(b) 的矩阵数值（据此发现互易性/符号异常与 C0←Q1 的 19% 例外）、Fig. 4(b) 的坐标轴与 ±5×10⁻⁵ 虚线一致性、SI S2 的数据剔除阈值、SI S3 的 0.25% 与 1.04 例外、SI S4 的 dephasing 灵敏度论证。说明：只能读取文本抽取版（图和色标仅见文字标签与坐标刻度），未能逐像素检查误差棒、数据点数量与拟合残差，也未查阅作者所谓 \"Supplementary Note\" 之外的材料（文中引用的 Supplementary Note 即此 SI 四节）。"}},{"id":"arxiv-2611.05867","no":11,"topics":["Pauli 传播","大规模仿真"],"source":"arXiv","venue":"arXiv:2611.05867 [quant-ph]","published":"2026-11-04","title":"Efficiently tracking errors and outcomes in universal quantum circuits","title_zh":"通用容错线路中的 Pauli frame 误差追踪与解码失败检测","authors":["Thomas R. Scruby","Julio C. Magdalena de la Fuente"],"abstract":"We present a method for efficient simulation of error propagation and decoding in universal fault-tolerant quantum circuits under stochastic Pauli noise, requiring only that the circuit has a high fault distance and that all logical non-Clifford operations are implemented by physical T, CS and CCZ gates. This is achieved using modified Pauli frame-based error tracking in which the frame contains no logical information. Decoding success is identified by verifying that the Pauli frame is still logically trivial after decoding. Using the results of Ref. [1] and the observation that the distribution of non-logical measurement outcomes in the circuit is independent of the logical state, we show that we can accurately sample all detector outcomes. Our approach can also simulate circuits containing adaptive operations conditioned on logical measurements, provided these measurements have a known outcome distribution. This applies to the majority of adaptive operations such as state teleportation and preparation by measurement. Our method only detects decoding failures and so is consistent with complexity-theoretic expectations as it cannot be used to sample from the noiseless outcome distribution of the logical circuit.","importance":5,"importance_reason":"Pauli frame 大规模 FT 线路仿真，属于大规模纠错线路仿真。","summary":"在随机 Pauli 噪声下，用不含逻辑信息的 Pauli frame 追踪误差与解码；只需高 fault distance 和物理 T/CS/CCZ 非 Clifford 门，就能准确采样 detector outcomes，并模拟部分自适应操作。","problem":"通用 FT 线路的 circuit-level 模拟随逻辑比特数和码距指数增长；很多任务只需要知道解码是否失败，不需要完整逻辑分布。","method":"修改 Pauli frame 追踪，使 frame 不含逻辑信息；解码成功等价于 frame 仍逻辑平凡；利用非逻辑测量结果分布与逻辑态无关，采样所有 detector outcomes；支持结果分布已知的自适应操作。","result":"可高效模拟通用 FT 线路的误差传播与解码，准确采样 detector outcomes；覆盖 state teleportation、measurement-based preparation 等自适应操作；只检测解码失败，因此不能采样无噪声逻辑分布（与复杂度预期一致）。 解码成功的判据可写成 $$\\text{decoding succeeds}\\iff F\\in\\mathcal{G}_{\\mathrm{logical}},$$ 其中 \\(F\\) 是解码后的 Pauli frame。","contribution":"用不含逻辑信息的 Pauli frame 只追踪解码失败，给通用 FT 线路提供可扩展的 detector 采样。","limitation":"要求高 fault distance 且非 Clifford 由物理 T/CS/CCZ 实现；只能检测解码失败，不能给完整逻辑输出分布。","key_numbers":["Pauli frame","T/CS/CCZ","detector outcomes","decoding failure only"],"url":"https://arxiv.org/abs/2611.05867","pdf_url":"https://arxiv.org/pdf/2611.05867","doi":"","review":{"verdict":"弱拒","confidence":"中高","correctness":"本文的核心设计——把标准 Pauli-frame 跟踪与 Ref. [1] 的 third-order-block twisted-error 采样拼接，并用“frame 逻辑平凡”判定解码成功——只以蓝图形式给出；condition C 的精确定义、近似检查的误差方向、twisted-error 采样的复杂度与正确性证明全部外包给伴随文献 [1]（arXiv:2609.19485），本文无法独立核验，因此“正确”目前只是一个条件性主张。App. A 的 Theorem 1 只在“block 前后各有完整 stabilizer 提取、\\(U_C\\) 支持不与任何逻辑 Z 重叠、且 case 2 不出现”的受限 CCZ 情形下证明测量分布正确；从式 (A3) 第三行到第四行实际上要求 \\(U_C\\) X[xs]Z[zs'] = X[xs]Z[zs''\\(]U_C\\)，这仅当 \\(U_C\\) 是对角 Clifford 时成立，文中既未证明也未在定理陈述中假设，Theorem 2 又只对“CCZ 作用于三个不同 codeblock”排除 case 2，含物理 T 门、block 内 CCZ 或 CS 的一般 third-order circuit 没有覆盖。更根本的是失败判据本身不唯一：摘要说“frame 仍逻辑平凡”即成功，Sec. III C 却说“逻辑测量出现翻转”即失败；一个与所有最终被测逻辑 Pauli 都对易的逻辑错误（例如只做 Z 基读出的记忆实验中的逻辑 Z）会让 frame 非平凡却不产生任何翻转，两种判据给出不同的失败率，而“frame 逻辑平凡”也不是 logical action 的完备不变量——非 Pauli 的逻辑 Clifford 无法被 Pauli frame 表示，App. A 又明确把 residual Clifford \\(U_C\\) 丢掉。全文没有数值结果、与 full circuit-level 模拟的对比、复杂度定理或任何图/表。","weaknesses":"（1）失败判据不自洽且不完备。摘要（ll. 25–27）把“解码后 frame 仍逻辑平凡”作为成功判据，Sec. III C（ll. 600–617）却把“逻辑测量出现翻转”作为失败判据；二者只在“每个逻辑错误都与某个被测逻辑 Pauli 反对易”时才等价。只做 Z 基读出的记忆实验中，逻辑 Z 错误使 frame 非平凡但不翻转任何测量，前者判失败、后者判成功；反之，若最终只测部分逻辑 Pauli，一个与所有被测 Pauli 都对易的逻辑错误会被翻转判据完全漏掉。文中既未说明失败率按哪一个定义，也未证明判据的完备性。更严重的是，非 Pauli 的逻辑 Clifford 错误（例如 residual Clifford \\(U_C\\) 作用成逻辑 S）无法被 Pauli frame 表示，App. A 又明确把 \\(U_C\\) 丢弃，只论证了测量分布而没论证逻辑作用；若 condition C 只近似可查（Sec. II B, ll. 175–177 自认“只能 upper bound”），近似检查通过而 C 实际失败时就会低估失败率，文中没有说明近似为何总是保守方向。byproduct 平凡化（Sec. III C, ll. 620–677）依赖所制备态是 Pauli 本征态（|0> 的逻辑 Z、|+> 的逻辑 X 才是 stabilizer）；对独立 T factory 输出的 magic state 这类非 Pauli 态，X、Z 两个 logical 分量一般不能同时平凡化，文中未说明如何处理。（2）“high fault distance”未定义，样本复杂度未讨论，使“efficient”只对单 shot 成立。文中从未给出 distance d、物理错误率 p、阈值 \\(p_th\\)、码长 n 与 decoder 之间的定量关系，也没说“高”是相对什么而言。高 distance 下逻辑失败率 \\(p_{\\mathrm{fail}}\\) ~ \\(p^{\\)⌈(d+1)/2⌉} 指数小，用 Monte Carlo 估计它需要 N ~ \\(1/(ε^{2}\\) \\(p_{\\mathrm{fail}}\\)) 个 shot；per-shot 多项式并不等于总成本 efficient，而方法最想覆盖的“大距离、大电路”恰是 \\(p_{\\mathrm{fail}}\\) 最小、shot 数最爆炸的 regime。文中完全没有 importance sampling / splitting / 稀有事件估计的讨论，也没有报告任何 \\(p_{\\mathrm{fail}}\\) 与 shot 数的关系，因而无法支持“估计 large-scale algorithms 失败率”的说法。（3）物理模型与开销不完整，且恰好漏掉决定实际失败率的因素。Sec. III A 把显式修正当作 p=1 的确定性 Pauli，等价于假设修正门无噪声；但 non-Clifford block 前必须物理施加典型权重 n/2 的 X 修正（ll. 549–561），这些门在真实器件上同样会出错，且其时间/门数开销未被计入。文中还明确假设经典计算与通信无噪声（l. 119），忽略实时解码延迟、syndrome 通信与 classical feed-forward 的时间，而这些在 surface code/qLDPC 的 circuit-level 评估中往往是主导项。噪声只允许 stochastic Pauli，排除 erasure、leakage、相干与关联噪声；后者恰是很多光子/中性原子架构与 qLDPC 码的主要误差。此外，T factory 的 fault distance 通常低于数据码，若把 factory 整体当作 third-order block，“high fault distance”假设恰在最易失败处最弱；文中没有讨论。（4）自适应的处理限制被“majority”一词淡化。Sec. III D 要求条件测量的 outcome distribution 已知且与逻辑态无关，只能覆盖 teleportation、state injection 等 gadget 级自适应；算法级经典反馈（QPE 的反馈、repeat-until-success、按测量结果选择后续门/分支）其分布依赖逻辑态或至少未知，方法不适用。文中“applies to the majority of adaptive operations”没有给出任何分类或反例边界。更实际的问题是：为了无偏估计 failure rate，应对每个 shot 重抽 circuit instance（ll. 709–717），但作者自己把“需要多少个 instance 才够”留作 future work；若复用一个 instance，失败率估计可能有偏，而这一偏差在 adaptive 门较多的电路中可能很大。（5）通用 twisted-error 采样的复杂度与模块接口未定义，且没有实现或 benchmark。Ref. [1] 的通用方法要对整个 non-Clifford block 的稀疏矩阵做 Gaussian elimination（App. A, ll. 770–775），文中没有给出其时间/内存复杂度，也没说清 affine offset 是否要对每个 X-error 配置重算；App. A 的 gate-local 快速法只对“CCZ 作用于不同 codeblock”成立，含 T 门或 block 内 CCZ 的电路不适用，因此“与 stim 同 overhead”只覆盖很窄的一类电路。Sec. III C 一方面说从 DEM 中“removal of all faults that lie within the block”（ll. 568–570），另一方面说“Z detectors fully within the block are not part of the input to the decoder described here”（ll. 573–575），但没说 block 内的 Z 错误由哪个 decoder、用哪些 detector 解码；边界条件与 twisted DEM 的接口不完整。最后，全文没有任何实现、数值实验或与 full circuit-level 模拟（state-vector/tableau/stim + 非 Clifford 扩展）的对比，因而“可扩展规模”完全没有证据。","overclaim":"（1）标题与摘要的“universal”没有限定词：实际覆盖的是 CSS 码、对角 third-level gate、third-order block、stochastic Pauli 噪声、已知 outcome distribution 的自适应操作、无噪声经典控制与修正；“requiring only ...”中的“only”严重低估了假设集合，至少还应列出 CSS、对角性、可高效解码、近似 condition C、修正无噪声等。（2）“modified Pauli frame ... in which the frame contains no logical information”按字面是错的：frame 的 logical 分量正是判定逻辑错误所需的信息，Sec. III C 还显式构造 zL 并施加 logical zL'，说明算法内部在处理 logical 信息；准确说法应是“frame 不含逻辑态的振幅/逻辑测量结果，并被维护为逻辑平凡”。（3）摘要“we show that we can accurately sample all detector outcomes”与正文自相矛盾：Sec. III B 说“in most cases of practical interest”“often known”，Sec. III C 更承认 non-CSS readout 时“cannot always correctly sample all stabilizer outcomes”；“all”没有证明，最多是“在若干受限情形下”。（4）Discussion 的“first scalable and efficient approach to the simulation of the performance of large-scale fault-tolerant algorithms”和“already today this would allow for an efficient estimation of failure rates of larger subroutines”与同段的“more of a conceptual blueprint”直接冲突：没有实现、没有 benchmark、没有复杂度定理，不能称“first scalable”或“already today”。（5）“This applies to the majority of adaptive operations”是未经验证的经验判断；算法级反馈被排除，而它恰恰是 universal algorithm 的常见部分。（6）“consistent with complexity-theoretic expectations”只是启发性论证，不是定理；尤其需要与 [9,10] 的“polynomial-time simulation of non-Clifford QEC”划清界限，否则“first efficient universal”与“复杂度上不可能”之间存在明显张力。（7）“These are common building blocks of proposals for practical fault-tolerant architectures [18–21]”没有任何一个具体实例：surface code/BB code 的 logical T 通常由 T factory + injection/lattice surgery 实现，并非本文意义上的 physical T/CS/CCZ third-order block；不给出至少一个分解实例，这句话不可核验。","citations":"需核对：（a）Ref. [1] Magdalena de la Fuente & Scruby, arXiv:2609.19485——本文全部严格正确性所依赖；必须核对其 condition C 的精确定义、近似检查的误差方向、twisted-error 采样的复杂度与“logical channel unaffected”的证明是否覆盖非 Pauli 逻辑 Clifford。（b）Ref. [9] Takada–Bartlett–Williamson, arXiv:2609.16929 与 Ref. [10] Cercelescu–Koch–Pesah, arXiv:2610.06811——两者都声称对非 Clifford QEC 做 efficient/polynomial-time simulation；若 [10] 能在多项式时间采样含噪非 Clifford 电路的输出，则 failure-rate 估计只是其推论，本文“first efficient and universal”与“complexity-theoretic expectations”的论证都需要重写。必须逐条比较其电路类、噪声模型与是否能给出 failure rate。（c）Ref. [11] Wang–Gu, arXiv:2610.22315 与 Ref. [12] Xiao et al., arXiv:2610.03605——magic state factory 的高效保真度模拟，和本文的适用电路类高度重叠，需要说明相对优势。（d）Refs. [13–16]——本文把它们归为“optimised but still inefficient”；需核对 [14] Tsim、[15] Syqma、[16] Soft 是否真的不能给出 failure rate，以及“inefficient”的具体含义。（e）Ref. [33] Magdalena de la Fuente–Feldman–Eisert–Bauer, arXiv:2604.02033——twisted decoding 的“practical performance can be significantly improved”是否在本文的 noise/decoder 下成立。（f）Refs. [34,35]——“third-order block is still fault tolerant if Z errors are decoded on an unmodified decoding graph”是对所有阶数成立还是仅 leading order；这直接决定 (1) 中“condition C 近似”的可靠性。（g）Refs. [18–21] Gidney arXiv:2505.15917、Pinnacle arXiv:2602.11457、Tour de Gross arXiv:2506.03094、High-rate qLDPC arXiv:2607.28795——这些架构的 logical non-Clifford 是否真的由 physical T/CS/CCZ third-order block 实现，而不是 T factory + lattice surgery；需要至少一个明确的对应关系。（h）Refs. [36–40]——文中说 Clifford logical measurement 的 outcome distribution “often known”；需核对哪些方案真的给出已知分布，尤其是 [40] magic quantum code surgery。（i）Refs. [43,44] copy-cup CCZ——Theorem 2 的适用性。（j）Ref. [4] stim——文中“Pauli frame simulation approach employed by stim”的具体含义，以及“a simple modification”与 stim 现有 detector/reference outcome 机制的差异；需核对 stim 是否已经能处理本文的部分情形。（k）Refs. [22,23] Knill–Laflamme 与 operator QEC——用它们论证“errors in correctable regions act trivially on logical information”是否足够，尤其对 subsystem/operator QEC 的情形。（l）Ref. [31] Delfosse–Paetznick“deterministically −1”测量 outcome 的处理，以及 Ref. [41] yoked surface codes 的 coarse-graining 说法。","questions":"（1）请给出“frame 逻辑平凡 ⟺ 解码成功”的严格陈述与证明，并明确失败率到底按 frame 平凡还是按逻辑测量翻转定义；在只做 Z 基读出的记忆实验中，一个逻辑 Z 错误应算成功还是失败？请证明或举反例说明：condition C 的近似检查在通过而真实 C 失败时，误差是 over- 还是 under-estimate；以及一个 residual Clifford 实现非 Pauli 逻辑（如逻辑 S）时，Pauli frame 是否会漏报。（2）请给出 per-shot 时间复杂度与总 shot 复杂度的显式表达式（含 block 大小、distance d、码长 n、Gaussian elimination 的复杂度、decoder 复杂度、以及每个 shot 是否重抽 circuit instance），并说明在 \\(p_{\\mathrm{fail}}\\) ~ \\(p^{\\)⌈(d+1)/2⌉} 时如何避免 N ~ 1/\\(p_{\\mathrm{fail}}\\) 的 shot 爆炸；是否使用 importance sampling/splitting？若没有，请把“efficient”限定为 per-shot，并撤回对 large-scale failure-rate 估计的强主张。（3）请给出至少一个具体架构的完整实例（例如 d=5 surface code 上的 T factory + injection，或某个 BB/qLDPC 码），说明它如何分解为本文的 third-order blocks、block 的 fault distance 如何定义、block 前典型权重 n/2 的物理 X 修正如何实现且其噪声如何处理、App. A 的 gate-local 采样是否仍适用、block 内的 Z 错误由哪个 decoder 用哪些 detectors 解码；并在小规模上与 full circuit-level 模拟（state-vector/tableau 或 stim + 非 Clifford 扩展）做正对照。","basis":"通读 arXiv:2611.05867v1 全文文本（共 1016 行）：标题/摘要（ll. 1–35）、Sec. I Introduction（ll. 40–83）、Sec. II（ll. 86–212，含 Sec. II A setup、II B simulator sketch 与 condition C 的说明）、Sec. III（ll. 217–717，逐节核对 III A 的 Pauli frame/Clifford/reset/measurement 更新规则、III B 的 Pauli eigenstate preparation/Clifford/non-Clifford/logical measurement、III C 的 DEM、physical correction、logical outcomes、byproduct decoding、III D 的 adaptive circuits）、Sec. IV Discussion（ll. 722–751）、Appendix A（ll. 768–912，含 Theorem 1 的式 (A1)–(A6) 与 Theorem 2）、参考文献表（ll. 917–1016）。未查阅 Ref. [1] 原文（arXiv:2609.19485）与任何数值结果（文中没有）；txt 不含图，故无法核对任何图；未访问作者代码或 stim 实现。"}},{"id":"arxiv-2611.07545","no":12,"topics":["Pauli 传播","经典模拟"],"source":"arXiv","venue":"arXiv:2611.07545 [quant-ph]","published":"2026-11-05","title":"Efficient Pauli Truncation from Operator Stabilizer Rényi Entropy","title_zh":"用 operator stabilizer Rényi 熵判断 Pauli 截断何时有效","authors":["Haihui Wang","Yongming Li"],"abstract":"Operator stabilizer Rényi entropy (OSE) quantifies the magic of Heisenberg operators and serves as a diagnostic of their compressibility in the Pauli basis. We establish rigorous bounds showing when an operator can be efficiently approximated by Pauli truncation in terms of the scaling of its OSE. Specifically, we prove that volume-law scaling of OSE for $α\\geq1$ prevents efficient Pauli truncation from reproducing expectation values for all states at sufficiently small fixed error. On the other hand, logarithmic growth of OSE for $0<α<1/2$ guarantees efficient Pauli truncation approximability uniformly over all states. A counterexample shows that this sufficient range cannot be extended on the basis of OSE scaling alone. If we restrict to correlations over suitable low-average state ensembles, then the sufficient range extends to $0<α<1$. We further derive cumulative error bounds for iterative Pauli propagation and approximation guarantees for fixed-order out-of-time-ordered correlators. Moreover, under an independent-sign assumption, we show that logarithmic OSE for $0<α<1$ guarantees efficient Pauli truncation with the prescribed accuracy for all input states with high probability. Our results provide a theoretical framework for understanding when operator magic constrains or enables efficient Pauli truncation and for guiding the development of classical simulation methods.","importance":5,"importance_reason":"Pauli 截断的严格判据与误差界，属于大规模纠错线路仿真。","summary":"建立 OSE 标度与 Pauli 截断可近似性的严格界：α≥1 的 volume-law 阻止高效截断；0<α<1/2 的对数增长保证对所有态一致可近似；并给出迭代 Pauli propagation 的累积误差界。","problem":"Pauli propagation 的截断阈值多靠经验，缺少“给定误差下何时可以高效截断”的判据。","method":"用 operator stabilizer Rényi entropy（OSE）刻画 Heisenberg 算符在 Pauli 基下的可压缩性；证明 volume-law / log-growth 两类界；构造反例；扩展到低平均态系综与 independent-sign 假设；给迭代传播与 OTOC 的误差界。","result":"α≥1 的 volume-law 使均匀全态的高效 Pauli 截断不可能；0<α<1/2 的 log 增长保证所有态上可高效近似；低平均系综可扩到 0<α<1；independent-sign 下 log OSE（0<α<1）以高概率保证固定精度；给出 fixed-order OTOC 的近似保证。 形式化地，$$\\alpha\\ge1:\\ \\text{volume-law}\\Rightarrow\\text{no efficient truncation},\\qquad 0<\\alpha<\\tfrac12:\\ \\text{uniform efficient truncation}.$$","contribution":"用 OSE 标度给出 Pauli 截断可行/不可行的严格边界，并给出迭代传播的累积误差界。","limitation":"理论界，可能偏松；反例说明不能仅靠 OSE 标度继续扩展；未给出大规模数值实现。","key_numbers":["α≥1 volume-law","0<α<1/2 log","iterative Pauli propagation","OTOC"],"url":"https://arxiv.org/abs/2611.07545","pdf_url":"https://arxiv.org/pdf/2611.07545","doi":"","review":{"verdict":"大修","confidence":"中高","correctness":"逐行复核 Lemma 1(iii)–(iv)、Eq.(8)、Thm 1–2、Thm 4 的误差递推、Thm 6–7 的代数，均自洽（例如 Thm 1(i) 由 δχ ≥ \\(1−χ^{(α−1)/α}2^{−(α−1)M/α}\\) 与 ‖ΔO‖∞\\(^{2}≥δχ\\) 联立确得 logχ ≥ \\(M+(α/(α−1))log(1−ε^{2})\\)）。问题主要在陈述边界而非计算：(1) Thm 1(i) 被作者自承为 [39] Thm 2 与 Eq.(8) 的直接组合，Thm 1(ii) 的 \\(−2ε^{2}N\\) 项使「\\(M^{(1)}=Ω(N)\\) ⇒ 指数 χ」只在 \\(M^{(1)}>2ε^{2}N\\) 时非平凡；(2) Thm 2/3/4/7 的 LHS 漏写绝对值（如 Thm 2 的 tr[(O−Õ)ρ]、Thm 4 的 \\(tr((O_L−\\)Õ\\(_L)ρ)\\)），而证明实际证的是 spectral norm 界，故陈述要么平凡要么不成立；(3) Thm 3 的 ensemble 平均 |tr| 不属于 Def.1 的 |f(O)−f(Õ)| 形式，且其最终界与在平均态 ρ̄=Eρ 上用 Hölder+HS 得到的 sqrt(bδχ) 数值相同，b 只经 ‖Eρ‖∞ 进入；(4) Thm 5 以 ‖Õ‖∞≤√χ 换取 OTOC 的多项式区间，k≥3 时只剩 0<α<1/(k−1)，比 k=2 的 α<1 苛刻得多。","weaknesses":"（1）核心正向结果的新颖性有限，且 1/2 阈值是 ℓ1 三角不等式的产物而非近似复杂度的内在边界。α>1 的必要下界作者自己承认是 [39] Thm 2 与 Eq.(8) 的组合；α=1 的改进只是用 \\(δχ≤ε^{2}\\) 得到 \\(M^{(1)}≤h(δχ)+(1−δχ)logχ+δχ·2N\\) 的常数修正（\\(−2ε^{2}N\\)），且该项使其仅在 \\(M^{(1)}>2ε^{2}N\\) 时非平凡；Thm 3 与 Thm 5 的证明也明言分别沿用 [21,22] 与 [21] Thm 3 的结构。真正新的只有 0<α<1/2 的充分条件与 Remark 1 反例，但 α<1/2 正是 ∑\\(_{i>χ}i^{−1/(2α)}\\) 收敛的条件，即由 ‖ΔO‖∞≤\\(\\sum|a_i|\\) 这条最粗的三角不等式决定；Sec.VI 的独立符号模型把范围推到 α<1，恰恰说明 1/2 不是物理相变，而是最坏相位/相干累积假设的产物，论文却把它表述为「sharp」的充分范围边界。（2）Def.1 的「efficient」只保证保留项数多项式，不保证算法效率，且多项式次数在 α→1/2 时发散：Eq.(16) 给出 χ∝\\(L^{2α/(1−2α)}N^{c(1−α)/(1−2α)}\\)，α=0.45 时指数为 9 与 11（\\(χ~L^{9}N^{11}\\)），α→1/2 时发散；Thm 2 的 χ∝\\(ε^{−2α/(1−2α)}N^{...}\\) 同样在 α→1/2 时对 1/ε 的幂发散。更关键的是，全文没有一个物理上自然的算子族被证明满足 \\(M^{(α)}=O(logN)\\)（0<α<1/2），而读取 \\(tr(ρP_j)\\)（一般 ρ 为 #P-hard）、获得系数表、估计 \\(M^{(α)}(O_N)\\) 本身都未被计入；Sec.IV 只用一句「product states satisfy this condition」带过，摘要的「efficiently」与「for all states」因此会被误读为端到端算法。（3）Thm 3 存在定义滑移，且 b=poly(N) 是强假设。Thm 3 的结论是 ensemble 平均的 \\(E_ρ|tr(ΔOAρ)|≤ε\\)，这不是 Def.1 的 \\(|f_N(O_N)−f_N(\\)Õ\\(_{N,χ})|≤ε\\) 形式（绝对值的平均不是可分离的线性泛函之差），论文却据此声称「\\(O_N\\) can be efficiently approximated ... on average」，等于在未声明的情况下换了精度概念。就数值而言，该界与在平均态 \\(ρ̄=E_ρ\\) 上直接用 Hölder+HS 得到的 sqrt(bδχ) 完全相同（b 只通过 ‖ρ̄‖∞≤b/D 进入），所以「ensemble」机制并没有带来更好的率；b=poly(N) 要求 ρ̄ 接近最大混态（b=1 时 ρ̄=I/D），而单态 b=D 时界指数级失效。对 Remark 1 的算子取计算基集合（b=1）平均误差 \\(~2^{1−N}→0\\)，但 \\(|0^{N}⟩\\) 上的误差→2，说明「延伸到 α<1」与 all-state 结果不是同一意义上的充分范围。（4）迭代 Pauli propagation 的累积界不可用于实际算法。Eq.(13) 是纯三角不等式累积：误差\\(≤(2α/(1−2α))χ^{−(1−2α)/(2α)}\\)∑\\(_s\\) \\(ν_s2^{(1−α)M^{(α)}(A_s)/(2α)}\\)，随 L 线性增长、无任何抵消；更严重的是它要求 \\(M^{(α)}(A_s)≤M*\\) 沿整条截断轨迹成立，而这一假设对任何实际动力学（2D 随机电路、相互作用多体系统）都未被验证，且 (16) 要先用 M* 选 χ、χ 又决定 \\(A_s\\)，逻辑上循环（只能事后用 Eq.(17) 的 ∑\\(_s\\)∑\\(_{j>χ}|a_{s,j}|\\) 认证）。Fig.4 只有 5 qubits/112 updates，bound 比实际误差大一个量级以上；readout 需 χ 个 Pauli 期望到 ε/(2√χ)，shot 成本 \\(O(χ^{2}/ε^{2})\\) 未进入「polynomial expected cost」的讨论；「exact linear-time Top-χ selection」也只是期望意义。（5）volume-law 与 log-growth 之间存在大片未判定区，α>1 分支与摘要的 regime 划分冗余，反例的证明力也被高估。Thm 1 需要 \\(M^{(1)}\\)≳\\(2ε^{2}N\\)（或 \\(M^{(α)}=Ω(N^{a})\\)），Thm 2 需要 \\(M^{(α)}=O(logN)\\)；\\(M^{(1)}=\\)√N、N/logN 等区间两者都不覆盖，故并没有给出题目所称的「when」的完整刻画。由于 Rényi 熵单调且 \\(M^{(α)}≤logr≤2N\\)，(i) α>1 的「power-law growth」（a>1）根本不可能；(ii) \\(M^{(α)}=Ω(N)\\)（α>1）蕴含 \\(M^{(1)}=Ω(N)\\)，α>1 的定性排除被 α=1 覆盖，摘要把它单列为一个 regime 属冗余。Remark 1 只否定「单点 α≥1/2 的 log-growth 判据」，且其算子 \\(O=I−2|0^{N}⟩⟨0^{N}|\\) 在 stabilizer/Clifford 表象下是 polylog 可表示的，故只能说明「Pauli 基 Top-χ 固定系数」失败，不能推出「no efficient simulation」，也没有排除使用完整 OSE 曲线或相位信息的判据。","overclaim":"（1）标题/摘要的「Efficient」/「efficiently approximated」：Def.1 只保证 Top-χ 项数 χ=poly，不含读取 χ 个 Pauli 期望（一般 ρ 为 #P-hard）、获取系数表与估计 OSE 的成本；摘要同时把 all-state（Thm 2）与 ensemble 平均（Thm 3）并列为「sufficient range」，但二者精度概念不同，容易被读成同一保证。（2）引言“linear growth of OSE at α = 1, or power-law growth at α > 1 necessarily implies that Pauli truncation cannot efficiently reproduce expectation values for all states”：漏掉「sufficiently small fixed error」与 \\(c>2ε^{2}\\) 的限制；α>1 的 a>1 增长不可能（\\(M^{(α)}≤logr≤2N\\)）；「simulation」应为「Pauli 基 Top-χ 截断」，因为 Remark 1 的算子在 Clifford/stabilizer 表象下高效可表示。（3）摘要“under an independent-sign assumption ... for all input states with high probability”：概率只对人为的独立符号集合取，作者自己承认不对应物理动力学；「with high probability for all input states」易被误读为对典型态/典型动力学的保证。（4）结论“A counterexample demonstrates that this sufficient range is sharp”：只在「单点 α 的 OSE 上界 + ℓ1 三角不等式」意义下 sharp；反例的最大相干谱是特意构造的，不能排除更精细的 OSE 判据（完整曲线、相位/四阶矩信息）越过 1/2。（5）“Our results provide a theoretical framework ... and for guiding the development of classical simulation methods”：无算法、无 OSE 可计算性或估计方案（\\(M^{(α)}(O_N)\\) 本身指数难算），数值只有 5 qubits 的玩具模型支撑不足。","citations":"需核对：[31] Dowling–Kos–Turkeshi, PRL 135, 050401 (2025)：Eq.(A32) 在 \\(M^{(1)}=N\\)、ε=1/2 时是否真的只给 χ≥1/2（本文「strengthening」的全部动机依赖此比较）；α=0 的「exact Pauli representation with poly terms」是否只是 \\(M^{(0)}=logr\\) 的重述（若是，引言该句近乎同义反复）。[39] Shao–Cheng–Liu, Commun. Phys. (2026)：Thm 2 的 squared-coefficient tail 下界是否已含 α>1 结论，以及是否已有 α<1/2 的 ℓ1 尾界/阈值（这决定 Thm 1(i)、Thm 2 的新颖性）。[21] Dowling, arXiv:2603.05656：Thm 3 的证明与 Thm 5 的 telescoping 明言「similar to Theorem 3 of Ref.[21]」，需核对其 b-low-average 定义、OTOC 结论与本文的重叠程度。[22] Schuster–Yin–Gao–Yao, PRX 15, 041018 (2025)：b-low-average ensemble 的原始定义与 ensemble 平均误差的原始用法。[24] Rudolph et al., PRX Quantum 7, 032001 (2026)：是否已有 iterative Pauli propagation 的 cumulative error bound（则 Thm 4 的新意只剩 OSE 化）。[29] Angrisani et al., PRL 135, 170602 (2025)、[30] Xu et al., arXiv:2601.15770：现有 rigorous error bounds 与本文「short-time + entangled input」的关系。[41] Dowling–Modi–White, PRL 135, 160201 (2025)、[42] Dowling–Turkeshi–De Nardis–Lami, arXiv:2605.18943：OSE–LOE 桥与噪声诱导可模拟转变是否已隐含 1/2 阈值或给出反例。[44] Verstraete–Cirac, PRB 73, 094423 (2006)、[45] Schuch et al., PRL 100, 030504 (2008)：Lemma 1(i)–(ii) 的证明被省略并归因，需核对指数与归一化（本文是 \\(D^{-1}tr(O^{2})=1\\) 的算符谱，而非 MPS 纠缠谱）。[53] Tropp：Lemma 2 引用的 Thm 4.1.1 的常数 2ln(2D)、d 的定义与 Hermitian 特化需核对。建议补充与「Pauli truncation 的 Clifford/纠缠/light-cone 判据」的定量比较，以及 OSE 可计算性/估计的文献。","questions":"（1）Def.1 是否覆盖 Thm 3 的 ensemble 平均 |error|？若不覆盖，「the sufficient range extends to 0<α<1」的准确含义是什么——是对某个功能泛函 \\(f_N\\)，还是对 \\(E_ρ|tr(·)|\\) 这一新精度概念？b=poly(N) 在什么物理集合上成立（例如计算基集合 b=1，但它对 \\(|0^{N}⟩\\) 这类单点误差无约束）？（2）Eq.(16) 中 \\(M^{(α)}(A_s)≤M*\\) 沿截断轨迹的假设如何保证或监测？对任一具体动力学（如 2D 随机 circuit、TFIM 短时演化）是否有 \\(M^{(α)}(A_s)=O(logN)\\) 的证据？另外 Thm 3 后给出的显式 χ 公式请核对：按 \\(2^{...}\\) 反解应为 \\(χ≥(1−α)(b/ε^{2})^{α/(1−α)}N^{c}\\)，文中 OCR 显示的 \\(ε/b^{2}\\) 形式与定理不一致。（3）Remark 1 只针对 Top-χ 固定系数与单点 α≥1/2 判据；是否存在使用完整 OSE 曲线（所有 α，包括 α<1/2 的大值）或相位信息的 OSE-based 判据能越过 1/2？以及该算子在 Clifford/stabilizer 表象下是 polylog 可表示的，是否说明结论应限定为「Pauli-basis Top-χ truncation」，并在标题/摘要中避免「no efficient simulation」的读法？","basis":"通读 D:\\文献调研\\data\\2026-11-09\\pdfs\\2611.07545.txt 全部 1265 行：Abstract；§I Introduction（OSE 与 Pauli truncation 的定位、与 [31,39,21,22] 的关系、四个 regime 的预告）；§II 定义（Eq.(1) 的 Pauli 分解、OSE 定义、Def.1 的 efficient approximability、Def.2 的 b-low-average、Lemma 1(i)–(iv) 及 Eq.(3)–(6)）；§III Thm 1（α>1、α=1 的必要下界）、Thm 2（0<α<1/2 的充分界）、Remark 1 的反例（逐项核算 M^(1/2)=2log(3−2^{2−N})、Top-χ 保留恒等项后的 ‖ΔO‖∞=2(1−χ/2^N)）、Fig.1–2 的指数（(1+α)/(1−2α) 与 (1+α)/(1−α)，已按 ε=N^{−1} 复算）；§IV iterative propagation 的递推 (11)、Thm 4 与 Eq.(13)–(17)、readout 与 O(LχN) 成本、Fig.3–4；§V OTOC 定义 (18)、Thm 5–6 的 telescoping 与 Eq.(19)–(20)、‖Õ‖∞≤√χ 的讨论；§VI independent-sign 模型、Lemma 2（Tropp）、Thm 7 的 expectation 与 tail bound、Fig.5；§VII 结论；参考文献 [1]–[53] 全部条目的题名/出处。因 txt 为 PDF 文本抽取，公式上下标多处 OCR 变形（如 Lemma 1 的指数、Thm 3 后的 χ 公式、Eq.(16) 的括号位置），涉及具体指数的判断已按上下文复算并在 questions 中标注需核对；未阅读 [21,22,31,39] 等被引论文原文，故对其重叠程度的判断基于本文转述。"}},{"id":"arxiv-2611.08444","no":13,"topics":["经典模拟","算法"],"source":"arXiv","venue":"arXiv:2611.08444 [quant-ph]","published":"2026-11-05","title":"Polynomial-time classical simulation of boson and fermion sampling under thermal loss","title_zh":"热损耗下玻色/费米采样的多项式时间经典模拟","authors":["Armando Angrisani","Hela Mhiri"],"abstract":"Sampling experiments are a leading approach to demonstrating quantum computational advantage, yet their robustness to experimental noise is not completely understood. We develop a common framework for classical simulation of boson and fermion sampling under thermal loss, including pure loss. For Fock-state boson sampling, Gaussian boson sampling with fixed uniform squeezing, and fermion sampling with magic inputs, we obtain polynomial-time sampling at inverse-polynomial total variation error, for any fixed nonzero overall loss rate, and with high probability over Haar-random interferometers. A milder flatness assumption on the ideal output distribution suffices for quasipolynomial-time simulation without Haar randomness. With constant thermal loss per layer, the same flatness assumption gives polynomial-time simulation at logarithmic depth. Our bounds for Fock-state boson sampling cover both dilute and saturated regimes and become stronger near full input filling: when only a bounded number of input modes are empty, the noisy output for Haar-random interferometers converges, as the number of modes grows, to a distribution independent of the interferometer.","importance":2,"importance_reason":"算法文献：为 noisy sampling 提供经典基线，不是 QEC 线路结果。","summary":"对 Fock-state boson sampling、固定压缩 Gaussian boson sampling 与 magic-input fermion sampling，在任意固定非零总损耗下给出反多项式 TV 误差的多项式时间经典采样；对 Haar 随机干涉仪高概率成立。","problem":"采样实验是量子优势主张的核心，但热损耗如何削弱经典模拟难度仍不清楚。","method":"为热损耗/纯损耗建立统一经典模拟框架；在 Haar 随机干涉仪或 flatness 假设下给出多项式/准多项式时间算法；分析逐层恒定热损耗与对数深度。","result":"任意固定非零总损耗下 polynomial-time、inverse-polynomial TV 误差；无 Haar 随机性时用 flatness 得 quasipolynomial；逐层恒定损耗 + flatness 在对数深度下 polynomial；Fock-state 情形覆盖 dilute 与 saturated 区，接近满填充时输出趋近与干涉仪无关的分布。 在固定非零总损耗下，误差与运行时间满足 $$\\|p_{\\mathrm{noisy}}-p_{\\mathrm{ideal}}\\|_{\\mathrm{TV}}\\le\\varepsilon,\\qquad \\mathrm{runtime}=\\mathrm{poly}(n,1/\\varepsilon).$$","contribution":"为热损耗下的玻色/费米采样给出多项式时间经典模拟，量化噪声如何削弱采样优势。","limitation":"固定非零损耗、Haar 或 flatness 假设；不是超导 QEC 线路结果，只作为算法参考。","key_numbers":["fixed nonzero loss","poly-time","inverse-poly TV","log depth"],"url":"https://arxiv.org/abs/2611.08444","pdf_url":"https://arxiv.org/pdf/2611.08444","doi":"","review":{"verdict":"大修","confidence":"中高","correctness":"逻辑主链路（Theorem C.3 的低阶截断 → Lemma D.1/Theorem D.2 的带符号近似拒绝采样 → Corollary H.3/Theorem H.4 的有限精度与端到端）是自洽的：TV 界经由平方迹范数 ∥N(ρU)−ρ̃D,U∥\\(1^{2}≤Σ_{k>D}Γ_kW_k(U)\\) 得到，故截断预算按 \\(ε^{2}\\) 收缩（(H.19) 取 \\(aD≤δε^{2}/64\\)，与 (V.7) 的 \\(ε^{2}\\) 一致），自适应估计导致的接受判据偏差由 (D.11) 的耦合界控制，(D.14) 也给出了数值误差对 TV 的稳定性，拒绝采样的偏差与停机误差分项清楚。三个模型的抑制系数彼此相容：E.27 的 κF≤η、F.43 的 \\(Ek=s^{k}\\)（s≤η）、G.28 的 \\(q=η^{2}a(1+a)/(b(1+b))<1\\)（b=ηa+(1−η)β），配合 F.40 的 Cm,n=min{n+1,2(m+n−1)/(n+1)} 与 G.5 的 Cm=O(m)，Haar 平均意义下的 flatness 与多项式阶数截断确实成立。但整条保证只对 U 的系综成立：Assumption 1 的 \\(χ^{2}(ρU\\)∥τ)≤C 与 (H.23) 的 V(U)、C(U) 都仅靠 Markov 不等式在 U 上控制（C=C0/δ、V=4SD/δ），对任一具体 U 没有逐实例保证，而 \\(χ^{2}(ρU\\)∥τ) 本身是 #P-hard 的、算法却必须用它来定 D 与 M。另外 (H.13) 的 qB≤2η 与 q≤(1+a)η 只在 η 为多项式小（或 a 很小）时才有实质抑制含义，与“任意固定 η<1”的叙述存在常数层面的张力；fermion 分支的关键常数 C=3（Prop. E.5）与 boson 随机化评估的方差界分别直接引自未评审的同期预印本 [39] 与 [18]，本文未独立重证。","weaknesses":"（1）多项式时间的有效指数被隐藏，实际参数下完全不可计算。按 Table I：Hahn 行 \\(SD=2Σ_{k=1}^{D}(3e^{2}s)^{k}\\)（s≤η），GBS 行 SD=3\\((6e)^{D}\\)·Cm·D，而 D 由 \\(aD≤δε^{2}/64\\) 定出。取 \\(\\eta=0.5\\)、\\(ε=10^{-2}\\)、δ=0.1：Fock BS 需 D≈25，\\(3e^{2}s\\)≈11，SD 量级已是 \\(10^{26}\\)；GBS 在 n̄=1 时 q=η(1+a)/(1+ηa)≈0.67、Cm≈2.7m，给 D≈60，\\((6e)^{D}\\)≈\\(10^{75}\\)。再乘 (H.22)/(D.9) 的 \\(A,Emax=O(SD/(δε^{2}))\\) 与每点 \\(2^{O}(D)poly(m)\\) 的评估代价，m≈\\(10^{2}\\) 时总运算量可达 \\(10^{30}\\)–\\(10^{40}\\)。也就是说“常数比例损耗 ⇒ 多项式时间”在数百模的实验尺度上没有任何可操作性；论文仅在 Outlook 用一句“bounds grow exponentially with the inverse loss rate”带过，摘要、引言与 Sec. IV 的“detecting a constant fraction ... is insufficient”均未量化。更尖锐的是 \\(1/(3e^{2})\\)≈0.135：只要 η 高于约 13.5%，方差界就随 D 指数增长，这与“no threshold”的说法在实践上恰好相反。（2）Haar 随机性是本质条件而非装饰，且 flatness 对给定 U 不可检验。poly 时间完全来自 Haar 平均的二阶矩（Lemma E.13/F.10/G.14 与 \\(E[χ^{2}]\\)），δ 的代价 C=C0/δ、V=4SD/δ 是极弱的“高概率”陈述（如 Fock BS 的 \\(E[χ^{2}]≤n\\) 只给 \\(P(χ^{2}≤10n)≥0.9\\) 这类界）；而实验装置给出的是某个固定、非 Haar 的 U（固定网格、可编程移相器、时间复用环路），算法无法自检是否落在好集合内，一旦落在坏集合上就是静默失效。Theorem III.2 虽去掉 Haar，却把 \\(C≤m^{O(1)}\\) 当前提，且论文自己承认 peaked 分布（[45–47] 的 verifiable advantage 方案）落在界外；于是对实验的结论只剩“对 Haar 系综平均”的结论，不是任何具体装置的性质。（3）Corollary III.3 的“对数深度”实质是“几乎全损”窗口。L=Θ(log m) 层、每层固定 η0 ⇒ 总透射率 \\(η=η0^{L}=m^{-c}\\)，存活比例随 m 趋于 0；论文自己指出 L>L*=O(log m+log(1/ε)) 时输出已 ε/2-接近产物热态 \\(Θβ^{\\)⊗m}。因此该推论覆盖的是“几乎什么都留不下”的区间，D=O(1) 正是 \\(q=η=m^{-c}\\) 的直接后果；把它与 [39] 的 log-depth fermion ensemble 相连结时同理，只在深度超过使总透射率多项式小的阈值时成立，而 log-depth advantage 提案关心的恰是总透射率为常数的区域，那里只能退回 Theorem III.1 的 Haar 假设。摘要把这两条并置，容易被读成“每层常数损耗、对数深度的装置被覆盖”。（4）噪声模型漏掉决定实验可模拟性的主要误差。模型只有模式无关、均匀的纯/热损耗（高斯信道），并假定 η、β 与 GBS 压缩度 r 为已知精确参数。Fock-state BS 实验的首要误差——光子部分可分辨性与谱-时间模式失配、SPDC 多光子对/高阶 Fock 污染、非均匀模式相关损耗——全部不在模型内（[21–23] 只处理均匀损耗）；GBS 的阈值探测可以作为对光子数分布的后处理而被数据处理不等式覆盖（这点无问题），但暗计数、相位/锁相噪声、每模压缩不均、以及随规模变化的压缩度均未覆盖。因此“thermal loss 下不可采样”推不出“现有实验可被经典模拟”，而这正是引言给出的动机。（5）与既有 hardness 文献及同期工作的边界没有交代。引言把 [14] 概括为“transmissivity 随系统增大趋近 1 时 hardness 可存活”，但摘要的“any fixed nonzero overall loss rate”极易被读成“常损耗下 hardness 被否定”；[14] Aaronson–Brod、[15] Go–Oh–Jeong、[9] Oszmaniec 等（后者标题即宣称 robust）究竟在哪个粒子数区间、哪种误差度量下给出 hardness，必须逐条列出并与本文的 (n,m,η,β,ε) 窗口对照，否则无法判断是否矛盾。另外 [18] 已在纯损耗稀释区给出 Fock BS 的多项式时间模拟，[59] 更声称固定总透射率下覆盖 Fock BS 与 GBS；本文增量（热损耗、fermion、饱和与 near-full-filling、GBS 定值压缩、表示论框架）只在 Note added 中承认，摘要未作区分，新颖性陈述偏强。","overclaim":"（1）摘要“we obtain polynomial-time sampling at inverse-polynomial total variation error, for any fixed nonzero overall loss rate”未说明指数随 1/(1−η) 与 log(1/η) 爆炸（Table I 的 \\((3e^{2}s)^{D}\\)、\\((6e)^{D}\\) 因子），\\(\\eta=0.5\\) 时已是 \\(10^{30}\\) 以上的运算量；应改为“polynomial in m, \\(ε^{-1},\\) \\(δ^{-1}\\) with a degree depending on the (fixed) loss rate, and with constants not competitive at laboratory sizes”。（2）Sec. III 正文“It does not require the loss rate need to exceed a specific threshold: every fixed η<1 is covered”与同段前提“η is a constant bounded away from one”自相矛盾，且“no threshold”在常数层面是误导：\\(η>1/(3e^{2})\\)≈0.135 后方差界即随 D 指数增长，与 η→0 的方向完全相反。（3）摘要“With constant thermal loss per layer, the same flatness assumption gives polynomial-time simulation at logarithmic depth”把 \\(η=η0^{L}=m^{-c}\\)（总透射率多项式小、几乎全损）说成“每层常数损耗”，与实验相关的常数总透射率情形相反。（4）Outlook“Detecting a constant fraction of the input particles is therefore insufficient to certify such an advantage”是对 Haar 系综、均匀损耗、精确已知 U 与数分辨探测成立的平均情形陈述，不能推广为对现有装置（固定非 Haar 网格、非均匀损耗、部分可分辨光子、暗计数）的判断；同段的“a polynomial runtime does not necessarily imply that finite-size experiments can be simulated in practice”实际上已经削弱了前一句。（5）“Our bounds for Fock-state boson sampling cover both dilute and saturated regimes and become stronger near full input filling”中，near-full-filling 结果（Prop. III.4）限定 m−n=O(1)，此时理想输出近似单一组态，是一个与任何 BosonSampling 实验都无关的极窄角落；把它与由 Theorem III.1 覆盖的“saturated regime”（n=Θ(m)）并列会夸大普适性，而且该命题的 L1 误差只到 \\(O(m^{-1/2})\\) 量级（正文 D 的选取正是为抵消这一点），并非任意 ε。（6）“with high probability over Haar-random interferometers”被当作可略去的技术条件，但由 Markov 得到的“高概率”集合既不能被实验识别也不能验证；应明确写成 average-case over the Haar ensemble，并在摘要中点明这是核心限制。","citations":"需核对：（a）[14] Aaronson & Brod, PRA 93, 012335 (2016)——常损耗下 hardness 的精确条件（n 与 m 的关系、误差度量是 additive 还是 TV、是否要求透射率随规模趋近 1）；本文引言的概括与摘要的“any fixed nonzero loss”是否相容，需要作者给出显式参数窗口。（b）[15] Go, Oh & Jeong, arXiv:2511.07853——lossy GBS 的 sufficient hardness conditions，与本文 GBS 多项式时间结果在同一 (η, β, r) 平面上的边界。（c）[9] Oszmaniec, Dangniam, Morales & Zimborás, PRX Quantum 3, 020328 (2022)——标题即“Robust”，其 robustness 是否包含粒子损耗；若包含则与本文 fermion 结论直接冲突，必须澄清。（d）[18] Go & Jeong, arXiv:2610.27065——纯损耗稀释区多项式时间模拟的洗色编码（color coding）方差界被本文 Section E/F 4 直接借用，需核对其适用条件与常数。（e）[59] Lim, arXiv:2611.01434——据称在固定总透射率下同时覆盖 Fock BS 与 GBS（纯损耗）；本文摘要未区分增量，优先级与重叠范围需核。（f）[39] Mathur & Kerenidis, arXiv:2609.40100——Prop. E.5 的“EU \\(χ^{2}<3\\)”直接取自其 Theorem 3 与 Proposition 4；需核实该界确实对 Haar U(4B)（而非仅对 log-depth matching ensemble，即其 Corollary 7）成立，否则 Theorems III.1/III.2 的 fermion 分支常数与 D 的选择都失去依据。（g）[30] Mhiri, Thomas, Monbroussou, Chabaud, Holmes & Kashefi, arXiv:2604.14323——F.39/F.40 的 Eq. (434)/Prop. 11 与 Cm,n 的归一化；本文“cover both dilute and saturated regimes”依赖此。（h）[72] Kolarovszki, Kaposi, Zimborás & Oszmaniec——G.4 的 sector collision bound（其 Prop. 5 与 Eq. (D114)），以及 G.5 的 Cm 是否对固定压缩度均匀成立。（i）[21–23] Oszmaniec & Brod, García-Patrón et al., Brod & Oszmaniec——这些工作的损耗阈值与本文常损耗结论的分界；[23] 的非均匀损耗结论与本文“均匀 η”假设的关系。（j）[24] Oh, npj QI 11, 126 (2025) 与 [25–27]（Rahimi-Keshari et al.、Qi et al.、Bressanini et al.）——相空间判据已含探测器噪声与热浴温度，本文“thermal loss”相对这些判据的增量需逐条说明，避免重复宣称。（k）[19,20] Aharonov et al. 与 Schuster et al.——noise-induced truncation 与 Pauli weight 的类比，以及“[19,20] 的 flatness/anticoncentration”是否真是同一条件。（l）[41] Weedbrook et al.——(II.5)–(II.6) 的 β 约定（热态平均占据数）与热信道的定义是否一致。（m）[43] Khare & Zhou、[42] Filmus、[44] Griffiths & Spano——Hahn/Young/Meixner 基的正交性与次数-截断性质是整篇表示论框架的基础。（n）[75] Sagraloff & Mehlhorn——Laguerre 权（Lemma H.1）的求根位复杂度。（o）[45–47]——被本文明确排除在 flatness 之外，但 Outlook 又把它们留作 open problem，需要给出至少一个能/不能覆盖的判据。","questions":"（1）请给出显式的数值成本：取 \\(\\eta=0.5\\)、m=100、n=50、\\(ε=10^{-2}\\)、δ=0.1（GBS 另取 n̄=1），按 Table I 与 (H.19)–(H.22) 给出 D、A、Emax、SD、V 以及总算术/比特运算量的数值上界；并给出使总代价低于 \\(10^{18}\\) 次运算所需的 (η,ε,m) 区域。若该区域距“detecting a constant fraction”甚远，请相应改写摘要与 Sec. IV 的结论，并把“exponential in the inverse loss rate”替换为与 Table I 一致的定量表述。（2）请给出一个对照表，说明本文的 (n vs m, η, β, ε 及误差度量) 窗口与 [14] 的常损耗 hardness、[15] 的 lossy GBS hardness、[9] 的 fermion robustness、以及 [18]/[59] 的纯损耗多项式时间结果在何处相接或互斥；明确指出是否存在参数区域使“多项式时间可模拟”与“常损耗 hardness”同时成立（例如 hardness 仅对 additive-error 或 n=o(m) 成立），以及本文结果是否足以否定任何已发表的 advantage 主张。（3）对实验给定的固定（非 Haar）U，如何判定 \\(χ^{2}(ρU\\)∥\\(un)≤m^{O(1)}\\) 成立？若不可判定，那么在 D 与 M 由 C 决定时，算法在坏 U 上的输出与 PU 的偏差如何被使用者感知？Theorem III.2 是否应改写为“对满足 flatness 的 U 类”并给出可核验的判据（例如只对 shallow random circuit ensemble 成立）？另外，Corollary III.3 是否应明确写成 \\(η=η0^{L}=m^{-c}\\) 并给出 c、L 与 m 的显式关系，以免读者误以为它覆盖常数总透射率？","basis":"通读 arXiv:2611.08444v1 全文文本（共 6502 行）：标题/摘要（ll. 1–30）、Sec. I Introduction（ll. 33–79）、Sec. II Framework（ll. 81–142，含 (II.1)–(II.10) 与三种输入族）、Sec. III Results（ll. 145–214，Theorem III.1、III.2，Corollary III.3，Prop. III.4）、Sec. IV Outlook（ll. 217–268）、Sec. V Methods（ll. 274–444，含 Fig. 1–2、Assumption 1–4、(V.6)–(V.9)）、Note added 与 AI usage statement（ll. 385–450）、参考文献（ll. 456–619）、附录目录与 Guide to the proofs（ll. 622–731）、Appendix A（Schur 正交）、Appendix B（adjoint irrep 分解、particle reduction、Fig. 2）、Appendix C（Theorem C.3 与 Assumption 1–4 及其证明，ll. 1876–1993）、Appendix D（Lemma D.1、Algorithm 1/2、Theorem D.2、Lemma D.3，ll. 1995–2207）、Appendix E（E.4 热 Young 抑制 κF、Prop. E.5 flatness、Corollary E.7，ll. 2400–2628）、Appendix F（F.4 Haar degree、F.5 抑制 s^k、Corollary F.6、Prop. III.4 证明，ll. 3940–4180）、Appendix G（G.3 Meixner 抑制 (G.28)、Prop. G.5 flatness、G.4/G.5 确定性与随机化评估代价与 (G.76)–(G.77)、(G.109)，ll. 5050–5870、6070–6200）、Appendix H（H.1 有限精度 Lemma H.1、H.2 参考分布尾部 Lemma H.2、Table I、Corollary H.3、Theorem H.4 与 (H.11)–(H.22)，ll. 6203–6502）。未逐行核验 Appendix B 的 irrep 分解（Prop. B.1、B.7）、E/F/G 中各算子重叠恒等式（Corollary B.8、Lemma E.10/E.13/F.9/F.10/G.7/G.9/G.14）以及 Young/Hahn/Meixner 多项式递推（如 (G.108)）的推导；未独立验证 [39] 的 C=3 flatness 与 [30] 的 Eq. (434)；txt 中公式存在折行与上下标脱落，Table I 的 (3e²s)^k、\\((6e)^D\\)、12^kΓ_k 等按上下文推断，若原文排版不同请以 PDF 为准。"}}]}</script>
<script>
(function () {
  "use strict";
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  const META = DATA.meta || {};
  const ARTICLES = Array.isArray(DATA.articles) ? DATA.articles : [];
  const STORE_KEY = "ftqc-digest-v2";
  const STATUS_LABEL = { inbox: "待读", reading: "在读", done: "已提炼" };
  const IMP_LABEL = { 5: "必读", 4: "高", 3: "中", 2: "参考", 1: "低" };
  const IMP_STYLE = {
    5: ["#c62828", "#fdeaea"],
    4: ["#1f4fd1", "#e9efff"],
    3: ["#087a5b", "#e3f6ee"],
    2: ["#9a5b00", "#fff3d6"],
    1: ["#6b7280", "#f0f1f1"]
  };
  const PALETTE = [
    ["#1f4fd1", "#e9efff"],
    ["#c2410c", "#fff0e6"],
    ["#087a5b", "#e3f6ee"],
    ["#6d45c7", "#f0eaff"],
    ["#9a5b00", "#fff3d6"],
    ["#b3266e", "#fde8f2"],
    ["#0e7490", "#e2f5f8"]
  ];
  const SOURCE_STYLE = {
    "arXiv": ["#c2410c", "#fff0e6"],
    "PRX": ["#1f4fd1", "#e9efff"],
    "PRX Quantum": ["#6d45c7", "#f0eaff"]
  };
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const esc = (v) => String(v == null ? "" : v)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  let store = {};
  try { store = JSON.parse(localStorage.getItem(STORE_KEY) || "{}") || {}; } catch (e) { store = {}; }
  const wf = (id) => store[id] || (store[id] = { status: "inbox", note: "" });
  const save = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) { toast("浏览器阻止本地存储，修改仅在当前页有效"); } };
  let toastTimer;
  function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1800); }
  const dateOnly = (v) => String(v || "").slice(0, 10);

  // topic palette, stable by first appearance
  const allTopics = [];
  ARTICLES.forEach(a => (a.topics || []).forEach(t => { if (!allTopics.includes(t)) allTopics.push(t); }));
  const topicColor = {};
  allTopics.forEach((t, i) => { topicColor[t] = PALETTE[i % PALETTE.length]; });
  const sourceCounts = {};
  ARTICLES.forEach(a => { sourceCounts[a.source] = (sourceCounts[a.source] || 0) + 1; });
  const mustRead = ARTICLES.filter(a => a.importance >= 5).length;

  $("#pageTitle").textContent = META.title || "文献速递";
  $("#pageSubtitle").textContent = META.subtitle || "容错量子计算与超导量子计算机仿真";
  $("#issueDate").textContent = META.issue_date || "—";
  const reviewed = ARTICLES.filter(a => a.review).length;
  $("#issueCounts").innerHTML = `${ARTICLES.length} 篇 · 必读 <b>${mustRead}</b> 篇${reviewed ? ` · AI 审稿 ${reviewed}` : ""}`;
  $("#asOf").textContent = "数据截至 " + (META.as_of || "—");
  $("#generatedAt").textContent = META.generated_at || "—";
  $("#scopeLink").href = META.scope_href || "../SCOPE.md";

  const GROUP_STYLE = {
    "arXiv": "#c2410c",
    "PR 系列": "#1f4fd1",
    "Nature 系列": "#087a5b",
    "Quantum": "#6d45c7",
    "Science Advances": "#b3266e",
    "SciPost Physics": "#0e7490",
    "AVS Quantum Science": "#7a4bb5",
    "Quantum Science and Technology": "#9a5b00",
    "Cryptology ePrint Archive": "#8a5200"
  };
  const journalRows = Array.isArray(META.journals) ? META.journals : [];
  const totals = META.coverage_totals || {
    raw: journalRows.reduce((n, r) => n + Number(r.raw || 0), 0),
    deduped: journalRows.reduce((n, r) => n + Number(r.raw || 0), 0),
    screened: journalRows.reduce((n, r) => n + Number(r.screened || 0), 0),
    included: journalRows.reduce((n, r) => n + Number(r.included || 0), 0)
  };
  $("#coverage").innerHTML = `<details class="coverage">
    <summary><span>检索覆盖</span><span class="nums">抓取 ${totals.raw} · 去重 ${totals.deduped} · 关键词初筛 ${totals.screened} · 收录 ${totals.included}</span></summary>
    <div class="coverage-body">
      <table class="coverage-table">
        <thead><tr><th>来源 / 期刊</th><th>状态</th><th class="num">抓取</th><th class="num">关键词初筛</th><th class="num">收录</th></tr></thead>
        <tbody>
          ${journalRows.map(r => {
            const color = GROUP_STYLE[r.label] || GROUP_STYLE[r.group] || "#303030";
            const st = r.status || "ok";
            const stLabel = st === "ok" ? "正常" : st === "partial" ? "部分" : "失败";
            const stCell = `<td><span class="st st-${st}">${stLabel}</span></td>`;
            if (r.kind === "group") {
              return `<tr class="group"><td>${esc(r.label)}</td>${stCell}<td class="num">${r.raw}</td><td class="num">${r.screened}</td><td class="num">${r.included}</td></tr>`;
            }
            return `<tr class="${r.kind === "journal" ? "sub" : "single"}"><td><span class="coverage-source"><span class="source-dot" style="--sc:${color}"></span>${esc(r.label)}</span></td>${stCell}<td class="num">${r.raw}</td><td class="num">${r.screened}</td><td class="num"><b>${r.included}</b></td></tr>`;
          }).join("")}
          <tr class="total"><td>合计（去重后）</td><td>—</td><td class="num">${totals.deduped}</td><td class="num">${totals.screened}</td><td class="num">${totals.included}</td></tr>
        </tbody>
      </table>
    </div>
  </details>`;

  // keyword bar
  const state = { topic: "all" };
  function countTopic(t) { return ARTICLES.filter(a => (a.topics || []).includes(t)).length; }
  function renderKeywordBar() {
    const items = [`<button class="kbtn kbtn-all" data-topic="all" aria-pressed="${state.topic === "all"}">全部<span class="c">${ARTICLES.length}</span></button>`];
    allTopics.forEach(t => {
      const [c, bg] = topicColor[t];
      items.push(`<button class="kbtn" data-topic="${esc(t)}" aria-pressed="${state.topic === t}" style="--tc:${c};--tbg:${bg}">${esc(t)}<span class="c">${countTopic(t)}</span></button>`);
    });
    $("#keywordBar").innerHTML = items.join("");
  }
  renderKeywordBar();

  function impColor(v) { return IMP_STYLE[v] || IMP_STYLE[1]; }
  function sourcePill(source) {
    const [c, bg] = SOURCE_STYLE[source] || ["#4b514c", "#f0f1f1"];
    return `<span class="source-pill" style="--sc:${c};--sbg:${bg}">${esc(source)}</span>`;
  }
  function topicChips(a) {
    return (a.topics || []).map(t => {
      const [c, bg] = topicColor[t] || ["#4b514c", "#f0f1f1"];
      return `<span class="topic" style="--tc:${c};--tbg:${bg}">${esc(t)}</span>`;
    }).join("");
  }


  function reviewPoints(text) {
    let t = String(text || "").trim();
    if (!t) return ["（未提供）"];
    let parts = t.split(/(?=（\d+）)|(?=\(\d+\)\s)/).map(s => s.trim()).filter(Boolean);
    if (parts.length === 1) {
      parts = t.split(/\n+/).map(s => s.trim()).filter(Boolean);
    }
    if (parts.length === 1 && /[；;]/.test(t) && t.length > 120) {
      parts = t.split(/[；;]/).map(s => s.trim()).filter(Boolean);
    }
    if (parts.length === 1) {
      const sentences = t.match(/[^。！？]+[。！？]?/g) || [t];
      if (sentences.length > 1) parts = sentences.map(s => s.trim()).filter(Boolean);
    }
    const expanded = [];
    for (const part of parts) {
      if (part.length > 420 && /[；;]/.test(part)) {
        expanded.push(...part.split(/[；;]/).map(s => s.trim()).filter(Boolean));
      } else {
        expanded.push(part);
      }
    }
    return expanded.map(s => s.replace(/^[（(]?\d+[）)]?\s*/, "").trim()).filter(Boolean);
  }
  function reviewList(text) {
    return `<ul>${reviewPoints(text).map(p => `<li>${esc(p)}</li>`).join("")}</ul>`;
  }
  function reviewHTML(a) {
    const r = a.review;
    if (!r) return "";
    return `<details class="review">
      <summary>AI 审稿</summary>
      <div class="review-body">
        <div class="review-block"><h3>核心主张是否成立</h3>${reviewList(r.correctness)}</div>
        <div class="review-block"><h3>主要缺陷</h3>${reviewList(r.weaknesses)}</div>
        <div class="review-block"><h3>是否夸大</h3>${reviewList(r.overclaim)}</div>
        <div class="review-block"><h3>需要核对的引用 / 实验</h3>${reviewList(r.citations)}</div>
        <div class="review-block"><h3>要作者回答的问题</h3>${reviewList(r.questions)}</div>
        <p class="review-meta">${esc(r.basis)} · AI 生成的批判性审稿，不是同行评审；结论以原文为准。</p>
      </div>
    </details>`;
  }

  function entryHTML(a) {
    const w = wf(a.id);
    const [ic, ib] = impColor(a.importance);
    const opts = Object.entries(STATUS_LABEL).map(([k, v]) => `<option value="${k}"${w.status === k ? " selected" : ""}>${v}</option>`).join("");
    return `<article class="entry" id="p-${String(a.no).padStart(2, "0")}" data-id="${esc(a.id)}" style="--imp:${ic};--imp-bg:${ib}">
      <aside class="rail">
        <div class="no">${String(a.no).padStart(2, "0")}</div>
        <span class="imp-badge" title="${esc(a.importance_reason || "")}" aria-label="重要性 ${a.importance} / 5，${IMP_LABEL[a.importance]}"><span>${a.importance}</span><span class="den">/5</span></span>
        <span class="imp-label">${esc(IMP_LABEL[a.importance] || "")}</span>
      </aside>
      <div class="entry-body">
        <div class="entry-meta">
          ${sourcePill(a.source)}<span class="sep">·</span><time datetime="${esc(dateOnly(a.published))}">${esc(dateOnly(a.published))}</time><span class="sep">·</span><span>${esc(a.venue || "")}</span>
        </div>
        <h2><a href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">${esc(a.title)}</a></h2>
        <p class="title-zh">${esc(a.title_zh)}</p>
        <p class="authors">${esc((a.authors || []).join(" · "))}</p>
        <div class="topics">${topicChips(a)}</div>
        <p class="imp-reason"><b>重要性 ${a.importance}/5 · ${esc(IMP_LABEL[a.importance] || "")}</b> · ${esc(a.importance_reason || "")}</p>
        <p class="summary"><b>结论</b>${esc(a.summary)}</p>
        <div class="analysis">
          <div><h3>问题</h3><p>${esc(a.problem)}</p></div>
          <div><h3>方法</h3><p>${esc(a.method)}</p></div>
          <div><h3>结果</h3><p>${esc(a.result)}</p></div>
          <div><h3>关键贡献</h3><p>${esc(a.contribution)}</p></div>
          <div class="wide"><h3>局限 / 待核验</h3><p>${esc(a.limitation)}</p></div>
        </div>
        <div class="keynums"><span class="label">关键数字</span>${(a.key_numbers || []).map(k => `<span class="kn">${esc(k)}</span>`).join("")}</div>
        <div class="entry-foot">
          <div class="entry-actions">
            <select class="status-select" data-status="${esc(a.id)}" aria-label="阅读状态">${opts}</select>
            <button class="textbtn" type="button" data-note-toggle="${esc(a.id)}">${w.note ? "编辑笔记" : "笔记"}</button>
            <a class="link" href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">原文 ↗</a>
            ${a.pdf_url ? `<a class="link" href="${esc(a.pdf_url)}" target="_blank" rel="noopener noreferrer">PDF</a>` : ""}
            ${a.doi ? `<a class="link" href="https://doi.org/${esc(a.doi)}" target="_blank" rel="noopener noreferrer">DOI</a>` : ""}
          </div>
        </div>
        <details class="abstract"><summary>摘要原文</summary><p>${esc(a.abstract || "摘要待补。")}</p></details>
        ${reviewHTML(a)}
        <div class="note-wrap" data-note-wrap="${esc(a.id)}"${w.note ? "" : " hidden"}>
          <textarea class="note-area" data-note="${esc(a.id)}" placeholder="记录：值得记下的方法、需要核对的数字、与你当前工作的连接…">${esc(w.note)}</textarea>
          <div class="note-meta"><span data-save-status="${esc(a.id)}">${w.note ? "已从本机恢复" : "自动保存在本机"}</span><button class="textbtn" type="button" data-export-one="${esc(a.id)}">导出此条</button></div>
        </div>
      </div>
    </article>`;
  }

  function renderTOC() {
    const list = ARTICLES.slice().sort((a, b) => a.no - b.no);
    $("#tocList").innerHTML = list.map(a => `<li><a href="#p-${String(a.no).padStart(2, "0")}" data-toc-link><span class="toc-no">${String(a.no).padStart(2, "0")}</span><span>${esc(a.title_zh || a.title)}</span></a></li>`).join("");
  }
  function closeTOC() {
    $("#tocPanel").hidden = true;
    $("#tocToggle").setAttribute("aria-expanded", "false");
  }

  function typesetMath() {
    if (!window.MathJax || !MathJax.typesetPromise) return;
    const run = () => MathJax.typesetPromise([$("#entries")]).catch(err => console.warn("MathJax:", err));
    if (MathJax.startup && MathJax.startup.promise) MathJax.startup.promise.then(run);
    else run();
  }

  function render() {
    const list = ARTICLES.filter(a => state.topic === "all" || (a.topics || []).includes(state.topic)).sort((a, b) => a.no - b.no);
    $("#entries").innerHTML = list.map(entryHTML).join("");
    $("#emptyState").classList.toggle("show", list.length === 0);
    $("#listSummary").innerHTML = `显示 <b>${list.length}</b> / ${ARTICLES.length} 篇`;
    $$(".kbtn").forEach(b => b.setAttribute("aria-pressed", String(state.topic === b.dataset.topic)));
    typesetMath();
  }

  $("#keywordBar").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-topic]");
    if (!btn) return;
    state.topic = btn.dataset.topic;
    render();
  });

  $("#entries").addEventListener("click", (e) => {
    const toggle = e.target.closest("[data-note-toggle]");
    if (toggle) {
      const wrap = document.querySelector(`[data-note-wrap="${CSS.escape(toggle.dataset.noteToggle)}"]`);
      if (wrap) { wrap.hidden = !wrap.hidden; if (!wrap.hidden) wrap.querySelector("textarea")?.focus(); }
      return;
    }
    const one = e.target.closest("[data-export-one]");
    if (one) {
      const a = ARTICLES.find(x => x.id === one.dataset.exportOne);
      download(`note-${a.no}-${a.id}.json`, { article: { id: a.id, title: a.title, url: a.url }, workflow: wf(a.id) });
      toast("已导出此条");
    }
  });

  $("#entries").addEventListener("change", (e) => {
    const sel = e.target.closest("[data-status]");
    if (!sel) return;
    const w = wf(sel.dataset.status); w.status = sel.value; save();
    toast("状态已保存：" + STATUS_LABEL[w.status]);
  });
  let noteTimer;
  $("#entries").addEventListener("input", (e) => {
    const ta = e.target.closest("[data-note]");
    if (!ta) return;
    const w = wf(ta.dataset.note); w.note = ta.value;
    const label = document.querySelector(`[data-save-status="${CSS.escape(ta.dataset.note)}"]`);
    if (label) label.textContent = "正在保存…";
    clearTimeout(noteTimer);
    noteTimer = setTimeout(() => {
      save();
      if (label) label.textContent = "已保存 · " + new Date().toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });
    }, 300);
  });

  function download(filename, payload) {
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
  }
  $("#exportBtn").addEventListener("click", () => {
    download(`reading-notes-${META.issue_date || "digest"}.json`, {
      exported_at: new Date().toISOString(), issue: META.issue_date,
      articles: ARTICLES.map(a => ({ id: a.id, no: a.no, title: a.title, topics: a.topics, url: a.url, ...wf(a.id) }))
    });
    toast("已导出全部笔记与公式修改");
  });
  $("#printBtn").addEventListener("click", () => window.print());

  document.addEventListener("toggle", (e) => {
    if (e.target.matches && e.target.matches("details.abstract, details.review")) typesetMath();
  }, true);

  const TOC_POS_KEY = "qc-toc-pos-v1";
  const tocDesktop = window.matchMedia("(min-width: 900px)");
  let tocDrag = null;
  let tocMoved = false;
  let suppressTocClick = false;
  function isDesktopToc() { return tocDesktop.matches; }
  function setTocPosition(left, top) {
    if (isDesktopToc()) return;
    const box = $("#toc");
    const maxLeft = Math.max(0, window.innerWidth - box.offsetWidth);
    const maxTop = Math.max(56, window.innerHeight - box.offsetHeight - 8);
    const x = Math.max(0, Math.min(maxLeft, Math.round(left)));
    const y = Math.max(56, Math.min(maxTop, Math.round(top)));
    box.style.left = x + "px";
    box.style.top = y + "px";
    box.style.bottom = "auto";
    box.classList.toggle("right", x > window.innerWidth / 2);
    return { left: x, top: y };
  }
  function saveTocPosition() {
    if (!isDesktopToc()) {
      const box = $("#toc");
      const r = box.getBoundingClientRect();
      try { localStorage.setItem(TOC_POS_KEY, JSON.stringify({ left: r.left, top: r.top })); } catch (e) {}
    }
  }
  function snapToc() {
    const box = $("#toc");
    const r = box.getBoundingClientRect();
    const left = (r.left + r.width / 2 < window.innerWidth / 2)
      ? 0
      : Math.max(0, window.innerWidth - r.width);
    const pos = setTocPosition(left, r.top);
    if (pos) { try { localStorage.setItem(TOC_POS_KEY, JSON.stringify(pos)); } catch (e) {} }
  }
  function restoreTocPosition() {
    if (isDesktopToc()) return;
    try {
      const raw = localStorage.getItem(TOC_POS_KEY);
      if (raw) {
        const p = JSON.parse(raw);
        if (typeof p.left === "number" && typeof p.top === "number") setTocPosition(p.left, p.top);
      }
    } catch (e) {}
  }
  function collapseDesktopToc() {
    const box = $("#toc");
    box.classList.add("collapsed");
    document.body.classList.remove("toc-open");
    $("#tocPanel").hidden = true;
    $("#tocToggle").setAttribute("aria-expanded", "false");
  }
  function openDesktopToc() {
    const box = $("#toc");
    box.classList.remove("collapsed");
    document.body.classList.add("toc-open");
    $("#tocPanel").hidden = false;
    $("#tocToggle").setAttribute("aria-expanded", "true");
  }
  function applyTocMode() {
    const box = $("#toc");
    if (isDesktopToc()) {
      box.style.left = "";
      box.style.top = "";
      box.style.bottom = "";
      $("#tocClose").textContent = "收起";
      openDesktopToc();
    } else {
      document.body.classList.remove("toc-open");
      box.classList.remove("collapsed");
      $("#tocClose").textContent = "×";
      closeTOC();
      restoreTocPosition();
    }
  }
  tocDesktop.addEventListener("change", applyTocMode);
  $("#tocToggle").addEventListener("pointerdown", (e) => {
    if (isDesktopToc()) return;
    const box = $("#toc");
    const r = box.getBoundingClientRect();
    tocDrag = { x: e.clientX, y: e.clientY, left: r.left, top: r.top };
    tocMoved = false;
    try { $("#tocToggle").setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  });
  $("#tocToggle").addEventListener("pointermove", (e) => {
    if (!tocDrag) return;
    const dx = e.clientX - tocDrag.x;
    const dy = e.clientY - tocDrag.y;
    if (Math.abs(dx) + Math.abs(dy) > 5) tocMoved = true;
    setTocPosition(tocDrag.left + dx, tocDrag.top + dy);
  });
  $("#tocToggle").addEventListener("pointerup", () => {
    if (!tocDrag) return;
    if (tocMoved) {
      suppressTocClick = true;
      snapToc();
      setTimeout(() => { suppressTocClick = false; }, 150);
    }
    tocDrag = null;
  });
  $("#tocToggle").addEventListener("click", () => {
    if (suppressTocClick) return;
    if (isDesktopToc()) {
      if ($("#toc").classList.contains("collapsed")) openDesktopToc();
      else collapseDesktopToc();
      return;
    }
    if ($("#tocPanel").hidden) {
      $("#tocPanel").hidden = false;
      $("#tocToggle").setAttribute("aria-expanded", "true");
    } else {
      closeTOC();
    }
  });
  $("#tocClose").addEventListener("click", () => {
    if (isDesktopToc()) collapseDesktopToc(); else closeTOC();
  });
  $("#tocPanel").addEventListener("click", (e) => {
    if (e.target.closest("[data-toc-link]") && !isDesktopToc()) closeTOC();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      if (isDesktopToc()) collapseDesktopToc(); else closeTOC();
    }
  });
  window.addEventListener("resize", () => {
    if (isDesktopToc()) return;
    const box = $("#toc");
    const r = box.getBoundingClientRect();
    setTocPosition(r.left, r.top);
  });
  applyTocMode();

  renderTOC();
  render();
})();
</script>
</body>
</html>
