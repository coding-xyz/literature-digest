igh-weight or logical errors, especially in a non-Clifford circuit. In this work, we propose the use of the CNOT + T gate set to fault-tolerantly prepare a large class of magic states. We consider the propagation of Pauli faults within CNOT + T circuits and derive properties similar to those of Pauli faults within Clifford circuits, with a view to verifying fault tolerance as efficiently as possible. We present Comb, a library that can verify the fault tolerance of CNOT + T magic state preparation circuits, and demonstrate its use in verifying the fault tolerance of distance three and distance five magic state preparation circuits in minutes on a laptop. We present a distance five magic state preparation circuit that was discovered using Comb. As an independent confirmation of Comb's correctness we compare its findings to circuit-level noisy simulations for several magic state preparation circuits.","importance":5,"importance_reason":"直接给出可执行的 FT 电路验证库，覆盖 magic state 制备与编译验证。","summary":"把 CNOT+T 电路中的 Pauli 故障传播做成可验证的代数结构；Comb 能在笔记本上几分钟验证 \\(d=3\\) / \\(d=5\\) 的 magic state 制备电路。","problem":"Magic state 制备是 FT 计算中最贵的环节之一；非 Clifford 电路中故障组合爆炸，手工或通用软件都很难验证不会产生高权重逻辑错误。","method":"限制到 CNOT+T 门集，推导 Pauli 故障传播规则；实现 Comb 验证库；用 circuit-level 噪声模拟做独立交叉验证。","result":"\\(d=3\\) 和 \\(d=5\\) 的制备电路可在几分钟内完成验证；用 Comb 找到一个 d=5 的 magic state 制备电路；结果与噪声模拟一致。","contribution":"把 CNOT+T 的 Pauli 故障传播变成可执行的验证库，使 magic state 电路的 FT 验证从手工/穷举变成分钟级。","limitation":"只覆盖 CNOT+T 门集与 magic state 制备类电路；更高码距、通用非 Clifford 线路的扩展性尚未展示。","key_numbers":["d=3 / d=5","分钟级（笔记本）","20 页 / 7 图"],"url":"https://arxiv.org/abs/2611.04909","pdf_url":"https://arxiv.org/pdf/2611.04909","doi":"","review":{"verdict":"大修","confidence":"中高","correctness":"Sec. III B 的 DCP 闭合性（式 (9)–(11)）数学上成立，但它只是“CNOT/T 把 Pauli 乘对角 Clifford 映回同类”的初等观察，并没有给出摘要所称“与 Clifford 电路中 Pauli 故障类似”的性质——正文第 IV B 节自己承认 DCP 误差对测量没有确定作用、必须做 \\(2^{r}\\) 展开，Appendix C 是全文真正的技术内容而非附属。Sec. IV B 的穷举算法在“给定故障表 + 给定后选择测量表”的前提下逻辑自洽，但 Appendix B 只证明了 (⋆) ⇒ Gottesman 的 Preparation Error Propagation / Preparation Correctness 两条性质，没有证明反向，因此 Sec. IV A “this definition is equivalent to the more traditional criteria ... [21]”没有依据。更关键的是 Table I 的故障数可以完全用 15×(CNOT 数)+3×(单比特门数) 复原（5040=298×15+190×3，3408=196×15+156×3，2712=161×15+99×3），说明 d=5/d=3 的认证只覆盖门故障，而 Sec. IV A 的定义明确把测量、初态制备、bare wire 也算作可能失效的部件；同时 Appendix D 的查找表按 X、Z 两个稳定子子群分别最小化（等价于 CSS 权重）、Appendix F 的解码器也用 CSS 权重 ≤2，与 (⋆) 中“对全稳定子群取最小的 Hamming 权重”并非同一判据。结论是：核心思想（用 DCP 表示把非 Clifford 电路的故障传播压到多项式比特、再穷举 \\(s\\le\\lfloor d/2\\rfloor\\) 组合）成立且有用，但“Comb 验证了这些 d=5 电路的容错”这一核心声明只在门故障、且判据与实现口径需对齐之后才成立，目前证据不足。","weaknesses":"（1）故障模型不完整，且与自己的定义冲突。Table I 的故障数恰好等于 15×(CNOT)+3×(单比特门)，即送入 Comb 的故障集只含门后 Pauli 故障；初态制备故障、测量读出翻转、裸线与闲置故障、以及电路第一个门之前的故障都不在内。但 Sec. IV A 的容错定义明确说测量、制备、bare wire 都可能失效，Fig. 1 图注更宣称“生成完整的 Pauli 电路故障集”。这不是记账瑕疵：在后选择架构里，一个门故障若只产生被 flag/稳定子探测到的 -1 分支，再叠加一次该测量结果的读出翻转，就会把该 -1 分支当作 +1 接受——这是 2 个故障，正好落在 d=5 允许的 t=2 内，可产生未探测的高权重/逻辑错误。而附录 E 的贪心优化恰好删掉检测 ancilla、减少后选择点，这类被遗漏的故障类在“优化”电路上只会更危险。因此“d=5 认证”必须明确限定为“仅门故障”，或补做含测量/制备/闲置故障的完整认证并重报代价；目前摘要与 Table I 都未做此限定。（2）判据与实现口径不一致，等价性只证了一半，且 (⋆) 过强。(a) Appendix B 只有 (⋆) ⇒ 两条经典性质的单向证明，反向（Gottesman 容错 ⇒ (⋆)）未证，“equivalent”是过强表述，尤其它依赖的是一部未发表草稿 [21]。(b) 定义说权重是“模全稳定子群取最小的 Hamming 权重”，但 Appendix D 的 \\(T^{X}_i\\)、\\(T^{Z}_i\\) 分别对 X、Z 子群最小化，Appendix F 的可用错误集也按 CSS 权重 ≤2；“CSS 权重 ≤s”与“Hamming 权重 ≤s”互不蕴含，故“Comb 验证了 (⋆)”严格讲不成立，应二选一：把定义改成 CSS 权重并对 CSS 解码器重证 Appendix B，或在实现里对全稳定子群最小化。(c) (⋆) 用的是 s-filter（s 个故障 ⇒ 权重 ≤s），比“s 个故障产生可纠错误（权重 ≤t）”更严；若某个单故障给出未探测的权重 2 错误，对 d=5 其实是可纠的、按自然有效距离定义仍可算 FT，却会被 Comb 判坏——这既可能误杀合法电路，也直接限制了附录 E 贪心搜索的可行域，读者无法判断 196 个 CNOT 是接近真实下界还是被过严判据卡住。（3）与 circuit-level 模拟的“独立确认”不独立，且只验指数。(a) Appendix F / Fig. 3 只展示 L∼p、\\(p^{2}\\)、\\(p^{3}\\) 的标度，没有任何拟合细节（拟合区间、是否含高阶项、指数与置信区间、各点样本数与零事件处理），也没有把 Comb 判为坏的具体故障组合注入 SymFT 做正对照（fault injection），也没有证明任一“边界”组合在模拟里真的产生/不产生逻辑错误；唯一的负对照是“非 FT 电路 L∼p”，只说明仿真器本身没写错。(b) 两边噪声模型根本不同：SymFT 含初态比特翻转与测量错误（Appendix F），而 Comb 的故障表只含门故障，因此这至多是对“另一套更大噪声模型”的标度观察，不能确认 Comb 枚举的完备性。(c) Fig. 3 与 p.8 自报优化电路的 L  chained randomized prior perturbation；去掉节点级 RNG，保留链式随机扰动；在电路级噪声下做 benchmark。","result":"两个码族上均优于 BP 与 BP+OSD+CS-10；高物理错误率下与 Relay-BP 相当或更好；乘法数平均少约 \\(98\\%\\)，加法略增。","contribution":"用 sign-flip 与链式随机扰动抑制 BP 振荡，在保持 Relay-BP 级精度的同时大幅减少乘法，面向实时解码。","limitation":"只测了两个码族且为模拟噪声；未报告实际硬件延迟、吞吐和定点化误差。","key_numbers":["d=11","d=12","≈98% fewer mult.","vs Relay-BP"],"url":"https://arxiv.org/abs/2611.07144","pdf_url":"https://arxiv.org/pdf/2611.07144","doi":"","review":{"verdict":"弱拒","confidence":"中高","correctness":"算法主体（Sec. III 式(16)–(18) 与算法1）和 Sec. V-A 的运算计数本身可复核：XYZ-qDither-1 的 228,096 次乘法、222,663,168 次加法，对 Relay t=85 的 77,442,480 加法 + 12,117,600 乘法，均与文中公式一致；“约 98% fewer multiplications” 的比值 228,096/12,117,600≈1.9% 算术无误。但式(17) 无条件把前一迭代消息加到当前消息上，而算法1 第16–19行只在 \\(sgn(m_j→i^{(ℓ)})\\)≠\\(sgn(m_j→i^{(ℓ−1)})\\) 且 \\(I_j=1\\) 时才加，二者对 δ 的定义不等价；正文第179行“随机把变量节点分成两组（第二组做符号翻转合并）”在算法1 中根本没有对应步骤，分组概率也未给出，δ、分组、Bernoulli(ρ) 三个机制的语义互相冲突。算法1 第24行一旦 H·Ê=σ 立即返回，而 Sec. IV 又称“允许收集至多五个不同解并返回加权 LLR 最小者”，这与 V-A 以 N=2.6 条链的均值做成本核算相矛盾，多解保留的迭代与存储成本未进入任何计数。全文没有任何数值表，图2/图3 是唯一证据来源，因此除正文给出的 \\(7.15×10^-6\\) 一处外，所有 LER 与“orders of magnitude”类断言都无法从论文自身核对。","weaknesses":"1) 样本量与稀有事件统计完全缺失、内部不自洽。全文未给出任何蒙特卡洛 shot 数、逻辑失败事件数、置信区间方法（Poisson/Wilson）与失败判据；Sec. IV-B 的“1500 decoder chains”无法支持 \\((7.15±0.5)×10^-6\\)——±0.5 的相对误差约 7%，按 Poisson 需约 200 次失败事件，对应至少 \\(3×10^{7}\\) 次 shot。图2/图3 所有数据点无误差棒，\\(p=5×10^-3\\) 处的“优于 Relay”没有任何 CI 支撑；k=12 的 Gross code 也未说明失败是按 12 个逻辑观测量中任一失败计、还是按逻辑比特归一，因而与 k=1、d=11 的表面积码 LER 不可比。\n2) 复杂度比较的口径反而证伪了实时结论，且是选择性口径。按作者自己的数字统一到“每次 shot 总运算”：qDither 222,663,168+228,096≈222.9M，Relay 77,442,480+12,117,600≈89.6M，qDither 是 Relay 的 2.49×；乘法只占 Relay 算术的约 13.5%，而 qDither 迭代数为 200 对 85（2.35×）。“98% fewer multiplications”只挑了对己最有利的那一个子计数。更关键的是 Sec. V-B 自述 [24] 已在 FPGA 上用移位-加替代浮点乘法并量化到 4 bit——即真实硬件基线本就没有通用乘法器，拿浮点 Relay-BP 当“乘法”参照不公平；按 4-bit 移位加（1 次乘法≈3 次加法当量）折算，qDither 仍约 1.96× 更贵。\n3) 标题中的“real-time”没有任何延迟/面积/功耗证据，且关键预算被错误平移。Sec. V 只做操作计数，无 RTL、综合、FPGA 实现、关键路径、时钟频率或存储读出；20 ns/600 次迭代的预算是 [23] 针对 Relay-BP 数据通路设定的，而 qDither 每迭代运算量约多 6%、迭代数多 2.35×，该预算不能直接沿用。2.6~5 条链若串行，最坏约 500 次迭代≈10 µs，已逼近 12 µs 窗口；若并行则面积×2.6，与“less hardware overhead”冲突——论文对链的并行/串行一字未提。Y=71,280、ξ=419,904 的路由与边存储也完全未估算，而 [24] 的 67.2% LUT 恰在 VNU。\n4) 基线调参与预算不对等，且有在测试噪声点上选参的偏差。超参“通过 p=0.005、1000 个样本”的扫描选定（Sec. IV），却在 p=0.001–0.005 全区间报告且无留出集；Relay-BP 则“using the best parameters reported”直接套用 [23] 的参数而非在本设置下重调；qDither 用 5 链、b=100、多解择优，而 XYZ-Relay-1 只有 t=85，预算与搜索宽度都不同；表面积码用 b=15 而 Gross 用 b=100，两个实验根本不是同一预算。对比还只报有利点：表面积码完全不给 BP+OSD（尽管摘要声称“significantly outperforms BP+OSD+CS-10”），Gross 只在 XZ 下比 BP+OSD+CS-10，而论文卖点是 XYZ。\n5) 两个码的码距/k/噪声模型不匹配，且噪声模型细节缺失。d=11（k=1）rotated surface code 与 d=12（k=12）Gross code 的 LER 被直接并列；两实验超参、dither 区间（[-0.14,0.85] 对 [-0.07,0.5]）、ρ=0.65、b=15 对 100 全部不同，“在两个码上超过 Relay-BP”的归纳无依据。电路级噪声只给 [5],[12] 的引用，未给任何数值：单/双比特门错误率、测量与复位错误、idle 错误、p 的定义（是否为两比特去极化率）、轮数、basis 均缺；p 上限 \\(5×10^-3\\) 对 d=11 的标准 SD6 模型已接近阈值（约 0.6–0.7%），若无相应量级的 LER 就说明噪声被弱化。此外“相同探测子的事件压缩为一个有效变量并赋新先验”只有一句带过，压缩会改变先验与解码图，却不影响与未压缩 Relay-BP 的比较。","overclaim":"标题 “Real-Time Quantum Memory Decoding”：无任何延迟、吞吐或硬件数据；按其自有数字，总运算量为 Relay 的 2.49×、迭代数为 2.35×，且真实硬件基线 [24] 已无乘法器。摘要 “significantly outperforms BP and BP+OSD+CS-10”：BP 在电路级噪声下本就不是有意义的强基线（straw man），BP+OSD+CS-10 仅在 Gross 的 XZ 模式比较，表面积码一字未提。摘要 “accuracy comparable to or better than state-of-the-art Relay-BP, especially at higher physical error rates”：\\(p=3×10^-3\\) 处两区间 \\((7.15±0.5)×10^-6\\) 与 \\((7±1)×10^-6\\) 重叠，只能称持平；“especially at higher p”只由单点 \\(p=5×10^-3\\) 且无 CI 的点支撑。贡献列表 “outperforms Relay-BP on surface code and bivariate-bicycle code at higher noise levels” 被写成通用结论，实际仅 p≥0.003 的表面积码与单点 XYZ 成立。Sec. V-B “eliminates the need for ... node-level RNGs”：算法1 第9行仍对每个变量节点抽 \\(χ_j\\)∼Unif[α,β]、第12行每链抽 Bernoulli(ρ)，即每链 71,280 次随机抽样，只是把“每迭代”降为“每链”，并非消除；RSF 的随机分组还需额外 V 次抽样。正文“conquers non-converging behavior ... while retaining the simplest message-passing primitives”：实际叠加了符号翻转合并、链式先验混合、多解保留与加权 LLR 选择，已不是“最简原语”。结论 “with projected less hardware overhead” 中的 projected 无任何面积估计支撑。","citations":"必须核对：Müller et al. arXiv:2506.01779（Relay-BP）——\\((7±1)×10^-6\\) 的噪声模型、轮数、basis 与 chain 定义是否与本文一致，以及是否存在“同一 shot 数下”的可比数据；Maurer et al. arXiv:2510.21600（Gross code FPGA，4-bit 量化）——这才是真正的实时基线，应作为主对照而非浮点 Relay-BP；Maurya et al. arXiv:2511.21660；Chytas et al. arXiv:2501.05021——式(16)–(17) 是否忠实于其 soft sign-flip 定义；Leduc-Primeau et al., IEEE TCOM 60(8):2042, 2012——经典 RSF/RIS 的原始定义与被“增强”后的差异。Roffe et al., PRR 2:043423 (2020) 的 BP+OSD-CS-10 具体配置（OSD 阶数、组合扫描数、是否同迭代预算）；Bravyi et al., Nature 627:778 (2024) 的 Gross code 电路级噪声参数与 12 Bell-pair 协议。缺失且应补的基线：Higgott et al. 的 Ambiguity Clustering、BP+OSD-E/更高阶 OSD、Panteleev–Kalachev 的 BP、以及分簇/引导退火类量子 BP。Mem-BP 的引用归属也可疑：[33] 为 IEEE TQE 2025 表面积码 BP、[34] 为 Nachmani 2018 深度学习 BP，二者是否确为 Mem-BP 需核对。另需核对 qLDPC 包 [29] 与 Stim [30] 的版本、随机种子与可复现性。","questions":"1) 请分别给出两个码每个数据点的 shot 数、逻辑失败事件数、CI 方法与失败判据：k=12 时“任一逻辑算符失败”是否计为失败、LER 是否按逻辑比特归一？并解释 “1500 decoder chains” 如何能给出 \\((7.15±0.5)×10^-6\\) 这样 ±7% 的误差棒；“chain” 究竟指 RIS 试验、Relay legs 还是蒙特卡洛样本？（术语在 Sec. IV-B、图4 横轴与 Relay-BP-5 中含义不一致。）\n2) 按 Sec. V-A 的数字，qDither 每次 shot 总运算 222.9M 对 Relay 89.6M（2.49×），而 [24] 的硬件基线已用移位加替代乘法。请给出可比的实时判据：单位时间每逻辑比特吞吐、关键路径与时钟周期、VNU 面积、边存储与布线；2.6~5 条链是并行（面积×2.6）还是串行（最坏 500 迭代≈10 µs，逼近 12 µs 窗口）？仅凭“乘法少 98%”为何能推出延迟更低？\n3) 请统一算法规格：式(17) 与算法1 第16–19行为何不同（δ=1 时式(17) 只剩旧消息，是否会冻结消息？），随机分组的概率与 ρ 的关系是什么，分组为何未出现在算法1？以及“收集至多 5 个解并取加权 LLR 最小者”与算法1 第24行提前返回如何并存，其额外迭代与多解存储是否已计入 V-A 的成本？","basis":"通读全文文本（1–524 行，含摘要、Sec. I–VI 与参考文献列表）；重点核对 Sec. III 式(16)–(18) 与算法1 第1–29行、Sec. IV-A/IV-B 的实验设置、Sec. V-A 的操作计数与 Sec. V-B 的硬件映射论证，并逐项重算了 530ξ、2(N−1)V、2V·t 等数字。图表仅有文本提取版本，图2–图5 的坐标轴刻度在提取中已乱码（Type3 字体），故纵轴具体 LER 数值与误差棒无法读数核对；文中也确实不存在数值表。未获取 PDF 图像、未运行作者代码、未复现任何实验。"}},{"id":"arxiv-2611.06818","no":3,"topics":["解码器","纠错码"],"source":"arXiv","venue":"arXiv:2611.06818 [quant-ph]","published":"2026-11-04","title":"Linear-time erasure recovery for quantum expander codes","title_zh":"量子 expander 码的线性时间擦除恢复","authors":["Anirudh Krishna","Christopher A. Pattison"],"abstract":"Erasures are used to model faults at a subset of known locations in various platforms used to construct fault-tolerant quantum computers. Beyond the utility in erasure recovery, efficient decoders for erasures are useful to both understand error decoders and as a subroutine for error decoding. Classical expander codes, which belong to the family of low-density parity-check (LDPC) codes, can be equipped with the Peeling decoder which works in linear time. Our main result is the algorithm Small-Set-Peeling, a quantum generalization of the classical Peeling decoder for erasures, that applies to quantum expander codes (Tillich, Zémor, IEEE T-IT 2013; Leverrier, Tillich, Zémor, FOCS 2015). This decoder can correct up to $D-1$ erasures, where $D$ is the (design) distance of the code and, importantly, is the first decoder that is guaranteed to do so in linear time. Combining with the erasure-conversion algorithm Small-Set-Find (Krishna, Livni-Navon, Wootters, SODA 2024), our result also implies the existence of a novel graph-local linear-time decoder for Pauli errors.","importance":5,"importance_reason":"解码理论核心：线性时间、可证明的量子 expander 码擦除解码器。","summary":"给出 Small-Set-Peeling，把经典 expander 码的 Peeling 解码器推广到量子 expander 码：可在 \\(O(n)\\) 时间内纠正最多 \\(D-1\\) 个擦除，并由此得到图局部的线性时间 Pauli 解码器。","problem":"擦除模型描述已知位置的故障，高效擦除解码器也可作为一般错误解码的子程序；量子 expander 码缺少像经典 Peeling 那样有线性时间保证的解码器。","method":"构造 Small-Set-Peeling：经典 Peeling 的量子推广，适用于 quantum expander codes；证明其可纠正最多 D-1 个擦除；再与 Small-Set-Find 的 erasure-conversion 结合处理 Pauli 错误。","result":"首个保证在 \\(O(n)\\) 时间内纠正 \\(D-1\\) 个擦除的量子 expander 码解码器；结合 Small-Set-Find 后，隐含一个图局部的线性时间 Pauli 错误解码器。","contribution":"把经典 expander code 的 Peeling 解码器量子化，为量子 expander 码给出 \\(O(n)\\) 时间、可证明的擦除解码器，并连接到 Pauli 错误解码。","limitation":"结论针对 quantum expander codes 与擦除模型；摘要未给实际常数、实现复杂度与有限长度性能。","key_numbers":["D-1 erasures","O(n) time","graph-local Pauli decoder"],"url":"https://arxiv.org/abs/2611.06818","pdf_url":"https://arxiv.org/pdf/2611.06818","doi":"","review":{"verdict":  (GFlowNet) for quantum code design. It builds a code one group element at a time and learns to propose codes in proportion to a power of their score. We train it once on scores from earlier searches, freeze it, and let it propose lifted-product codes with 180 physical qubits, scored by their distances. Ranking ten of its draws per paid call, it finds more than twice as many new top-scoring codes (inequivalent to any it was trained on) as tuned parallel tempering, even when tempering starts from GFlowQEC's training codes. It finds more than three and a half times as many as a supervised screen ranking ten random candidates per call. When both rank a hundred, the screen beats GFlowQEC, and does best ranking GFlowQEC's draws. Soft Q-learning, which shares the GFlowNet's optimal policy, does as well at one noise bias and better at the other, so the gain does not depend on the GFlowNet's training loss. Trained proposers can make a budget of expensive evaluations go further when good codes are rare.","importance":4,"importance_reason":"把生成模型用于码搜索，直接影响 circuit-level 评估预算的分配。","summary":"把码设计建模成按分数幂次采样的生成过程；在 180 个物理比特的 lifted-product 码上，10 次抽样预算内找到的新高分码数量是平行回火的 2 倍以上、监督筛选的 3.5 倍以上。 其采样分布可写成 \\(P_\\theta(x)\\propto R(x)^\\beta\\)。","problem":"qLDPC 码空间巨大，circuit-level 评分很慢，一次搜索通常只能评估几百个候选，而好码非常稀少。","method":"GFlowNet 逐个 group element 构造码，学习按分数幂次提案；先在历史搜索分数上训练一次并冻结；对 180 物理比特的 lifted-product 码按 distance 评分。","result":"每次付费评估抽 10 个候选时，新高分码数量 >2× tuned parallel tempering、>3.5× supervised screen；两者都抽 \\(100\\) 个时监督筛选反超，且最适合从 GFlowQEC 的提案中选。","contribution":"把 GFlowNet 作为码搜索的 proposal distribution，在固定评估预算下提高好码命中率。","limitation":"主要按 distance 评分，未直接优化 circuit-level threshold；只展示 180 比特 lifted-product 码；100 draws 时优势反转。","key_numbers":["180 physical qubits",">2× vs tempering",">3.5× vs screen"],"url":"https://arxiv.org/abs/2611.06819","pdf_url":"https://arxiv.org/pdf/2611.06819","doi":"","review":{"verdict":"弱拒","confidence":"中高","correctness":"Eq. (7) 与 Sec. 4.2 的推导对奇数 d 不自洽：d=7 时最轻不可纠错误权重应为 \\(\\lceil d/2\\rceil=4\\)（失败概率约 \\(p^{4}\\)），文中却写 \\(p^{d/2}\\)；且退化码的失败指数还取决于解码器，故 Eq. (7) 实质只是 distance 的单调变换，而非真实的失败指数。Table 2 中 GFlowQEC 的 313/317 个 certified 码只有 221/222 个 inequivalent（约 29–30% 冗余），说明「新码」计数被等价类大量稀释；同时 Table 2 完全不报 k，与 Sec. 4.2 承认放弃 a2、b2 可逆条件后 k≥36 可变相矛盾，读者无法判断各方法是否在同一 (k,d) 前沿上比较。Sec. 7「Cost」自己承认按 exact ladder 的 CPU 秒计时优势消失（seeds 0–2 上不等价计数 PT 反而领先），这直接动摇了 Table 2 的核心量。Sec. 5.4 称 log pθ 排序「在零损失时」等价于按分数排序，但 Sec. 8 又自承「未测试是否按 reward 比例采样」，故 Eq. (6)/(8) 所定义的 GFlowNet 性质在实验中从未被检验。","weaknesses":"（1）成本模型不可辩护。一个 paid call 在 0.8 s（bound score）、约 10 s（uniform 的 exact ladder）到约 2 min（certified 码）之间浮动，却被等权计费；而认证是在 bound 达阈值时才触发，于是「提议越好像素→触发越多昂贵认证」被系统性算成免费。Sec. 7 明说 policy 触发 exact ladder 的频率是 tuned PT 的 3.5–4.2 倍，并称 exact ladder 主导单次调用成本；随后按 CPU 秒计算时两者持平、按 inequivalent 计数 PT 领先。这意味着 >2x / >3.5x 是计费方式的产物而非效率提升。同一现象在 µ 上暴露得更清楚：µ=100 时 supervised screen 反超，policy 只有 0.45/0.62 倍（Table 2 上下文），说明结论对「未计费的采样算力」极度敏感。（2）训练集泄漏与选择偏差。策略用 126,000 次 paid calls（116,972 个 canonical form，含 tuned PT seeds 0–2 的数据）离线训练后再评测，每 run 预算仅 1,000 次调用，训练成本按 0 计（Sec. 5.3 与 Limitations 自承）。Sec. 7「Origin of the codes」自承 policy 有 87–93% 的 top-scoring 邻域同时含有 stored top-scoring 码，即它主要在已见的好「半」（hi 或 gi）上做重组；而 novelty 过滤只去掉相同 canonical form 与图同构类，无法排除这种半结构记忆，故「inequivalent to any it was trained on」不等于泛化。缺少「只给 10%/50% stored forms」的学习曲线，无法区分优势来自方法还是数据量；PT-from-stored 是唯一获得同数据的基线，supervised screen 与 soft-Q 虽同数据但部署方式不同，训练数据这一维并未被控制在同等条件下。（3）统计显著性被夸大。top-scoring 阈值取 uniform reference 中 6/666 个样本的最高分（10.0），用 6 个样本估计分位点极不稳定；作者也承认 γ=0 时该阈值不区分方法，即 γ=±1 是能制造分离的工作点。Sec. 6.2 的 Katz log-ratio 区间把 1,000 次 paid call 当作独立样本（自承忽略种子间与链内相关），区间被系统性低估；又在 8 个基线、3 种部署设置、certified/inequivalent 多个计数口径之间做多重比较而无校正。Table 2 里 certified 计数 313/97≈3.2x 与 inequivalent 2.4x 的选择本身就能改变头条数字。10 seeds 且无功效分析，soft-Q 只以 1.01/1.15 倍「未分离」收场，实际就是打平。（4）基线不公平/不充分。tuned PT「在它自己的 runs 上取两个温度区间的较优者」（原文 a choice that favours it），这既是正向偏向也是事后调参、不可复现；8 条链、单 slot 均匀重抽的提议极弱，未报告是否调 move/swap 频率。MAP-Elites 只用 5 个 bin，QD 方法在如此粗的网格下基本失效。BO 用 one-hot + Matérn 5/2 GP，且明说「不是 Chengyu et al. 的方法」，而 Table 1 却标该工作 budget matched；最强先验（Chengyu BO、OmniQEC、Liu–Marquardt 等 LLM 搜索）以「预训练可能见过已发表码」为由完全不复现，使 state-of-the-art 主张没有锚点。PPO 与 Munchausen DQN 各只试两个熵权重即判负，属稻草人。seed 配对语义也未定义——不同算法的同一 seed 不构成共同随机数。（5）单一实例、可扩展性与 k 缺失。全文只有 n=180、单群 Z6×S3、单族 lifted product、10 seeds。没有不同 |G|、没有 600–1500 qubit（作者自己引用 [24] 已在该规模搜索）；n=180 时 exact SAT distance 已需约 2 min/码、0.7% 的 ladder 提前截断，n 增大时 exact distance 的可行性未讨论；方法要求预先存在 42 次搜索的 126k 打分数据，对新器件/新族如何 bootstrap 完全未讨论，也没有数据量–性能曲线。Sec. 8 自己说 180 qubits 上好码「不够稀有」（uniform 每 1,000 次也有约 10–12 个），即方法前提被自身数据否定，但摘要未提。","overclaim":"（1）标题与摘要首两句以 circuit-level 仿真（分钟到小时/码、一次搜索只能评几百个）为动机，随后全部实验使用 distance-only 的廉价 oracle，Limitations 又自承「未测 circuit-level 噪声是否会重排码序」——动机设定与实验不匹配，属偷换语境。（2）摘要「learns to propose codes in proportion to a power of their score」未被验证（Sec. 8 自承），且部署是取 log pθ 最高的 N 个（mode-seeking），恰好丢弃了 GFlowNet 赖以立论的比例采样与多样性优势，把它当 proposer 用则 GFlowNet 的理由消失。（3）「first GFlowNet for quantum code design」：实际只在一个固定构造族内搜 10 个群元素，没有新构造、新族或更优码，作者自承「没有找到比 BO/RL/LLM 更好的码」；应降级为「固定构造族内的 tuple 搜索」，而非 code design。（4）「more than twice as many new top-scoring codes ... as tuned PT」：top-scoring 只是达到 uniform 样本已有的阈值 (dX≥10, dZ≥7)，没有任何码超过该阈值，因此是「达到既有阈值的码更多」而非「新高分码」；按 CPU 秒无优势，按 µ=100 被 screen 反超。（5）「Soft Q-learning ... did as well ... so the gain does not depend on the GFlowNet's training loss」：把「目标函数无关紧要」包装为优点；若同网络 offline soft-Q 打平或更好，则标题宣称的 GFlowNet 贡献未建立，结论应改写为「offline 学到的密度 proposer + top-k 排序」。（6）Table 1 给本文标「Matched budget: yes」，但 126,000 次 paid calls 的训练成本与 6,770 个 certified 训练码均未计入，budget 并不 matched。","citations":"需核对：Bhardwaj et al. arXiv:2607.28795（mitten codes, Definition 4）的 n=5|G|、k=|G| 条件、「595 个中 123 个可逆」的计数，以及引言 [[300,60,14]] 与 |G|=60 的说法；引言「lists of that length give up to about \\(3×10^{8}\\) inequivalent codes」的群作用计数推导；Chengyu et al. arXiv:2601.18562（BO）的真实预算与 oracle，Table 1 将其标为 budget matched 却从未复现；Cruz-Benito arXiv:2606.02418、Liu–Marquardt arXiv:2606.24808、Yan et al. OmniQEC arXiv:2607.25865、Qian–Li arXiv:2608.08996 的 oracle 与可比性，「预训练污染」是否成立；Chen et al. arXiv:2606.12445（SAT ladder）对提前截断/下界的表述；Tiapkin et al. AISTATS 2024（GFlowNet = entropy-regularized RL）在树上的精确条件与对数形式；Chen et al. ICML 2026「Beyond the proxy」是否支持「只用 stored reward、无 reward model」的设定及其 plain baseline；Freire et al. arXiv:2501.09622「random walk 与 SA、RL 持平」；Bravyi et al. Nature 2024 与 Table 1 注释「allow only pairs with one entry zero」；Liang et al. PRX Quantum 2025「exhaustive catalogues 止于数百 qubit」；Menssen et al. arXiv:2607.21554 是否点名 generative neural networks 选码；Katz et al. 1978 区间在簇相关数据下的适用性；Panteleev–Kalachev 与 Lin–Pryadko 关于「任何 list 都给合法码」及 k=|G| 的陈述。","questions":"（1）若按每次 paid call 的真实 oracle 代价加权（bound 0.8 s、uniform exact 约 10 s、certified 约 2 min），或直接用总 wall-clock/总 ladder 时间，Table 2 的 2.4/2.8 与 3.6/3.8 还剩多少？请给出完整 10-seed 的 per-CPU-second 表（目前只有 seeds 0–2 且 inequivalent 计数下 PT 领先），并说明 policy 多触发 3.5–4.2 倍 exact ladder 是否正是其 per-paid-call 优势的来源。（2）各方法 top-scoring 码的 k 分布与 (dX,dZ) 分布是什么？既然 score 完全不含 rate/n、且已使 k≥36 可变，policy 的优势是否可能来自「以 k 换 d」？请给出各方法的 [[n,k,d]] 与 check weight 统计，并说明把 k 纳入 score 后结论是否保持。（3）用更大样本（如 \\(10^{5}\\) 次 uniform 抽样）重定义 top-scoring 阈值、并至少换一个群/族（|G|≠36）与不同规模的 stored forms（10%/50% 学习曲线）之后，>2x 是否成立？另外，既然部署取 top-N log pθ，为何仍把 GFlowNet 的比例采样算作贡献，能否报告 pθ 与 \\(R^β\\) 的比例性检验？","basis":"通读 arXiv:2611.06819v1 全文文本（第 1–804 行）：Abstract（含 µ=10/µ=100 反超的说明）、Sec. 1 Introduction 与 Table 1、Sec. 2 Related Work、Sec. 3 Background（Eq. 1–6、lifted product 与 mitten 构造）、Sec. 4 搜索空间与 oracle（Eq. 7、canonical form、SAT ladder、0.8 s/10 s/2 min 成本、阈值来自 6/666）、Sec. 5 GFlowQEC（Eq. 8–11、β=8 的固定规则、Sec. 5.3 的 126,000 calls/116,972 forms/6,770 certified/45 截断、Sec. 5.4 的 µN 部署与 top-N 排序及其事后选择）、Sec. 6 基线与度量（PT/screen/soft-Q/MAP-Elites/BO/uniform 的描述与 Katz 区间）、Sec. 7 结果与 Table 2（含 Against tuned PT / Against soft Q-learning / Against the supervised screen / Origin of the codes / Cost 各段）、Sec. 8 Discussion 与 Limitations、Sec. 9 Conclusion 与 Future work、参考文献表；未查看 PDF 图 1 的图形版式细节，未获取 Zenodo 长版与代码数据。"}},{"id":"arxiv-2611.07175","no":5,"topics":["编译与验证","芯片与耦合器"],"source":"arXiv","venue":"QCE 2026 · arXiv:2611.07175","published":"2026-11-04","title":"Scalable Transpilation for Overcoming Restricted Connectivity in Distributed Superconducting Quantum Architectures","title_zh":"分布式超导架构的可扩展转译：先划分，再路由","authors":["Afonso Azenha","Ilia Polian","Sebastian Brandhofer"],"abstract":"Distributed Quantum Computing (DQC) offers a promising pathway to scale superconducting quantum hardware, but restricted inter- and intra-module connectivity creates a major transpilation bottleneck. Current DQC transpilation methods often assume idealized hardware connectivity, ignore subsequent intra-module routing, or suffer from substantial computational overheads that limit their applicability at scale. To address this, we introduce a scalable transpilation method tailored for the restricted connectivity of distributed superconducting quantum architectures. Specifically, our quantum interaction graph (QIG) approach couples a graph-partitioning mapping step with a fast SABRE-inspired routing heuristic. On a 48-qubit (3 QPUs $\\times$ 16 qubits) architecture with all-to-all inter-core connectivity, our method reduces average aggregated costs by up to 24.72% (unstructured) and 24.01% (structured), while delivering >250$\\times$ speed-ups for structured workloads compared to the state-of-the-art DMapS algorithm. On the 399-qubit (3$\\times$133) IBM Flamingo, where DMapS times out on dense circuits, our approach maintains practical runtimes. Against a DQC-adapted SABRE baseline, it reduces structured circuit routing costs by up to 51.94% (all-to-all inter-core topology) and 51.96% (restricted line topology). Ultimately, this work delivers a practical transpilation method for DQC at scale.","importance":4,"importance_reason":"分布式超导编译与路由，直接对应线路编译问题。","summary":"QIG 划分 + SABRE 路由，在 48-qubit（3 模块）架构上把平均聚合成本降低约 24%，结构化负载相对 DMapS 加速 >250×；在 399-qubit IBM Flamingo 上仍能保持可运行时间。","problem":"分布式超导模块的模块间/模块内连接受限；现有 DQC 转译要么假设理想连接，要么忽略模块内路由，或计算开销过大。","method":"用 quantum interaction graph 做图划分映射，再接一个 SABRE-inspired 的快速路由启发式；覆盖 all-to-all 与受限 line 两种模块间拓扑。","result":"48-qubit 架构：成本降低 \\(24.72\\%\\)（非结构化）/\\(24.01\\%\\)（结构化），结构化负载 \\(>250\\times\\) 加速；\\(399\\)-qubit Flamingo 上 DMapS 超时，本方法仍可运行；相对 DQC-adapted SABRE，路由成本最多降 51.9%。","contribution":"把分布式模块划分和模块内路由放进同一个编译流程，给出可扩展到 399 比特的实用启发式。","limitation":"只报告编译成本/模拟，不是硬件实验；未包含噪声感知调度；Flamingo 只展示可运行，未给端到端保真度。","key_numbers":["48 qubits / 3 QPUs","399-qubit Flamingo","24.7% cost ↓",">250× speedup"],"url":"https://arxiv.org/abs/2611.07175","pdf_url":"https://arxiv.org/pdf/2611.07175","doi":"","review":{"verdict":"弱拒","confidence":"中高","correctness":"存在若干可核查的内部矛盾。其一，第 VI 节把 399 比特评测描述为“由 all-to-all 删除两条 remote link 得到 strict inter-core line topology”，但 Fig.1 及第 IV-B 脚注明确是每对 core 仅有一条容量为 1 ebit 的链路，3 核全连接只有 3 条无向链路，而 3 节点线形拓扑需 2 条，因此应删除 1 条；按原文删除 2 条会剩 1 条链路并使一个 core 完全孤立，“line topology”不成立（Table III 该列全部数据及 51.96% 结论因此需要复核）。其二，Table III 中 CLA(|E|=100) 的 structured 降幅在 all-to-all 与 line 两种拓扑下同为 −58.43%，QIG+CLA(|E|=100) 的 unstructured 降幅在两拓扑分别为 −52.62% 与 −134.55% 而 CLA(|E|=100) 同为 −52.62%，跨拓扑逐位重复到小数点后两位，疑似复制/填表错误。其三，51.94% 与 44.90% 并非同分母比较：DMapS 是 14/16 子集（脚注 d，HHL-385、QAOA-398 超时），QIG+CLA(|E|=100) 是 16/16 全集，而 QIG+Default SABRE 的 46.99% 与 DMapS 的 44.90% 已几乎不可区分，说明“质量超 SOTA”很可能只是子集差异而非真实改进；文中“166×”“525×”亦非直接测量，而是 Table III 中 0.331/0.002、1.051/0.002 两个几何均值比再相除得到的二阶量，误差会复合。其四，Eq.(4)(5) 中 α=9.0 的取值与作者自陈理由矛盾：正文说该罚项“directly reflects EPR overheads, where an inter-core SWAP consumes three EPR pairs”，在 \\(Cagg=(10·N_EPR+N_SWAP)\\) 口径下三对 EPR 应记为 30（至少 3），而 α=9、β=3.0 既无推导也无从量纲上对齐表 II/III 所用的成本函数，属于不可解释的经验常数。","weaknesses":"1) 基线不公平且优势主要来自实现语言：DMapS 运行在 Qiskit 0.39.2 的 Python 原型上，作者方法运行在 Qiskit 2.2.0 且“custom SABRE modifications implemented directly in Rust within Qiskit's compiled backend”；因此摘要的 \\(>250\\times\\)（Table II structured 252.574×）与结论的 525×（Table III 1.051×/0.002×）在很大程度上是 Python vs Rust 的差距，而非算法差距——同一算法族相对自家 Def. SABRE 仅 0.73–1.26×（Table III）。全文只有比值、没有绝对运行时间表，也没有做“把 DMapS/纯 Python SABRE 与 Rust SABRE 放在同一实现层”的对照消融，无法把 speedup 归因于算法。2) 超时协议前后不一致并直接污染头条数字：48 比特规定 1 h，却单独给 DMapS 的 Shor 电路 ≈2.0 h 例外（“mathematically necessary to establish a valid denominator”），而 pytket-dqc 在 structured 上 14/20 超时则被整组剔除、不享受同样豁免；Table II 的 252× 几何均值恰恰包含这条被放宽 2× 的样本，属选择性放宽。3) 评价指标不可审计、也未做敏感性分析：\\(Cagg=W_EPR·N_EPR+N_SWAP\\) 的两个原始分量被明确拒绝披露（“space constraints preclude reporting EPR pair and local SWAP counts individually”），同时又承认 48 比特上 Cagg“at times dominated by local SWAP insertions”，这意味着 24.72%/24.01% 可能在 EPR（DQC 中真正稀缺的资源）上并无改进；\\(W_EPR\\) 只取 10 一个点（依据仅 [10] 的“约一个数量级”），没有 {1,3,10,30,100} 的扫描，结论对权重完全不稳健。更严重的是成本模型漏项：远程门/门传态所需的本地 CZ、H、测量、经典前馈与延迟、EPR 生成速率与 heralding 概率、单链路串行化造成的关键路径延迟、以及多跳（line 拓扑 0↔2）操作所需的中转代价均未计入，因此“aggregated cost”既不是时间也不是保真度，不能支撑摘要的 practical/utility-scale 论述。4) “scalable”缺乏任何 scaling 证据：只评估 3 个 QPU、两个绝对规模（48、399），没有 runtime 与质量随比特数、门数、以及最关键的核心数 k 变化的曲线；k=3 时连通图只有三角形与线形两种，所谓 generalizability to heterogeneous networks 在 3 节点上几乎不可检验。而且作者的容量修正依赖“evaluate all block-to-core permutations”（3!=6），k 增大时是 k! 爆炸，这与题目中的 scalable 直接冲突且未讨论；QIG 只用全电路门频次、无时间切片，作者自己在第 VI-B-2 节观察到 399 比特随机电路出现“structural homogenization”使 QIG 退化为随机初始布局，说明该方法在大规模稠密电路上恰恰失效。5) 分布式量子计算的物理层面基本被抽象掉，且两条方法支路的计费口径不一致：SABRE 支路只做 inter-core SWAP 的启发式插入，“without explicitly scheduling EJPP processes or considering state teleportation”（仅列为 future work），即每个 remote SWAP 花 3 个 EPR，放弃了 DQC 最核心的 EJPP 摊销与态传态（2 EPR），而 pytket-dqc 支路被单 ebit 容量与 link-lock 严格约束（第 V-A 节自述重写了 link tracking），两者用不同开销口径却合并进同一个 Cagg 横向比较；这既低估了自家方法的可达上界，也使 Table II 中 pytket CE 的 33.05% 与本文 24.72% 的对比失去可比性。此外全文没有伪代码、没有 routed 电路的深度/估计保真度、也没有对 pseudo-sink 与 dummy gate 插入-删除的语义等价性验证，编译器论文缺少最基本的正确性检查。","overclaim":"以下表述超出证据：(a) 摘要与结论“delivers a practical transpilation method for DQC at scale”“computationally sustainable path for transpiling complex workloads onto emerging distributed hardware”——既无硬件执行、无保真度估计，也无时间模型，且方法本身不支持 EJPP/态传态（作者自认是 future work），谈不上 practical DQC 编译。(b) “\\(>250\\times\\) speed-ups … compared to the state-of-the-art DMapS”：这是对 Python/Qiskit 0.39.2 原型的比值，并且几何均值中含一条被放宽到 2 h 的样本；同时把“51.94% cost reduction”与“166×/525× speed-up”并列呈现，但前者的分母是作者自建的 DQC-adapted SABRE（其 conjoined coupling map、\\(W_EPR\\) 与 trial 选择准则均为作者定义），并非 SOTA；在同一 14 电路子集上 DMapS 已达 44.90%，差距远小于标题暗示的代际差距。(c) 摘要“reduces average aggregated costs by up to 24.72%”把“average（几何均值）”与“up to（单点最优）”混用，实际只有 QIG+CLA(|E|=20) 一个配置达到该值，而同表 QIG+Def. SABRE 在 48 比特为 −8.90%（劣于 DMapS），摘要未提这一失败区间。(d) “nearly 52% cost reductions … at utility scale”：utility scale 仅指 399 比特硬件规模，基准电路是 QFT/加法器/GHZ/VQE/QAOA/HamLib 等教科书或固定 ansatz 电路，并非 utility 级应用；且该数字依赖 |E|=100 这一 0.331× 慢配置与 line 拓扑的存疑构造。(e) “seamlessly adapt to heterogeneous topologies without requiring manual retuning”——3 核只有两种连通图，远不足以支撑 heterogeneous；同时 (1,10) 的 10:1 权重与 α/β 均按 16 比特方格手调，没有任何跨拓扑不变的证据。(f) “This stark discrepancy makes the efficient use of EPR pairs an absolute necessity”——文中却始终不单独报告 EPR 计数，论证与实验相互拆台。","citations":"需核对：(1) [30] DMapS（Luo et al., IEEE TCAD 2025）——官方实现是否必须锁死 Qiskit 0.39、MultiModeRouting 的启发式参数/迭代上限是否按原文默认值运行、是否有新版或更快后端；这决定 250×–525× 是否成立。(2) [27] Andres-Martinez et al., pytket-dqc（QST 2024）——link-lock 与单 ebit 容量是否为其默认行为、作者对 PartitioningHeterogeneous 与 distributed circuit generation 的 source modifications 是否改变了其目标函数（否则 Table II 的 CE/PH 行不是原工具性能）。(3) [10] Heya et al., PRL 135, 200801 (2025)——远程 CNOT 与本地门保真度“约一个数量级”的差距是否可外推到链路数量、距离与 399 比特场景，因为 \\(W_EPR=10\\) 与 (1,10) 加权全部建立在它之上。(4) [19] Zou et al., LightSABRE——relative scoring/差分 ΔH 的引用是否准确对应 Eq.(4)。(5) [15]–[17] Murali/Niu/Ferrari 的 noise-aware 距离矩阵加权与本文 (1,10) SABRE 的实质差异，用以判定新颖性。(6) [21] Baker et al. FGP-rOEE（time-sliced）、[23] MHSA、[24] Bandic QUBO、[22] AutoComm、[25] Wu et al.——作者以“只做 mapping 不做 routing”为由不作实验对比，但至少 [21]/[24] 可在 48 比特上直接跑通并作为第三类基线，缺此对比则“state-of-the-art”范围被人为缩小。(7) [37][38] IBM Flamingo / Heron r1——3×133 的真实互连是否为 all-to-all，以及“删除两条 link 得线形”的硬件依据（见 correctness）。(8) [13] Schär et al. arXiv:2604.15971 与 [42] HamLib 的编号/年份需核实。","questions":"1) 请在相同实现层（同为 Rust/Qiskit 2.2.0 后端，或同为 Python）给出 DMapS、Default SABRE 与 QIG+CLA 的绝对运行时间（秒）与加速比，并说明 Shor 电路被放宽到 2 h 对 252× 几何均值的具体贡献；同时给出 Table II/III 中 \\(N_EPR\\) 与 \\(N_SWAP\\) 的原始计数，以及 \\(W_EPR\\) ∈ {1,3,10,30,100} 时各结论是否保持。2) 399 比特 line 拓扑究竟是删除一条还是两条 remote link？若为 3 节点线形，core0 与 core2 之间的门如何实现（需要几次 EPR、是否占用中间 core 的链路、如何在 Cagg 中计价），以及为何 CLA(|E|=100) 在两个拓扑下 structured 降幅恰好都是 −58.43%。3) 能否在 DMapS 完成的同一 14 电路公共子集上重报 QIG+CLA(|E|=100) 的降幅与 QIG+Default SABRE 的降幅，并做 5 seed 的置信区间/显著性检验？若差距在公共子集上不显著，本文的核心贡献是否应改写为“在保持相近质量下把编译时间降低若干数量级”，而不是“质量超越 SOTA”？另建议补充 k=4/6 核与不同核规模的 scaling 实验以支撑标题中的 scalable。","basis":"已通读全文 754 行文本：标题/作者/摘要、第 I 节引言、第 II 节相关工作、第 III 节背景（SABRE 与 F 层/E 集代价 Eq.(1)）、第 IV 节三项 DQC 适配（conjoined coupling map、Fig.1、Table I 层级边权、(1,10) SABRE、Cagg Eq.(2)、CLA-SABRE Eq.(3)–(5)、α=9.0/β=3.0、|E|=20/100）、第 V 节 hypergraph 与 QIG+KaHyPar 划分及容量/边界后处理、第 VI 节实验设置（AMD Ryzen 7 PRO 6850U/26 GB、Ubuntu 24.04、Qiskit 0.39.2 vs 2.2.0、KaHyPar 1.3.2、1 h/3 h 超时、5 seeds、CZ-fraction 与 20/16 条 structured 电路）、Table II、Table III（含脚注 a–d）、Fig.2/Fig.3 及其 caption、第 VII 节结论与 future work、参考文献 [1]–[44]。未获取到的证据：作者 GitHub 代码（URL 在文本中被断为 “scalable dqc transpilation”，无法直接确认补丁内容）、PDF 图中柱状图的逐点数值，以及 DMapS 与 pytket-dqc 的原始论文内部实现细节。"}},{"id":"arxiv-2604.16292","no":6,"topics":["容错实验"],"source":"PRX","venue":"Phys. Rev. X · arXiv:2604.16292（APS DOI 页面截稿时未上线）","published":"2026-11-05","title":"Fast, High-Fidelity Erasure Detection of Dual-Rail Qubits with Symmetrically Coupled Readout","title_zh":"双轨量子比特的快速高保真擦除检测","authors":["Jimmy Shih-Chun Hung","Arbel Haim","Mouktik Raha","Gihwan Kim","Ziwen Huang","Ming-Han Chou","等 17 人"],"abstract":"Erasure qubits are a promising platform for implementing hardware-efficient quantum error correction. Realizing the error-correction advantages of this encoding requires frequent mid-circuit erasure checks that are fast, high-fidelity, and scalable. Here, we realize erasure detection with a hardware-efficient circuit consisting of a single readout resonator dispersively and symmetrically coupled to both transmons of a dual-rail qubit. We use this circuit to demonstrate single-shot erasure detection in 384 ns with minimal impact on the dual-rail logical manifold, achieving a residual error per check of $6.0(2) \\times 10^{-4}$, with only $8(3) \\times 10^{-5}$ induced dephasing per check, and an erasure error per check of $2.54(1)\\times 10^{-2}$. The high degree of matched dispersive readout coupling ($χ$-matching) within the dual-rail qubit code space also allows us to realize a new modality: time-continuous erasure detection performed in parallel with single-qubit gates. Here we achieve a median $7.2 \\times 10^{-5}$ error per gate with $< 1 \\times 10^{-5}$ error induced by erasure detection. This demonstrates a reduction in erasure detection overhead as well as a crucial ingredient for soft information quantum error correction. Together, these results establish symmetrically coupled dispersive readout as a fast, hardware-efficient, and scalable component for erasure-based quantum error correction using transmon dual-rail qubits.","importance":5,"importance_reason":"完整的 FT 实验指标：384 ns、残余错误与连续检测。","summary":"单个读出谐振腔对称耦合双轨的两个 transmon，实现 384 ns 单次擦除检测；每次检查残余错误 \\(6.0(2)×10^{-4}\\)、诱导退相干 \\(8(3)×10^{-5}\\)，并可与单比特门并行做连续检测。","problem":"擦除编码需要频繁的 mid-circuit 擦除检查，必须同时做到快、高保真、可扩展，且不能破坏双轨逻辑流形。","method":"双轨 transmon；一个读出谐振腔对称、色散地耦合两个 transmon；利用 χ-matching；实现单次与时间连续两种擦除检测。","result":"单次检测 \\(384\\,\\mathrm{ns}\\)；残余错误/检查 \\(6.0(2)\\times10^{-4}\\)；诱导退相干/检查 \\(8(3)\\times10^{-5}\\)；擦除错误/检查 \\(2.54(1)\\times10^{-2}\\)；与单比特门并行时，门错误中位数 \\(7.2\\times10^{-5}\\)，检测诱导错误 \\(<1\\times10^{-5}\\)。","contribution":"用单个对称耦合读出腔实现 384 ns 擦除检测，并给出连续检测与门并行运行的实验指标。","limitation":"单器件演示；每次检查 2.54% 的擦除错误仍不低；阵列扩展与长期稳定性未展示。","key_numbers":["384 ns","6.0(2)×10⁻⁴ residual","2.54(1)×10⁻² erasure","<1×10⁻⁵ induced"],"url":"https://arxiv.org/abs/2604.16292","pdf_url":"https://arxiv.org/pdf/2604.16292","doi":"10.1103/54jp-hwdd","review":{"verdict":"大修","confidence":"中高","correctness":"核心数字内部大体自洽：由 Fig.3(d)(e) 得 \\(p1=2.8(1)×10^-4\\)、\\(p2=2.2(3)×10^-4\\)，pϕ\\(=p2−p1/2=8(3)×10^-5\\)，与摘要/结论一致；\\(2.54(1)×10^-2/6.0(2)×10^-4=42.3\\) 与正文 bias 42(1) 吻合；SNR=11.6→εsep=0.8%、SNR=16.1→0.23% 也与 εsep=[1−erf(√SNR/2)]/2 一致（正文公式的根号在 txt 提取中丢失，不算作者错误）。但 Table I 五项相加为 \\(4.88×10^-4\\)，仅占 \\(6.0(2)×10^-4\\) 的 81%，作者自认约 20% 未解释，却仍把 \\(6.0(2)×10^-4\\) 当作带 (2) 精度的结论；Table I 完全没有假阴性擦除通道，而 0.8% \\(FN×2.54×10^-2\\)≈\\(2×10^-4/check\\) 恰好与未解释的 \\(~1.2×10^-4\\) 同量级。Fig.9(a,b) 的 18 天中位数（擦除 \\(3.5×10^-2/3.9×10^-2\\)、残余 \\(5.3×10^-4/8.3×10^-4\\)）与正文 \\(2.54(1)×10^-2/6.0(2)×10^-4\\) 不一致，且 “all checks” 的残余 \\(8.3×10^-4\\) 反而大于 “common checks” 的 \\(5.3×10^-4\\)，与正文 “加入 interleaved 判据后残余降到 \\(5.4(2)×10^-4\\)” 的单调顺序相反。§III 的 384 ns 只是方波驱动长度，匹配滤波积分窗实为 496 ns（其中 112 ns≈8.7/κ 为 SRO 余振），Table I 的空闲项也是按 Tm≈0.50 µs 算的（由 \\(Tm/3T1=7.7×10^-5\\)、T1=2176 µs 反推），连续模式又改用 480 ns 窗，三个时长在摘要/正文中混用。","weaknesses":"1) “384 ns” 的定义与误差预算口径不自洽，且决定性的空闲项可能被低估。§III 明确 384 ns 只是探针脉冲，实际积分窗 496 ns；附录 D 却写 496 ns 窗对应 “∼5.5/κ”，而 κ/2π=12.4 MHz 给出 1/κ≈12.83 ns，496 ns 实为 ≈39/κ（112 ns 才是 8.7/κ），同一段内 κ 标度差 7 倍。更要紧的是 ILRB 说“每 5 个 Clifford 插一个共同 check（每 2.8 µs）”，但按文中 2×X90/Clifford、X90=24 ns 计算，5 个 Clifford+一个 496 ns check 只有 ≈0.74 µs，与 2.8 µs 差 ~2 µs；若这 2 µs 是真实死时间，则 \\(Tm/3T1=7.7×10^-5\\)、Tm/3Tϕ\\(=1.11×10^-4\\) 这两项会被低估 4–5 倍，Table I 的 \\(4.9×10^-4\\) 与 \\(6.0×10^-4\\) 的“80% 已解释”就不成立。作者必须给出一个明确的时间预算：脉冲 384 ns、滤波 496 ns、check 内 X 门、check 间等待、以及 2.8 µs 的构成。2) 统计置信度不可核验，且 (1)/(2) 的精度与本文自己的漂移数据矛盾。全文没有报告任何 shot 数、随机序列条数、后选择后样本量或误差棒来源（Table II 的 779/5526 是重复测量次数，不是 shots）。p1、p2 是在固定 49.92 µs 演化时间内插 0–80 个 check 得到的：由 p1 算得 80 个 check 的总信号仅 \\((1−2.8×10^-4)^{80}\\)≈0.978，p2 为 0.983，而 Fig.3(e) 还先升后降，作者只对“tail”拟合到 0 的单指数，模型依赖很强（若把 49.92 µs 内的空闲退相与 check 数耦合进去，p2 的物理解释会变）。\\(6.0(2)×10^-4\\) 是 1 h 的 ILRB 平均、\\(2.54(1)×10^-2\\) 相对精度 0.4%，但 Fig.4(b,c) 显示 \\(T_erasure\\) 在 48 h 内成倍涨落、Fig.9 的 18 天中位数偏差 20–40%，所以 (2) 与 (1) 只能当统计拟合误差，不能当总不确定度；至少应给出自助法/多时段重测的置信区间，并把 \\(6.0×10^-4\\) 报成 \\(6.0(6)×10^-4\\) 量级。3) “residual error per check” 的定义含后选择漏洞，不能直接当作 QEC 可用的每 check 错误率。ILRB 同时在共同 check、interleaved check 与末态 “symmetrized readout” 上后选择（Fig.2d），末态逻辑读出会把漏检（假阴性）擦除的 shot 当作“不在逻辑子空间”剔除，于是 0.8% 的假阴性擦除不计入 \\(6×10^-4\\)；而这类事件的量级 \\(2.54×10^-2×0.8%\\)≈\\(2×10^-4\\) 与 Table I 未解释的 \\(1.2×10^-4\\) 相当。真实码里不能对数据比特末态做后选择，因此 \\(6.0×10^-4\\) 不是码内每 check 的残余错误；bias 42 也因此依赖定义（若只取 “induced” 的约 \\(1.2×10^-4\\)，bias 会变成 ~210）。此外 \\(1.8×10^-4\\) 的回波脉冲误差（占预算 30%）被算入测量却又在结论里被说成“可由 stabilizer 电路吸收、不必为 check 专门加”，等于把 check 自身需要的一项成本从 check 成本里划出去。4) 单次检测与连续检测并非同条件对比，且连续模式对逻辑流形的影响被摘要单边化。两者虽在同一器件、同一探针频率与幅度（§V），但单次用 496 ns 匹配滤波、SNR=11.6、εsep=0.8%，连续用 480 ns 盒式积分、SNR=16.1、εsep=0.23%，且单次 check 内含 X 回波而连续模式没有；连续模式每 480 ns 判决一次，假阳性沿整条序列累积（300 Cliffords≈30 个窗），后选择比例与单次完全不同。Fig.5(b) 标 “Erasure error per X90 = \\(2.34(2)×10^-2\\)”，而正文与 Fig.5(f) 给的是 \\(1.8×10^-3→2.6×10^-3\\) per X90，差约 10 倍，几乎可以肯定是 per-Clifford/per-window/per-X90 归一化错配，必须更正。更重要的是，连续模式把每 X90 的擦除错误从 \\(1.8×10^-3\\) 抬到 \\(2.6×10^-3\\)（\\(+8×10^-4\\)，来自读出导致的 \\(T_erasure\\) 减半），这是摘要 “\\(<1×10^-5\\) error induced by erasure detection” 的 80 倍；若按总错误计，诱导误差并非 \\(<1×10^-5\\)，只是被擦除通道便宜这一点掩盖了。另外连续探针带来的 ac Stark 频移下 X90 是否重标定、门期间探针与门驱动的相互泄漏、以及 100% 占空比对 TWPA/馈线的影响，均未说明。5) 与已有 erasure detection/dual-rail readout 的定量对比严重不足，机制叙述还与器件参数矛盾。引言只用一句 “hardware overhead, long detection time, or significant errors” 概括 [6,7,9,11,12]，没有表格比较检测时间、FP/FN、每 check 擦除错误、残余错误、bias、是否需 ancilla、是否需 flux 重调；本文 \\(2.54×10^-2\\) 的每 check 擦除错误与 ~0.8% 的误分类并不明显优于腔双轨方案 [8,9,12]。§IV 称读出使 \\(T_erasure\\) 减半并与 \\(2.54×10^-2\\) “一致”，但 496 ns/24.4 µs≈2.0% 加上 ~0.4–0.8% 假阳性已能解释 \\(2.54×10^-2\\)；若真按 Fig.4 的 2 倍退化（\\(T_erasure\\)≈12 µs）应得 ≈\\(4.5×10^-2\\)，两者不能同时成立。机制上 χ/2π=−4.25 MHz、κ/2π=12.4 MHz 给出 2|χ|/κ≈0.69，远不满足附录 B 反复使用的 |χ|≫κ/2 分辨极限，selective darkening 抑制因子只有 \\((κ/2χ)^{2}\\)≈2.1；式(4) 的最优失谐 √\\(((κ/2)^{2}+χ^{2})\\)≈7.5 MHz 也与“探针共振于 |gg⟩”（≈4.25 MHz）不符。更关键的是缺少对照：χ-matching 的理论预测是 pϕ\\(<1×10^-6\\)，实测 \\(8(3)×10^-5\\) 高出 80 倍且只有 2.6σ，等于被别的退相干背景主导；作者没有在故意失配的工作点（如 Fig.2a 中 χDR/2π=12.2 kHz 的 4.6 GHz）重测 pϕ 以证明退相确实按 \\(χDR^{2}\\) 增长，因此“χ-matching 抑制退相”只是断言而非证明。扩展性方面：全文只有 1 个器件、1 对 transmon，没有 \\(g_RT1/g_RT2\\) 失配在晶圆上的分布数据（而 χDR 的零点位置正是靠这种失配+Δ* 抵消出来的），没有多 SRO 之间的串扰、没有 always-on 多探针对 TWPA 动态范围/频率拥挤的分析，也没有任何双比特门；χ-matching 点还要对每个器件做 600 MHz 扫描+光子数标定+Ramsey（附录 C），且 Fig.2a 的模型与数据存在零点偏移，设计并不可预测。","overclaim":"摘要与结论的 “scalable” 出现两次，并称 “establish symmetrically coupled dispersive readout as a fast, hardware-efficient, and scalable component”，但证据是单器件、单 qubit 对、无良率/失配统计、无双比特门、无串扰数据，且每个器件的 χ-matched 点需重新扫描标定，模型还不能预测零点位置。“state-of-the-art total residual error” 没有对比表，且本文 \\(6×10^-4\\) 的定义包含 496 ns 空闲与回波脉冲，与文献口径不同，无法直接称 state-of-the-art。“the residual error of the erasure check approaches that of single-qubit gates”：\\(6.0×10^-4\\) 对 \\(9×10^-5\\)（Table II）\\(/7.2×10^-5\\)（Fig.5f）是 7–8 倍，即使按每 Clifford（2 个 X90≈\\(1.8×10^-4\\)）也是 3 倍以上，“approaches” 不成立；若想按单位时间比较则应明确写出口径。“only \\(8(3)×10^-5\\) induced dephasing per check”：\\(8×10^-5\\) 是 \\(p2=2.2(3)×10^-4\\) 减去 p1/2 的差值（约 2.6σ），作者自己说理论值 \\(<1×10^-6\\)、实测被 TLS 等非读出机制主导，正确写法是 pϕ\\(<1.4×10^-4\\) (95% CL) 的上限；摘要却把它当成 check 的退相指标，而 check 的总退相其实是 \\(2.2(3)×10^-4\\)，读者会低估 2.75 倍。“\\(<1×10^-5\\) error induced by erasure detection”：这是 5 天 CDF 中位数 \\(7.2×10^-5\\) 与 \\(6.5×10^-5\\) 之差，未给差值置信区间，两分布尾部还系统性不同；同时同一段正文承认擦除错误从 \\(1.8×10^-3\\) 升到 \\(2.6×10^-3\\)，即诱导的总错误是 \\(8×10^-4\\) 量级，摘要的 “\\(<1×10^-5\\)” 只对残余通道成立，属于单边陈述。“continuous erasure detection in the strong measurement limit” 与 “a new modality”：连续模式实际是 480 ns 盒式积分+阈值二分类，时间分辨率 480 ns，并非弱连续测量；与 [13] 的原始提案、[33] 的 check 频率优化、以及已有的 always-on/monitored readout 工作的界限没有划清。“provides a path to more efficient soft information QEC”/“crucial ingredient for soft information QEC”：只展示了记录轨迹（Fig.5e），没有任何解码器或软信息增益的量化。“The SRO thus serves as a compact multi-purpose element for erasure detection, logical readout, and leakage detection”：逻辑读出并未演示（如何破坏 χ-matching 以区分 |0L⟩/|1L⟩ 在正文与附录中都没有描述，只在结论里提出用 flux 动态失谐或 |1L⟩→|11⟩ 映射），泄漏检测也只在故意过驱动的情况下演示（Fig.8），属于未兑现的功能清单。“eliminates the need for an ancillary transmon … a significant saving for multiplexed architectures”：没有给出任何线路/面积预算，且 SRO 仍需自己的 Purcell 滤波器与馈线，逻辑读出还要 flux 线，SRO 也不能同时做擦除检测与逻辑读出。“The probe frequency is chosen to match the resonator frequency when the dual-rail qubit is in state |gg⟩ to minimize readout induced-dephasing”：与式(3)(4) 给出的最优失谐 √\\(((κ/2)^{2}+χ^{2})\\)≈7.5 MHz 不一致（实际约 4.25 MHz），且该工作点下逻辑态的腔内光子数仍有 |gg⟩ 态的 ~35%，谈不上 selective darkening。","citations":"需核对：[6] Levine et al., PRX 14, 011051 (2024) —— 其 erasure check 的检测时间、残余/擦除错误、是否需要 ancilla、是否已有同量级 χ-matching 读出；本文 “state-of-the-art” 与 “approaches single-qubit gates” 都要以它为准。[13] Kubica, Haim, Vaknin, Levine, Brandão, Retzker, PRX 13, 041022 (2023) —— SRO 方案与 Δ* 修正、selective darkening 的原始推导；本文自称 “proposed in Ref. 13”，新颖性应限定在实现与连续模式，需核对该文是否已预估 χDR 零点、pϕ 与 \\(6×10^-4\\) 量级。[7] Huang et al., Nat. Phys. 22, 591 (2026)（双轨多比特纠缠，CZ~200 ns 的依据）；[9] Koottandavida et al., PRL 132, 180601 (2024)；[12] de Graaf et al., npj Quantum Inf. 11 (2025)（joint-photon-number-splitting 的 mid-circuit check）；[8] Chou et al., Nat. Phys. 20, 1454 (2024)；[10] Mehta et al., arXiv:2503.10935 —— 这五篇需给出同一口径（检测时间、FP/FN、每 check 擦除/残余错误、bias、ancilla 需求）的横向表格。[33] Gu, Vaknin, Retzker, Kubica, PRX Quantum 6, 040354 (2025) 与 [34] Chang et al., PRX Quantum 6, 040355 (2025) —— “surface code with imperfect erasure checks” 对每 check 残余错误、假阴性、泄漏的具体要求，用来检验 bias 42 与 \\(6×10^-4\\) 是否真的“relevant for fault-tolerant QC”；本文只把 [33] 当作连续检测好处的支撑，回避了 [34] 的约束。[11] Liu et al., arXiv:2601.11086 (fluxonium erasure) 的对应指标。[4] Ma et al., Nature 622, 279 (2023) —— ILRB 适配擦除编码的具体做法是否如文中所述。[28] Thorbeck et al., PRL 132, 090602 (2024) 与 [30] Huang et al., arXiv:2603.13857 —— 读出诱导 T1 退化的定量结论，用以判断本文 Fig.4 的“2 倍退化”是否与之一致、以及为何与 \\(2.54×10^-2\\) 对不上。[44] Bultink et al., APL 112, 092601 (2018) —— ηeff/ηideal=25(1)% 的提取是否适用于本文的 phase-preserving TWPA 链路。[21–24] MIST/ionization 文献用于 0.8% 误分类与过驱动泄漏的解释是否成立。[14–16] 谐振腔 reset 方案用于“可进一步缩短”的可行性。还需核对是否已有 continuous/always-on erasure monitoring 的先行工作（腔双轨或中性原子），否则 “new modality” 的措辞需要收敛；以及 [40,41] 大失谐读出是否真能降低本文的诱导 bit-flip。","questions":"1) 请给出 \\(6.0(2)×10^-4\\)、\\(2.54(1)×10^-2\\)、\\(2.8(1)×10^-4\\)、\\(2.2(3)×10^-4\\) 的 shot 数、随机序列数、后选择后样本量与置信区间（含拟合模型系统误差），并解释 Fig.9(a,b) 的 18 天中位数（擦除 \\(3.5×10^-2/3.9×10^-2\\)、残余 \\(5.3×10^-4/8.3×10^-4\\)）为何与正文 \\(2.54×10^-2/6.0×10^-4\\) 不符，且 “all checks” 的残余（\\(8.3×10^-4\\)）反而大于 “common checks”（\\(5.3×10^-4\\)），与正文 \\(5.4×10^-4\\) 的改善顺序相反：这是漂移、不同统计口径，还是图注/数值错配？2) 请澄清 “384 ns” 与 496 ns（以及连续模式 480 ns）的关系，并说明 Table I 是否用 Tm=496 ns；ILRB 的 “每 5 个 Clifford 一次共同 check（每 2.8 µs）” 与 5×48 ns+496 ns≈0.74 µs 的算术不符，多出的约 2 µs 是什么？若存在额外死时间，空闲项会被低估多少？另外 Table I 为何没有假阴性擦除项？末态 “symmetrized readout” 的具体实现（如何区分 |0L⟩/|1L⟩）在正文与附录均未描述，而该后选择是否把漏检擦除的 shot 剔除，从而系统性地压低 \\(6×10^-4\\) 与抬高 bias 42？3) 请补一个机制对照与一个同口径比较：在故意失配的工作点（如 Fig.2a 中 χDR/2π=12.2 kHz 处）用同样方法测 pϕ，证明退相确实按 \\(χDR^{2}\\) 增长；否则实测 \\(8×10^-5\\) 与理论 \\(<1×10^-6\\) 相差 80 倍、仅 2.6σ，无法支撑 “χ-matching 抑制退相” 的因果结论。同时请给出与 [6,7,9,12] 在检测时间、FP/FN、每 check 擦除/残余错误、bias、ancilla 需求上的对照表，并说明连续模式在 N 个 SRO 同时 always-on 时的 TWPA 动态范围、频率拥挤与相邻比特串扰预算，以及连续探针（ac Stark 频移下）是否重标定过 X90。","basis":"通读 arXiv 全文文本（共 1298 行）：标题/摘要、I–VI 节、Table I（残余误差预算）与 Table II（器件参数）、Fig.1–9 的图注与正文讨论、附录 A（器件与参数）、B（χDR 诱导退相与 selective darkening 的式(B1)–(B11)）、C（色散位移与光子数标定）、D（读出脉冲/积分窗/MIST 与分类）、E（ILRB 细节，含 0.89% 假阴性与 2.54% 的算例）、F（诱导误差模型与 pϕ=p2−p1/2）、G（T_erasure 涨落与 TLS 关联）、H（泄漏检测与阈值扫描）、I（稳定性与 18 天监测），以及参考文献 [1]–[51]。对关键数字做了独立算术核对：Table I 求和 4.88×10^-4 与 81%；bias 2.54×10^-2/6.0×10^-4=42.3；由 Tm/3T1=7.7×10^-5 反推 Tm≈0.50 µs；496 ns×κ/2π=12.4 MHz 得 ≈39/κ 与 112 ns=8.7/κ 的对照；2|χ|/κ=0.69、(κ/2χ)^2=2.13、√((κ/2)^2+χ^2)=7.5 MHz；SNR=11.6→εsep 与 16.1→0.23%（确认根号在 txt 提取中丢失，作者公式本身正确）；496 ns/24.4 µs≈2.0% 与 2.54×10^-2 的比较。未查看 PDF 图形本身，Fig.1–9 的坐标与数值均以 txt 提取文本为准；未获取原始数据、代码或补充材料，未复现任何实验。"}},{"id":"arxiv-2611.05627","no":7,"topics":["芯片与耦合器"],"source":"arXiv","venue":"arXiv:2611.05627 [quant-ph]","published":"2026-11-03","title":"Tensor-network simulation of strongly coupled multi-fluxonium circuits","title_zh":"强耦合多 fluxonium 电路的张量网络频谱仿真","authors":["Christian Hensel","Andrés N. Cáliz","Pau Torrente","María Hita-Pérez","Arnau Riera"],"abstract":"Designing a superconducting quantum processor rests on predicting the low-lying spectrum of its coupled circuit. The Hilbert-space dimension of the circuit's lumped-element model grows exponentially with the number of circuit nodes. The usual methods split the circuit into subsystems, but that split is hard to choose when the elements are strongly coupled. We present a tensor-network method that chooses no subsystems and whose memory and run time per solve are set by the number of modes and two truncations, the Fock cutoff of each normal mode and the bond dimension of a matrix product state (MPS), not by the Hilbert-space dimension. From the capacitance matrix, the inverse-inductance matrix and the junction list alone, the linear circuit is diagonalized into normal modes. Each junction cosine is then a sum of two products of single-mode operators, so the complete lumped-element Hamiltonian is a matrix product operator (MPO) of small bond dimension with one site per mode, solved by the density matrix renormalization group (DMRG). The normal modes make the method generic, and the tensor network makes it affordable. For two fluxonia joined by a tunable coupler, the method agrees with exact diagonalization of the same truncated space to within 1 MHz. Our circuit of three fluxonia joined by two couplers has 11 normal modes and a truncated space of $10^9$ states, out of reach of exact diagonalization in dense or sparse storage. At a bond dimension of 32, its lowest eight levels are converged to within 1 MHz in both truncations, and each state is stored in a small fraction of the numbers a dense vector needs. One solve at that bond dimension takes 81 min and 1.3 GB of memory on one CPU node.","importance":4,"importance_reason":"芯片级低能谱仿真，直接对应电路量子化。","summary":"从电容矩阵、逆电感矩阵和结列表直接构造正常模式 MPO，用 DMRG 求低能谱；三 fluxonium / 11 个正常模式 / \\(10^{9}\\) 截断空间，最低 8 个能级在 1 MHz 内收敛，单次 81 min、1.3 GB。","problem":"芯片设计需要预测耦合电路的低能谱；Hilbert 空间随节点数指数增长，强耦合时把电路拆成子系统又很难选。","method":"从电容/逆电感/结列表得到正常模式；把每个结的 cosine 写成两个单模算符乘积，从而构造小 bond dimension 的 MPO；用 DMRG 求低能谱，只保留 Fock cutoff 与 bond dimension 两个截断。 其等效 Hamiltonian 可写为 $$H=\\sum_k \\omega_k a_k^\\dagger a_k-\\sum_j E_{J,j}\\cos\\!\\Big(\\sum_k \\varphi_{jk}(a_k+a_k^\\dagger)\\Big).$$","result":"两个 fluxonium + 可调 coupler 与同截断空间的精确对角化在 \\(1\\,\\mathrm{MHz}\\) 内一致；三个 fluxonium + 两个 coupler 有 11 个模式、\\(10^{9}\\) 截断态；bond dimension 32 时最低 8 个能级在两种截断下均收敛到 \\(1\\,\\mathrm{MHz}\\) 内，单次 \\(81\\,\\mathrm{min}\\) / \\(1.3\\,\\mathrm{GB}\\)（单 CPU 节点）。","contribution":"用 normal-mode + MPO + DMRG 绕开子系统拆分，把三 fluxonium / \\(10^{9}\\) 态的低能谱压到可计算规模。","limitation":"只求低能谱；三 fluxonium 演示；单次 81 min，尚未覆盖控制/读出/损耗。","key_numbers":["11 normal modes","10⁹ truncated states","1 MHz","81 min / 1.3 GB"],"url":"https://arxiv.org/abs/2611.05627","pdf_url":"https://arxiv.org/pdf/2611.05627","doi":"","review":{"verdict":"大修","confidence":"中高","correctness":"方法推导（式(1)–(6)）本身自洽、可复核：按表IV 参数抽查表V，两 fluxonia 的 qubit 模对 ω=6.804/6.807 GHz 与 Ω=2.607/2.598 GHz 之差（因子 2.6）确实只来自 Ω 仅用几何 L−1，式(5) 的 Ω=2√(2EC,μμ EL,μμ) 与 §II B 给出的 φ̂μ、n̂μ 零点涨落在该归一约定下互相一致，式(6) 把每个余弦写成单模算符直积、MPO 项数按结数+模对数增长也合理，12 节点去全局相位得 11 模、\\(12^{5}×4^{6}\\)≈\\(1.02×10^{9}\\) 均与表IV/正文吻合。但全文没有一个尺寸给出真正收敛的谱：表II 中 stiff 模式只从 4 加到 5 levels 一步就移动 630 kHz（低八与低四能级同为 630 kHz，说明是整体平移），作者自己写明“one step cannot show a plateau”；图4(b) 的 Fock 误差是相对 14 levels 读的，而图2(b) 与附录C 已证明同一 14 levels 参考在六模电路上被 1.1/1.7/1.6 MHz 错过平台、14→18 还要移动 0.626–0.944 MHz，四模电路 14→16 让低六能级移动约 2.0 MHz——也就是说 1 MHz 容差低于作者自己演示过的任何一处算符截断不确定度。表I/图3(a) 又显示六模时 exact HD 单次 68 min/16 GB 比 TN cap 64 的 87 min/2.1 GB 更快，TN 只在内存上占优；图5 的 11 模 HD 点（66 h/2.2 TB）在表III 中标注 “not run”，是全文唯一外推，却也是“ED 不可行”立论的唯一支撑。另外正文称三 fluxonium 的 MPO 构造 “reproduces a dense solve at 2 Fock levels per mode to numerical precision”——2 levels/mode（2048 维）连一个 junction 余弦都表示不了，这条只验证了代码管线，不构成在该电路上的物理验证。","weaknesses":"1) Fock 轴收敛证据链断裂，且没有任何一处得到收敛结果。判据 1 要求每一步上台阶都移动 <1 MHz，但 stiff 模只被探了一步（4→5），且该步的 630 kHz 已占容差的 63%，作者承认一步不能证明平台；off-path 的两个 probe 各只加一步。更关键的是把 cap 32/64 上测得的 Fock 误差（160 kHz）搬到 cap 128 使用，依据仅是该误差在两 cap 间移动 0.50 kHz（图8），这是假设而非测量，作者也照实写成 “an assumption”。Fock ladder 只沿一条 per-mode cutoff 向量路径走（五低模 8→10→12→14、其余六模固定 4），而附录C 自己指出 Fock 轴非变分、被截断的算符不是 H 的投影、误差可以非单调，所以单路径平台既不构成上界也不排除 off-path 更大误差。2) 三 fluxonium 的全部结论取自单一 bias point，无任何 exact 参照，且作者明写 “This work does not establish that the setting found at the working point also holds at the other bias points of such a sweep”——即“可扫 flux”这一核心使用场景从未被演示。附录C 2 的 seeded continuation 20 步只有 7 步通过检查，且通过的解虽与 cold 解差 0.097 MHz 以内、却离精确参考更远，说明延续法在这套基里并不可靠。更糟的是所选工作点（两 coupler 无偏、三 qubit 均在 \\(\\Phi_0/2\\)）正是六模验证中 DMRG 无法分辨最低两能级近简并劈裂的构型（图2(a) 空心点、§IV “our DMRG schedule does not resolve their splitting”），因此“最小间距 110 MHz”这一说法需要排除未分辨近简并的假象。3) “ED out of reach” 的论证不成立，被一个膨胀的实现绑架。表III 的 2.2 TB 来自 2.2 kB/basis state（作者自述 “a figure set by the storage settings of our solver”），而 \\(10^{9}\\) 维实向量只需 8 GB，复数也只要 16 GB，相差 100–275 倍；作者又自述 H 在 Fock 基下是实对称的、40 个 Krylov 向量、残差 10 kHz，却始终没有真正跑一次 matrix-free 求解（“No matrix-free exact solve was attempted at this size”）。同样，11 模的 HD 从未运行，图5 的 HD 点与 66 h 全是沿 D 的外推。于是“三 fluxonium 超出 dense 或 sparse ED”只在 dense 意义下被证明，而 sparse 项被判死的那句话（“Sparse storage would still exceed the memory”）用的是每项余弦在 11 模上皆为稠密的论证，这一点成立，但 matrix-free 这一真正的竞争方案被以未尝试的方式排除。4) χ=32 没有物理来源，可扩展性无从外推。作者自己把原因留作 open（“Why a bond dimension this small suffices … is left open”），从 6 模到 11 模 χ 只涨 3–8 倍、时间涨 28 倍（图4(c)），站点排序固定按 ωμ 升序（附录C 表VI）且未按 [50] 的熵排序优化；同时“能表示任意态所需的最大键维是 20736、实际只用 32”这一事实（§V B）提示现存结构极强，却没有任何纠缠熵分析解释它、也没有给出 χ 随 fluxonium 数增长的趋势。对“generic、affordable”最有说服力的 5–10 fluxonium 外推完全缺席，而按 \\(χ^{3}\\) 的 28×/3 个 doubling 趋势，χ~100 量级就要以天计。5) 物理模型与适用域远窄于“generic”：无 Lindblad/耗散、无 T1/T2、无控制线与读出、无 drive；coupler 结无显式结电容（表IV 的 Cq 只加在两个 qubit 结上）；电感由大结链实现，但链的内部模与 phase slip 只用一句 “Phase slips … are rare [45]” 打发，而所引 [23] 恰是论证 array modes 重要的文献；两 benchmark 电路的电容矩阵只有对地电容与结 shunt，没有版图级邻接互容，而四模电路显示 0.4–0.8 fF 的邻接互容已必须计入，所以“C 可以任意给”在方法上成立、在演示上未验证；coupler screening parameter 只在 0.970–0.982（贴单稳边界、8 个经典极小），最低八能级又未被证明就是三比特计算子空间（§V A 明说 “that they are the eight states of three qubits is not established”），设计者拿到这八个本征值仍无法给出 f01、耦合 J 或 ZZ。最后，“chooses no subsystems”只是把选择换成了 per-mode cutoff 向量 + 站点排序 + sweep schedule 三组人工超参，而真正吃误差的恰是六模中被压到 4 levels 的 stiff 模。","overclaim":"摘要 “The normal modes make the method generic, and the tensor network makes it affordable”：generic 只在作者自定的“inductive tree、每结恰闭合一个 flux loop、只有对地电容与结 shunt”这一族内成立，最常见的电容耦合与含 inductive loop 的设计完全未触及；affordable 的 81 min 是在完成两天量级标定（bond 轴 19 h + Fock 轴 12 次求解约 30 h + replica）之后、在单个 bias point 上、且作者承认该设置能否迁移到其他 bias 未证明的条件下得到的；对设计流程而言每换一个电路就要重做这套标定。摘要 “its lowest eight levels are converged to within 1 MHz in both truncations”：相对的是一个自身未收敛的 14 levels 参考，stiff 轴只有一步且无平台，Fock 误差靠 0.50 kHz 的假设搬到 cap 128。摘要与 §V B “out of reach of exact diagonalization in dense or sparse storage”：dense（\\(1.7×10^{10}\\) GB）成立，sparse/matrix-free 不成立，因为 matrix-free 从未尝试、而 2.2 kB/state 相对 16 B/state 膨胀了 100 倍以上，作者自己也只说“at the settings of Appendix D”。引言 “A poor partition converges slowly … A wrong choice can therefore pass the standard workflow undetected” 与 “Methods built on such a split have documented limits”：全文没有在 11 模电路上运行任何一种子系统方法（HD 未跑、附录B 明说 “we did not try it”），所以“现有方法在强耦合下失效”是论证出来的而非演示出来的；同时 “We call these circuits strongly coupled in a structural sense” 重定义了标准术语，作者又自认 participation ratio “does not measure how large the coupling is”，标题里的 strong coupling 与“现有方法失效”之间没有建立定量联系。引言 “Designing a superconducting quantum processor rests on predicting the low-lying spectrum” 把设计问题窄化为静态谱，而 §VI 自己承认 1 MHz 容差 “does not settle an interaction between the qubits at or below its scale, such as a residual static ZZ shift”——ZZ 恰恰是这类 coupler 设计的核心指标。摘要 “each state is stored in a small fraction of the numbers a dense vector needs”：\\(5.7×10^{4}\\) 对 \\(10^{9}\\) 只是存储比较，1.3 GB 里主要是 MPO 与 Lanczos 向量，与算法成本无关。§V A “the MPO construction … reproduces a dense solve at 2 Fock levels per mode to numerical precision”：2 levels/mode 连余弦的非对角结构都表示不了，这是管线测试被写成物理验证。图5 把标注 “not run” 的 HD 外推点（66 h、2.2 TB）与实测点画在同一张成本图上、并参与 “grow far more slowly with D” 的论断；同图把 TN 的 6 模（40 sweeps）与 11 模（60 sweeps）点直接连线，而作者自己注明两者 thread 与 sweep 设置不同、不可 wall-for-wall 比较。","citations":"需核对：[10] Hita-Pérez, Jaumà, Pino, García-Ripoll, APL 119, 222601 (2021)——是否确实给出“两耦合 flux qubit 的微扰耦合估计只在弱耦合下与非微扰投影一致”这一具体结论（引言用它支撑 split 方法有 documented limits）。[16] Chung, JPCM 9, L619 (1997) 与 [17] Lee, Choi, Choi, PRB 68, 144506 (2003)——是否真是 “one site per superconducting island” 的 DMRG，而非电荷基数值对角化。[18] Di Paolo et al., npj QI 7, 11 (2021) 与 [19] Rui, Cohen, Petrescu, PRApplied 26, 034002 (2026)——是否真是 “one site per junction of an array inductance”，且 [19] 的卷期页需核实（2026 年 PRApplied 第 26 卷）。[20] González-García et al., PRApplied 25, 064070 (2026) 与 [21] Lange et al., QST 11, 015020 (2026)——卷期页，以及“DMRG 一次求多个能级”的具体做法是否如文中所引。[22] Weiss, Li, Ferguson, Koch, PRB 100, 224507 (2019)——是否为 current-mirror qubit 的“有效模型”而非全电路。[37] Weiss, Zhang, Ding, Ma, Schuster, Koch, PRX Quantum 3, 040336 (2022) 与 [38] Zhang et al., PRX 11, 011010 (2021)——图1(a) 的 galvanically coupled fluxonium pair 拓扑（Lin/Lout/Lc、node 4 汇合、SQUID 为单结）到底对应哪一篇；文中说“follows [37]”需核对。[41] Yan et al., PRApplied 10, 054062 (2018) 与 [6] Kafri et al., PRA 95, 052333 (2017)——rf-SQUID 磁通可调 coupler 与“screening parameter < 1 则单稳”的原始出处；[46] Quintana 博士论文作为单稳判据的支撑偏弱，宜换期刊文献。[23] Ferguson, Houck, Koch, PRX 3, 011003 (2013)——该文正是论证 array modes 重要的工作，却被用来交代“忽略链内部模”，引用方向需确认。[24] Smith et al., PRB 94, 144507 (2016)——是否支持“用 normal-mode Fock 基展开”这一做法。[33] Stoudenmire–White 综述用于 continuation、[49] Hu–Chan 用于 seeding、[50] Legeza–Sólyom 用于 mode ordering、[54] Baker–Foley–Sénéchal 用于一次求多态，四处引用与所支撑的具体技术点是否一一对应。[48] Lanczos, J. Res. NBS 45, 255 (1950) 页码；[31] ITensors 0.7.13 / ITensorMPS 0.3.6、[55] Julia SIAM Rev 59, 65 (2017)、[56] KrylovKit.jl 0.9.5 版本需核对。另需核对作者未引但直接相关的：Kerman arXiv:2010.14929 的层级对角化在强耦合下的实际表现、Ferguson PRX 3 011003 的 array-mode 结果、以及 scqubits/SQcircuit 类已成熟工具，后者本可作为独立第三方交叉验证。","questions":"1) 请给出三 fluxonium 的二维收敛表而非两条单轴：把五个低模从 12 提到 16、六个 stiff 模从 4 提到 6–8（六模电路上 14→18 就已经移动 0.626–0.944 MHz，四模 14→16 移动低六能级约 2.0 MHz，故现有 12/4 组合的绝对误差很可能在 1–3 MHz），在 cap 32 与 128 上分别给出最低八能级每个跃迁的移动量，并说明 1 MHz 容差是否仍成立。2) 同一 230 GB、16 核节点上，用标准 matrix-free Lanczos（实向量、8–16 B/state、8–20 个 Krylov 向量、重启）对 11 模 \\(10^{9}\\) 维求最低八态，实际内存与时间是多少？既然 H 实对称，2.2 kB/basis state（=最小值的 275 倍）是否纯属实现问题，从而“ED out of reach”只对作者自己的求解器成立？若确实不可行，为何不在 8–9 模电路上做一次 TN 与 HD 的中间规模 head-to-head，以支撑“三 fluxonium 超出 ED”？3) 三个 fluxonium 上跑一次 bare-basis HD（m=8…14）或经典 BO 分离，实际耗时/精度是多少？若不做，凭什么说“a poor partition”会在这条具体电路上失效？另外，工作点选在两 coupler 均无偏、qubit 均在 \\(\\Phi_0/2\\)——正是六模验证中 DMRG 无法分辨近简并劈裂的构型——如何排除“最小间距 110 MHz”只是未分辨近简并的假象，并如何把最低八能级指派到三比特计算子空间、进而给出 f01、J 与 ZZ？","basis":"通读全文文本（1–1236 行，txt 提取版）：摘要与引言、§II（式(1)–(6) 的 lumped-element Hamiltonian、normal-mode 变换与 MPO 构造、两种截断与 1 MHz 判据的定义）、§III（两电路拓扑与工作区间）、§IV（与 exact HD/ED 的验证、表I、图2、图3）、§V（三 fluxonium 的两条截断轴、图4、表II–III、图5 资源图）、§VI 讨论、附录A（表IV 全部元件值、表V 的 ωμ 与 Ωμ）、附录B（式(2) 与 participation ratio、图7）、附录C（收敛判据 1–3、表VI 的 DMRG 调度、表VII 跃迁分解、图8 的双轴分离、seeded continuation 统计）、附录D（Xeon 6517P/16 核/230 GB、Julia 1.11.6 + ITensors 0.7.13 + KrylovKit 0.9.5）、以及参考文献 [1]–[56]。按表IV 重算了 12^5×4^6≈1.02×10^9、14^6≈7.5×10^6、表III 单次成本累加（bond 轴 27 min+81 min+4.4 h+13 h≈19 h）、表I 与图3 的 5.5×/25× 比值，以及 2.2 kB/state×10^9 与最小 8–16 B/state 的差距。未查看 PDF 图形本身，图2–图5、图7、图8 的坐标与图注均以 txt 提取文本为准；未获取作者代码、未复现任何求解。"}},{"id":"arxiv-2604.27679","no":8,"topics":["芯片与耦合器","测控与噪声"],"source":"PRX Quantum","venue":"PRX Quantum · arXiv:2604.27679（APS DOI 页面截稿时未上线）","published":"2026-11-06","title":"Parametrically Driven iSWAP Gate Using a Capacitively Shunted Double-Transmon Coupler at the Zero-Flux Sweet Spot","title_zh":"零磁通点的参量 iSWAP：112 ns、99.92%","authors":["Shinichi Inoue","Rui Li","Kentaro Kubo","Yinghao Ho","Yasunobu Nakamura","Hayato Goto"],"abstract":"A double-transmon coupler (DTC) enables a fast, high-fidelity CZ gate between two highly detuned, fixed-frequency transmon qubits. Moreover, a recently proposed capacitively shunted DTC (CSDTC) realizes a small residual ZZ interaction over a wide flux-bias range around zero flux, eliminating the necessity of static flux biasing while maintaining high CZ-gate fidelity. However, CZ gates with the DTC and CSDTC require baseband flux pulses with large amplitudes, which are vulnerable to pulse distortion and decoherence due to large qubit-coupler hybridization. To address these issues, we experimentally demonstrate a parametrically driven iSWAP gate operated at zero flux bias between highly detuned, fixed-frequency transmon qubits coupled through a CSDTC. Using a simple flux-drive waveform without predistortion, we realize an average gate fidelity of 99.92(2)% at a total gate time of 112 ns. The observed high-fidelity performance is consistent with small qubit-coupler hybridization and small effective ZZ interaction during the gate. Our numerical simulations reproduce the experimentally observed iSWAP interaction rate and effective ZZ interaction, demonstrating the applicability of the theoretical model not only to spectral information but also to time-domain dynamics such as gate operations. These results boost further progress in the research of superconducting quantum computers.","importance":3,"importance_reason":"零磁通 iSWAP 的器件与脉冲方案，偏芯片/门实现。","summary":"CSDTC 在零磁通偏置下用简单参量磁通驱动实现固定频率 transmon 间的 iSWAP，112 ns、平均保真度 99.92(2)%，无需预失真。","problem":"DTC/CSDTC 的 CZ 需要大幅基带磁通脉冲，易受脉冲畸变与退相干影响；需要更简单的零磁通门方案。","method":"电容分流双 transmon coupler（CSDTC）；高度失谐的固定频率 transmon；零磁通偏置下的参量磁通驱动；实验与数值模拟对照。","result":"平均门保真度 \\(99.92(2)\\%\\)，总门时间 \\(112\\,\\mathrm{ns}\\)；无需预失真；qubit–coupler 杂化与有效 ZZ 都很小；数值模拟复现 iSWAP 速率和 ZZ。标准 iSWAP 形式为 $$U_{\\mathrm{iSWAP}}=\\exp\\!\\Big[i\\frac{\\pi}{4}(X\\otimes X+Y\\otimes Y)\\Big].$$","contribution":"在零磁通点用简单参量驱动实现 112 ns、99.92% 的 iSWAP，避免大幅基带磁通脉冲。","limitation":"单器件、单一门型；未展示完整 FT 周期、阵列扩展与长期稳定性。","key_numbers":["112 ns","99.92(2)%","zero flux","no predistortion"],"url":"https://arx 2})\\) 与 \\(ζ^{eff}(φd)\\) 曲线形状」，而唯一可作盲检验的解析式(54) 对 \\(ζ^{dyn}\\) 高估约 2 倍（图9(b)），却被当作「动态 ZZ 抵消静态 ZZ」的主解释。泄漏方面，\\(t_tot>128\\) ns 时 SRB/IRB 泄漏曲线「在误差内重叠」被直接剔除（Sec. IV B），0.01% 主要是分辨率下限；耦合器判别的 others→|00⟩pm 误判率 5.7%（表III）还会把 L1 系统性低估约 6%。\n3) 与 CZ/其他 iSWAP 的比较既不公平也不完整。全文只与同组、同器件的 CZ（[27] DTC、[28] CSDTC）比较，且比的是 p̄c（模拟量）与 \\(T^{D}\\)（由误差反推的量），从未并列给出 [28] CZ 的平均保真度与归一化到门时间的误差，因此「更高保真度」无法核实；引言里对标的一批参数化 iSWAP/fSim 结果（[36] Sung、[40] Collodo、[44] Foxen、[53] Caldwell、[58] Sete）在结果部分一次也没有出现。计时口径也不统一：112 ns 含 2×6 ns 零幅度 buffer（式26；实际相互作用 100 ns，占 10.7% 且贡献 0.0065% 误差），而对比的 CZ 是 80 ns；在 \\(t_gate\\) 定义与 RB 口径都未统一时，「尽管门时间更长仍更好」不成立。p̄c 从 0.40 降到 0.05 是图5(b) 模拟值，不是测量值。\n4) scalable 主张没有任何串扰/spectator 证据。器件只有 2 个数据比特 + 1 个耦合器，没有邻居比特、邻居耦合器、同时多门、spectator 或 Z 线互耦测量；耦合器本身没有专用微波线，表征时靠「qubit drive line 的 classical crosstalk」驱动 P/M 模（附录A），这恰说明布线串扰已不可忽略，论文却对其量级一字未提。245 MHz、±0.28 Φ0（峰峰 0.56 Φ0）的驱动会在阵列中通过杂散互感与 ac Zeeman 效应对邻近比特/耦合器产生静态偏置与寄生激活；作者只对自家两比特做 frame update 补偿，没有给任何串扰上限。所谓 frequency-selective activation 也从未测量：图2(a) chevron 的频率宽度没有量化，无法判断在耦合器频率拥挤的阵列中能否只激活目标耦合器。\n5) 工作点与零磁通甜点叙事不自洽，且 112 ns 被驱动幅度悬崖钉死。φd/2π=0.28 对应峰峰 0.56 Φ0，不是「小磁通摆动」；要支撑「更小摆动→更小 hybridization」的因果链必须给出 [28] CZ 的峰值 φd，而图5(b) 中 p̄c 峰值仅 0.05 更像是正弦调制在峰值附近占空比小的结果，而非峰值幅度本身小。图10 显示 φex/2π≳0.3 后 p̄c 陡升，图6(b) 显示 0.28→0.31 之间 \\(ζ^{dyn}\\) 变号、三级近似失效；按 g∝\\(φd^{2}\\)、g·t=π/2 估算，96 ns 更快门需 φd/2π≈0.30–0.31，恰好越过该边界——112 ns 是「不能再快」的边界点，不是可外推的最优点。零磁通甜点只保护 idle，不保护被 ±0.28 Φ0 反复推离甜点的门：图8(b) 已显示 |φex| 增大时 T2* 迅速恶化，而论文没测 driven-T1/T2，也没测门保真度随直流磁通偏置的变化，只用式(43) 由误差反推 \\(T^{D}=57\\) µs 并把额外退相干归因于 hybridization/flux noise/电子学噪声（Sec. IV D），属未验证归因。最后，\\(ζ^{eff}/2π=−4.7\\) kHz 的「近乎完美抵消」是用模拟的 \\(ζ^{avg}\\) 减测量 \\(ζ^{eff}\\) 来定义 \\(ζ^{dyn}\\) 得到的：\\(ζ^{dyn}\\) 不可独立测量，\\(ζ^{avg}\\) 也不是可观测量，而且该点在 0.26、门工作在 0.28。","overclaim":"1) 摘要「Our numerical simulations reproduce ... not only spectral information but also time-domain dynamics such as gate operations」与 Sec. VI「quantitative agreement ... even in time-dependent cases」：模型参数来自能谱拟合、驱动幅度标度因子又按「使 \\(g_iSWAP\\) 与模拟一致」定标，且模拟无退相干、从未预言 99.92%，把两个准静态量（chevron 频率、累积相位）说成时域定量验证属过度表述。\n2) 「using a simple flux-drive waveform without predistortion ... which simplifies the gate calibration procedure」：实际是 8 步标定流程（附录F）——相对延时、零磁通微调、幅度/频率、per-gate frame update（N 至 361）、初始相位、ORBIT 四参数联合优化（N=150）、QPT 验证；「无预失真」之所以可行主要是因为 245 MHz 是窄带单音、传递函数畸变被吸收进按模拟定标的 φd，并非被证明为零。\n3) 「The observed high-fidelity performance is consistent with small qubit–coupler hybridization and small effective ZZ interaction」与 Sec. VI「both leakage and coherent ZZ errors were strongly suppressed」：泄漏是分辨率下限（t>128 ns 数据被剔除），ZZ 点无误差棒，「小 hybridization」只有模拟 p̄c，而实测 driven-T1/T2 缺席。\n4) Sec. IV D「This order-of-magnitude reduction ... is consistent with the longer effective coherence times and higher gate fidelity」：higher fidelity 是与 CZ 比的，但全文没给 [28] CZ 的保真度数字；且 \\(T^{D}=57(11)\\) µs 的 20% 不确定度使「systematically longer」的统计强度未被量化。\n5) 「Remarkably, the cancellation is almost perfect」建立在 0.26 而非实际工作点 0.28 上；摘要末句「These results boost further progress in the research of superconducting quantum computers」属无信息套话。","citations":"必须核对：[28] Li et al., Phys. Rev. Appl. 23, 064069 (2025)——其 CZ 的平均保真度、门时间、是否同样用 IRB、CZ 的峰值 φd，这是「优于同器件 CZ」论断的唯一支点；[27] Li et al., Phys. Rev. X 14, 041050 (2024)——式(29)(31)(32) 的 \\(r_iSWAP\\)、L1 定义与 LRB 口径，以及其 \\(T^{D}\\) 基线；[36] Sung et al., Phys. Rev. X 11, 021058 (2021)——ZZ-free iSWAP 是本文最直接的对标（同类思路、不同耦合器），须核对门时间/保真度/是否含泄漏；[40] Collodo et al., PRL 125, 240502 (2020)、[44] Foxen et al., PRL 125, 120504 (2020)、[53] Caldwell et al., Phys. Rev. Appl. 10, 034050 (2018)、[58] Sete et al., Phys. Rev. Appl. 16, 024050 (2021)——参数化 iSWAP/fSim 的既有关门时间与保真度；[56] Hong et al., PRA 101, 012302 (2020)、[57] Sete et al., Phys. Rev. Appl. 22, 014059 (2024)——二阶/甜点参数化驱动先例，用以核对「less explored」的新颖性表述；[72] Jin et al., Phys. Rev. Appl. 24, 064026 (2025)——多音 ZZ 抵消，核对是否已实现更小 \\(ζ^{eff}\\)；[64] Ding et al., Phys. Rev. X 13, 031035 (2023)、[65] Fors et al., arXiv:2408.15402——式(38) 的 \\(3φ^{2}/20\\) 与 \\(φ^{2}/20\\) 系数；[30] Cai et al., arXiv:2511.02249、[23] Shirai et al., arXiv:2511.01260——同期预印本，核对是否已有同类零磁通参数化门。基线方面还应核对：是否漏引近期 30–60 ns、>99.9% 的 iSWAP/tunable-coupler 结果，以及 Google 的 fSim/iSWAP 系列在门时间归一化后的误差。","questions":"1) 请给出 RB 的完整统计：标准/交错 RB 的随机 Clifford 序列数、长度点数、seed 数，单比特 RB 的 per-gate 误差，以及每个 Clifford 中 iSWAP 的平均个数。在 \\(r_SRB=0.362%/Clifford\\) 而 \\(r_iSWAP\\) 仅 0.078% 的情况下，门依赖噪声与非马尔可夫性会给差值带来多大系统偏差？为何 \\(r_SRB\\) 高达 0.362%（若按 ~1.5 个 iSWAP/Clifford，剩余 ~0.24% 来自若干单比特门，隐含单比特误差 ~0.04%，明显低于当前最好水平）？请再用含 SPAM 修正的 GST 或 purity/unitarity benchmarking 解释 QPT 的 \\(F_process=95.5%\\) 与 RB 的 99.92% 的差距。\n2) \\(ζ^{eff}\\) 的最小值 −4.7 kHz 出现在 φd/2π=0.26，而图2(a) 与正文的工作点是 0.28：请明确 112 ns 门实际使用的 φd 与对应的 \\(ζ^{eff}\\)，并给出 \\(ζ^{eff}\\) 的测量不确定度（该值对应 112 ns 内仅 3.3 mrad 相位，而图6(b) 无误差棒）。既然 \\(ζ^{dyn}=ζ^{eff}−ζ^{avg}\\) 中的 \\(ζ^{avg}\\) 是模拟量、\\(ζ^{dyn}\\) 不可独立测量，能否改用驱动下 |11⟩ 相位随 φd 的直接测量来证明动态 ZZ 的物理来源？若式(43) 的相干极限改用 T2*（约 73 µs、0.06%）而非 T2E，「\\(T^{D}=57\\) µs 低 35%」还剩多少？\n3) 请补三项可扩展性测量：(i) 驱动频率失谐下门保真度/泄漏的下降，以量化 frequency selectivity 带宽；(ii) 直流磁通偏置 ±δφ 下门保真度的变化，以证明零磁通甜点保护的是门本身而不只是 idle；(iii) 相邻耦合器/比特经杂散互感或共用/邻近 Z 线受到的 245 MHz 激励与 ac Zeeman 频移上限。另外，在无预失真条件下，如何排除 bias tee、3 GHz LPF、Eccosorb 与 HDAWG 放大模式的传递函数对包络的畸变只是被吸收进了那个按模拟定标的 φd 转换因子？","basis":"通读了 arXiv:2604.27679v1 的全文文本（2306 行，含摘要、Sec. I–VI、附录 A–G、表 I–III、图 1–15 的图注与正文描述），重点核对了式(1)–(3)(11)(16)–(23)(26)(28)–(34)(38)(42)–(47)(54) 以及图2、3、4、6、9、10 之间的数值关系，并用表I/表II 的参数复算了 88(4) µs 相干极限、T^D=57 µs、r_idle=0.0065%、96 ns 对应 φd≈0.30–0.31、−4.7 kHz 对应 3.3 mrad 等量。未查看图形本身的像素内容（仅有图注与正文描述），未查阅所引 [27][28][36] 等文献原文，因此涉及他文数值的核对均属「应核对」性质；未运行作者代码、未复现任何实验。"}},{"id":"arxiv-2611.09876","no":9,"topics":["测控与噪声"],"source":"arXiv","venue":"arXiv:2611.09876 [quant-ph]","published":"2026-11-06","title":"Novikov-Magnus Master Equation for Driven Quantum Systems under Classical Correlated Noise","title_zh":"相关噪声下驱动量子系统的 Novikov–Magnus 主方程","authors":["Nada Khogeer","Jerison Parra","Caroline Desgranges","Hugo Ribeiro"],"abstract":"We introduce a modular framework for deriving time-local quantum master equations for driven systems subject to temporally correlated classical noise. The construction combines the Donsker-Furutsu-Novikov relation with the Magnus expansion: Functional response closes the noise average, while nested commutators retain the noncommuting chronological action of noise-induced perturbations along the controlled quantum trajectory. For zero-mean Gaussian noise, we derive the resulting Novikov-Magnus quantum master equation through fourth order in the noise strength. The same response hierarchy suggests a natural extension beyond Gaussian noise, with connected higher-order noise correlations weighting higher functional derivatives of the stochastic map. For a driven qubit under Ornstein-Uhlenbeck and band-limited $1/f$ noise, the second- and fourth-order maps remain CPTP throughout the perturbative regime and accurately reproduce stochastic simulations. Their diamond-norm errors are comparable to those of the cumulant-based pseudo-Lindblad master equation, with a modest fourth-order improvement for Ornstein-Uhlenbeck noise.","importance":3,"importance_reason":"相关噪声下的时间局域主方程，服务于测控/动力学仿真。","summary":"把 Novikov 关系与 Magnus 展开结合，得到时间局域主方程；对驱动 qubit 在 OU 与带限 1/f 噪声下，二/四阶映射保持 CPTP，精度与 cumulant pseudo-Lindblad 相当。","problem":"驱动量子系统受时间相关经典噪声影响；现有主方程难以同时保留非对易时间演化和噪声记忆。","method":"Donsker–Furutsu–Novikov 关系闭合噪声平均，Magnus 展开保留嵌套对易子；对零均值高斯噪声推到四阶；在 OU 与带限 1/f 噪声下与随机模拟、diamond norm 对比。 目标是把驱动系统的演化写成时间局域形式 $$\\dot\\rho(t)=\\mathcal{L}(t)\\rho(t),\\qquad U(t)=\\mathcal{T}\\exp\\!\\int_0^{t}\\mathcal{L}(s)\\,ds.$$","result":"二阶/四阶映射在微扰区保持 CPTP，能准确复现随机模拟；diamond-norm 误差与 cumulant pseudo-Lindblad 相当，OU 噪声下四阶有温和改进。","contribution":"给出保留非对易时间演化的时间局域主方程，把相关噪声纳入驱动量子系统的动力学仿真。","limitation":"经典相关噪声、微扰展开；没有针对具体超导器件的参数标定；非高斯推广只给了响应层级思路。","key_numbers":["4th order","CPTP","OU & 1/f","diamond norm"],"url":"https://arxiv.org/abs/2611.09876","pdf_url":"https://arxiv.org/pdf/2611.09876","doi":"","review":{"verdict":"弱拒","confidence":"中高","correctness":"式(12)的首项 Ξ⁽²⁾\\((t)=ε^{2}L\\)̂\\(_I(t)\\)∫₀ᵗdt₁C(t,t₁)L̂\\(_I(t₁)\\) 与随机 Liouville 方程的标准二阶 TCL（即式(9)只取 n=1）逐项相同，正文却未说明，因此图3 中「二阶 NMQME 对二阶 PLME」并非独立方法的比较。四阶生成元只以式(S18)呈现：S1 仅对 Ω₂ 一个代表项演算，式(S10)中 \\(ε^{3}\\) 项为何恒等消去、以及 1/2、1/4、1/6 等系数与式(S17)的三扇区分解都无法从文中复核；式(S4)–(S7)用有限乘积极限把 δ/δξ 与 \\(⟨·⟩_ξ\\) 交换，只在逐点算子范数意义下成立，对支撑无界的高斯噪声缺少控制收敛估计，Magnus 级数收敛半径也与 ε 截断无关，所以「\\(O(\\epsilon^{6})\\)」是形式记法而非受控误差。式(S47)–(S49)把 sinc 核换成 \\(πδ(θ/t_g−ω)\\) 时丢弃的非共振/边界项量级为 \\((2t_g/θ)ln(ω_h/ω_l)\\)，在 \\(ω_h/ω_l=100\\) 时不小于保留的 \\(πt_g/θ\\)，故式(19)的 \\(δ_1/f\\) 不是受控估计。这一缺陷在图上直接可见：图3(c) 在 \\(δ_1/f=1\\) 处 d⋄≈\\(3×10^{-4}\\)，图3(a) 在 \\(δ_OU\\)≈0.6 处 d⋄≈\\(3×10^{-2}\\)，同一「小参数」下误差相差约两个量级，说明 δ 不是普适的控制参数。","weaknesses":"1) DFN 与 Magnus 的结合不严格、误差失控：DFN 只对因果泛函与零均值高斯过程严格成立，这里却对 \\(L_I=exp\\) Ω 逐阶求泛函导数并递推套用 DFN，需要 (i) Magnus 级数收敛、(ii) δL/δξ 在所需意义下存在、(iii) 极限与 \\(⟨·⟩_ξ\\) 可交换，三者均未证明；式(S4)–(S6)所谓「三个极限都存在」只用到有限维算子范数，未处理高斯噪声无界支撑导致的 exp(Ω) 无界与一致可积。更实质的是截断对象：\\(\\epsilon^{4}\\) 截的是「关联函数个数 × Magnus 阶数」的混合级数（Ω₁–Ω₃ 全保留而 Ω₄ 以上被丢），ε 只标记噪声强度、不控制嵌套对易子与 ∫‖\\(V_I\\)‖dt 的量级，故误差不会随 \\(ε^{6}\\) 一致趋零（长时/强驱动下更差），文中既无余项估计，也无 log–log 收敛阶（应≈\\(δ^{1}\\)、\\(δ^{2}\\)）的数值检验来支撑「through fourth order」的精度声明。\n2) 四阶结果无法独立复核、新意未界定：S1 明说只演算 Ω₂ 一项、其余「按同样步骤重复」，读者无法判断 Ξ⁽⁴⁾ 是否完备（例如两次 DFN 作用在 δL/δξ 上的双重响应贡献、以及 Ω₁Ω₂ 型项是否有遗漏，均未枚举）；式(S18)把 1/2、1/4、1/6 的不同前因子混排而无数值或符号校验。更关键的是没有回答：Ξ⁽²⁾ 是否逐项等于 PLME 二阶项？Ξ⁽⁴⁾ 与 Shibata–Chaturvedi/Breuer 的 TCL4 生成元是否等价？若等价，本文只是用 DFN+Magnus 重推了已知 TCL4，「we solved the perturbative closure problem」的新意须重述；若不等价，必须指出差在哪几项、以及图3 中两条四阶曲线的差（OU 下 \\(~10^{-3}\\)–\\(10^{-2}\\)）是否就来自这些项。\n3) 基准被参考噪声主导、diamond norm 无误差棒：\\(Φ_E\\) 是 M=1000 条轨迹的平均（表S1），图3 却完全没有 d⋄ 的统计不确定度。1/f 情形四条曲线在 δ≤1 内的差别被称为 sub-percent（\\(~10^{-4}\\)），而用 1000 个样本估一个含 16 个实自由度的 Choi 矩阵时蒙特卡洛误差是百分之几量级；曲线的近乎完全重合更可能是共同参考误差所致，不能反推「两种闭包定量等价」。同理「四阶在 OU 下误差最小」（图3a）只有 \\(~10^{-3}\\)–\\(10^{-2}\\) 的绝对差，需 bootstrap 置信区间才成立。另外把 d⋄ 与平均门误差分开报告，掩盖了 δ→1 附近 d⋄ 与门误差本身同量级（图3a 的 \\(3×10^{-2}\\) 对图S1 同参数下的 ⟨ϵ⟩）这一事实，即相对误差 O(1)。\n4) CPTP 声称的范围过窄、部分诊断是同义反复：只在单个门时 \\(t=t_g\\)、单一驱动、单个纵向耦合 V̂=σ̂\\(_z/2\\) 上检验 \\(λ_min≥0\\)
