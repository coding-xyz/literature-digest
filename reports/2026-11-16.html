:"Exponentially robust non-Clifford gate in a driven-dissipative circuit","title_zh":"驱动耗散电路中的指数鲁棒非 Clifford 门","authors":["Liam O'Brien","Gil Refael","Frederik Nathan"],"abstract":"Magic state distillation is the standard route to non-Clifford gates and dominates fault-tolerant overhead. The authors propose a physical-level protected square-root-of-T gate for a dissipatively stabilized GKP qubit in a driven superconducting circuit, using a quartic flux potential generated by ancillary Josephson junctions. They argue analytically and numerically that the gate is topologically protected, with infidelity exponentially suppressed by control and device imperfections, on microsecond timescales for GHz resonators.","importance":5,"importance_reason":"若成立，可把非 Clifford 门从魔态蒸馏的算法级开销下移到物理比特级，是本窗口对容错路线最有分量的结构性提议，误差分析值得逐节读。","summary":"作者为耗散稳定的 GKP 比特设计物理层受保护的 \\(T\\) 门平方根：辅助约瑟夫森结产生纯四次（\\(\\varphi^{4}\\)）通量势，使编码态在离开并重回编码空间时相位复活，等效绕 Bloch 球转过 \\(\\pm\\pi/8\\)。解析与数值表明该门拓扑鲁棒，控制与参数失配带来的不保真度指数压低，GHz 谐振器下门时长在微秒量级。","problem":"非 Clifford 门通常依赖魔态蒸馏，开销大且被视为容错的预期瓶颈；已有的自纠错 GKP 比特只给出受保护的 Clifford 门，缺一个同等鲁棒的非 Clifford 门。","method":"在 LC 谐振器（特征阻抗 \\(\\sqrt{L/C}\\approx h/2e^{2}\\approx12.91\\) kΩ）上通过时序开关接入约瑟夫森结与耗散电阻实现 GKP 稳定化，再把辅助结支路切入以合成有效 \\(\\varphi^{4}\\) 通量势；用半周期反转配合 Uhrig 动力学解耦抑制 \\(1/f\\) 通量噪声，并对控制幅度、结能量与目标参数失配做数值扫描。","result":"数值给出不保真度随相位噪声强度 \\(\\mu_{\\varphi}\\) 与失配量指数下降；少量 UDD 步即可压制约 \\(1\\Phi_{0}^{2}/\\)THz 量级的 \\(1/f\\) 通量噪声；小环通量容差约 \\(0.01\\Phi_{0}\\)；GHz 谐振器下门时长微秒级，但要求开关在 10–50 ps 内把约瑟夫森耦合压低数个量级。","contribution":"把指数受保护的单比特门集合从 Clifford 扩展到非 Clifford 的 \\(T\\) 门平方根，给出具体电路族、驱动时序与噪声/失配容忍度，为物理层通用门路线提供可检验蓝图。","limitation":"全部分析为模型级解析与数值，无器件实测；核心前提（10–50 ps 量级高抑制比开关、约 12.91 kΩ 高阻抗谐振器、辅助结参数的精确靶向）尚未在实验上同时具备；微秒门时长与器件 T1 的比值未被讨论。","key_numbers":["不保真度随控制误差与器件失配指数压低（解析 + 数值）","少量 UDD 步即可压制约 1Φ0²/THz 的 1/f 通量噪声","小环通量容差约 0.01 Φ0","开关需在 10–50 ps 内抑制约瑟夫森耦合数个量级"],"url":"https://doi.org/10.1103/9x8h-h3hp","review":{"verdict":"小修","confidence":"中","correctness":"相位复活机制与 φ⁴ 势的选择自洽：势能在有限挤压下由电容与结势约束，避免了 φ³ 方案里高阶势快速变化的问题，误差指数压低的论证与数值扫描方向一致。","weaknesses":"· 指数压低的标度来自对局部噪声的耗散修正，但电阻引入的额外耗散通道与门速度之间的权衡没有定量曲线\n· UDD 抑制通量噪声只在半周期反转图像下验证，切换瞬态（10–50 ps）期间的误差未建模\n· 微秒门时长下谐振器/电阻的热光子与准粒子效应缺失，实验中很可能成为主导限制","overclaim":"标题的 exponentially robust 指对局部噪声与参数失配的渐近行为；实际可达不保真度仍取决于开关与电阻的工程指标，文中对“指数”成立所需噪声强度区间交代不足。","citations":"与自纠错 GKP 稳定化、GKP 原始 φ³ 方案、魔态蒸馏及动力学解耦文献均有对照，但缺少与近期容错资源估算（魔态工厂开销）的定量比较。","questions":"①开关瞬态误差如何进入不保真度预算？②电阻耗散对逻辑门速率的限制是多少？③在有限挤压与热光子下指数标度从何处开始失效？","basis":"全文（arXiv:2507.19713 镜像 PDF，与刊出版本同稿）"}},{"id":"arxiv-2611.15018","no":2,"topics":["纠错码","编译与验证"],"source":"arXiv","venue":"arXiv:2611.15018 [quant-ph]","published":"2026-11-11","title":"Time- and Photon-Optimal Paths for the Preparation and Logical Flip of Gottesman-Kitaev-Preskill States","title_zh":"GKP 态制备与逻辑翻转的时间最优与光子最优路径","authors":["Aidan Curtis","Juan S. Salcedo-Gallo","Sergei Leonov","Kevin Limanta","Peter Chin","Salil Bedkihal","Mattias Fitzpatrick"],"abstract":"Preparing and manipulating highly non-Gaussian GKP states is limited by photon loss and by microsecond circuit-QED pulses. Taking the quantum brachistochrone as a reference path, the authors derive the time-optimal nonlinear Hamiltonians for GKP preparation and logical flips, show that the photon-optimal path detours through vacuum, and introduce a tangential capacity that predicts which gate sets can track these paths, with conditional squeezing preparing GKP states in 824 ns at 0.99 fidelity.","importance":5,"importance_reason":"给出可跨门族比较的最优性基准（时间成本与光子成本），并用 tangential capacity 解释为何条件挤压优于位移与 SNAP，对 GKP 门集设计与脉冲工程有直接指导价值。","summary":"作者把量子 brachistochrone（有界速度下最短时间路径）与最少光子暴露路径作为参照，推导 GKP 制备与逻辑翻转的显式非线性哈密顿量，并定义 tangential capacity 度量门集沿路径推进的能力。结论：制备时两路径几乎重合，翻转时光子最优路径绕道真空；条件挤压在 824 ns 内以 0.99 保真度制备 GKP 态。","problem":"GKP 态高度非高斯，电路 QED 制备脉冲常在微秒量级，期间谐振腔丢光子、辅助比特退相干；现有 GRAPE 与强化学习只在既定门族内优化损失地形，缺少跨门族的路径级最优性基准。","method":"以 brachistochrone 与费马型光子最优路径（把平均光子数视为折射率）为参照，解析构造生成这两条路径的非线性哈密顿量；定义 tangential capacity 为门集沿路径的直接推进速度上限；在实验噪声率下用 GRAPE 优化条件挤压（CS）、条件位移（CD）与 SNAP-位移三类脉冲，并与路径比较贴近度与制备/门保真度。","result":"制备阶段两路径近乎重合，逻辑翻转阶段光子最优路径穿过真空、只有时间最优路径保持编码；等驱动强度下 CS 容量最高，824 ns 制备保真度 0.99、最小贴近度 0.90，CD 为 0.98/0.51，SNAP 为 0.83/0.19；CS 翻转脉冲给出 \\(0.986\\) 门保真度@824 ns，而最优高斯幺正搜索不超过 0.78；\\(|0_{L}\\rangle\\) 制备可达 412 ns。","contribution":"把制备、态转移与逻辑操作纳入同一路径框架，提供可计算的硬件适配指标（capacity）与“翻转路径只宜作时长/光子成本参考、不宜作跟踪目标”这一负面结论。","limitation":"最优翻转路径无法被任何门族对全部编码输入同时跟踪（三输入最小贴近度 ≤0.31）；CS 结果假设两个逻辑态各自独立挤压（需双驱动音调）并沿用 Ref.[22] 的器件相干性，整体仍为数值方案。","key_numbers":["条件挤压 824 ns 制备 GKP，保真度 0.99、贴近度 0.90","位移 0.98/0.51，SNAP 0.83/0.19","逻辑翻转保真度 0.986 @ 824 ns；最优高斯幺正 ≤ 0.78","|0_L⟩ 制备 412 ns","翻转路径三输入最小贴近度 ≤ 0.31"],"url":"https://arxiv.org/abs/2611.15018","review":{"verdict":"小修","confidence":"高","correctness":"路径推导与数值一致：解析给出的时间最优哈密顿量、capacity 对三类门集的排序，与 GRAPE 优化后的贴近度（CS 0.90 > CD 0.51 > SNAP 0.19）互相对应；高斯幺正上限 0.78 与 0.986 的对比也自洽。","weaknesses":"· 噪声模型只含光子损耗与辅助比特退相干，未含腔热光子、控制线噪声与比特频率漂移\n· capacity 是局部几何量，文中未给出它与最终保真度之间的定量映射\n· 824 ns 与 412 ns 的时间数字依赖 Ref.[22] 的器件参数，未做跨器件扫描","overclaim":"optimal 指特定代价（固定最大控制幅度下的时间，或平均光子数）下的最优，不是硬件可实现意义的最优；文中对这一点有交代，但摘要中的 824 ns/0.99 容易被读成实验预期值。","citations":"与 GKP 制备实验（含自主纠错、平面电路）、SNAP/位移方案、强化学习与时间最优控制文献比较充分；但与纠错码层面的逻辑门开销（如格点手术）未连接。","questions":"①把容量指标映射到含噪保真度需要哪些额外假设？②双驱动条件挤压在现役器件上如何实现？③翻转路径贴近度 ≤0.31 是否意味着必须更换门族？","basis":"全文（arXiv:2611.15018 PDF）"}},{"id":"pr-10.1103/jjcg-z4xb","no":3,"topics":["测控与噪声"],"source":"PRL","venue":"Physical Review Letters","published":"2026-11-13","title":"Qubit Noise Sensing via Induced Photon Loss in a Superconducting Cavity","title_zh":"用腔中诱导光子损耗探测超导比特频率噪声","authors":["Nitzan Kahn","Dror Garti","Uri Goldblatt","Lalit M. Joshi","Fabien Lafont","Serge Rosenblum"],"abstract":"Qubit-based noise spectroscopy struggles in the few-hundred-MHz band that matters for driven gates. The authors store a single photon in a millisecond-lifetime 3D cavity coupled to a transmon and detect the extra photon loss produced by qubit frequency noise through dressed dephasing, using repeated mid-circuit measurements and post-selection. Validated with injected noise, the method bounds the intrinsic qubit-frequency noise PSD to 0.70e3 rad^2/s at 508 MHz detuning.","importance":5,"importance_reason":"把 0.1–1 GHz 这一段在强驱动（读出、参量门）下最关键却缺专用探针的频段打开，方法只需高 Q 腔与中途测量后选择，并给出可比较的定量上界，对噪声诊断很实用。","summary":"作者把单光子存进毫秒寿命的三维腔，利用比特频率噪声引起的 dressed dephasing 把腔-比特能量交换转成可测的额外光子损耗；用重复中途测量与后选择把诱导损耗与本征衰减分开，在 508 MHz 失谐处给出本征频率噪声功率谱密度上界 \\(0.70\\times10^{3}\\) rad²/s。","problem":"常规噪声谱学以比特自身为探针：Ramsey 干涉只有 kHz 量级，动力学解耦到约 20 MHz，驱动演化类到约 300 MHz；更高频段靠单光子探测器或弛豫谱，代价高。介于数百 MHz 的窗口恰是读出与参量门的工作频段，却缺乏专用工具。","method":"高 Q 三维腔（\\(\\omega_{c}/2\\pi=4.308\\) GHz，单光子寿命 11.3 ms）与 transmon（\\(\\omega_{q}/2\\pi=3.800\\) GHz，\\(T_{1}=71\\) µs，\\(T_{2}^{*}=8\\) µs）色散耦合；注入单光子后用重复中途比特测量与后选择，把比特频率噪声诱导的腔-比特能量交换造成的损耗与腔内禀衰减分离；先用可标定的注入噪声验证标度关系，再据此对频率噪声 PSD 定界（腔-比特失谐 508 MHz）。","result":"诱导损耗率随注入噪声强度按预期标度；在 508 MHz 失谐处给出本征比特频率噪声 PSD 上界 \\(0.70\\times10^{3}\\) rad²/s；后选择把可探测信号从无条件衰减曲线中分离出来，使测量对诱导损耗敏感而不被腔内禀损耗淹没。","contribution":"提出以腔为探针、后选择分离信号的高频比特噪声谱学方案，把可及频段从 ≤300 MHz 推到约 0.5 GHz 量级，并在该失谐点给出定量上界。","limitation":"单点频率、单一器件；上界受后选择效率与测量时长/比特寿命比（ξ 因子）限制，测量时间远大于诱导损耗率时信号被抹平；从诱导损耗反推 PSD 依赖 dressed-dephasing 微扰公式，强驱动与非马尔可夫修正未讨论。","key_numbers":["本征频率噪声 PSD 上界 0.70e3 rad²/s @ 508 MHz 失谐","腔单光子寿命 11.3 ms，ωc/2π = 4.308 GHz","比特 T1 = 71 µs，ωq/2π = 3.800 GHz","可及频段从 ≤300 MHz 推到 ~0.5 GHz"],"url":"https://doi.org/10.1103/jjcg-z4xb","review":{"verdict":"接受","confidence":"高","correctness":"实验闭环完整：注入噪声标定给出标度关系，再用于本征噪声定界；后选择把诱导损耗与本征衰减分离的做法与给出的损耗率、寿命参数自洽；给出的上界在量级上也与器件一致性水平相符。","weaknesses":"· 只在一个失谐点（508 MHz）给出上界，未给 PSD 随频率的谱形\n· 后选择效率与可达信噪比的权衡只以 ξ 因子概括\n· 比特频率与腔频率的稳定性在长积分时间下的漂移未评估","overclaim":"摘要与正文把结果表述为上界（bound），措辞克制；但“extends the accessible band”是对单一频段的推广，若被引作宽带谱学工具需附加条件。","citations":"与 Ramsey、动力学解耦、驱动演化谱学、单光子探测/弛豫谱等已有手段逐一对比并说明了频段覆盖，引用结构清晰。","questions":"①扫描失谐即可给出连续 PSD 吗，代价多大？②后选择判据在 T1 抖动下如何保持无偏？③该方法能否用于读出脉冲进行中的噪声？","basis":"全文（arXiv:2603.06848 镜像 PDF，与刊出版本同稿）"}},{"id":"nature-10.1038/s41567-026-03499-7","no":4,"topics":["测控与噪声","算法"],"source":"Nature 系列","venue":"Nature Physics","published":"2026-11-12","title":"Optimal learning of quantum channels in diamond distance","title_zh":"量子信道在钻石范数下的最优学习","authors":["Antonio Anna Mele","Lennart Bittel"],"abstract":"Process tomography is the primitive for calibrating noisy devices, yet the query cost of learning a channel in diamond distance was open. The authors give an algorithm using O(d_in d_out k / eps^2) channel queries for Kraus rank k, prove a matching lower bound at constant accuracy, and reduce channel tomography to sample-optimal pure-state tomography of the Choi state via coherent random purification.","importance":5,"importance_reason":"关掉了过程层析在钻石范数下维度依赖这一长期开放问题（上下界匹配），给出的是信息论层面的查询成本基准，可直接用于判断实验标定协议是否已接近最优。","summary":"作者证明学习一个 Kraus 秩为 \\(k\\) 的量子信道、在钻石范数下达到精度 \\(\\varepsilon\\)，需要且仅需 \\(\\Theta(d_{\\mathrm{in}}d_{\\mathrm{out}}k/\\varepsilon^{2})\\) 次信道调用（常数精度时为 \\(\\Theta(d_{\\mathrm{in}}d_{\\mathrm{out}}k)\\)）；算法把信道层析归约为 Choi 态的样本最优纯态层析，且所有调用可并行、非自适应。","problem":"态层析在迹距离下已有最优样本复杂度（约 d²），但一般量子信道在钻石范数下的查询复杂度长期只有幺正信道等特例已知；这直接决定“要多少次调用才能保证替代真实过程的最坏情形误差”。","method":"制备未知信道的多份 Choi 态副本，施加相干随机纯化（coherent random purification）把混态问题转到独立副本上的样本最优纯态层析；全部信道调用放在单个并行块（非自适应但跨次相干），再配合下界构造（含非最小 Kraus 秩所需的额外 \\(1/\\varepsilon^{2}\\) 项）。","result":"上界 \\(N=O(d_{\\mathrm{in}}d_{\\mathrm{out}}k/\\varepsilon^{2})\\)；常数精度下匹配下界 \\(\\Omega(d_{\\mathrm{in}}d_{\\mathrm{out}}k)\\)，另有 \\(\\Omega(1/\\varepsilon^{2})\\) 项对应非最小 Kraus 秩；特化后恢复秩 k 态层析 \\(\\Theta(dk/\\varepsilon^{2})\\)、幺正信道钻石范数学习 \\(\\Theta(d^{2}/\\varepsilon)\\)，Kraus 秩一的等距信道可做到 \\(O(d_{\\mathrm{in}}d_{\\mathrm{out}}/\\varepsilon^{2})\\) 而无需随机纯化。","contribution":"用统一框架囊括信道、态、幺正与测量（信道包含态、幺正、测量为特例），并说明自适应在常数精度下不改善渐近复杂度、而跨次相干确实必要。","limitation":"结果均为查询复杂度的渐近界，常数与对数因子未优化；算法要求制备 Choi 态与相干随机纯化的能力，实验上比逐门层析更苛刻；未给出有限样本下的显式误差界或具体实现。","key_numbers":["上界 O(d_in·d_out·k/ε²)","下界 Ω(d_in·d_out·k)（常数精度）与 Ω(1/ε²)（非最小 Kraus 秩）","幺正信道 Θ(d²/ε)；秩 k 态层析 Θ(dk/ε²)","Kraus 秩一：O(d_in·d_out/ε²) 无需随机纯化"],"url":"https://www.nature.com/articles/s41567-026-03499-7","review":{"verdict":"接受","confidence":"高","correctness":"上下界构造互补且与已知特例吻合（幺正信道 Θ(d²/ε) 与文献一致，秩 k 态层析退化正确），非最小 Kraus 秩产生 1/ε² 下界的论证在结构上也合理。","weaknesses":"· 常数与对数因子完全未讨论，与实验可实现的差距无法估计\n· 算法需要相干随机纯化，文中未讨论其门数开销\n· 未给出有限精度/有限样本下的显式不等式","overclaim":"optimal 指查询复杂度意义下的渐近最优，而非实验效率最优；杂志摘要（“the optimal number of uses has been found”）易被读成实用层面的最终答案。","citations":"与态层析、幺正学习、影子层析及信道区分的经典结果对照充分，并明确标出哪些特例已被先前工作覆盖。","questions":"①相干随机纯化的电路深度与容错开销是多少？②能否在有限样本下把界变成可计算的置信区间？③对含测量的信道，自适应是否在 1/ε 依赖上仍有优势？","basis":"全文（Nature Physics PDF）"}},{"id":"arxiv-2611.16595","no":5,"topics":["芯片与耦合器"],"source":"arXiv","venue":"arXiv:2611.16595 [quant-ph]","published":"2026-11-12","title":"Gatemon qubits based on in-situ ternary InAsSb/Al nanowire Josephson junctions","title_zh":"基于原位三元 InAsSb/Al 纳米线约瑟夫森结的 gatemon 比特","authors":["Zhenhai Sun","David Feldstein-Bofill","Sangeeth Kallatt","Sabbir A. Khan","Morten Kjaergaard"],"abstract":"Ternary InAsSb/Al nanowires combine a compositionally tunable semiconductor with epitaxial proximity superconductivity. The authors fabricate gatemons from shadow-defined in-situ InAsSb/Al Josephson junctions grown in a single process, demonstrate electrostatic tuning over several gigahertz, and measure coherent control with T1 = 0.79 us and T2* = 0.91 us. Across five gatemons on three chips, relaxation times span 0.2-1 us and track a spontaneous-emission estimate.","importance":4,"importance_reason":"首次把三元半导体纳米线与原位 Al 超导做成可栅调比特，并给出跨三芯片的一致性与损耗归因（电磁环境自发辐射为主），对可扩展栅调超导电路是材料级进展。","summary":"作者用单次生长中 shadow-defined 的原位 InAsSb/Al 结做出 gatemon 比特，静电调谐范围达数 GHz，观测到 Rabi 与 Ramsey 相干（代表性 T1 = 0.79 µs、T2* = 0.91 µs）。五个器件跨三片芯片的 T1 在 0.2–1 µs 间随比特频率升高而下降，量级与自发辐射到电磁环境的电路估算相当。","problem":"半导体-超导混合比特需要可重复的结工艺与可栅调弱链接；三元 InAsSb 的组分可调性与原位外延超导此前未被用于相干比特，且亚微秒弛豫的损耗来源不清。","method":"单次生长中原位形成 shadow-defined InAsSb/Al 约瑟夫森结并集成到 cQED 电路；栅压依赖的微波谱标定比特跃迁调谐，功率谱测非谐性以确认高透明弱链接，Rabi/Ramsey 测相干；对五个 gatemon（三片芯片）逐点重复 60 次 T1 测量以控制涨落，并与电磁环境自发辐射的电路模型估算比较。","result":"比特跃迁可静电调谐数 GHz；代表性 T1 = 0.79 µs、T2* = 0.91 µs；跨五器件 T1 约 0.2–1 µs，随比特频率升高而下降，重复测量给出 ⟨T1⟩ = 0.60(6) µs；量级与自发辐射估算一致，且栅线电容被认为主导。","contribution":"证明原位三元 InAsSb/Al 结是可相干操作、可栅调的电路元件，并把 cQED 确立为探测三元弱链接动力学的微波探针。","limitation":"T1 仅亚微秒，主要受栅线电容导致的 Purcell 型自发辐射限制，尚未展示通过电路设计提升的路径；样品数与统计有限，“T1 随频率下降”的解释仍以估算为主，未做损耗通道的直接分解。","key_numbers":["T1 = 0.79 µs，T2* = 0.91 µs","5 个 gatemon / 3 片芯片，T1 ≈ 0.2–1 µs","重复测量 ⟨T1⟩ = 0.60(6) µs","栅调范围数 GHz"],"url":"https://arxiv.org/abs/2611.16595","review":{"verdict":"小修","confidence":"中高","correctness":"数据链条完整：栅调谱、功率谱非谐性、Rabi/Ramsey 与跨器件 T1 统计相互印证，T1 与自发辐射估算同量级，结论与证据强度匹配。","weaknesses":"· 损耗通道只做量级比较，没有把栅线电容、结内损耗与辐射损耗定量分开\n· 五器件统计仍少，T1 随频率下降的趋势缺乏误差带与拟合\n· 未给出 T2 回波或频率噪声谱，相干性讨论停在 T2*","overclaim":"“coherent, gate-tunable circuit elements” 成立，但“introduce cQED architecture as a microwave probe”这类方法论主张需要更多器件验证；亚微秒 T1 距离实用比特仍有明显差距。","citations":"与 InAs、InAsSb、Al 及超导-半导体混合比特的既有工作比较充分，对三元合金组分工程的优势交代清楚。","questions":"①提高栅线阻抗或改用 flip-chip 能把 T1 提升多少？②结内准粒子与 Andreev 态对 1/f 噪声的贡献如何分离？③三元组分变化能否调节非谐性？","basis":"全文（arXiv:2611.16595 PDF）"}},{"id":"arxiv-2611.13791","no":6,"topics":["测控与噪声","芯片与耦合器"],"source":"arXiv","venue":"arXiv:2611.13791 [quant-ph]","published":"2026-11-10","title":"Eigenmode and field imaging of a compact superconducting resonator array","title_zh":"紧凑超导谐振腔阵列的本征模与场成像","authors":["Benedek Gaál","Vincent Jouanny","Simone Frasca","Christophe Galland","Pasquale Scarlino","Valentin Goblot"],"abstract":"Port-based microwave spectroscopy does not resolve the spatial structure of modes in superconducting resonator arrays. The authors combine laser scanning microscopy with NV-center magnetometry on a honeycomb array of 33 lumped-element resonators that hosts topological edge states, image the edge mode and its sublattice polarization, and bound the relative on-site frequency disorder to about 0.3%.","importance":4,"importance_reason":"用两种空间分辨手段互补验证阵列是否按设计实现，并明确判别“测到的极化度偏低是探针假象而非器件缺陷”，对拓扑光子/超导阵列的表征方法论有直接价值。","summary":"作者在 33 个集总元件谐振腔的蜂窝阵列上并用激光扫描显微（LSM）与 NV 色心磁强计：LSM 成像本征模，NV 在超导恢复后测驱动下的局域微波场。交叉验证显示边缘模子晶格极化 0.75（仿真 0.77），LSM 给出的约 0.28 属探针假象；在位频率无序上界约 0.3%。","problem":"端口微波谱只能给出全局模式频率，无法分辨二维阵列中模式的空间结构；而 LSM 本身是微扰手段，光照引起的失超会超出光斑之外，容易把测量假象当作结构特征。","method":"33 个集总元件谐振腔组成蜂窝晶格（设计上含拓扑边缘态）；LSM 扫描成像本征模的空间分布，NV 色心磁强计在超导态恢复后测驱动下的局域微波磁场幅度；由两种图计算不对称度、参与比与子晶格极化，并与紧束缚模型仿真对照，据此反推频率无序。","result":"NV 测得边缘模子晶格极化 0.75，接近仿真 0.77，说明 LSM 的约 0.28 主要来自探针非局域性而非晶格缺陷；在位频率无序上界约 0.3%，未发现缺陷模；NV 与边缘模频率约 11 MHz 的失谐解释了极化度相对理想值约 0.9 的偏离。","contribution":"建立 LSM + NV 的联合表征流程，并用交叉验证把探针假象与器件无序分离，为紧凑超导阵列的规模化验收提供可操作方案。","limitation":"仅在线性区、单一器件与单一晶格上验证；NV 需把跃迁调到驱动频率、积分时间长；0.3% 是无序上界而非逐点映射，对非线性区、强驱动与多模同时激发的适用性未验证。","key_numbers":["33 个集总元件谐振腔的蜂窝阵列","在位频率无序上界 ≈0.3%","边缘模子晶格极化：NV 0.75 vs 仿真 0.77（LSM ≈0.28）","边缘模与 NV 失谐 ≈11 MHz"],"url":"https://arxiv.org/abs/2611.13791","review":{"verdict":"小修","confidence":"中高","correctness":"两种独立探针的对比逻辑成立：以 NV 的局域场图为基准判定 LSM 图像的假象成分，结论与仿真和无序上界的推导一致；11 MHz 失谐的解释也与极化度偏离量级相符。","weaknesses":"· 0.3% 上界来自有限采样点的拟合，未给置信区间\n· 只测了一个边缘模，其他体模与另一条边缘的对比缺失\n· LSM 的微扰强度与失超范围未定量刻画，假象判定的普适性有限","overclaim":"“experimentally validate that the realized lattice matches the design” 略强：0.3% 无序上界与两个模式的极化只是必要条件，不能排除其他类型缺陷（耦合无序、几何偏差）。","citations":"与拓扑光子晶格、超导阵列表征、NV 磁强计成像的既有工作均有对照，方法定位清楚。","questions":"①耦合无序能否用同一套流程约束？②LSM 假象的成分能否从图像本身反演？③能否在非线性/强驱动下重复该交叉验证？","basis":"全文（arXiv:2611.13791 PDF）"}},{"id":"arxiv-2611.14484","no":7,"topics":["大规模仿真"],"source":"arXiv","venue":"arXiv:2611.14484 [quant-ph]","published":"2026-11-10","title":"Nonperturbative string dynamics in a (2+1)D lattice gauge theory on a superconducting quantum processor","title_zh":"超导量子处理器上 (2+1) 维格点规范理论的非微扰弦动力学","authors":["Sanziana Stelea","Anthony Gandon","Francesco Tacchino","Jad C. Halimeh","Ivano Tavernelli"],"abstract":"Electric flux strings underpin confinement, and their real-time evolution in two dimensions involves charge motion, pair creation and transverse deformation beyond perturbation theory. Using 63 superconducting qubits including 12 ancillas, the authors simulate a (2+1)D Z2 lattice gauge theory with dynamical matter and an explicit plaquette term, resolving string spreading in the confined and deconfined regimes while keeping Gauss-law generators measurable.","importance":4,"importance_reason":"在 63 比特上同时保留物质、规范自由度与显式 plaquette 项，使 Gauss 定律成为可测的局域稳定子，是当前数字量子模拟里少见的“非微扰 + 可纠错编码”组合，对规范理论模拟与部分容错实验都有参考价值。","summary":"作者在 63 个超导比特（含 12 个辅助比特）上编码 (2+1) 维 Z2 格点规范理论，含动力学物质与显式磁 plaquette 项，演化初始局域弦并做空间分辨测量。去禁闭区看到电荷与通量快速铺展、禁闭区物质产生集中在初始弦附近，保留规范冗余使 Gauss 定律成为可测的局域稳定子。","problem":"二维通量弦的实时演化由电荷运动、对产生与横向形变竞争决定，超出微扰论；经典张量网络受纠缠增长限制可及时长有限，因此需要量子模拟，但保留规范冗余会显著增加比特数与测量开销。","method":"63 个超导比特（含 12 辅助比特）编码 (2+1)D Z2 格点规范理论（动力学 Ising 物质 + 显式 plaquette 项），保留规范冗余编码；Trotter 演化初始局域弦（端点电荷静态或动态），空间分辨测物质占据与电场；用局域后选择配合 Clifford 微扰重标定恢复硬件期望值，并与 PEPS 在 7 个 Trotter 步内收敛的结果比较。","result":"去禁闭区观测到电荷与通量快速铺展、通量强烈振荡；禁闭区物质产生出现在对产生共振附近并集中于初始弦周围，通量定性局域在最短弦邻域；强电场下铺展被压制；弦路径占据率量化了 plaquette 操作引起的横向重排；后选择 + 重标定后与 PEPS 一致。","contribution":"给出保留规范冗余且 Gauss 定律可测的编码实现、可复用的后选择与重标定误差缓解流程，以及跨禁闭/去禁闭区的空间分辨弦动力学数据。","limitation":"演化时长受 Trotter 步数与后选择接受率限制；去禁闭区 PEPS 在键维大于 8 时收敛变慢，硬件与张量网络的可比窗口有限；重标定依赖小电场下非 Clifford 角小的假设。","key_numbers":["63 比特（含 12 个辅助比特）","PEPS 收敛至 7 个 Trotter 步","(2+1)D Z2 规范理论，含动力学物质与显式 plaquette 项"],"url":"https://arxiv.org/abs/2611.14484","review":{"verdict":"接受","confidence":"高","correctness":"数据展示与物理论证一致：去禁闭区铺展、禁闭区局域化与对产生共振附近的物质富集都能对应到 Z2 规范理论的预期，后选择 + 重标定与 PEPS 的定量吻合增强了可信度。","weaknesses":"· 与 PEPS 的比较只到 7 个 Trotter 步，之后再无独立基准\n· 后选择接受率随演化时间的下降未系统报告，实际可及时间的扩展性不明\n· 单次弦的初态选择有限，未遍历不同弦长与端点电荷配置","overclaim":"“nonperturbative” 在可及的短时窗口内成立（大 quench 令微扰论失效），但长时间行为仍受 Trotter 与读出误差限制，文中对“非微扰”的时间尺度交代可更明确。","citations":"与 Z2 规范理论量子模拟、Gauss 定律违背缓解、PEPS/张量网络方法均有对照，引用结构完整。","questions":"①后选择接受率随演化时间的曲线如何？②能否在去禁闭区提高键维以延长可比窗口？③动态端点电荷的弦断裂是否能分辨？","basis":"全文（arXiv:2611.14484 PDF）"}},{"id":"arxiv-2611.14188","no":8,"topics":["大规模仿真"],"source":"arXiv","venue":"arXiv:2611.14188 [hep-lat]","published":"2026-11-11","title":"Truncating the electric flux of a compact U(1) lattice gauge theory: a rigorous, nonasymptotic low-energy window bound","title_zh":"紧致 U(1) 格点规范理论的电场截断：严格的非渐近低能谱窗界","authors":["Ziyue Hua"],"abstract":"Simulating compact U(1) lattice gauge theory requires truncating the electric flux, usually without a rigorous error guarantee. The author proves a nonasymptotic tail-norm bound holding for every normalized vector in the vacuum-relative low-energy window of the pure compact U(1) Hamiltonian on a three-dimensional periodic lattice, controls finite-time evolution against the hard-wall model, and shows that cutoffs scaling as beta log N / log log N make truncation errors vanish under lattice refinement.","importance":4,"importance_reason":"把“电场截断”从约定俗成的近似提升为带显式界、可随格点加密收敛的证书，并给出极化等距嵌入与局域 E² 读出界，对数字量子模拟的截断误差预算（含态制备误差）是可直接引用的工具。","summary":"作者为三维周期格上纯紧致 U(1) 哈密顿量的真空相对低能谱窗给出统一截断证书：单一尾范数界对窗内任意归一化矢量（含叠加态）成立，且不含谱窗维度因子；用变分环境能量比较消去广延真空能依赖，得到 \\(\\beta\\log N/\\log\\log N\\) 型截断使误差在格点加密下消失。","problem":"把电场（玻色子）截断到有限维是数字量子模拟紧致 U(1) 规范理论的前提，但通常缺乏对整段低能谱窗、对任意叠加态一致成立的非渐近误差界；谱窗边缘间隙与简并假设往往不成立。","method":"在三维周期立方格（每方向 \\(N\\ge3\\)）、\\(\\theta=0\\)、零全局通量扇区构造真空相对谱窗内的 tail-norm 估计；用变分环境能量比较消去对广延真空能的显式依赖；二次电场能与有界近邻通量跃迁给出阶乘平方压低；再用极化分解给出把整窗嵌入截断空间的等距编码（保持与外参考的相干性），并把界推广到局域 \\(E_{l}^{2}\\) 读出。","result":"界对窗内任意归一化矢量成立且无谱窗维度因子；精确演化保持该窗，故界控制精确演化与硬墙模型演化在有限时间内的差；三维强耦合例子中识别出含真空与 162 维激发带（内含 plaquette 转变）的窗；固定裸耦合、体积、窗宽与时长时，\\(\\beta\\log N/\\log\\log N\\)（\\(\\beta>2\\)）的截断使误差在格点加密下趋于零。","contribution":"给出可核查的截断误差证书、精度依赖的充分截断表、参考纠缠输入的线性等距编码，以及把态制备误差纳入同一预算的分配方案。","limitation":"纯规范、\\(\\theta=0\\)、零通量扇区；连续极限转移以“原窗态已有一致极限”为条件；局域 \\(E_{l}^{2}\\) 的界需泄漏分布加权矩；作者自陈未做收敛数值验证，界可能明显保守；单作者、无器件或算法级对比。","key_numbers":["三维周期格（每方向 N ≥ 3），θ = 0，零全局通量扇区","强耦合例子：真空 + 162 维激发带，plaquette 信号量级 1","截断可取 β log N / log log N（β > 2）","尾范数按阶乘平方压低"],"url":"https://arxiv.org/abs/2611.14188","review":{"verdict":"大修","confidence":"中","correctness":"推导结构清晰：尾范数界来自二次电场能与有界跃迁的组合，等距嵌入保证窗内相干性不被破坏，条件性连续极限的表述也避免了越界主张，可与已有截断实践对应。","weaknesses":"· 没有任何数值实例验证界的松紧，作者自陈保守，读者无法判断实用截断能取多小\n· 只覆盖纯规范与单一扇区，动力学问物质与 θ≠0 会带来额外困难，未讨论可迁移性\n· 局域 E² 界的加权矩假设未给出可检验的判据","overclaim":"标题与摘要的 rigorous 仅指在所声明的假设内成立；对“可用于实际模拟的截断表”这一用途，缺少数值佐证使实用价值被高估。","citations":"与格点规范理论量子模拟的截断实践、U(1) 谱窗构造、张量网络截断误差分析均有对照，但对玻色子截断的既有严格结果覆盖不全。","questions":"①在三维强耦合点上，实际最小可行截断与理论表差多少？②动力学物质如何进入同一框架？③θ≠0 时谱窗与等距嵌入是否仍成立？","basis":"全文（arXiv:2611.14188 PDF）"}},{"id":"arxiv-2611.13852","no":9,"topics":["经典模拟"],"source":"arXiv","venue":"arXiv:2611.13852 [cond-mat.str-el]","published":"2026-11-11","title":"Deterministic contraction of a gauge-invariant tensor network for the pure Z2 lattice gauge theory","title_zh":"纯 Z2 格点规范理论中规范不变张量网络的确定性收缩","authors":["Giuseppe Clemente","Tomohiro Hashizume","Karl Jansen","Yantao Wu"],"abstract":"Gauged Gaussian fermionic PEPS is a manifestly gauge-invariant ansatz for (2+1)D lattice gauge theories, but variational Monte Carlo had obscured its expressive power. The authors recast the contraction as a Grassmann tensor network that can be contracted deterministically, optimize it without statistical error up to L=34 with HOTRG and in infinite volume with CTMRG, and find that only eight complex variational parameters capture the pure Z2 gauge theory across its topological transition.","importance":4,"importance_reason":"用确定性张量网络收缩替代 VMC，把“拟设够不够用”从统计噪声中解放出来，并给出仅 8 个参数即可跨相变描述 Z2 规范理论的证据，对规范理论经典模拟的拟设选择有直接指导。","summary":"作者把规范不变高斯费米子 PEPS（GGFPEPS）的整网收缩重写为 Grassmann 张量网络，含规范场求和的收缩可确定性完成：用 HOTRG 做到 L = 34 的有限体积、CTMRG 取无限体积，变分优化不再有统计误差。仅 8 个复变分参数即可描述纯 Z2 规范理论，临界耦合与文献 \\(\\lambda_{c}=0.573\\) 一致。","problem":"GGFPEPS 此前用变分蒙特卡洛优化，统计误差使变分参数难以精确确定，因此无法可靠判断该拟设在跨拓扑相变时的表达力，也难以把截断误差与采样误差分开。","method":"把链上规范场 q 与两端虚费米子数耦合的构造重写为 Grassmann 张量网络，使整网（含 q 求和）可确定性收缩；用 HOTRG 做 L = 34 的有限体积、CTMRG 做无限体积；只保留键维截断 Dcut 作为系统误差并检验其收敛，再以自由能与弦张力等观测量定位相变。","result":"仅 8 个复变分参数就能在强耦合侧、弱耦合侧与相变附近描述纯 Z2 规范理论；由有限差分导数得到的临界耦合与文献 \\(\\lambda_{c}=0.573\\) 一致；相变两侧观测量在 HOTRG 与 CTMRG 两种收缩下相互印证，截断误差随 Dcut 增大而系统减小。","contribution":"提供可确定性收缩的 GGFPEPS 计算框架（Grassmann TN + HOTRG/CTMRG）、大体积基准，以及“极少参数即足够”的表达力结论。","limitation":"只处理 (2+1) 维纯 Z2 规范理论，无动力学物质；键维截断仍是唯一误差源但未给严格界；HOTRG 在大体积下的成本、向三维与非阿贝尔群的推广均未讨论。","key_numbers":["8 个复变分参数","HOTRG 体积至 L = 34，CTMRG 取无限体积","临界耦合与 λc = 0.573 一致","键维截断 Dcut 为唯一系统误差源"],"url":"https://arxiv.org/abs/2611.13852","review":{"verdict":"小修","confidence":"中高","correctness":"改写后的收缩与规范不变性要求一致（q 求和吸收进虚费米子数），得到的临界耦合与独立文献值吻合，且两种收缩方法的交叉验证支持结果可靠性。","weaknesses":"· Dcut 收敛曲线只给少数几个值，未给外推误差棒\n· 8 参数结论对应纯 Z2 与固定拟设结构，未测试加入动力学物质后参数需求如何增长\n· 与 QMC/张量网络重整化的成本对比缺失","overclaim":"“only eight complex variational parameters capture” 是对该相变与观测量集合成立的经验结论，不宜推广为拟设表达力的一般判据；文中措辞基本克制。","citations":"与 GGFPEPS 原始工作、Z2 规范理论临界耦合的既有数值、HOTRG/CTMRG 方法文献对应清楚。","questions":"①Dcut 外推后的临界耦合误差是多少？②引入物质场后参数数目如何增长？③三维推广的可行性如何？","basis":"全文（arXiv:2611.13852 PDF）"}},{"id":"pr-10.1103/c2s2-q5mz","no":10,"topics":["经典模拟","算法"],"source":"PRA","venue":"Physical Review A","published":"2026-11-13","title":"Stabilizer entropy of subspaces","title_zh":"子空间的稳定子熵","authors":["Simone Cepollaro","Gianluca Cuffaro","Matthew B. Weiss","Stefano Cusumano","Alioscia Hamma","Seth Lloyd"],"abstract":"Nonstabilizerness measures the cost of classically simulating a quantum state, and embedding a system into a larger Hilbert space can change it. The authors define the average stabilizer entropy gap between a subspace and the full space, give closed forms through the characteristic function of the projector, prove that averaging over subspaces reproduces the full-space value, and find zero gaps whenever the subspace dimension divides the total dimension.","importance":4,"importance_reason":"把“编码或嵌入是否白送非稳定子资源”这一直觉量化，给出可用特征函数高效计算的公式与开源实现，对判断纠错码子空间与 qudit 编码的经典可模拟性有实际意义。","summary":"作者定义子空间相对全空间的平均稳定子熵差（magic gap），用投影算符的特征函数给出子空间平均稳定子熵的闭式；证明对固定维数子空间求平均恰等于全空间的值（方差不同），并穷举发现维数整除时 magic gap 可取零，偶数多 qudit 情形还可为负。","problem":"把 d 维系统嵌入更大空间（纠错码、用 n 比特模拟 qudit、对称性约束）会改变态的非稳定子程度，但“子空间相对全空间的平均稳定子熵差”此前缺少定义、闭式表达与系统性刻画。","method":"定义平均稳定子熵（ASE，用稳定子 Rényi 熵在全稳定子态上的平均）与子空间的 magic gap；借助投影算符特征函数推导任意 Hilbert 空间与任意子空间的 ASE 闭式，使数值上可高效计算；解析证明对固定维数子空间求平均等于全空间 ASE 而方差不同；用穷举数值搜索在小维数系统里找极值子空间，并提供开源实现。","result":"维数整除（子空间维数整除总维数）时可达到零 magic gap；偶数多 qudit 的某些维数组合可实现负 gap；n 比特系统中子空间维数接近全维时 gap 普遍为负；平均相同但方差随子空间结构变化，说明均值不足以刻画资源分布。","contribution":"给出 ASE/magic gap 的可计算框架（特征函数公式 + 代码）、平均化定理，以及“何时嵌入不额外消耗 magic”的判据。","limitation":"讨论的是平均量（ASE）而非最坏情形或单个态的 magic；穷举搜索限于小维数；与具体容错协议（如魔态工厂或编码门开销）的资源换算未展开。","key_numbers":["子空间 ASE 有闭式（由投影算符特征函数给出）","维数整除 ⇒ 零 magic gap 可达","偶数多 qudit 情形可出现负 gap","开源实现随文提供"],"url":"https://doi.org/10.1103/c2s2-q5mz","review":{"verdict":"小修","confidence":"中高","correctness":"闭式推导与“平均等于全空间值”的定理对稳定子群的群论结构依赖合理，穷举结果与整除条件的对应也自洽，代码可复现。","weaknesses":"· 平均量（ASE）与“典型态”资源的关系只给方差说明，缺定量结论\n· 穷举只到小维数，维数整除⇒零 gap 的一般构造未给出解析证明\n· 与纠错码具体资源（magic 态数目、T 门开销）的接口缺失","overclaim":"标题与摘要未过度主张，但“magic gap 为负”这类结论容易被读成编码反而降低非稳定子成本，实际含义是相对全空间平均的分布差异。","citations":"与稳定子熵/magic、编码经典可模拟性、qudit 模拟文献对应完整，引用结构清晰。","questions":"①维数整除时零 gap 的最优子空间能否显式构造？②对具体 CSS 码 magic gap 是多少？③负 gap 是否对应可观测的模拟加速？","basis":"全文（arXiv:2512.23013 镜像 PDF，与刊出版本同稿）"}},{"id":"arxiv-2611.14968","no":11,"topics":["芯片与耦合器"],"source":"arXiv","venue":"arXiv:2611.14968 [cond-mat.supr-con]","published":"2026-11-11","title":"Nitride crystalline barrier epitaxial SIS Josephson junctions by MBE","title_zh":"MBE 生长的氮化物晶态势垒外延 SIS 约瑟夫森结","authors":["Manas Verma","Anand Ithepalli","Amit Rohan Rajapurohita","Eegene Clara Chung","David A. Garcia-Wetten","Naomi Pieczulewski","Danqing Wang","John G. Wright","Archit Shah","Jimy Encomendero","Rishabh Singh","Chandrashekar Savant","Hangwang Yang","Anthony Hyatt","Jaehong Choi","Thomas Varghese","Kushagra Aggarwal","Paul B. Welander","Apurva Mehta","David Schuster","Valla Fatemi","Gregory D. Fuchs","Michael C. Hamilton","Hong X. Tang","David A. Muller","Huili Grace Xing","Debdeep Jena"],"abstract":"Epitaxial crystalline tunnel barriers have been the missing piece for Josephson junctions grown by MBE. The authors realize NbN/AlN/NbN superconductor-insulator-superconductor junctions with a roughly 4.5 nm AlN barrier, measuring critical current densities near 17 A/cm2, an IcRn product of about 2.5 mV, a gap voltage of 3.7 mV, hysteretic current-voltage curves and Fraunhofer modulation of the critical current.","importance":3,"importance_reason":"用全原位 MBE 做出晶态势垒 SIS 结，把超导量子电路与 HEMT/光子器件单片集成的材料障碍推进了一步；Jc 与 IcRn 尚不达最优但工艺路线清晰、可扩展。","summary":"作者用全原位 MBE 生长 NbN/AlN/NbN 三层（AlN 约 4.5 nm），首次实现功能性氮化物晶态势垒 SIS 约瑟夫森结：18 mK 下临界电流密度约 17 A/cm²、IcRn 约 2.5 mV、能隙电压 3.7 mV，并观测到迟滞 I-V 与磁场下的 Fraunhofer 调制，确认欠阻尼 SIS 行为。","problem":"用 MOCVD/MBE 等外延手段制备晶态隧穿势垒的 SIS 结长期未实现，这限制了超导量子电路与有源电子/光子器件的单片集成，以及合金、超晶格电极等更丰富材料的使用。","method":"全原位 MBE 生长 NbN/AlN/NbN 三层（AlN 约 4.5 nm，富氮条件抑制界面反应并促进二维岛状合并），做成 mesa 圆形结；用 STEM/XRD 验证势垒连续性与厚度，在 18 mK 下测直流 I-V、临界温度与磁场下 Fraunhofer 调制。","result":"Jc 约 17 A/cm²、IcRn 约 2.5 mV、能隙电压 3.7 mV（对应电极 Δ 约 1.85 meV）、Tc = 10.82 K，给出 2Δ/kBTc 约 3.96；观察到位移迟滞的 I-V 与 Fraunhofer 调制，确认欠阻尼行为；约 5 nm 几何厚度的势垒表现出比预期更透明的电学行为，且未见 pinhole/short。","contribution":"首次给出功能性氮化物晶态势垒 MBE 结及完整超导/输运表征，打开合金与超晶格电极的扩展空间，并指向与 HEMT 等有源器件的单片集成。","limitation":"Jc 与 IcRn 距量子电路实用值仍有差距；势垒有效电学厚度小于几何厚度的机制未定论；未做比特或谐振器层面的相干验证；作者众多，关键工艺参数分散在补充材料中。","key_numbers":["AlN 势垒 ≈4.5 nm（电学有效厚度更薄）","Jc ≈ 17 A/cm²，IcRn ≈ 2.5 mV","能隙电压 3.7 mV，Δ ≈ 1.85 meV，Tc = 10.82 K，2Δ/kBTc ≈ 3.96"],"url":"https://arxiv.org/abs/2611.14968","review":{"verdict":"小修","confidence":"中高","correctness":"材料表征（STEM/XRD）与电学数据相互支撑：连续势垒 + 迟滞 I-V + Fraunhofer 调制足以证明 SIS 隧穿，2Δ/kBTc 接近 BCS 弱耦合值也支持能隙识别的可靠性。","weaknesses":"· 势垒有效透明度与几何厚度不符的解释只给假设，缺温度/厚度系列实验\n· 未评估双能隙或多通道输运的可能性\n· 器件产率与参数离散度没有报告，难以判断工艺可重复性","overclaim":"“first functional nitride crystalline barrier Josephson junctions by MBE” 在文献范围内大致成立，但“opens the doors to monolithic integration”属于愿景陈述，需要相干器件验证。","citations":"与既有外延结（AlOx、MgO、GaN 基）、氮化物超导薄膜工作对照充分，对为何此前失败的解释到位。","questions":"①势垒厚度系列的 Jc 变化能否区分直接隧穿与缺陷辅助输运？②结参数离散度多大？③在 transmon 中 T1 会受何种界面损耗限制？","basis":"全文（arXiv:2611.14968 PDF）"}},{"id":"qst-10.1088/2058-9565/aec190","no":12,"topics":["编译与验证","测控与噪声"],"source":"Quantum Science and Technology","venue":"Quantum Science and Technology","published":"2026-11-12","title":"Robustness level sets for parametric quantum gate synthesis","title_zh":"参数化量子门综合的鲁棒性水平集","authors":["Huiqi Xue","Xiu-Hao Deng"],"abstract":"Robust pulses are usually optimized one target gate at a time. The authors build a target-independent quantum control robustness landscape from the Magnus expansion of the noise propagator in the toggling frame, show that robust controls of a whole gate family lie on one zero set that is a smooth branch of dimension p minus r, and traverse it with predictor-corrector continuation at constraint residual 1e-10, covering Rx(theta) families robust to quasistatic dephasing with exact-propagation fidelity above 0.999.","importance":3,"importance_reason":"把“逐门优化”改成“沿鲁棒性零集连续延拓”，一次得到整族鲁棒脉冲，思路对参数化门（变分线路、连续角度门）的校准实用；本期唯一把编译与鲁棒控制结合的工作。","summary":"作者在 toggling frame 用 Magnus 展开构造与目标无关的量子控制鲁棒性地形（QCRL），证明参数族中所有门的鲁棒控制落在同一零集上，正则点处为 \\(p-r\\) 维光滑局部支；用预测-校正延拓（RIPV）沿该支移动单个已优化种子脉冲，约束残差 \\(10^{-10}\\)，\\(R_{x}(\\theta)\\) 全族在准静态退相位下保真度高于 0.999。","problem":"传统鲁棒脉冲逐门优化，每个门各有自己的损失地形，于是鲁棒门族只能表现为一串分别优化的脉冲，缺乏目标无关的鲁棒性判据与族级遍历方法。","method":"在 toggling frame 中用 Magnus 展开把噪声传播子的低阶项写成与目标无关的约束函数，构成 QCRL；证明参数族中所有门的鲁棒控制共享同一零集，正则点处是维数 p − r 的光滑局部支；用预测-校正延拓（RIPV）沿该支移动一个已优化的种子脉冲，并给出三轴噪声下的双控制构造。","result":"约束残差 10⁻¹⁰；对 Rx(θ) 在准静态退相位下，一条支覆盖一阶与一阶加二阶鲁棒的全族，相对失谐 4.7% 与 10.5% 内每个脉冲的精确传播保真度均高于 0.999；同一构造给出对三轴噪声鲁棒的双控制族。","contribution":"提出 QCRL 与 RIPV 的族级鲁棒控制框架，把鲁棒脉冲设计从逐目标优化变为在公共零集上的连续延拓。","limitation":"本次仅取到摘要（出版社 PDF 返回 HTML 落地页，未检出对应 arXiv 预印本），方法细节、噪声模型假设与实验验证无法核实；理论与数值均基于 Magnus 展开的低阶截断，强噪声或宽带噪声下的适用性待查。","key_numbers":["约束残差 1e-10","Rx(θ) 全族保真度 > 0.999（相对失谐 4.7% 与 10.5%）","零集正则点处为 p − r 维光滑支"],"url":"https://doi.org/10.1088/2058-9565/aec190","review":{"verdict":"小修","confidence":"低","correctness":"依据摘要，Magnus 展开低阶项的零集与“族级公共鲁棒性”的论证逻辑自洽，但一阶+二阶鲁棒与失谐容忍度之间的定量关系无法在仅有摘要的条件下核查。","weaknesses":"· 未能获取全文，无法核实数值实验设置、噪声模型与对照方法\n· 摘要未说明高阶 Magnus 项被截断后残余误差如何界定\n· 三轴噪声的双控制族只给结论，缺与逐门优化的定量比较","overclaim":"摘要中“target-independent”是关键主张，若仅在低阶截断内成立，则对宽带噪声的鲁棒性不应外推；这一点在仅有摘要时无法判定。","citations":"摘要未展示引用结构，无法评估与既有鲁棒控制（如 DRAG、复合脉冲、GRAPE 鲁棒优化）工作的区分度。","questions":"①二阶以上 Magnus 项的残余如何影响保真度？②与逐门优化相比门数/脉冲长度代价如何？③是否在真实器件上验证？","basis":"仅摘要（出版社 PDF 返回 HTML 落地页，未检出 arXiv 预印本，全文未获）"}},{"id":"pr-10.1103/qkr6-slbp","no":13,"topics":["测控与噪声","算法"],"source":"PRA","venue":"Physical Review A","published":"2026-11-13","title":"Excitation flow, positivity, and Fisher information for open subsystems of an N-qubit network","title_zh":"N 比特网络中开放子系统的激发流、正定性与 Fisher 信息","authors":["Tommy Chin","Sarah Shandera"],"abstract":"Reduced dynamics of a subsystem can be non-positive even when the global evolution is unitary. For an N-qubit network with a single conserved excitation, the authors derive closed-form propagators for every K-qubit subsystem, show that all of them are governed by one transition amplitude that also fixes subsystem entanglement entropy and excitation flow, and prove that positivity coincides with complete positivity for every subsystem size.","importance":3,"importance_reason":"用可解模型把子系统约化动力学的正定性与完全正定性同单一跃迁振幅、激发流方向联系起来，为“约化动力学何时能当量子通道处理”提供了明确判据与反例来源。","summary":"作者在单激发守恒的 N 比特网络上给出每个 K 比特子系统的闭式传播子，证明所有约化动力学都由同一跃迁振幅 \\(u_{d}(t)\\) 控制：该振幅同时决定子系统纠缠熵、激发流、每个传播子的正定性与完全正定性，以及全局参数的量子 Fisher 信息。正定性与完全正定性在所有子系统尺寸上都等价。","problem":"全局幺正演化下子系统的约化动力学通常不是完全正定的，甚至可能不正定；何时可以用量子通道描述、与纠缠或激发流的关系缺乏可解且一般的例子。","method":"构造 N 比特、单激发守恒的显式网络模型；对每个 K 比特子系统推导闭式传播子；用单一跃迁振幅 \\(u_{d}(t)\\) 统一描述纠缠熵、子系统间激发流、传播子的正定性与完全正定性，以及全局参数的量子 Fisher 信息，并对两类动力学（不同跃迁方向）分别讨论。","result":"对所有子系统尺寸与两类动力学，正定性与完全正定性等价，且只由“到不动点的迹距离变化方向”决定；该方向与子系统-其余网络的纠缠熵没有直接对应；量子 Fisher 信息同样由这一跃迁振幅给出，可与激发流方向分离。","contribution":"给出闭式可解基准与统一判据，可作为检验“约化动力学能否近似为通道”的解析与数值试验台。","limitation":"单激发守恒是强限制，结论向多激发、含噪或有限温度系统的推广未证明；未讨论测量反作用；偏理论，缺少与超导或离子阱实验的对接建议。","key_numbers":["单激发守恒的 N 比特网络，对每个 K 比特子系统给出闭式传播子","正定性与完全正定性对所有子系统尺寸等价","量子 Fisher 信息由同一跃迁振幅决定"],"url":"https://doi.org/10.1103/qkr6-slbp","review":{"verdict":"大修","confidence":"中","correctness":"闭式解与单激发守恒的代数结构一致，正定性⇔完全正定性的论证在小尺寸上可检验；但“由迹距离变化方向唯一决定”这一表述的适用范围较窄，需更多例子支撑。","weaknesses":"· 模型高度受限（单激发、无噪声），结论对实际器件的可迁移性未评估\n· 与既有非 CP 约化动力学文献的对比偏少，缺少反例坐标的定位\n· Fisher 信息部分只给形式结果，没有给出可测的协议","overclaim":"摘要中“positivity coincides with complete positivity”容易被读成普遍结论，实际仅在单激发守恒网络的所有子系统尺寸上成立。","citations":"与开放量子系统非马尔可夫性、CP 可分性判据、量子 Fisher 信息文献有对照，但覆盖不够系统。","questions":"①加入少量激发数损耗后等价性是否保持？②迹距离变化方向能否由实验测得？③Fisher 信息结果对应什么可执行估计方案？","basis":"全文（arXiv:2605.15036 镜像 PDF，与刊出版本同稿）"}},{"id":"arxiv-2611.16610","no":14,"topics":["算法"],"source":"arXiv","venue":"arXiv:2611.16610 [quant-ph]","published":"2026-11-12","title":"Quantum algorithm for all eigenvalues and eigenstates of a sparse Hermitian matrix","title_zh":"计算稀疏 Hermitian 矩阵全部本征值与本征态的量子算法","authors":["Hanqing Liu","Xiaopeng Wu","Zhaoyang Wang","Hongwei Lin","Peng Zhang"],"abstract":"Computing the whole spectrum of a sparse Hermitian matrix classically costs O(n^3) or O(n^2 s). The authors give a quantum algorithm that outputs all distinct eigenvalues as binary strings to a prescribed precision together with eigenstates kept as quantum states, running in O~(n s^2 log^2 n / Delta_min), an improvement whenever the inverse minimum gap is at most O(n).","importance":3,"importance_reason":"在最小谱隙倒数 Δ_min⁻¹ = O(n) 的实用区间给出优于经典 O(n³) 的端到端谱计算复杂度，且把本征态直接留作量子态供期望值估计，对量子模拟中的谱分析子程序有参考价值。","summary":"作者给出返回稀疏 Hermitian 矩阵全部互异本征值（二进制串表征到给定精度）与本征态（保留为量子态）的量子算法，运行时间 \\(\\tilde{O}(ns^{2}\\log^{2}n/\\Delta_{\\min})\\)；当 \\(\\Delta_{\\min}^{-1}=O(n)\\) 时优于经典 \\(O(n^{3})\\)，覆盖等间距谱（自旋链完美态传输、自旋-j、Sylvester–Kac 矩阵）等情形。","problem":"稀疏 Hermitian 矩阵的全谱计算经典上是 O(n³)（稠密）或 O(n²s)（Lanczos 迭代），而后者的本征矢恢复同样昂贵；量子侧已有相位估计与 Hamiltonian 模拟子程序，但没有给出“全部本征值加对应本征态”的端到端复杂度。","method":"结合 Hamiltonian 模拟与相位估计，按精度把本征值编码为二进制串并认定互异值，同时对本征空间制备量子态；对 \\(n\\times n\\)、s-稀疏矩阵给出运行时间 \\(\\tilde{O}(ns^{2}\\log^{2}n/\\Delta_{\\min})\\)，其中 \\(\\Delta_{\\min}\\) 为最小谱隙（需已知下界）；覆盖等间距谱情形并讨论精度与重叠概率的放大。","result":"运行时间 \\(\\tilde{O}(ns^{2}\\log^{2}n/\\Delta_{\\min})\\)；当 \\(\\Delta_{\\min}^{-1}=O(n)\\) 时优于经典 \\(O(n^{3})\\)；对等间距谱（完美态传输自旋链、自旋-j 角动量算符、Sylvester–Kac 矩阵）给出实例分析；本征矢以量子态形式保留，可直接估计 \\(\\langle x|M|x\\rangle\\)。","contribution":"给出全谱加本征态的统一量子算法与复杂度界，并与经典稠密/Lanczos 方法做明确对比，同时指出“需要 Δ_min 下界”这一关键输入假设。","limitation":"依赖 Δ_min 的已知下界（近似简并时复杂度迅速恶化）；作者自陈未做数值验证；相位估计精度需 log n 量级，实际比特数与电路深度常数未评估；对稀疏访问模型（sparse access）要求较强。","key_numbers":["Õ(n s² log²n / Δ_min)","经典对照 O(n³)（稠密）与 O(n²s)（Lanczos）","Δ_min⁻¹ = O(n) 时优于经典"],"url":"https://arxiv.org/abs/2611.16610","review":{"verdict":"小修","confidence":"中","correctness":"复杂度推导与相位估计/模拟的既有界相容，等间距谱实例的讨论合理；但 Δ_min 下界这一输入假设对实用性的限制在文中被压缩处理。","weaknesses":"· 完全没有数值实验，常数与端点情形未验证\n· 依赖已知 Δ_min 下界，而该下界本身通常难以获得\n· 与变分量子求本征值（VQE）及经典 Lanczos 在中等规模的实际对比缺失","overclaim":"“outperforms classical algorithms” 只在 Δ_min⁻¹ = O(n) 且忽略常数与对数因子时成立，摘要对此条件有提及但易被忽略。","citations":"与量子相位估计、量子线性代数算法、经典 Lanczos/稠密对角化文献对应清楚，但对该方向近年量子全谱算法的比较偏少。","questions":"①Δ_min 下界未知时能否用自适应策略？②电路深度的实际常数多大？③能否给出中等规模的数值或资源估算？","basis":"全文（arXiv:2611.16610 PDF）"}}]}</script>
<script>
(function () {
  "use strict";
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  const META = DATA.meta || {};
  const ARTICLES = Array.isArray(DATA.articles) ? DATA.articles : [];
  const STORE_KEY = "ftqc-digest-v2";
  const STATUS_LABEL = { inbox: "待读", reading: "在读", done: "已提炼" };
  const IMP_LABEL = { 5: "必读", 4: "高", 3: "中", 2: "参考", 1: "低" };
  const IMP_STYLE = {
    5: ["#c62828", "#fdeaea"],
    4: ["#1f4fd1", "#e9efff"],
    3: ["#087a5b", "#e3f6ee"],
    2: ["#9a5b00", "#fff3d6"],
    1: ["#6b7280", "#f0f1f1"]
  };
  const PALETTE = [
    ["#1f4fd1", "#e9efff"],
    ["#c2410c", "#fff0e6"],
    ["#087a5b", "#e3f6ee"],
    ["#6d45c7", "#f0eaff"],
    ["#9a5b00", "#fff3d6"],
    ["#b3266e", "#fde8f2"],
    ["#0e7490", "#e2f5f8"]
  ];
  const SOURCE_STYLE = {
    "arXiv": ["#c2410c", "#fff0e6"],
    "PRX": ["#1f4fd1", "#e9efff"],
    "PRX Quantum": ["#6d45c7", "#f0eaff"]
  };
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const esc = (v) => String(v == null ? "" : v)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  let store = {};
  try { store = JSON.parse(localStorage.getItem(STORE_KEY) || "{}") || {}; } catch (e) { store = {}; }
  const wf = (id) => store[id] || (store[id] = { status: "inbox", note: "" });
  const save = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) { toast("浏览器阻止本地存储，修改仅在当前页有效"); } };
  let toastTimer;
  function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1800); }
  const dateOnly = (v) => String(v || "").slice(0, 10);

  // topic palette, stable by first appearance
  const allTopics = [];
  ARTICLES.forEach(a => (a.topics || []).forEach(t => { if (!allTopics.includes(t)) allTopics.push(t); }));
  const topicColor = {};
  allTopics.forEach((t, i) => { topicColor[t] = PALETTE[i % PALETTE.length]; });
  const sourceCounts = {};
  ARTICLES.forEach(a => { sourceCounts[a.source] = (sourceCounts[a.source] || 0) + 1; });
  const mustRead = ARTICLES.filter(a => a.importance >= 5).length;

  $("#pageTitle").textContent = META.title || "文献速递";
  $("#pageSubtitle").textContent = META.subtitle || "容错量子计算与超导量子计算机仿真";
  $("#issueDate").textContent = META.issue_date || "—";
  const reviewed = ARTICLES.filter(a => a.review).length;
  $("#issueCounts").innerHTML = `${ARTICLES.length} 篇 · 必读 <b>${mustRead}</b> 篇${reviewed ? ` · AI 审稿 ${reviewed}` : ""}`;
  $("#asOf").textContent = META.collection_window || ("数据截至 " + (META.as_of || "—"));
  $("#generatedAt").textContent = META.generated_at || "—";
  $("#scopeLink").href = META.scope_href || "../SCOPE.md";

  const GROUP_STYLE = {
    "arXiv": "#c2410c",
    "PR 系列": "#1f4fd1",
    "Nature 系列": "#087a5b",
    "Quantum": "#6d45c7",
    "Science Advances": "#b3266e",
    "SciPost Physics": "#0e7490",
    "AVS Quantum Science": "#7a4bb5",
    "Quantum Science and Technology": "#9a5b00",
    "Cryptology ePrint Archive": "#8a5200"
  };
  const journalRows = Array.isArray(META.journals) ? META.journals : [];
  const totals = META.coverage_totals || {
    raw: journalRows.reduce((n, r) => n + Number(r.raw || 0), 0),
    deduped: journalRows.reduce((n, r) => n + Number(r.raw || 0), 0),
    screened: journalRows.reduce((n, r) => n + Number(r.screened || 0), 0),
    included: journalRows.reduce((n, r) => n + Number(r.included || 0), 0)
  };
  $("#coverage").innerHTML = `<details class="coverage">
    <summary><span>检索覆盖</span><span class="nums">抓取 ${totals.raw} · 去重 ${totals.deduped} · 关键词初筛 ${totals.screened} · 收录 ${totals.included}</span></summary>
    <div class="coverage-body">
      <table class="coverage-table">
        <thead><tr><th>来源 / 期刊</th><th>状态</th><th class="num">抓取</th><th class="num">关键词初筛</th><th class="num">收录</th></tr></thead>
        <tbody>
          ${journalRows.map(r => {
            const color = GROUP_STYLE[r.label] || GROUP_STYLE[r.group] || "#303030";
            const st = r.status || "ok";
            const stLabel = st === "ok" ? "正常" : st === "partial" ? "部分" : "失败";
            const stCell = `<td><span class="st st-${st}">${stLabel}</span></td>`;
            if (r.kind === "group") {
              return `<tr class="group"><td>${esc(r.label)}</td>${stCell}<td class="num">${r.raw}</td><td class="num">${r.screened}</td><td class="num">${r.included}</td></tr>`;
            }
            return `<tr class="${r.kind === "journal" ? "sub" : "single"}"><td><span class="coverage-source"><span class="source-dot" style="--sc:${color}"></span>${esc(r.label)}</span></td>${stCell}<td class="num">${r.raw}</td><td class="num">${r.screened}</td><td class="num"><b>${r.included}</b></td></tr>`;
          }).join("")}
          <tr class="total"><td>合计（去重后）</td><td>—</td><td class="num">${totals.deduped}</td><td class="num">${totals.screened}</td><td class="num">${totals.included}</td></tr>
        </tbody>
      </table>
    </div>
  </details>`;

  // keyword bar
  const state = { topic: "all" };
  function countTopic(t) { return ARTICLES.filter(a => (a.topics || []).includes(t)).length; }
  function renderKeywordBar() {
    const items = [`<button class="kbtn kbtn-all" data-topic="all" aria-pressed="${state.topic === "all"}">全部<span class="c">${ARTICLES.length}</span></button>`];
    allTopics.forEach(t => {
      const [c, bg] = topicColor[t];
      items.push(`<button class="kbtn" data-topic="${esc(t)}" aria-pressed="${state.topic === t}" style="--tc:${c};--tbg:${bg}">${esc(t)}<span class="c">${countTopic(t)}</span></button>`);
    });
    $("#keywordBar").innerHTML = items.join("");
  }
  renderKeywordBar();

  function impColor(v) { return IMP_STYLE[v] || IMP_STYLE[1]; }
  function sourcePill(source) {
    const [c, bg] = SOURCE_STYLE[source] || ["#4b514c", "#f0f1f1"];
    return `<span class="source-pill" style="--sc:${c};--sbg:${bg}">${esc(source)}</span>`;
  }
  function topicChips(a) {
    return (a.topics || []).map(t => {
      const [c, bg] = topicColor[t] || ["#4b514c", "#f0f1f1"];
      return `<span class="topic" style="--tc:${c};--tbg:${bg}">${esc(t)}</span>`;
    }).join("");
  }


  function reviewPoints(text) {
    let t = String(text || "").trim();
    if (!t) return ["（未提供）"];
    let parts = t.split(/(?=（\d+）)|(?=\(\d+\)\s)/).map(s => s.trim()).filter(Boolean);
    if (parts.length === 1) {
      parts = t.split(/\n+/).map(s => s.trim()).filter(Boolean);
    }
    if (parts.length === 1 && /[；;]/.test(t) && t.length > 120) {
      parts = t.split(/[；;]/).map(s => s.trim()).filter(Boolean);
    }
    if (parts.length === 1) {
      const sentences = t.match(/[^。！？]+[。！？]?/g) || [t];
      if (sentences.length > 1) parts = sentences.map(s => s.trim()).filter(Boolean);
    }
    const expanded = [];
    for (const part of parts) {
      if (part.length > 420 && /[；;]/.test(part)) {
        expanded.push(...part.split(/[；;]/).map(s => s.trim()).filter(Boolean));
      } else {
        expanded.push(part);
      }
    }
    return expanded.map(s => s.replace(/^[（(]?\d+[）)]?\s*/, "").trim()).filter(Boolean);
  }
  function reviewList(text) {
    return `<ul>${reviewPoints(text).map(p => `<li>${esc(p)}</li>`).join("")}</ul>`;
  }
  function reviewHTML(a) {
    const r = a.review;
    if (!r) return "";
    return `<details class="review">
      <summary>AI 审稿</summary>
      <div class="review-body">
        <div class="review-block"><h3>核心主张是否成立</h3>${reviewList(r.correctness)}</div>
        <div class="review-block"><h3>主要缺陷</h3>${reviewList(r.weaknesses)}</div>
        <div class="review-block"><h3>是否夸大</h3>${reviewList(r.overclaim)}</div>
        <div class="review-block"><h3>需要核对的引用 / 实验</h3>${reviewList(r.citations)}</div>
        <div class="review-block"><h3>要作者回答的问题</h3>${reviewList(r.questions)}</div>
        <p class="review-meta">${esc(r.basis)} · AI 生成的批判性审稿，不是同行评审；结论以原文为准。</p>
      </div>
    </details>`;
  }

  function entryHTML(a) {
    const w = wf(a.id);
    const [ic, ib] = impColor(a.importance);
    const opts = Object.entries(STATUS_LABEL).map(([k, v]) => `<option value="${k}"${w.status === k ? " selected" : ""}>${v}</option>`).join("");
    return `<article class="entry" id="p-${String(a.no).padStart(2, "0")}" data-id="${esc(a.id)}" style="--imp:${ic};--imp-bg:${ib}">
      <aside class="rail">
        <div class="no">${String(a.no).padStart(2, "0")}</div>
        <span class="imp-badge" title="${esc(a.importance_reason || "")}" aria-label="重要性 ${a.importance} / 5，${IMP_LABEL[a.importance]}"><span>${a.importance}</span><span class="den">/5</span></span>
        <span class="imp-label">${esc(IMP_LABEL[a.importance] || "")}</span>
      </aside>
      <div class="entry-body">
        <div class="entry-meta">
          ${sourcePill(a.source)}<span class="sep">·</span><time datetime="${esc(dateOnly(a.published))}">${esc(dateOnly(a.published))}</time><span class="sep">·</span><span>${esc(a.venue || "")}</span>
        </div>
        <h2><a href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">${esc(a.title)}</a></h2>
        <p class="title-zh">${esc(a.title_zh)}</p>
        <p class="authors">${esc((a.authors || []).join(" · "))}</p>
        <div class="topics">${topicChips(a)}</div>
        <p class="imp-reason"><b>重要性 ${a.importance}/5 · ${esc(IMP_LABEL[a.importance] || "")}</b> · ${esc(a.importance_reason || "")}</p>
        <p class="summary"><b>结论</b>${esc(a.summary)}</p>
        <div class="analysis">
          <div><h3>问题</h3><p>${esc(a.problem)}</p></div>
          <div><h3>方法</h3><p>${esc(a.method)}</p></div>
          <div><h3>结果</h3><p>${esc(a.result)}</p></div>
          <div><h3>关键贡献</h3><p>${esc(a.contribution)}</p></div>
          <div class="wide"><h3>局限 / 待核验</h3><p>${esc(a.limitation)}</p></div>
        </div>
        <div class="keynums"><span class="label">关键数字</span>${(a.key_numbers || []).map(k => `<span class="kn">${esc(k)}</span>`).join("")}</div>
        <div class="entry-foot">
          <div class="entry-actions">
            <select class="status-select" data-status="${esc(a.id)}" aria-label="阅读状态">${opts}</select>
            <button class="textbtn" type="button" data-note-toggle="${esc(a.id)}">${w.note ? "编辑笔记" : "笔记"}</button>
            <a class="link" href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">原文 ↗</a>
            ${a.pdf_url ? `<a class="link" href="${esc(a.pdf_url)}" target="_blank" rel="noopener noreferrer">PDF</a>` : ""}
            ${a.doi ? `<a class="link" href="https://doi.org/${esc(a.doi)}" target="_blank" rel="noopener noreferrer">DOI</a>` : ""}
          </div>
        </div>
        <details class="abstract"><summary>摘要原文</summary><p>${esc(a.abstract || "摘要待补。")}</p></details>
        ${reviewHTML(a)}
        <div class="note-wrap" data-note-wrap="${esc(a.id)}"${w.note ? "" : " hidden"}>
          <textarea class="note-area" data-note="${esc(a.id)}" placeholder="记录：值得记下的方法、需要核对的数字、与你当前工作的连接…">${esc(w.note)}</textarea>
          <div class="note-meta"><span data-save-status="${esc(a.id)}">${w.note ? "已从本机恢复" : "自动保存在本机"}</span><button class="textbtn" type="button" data-export-one="${esc(a.id)}">导出此条</button></div>
        </div>
      </div>
    </article>`;
  }

  function renderTOC() {
    const list = ARTICLES.slice().sort((a, b) => a.no - b.no);
    $("#tocList").innerHTML = list.map(a => `<li><a href="#p-${String(a.no).padStart(2, "0")}" data-toc-link><span class="toc-no">${String(a.no).padStart(2, "0")}</span><span>${esc(a.title_zh || a.title)}</span></a></li>`).join("");
  }
  function closeTOC() {
    $("#tocPanel").hidden = true;
    $("#tocToggle").setAttribute("aria-expanded", "false");
  }

  function typesetMath() {
    if (!window.MathJax || !MathJax.typesetPromise) return;
    const run = () => MathJax.typesetPromise([$("#entries")]).catch(err => console.warn("MathJax:", err));
    if (MathJax.startup && MathJax.startup.promise) MathJax.startup.promise.then(run);
    else run();
  }

  function render() {
    const list = ARTICLES.filter(a => state.topic === "all" || (a.topics || []).includes(state.topic)).sort((a, b) => a.no - b.no);
    $("#entries").innerHTML = list.map(entryHTML).join("");
    $("#emptyState").innerHTML = ARTICLES.length
      ? `<b>这个关键词下暂无条目</b>点“全部”回到完整列表。`
      : `<b>本轮无新增论文</b>数据时间范围内没有新增条目。`;
    $("#emptyState").classList.toggle("show", list.length === 0);
    $("#listSummary").innerHTML = `显示 <b>${list.length}</b> / ${ARTICLES.length} 篇`;
    $$(".kbtn").forEach(b => b.setAttribute("aria-pressed", String(state.topic === b.dataset.topic)));
    typesetMath();
  }

  $("#keywordBar").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-topic]");
    if (!btn) return;
    state.topic = btn.dataset.topic;
    render();
  });

  $("#entries").addEventListener("click", (e) => {
    const toggle = e.target.closest("[data-note-toggle]");
    if (toggle) {
      const wrap = document.querySelector(`[data-note-wrap="${CSS.escape(toggle.dataset.noteToggle)}"]`);
      if (wrap) { wrap.hidden = !wrap.hidden; if (!wrap.hidden) wrap.querySelector("textarea")?.focus(); }
      return;
    }
    const one = e.target.closest("[data-export-one]");
    if (one) {
      const a = ARTICLES.find(x => x.id === one.dataset.exportOne);
      download(`note-${a.no}-${a.id}.json`, { article: { id: a.id, title: a.title, url: a.url }, workflow: wf(a.id) });
      toast("已导出此条");
    }
  });

  $("#entries").addEventListener("change", (e) => {
    const sel = e.target.closest("[data-status]");
    if (!sel) return;
    const w = wf(sel.dataset.status); w.status = sel.value; save();
    toast("状态已保存：" + STATUS_LABEL[w.status]);
  });
  let noteTimer;
  $("#entries").addEventListener("input", (e) => {
    const ta = e.target.closest("[data-note]");
    if (!ta) return;
    const w = wf(ta.dataset.note); w.note = ta.value;
    const label = document.querySelector(`[data-save-status="${CSS.escape(ta.dataset.note)}"]`);
    if (label) label.textContent = "正在保存…";
    clearTimeout(noteTimer);
    noteTimer = setTimeout(() => {
      save();
      if (label) label.textContent = "已保存 · " + new Date().toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });
    }, 300);
  });

  function download(filename, payload) {
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
  }
  $("#exportBtn").addEventListener("click", () => {
    download(`reading-notes-${META.issue_date || "digest"}.json`, {
      exported_at: new Date().toISOString(), issue: META.issue_date,
      articles: ARTICLES.map(a => ({ id: a.id, no: a.no, title: a.title, topics: a.topics, url: a.url, ...wf(a.id) }))
    });
    toast("已导出全部笔记与公式修改");
  });
  $("#printBtn").addEventListener("click", () => window.print());

  document.addEventListener("toggle", (e) => {
    if (e.target.matches && e.target.matches("details.abstract, details.review")) typesetMath();
  }, true);

  const TOC_POS_KEY = "qc-toc-pos-v1";
  const tocDesktop = window.matchMedia("(hover: hover) and (pointer: fine)");
  let tocDrag = null;
  let tocMoved = false;
  let suppressTocClick = false;
  function isDesktopToc() { return tocDesktop.matches; }
  function setTocPosition(left, top) {
    if (isDesktopToc()) return;
    const box = $("#toc");
    const maxLeft = Math.max(0, window.innerWidth - box.offsetWidth);
    const maxTop = Math.max(56, window.innerHeight - box.offsetHeight - 8);
    const x = Math.max(0, Math.min(maxLeft, Math.round(left)));
    const y = Math.max(56, Math.min(maxTop, Math.round(top)));
    box.style.left = x + "px";
    box.style.top = y + "px";
    box.style.bottom = "auto";
    box.classList.toggle("right", x > window.innerWidth / 2);
    return { left: x, top: y };
  }
  function saveTocPosition() {
    if (!isDesktopToc()) {
      const box = $("#toc");
      const r = box.getBoundingClientRect();
      try { localStorage.setItem(TOC_POS_KEY, JSON.stringify({ left: r.left, top: r.top })); } catch (e) {}
    }
  }
  function snapToc() {
    const box = $("#toc");
    const r = box.getBoundingClientRect();
    const left = (r.left + r.width / 2 < window.innerWidth / 2)
      ? 0
      : Math.max(0, window.innerWidth - r.width);
    const pos = setTocPosition(left, r.top);
    if (pos) { try { localStorage.setItem(TOC_POS_KEY, JSON.stringify(pos)); } catch (e) {} }
  }
  function restoreTocPosition() {
    if (isDesktopToc()) return;
    try {
      const raw = localStorage.getItem(TOC_POS_KEY);
      if (raw) {
        const p = JSON.parse(raw);
        if (typeof p.left === "number" && typeof p.top === "number") setTocPosition(p.left, p.top);
      }
    } catch (e) {}
  }
  function collapseDesktopToc() {
    const box = $("#toc");
    box.classList.add("collapsed");
    document.body.classList.remove("toc-open");
    $("#tocPanel").hidden = true;
    $("#tocToggle").setAttribute("aria-expanded", "false");
  }
  function openDesktopToc() {
    const box = $("#toc");
    box.classList.remove("collapsed");
    document.body.classList.add("toc-open");
    $("#tocPanel").hidden = false;
    $("#tocToggle").setAttribute("aria-expanded", "true");
  }
  function applyTocMode() {
    const box = $("#toc");
    if (isDesktopToc()) {
      box.style.left = "";
      box.style.top = "";
      box.style.bottom = "";
      $("#tocClose").textContent = "收起";
      openDesktopToc();
    } else {
      document.body.classList.remove("toc-open");
      box.classList.remove("collapsed");
      $("#tocClose").textContent = "×";
      closeTOC();
      restoreTocPosition();
    }
  }
  tocDesktop.addEventListener("change", applyTocMode);
  $("#tocToggle").addEventListener("pointerdown", (e) => {
    if (isDesktopToc()) return;
    const box = $("#toc");
    const r = box.getBoundingClientRect();
    tocDrag = { x: e.clientX, y: e.clientY, left: r.left, top: r.top };
    tocMoved = false;
    try { $("#tocToggle").setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  });
  $("#tocToggle").addEventListener("pointermove", (e) => {
    if (!tocDrag) return;
    const dx = e.clientX - tocDrag.x;
    const dy = e.clientY - tocDrag.y;
    if (Math.abs(dx) + Math.abs(dy) > 5) tocMoved = true;
    setTocPosition(tocDrag.left + dx, tocDrag.top + dy);
  });
  $("#tocToggle").addEventListener("pointerup", () => {
    if (!tocDrag) return;
    if (tocMoved) {
      suppressTocClick = true;
      snapToc();
      setTimeout(() => { suppressTocClick = false; }, 150);
    }
    tocDrag = null;
  });
  $("#tocToggle").addEventListener("click", () => {
    if (suppressTocClick) return;
    if (isDesktopToc()) {
      if ($("#toc").classList.contains("collapsed")) openDesktopToc();
      else collapseDesktopToc();
      return;
    }
    if ($("#tocPanel").hidden) {
      $("#tocPanel").hidden = false;
      $("#tocToggle").setAttribute("aria-expanded", "true");
    } else {
      closeTOC();
    }
  });
  $("#tocClose").addEventListener("click", () => {
    if (isDesktopToc()) collapseDesktopToc(); else closeTOC();
  });
  $("#tocPanel").addEventListener("click", (e) => {
    if (e.target.closest("[data-toc-link]") && !isDesktopToc()) closeTOC();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      if (isDesktopToc()) collapseDesktopToc(); else closeTOC();
    }
  });
  window.addEventListener("resize", () => {
    if (isDesktopToc()) return;
    const box = $("#toc");
    const r = box.getBoundingClientRect();
    setTocPosition(r.left, r.top);
  });
  applyTocMode();

  renderTOC();
  render();
})();
</script>
</body>
</html>
