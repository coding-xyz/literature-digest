lculations. For a quench of the two-dimensional transverse-field Ising model at the critical field, we simulate the magnetization of an $11\\times11$ open lattice up to $t=1.20$ by combining state and operator evolution over intervals $t_S=t_H=0.60$. We compare the dynamics with iPEPS, numerical linked-cluster expansion, and X-truncated sparse Pauli dynamics results. We also combine exact state evolution on small clusters with operator propagation on a larger lattice, improving agreement with iPEPS relative to cluster evolution alone. We further derive error bounds showing how the state can suppress operator errors and the evolved observable can reduce sensitivity to state errors.","abstract_zh":"量子多体动力学的经典模拟面临互补的限制：纠缠增长限制了薛定谔图像下的态演化，而算子扩散使海森堡图像下的计算日益昂贵。本文把两种途径结合起来，独立地演化量子态与可观测量，并通过大规模并行的张量网络收缩把二者的动力学拼接起来。我们用树张量网络与稀疏 Pauli 传播实现该策略，在我们的计算中把演化时间推到任一方法单独所能达到的时间之外。对于临界场下二维横场 Ising 模型的一次淬火，我们通过在区间 \\(t_S=t_H=0.60\\) 上组合态演化与算子演化，把 \\(11\\times11\\) 开边界格点的磁化模拟到 \\(t=1.20\\)。我们把该动力学与 iPEPS、数值关联集团展开以及 X 截断的稀疏 Pauli 动力学结果做了比较。我们还将小集团上的精确态演化与更大格点上的算子传播相结合，相对于仅用集团演化提高了与 iPEPS 的一致性。我们进一步推导了误差界，说明态如何压制算子误差、演化后的可观测量如何降低对态误差的敏感度。","importance":5,"importance_reason":"给出可落地的“会合于中点”实现：算子系数与收缩结果可跨初态、跨 \\(t_S\\) 复用，时间预算由“纠缠或算子扩散二选一”变为可分配的 \\(t_S+t_H\\)；凡要把二维实时动力学推到更晚者都需重估这条路线。","summary":"把总时间拆成 \\(t=t_S+t_H\\)：态用树张量网络演化到 \\(t_S\\)，可观测量用稀疏 Pauli 传播走到 \\(t_H\\)，再按 \\(\\langle Z_c\\rangle=\\sum_P c_P\\langle P\\rangle\\) 拼接。临界二维 Ising 的 11×11 开边界格点取 \\(t_S=t_H=0.60\\) 算到 \\(t=1.20\\)，中心磁化 0.85720；\\(\\epsilon\\) 收紧到 \\(2^{-18}\\) 使 \\(t=0.80\\) 偏差降到 \\(1.2\\times10^{-3}\\)。","problem":"经典模拟量子多体动力学受两种互补限制：薛定谔图像下纠缠增长使态只能可靠演化到较短时间 \\(t_S\\)，海森堡图像下算子扩散使 Pauli 串数目爆炸、只能走到 \\(t_H\\)。两者各自的可及时间都不足以回答平衡化与量子优势基准问题。作者要问的是：能否把态与算子独立推进后在期望值层面拼接，使可及时间接近 \\(t_S+t_H\\)，同时让拼接引入的大批 Pauli 串期望值计算代价可承受、两侧误差可分别控制甚至互相压制。","method":"态用树张量网络表示，以单点 TDVP 定键维演化（\\(11\\times11\\) 开边界，键维按子树规模分配至 768，\\(\\delta t=0.01\\)）；算子用对称二阶 Suzuki–Trotter 分解下的稀疏 Pauli 传播，新串系数低于 \\(\\epsilon\\) 即丢弃、已存串用 \\(10^{-3}\\epsilon\\) 的低阈值，每层合并同串并按 \\(|c_P|<\\epsilon\\) 裁剪。期望值 \\(\\langle\\Psi(t_S)|P|\\Psi(t_S)\\rangle\\) 用分支矩阵自叶向根收缩并缓存复用，按串在补集上的因子分组并行；另给出随机符号引理与条件误差定理。","result":"临界场淬火下 \\(11\\times11\\) 中心磁化拼接到 \\(t=1.20\\) 为 0.85720（NLCE 0.86455）；纯 Pauli 传播只到 \\(t=0.66\\)，TTN 单独到 \\(t_S=0.60\\)。固定 \\(t_S=0.50\\) 时把 \\(\\epsilon\\) 由 \\(2^{-14}\\) 降到 \\(2^{-18}\\)，\\(t=0.80\\) 处相对 \\(2^{-20}\\) 参考的偏差由 \\(7.1\\times10^{-3}\\) 降到 \\(1.2\\times10^{-3}\\)。小集团精确态配 11×11 算子后晚时较集团单独演化更接近 iPEPS。误差界为 \\(|e_H|\\le\\sqrt{1+\\eta}\\,\\epsilon_H/\\sqrt{M}\\) 与 \\(|e_S|\\le K(1+\\zeta)\\epsilon_\\Omega\\sqrt{d_\\Omega/M_O}/2+2\\epsilon_{LR}\\)。","contribution":"把“态演化 + 算子演化”从设想做成可执行流程：算子系数与态无关，可按同一哈密顿量与初态族复用，收缩结果按共享子树缓存，因此增加记录时刻或更换初态几乎不增加成本；态与算子不必同表示、不必同尺寸，这一点由小周期集团的精确态配大格点 Pauli 传播直接验证。理论上把混合误差精确分解为 \\(e=e_S+e_H\\)，给出条件界，指出局域态近最大混合时算子误差可被压制、Pauli 权重分布足够“平坦且有相干性”时态误差敏感度下降，为后续误差预算提供可检验的假设。","limitation":"作者自己承认：定理的条件（局域态混合、Pauli 权重熵、相干性 \\(K\\)）对当前模拟的定量相关性“尚待确立”；收敛性只在 \\(t\\le0.8\\)、\\(\\epsilon\\ge2^{-14}\\) 的窗口检验，更长时间的收敛未建立；量子态与算子两侧都需要各自的收敛分析，本文没给出合并的误差预算。此外与 iPEPS、NLCE 的差混有有限尺寸效应（\\(11\\times11\\) 开边界对热力学极限）和对方方法自身的系统误差，未在同等误差预算下比较；TTN 键维固定、未做键维收敛扫描；caching/并行下的 3 串/秒是粗估，没有成本对比表。","key_numbers":["\\(11\\times11\\) 开边界、\\(J=-1\\)、\\(h=h_c=-3.044382\\)，取 \\(t_S=t_H=0.60\\) 拼到 \\(t=1.20\\)，\\(\\epsilon=2^{-18}\\)（第 II 节、图 2(a)）","\\(t=1.20\\) 处混合结果 0.85720，NLCE 为 0.86455；iPEPS 现有数据只到 \\(t=0.92\\)（图 2(a)(b)）","固定 \\(t_S=0.50\\)、\\(t=0.80\\)：\\(\\epsilon\\) 从 \\(2^{-14}\\) 降到 \\(2^{-18}\\)，相对 \\(2^{-20}\\) 参考的偏差由 \\(7.1\\times10^{-3}\\) 降到 \\(1.2\\times10^{-3}\\)（图 2(c)）","纯 Pauli 传播 \\(\\epsilon=2^{-20}\\)、\\(\\delta t=0.02\\) 只能到 \\(t=0.66\\)；TTN 单独到 \\(t_S=0.60\\)（第 S1 节、图 S1）","\\(t_S=0.60\\) 时共需 6,368,834 个不同 Pauli 串的期望值；32 核（8 worker × 4 BLAS 线程）约 3 串/秒/进程（第 S4 节）","TTN：121 个格点、240 个张量、239 条键、119 个内张量，22 条大键取 384/512/768，其余保留全部 \\(2^{n_e}\\) 块态（第 S2、S3 节、表 S1）"],"url":"https://arxiv.org/abs/2611.30192","pdf_url":"https://arxiv.org/pdf/2611.30192","doi":"","review":{"verdict":"大修","confidence":"中高","correctness":"核心恒等式与实现路径成立。式 (1)(4) 把 \\(\\langle O(t_S+t_H)\\rangle\\) 写成 \\(\\sum_P c_P(t_H)m_P(t_S)\\)，推导无误；图 2(a) 的拼接曲线在接缝 \\(t=0.60\\) 处与两侧连续，说明收缩与归一化实现正确。图 2(c) 的收敛趋势我也能自洽复核：偏差随 \\(\\epsilon\\) 减小从 \\(7.1\\times10^{-3}\\) 降到 \\(1.2\\times10^{-3}\\)，量级与 \\(\\epsilon\\) 从 \\(2^{-14}\\) 到 \\(2^{-18}\\) 的跨度大致相称。理论部分：Lemma 1 的四阶矩计算（式 S23–S25）正确，\\(\\mathrm{Var}(K)\\le2\\) 成立，但我核对到其在正文被明确限定为“提示而非常规”，这一点作者把关得当。Theorem 1 的证明链（式 S26–S35）逐步可查，我实际验算了 S30 的分解与 S33 用经典 Pinsker 的赋值，没有发现跳步；关键代价是假设 (i)(ii)(iii) 全是外部输入，\\(K\\) 与 \\(\\zeta\\) 未对本文实例估值，因此界只是“条件性成立”。图 3 只给出曲线目视吻合，没有给偏离数值，故“优于集团单独演化”目前是定性陈述。","weaknesses":"· 无误差预算：混合曲线在 \\(t=1.20\\) 的 0.85720 未给误差棒，TTN 键维固定且未做键维扫描，两侧截断误差从未合并估计，读者无法判断与 NLCE 的 0.007 差是物理还是数值。\n· 收敛窗口避重就轻：\\(\\epsilon\\) 敏感性只在 \\(t_S=0.50\\)、\\(t\\le0.8\\) 上测，恰好绕开主打的 \\(t\\in(0.8,1.2)\\)，而那里正是串数最多、最需证据的区段。\n· 基线不公平：iPEPS 只取 \\(D=6\\) 且止于 \\(t=0.92\\)，NLCE 处于热力学极限而本文是 \\(11\\times11\\) 开边界，两个比较都混入对方误差与有限尺寸效应；缺同一格点、同一误差预算的对照。\n· “超越任一方法单独可达时间”过弱：0.60 与 0.66 都是本文设置（固定键维、\\(\\epsilon=2^{-20}\\)）下的停止点，未说明由内存、机时还是精度决定，也无 \\(t_S\\) 最优分配扫描。\n· 定理与实验脱节：假设 (i)–(iii) 从未在 11×11 淬火态上数值检验（\\(\\delta S_O\\)、\\(m_O\\)、\\(K\\) 都可算），定理因此未解释任何一条曲线。\n· 性能数据太粗：第 S4 节“约 3 串/秒/进程”含启动与输出，未给峰值内存、总墙钟与串数增长曲线，无法外推成本。","overclaim":"摘要与第 I 节称该方法“extending evolution times beyond those reached by either method separately in our calculations”，限定词“in our calculations”把主张降级为自比较，但接下来与 iPEPS/NLCE/xSPD 并列展示，读者容易读成“在同类问题上取得更长时间”。实际是：iPEPS 数据止于 0.92 是文献既有数据的边界，NLCE 未必止步于此，因此“更长时间”并非方法层面的优势结论。另外“massively parallel tensor-network contractions”只有一句 3 串/秒的粗估支撑，缺少并行加速比，措辞重于证据。","citations":"需要补三类对照：一是与 Ref. [24]（Rudolph 等，Pauli propagation 框架）和 Ref. [34]（Xu 等，MPS + 低权重 Pauli 的一维演示）逐项说明本文相对它们的增量，因为“meet-in-the-middle”概念本身出自 [24]；二是与 Ref. [41][43]（纠缠加速/纠缠诱导的鲁棒性）对照，本文的“互相压制误差”在机制上与之同源，应说明条件界的差别；三是 iPEPS 一侧应引 \\(D\\) 更大的更新（或在 \\(11\\times11\\) 上给出键维收敛序列），否则 \\(D=6\\) 作为基线偏弱。此外 \\(h_c=-3.044382\\) 的取值来源未给引用。","questions":"①能否在 \\(t\\in[0.8,1.2]\\) 上补一组 \\(\\epsilon\\) 扫描，并给出 0.85720 的误差棒？若 \\(\\epsilon\\) 再降一档需要多少内存与机时？\n②能否在 11×11 上做键维收敛（例如把 384/512/768 各提高一档），定量说明 TTN 单独到底止步于哪个 \\(t_S\\)，从而支撑“延长”的说法？\n③Theorem 1 的 \\(\\delta S_O\\)、\\(m_O\\)、\\(K\\)、\\(\\zeta\\) 在本文 11×11 淬火态上数值是多少？若 \\(K\\gg1\\)，界是否还有意义？\n④图 3 能否给出混合曲线与 iPEPS 的逐点绝对差，特别是 \\(t>0.5\\) 段，以量化“优于集团单独演化”？","basis":"全文读的是 arXiv:2611.30192v1 预印本（非出版社排版版），abstract 取自该 arXiv 条目。已读摘要、第 I–IV 节（式 1–11、图 2–3、引理 1 与定理 1）及补充材料 S1–S6（算法 1–2、表 S1、定理证明）；图 1 因文本抽取错位未逐项核对。"}},{"id":"arxiv-2611.31607","no":2,"topics":["解码器","纠错码"],"source":"arXiv","venue":"arXiv","published":"2026-11-24","title":"Neural Decoding of Logical Clifford Circuits with Transversal Gates","title_zh":"含横向门的逻辑 Clifford 电路的神经解码","authors":["Yicheng Guang","Yuliang Xiong","Xun Gao","Yueqi Chen"],"abstract":"On neutral-atom and trapped-ion machines, a transversal gate needs only one syndrome round, so a logical gate takes up to d times less time than with lattice surgery. However, transversal gates make decoding harder, because a transversal CNOT copies errors between two blocks of physical qubits, so a decoder must read all blocks of a circuit together. Algorithmic decoders for such circuits gain accuracy at the cost of speed. Neural decoders ease this trade-off, but they must infer from data where errors go across each gate and how logical outcomes propagate through the circuit, although both are known exactly. In this work, we present Duet, a neural decoder for logical Clifford circuits with transversal gates that builds in this known information and learns only which errors occurred. Duet leverages three insights. First, each transversal gate moves an error to a fixed place, so the network exchanges features only between the sites that a gate connects. Second, a logical outcome propagates through Clifford gates exactly and linearly, so the network predicts only the flips that the errors of each layer cause and combines the layers by a soft XOR. Third, every circuit is built from the same few gates, so the network takes the gates of each layer as input and one network per code distance decodes circuits of different sizes and depths. We pair Duet with the search decoder Tesseract, which re-decodes the few shots on which the network is least confident. On general circuits with 2 to 4 blocks and up to 16 layers, Duet alone is already more accurate than matching at every distance, and with Tesseract it fails 44 times less often than LoMatching at distance 9. On the random circuits of the Lukin group, it fails 0.299 times as often as their neural decoder at distance 7. The composition stays fast and takes 2.4 to 121.7 μs per layer, less than their network takes per gate at every distance.","abstract_zh":"在中性原子与离子阱机器上，一道横向门只需一轮综合征测量，因此一次逻辑门的耗时比用晶格手术最多少 d 倍。然而横向门让解码更难，因为横向 CNOT 会在两块物理比特之间复制错误，解码器必须把一条电路的所有块放在一起读。针对这类电路的算法解码器以速度为代价换取精度。神经解码器缓解了这一权衡，但它们必须从数据中推断错误在每道门处去了哪里、逻辑结果如何在电路中传播，而这两件事其实都是精确已知的。本文提出 Duet：一种面向含横向门的逻辑 Clifford 电路的神经解码器，它把上述已知信息内建进来，只学习发生了哪些错误。Duet 利用了三点洞见。第一，每道横向门都把错误搬到固定位置，因此网络只在门所连接的站点之间交换特征。第二，逻辑结果通过 Clifford 门的传播是精确且线性的，因此网络只预测每一层错误所造成的翻转，并用软 XOR 把各层合并。第三，每条电路都由同样的少数几种门搭建，因此网络把每一层的门作为输入，而每个码距只需一个网络就能解码不同规模与深度的电路。我们把 Duet 与搜索型解码器 Tesseract 配对，由后者重新解码网络最不自信的少量采样。在含 2 至 4 个块、最多 16 层的通用电路上，单用 Duet 在每个码距上就已比匹配解码更准；配上 Tesseract 后，在码距 9 上它的失败频率比 LoMatching 低 44 倍。在 Lukin 组的随机电路上，码距 7 时它的失败频率是对方神经解码器的 0.299 倍。这个组合仍然很快，每层耗时 2.4 至 121.7 μs，在每个码距上都少于对方网络每道门的耗时。","importance":5,"importance_reason":"对走横向门路线的容错团队直接可用：把门级传播与逻辑传播这两件已知量内建之后，神经解码在 d=9 上比 LoMatching 少 44 倍失败，且每层仍是 μs 级，改变了“神经解码只能当加速器”的判断，做实时解码的人应尽快跟进。","summary":"Duet 把两件本已精确已知的量写进网络结构：每道横向门只在门所连接的站点间交换特征，每个可靠乘积 \\(P\\) 的 d 个代表由逐层精确算子 \\(r_P(t)\\) 给条件、再用软 XOR 合成 \\(z_{P,j}\\)，门表加共享权重使一个网络按码距通吃不同块数与深度。通用电路 p=0.3% 时 d=9 的失败数为 LoMatching 的 0.0225 倍；Lukin 组随机电路 d=7 为对方网络的 0.299 倍，仅 2–10% 采样交 Tesseract 重解，每层 2.4–121.7 μs。","problem":"晶格手术实现逻辑门需要多轮综合征测量，而中性原子与离子阱用横向 CNOT、横向 H 与折叠横向 S，一轮即可，逻辑门耗时理论上可少 d 倍。代价是横向 CNOT 按位置把错误复制到伙伴块，各块探测事件强相关，解码器无法逐块独立处理。已有方案各有短板：Cain 等人的整数规划与并查集、Sahay 与 Wan 的逐块迭代、LoMatching 的匹配图，都靠手写规则携带块间相关，或靠搜索换取精度；神经解码器折中更好，却要从数据里重新学“错误经门去哪”“逻辑结果如何传播”，而门序列数随深度与块数指数增长，学习代价高。","method":"输入是块×层×位置的三维网格，每格带探测位、校验类型与块制备/测量标记；主干为 3×5×5 三维卷积 stem 加 7 个残差块（瓶颈宽 32、通道 128）。每道横向 CNOT 处只在伙伴站点间做线性特征交换，S 则在同一块内与其镜像校验交换。读出对每个可靠乘积 \\(P\\) 的 d 个代表逐层给出 logit \\(l_{P,t,j}\\)，每层的条件量是先把 \\(P\\) 反向传播得到的精确 GF(2) 算子 \\(r_P(t)\\)，再由软 XOR 合并：\\(\\tanh(-z_{P,j}/2)=\\prod_t \\tanh(-l_{P,t,j}/2)\\)。最终 \\(c_P=\\sum_j w_j(-1)^{g_{P,j}}z_{P,j}+b\\)，\\(c_P>0\\) 即翻转该乘积。置信度 \\(\\min_P|c_P|\\le t_f\\) 的采样交给 Tesseract 重解。","result":"Benchmark I（2–4 块，深 1/2/4/8/12/16，p=0.3%）上单独 Duet 在 d=3/5/7/9 的失败数为 LoMatching 的 0.563/0.289/0.177/0.146，配 Tesseract 后为 0.547/0.205/0.0765/0.0225，对 BP+LoMatching 为 0.419/0.129；低噪声下 d=9 组合仅 5 次失败而 LoMatching 903 次。Benchmark II 对 Lukin 组网络：d=7 为 0.299 [0.193, 0.464]，d=5 为 0.705 [0.617, 0.807]，且失败率与精确 MLE 在认证前缀上统计相容。速度每层 2.4–121.7 μs。","contribution":"核心贡献是把“电路供给已知、网络只学错误”这一分工落成可训练结构：门级特征交换对应错误搬运的确定性，逐层精确算子 \\(r_P(t)\\) 加软 XOR 对应逻辑传播的线性，门表加共享权重让一个网络覆盖不同块数与深度，从而不必让网络从指数多的门序列里重新学已知物理。再叠加基于置信度的路由，它把神经解码的精度推到与精确 MLE 统计相容，同时保住 μs 级每层开销，为横向门路线给出一个可用的实时解码候选流程。","limitation":"作者承认：三点洞见只对由横向 CNOT、H、S 构成的逻辑 Clifford 电路成立，非 Clifford 门、晶格手术与其它噪声模型都需重训；网络一次读整条电路，上千层需窗口化解码，留作未来工作；速度只报摊销到 256 采样的吞吐，路由采样要等 Tesseract，d=9 时批次时延 99 分位达 9.4 s，给不出“门等解码结果”的时限保证；Grace 平台的 Tesseract 时间是换算而非实跑。我另外看出：只用一种噪声模型与一种表面码（重置/测量取 p/10、空闲比特无噪声），无电路级误差预算与阈值外推；与 Lukin 组网络比较换了 measure (a)/(b) 两套归一化，单独网络在 d=5/7 的区间含 1，优势主要来自组合与路由；路由比例规则在看过两套测试的平坦曲线后才定形。","key_numbers":["p=0.3% 时组合在 d=9 的失败数为 LoMatching 的 0.0225 倍（18 点池化，Table I）","d=3/5/7/9 的操作点路由比例 1/2/2/2%，这些采样占网络失败的 54.0/91.7/96.6/98.7%（Sec. IV D、Table III）","每层耗时 2.4–121.7 μs；d=9、f=20% 时 270.0 μs，失败数在 f=0.5/2/20% 饱和于 115/104/102（Sec. IV D–E）","Benchmark II 在 d=7：measure (a) 0.299 [0.193, 0.464]；d=5：0.705 [0.617, 0.807]（Table II）","Tesseract 长束设置 21 次试验、21 种探测顺序、束宽 0–20，每 CPU 核跑一次（Sec. II c）","d=9 批次时延 99 分位 9.4 s（d=3 时 19 ms，Grace 平台，Sec. V c）"],"url":"https://arxiv.org/abs/2611.31607","pdf_url":"https://arxiv.org/pdf/2611.31607","doi":"","review":{"verdict":"小修","confidence":"中高","correctness":"三点洞见的物理前提站得住：横向 CNOT 按位置复制错误、折叠横向 S 把 X 错误镜像成同一块的 Z 错误、Clifford 门的反向传播是 GF(2) 上的确定运算。于是式 (1) 把乘积翻转拆成代表翻转与探测事件的固定奇偶、式 (2) 把翻转按“首次探测事件所在层”分解、式 (3) 用 tanh 连乘把各层 logit 合成软 XOR，都是该前提下的恒等或标准近似。数值上我抽查了两处自洽性：Sec. IV B 的 0.563/0.289/0.177/0.146 与 Sec. IV D 引用的 0.5634/0.2889/0.1772/0.1462 同向同量级；d=9 时网络 668 次失败、Tesseract 纠正 600 次、引入 31 次，668−600+31=99 恰为组合的 99 次失败，说明失败账目对得上。可质疑的是式 (3) 的“给定探测事件后各层条件独立”：不同层的错误经由同一段综合征历史是相关的，作者只用消融与实测结果间接支撑，未给该近似的误差上界。","weaknesses":"· 只在固定 p 下报相对失败数，没有阈值以下的标度分析与误差预算，读者无法判断 d=9 的 0.0225 倍是可延续的标度还是这一段距离的偶然。\n· d=9 的统计基础薄：组合仅 5 次失败（LoMatching 903 次），路由比例又锁死 2%，结论对少数采样高度敏感。\n· 单一噪声模型、单一码型，且空闲比特无噪声、重置与测量取 p/10；中性原子与离子阱的主导误差常来自空闲、移动、擦除与泄漏，均不在模型内，也没有噪声参数扰动的稳健性测试。\n· 路由比例 f 的选取规则是在看过两套测试的平坦曲线后才定形的（Appendix D 自承），虽在 fresh test 前冻结且全表可查，选点仍带选择性风险；Benchmark II 上三个操作点在 fresh test 上超时。\n· 与 Lukin 组网络的比较用两套 measure：(a) 依赖对方已发表的逐深度失败率而不同批重跑，(b) 依赖各自重实现的精确 MLE；d=5 与 d=7 上单独网络的区间含 1，优势只体现在组合，故“超越对方神经解码器”实为“Duet+Tesseract”。\n· 速度口径混用：每层 μs 是 256 采样摊销的吞吐，却与对方“每门耗时”并列；决定实时性的是 d=9 的 9.4 s 批次时延，且 Grace 上的 Tesseract 时间是换算而非实跑。","overclaim":"标题与摘要大体克制，但几处强于证据。“44 times less often than LoMatching at distance 9”是组合而非单网络的成绩，且 d=9 组合只有 5 次失败，不宜作头条。“Duet alone is already more accurate than matching at every distance”成立，但对手是自家实现的 LoMatching 与重写的 Cain 等人，未含 Union-Find、BP+OSD 等同类快速解码器。“less than their network takes per gate”把每层吞吐与每门耗时并列，一层含多道门且路由需等 Tesseract，两者并不同质。“statistically compatible with the exact MLE”只成立于认证前缀这一子集，且是在 2–10% 采样被重解之后。","citations":"横向门解码这条线引用完整：Cain 等人的整数规划与后续快速版、Zhou 等人的横向容错证明、Sahay 与 Wan 的迭代方案、LoMatching、Tesseract、Bonilla Ataides 的循环注意力网络、Chen 等人的折叠横向 S 实验均在位，Tesseract 与 LoMatching 也标了版本号。缺口三类：缺流式与窗口化解码的代表工作（并行窗口解码、实时解码架构），而作者把上千层电路推给未来工作时正需这些参照；缺 Union-Find、BP+OSD 等能在同一噪声模型下跑的对照，BP+LoMatching 只覆盖 1000 采样/电路；缺真实硬件端到端延迟的实验性引用，未与 FPGA/ASIC 上落地的解码器对齐时延口径。","questions":"① 式 (3) 把各层当条件独立，能否量化这一近似？比如用同一网络在真实相关采样与“按层重采样”构造的伪独立采样上的差值，给出软 XOR 的系统偏差估计。\n② d=9 的组合只有 5 次失败、路由比例固定 2%，这一点的结论有多少来自统计涨落？能否补一组把失败数提到百量级的加长采样，或至少给出按失败数加权的区间？\n③ 若把给 Tesseract 的同等算力预算换成纯算力的基线（更长束的 Tesseract 单独跑、或 BP+OSD 多轮），组合相对单网络的 0.154 倍还剩多少？这直接决定“路由”这一设计的独立价值。\n④ 空闲比特无噪声、重置与测量取 p/10 是否系统性高估了 Duet？在泄漏、擦除与移动噪声下，门级特征交换与逐层读出这两个结构假设是否仍然成立？","basis":"依据 arXiv 预印本 arXiv:2611.31607v1（2026-11-23 提交，站点标注 2026-11-24）的全文 txt，共 7313 行：摘要、Sec. I–VI 正文、附录 A–F（含 Table I–XIX 与硬件换算说明）及参考文献均已读；未获取出版社排版版，未复现任何数值，未运行作者代码。"}},{"id":"pr-10.1103/j1r2-5ph7","no":3,"topics":["测控与噪声","芯片与耦合器"],"source":"PRL","venue":"Physical Review Letters","published":"2026-11-24","title":"Probing the memory of a superconducting qubit environment","title_zh":"探测超导量子比特环境的记忆效应","authors":["Nicolas Gosling","Denis Bénâtre","Paul Kugler","Simon Geisert","Nicolas Zapata","Mitchell Field","Sumeru Hazra","Simon Günzler","Thomas Reisinger","Martin Spiecker","Mathieu Féchant","Ioan M. Pop"],"abstract":"Achieving fault tolerance with superconducting quantum processors requires qubits to operate within the regime of threshold theorems based on the Born-Markov approximation. This approximation, which models dissipation as constant energy decay into a memoryless environment, breaks down when qubits couple to long-lived two-level systems (TLSs) that become polarized during operation and retain memory of past qubit states. Here, we show that non-Poissonian quantum jump traces carry the information required to distinguish long-lived TLSs from the standard Markovian bath. By fitting the Solomon equations to measured quantum jump dynamics arising naturally from thermal fluctuations, we can disentangle the qubit’s coupling to the two environments. Sweeping the qubit frequency reveals distinct peaks, each associated with a TLS that outlives the qubit, providing a handle to understand their microscopic origin.","abstract_zh":"要用超导量子处理器实现容错，量子比特必须工作在基于 Born–Markov 近似的阈值定理所适用的区间内。该近似把耗散建模为向无记忆环境的恒定能量衰减，但当量子比特耦合到长寿命二能级系统（TLS）时这一近似失效——这些 TLS 会在运行中被极化，并保留对过去量子比特状态的记忆。本文表明，非泊松型的量子跳跃轨迹携带了区分长寿命 TLS 与标准马尔可夫浴所需的信息。通过把 Solomon 方程拟合到由热涨落自然产生的、实测的量子跳跃动力学上，我们能够解耦量子比特与这两种环境的耦合。扫描量子比特频率会显示出彼此分立的峰，每个峰对应一个寿命长于量子比特的 TLS，从而为理解它们的微观起源提供了抓手。","importance":5,"importance_reason":"对做超导纠错与器件噪声的人：给出无需门操作、无需复位的被动谱学，把 T1 掩盖的毫秒级记忆效应量化成速率谱。若阈值论证仍按无记忆浴做，误差的时间关联会被系统性低估，材料改进也失去可指认的对象。","summary":"对颗粒铝 fluxonium（\\(f_q=2\\ \\mathrm{GHz}\\)）每 \\(6\\ \\mu\\mathrm{s}\\) 频闪读取，由条件衰变概率构造 \\(g_2(\\tau)\\)：短时反聚束、超过 \\(T_1\\) 后转为跳跃聚束，即环境带记忆。再用所罗门方程联合拟合基态与跳变后两种选择场景，分离出 \\(\\Gamma_{qt}\\) 与 \\(\\Gamma_q\\)，跳变瞬间 TLS 布局达 \\(p_t(0)=0.55\\)；50 MHz 扫频得 A–H 八个电可调峰。","problem":"超导比特的阈值定理建立在 Born–Markov 近似上：耗散被视为向无记忆浴的恒定衰减，\\(T_1\\) 因此被当成唯一的速度指标。但已有的非指数衰减、非泊松跳跃与环境过极化测量表明，环境保留了比特过去状态的记忆，其直接后果是纠错症候出现时间关联（同一错误被反复报出），并与电离辐射造成的空间关联错误不同源。此前刻画长寿命 TLS 的泵浦–探测实验需要操控比特、且在测量循环之间留复位时间，难以快速扫谱。","method":"器件为颗粒铝 fluxonium，在半通量最优点附近取 \\(f_q=2\\ \\mathrm{GHz}\\)，每 \\(6\\ \\mu\\mathrm{s}\\) 做一次频闪读取得到量子跳跃轨迹，由条件概率构造 \\(g_2(\\tau)\\)。把实测条件动力学（基态选择与向下跳变后选择两种场景）联合拟合到单 TLS 的所罗门方程 \\(\\dot{p}=-Mp+\\Gamma p_{th}\\)，提取 \\(\\Gamma_q\\) 与 \\(\\Gamma_{qt}\\)，并固定 \\(\\Gamma_t=0\\)。再用蒙特卡洛波函数模拟 unravel 不可测的 TLS 布局，重复该拟合同时扫描 \\(f_q\\) 与外加电场，即量子跳跃相关谱。","result":"短时标看到反聚束，\\(\\tau\\) 超过 \\(T_1\\) 后转为聚束；跳变后的比特动力学非单调、出现过冲，单 TLS 模型可定量复现。跳变瞬间 TLS 布局被抬到 \\(p_t(0)=0.55\\)（热平衡 \\(p_{th}\\approx0.1\\)）。50 MHz 扫频在 \\(\\Gamma_{qt}\\) 上给出 A–H 八个分立峰，而 \\(\\Gamma_q\\) 近乎平坦；加电场后这些峰分别上移、下移、不动或在时间上跳变，另有一个短寿命 TLS 直接显现在 \\(\\Gamma_q\\) 背景中。","contribution":"把“环境有记忆”从定性现象变成可测量的速率谱：不需要任何比特操控与初始化，只靠热涨落自然触发的跳跃，就能在同一器件上分离马尔可夫浴与单个长寿命 TLS，并给出每个 TLS 的耦合强度；方法可直接搬到标准色散读取装置上，避开门标定误差与驱动致漏泄。更实用的产出是一套可对 TLS 微观起源做分类的实验判据（电敏感性、峰位时间抖动），为材料与版图改进指认具体对象。","limitation":"作者自承采用半经典速率方程，忽略比特与 TLS 之间可能存在的纠缠，且只用一至两个 TLS 建模。固定 \\(\\Gamma_t=0\\) 是简化：附录 I 明说这会把短寿命 TLS 的损耗算进 \\(\\Gamma_q\\)，于是被称为“马尔可夫背景”的量并不纯。全文只有一颗 fluxonium，未给拟合参数的误差棒与系统误差预算，也未与泵浦–探测或 \\(T_1\\) 谱在同一器件上定量对照；对纠错阈值究竟被拉低多少只有定性断言。","key_numbers":["比特取 fq = 2 GHz（半通量最优点附近），每 6 μs 做一次频闪读取，Fig. 1(b–d)","50 MHz 扫频下 Γqt 上分辨出 A–H 八个长寿命 TLS 峰，同期 Γq 近乎平坦，Fig. 3(a–c)","向下跳变瞬间 TLS 布局 pt(0) = 0.55，热平衡布局 pth ≈ 0.1，Fig. 1(e,f) 与附录 F","fluxonium 参数 EJ/h = 10.32 GHz、EC/h = 4.48 GHz、EL/h = 1.48 GHz，附录 A（Fig. 4c）","附录 H 的更大范围扫谱覆盖 500 MHz，最远两点相隔 36 分钟，多数 TLS 峰位不漂移"],"url":"https://doi.org/10.1103/j1r2-5ph7","pdf_url":"https://arxiv.org/pdf/2603.11889","doi":"10.1103/j1r2-5ph7","review":{"verdict":"小修","confidence":"中高","correctness":"核心主张成立度较高。Eq.(1) 的 \\(g_2\\) 定义与 Fig. 1(b) 的短时反聚束、长时聚束一致，且聚束时标远超 \\(T_1\\)，我核对后同意这基本排除读出引起的高能级布居解释（作者亦在正文给出该论证）。Eq.(2) 的所罗门矩阵形式与附录 B 的多 TLS 推广自洽；Eq.(3) 的 \\(p_t(0)=p_{th}+(1-p_{th})\\Gamma_{qt}/(\\Gamma_q+\\Gamma_{qt})\\) 是“TLS 空时比特以 \\(\\Gamma_{qt}/(\\Gamma_q+\\Gamma_{qt})\\) 概率衰入 TLS”的直接概率论证，量纲与极限行为（\\(\\Gamma_{qt}\\to0\\) 回到 \\(p_{th}\\)，\\(\\Gamma_{qt}\\gg\\Gamma_q\\) 趋于 1）均正确，附录 F 的蒙卡给出 0.55 与之一致，这一环我实际验算过。Fig. 1(e,f) 的过冲与对数坐标下残余非指数性、Fig. 2 的隐藏 TLS 布局复原是文章最硬的证据。Fig. 3 的峰位与电场响应分类可信，但属定性归因。","weaknesses":"· 单器件、单比特工作：全文只有一颗 fluxonium、一个电场端口，A–H 峰的重复扫描统计缺失，未给 \\(\\Gamma_q\\)、\\(\\Gamma_{qt}\\) 的误差棒与拟合区间，读者无法判断“无峰处”是真无 TLS 还是灵敏度不足；\n· 固定 \\(\\Gamma_t=0\\) 与“马尔可夫背景平坦”构成循环：附录 I 自承短寿命 TLS 的损耗会被记到 \\(\\Gamma_q\\) 上，于是 \\(\\Gamma_q\\) 的平坦性部分来自模型假设而非物理；附录 E 放开 \\(\\Gamma_t\\) 后该线消失，恰好说明这一点，正文却仍称其为马尔可夫背景；\n· \\(p_{th}\\approx0.1\\) 在 2 GHz 处给出，但未说明如何独立标定，也未讨论 \\(p_{th}\\) 与 \\(\\Gamma_q\\)、\\(\\Gamma_{qt}\\) 在拟合中是否退化；\n· 缺少误差预算与系统误差讨论：读取强度、post-selection 窗口（0.5 ms）、平均次数对拟合偏差的影响未量化；\n· 与同期的非马尔可夫弛豫谱学（Ref. 11）和泵浦–探测（Ref. 9）没有同器件、同指标的定量比较，灵敏度与耗时优劣无法判断；\n· 对纠错的影响止于定性陈述，未给出时间关联长度或症候级模拟。","overclaim":"摘要称 “we can disentangle the qubit’s coupling to the two environments”，实际只在单一器件、少数峰上做了二环境分解，且第二环境被硬设为无衰减（\\(\\Gamma_t=0\\)），分解的唯一性未讨论。摘要与结论反复说每个峰 “associated with a TLS that outlives the qubit”，但 TLS 寿命并未被直接测量——\\(\\Gamma_t\\) 被固定为 0，“长寿命”是拟合前提的推论而非独立证据，建议改为“与寿命长于比特的 TLS 相符”。结论中 “ready-to-use tool” 与 “deployable on any standard qubit measurement setup” 对需要长时连续读取与大量 post-selection 的装置而言偏乐观。","citations":"应补充并定量对照：Zhuang 等 2026 年 fluxonium 非马尔可夫弛豫谱学（Ref. 11）与 Spiecker 等量子 Szilard 引擎过极化（Ref. 9）——两者是直接竞争方法，需给出灵敏度、单点耗时、是否需操控的对比表。TLS 谱学方面缺 Lisenfeld 等退相干谱学之外的近期个体 TLS 电敏感性工作（如 Liu 等 PRL 133, 160602 之外的电荷态分辨结果）。纠错影响部分建议引表面码中时间关联噪声的阈值研究（含 Google 2025 below-threshold 工作的关联错误分析），否则“challenging prevailing QEC approaches”缺支撑。测量反作用导致的 TLS 极化亦应有引用支撑。","questions":"① \\(p_{th}\\) 是如何独立标定的？若把它与 \\(\\Gamma_q\\)、\\(\\Gamma_{qt}\\) 一起放开，拟合是否退化、各参数误差多大？\n② 附录 E 显示放开 \\(\\Gamma_t\\) 后短寿命 TLS 在 \\(\\Gamma_q\\) 上的峰消失，那正文的“马尔可夫背景”应如何重新定义？能否给出该成分对 \\(\\Gamma_q\\) 的贡献上界？\n③ A–H 峰在附录 H 的 36 分钟重复扫描中如何做峰匹配？有无同一 TLS 被误配或漏配的风险，能否给出峰位漂移分布？\n④ 能否基于测得的 \\(\\Gamma_{qt}\\)、\\(\\Gamma_t\\) 给出一阶估计：这类记忆效应会把表面码的等效错误率或阈值改动多少？\n⑤ 该方法的灵敏度下限（可探测的最小 \\(\\Gamma_{qt}\\)）是多少，与 \\(T_1\\) 谱相比如何？","basis":"全文读的是 arXiv:2603.11889v1 预印本（出版社 PRL 排版版未获取），abstract 取自出版社/OpenAlex 正式摘要；精读正文 Eq.(1)–(3)、Fig. 1–3 及附录 A–I（Fig. 4–10）；未获补充材料与原始数据（作者称按需提供）。另注：预印本作者列表与书目中的作者列表不完全一致。"}},{"id":"arxiv-2611.30884","no":4,"topics":["解码器","纠错码"],"source":"arXiv","venue":"arXiv","published":"2026-11-23","title":"Coherent Recovery of Nested Codes over the Quantum Erasure Channel Using Erasure Decoding and Quantization","title_zh":"量子擦除信道上嵌套码的相干恢复：基于擦除译码与擦除量化","authors":["Aditya Guhagarkar","S. Sandeep Pradhan","Achilleas Anastasopoulos"],"abstract":"Motivated by quantum capacity results, we revisit nested binary linear codes for the quantum erasure channel through a packing-covering viewpoint: the outer code supports erasure reconstruction, while the inner code performs erasure quantization. We turn this perspective into two explicit decoder architectures. Architecture I requires no stabilizer-syndrome measurements and combines a classical peeling decoder and erasure quantizer with corresponding coherent quantum reconstruction and cleanup operations that disentangle the logical state from inaccessible erasure-environment branches. Architecture II goes one step further and implements erasure belief propagation directly through reversible ternary quantum gates, providing quantum state healing that reconstructs erased symbols while leaving unerased code states unperturbed. We establish sufficient conditions for exact recovery of arbitrary logical states, and illustrate both architectures using the Steane code, including explicit scheduling procedures and coherent quantum circuits.","abstract_zh":"受量子容量结果的启发，我们从填充–覆盖（packing–covering）视角重新审视用于量子擦除信道的嵌套二元线性码：外码支持擦除重建，内码执行擦除量化。我们把这一视角转化为两种显式的解码器架构。架构 I 不需要任何 stabilizer 综合征测量，它把经典剥离（peeling）解码器与擦除量化器，同相应的相干量子重建和清理操作结合起来，后者把逻辑态与不可访问的擦除–环境分支解缠。架构 II 更进一步，直接通过可逆三值量子门实现擦除置信传播，提供一种量子态疗愈：重建被擦除的符号，同时让未被擦除的码态不受扰动。我们给出了任意逻辑态被精确恢复的充分条件，并用 Steane 码说明这两种架构，包括显式的调度流程和相干量子线路。","importance":4,"importance_reason":"给做容错解码与 qLDPC 实现的人一个可执行的接收机模板：把「重建码字」与「恢复逻辑态」明确分开，并指出后者靠内码的擦除量化补全完成，回答无综合征测量解码到底还缺哪一步。","summary":"用填充–覆盖视角把量子擦除信道上的嵌套码 \\(C_2\\subseteq C_1\\) 的解码拆成重建与量化两步：架构 I 用经典剥离调度相干重建 \\(C_1\\)，再把 \\(uR_E\\) 当作擦除量化目标、用 \\(C_2\\) 的码字补全给出的平移把逻辑寄存器与辅助寄存器解耦，全程不作 stabilizer 综合征测量；架构 II 用可逆三值门直接实现擦除 BP。Steane 码 |E|=2 时 6 个 CNOT 完成重建，经典时间 \\(O(n)\\)、门数 \\(O(n^2)\\)。","problem":"擦除信道下恢复量子信息通常先测 stabilizer 综合征、再由经典译码器给出 Pauli 修正，但被擦除的量子比特已被部分迹掉，接收端拿到的是若干不可访问分支的混合态，仅「在每个分支内重建出合法码字」并不足以恢复原始逻辑态；而已有的 CSS 视角以 \\(C_2^{\\perp}\\) 作信道码，虽能构造容量达成的码族，却不说明接收端在 \\(C_2\\) 上还需要什么样的相干补全操作。本文要把量子容量的 packing–covering 图像落成显式、无需综合征测量的相干恢复流程，并讲清重建、逆编码与量化清理三步各自的成功条件。","method":"取嵌套二元码 \\(C_2\\subseteq C_1\\)：\\(C_1\\) 作 packing 码纠擦除，\\(C_2\\) 作 covering 码做擦除量化，逻辑基矢是 \\(C_1/C_2\\) 陪集的均匀叠加，码率 \\(R_Q=R_1-R_2\\)。接收端只测擦除标记得 E：先由 Algorithm 1 在 \\(C_1\\) 的约束图上跑剥离，得到只依赖图与 E 的调度 \\(D(E)\\)，再用 CNOT 相干重建被擦除的码变量与状态变量；接着做逆编码 \\(U_X^{\\dagger}\\) 暴露逻辑寄存器；最后以 \\(uR_E\\) 为擦除量化目标，用 Algorithm 3 的预约调度在 \\(C_2\\) 上求补全，把其编码器坐标 \\(f_E(uR_E)\\) 加进辅助寄存器，再逆向清除临时工作区。架构 II 改用三值可逆门与 swap-and-reset 直接在 qutrit 寄存器上跑擦除 BP，替代剥离调度。","result":"定理 1：若 Algorithm 1 与 Algorithm 3 在 E 上均成功，则重建、逆编码与清理后 \\(\\rho_{\\mathrm{out},E}=|\\psi_L\\rangle\\langle\\psi_L|\\otimes\\sigma_E\\)，\\(\\mathrm{Tr}\\,\\sigma_E=1\\) 且全部临时寄存器回到零，\\(\\sigma_E\\) 与逻辑输入无关。Steane 码 E={1,2} 的算例给出 4 个分支的显式态，各分支范数 1/4，重建只用 6 个 CNOT，量化清理的净效果是单个 CNOT（L→X1）；架构 II 用 2 次迭代重建同一分支，第三次预算迭代保持状态不变。复杂度上经典调度 \\(O(n)\\)，重建 CNOT 数不超过边数 \\(M\\)，清理门数 \\(O(n+M_2+\\mathrm{nnz}(R_E))\\)，最坏 \\(O(n^2)\\)。","contribution":"三点：一是把量子容量的 packing–covering 图像落成可执行的接收机流程，并明确指出「重建出合法码字」不等于「恢复逻辑态」，再用内码补全的编码器坐标构造辅助平移 \\(g_E(u)=f_E(uR_E)\\) 消去残余态对逻辑标签的依赖，这是本文最实质的新点；二是两条都不做 stabilizer 综合征测量的解码器架构，其一纯经典调度、其二直接用可逆三值门跑 BP，并给出可逆性与「已恢复变量不被后续迭代扰动」的论证；三是把成功条件写成可核验的充分条件（剥离与预约同时成功），并指出容量达成的嵌套码族只需二者联合失败概率趋于零，为后续把 qLDPC/CSS 码族接进这条流程留了口子。","limitation":"作者承认的局限：只用一个 Steane [[7,1,3]] 例子和 |E|≤2 的擦除模式演示，未给更大码与有限长性能；逆编码、目标制备与三值门的实现代价，以及深度、工作区、重置之间的权衡都列为未来工作；架构 II 的 reset 被当作原语信道，物理实现未指定。我看出的问题：全文没有任何数值仿真或阈值/差距分析，容量达成只是引述他人码族的存在性，并未证明剥离与预约的联合成功概率随 n 趋于 1；充分条件无法刻画失败模式的概率；也没与综合征式 BP+OSD、guided decimation 等基线做门数或深度对比，「无测量」的代价（大量 ancilla 与 \\(O(n^2)\\) 逆编码）没有量化。","key_numbers":["码率关系 \\(R_Q=R_1-R_2\\)；取 \\(R_1=1-\\epsilon\\)、\\(R_2=\\epsilon\\) 时趋于 \\(Q(\\epsilon)=\\max\\{0,1-2\\epsilon\\}\\)（第 2.1 节）","Steane 例：\\(C_2\\) 为 [7,3,4] 单纯形码、\\(C_1\\) 为 [7,4,3] Hamming 码，\\(k_1=4\\)、\\(k_2=3\\)、\\(k=1\\)，二者均可处理全部 |E|≤2 的擦除模式（第 2.2 节 Example 1）","E={1,2} 时重建线路共 6 个 CNOT（\\(U_{1,2}U_{3,1}\\)），4 个不可访问分支各重至范数 1/4（第 3.2 节式 (25)–(28)）","量化清理净效果为单个 CNOT（L→X1），即 \\(U_{\\mathrm{cl}}(E)=\\mathrm{CNOT}_{L\\to X_1}\\)（第 3.5 节式 (51)–(54)）","复杂度：经典调度 \\(O(n)\\)、清理门数最坏 \\(O(n^2)\\)（引理 1、引理 2）；架构 II 用 \\(m_1\\) 个校验 qutrit 与 \\(n_v\\) 个更新 qutrit，至多 \\(m_1\\) 次 QBP–S&R 迭代（第 4.3 节）"],"url":"https://arxiv.org/abs/2611.30884","pdf_url":"https://arxiv.org/pdf/2611.30884","doi":"","review":{"verdict":"大修","confidence":"中高","correctness":"核心主张在「充分条件成立」的意义上是对的，但支撑面很薄。我逐式核对了 Steane 算例：式 (16) 的四个分支态与式 (10) 的校验矩阵、\\(R_E=(1\\ 1)\\) 一致；式 (51)–(52) 的反序预约求解确实给出 \\(c_2=(u,u,u,0,u,0,0)\\)、\\(f_E(uR_E)=(u,0,0)\\)，因此式 (53)–(54) 的净效果 \\(U_{\\mathrm{cl}}(E)=\\mathrm{CNOT}_{L\\to X_1}\\) 与正文自洽；式 (55) 四分支平方和为 1，与式 (58)–(59) 的 \\(\\mathrm{Tr}\\,\\sigma_E=1\\) 对得上（每个 b 的可行 x 数为 \\(2^{k_2}\\)）。引理 1、2 按每条被预约约束计 \\(2(|N(h)|-1)\\) 个门求和，结论 \\(O(n+\\mathrm{nnz}(R_E))\\) 成立。表 1 的九项映射确为置换，且未擦除位置满足 \\(a_v=y_v\\)，不会误改已知变量。但这些核验全在 n=7、\\(|E|\\le 2\\) 的退化算例内完成。","weaknesses":"· 全部正确性都挂在「Algorithm 1 与 Algorithm 3 同时成功」上，而这两个都是作者自认次优的剥离/预约算法，全文未给联合成功概率、未给随 n 的标度，也没有一次蒙特卡洛；定理 1 因此只是把问题挪到经典算法上。\n· 数值演示只有 Steane [[7,1,3]] 且 \\(|E|\\le 2\\)，恰是 \\(d=3\\) 的平凡区间，两种架构几乎必然成功，既无法区分优劣，也暴露不出 BP 与剥离的差距。\n· 「无需 stabilizer 综合征测量」的说法需要打折：接收端仍要测擦除标记（式 (6) 的 \\(P_{\\mathrm{valid}},P_e\\)），架构 II 的 swap-and-reset 也要先 reset 辅助 qutrit 才能复用，实际等价于需要 mid-circuit 测量加反馈或一个非幺正的 reset 信道，文中未给物理实现与深度代价。\n· 代价未量化：目标制备需 \\(\\mathrm{nnz}(R_E)\\) 次操作、逆编码为 \\(O(n^2)\\)，相对常规综合征解码的 ancilla 数与深度可能更贵，但全文没有一个门数/深度/工作区对照表。\n· 状态变量 s 的引入使 \\(\\ell_1\\) 随嵌套码族增长，第 2 节的稀疏性与 \\(O(n)\\) 经典时间都依赖固定的度数假设，对一般 qLDPC/CSS 码族是否成立未讨论。","overclaim":"摘要称两种架构「requires no stabilizer-syndrome measurements」并把架构 II 说成「quantum state healing」，语气上接近即插即用的硬件方案，但实际只在 7 比特、\\(|E|\\le 2\\) 的算例上演示了调度与线路，且 reset 被当作原语。摘要与引言还说「we establish sufficient conditions for exact recovery of arbitrary logical states」，把「条件成立时精确」读成了普遍可达；引言末尾关于容量达成码族「只需联合失败概率趋于零」的陈述没有给出任何估计或仿真支撑。","citations":"需要更清楚地交代与 Martinian–Yedidia 擦除量化 [4] 的增量：本文的清理步骤本质是把其预约算法插进 CSS 解码，应逐条说明新在哪里。容量达成一侧应明确对比 Kumar–Calderbank–Pfister 的 Reed–Muller CSS 构造 [7]，以及 [24][26] 中 seeded BP/空间耦合码的达成结果，否则「趋于 \\(1-2\\epsilon\\)」缺乏可比对象。解码基线方面缺 BP+OSD、guided decimation [9]–[11] 与 cluster decomposition [11] 的门数/深度对照，也缺与无测量解码 Nakata 等 [15]、Li 等 [12]、Chiwaki–Matsumoto [14] 的代价比较，读者无法判断这条路线是否更省。","questions":"①给定一对接近容量的嵌套 LDPC 码（例如度数固定的 (3,6) 族），在 \\(\\epsilon\\) 接近 \\(1/2\\) 时 Algorithm 1 与 Algorithm 3 的联合成功概率随 n 如何变化？请给仿真或至少给一个可证的标度。\n②架构 II 中的 reset 具体怎么实现？若用测量加反馈，与「无测量」的卖点是否矛盾？请给含 reset 的深度与 ancilla 预算，并说明表 1 中未被演化触及的四个输入在含噪或非理想初态下是否真的不会出现。\n③式 (44a) 的目标制备需 \\(\\mathrm{nnz}(R_E)\\) 次操作、逆编码 \\(O(n^2)\\)，相对标准综合征解码的总门数与深度比是多少？能否用 [27, App. A] 的线性时间编码把这一项压下去？\n④定理 1 只覆盖成功分支，失败时输出什么态？是否会在逻辑子空间外留下可被后续轮次放大的相干泄漏？","basis":"全文（arXiv:2611.30884v1，31 页，cs.IT）：第 1 节引言、第 2 节嵌套码与擦除信道模型（式 (1)–(15)）、第 3 节架构 I（式 (16)–(55)、Algorithm 1–3、图 1–5）、第 4 节架构 II（式 (60)–(71)、图 6–7、表 1）、第 5 节结论与定理 1 证明。abstract 与全文均取自预印本，无出版社排版版；未读补充材料。"}},{"id":"arxiv-2611.32757","no":5,"topics":["经典模拟","大规模仿真"],"source":"arXiv","venue":"arXiv","published":"2026-11-24","title":"Classical sampling of verifiable graph-state quantum advantage experiments","title_zh":"可验证图态量子优势实验的经典采样","authors":["Zhongpu Qiu","Yuqi Qing","Jielan Li","Hongxia Hao"],"abstract":"Quantum computers are expected to outperform classical ones on some tasks, but a convincing demonstration must be both hard to reproduce classically and verifiable. A recent proposal achieves verifiability by preparing graph states with built-in error detection, so that the quality of the experiment can be certified without simulating it; hardness is added by measuring in a non-Clifford basis or by inserting T gates. We show that the two instances posted to demonstrate this proposal on IBM hardware can be sampled classically on eight graphics processing units, with higher quality than the hardware in comparable or shorter time. For the 70-qubit instance our samples are drawn from the ideal output distribution; for the 64-qubit instance with 314 T gates they come with a certified fidelity of at least 0.908, against 0.349 for the hardware. The reason lies in verification itself: T gates can only be placed where the error detection cannot see them, which pushes them towards the end of the circuit, where they add little classical cost. Our results identify the features that future verifiable advantage experiments must control.","abstract_zh":"量子计算机有望在某些任务上超越经典计算机，但有说服力的演示必须既难以被经典方法复现、又可被验证。近期一项方案通过制备内建错误检测的图态来实现可验证性，使得无需模拟实验即可认证其质量；难度则通过在非 Clifford 基下测量或插入 T 门来添加。我们证明，为在 IBM 硬件上演示该方案而公布的两个实例，可以在八块图形处理器上经典采样，质量高于硬件，时间相当或更短。对 70 比特实例，我们的样本取自理想输出分布；对含 314 个 T 门的 64 比特实例，样本带有至少 0.908 的认证保真度，而硬件为 0.349。原因正在于验证本身：T 门只能放在错误检测看不到的位置，这把它们推向线路末端，在那里它们几乎不增加经典代价。我们的结果指出了未来可验证优势实验必须控制的特征。","importance":4,"importance_reason":"对做量子优势实验与经典模拟的读者都直接相关：它用 8 块 H200 在两个公开实例上超过硬件，并把可验证性与经典难度绑定成同一资源，会改变实验方设计线路时的取舍判断；但结论限于这两个实例与同族系综，算法组件多为已有方法的组合。","summary":"作者在 8 块 H200 上经典采样两个可验证图态优势实例：70 比特无掺杂实例取满秩平衡割，一半输出为均匀随机位、另一半由一次 Walsh-Hadamard 变换取得，样本严格来自理想分布；64 比特含 314 个 T 门的实例经 64 次运行前审计给出 \\(F\\ge 0.908\\)，硬件认证值仅 0.349，端到端用时 864 s 亦不慢于硬件 870 s。根因是 T 门只能置于检查不可见的允许位置而被迫后置，经典代价由早期轴秩 \\(\\kappa_E\\) 与早期纠缠而非 T 门总数决定。","problem":"图态可验证采样承诺了随机线路采样做不到的事：不必模拟困难线路就能证明实验质量。Clifford 线路制备随机图态，检查比特检出时空故障，只保留零 syndrome 的样本，因而保真度可直接测量；硬度再加在不会破坏这一测量的地方——改用非 Clifford 基测量，或只在不扰动检查的位置插入 T 门。IBM 与芝加哥大学据此宣称 70 比特掺杂实例已达成量子优势。本文要问：让保真度可测的那份结构，是否同时封住了线路的经典难度上限。","method":"无掺杂实例取秩为 \\(n/2\\) 的平衡割，B 侧为最大混态，故 \\(b\\) 直接用随机数均匀抽取；A 侧条件态由一次 Walsh–Hadamard 变换、一次指标重排与 \\(n/2\\) 个单比特门得到，每样本 \\(O(n2^{n/2})\\) 运算与 \\(2^{n/2}\\) 振幅内存。掺杂实例把每个 T 门换成 gadget 比特，得 378 比特放大图，沿线性序收缩并留 20 位开放：前缀均匀抽、后缀在块内精确抽。运行前固定 64 个审计，用双精度重算块并计重叠 \\(c_y\\)，由 KL–Chernoff 界给保真度下界。","result":"RGS70 两批各 1726 个样本，线性 XEB 为 1.096(35) 与 0.953(33)、合计 1.025(24)，硬件为 0.466(31)；端到端 1265 s，样本严格来自理想分布。DCS64 的 64 次审计平均重叠损失 \\(1.9\\times10^{-4}\\)，得 \\(F\\ge 0.908\\)（95% 置信），硬件认证值为 0.349；864 s，XEB 1.009(38) 对 0.390(34)。宽度界 \\(w\\le\\min\\{n,\\kappa_E+w_{pre}+1+\\gamma_{tail}\\}\\) 在层 52 后切分给 56，优化到 43，已知最好 36，28 顶点子图穷举给下界 10。","contribution":"交出两套带公开验证器的经典采样器：无掺杂一个精确，掺杂一个自带运行前固定的审计证书，使经典挑战得以与实验按同一标准（认证保真度而非单一基准分）比较。更关键的是把“为何可模拟”归因到可验证性本身：早期轴秩 \\(\\kappa_E\\) 与早期纠缠 \\(w_{pre}\\) 进入宽度界，T 门总数不进；并用反例排除“检查数或允许位置数决定代价”“允许位置多必损证书”等简化命题，给后续实验指出应提高的可计算量。","limitation":"作者自承：采样用单精度，RGS70 仅在精确算术下严格，实现只靠双精度重打分而无误差界；DCS64 的证书以双精度参考块和伪随机前缀为独立均匀为前提，且仅 64 次审计使下界上限只能到 0.911。我们另见：DCS64 的检查线路未公开，允许位置与早期轴秩无法在该实例上直接计算，结构论证部分依赖同族公开实例 #228；宽度下界只对一个 28 顶点子图成立，\\(10\\le w_{\\min}\\le 36\\) 区间仍宽，且与生产所用宽度 34 相比证明力有限。","key_numbers":["RGS70：70 数据比特在链上、70 个 CZ 层（2415 个 CZ）、27 个检查比特；实验 1726 个后选样本（占 0.10%）、1950 s、实测保真度 0.37(2)（第 II 节、表 I）","经典 RGS70：3452 个样本，线性 XEB 1.025(24)（两批 1.096(35)、0.953(33)），硬件 0.466(31)；8 卡单时钟 1265 s（第 VI 节、表 I）","DCS64：64 比特在环上、73 个 CZ 层（2336 个 CZ）、12 个检查比特、314 个 T 门；实验 1389 个样本、870 s、认证保真度 ≥0.349（第 II 节、表 I）","DCS64 证书：64 次审计平均重叠损失 \\(1.9\\times10^{-4}\\)，给 \\(F\\ge 0.953\\)，95% 置信下 \\(F\\ge 0.908\\)；审计数为 64 时界上限仅 0.911（第 VI 节、附录 A）","宽度：层 52 后切分 \\(\\kappa_E=2\\)、\\(w_{pre}=31\\)、\\(\\gamma_{tail}=22\\) 给 56，优化到 43，最好已知 36，28 顶点子图穷举下界 10；314 个 T 门中仅 1 个位于前 50 层（第 VII 节、命题 15）","扩展性：条件态在 \\(n=70\\) 需 256 GiB 单精度、\\(n=80\\) 需 8 TiB、\\(n=90\\) 需 256 TiB；后选集代价至多 \\(2^{-r}\\) 而非随体积指数衰减（第 III、VIII 节）"],"url":"https://arxiv.org/abs/2611.32757","doi":"","pdf_url":"https://arxiv.org/pdf/2611.32757","review":{"verdict":"小修","confidence":"中高","correctness":"核心主张成立。定理 1（满秩平衡割下 B 侧为最大混态、\\(b\\) 均匀）与式 (1) 的条件态形式我逐步核对，Walsh–Hadamard 加权求和正确；式 (2) 的 \\(F=(\\mathbb{E}_y\\sqrt{Dp_y})^2\\) 与命题 2 对单精度重叠的处理自洽。表 I 数字内部一致：RGS70 两批 XEB 1.096(35)、0.953(33) 与合计 1.025(24) 相符，且远离 1 的偏离在 3σ 内。664 位审计算术可复算：平均损失 \\(1.9\\times10^{-4}\\)、\\(m=64\\)、\\(\\alpha=0.05\\) 给 \\(u=0.0469\\)、\\((1-u)^2=0.9083\\)；\\(\\ell=0\\) 时上限 \\(0.05^{2/64}=0.9106\\) 也与我复算一致。式 (3) 代入 \\(\\kappa_E=2\\)、\\(w_{pre}=31\\)、\\(\\gamma_{tail}=22\\) 确得 56。附录 D 的 Choi 细化到 43、命题 15 的 2^28 子集穷举给 10 均逻辑清楚，我未独立复跑。","weaknesses":"· 结构性论证的目标实例 DCS64 检查线路不公开，允许位置与 \\(\\kappa_E\\) 无法在该实例上直接计算，\\(\\kappa_E=2\\) 来自同族 #228 的位置统计，因果链在目标实例上只是推断；\n· 64 次审计把下界天花板压到 0.911，与报出的 0.908 几乎贴死，信息的判别力有限，而提高审计数成本很低（86 s/GPU），作者未做；\n· RGS70 在单精度下运行，“samples are drawn from the ideal output distribution”严格说只对精确算术成立，实现只做双精度重打分而无误差界；\n· 计时口径不统一：RGS70 的 1265 s 含调度与打分，DCS64 的 864 s 排除排队与容器启动，硬件 870 s 是否同口径无说明，故“comparable or shorter”对口径敏感；\n· 宽度下界仅来自 28 顶点子图（10≤w≤36），生产宽度 34 落在区间内部，无法证明当前收缩序已近最优；\n· 定理 7、13 的反例族作者自承用其它方法易模拟，只限制宽度不等式而非经典难度，故“验证与硬度争同一资源”仍是机制观察。","overclaim":"摘要把经典结果与硬件并列为“higher quality … in comparable or shorter time”，但两者质量定义不同（RGS70 用理想分布与实测 0.37 对比，DCS64 用经典态对理想态的认证保真度对硬件的认证值），作者在正文亦承认这不是同一个量；DCS64 的经典保真度是“至少 0.908”的下界，与硬件 0.349 的对比因此不对称。结尾“identify the features that future verifiable advantage experiments must control”也偏强：证据是两个实例、一个 28 顶点子图与合成系综，系综用带预算的贪心搜索生成，未必覆盖真实实验的检查生成器。","citations":"需要与 Ref [46]（宽度 36 的完整序，及其对硬件样本的精确概率）和 Ref [47]（CPU 上精确采样 RGS70 的并发工作）逐项划清增量，尤其是本文的 1265 s 相对 [47] 的加速来自显卡还是算法。Ref [39] 的均匀前缀采样是算法 2 的直系基线，应说明本文是否只做了工程实现。讨论 XEB 可被伪造（Ref [22,23]）时应交代本文 XEB 为 1.025>1 是否落入同类构造。此外 IQP 可验证性被攻破（Ref [27]）与本文“结构即弱点”的论点应显式对照，并补充对 #264 修订实例的完整宽度证书。","questions":"①把审计数从 64 提到全部 1389 个样本（按 86 s/GPU 的审计成本只增加数小时），\\(F\\) 的下界能到多少？当前的 0.911 天花板是否掩盖了块质量的真实水平？\n②DCS64 的检查线路能否公开，或给出不依赖它的 \\(\\kappa_E\\) 上界？否则“314 个 T 门被迫后置”在目标实例上只是推断。\n③能否给出统一计时口径（含/不含打分、排队与容器启动）的两列数字，以支撑“comparable or shorter time”？\n④RGS70 的单精度实现能否给出误差界，或至少给出与双精度参考块的全量对比分布？","basis":"全文读的是 arXiv:2611.32757v1 预印本（source 为 arXiv，无出版社排版版；abstract 取自该预印本摘要）。已读摘要、第 I–IX 节、表 I–V、图 1–4、算法 1–2，以及附录 A–E（定理 1、5、7、8、13、14，命题 2、10、15）。未获取补充材料 SM（作者称需向作者索取），未运行公开代码与审计数据，四题中的数值仅做纸面复算。"}},{"id":"pr-10.1103/kgjs-qlsb","no":6,"topics":["纠错码","解码器"],"source":"PRX Quantum","venue":"PRX Quantum","published":"2026-11-24","title":"Critical non-equilibrium phases from noisy topological memories","title_zh":"受噪拓扑存储器中的非平衡临界相","authors":["Amir-Reza Negari","Subhayan Sahu","Jan Behrends","Benjamin Béri","Timothy H. Hsieh"],"importance":4,"importance_reason":"它把“能否局域解码”从经验问题变成可判定的判据（穿孔互信息），并在同一模型里给出全局可恢复、准局域不可恢复的显式例子；相图坐标 \\(p_c\\simeq0.571\\)、\\(\\nu\\simeq2.79\\) 可直接复用。","summary":"表面码经带旗标的随机 Pauli 退相干后成为经典混合态，作者把它映射为完全填充环路模型：Goldstone 相对应的是一类 Markov 长度发散的临界混合态，局部条件互信息按 \\(I(A:C|B)\\sim[\\log(r/l)]^{-\\alpha}\\)（\\(1\\leq\\alpha\\leq12\\)）衰减。该相内三种逻辑扇区等概率，\\(I(R:Q)\\to1/3\\)、全局解码成功率 \\(p^{\\star}_{\\rm succ}=2/3\\)；但挖去线度 \\(L/2\\) 的块后 \\(I(R:Q^{p_c})\\to0\\)，故准局域解码不可能。","problem":"表面码在退相干噪声下退化为无纠缠的经典混合态，但这类态仍可能有非平凡的 CMI 结构，因此“有没有相变”与“逻辑信息能否被局域地取回”是两个独立问题。已有的 Markov 长度判据只给出准局域可恢复的充分条件，而“存在全局解码器”远弱于“存在准局域解码器”。作者要回答三件事：带旗标的 Pauli 测量信道在 \\((p,q)\\) 平面上把表面码驱动到哪些相；各相的 \\(I(A:C|B)\\) 随距离如何衰减；临界相中逻辑比特的可恢复性究竟属于全局还是准局域。","method":"把每条旗标轨迹诱导的混合态用 Majorana/二聚体张量网络表示，得到环宇称约束下的完全填充环路模型（CPLC）。由于旗标逐点独立，整体 CMI 等于各轨迹 CMI 的旗标平均 \\(I(A:C|B)_{\\rho_{p,q}}=\\sum_f p(f)I(A:C|B)_{\\sigma_f}\\)，从而只需分析环路几何：只有同时触及 \\(A\\) 与 \\(C\\) 的环才贡献 CMI，进而与跨越数 \\(N_{\\rm span}\\)、回返概率 \\(Q(l)\\) 挂钩。数值上在 GF(2) 上用 Gaussian 消元统计独立约束数，取 \\(q=0.1\\)、\\(L\\le161\\) 计算三种分割几何的 CMI 与 \\(I(R:Q)\\)。","result":"\\(q=0.1\\) 时全局 CMI 在 \\(p_c\\simeq0.571\\) 处转变（\\(\\nu\\simeq2.79\\)），\\(I(R:Q)\\) 的转变点为 \\(p_c\\simeq0.537\\)（\\(\\nu\\simeq2.06\\)）。Goldstone 相内三种边界 Majorana 配对等概率，故 \\(\\Pr(\\bar\\sigma(f)=\\bar X)\\to1/3\\)、\\(I(R:Q)\\to1/3\\)、\\(p^{\\star}_{\\rm succ}=\\tfrac13\\cdot1+\\tfrac23\\cdot\\tfrac12=\\tfrac23\\)；局部几何下 CMI 按 \\([\\log(r/l)]^{-\\alpha}\\) 衰减，Markov 长度发散。对线度 \\(\\gamma L\\) 的穿孔，Goldstone 相中 \\(I(R:Q^{p_c})\\to0\\)，而两个短环相中穿孔不改变渐近值（1 或 0）。","contribution":"提出“恢复的电路复杂度相变”这一框架：用穿孔互信息作准局域可恢复性的必要条件——Theorem 1 证明准局域恢复下存在多项式尺寸的穿孔不改变渐近 \\(I(R:Q)\\)，Corollary 1 把结论加强到任意 \\(0<\\gamma<1\\) 的方形穿孔；其逆否命题把 Goldstone 相的 \\(I(R:Q^{p_c})\\to0\\) 直接转成“不存在准局域解码器”的证明。另一半是构造性的：用逐点半边重接与相应稳定子更新（Eq. 27）给出短环相中作用范围与深度均为 \\(O((\\log L)^{k})\\) 的显式解码器，从而在同一模型里把全局可恢复与准局域可恢复彻底分开。","limitation":"数值只在 \\(q=0.1\\) 一条割线与 \\(L\\le161\\) 上完成，不同观测量给出的 \\(\\nu\\) 在 2.06–2.79 间漂移且未报统计误差；\\(q=0\\) 边界上的“转变”（\\(p^{\\star}\\simeq0.7\\)）被作者自己判为完美金属不动点导致的有限尺寸交叉，估计需 \\(L_1\\sim400\\) 才能看到漂移。准局域解码器的截断论证依赖“\\((p,q)\\) 与 \\((0,0)\\) 同相”以及环路统计在边界与体内均匀这两个假设，失败率只用 Markov 不等式加并集界估计，没有实际解码模拟或误码曲线。模型只含带旗标的退相干，未涉及无旗标噪声、旗标误码与电路级噪声。","key_numbers":["\\(q=0.1\\) 时全局 CMI 的转变点 \\(p_c\\simeq0.571\\)、\\(\\nu\\simeq2.79\\)（Fig. 6a 的有限尺寸标度塌缩）","\\(q=0.1\\) 时 \\(I(R:Q)\\) 的转变点 \\(p_c\\simeq0.537\\)、\\(\\nu\\simeq2.06\\)（Fig. 9b，\\(L=21\\)–\\(161\\)，\\(10^{4}\\) 次采样）","Goldstone 相：\\(\\Pr(\\bar\\sigma(f)=\\bar X)\\to1/3\\)，故 \\(p^{\\star}_{\\rm succ}=\\tfrac13\\cdot1+\\tfrac23\\cdot\\tfrac12=\\tfrac23\\)，即 \\(I(R:Q)\\to1/3\\)（Sec. IV B 1，Eq. (20)）","局部几何 CMI 的上界衰减 \\(I(A:C|B)_{\\rm local}\\sim[\\log(r/l)]^{-\\alpha}\\)，\\(1\\leq\\alpha\\leq12\\)（Eq. (14)）","穿孔取线度 \\(\\gamma L\\)（\\(0<\\gamma<1\\)，数值用 \\(L/2\\)）：短环相 \\(I(R:Q^{p_c})\\) 保持 1 或 0，Goldstone 相趋于 0（Corollary 1、Fig. 11）","\\(q=0\\) 时 \\(L=21\\)–\\(161\\) 出现表观交叉 \\(p^{\\star}\\simeq0.7\\)；估计 \\(p^{\\star}\\) 漂到 0.75 需 \\(L_1\\sim2.8L_0\\approx400\\)（Appendix B，Eq. (B5)–(B6)）"],"url":"https://doi.org/10.1103/kgjs-qlsb","doi":"10.1103/kgjs-qlsb","pdf_url":"https://arxiv.org/pdf/2601.10792","abstract":"We demonstrate the existence of an extended non-equilibrium critical phase, characterized by sub-exponential decay of conditional mutual information (CMI), in the surface code subject to heralded random Pauli measurement channels. By mapping the resulting mixed state to the ensemble of completely packed loops on a square lattice, we relate the extended phase to the Goldstone phase of the loop model. In particular, CMI is controlled by the characteristic length scale of loops, and we use analytic results of the latter to establish polylogarithmic decay of CMI in the critical phase. We find that the critical phase retains partial logical information that can be recovered by a global decoder, but not by any quasi-local decoder. To demonstrate this, we introduce a diagnostic called punctured coherent information which provides a necessary condition for quasi-local decoding.","abstract_zh":"我们证明：在经受带旗标（heralded）随机 Pauli 测量信道的表面码中，存在一个延展的非平衡临界相，其特征是条件互信息（CMI）呈亚指数衰减。通过把所得的混合态映射到方格子上的完全填充环路系综，我们把这个延展相与环路模型的 Goldstone 相联系。特别地，CMI 由环路的特征长度尺度控制，我们利用后者已有的解析结果确立了临界相中 CMI 的多对数（polylogarithmic）衰减。我们发现该临界相保留了部分逻辑信息，这部分信息可由全局解码器恢复，但任何准局域解码器都无法恢复。为说明这一点，我们引入一个称为“穿孔相干信息”的诊断量，它给出了准局域解码的一个必要条件。","review":{"verdict":"小修","confidence":"中高","correctness":"核心主张站得住。Eq. (7) 把 \\(\\rho_{p,q}\\) 写成旗标块对角形式后，CMI 的旗标平均 Eq. (9) 与“只有同时触及 \\(A\\)、\\(C\\) 的环才贡献 CMI”的论证是严格的；Theorem 1（Eq. (24)）与 Corollary 1（任意 \\(0<\\gamma<1\\) 的方形穿孔）的证明思路——准局域光锥加“尺寸小于距离即可纠正”——我逐条核对过，没有明显漏洞，逆否命题的用法也合法。\\(I(R:Q)\\) 的轨迹二元性与 \\(p^{\\star}_{\\rm succ}=2/3\\)（Sec. IV B 1，Eq. (20)）自洽。数值我核对了 Fig. 6a（\\(p_c\\simeq0.571\\)、\\(\\nu\\simeq2.79\\)）与 Fig. 9b（\\(p_c\\simeq0.537\\)、\\(\\nu\\simeq2.06\\)），两处转变点与指数都不一致而正文未作解释，这是我最不放心的一处。Appendix B 关于 \\(q=0\\) 交叉属有限尺寸效应的论证（Eq. (B1)–(B6)）逻辑完整。","weaknesses":"· 数值只有 \\(q=0.1\\) 一条割线与 \\(q=0\\) 一条边界线，\\(L\\le161\\)，\\(\\nu\\) 在 2.06 与 2.79 之间漂移且没有误差棒，也未与 CPLC 的已知指数定量对照，难以判断相变点是否仍被有限尺寸效应污染。\n· Goldstone 相的多对数衰减来自不等式方向的界（\\(I(A:C|B)_{\\rm global}\\le\\tfrac12\\langle N_{\\rm span}\\rangle_f\\) 与 Eq. (14) 的 \\(1\\le\\alpha\\le12\\)），正文却按“确立的标度律”叙述，建议补上数值拟合的 \\(\\alpha\\) 作对照。\n· 准局域解码器纯属构造性存在证明，无任何解码模拟：截断依赖“\\((p,q)\\) 与 \\((0,0)\\) 同相”和环路统计在边界与体内均匀两个假设，失败率界中常数与 \\(\\ell\\) 的指数都未定，无法估计 tile 尺寸与深度代价。\n· 模型只含带旗标的退相干，\\(\\rho_{p,q}\\) 是无纠缠的经典混合态；与无旗标噪声、旗标误码、电路级噪声的关系未讨论，实用意义不明。\n· \\(q=0\\) 的表观交叉被正确排除，但 \\(q\\) 很小、\\(p\\) 接近 1 的区域是否仍有 Goldstone 相没有判据。","overclaim":"摘要中“but not by any quasi-local decoder”是全文最强的一句，但定理给的是“准局域可恢复 ⇒ 存在不改变渐近 \\(I(R:Q)\\) 的穿孔”这一必要条件，且要求 \\(d(L)\\ge cL^{\\alpha}\\)；结论成立的范围比句子暗示的窄。摘要的“establish polylogarithmic decay of CMI”实际由解析上界加数值支撑，宜写成“bounded by a polylogarithm”。标题里的 critical 也容易被读成纠缠临界，而这里是无纠缠经典系综的 CMI 临界。","citations":"应把 CPLC 的相图与指数直接对照解析结果（本文引作 [32]），并说明测得的 \\(\\nu\\simeq2.8\\) 与该文献预期是否一致；准局域可逆部分需要更明确地定位相对 [13]（局部 Lindblad 可逆性、Markov 长度充分条件）与 Hastings–Koma 的改进之处；混合态 CMI 标度应补 Bao–Block–Altman 的 Markov 长度判据与 Sang–Hsieh 等的测量诱导临界工作，说明本文的 \\(\\alpha\\) 区间与它们的差别；穿孔诊断与相干信息、局域可解码性的算子代数结果之间缺少定位。","questions":"①Fig. 6a 的 \\(\\nu\\simeq2.79\\) 与 Fig. 9b 的 \\(\\nu\\simeq2.06\\) 为何差这么多，能否落在同一 CPLC 普适类？两者的拟合窗口与误差棒各是多少？\n②能否给出 Goldstone 相 CMI 数值拟合的 \\(\\alpha\\) 值，并说明它在 \\(L\\le161\\) 已稳定，而不是仍随 \\(L\\) 漂移？\n③短环相解码器的 tile 尺寸 \\(\\ell={\\rm polylog}(L)\\) 的指数与常数具体是多少，能否给出 \\(L=101\\) 上的实际解码成功率曲线，以支撑“准局域可实现”的操作性说法？","basis":"全文读的是 arXiv:2601.10792 预印本（出版社 PRX Quantum 排版版未获取）；abstract 取自预印本摘要。已读 Sec. I–V 正文、Fig. 1–14，以及 Appendix A（Theorem 1、Corollary 1 的证明）与 Appendix B（\\(q=0\\) 的表观交叉与有限尺寸分析）；附录中部分 Majorana 张量推导只读了结论。"}},{"id":"arxiv-2611.29488","no":7,"topics":["测控与噪声","编译与验证"],"source":"arXiv","venue":"arXiv","published":"2026-11-22","title":"Unveiling the Action of Randomized Compiling on Quantum States: A Geometric Perspective","title_zh":"从几何视角揭示随机编译对量子态的作用","authors":["Kai Tang","Chao Zhan","Yao Song","Peiling Huang","Yuxuan Zhou","Song Liu","Junkai Zeng","Jiansheng Wu","Tongxing Yan","Xiu-Hao Deng","Yuanzhen Chen"],"abstract":"Randomized compiling (RC) converts coherent errors into stochastic Pauli noise, but this conversion alone does not imply isotropic contraction of the output state. Here we use the generalized Bloch vector (GBV) representation to examine the cumulative effect of RC on state purity and orientation in multi-layer circuits. For the independent, isotropically distributed weak coherent errors considered here, the accumulated ensemble-averaged RC channel lies close to the depolarizing direction, producing a state-level near-isotropic contraction that sacrifices a small amount of purity to achieve a substantial suppression of orientational deviation. When dephasing coexists, RC suppresses the coherent-error contribution but leaves a residual deviation dominated by dephasing, setting a limit that we term the \"dephasing wall\". We experimentally validate these findings on a superconducting quantum processor through GHZ state preparation and phase estimation in a simulation of topological braiding. The results confirm that RC's effectiveness stems from its ability to suppress the orientational bias of coherent errors---a structural transformation not resolved by fidelity alone but directly visible through GBV diagnostics.","abstract_zh":"随机编译（RC）把相干误差转化为随机 Pauli 噪声，但仅完成这一转化并不能推出输出态发生各向同性收缩。本文用广义 Bloch 矢量（GBV）表示，考察 RC 在多层线路中对态纯度与取向的累积效应。对本文所考虑的独立、各向同性分布的弱相干误差，累积的系综平均 RC 通道接近去极化方向，产生态层面的近各向同性收缩，即以少量纯度损失换取取向偏差的显著抑制。当去相位同时存在时，RC 抑制相干误差的贡献，但留下由去相位主导的残余偏差，作者把这一极限称为“退相干墙”（dephasing wall）。作者在超导量子处理器上，通过 GHZ 态制备以及在拓扑编织模拟中的相位估计实验验证了上述结论。结果确认 RC 的有效性源于它抑制相干误差取向偏置的能力——这是一种仅靠保真度无法分辨、但通过 GBV 诊断可以直接看到的结构性变换。","importance":4,"importance_reason":"把 RC 的收益从“保真度看不出差别”推进到可测的取向诊断：对做 RC 与相位估计的超导实验组，它给出用 GBV 分量而非保真度评估缓解效果的操作性判据，并说明去相位残余不能靠增加随机序列消除。","summary":"用广义 Bloch 矢量（GBV）把随机编译（RC）对态的作用拆成纯度与取向：相干误差只旋转 GBV，层间独立的弱相干误差经逐层 Pauli twirl 后累积通道趋近去极化方向，取向偏差被大幅压低而纯度只小幅损失；若并存去相位，残余偏差由去相位主导，构成“退相干墙”。4 比特 20 层模拟中裸线路 \\(\\theta_{GBV}\\) 比 RC 大 30 倍以上、RC 纯度仅降约 5%；GHZ 实验集合平均 \\(\\theta_{GBV}\\) 由 0.281 降至 0.138，保真度几乎不变。","problem":"已有理解停留在通道层面：RC 把相干误差转成随机 Pauli 误差，从而改善迹距离与最坏情形保真度。但 Pauli 噪声一般各向异性，所以“转化成功”本身并不说明输出态的取向被保住。而保真度、迹距离等常规指标把所有偏差压成一个标量，无法区分“态被旋转”与“态被收缩”，也就无法解释为何 RC 在小相干占比的器件上仍有可观收益。作者问：RC 在多层线路中对输出态究竟做了什么几何变换，残余偏差由什么决定，RC 的收益应体现在哪类任务指标上。","method":"用广义 Bloch 矢量表示 \\(\\rho=I/d+\\sum_j r_j\\Gamma_j/d\\)，长度编码纯度、方向编码取向，并以 \\(\\theta_{GBV}=\\arccos(\\hat r(\\rho)\\cdot\\hat r(\\sigma))\\) 单独度量取向偏差；把 n 层线路重排为理想演化加“有效误差帧”，在层间独立的各向同性弱相干误差下对每层做穷举 Pauli twirl 并逐层归纳，证明一阶相干项与二阶层间交叉项消失，再用 Hoeffding 不等式给出通道级近去极化角的高概率界（Appendix F）。实验在三比特 GHZ 制备与 D(Z3) 量子双模型的相位估计上完成，另提出 block-RC 以降编译开销。","result":"N=4、20 层时裸线路取向偏差比 RC 大 30 倍以上，RC 纯度只降约 5%，通道级界为 \\(\\theta_{ch}(T_{RC})\\le 0.05168\\) rad（置信度 95%）。GHZ 实验集合平均 \\(\\theta_{GBV}\\) 由 0.281 降至 0.138（降 51%），纯度 0.818 降至 0.775（降 5%），而单条序列保真度几乎不变（86.7% 对 87.2%）。拓扑编织 trivial 支路 48 维 \\(\\theta_{GBV}\\) 由 0.524 降至 0.213，相位误差相应减小；1000 组误差构型下平均相位误差由 0.130 降至 0.013，RC 在 100% 构型中降低 \\(\\theta_{GBV}\\)、在 92.8% 构型中降低相位误差。","contribution":"给出“取向—纯度”分离的几何诊断：把 RC 的收益从保真度无法分辨的层面，变成可逐分量测量的 GBV 结构变化；证明穷举 RC 消去一阶相干项与二阶层间交叉项，并给出近去极化角的有限深度、高概率界，使“近去极化”从定性说法变成 \\(\\theta_{ch}\\le0.05\\) rad 量级的定量陈述；提出 block-RC，把 twirl 构型数由 \\(4^{nN}\\) 降到 \\(4^{N}\\)，并给出其适用条件（Clifford 块）；用“退相干墙”明确 RC 的能力边界——增加随机化不能消除去相位残余。","limitation":"近去极化的结论依赖层间独立、各向同性分布的弱相干误差与 \\(|\\theta_j|\\le0.05\\)，作者自己承认 block-RC 与逐层 RC 的等效只是本模型下的观察：Appendix E 给出同层强关联误差时单块 twirl 明显变差（n=20 保真度 0.643 对 0.974）。实验只覆盖一台器件的一种误差构型，退相位通道固定为标定值，因此“退相干墙”的高度没有被主动改变去相位强度所检验；相位不确定度用 jackknife 估计，未量化共同标定系统偏差。GBV 分量数随比特数指数增长，诊断可扩展性依赖任务；也缺与 PEC/ZNE 等基线的成本对比与总的编译开销预算。","key_numbers":["N=4、n=20 层：裸线路 \\(\\theta_{GBV}\\) 比 RC 大 30 倍以上，RC 纯度仅下降约 5%（Sec. II B，Fig. 1(g)(h)）","通道级近去极化界：\\(\\theta_{ch}(T_{RC})\\le 0.05168\\) rad，置信度不低于 95%，参数 d=16、n=20、\\(|\\theta_j|\\le 0.05\\)（Appendix F，式 (F4)）","GHZ 实验：集合平均 \\(\\theta_{GBV}\\) 由裸线路均值 0.281 降至 0.138，纯度由 0.818 降至 0.775（Sec. III，Fig. 2(d)(e)）","拓扑编织 trivial 支路：48 维 \\(\\theta_{GBV}\\) 由 0.524 降至 0.213，相位由 \\(-0.690\\pm0.011\\) 变为 \\(-0.227\\pm0.025\\) rad（Table I）","1000 组误差构型：平均相位误差由 0.130 降至 0.013，RC 把 \\(\\theta_{GBV}\\) 压到裸线路的 39.69%（trivial）与 28.75%（nontrivial）（Sec. IV C，Fig. 4(c)(d)）","门保真度：单比特门高于 0.999 且非相干占比不低于 94%，iSWAP 保真度 0.9917 其中 84% 为非相干（Appendix I，Fig. 8）"],"url":"https://arxiv.org/abs/2611.29488","pdf_url":"https://arxiv.org/pdf/2611.29488","doi":"","review":{"verdict":"小修","confidence":"中高","correctness":"核心主张成立，关键环节我核对过。Appendix B、D 的推导干净：逐层 Pauli twirl 后在广义 Pauli 基下 \\(T_j(\\Gamma_a)=\\lambda_a^{(j)}\\Gamma_a\\)（式 (D8)），整条 RC 通道被写成对角矩阵 \\(R_{RC}={\\rm diag}(\\lambda_a^{RC})\\)（式 (D9)），这确实说明“转化为随机 Pauli 噪声”与“GBV 各向同性收缩”是两件不同的事，摘要的立论站得住。Appendix F 的数值我重算过：\\(b_j=-\\ln\\cos(0.1)\\approx0.00501\\)、\\(\\sum_j b_j^2\\) 开方约 0.02240、取 \\(\\delta=0.05\\)、\\(d=16\\) 得 \\(t_\\delta\\approx0.04812\\)，代入式 (F4) 得 \\(\\tan\\theta_{ch}\\le0.05173\\) 即 0.05168 rad，链条自洽。Table I 的相位标准误也自洽：trivial 支路相位差 0.463 rad、合成误 0.0273，比值约 17.0 对 16.8；nontrivial 支路差 0.0683、合成误 0.0218，比值约 3.1，与表一致。GHZ 段“保真度几乎不变而 \\(\\theta_{GBV}\\) 减半”也与 Fig. 1(e)(h) 趋势吻合。","weaknesses":"· 结论的适用域比标题暗示的窄：近去极化只在层间独立、Haar 各向同性、\\(|\\theta_j|\\le0.05\\) 的弱相干误差下被证明，而 Appendix E 自己的 n=20 数据（保真度 0.643 对 0.974）已经显示同层强关联误差会让单块 twirl 失效，正文却没有给出“层间关联多强会破坏等效”的定量阈值。\n· “退相干墙”没有被独立检验：实验中去相位强度固定为标定值，作者没有扫描注入去相位（例如额外 Z 噪声或改变 T2）来验证墙的高度是否随去相位强度单调上升；它目前是模型内推论的名称，不是被测量的现象。\n· 成本没有算进结论：Table I 显示 RC 把相位标准误从 0.011 放大到 0.025，集合平均用了 50 条序列、Sec. IV C 用 100 条，而精度只从 0.130 到 0.013。缺一个“总采样开销相同”条件下的公平比较，也没和 PEC、ZNE 或 error-corrected 相位估计对比。\n· GBV 诊断的可扩展性被回避：正文只展示任务相关的 48 个分量（附录 H 的表也据此裁剪），\\(4^{N}-1\\) 个分量在更大比特数下的测量预算与层析成本没有任何估计，而这正是“用 GBV 取代保真度”能否落地的关键。","overclaim":"摘要末句“RC's effectiveness stems from its ability to suppress the orientational bias”偏强。实验数据（Fig. 2(d)）显示单条序列的 \\(\\theta_{GBV}\\) 只从 0.281 降到 0.265，纯度几乎不动，全部收益都出现在对 50 条密度矩阵求平均之后；对不重复平均的单次运行，这一因果关系并未被证明。另外把 dephasing wall 称作“a limit”也过头：它依赖 Pauli 去相位不被 twirl 改变的模型事实，非 Pauli 的去相位（如慢漂移、1/f 型低频噪声）下墙的图像是否同样成立，文中未讨论。","citations":"最该补的是 Gu 等人的 noise-resilient phase estimation with randomized compiling（PRL 130, 250601 (2023)）：那正是本文的相位估计场景，且给出了精度增益的解析代价关系，本文仅在 Sec. IV 泛泛提及而未做定量对照。其次应引 Wallman–Emerson 关于 twirl 后通道级保真度的结果、Hashim 等 PRX 11, 041039 (2021) 的 RC 实验，以及 cycle/coherent-error reconstruction（Carignan-Dugas 等 2024）——用来论证为何需要 GBV 而不只是既有指标。最后，Fig. 6 的 block-RC 应和 randomized compiling 的分块变体（如 sparse RC）显式对比。","questions":"① 若把注入去相位强度提高 2 倍、5 倍，\\(\\theta_{GBV}\\) 的残余平台是否按文中模型预期等比上升？请给出一条扫描曲线，否则“墙”只是命名。\n② 层间误差关联强度从无关联到完全关联连续变化时，\\(\\theta_{ch}\\) 的界在何处失效？Appendix E 只给了两个端点。\n③ 在总测量次数固定（例如 RC 50 条序列的总 shots 等于裸线路 50 次的 shots）时，相位估计的最终不确定度是否仍优于裸线路？Table I 的 0.025 与 0.011 需要这一对照才有说服力。\n④ 48 个 GBV 分量是如何从 \\(4^{N}-1\\) 个中选出的？换成别的任务（如变分优化）该选择规则是否仍可事先确定？","basis":"全文：arXiv:2611.29488v1 预印本（出版社排版版未获取，abstract 取自预印本摘要，biblio 无 DOI）。读了正文 Sec. I–V、Fig. 1–8、Table I–V，以及 Appendix A–L（重点复核 Appendix B/D 的通道推导、Appendix F 的数值界、Appendix K 的 jackknife 定义）。未读到补充材料或原始测量数据。"}},{"id":"arxiv-2611.31953","no":8,"topics":["纠错码","算法"],"source":"arXiv","venue":"arXiv","published":"2026-11-24","title":"Schur saturation and the Clifford ceiling in qudit CSS codes","title_zh":"qudit CSS 码中的 Schur 饱和与 Clifford 天花板","authors":["José Alberto Guzmán-Vega","Juan Carlos Jiménez-Cervantes","Eliseo Sarmiento-Rosales"],"abstract":"Orthogonality-type conditions (triorthogonality in the qubit setting and its prime-dimensional analogues), are the primary algebraic screening criterion for transversal non-Clifford gate constructions in CSS codes. In every known positive construction the certificate is accompanied by a non-Clifford logical gate, leaving open whether a CSS family can satisfy these conditions to arbitrarily high order while admitting no such gate. We answer this question for the class of symmetric spectral CSS codes $Q(A)=CSS(C(A),C(A))$ built from character evaluation on a finite abelian group $G$ with $\\exp(G)\\mid p-1$, $p\\geq 5$ prime. The mechanism is the identity \\[C(A)^\\perp * C(A)^\\perp=\\mathbb{F}_p^G,\\] which we call Schur saturation of the dual code. It follows from the CSS self-orthogonality condition $A\\cap(-A)=\\varnothing$ and annihilates every local polynomial phase of degree $\\geq 3$. The complete gate-group classification $S^{CSS}_{\\leq p-1}(A)=C(A)^\\perp \\oplus C(Stab(A))$ shows that every strictly CSS-preserving local-diagonal transversal gate lies at level $\\leq 2$ of the Clifford hierarchy, a structural bound we call the Clifford ceiling. The criterion extends to arbitrary CSS pairs satisfying $C_Z^\\perp * C_Z^\\perp=\\mathbb{F}_p^n$; the LDPC instance $[[58,16,3]]_5$ is verified computationally. The false-positive character of the orthogonality certificates is sharpest in the Boolean toric family: these codes satisfy $\\ell$-orthogonality for $\\ell\\leq p-2$, yet the non-Clifford sector collapses to zero. The flagship instance $[[64,56,3]]_5$ encodes $56$ logical ququints at rate $R=0.875$ with distance-$3$ protection, passes every orthogonality screening test, and yet admits no local-diagonal non-Clifford gate of any degree. The unique non-Pauli survivor is the uniform quadratic drive $Q_u$, fault-tolerant, logically nontrivial, and Clifford at level $2$, carrying no magic-state resource.","abstract_zh":"正交型条件（qubit 情形下的三正交性及其素维类比）是 CSS 码中横截非 Clifford 门构造的主要代数筛选判据。在所有已知的正向构造中，该证书都伴随一个非 Clifford 逻辑门，因此一直悬而未决的问题是：是否存在某个 CSS 族能把这类条件满足到任意高阶，却不允许这样的门。本文针对对称谱 CSS 码类 \\(Q(A)=CSS(C(A),C(A))\\) 回答该问题；这类码由有限阿贝尔群 \\(G\\) 上的特征求值构造，要求 \\(\\exp(G)\\mid p-1\\)、\\(p\\geq 5\\) 为素数。机制是恒等式 \\(C(A)^\\perp * C(A)^\\perp=\\mathbb{F}_p^G\\)，我们称之为对偶码的 Schur 饱和。它由 CSS 自正交条件 \\(A\\cap(-A)=\\varnothing\\) 推出，并湮灭所有次数 \\(\\geq 3\\) 的局域多项式相位。完整的门群分类 \\(S^{CSS}_{\\leq p-1}(A)=C(A)^\\perp \\oplus C(Stab(A))\\) 表明：每个严格保持 CSS 的局域对角横截门都位于 Clifford 层级的第 \\(\\leq 2\\) 层，我们称这一结构性上界为 Clifford 天花板。该判据可推广到满足 \\(C_Z^\\perp * C_Z^\\perp=\\mathbb{F}_p^n\\) 的任意 CSS 码对；其中 LDPC 实例 \\([[58,16,3]]_5\\) 已通过计算验证。正交性判据的假阳性特征在 Boolean toric 族中最为尖锐：这些码对 \\(\\ell\\leq p-2\\) 满足 \\(\\ell\\) 正交性，但非 Clifford 扇区坍缩为零。旗舰实例 \\([[64,56,3]]_5\\) 以速率 \\(R=0.875\\) 编码 56 个逻辑 ququint、具有距离 3 的保护，通过了所有正交性筛查测试，却不存在任何次数的局域对角非 Clifford 门。唯一存活的非 Pauli 门是均匀二次驱动 \\(Q_u\\)：它容错、逻辑上非平凡、属于第 2 层 Clifford，且不携带魔法态资源。","importance":3,"importance_reason":"对做横截非 Clifford 门与魔法态蒸馏选码的读者：它给出只看对偶码谱支撑就能排除整族 CSS 码的闭式判据，纠正把 ℓ 正交性当作非 Clifford 门存在性证据的常见推断，也标出了哪些非对称构造才可能逃逸。","summary":"对称谱 CSS 码 \\(Q(A)\\) 在 \\(A\\cap(-A)=\\varnothing\\) 时对偶码 Schur 饱和 \\(C(A)^\\perp * C(A)^\\perp=\\mathbb{F}_p^G\\)，该恒等式湮灭所有次数 \\(\\geq 3\\) 的局域多项式相位，使门群坍缩为 \\(C(A)^\\perp\\oplus C(\\mathrm{Stab}(A))\\)。Boolean toric 族 \\(\\ell\\) 正交到 \\(p-2\\) 阶仍无非 Clifford 门；旗舰码 \\([[64,56,3]]_5\\) 速率 0.875 亦然。","problem":"横截非 Clifford 门是容错量子计算的核心资源，而工程上最易核验的候选判据是正交型条件：qubit 情况下的三正交性（\\(\\ell=3\\)，即 \\(\\langle f_1f_2,g\\rangle=0\\)）及其素维推广 \\(\\ell\\) 正交性，它们也是 Bravyi–Haah 与 Campbell–Anwar–Browne 蒸馏框架的代数基础。问题在于所有已知正向构造里的正交性证书都伴随一个真实的非 Clifford 逻辑门，于是无法判断证书本身是否足以推出门的存在。若某个 CSS 族能把 \\(\\ell\\) 正交性满足到任意高阶却仍无此类门，则“证书即门”的直觉在该族上失效，这直接决定魔法态蒸馏码块的筛选流程是否可靠。此前既无这样的反例，也没有闭式的门群分类。","method":"在 \\(G=(\\mathbb{F}_p^*)^m\\) 上定义谱码 \\(C(A)\\) 与对称 CSS 码 \\(Q(A)\\)，把 \\(\\ell\\) 正交性化为 \\(((\\ell-1)A)\\cap(-A)=\\varnothing\\)（Thm 7）。关键是自正交使对偶谱支撑 \\(B=H\\setminus(-A)\\) 满足 \\(|B|>|H|/2\\)，多数和引理给出 \\(B+B=H\\)，即 Schur 饱和 \\(C(A)^\\perp * C(A)^\\perp=\\mathbb{F}_p^G\\)（Thm 14）。再用 CASI 判据极化高次项、靠满支撑逼出系数为零（Thm 16、17）；二次扇区由乘子代数分类，合得门群闭式（Thm 18、19）。最后推广到任意 CSS 码对，只需 \\(D*D=\\mathbb{F}_p^n\\) 与满坐标支撑（Thm 21），并用 Lemma 44 核验 LDPC 实例。","result":"Boolean toric 族：任意非空 \\(A\\subseteq\\{0,1\\}^m\\setminus\\{0\\}\\)、素数 \\(p\\geq5\\)，\\(\\ell\\) 正交阈值为 \\(\\ell_{\\max}=p-2\\)、与 \\(A\\) 无关（Thm 33），门群为 \\(C(A)^\\perp\\oplus\\langle Q_{unif}\\rangle\\)（Cor 42）。速率最优族 \\(Q^{*m}=[[(p-1)^m,(p-1)^m-2(m+1),3]]_p\\)；\\(p=5,m=3\\) 即 \\(Q^{*3}=[[64,56,3]]_5\\)，CASI 扇区 65 维、CSS 扇区 61 维（Rem 43）。LDPC 实例 \\([[58,16,3]]_5\\) 由 \\(H\\in\\mathbb{F}_5^{3\\times7}\\) 超图积构造，\\(D*D=\\mathbb{F}_5^{58}\\)、\\(d_Q=3\\)（Cor 47）。","contribution":"把“正交性证书”与“门是否真的存在”之间的空隙显式化：给出 Schur 饱和这一纯代数机制，并证明它在对称谱框架下与码率、距离、正交阶数完全无关地把局域对角横截门群压到 Clifford 层级 \\(\\leq 2\\) 层，从而对 CAB 型蒸馏码块给出闭式排除判据（Thm 1、Cor 42）——只需看对偶码的谱支撑，无需门计算或陪集枚举。同时给出首个显式族的完整门群分类 \\(C(A)^\\perp\\oplus C(\\mathrm{Stab}(A))\\)，并指出逃逸只能来自破坏对称性（\\(C_1\\neq C_2\\)）或在证书之外补上额外代数结构（Reed–Muller 乘积规则、可寻址编码等），把“缺什么结构”变成可检验的条件（Thm 21、§5.4）。","limitation":"作者自划的边界很清楚：结论只覆盖计算基下严格保持 CSS、且是单点相位之和的局域对角门，非对角横截门、换基后的对角门、非局域相位、ancilla 辅助协议都不在射程内（§6 与开放问题 3）。此外 \\(\\ell\\) 正交性只被当作候选门层级的提示，文中未把它与任何具体蒸馏协议的成功率或魔法态开销做横向比较；除 \\([[58,16,3]]_5\\) 一个 58 维实例外没有规模更大的计算证据，Thm 21 对一般 CSS 码对仍依赖 \\(D*D=\\mathbb{F}_p^n\\) 与满坐标支撑两条假设，而这两条对现代 LDPC 族是否成立被留作开放问题 1；旗舰码速率 0.875 但距离仅 3，抗错能力有限，文中也未给电路级噪声下的逻辑错误率或解码性能。","key_numbers":["旗舰码 Q*3：p = 5、m = 3 时为 [[64, 56, 3]]，n = 64、k = 56、d = 3、速率 R = 0.875（摘要；§5.3 例 39；表 2）","Q*3 的完整门群维数：CASI 扇区 65 维、严格 CSS 扇区 61 维（dim C(A) = 4、dim C(A) 的补 = 60，再加 1 个 Q_unif）（§5.3 注 43）","Boolean toric 族 ℓ 正交阈值恒为 ℓmax = p − 2，与 A 的选取无关（§5.3 定理 33）","速率最优子族 Q*m：物理 qudit 数 n = (p−1) 的 m 次幂，k = n − 2(m+1)，d = 3（p ≥ 5、m ≥ 3）（§5.3 定理 38）","LDPC 超图积实例 [[58, 16, 3]] 于 p = 5：3×7 种子矩阵 H，rank(HX) = rank(HZ) = 21、k = 16、D*D 占满 58 维，每侧 168 个权 3 逻辑算符（§5.5 推论 47）","对称 RS 例：p = 13、k = 2、n = 12 时为 [[12, 8, 3]]，ℓmax = 5 本应指向 5 级门，但非 Clifford 扇区为零（§5.1 例 29、命题 27）"],"url":"https://arxiv.org/abs/2611.31953","pdf_url":"https://arxiv.org/pdf/2611.31953","doi":"","review":{"verdict":"小修","confidence":"中高","correctness":"核心主张成立度较高，我按链条逐条核对。Thm 7 把 \\(\\ell\\) 正交性等价于 \\(((\\ell-1)A)\\cap(-A)=\\varnothing\\)，用 Parseval 与卷积可复算；Thm 14 依赖 Lemma 13 的 \\(|B|=|H\\setminus(-A)|\\ge(|H|+|H[2]|)/2>|H|/2\\) 得 \\(B+B=H\\)，对任意有限交换群成立，无漏洞；Cor 8、Cor 15 与自正交条件一致。Thm 16、17 的极化需 \\(p\\ge5\\)（系数 6 与三个互异 \\(\\lambda\\) 非零），文中已声明，逻辑闭合。Thm 19 与 Prop 24 把二次扇区归到 \\(\\mathrm{Mult}(C(A))=C(\\mathrm{Stab}(A))\\)，与 Rem 43 的数值（CASI 65 维、CSS 61 维）自洽。Thm 33 的 \\(\\ell=p-1\\) 分支用 \\((p-2)\\alpha\\equiv-\\alpha\\) 处理，正确。§5.5 的 \\(D*D=\\mathbb{F}_5^{58}\\) 与 \\(d_Q=3\\) 我只按 \\(\\dim D=37=58-21\\) 与 Lemma 44 的 \\(58\\le\\binom{38}{2}\\) 做了量级核对，未复现代码。","weaknesses":"· 记号混淆对象：Thm 19 写 \\(S^{casi}=\\mathbb{F}_p^G\\oplus C(\\mathrm{Stab}(A))\\)，而 \\(\\mathbb{F}_p^G\\) 本是函数空间；Rem 43 又给出 \\(\\dim S^{casi}=65>|G|=64\\)，说明实为系数向量空间。请补 \\((\\gamma,\\beta)\\mapsto\\phi\\) 的映射与维数记账，否则 65 像算错。\n· 泛化证据单薄：Thm 21 要求 \\(D*D=\\mathbb{F}_p^n\\) 与满坐标支撑，全文只有 §5.5 一个 \\(n=58\\) 实例，无规模化或随机采样统计，无法判断该条件是 qLDPC 族的常态还是例外。\n· 无双蒸馏基线（Bravyi–Haah 15-to-1、CAB、cultivation 开销）的量化对比，读者无法判断“无魔法态资源”的工程含义。\n· 摘要与 §1 的“every known positive construction 都伴随门”及 Rem 28 的“first explicit gate-group classification”属覆盖性断言，正文无系统检索支撑。\n· 只覆盖单点相位之和的局域对角门；缺“局部 Clifford 换基后是否仍无三次门”的不变性讨论，而这直接决定结论的适用范围。","overclaim":"摘要末句称 \\(Q_u\\) 是唯一存活的非 Pauli 门、“carrying no magic-state resource”，配合 §1 的“We answer this question”，读起来像该问题已被完全解决；实际答案只对对称谱码及满足两条附加假设的 CSS 码对成立，且“无魔法态资源”只是“门群落在 2 级”的同义改写，不是资源度量。摘要的“passes every orthogonality screening test”也易被误读为该码适合作蒸馏码块，实际结论恰好相反。","citations":"建议补并逐条对照：① Bravyi–Kitaev 对 Eastin–Knill 的加强版与 transversal 门集合的分类结果，说明 Clifford 天花板是否已被更一般的刚性定理蕴含；② Campbell–Anwar–Browne 与 Bravyi–Haah 原文中“三正交性推非 Clifford 门”的假设清单，核对“每个已知构造都伴随门”是否覆盖换基构造、monomial 码与 color code；③ 用与 [5][8] 同参数（\\(p\\)、\\(k\\)）的 punctured RS 做数值对照，而不只是引用；④ 若文献中已有 qLDPC 族满足 \\(D*D=\\mathbb{F}_p^n\\) 的讨论，应指出并比较。","questions":"① Thm 19 中 \\(S^{casi}=\\mathbb{F}_p^G\\oplus C(\\mathrm{Stab}(A))\\) 的直和取在哪个空间？请给出 \\((\\gamma,\\beta)\\mapsto\\sum_P\\gamma_P x_P+\\sum_R\\beta_R x_R^2\\) 的显式映射与维数核对，并解释 Rem 43 的 65 维如何与 \\(5^{64}\\) 维函数空间相容。② 对 \\(Q(A)\\) 施加局部 Clifford 换基后再问非 Clifford 横截门，天花板是否仍成立？③ Zenodo 包能否逐步复现 §5.5 的 \\(d_Q=3\\) 与每侧 168 个权 3 逻辑算符的枚举？","basis":"读了 arXiv:2611.31953 全文 txt：§1 引言、§2 层级与三次相位、§3 谱码与 Thm 7、§4 Thm 14–21 与 Lemma 44、§5 全部（RS、Boolean toric、Thm 33/36/38、§5.4 逃逸构造、§5.5 LDPC 与表 2）、§6 与开放问题。未运行 Zenodo 代码，计算类结论未独立复现；该文仅有 arXiv 预印本。"}},{"id":"arxiv-2611.29689","no":9,"topics":["纠错码"],"source":"arXiv","venue":"arXiv","published":"2026-11-23","title":"Local redundancies are necessary for long-lived memories in finite spatial dimensions","title_zh":"有限空间维度下长寿命热记忆必须依赖局部冗余","authors":["Chao Yin","Yaodong Li","Benedikt Placke","Vedika Khemani"],"abstract":"We prove a no-go theorem for exponentially long-lived thermal memories, based on the structure of redundancies among Hamiltonian terms. For local stabilizer Hamiltonians in finite spatial dimensions, the absence of local redundancies---relations in which the product of a small number of Hamiltonian terms equals the identity---is known to preclude bulk thermodynamic phase transitions. Yet glassy dynamics can still sustain long-lived memories even without a thermodynamic transition, as demonstrated by LDPC codes on non-Euclidean graphs. A longstanding question, exemplified by Haah's cubic code, is whether such a mechanism can also support passive (quantum) memory in finite-dimensional Euclidean systems. We show that this route fails for local stabilizer Hamiltonians without local redundancies: at any constant nonzero temperature, local heat-bath dynamics is fast mixing, with $O(N)$ mixing time, where $N$ is the number of qubits. We establish this by proving a strong decay of correlations property of the thermal Gibbs state. We further prove rapid mixing with $O(\\log N)$ mixing time under a stronger condition on induced redundancies in suitably chosen regions. This stronger result applies to several well-studied examples, including Haah's cubic code and its generalizations, as well as three-dimensional layer codes. Our work identifies redundancy structure as a key property for understanding thermal memories.","abstract_zh":"我们证明了一个关于指数长寿命热记忆的不可能定理，其依据是哈密顿量各项之间冗余的结构。对于有限空间维度中的局部稳定子哈密顿量，已知局部冗余（即少数哈密顿量项的乘积等于恒等元的那些关系）的缺失会排除体热力学相变。然而，正如非欧几里得图上的 LDPC 码所展示的，即使没有热力学相变，玻璃动力学仍可维持长寿命记忆。一个长期悬而未决的问题（以 Haah 立方码为典型例子）是：这种机制是否也能在有限维欧氏系统中支撑被动（量子）记忆。我们证明，对于没有局部冗余的局部稳定子哈密顿量，这条路线行不通：在任意常数非零温度下，局部热浴动力学快速混合，混合时间为 \\( O(N) \\)，其中 \\( N \\) 为量子比特数。我们通过证明热 Gibbs 态具有强关联衰减性质来建立这一点。我们进一步证明，在适当选取的区域中对诱导冗余施加更强条件时，可实现混合时间为 \\( O(\\log N) \\) 的快速混合。这一更强的结果适用于若干被充分研究的例子，包括 Haah 立方码及其推广，以及三维层码。我们的工作把冗余结构确立为理解热记忆的关键性质。","importance":3,"importance_reason":"把“有限维是否存在被动量子记忆”从逐模型反证提升为一条可检验的统一判据（冗余结构），直接压缩自纠正码与热稳定拓扑相的搜索空间；做自纠正码、分形子与玻璃动力学的人需据此重估三维候选。","summary":"证明有限维格点上无局部冗余的局部稳定子哈密顿量不存在被动热记忆：任意常数逆温下单格点热浴 Glauber 动力学有正谱隙 \\( \\Delta>0 \\)、混合时间 \\( t_{\\mathrm{mix}}=O(N) \\)，无法把信息保存指数长时间；若各平移区域内的诱导冗余都足够大，则块动力学 \\( t_{\\mathrm{mix}}=O(\\log N) \\)，覆盖 Haah 立方码与三维层码。关键是把热化速度归约为缓冲区分割函数对边界条件的近似因子化，误差由冗余的尺寸与计数控制。","problem":"三维及以下欧氏格点能否承载被动量子记忆，是拓扑量子存储的核心问题。LDPC 码在非欧氏图上可以没有热力学相变却仍有玻璃动力学与长寿命记忆；Haah 立方码这类分形支撑的稳定子码在有限温无相变，也被寄望于缓慢动力学。此前只能对具体模型逐个反证，缺少统一判据：究竟什么样的冗余结构才允许指数长寿命记忆，一直没有答案。","method":"取 \\( H=-\\sum_{i\\in I}(h_i-I) \\)，\\( h_i \\) 为对易 Pauli 串、支撑在边长 \\( \\kappa \\) 的超立方体内；无局部冗余指任何非空 \\( R \\) 满足 \\( \\prod_{i\\in R}h_i=I \\) 时 \\( |R| \\) 至少为 \\( N \\) 的多对数。先用 Gibbs 态的空间马尔可夫性把关联衰减（SDOC）归结为缓冲区分割函数 \\( Z_B(\\phi) \\) 的边界近似因子化，偏差展开成诱导冗余求和 \\( \\sum_{R\\ne\\emptyset}(\\tanh\\beta)^{|R|} \\)；再用截断 \\( K\\sim r \\) 的贪心修剪把冗余挤到边界附近，配合向量空间 Hölder–Brascamp–Lieb 不等式控制该和；定理 2 改用最小割计数。","result":"定理 1：若最小冗余 \\( D\\ge(\\log N)(\\log\\log N)^{d+1} \\)，则任意常数 \\( \\beta \\) 下 Glauber 动力学有仅依赖 \\( d,\\kappa,\\beta \\) 的谱隙 \\( \\Delta>0 \\)，混合时间 \\( t_{\\mathrm{mix}}\\le c_{\\mathrm{mix}}N \\)，经典 Pauli-Z 情形亦成立。定理 2：若每个平移区域 \\( B_\\mu \\) 的非平凡诱导冗余满足 \\( |R|>c'L^{\\delta'} \\)，则常数尺度块热浴动力学 \\( t_{\\mathrm{mix}}=O(\\log N) \\)，已对 Haah 码（\\( \\delta'=1 \\)）、素数 qudit 推广、三维层码与 Newman–Moore 模型验证。","contribution":"把“有限维是否存在被动热记忆”从逐模型排除提升为统一判据：裸冗余与诱导冗余的尺寸和计数决定热化快慢，指数长寿命记忆必须以局部冗余为前提。据此统一解释了 Haah 码、层码、Newman–Moore 模型等的失败，并把 CSS 码的链复形论证推进到“自纠正记忆至少需要五段链复形”，压缩了候选码的搜索空间；技术上留下“修剪 + HBL 计数”这一可复用工具。","limitation":"只覆盖对易稳定子哈密顿量（含 CSS 与经典码），非对易 Pauli 模型、非阿贝尔任意子模型不在内；由 SDOC 推谱隙一步依赖配套工作 [2] 的推论 12，未自足证明。主文式 (2) 写 \\( (\\log N)^{d+1} \\) 而 S.M. 定理 1 写 \\( D\\ge(\\log N)(\\log\\log N)^{d+1} \\)，两处阈值未统一；冗余尺寸介于常数与多对数之间的码仍未被排除。常数随 \\( d,\\kappa,\\beta \\) 极快变差（如 \\( 9^d \\) 与 \\( (\\tanh\\beta) \\) 的幂），未给有限 \\( N \\) 的可用时间尺度；结论只针对特定 Glauber/块动力学。","key_numbers":["无局部冗余判据：非空 check 集合 R 的乘积为单位阵时须 |R| ≥ D，主定理取 D ≥ (log N)(log log N) 的 d+1 次方（S.M. 式 1.2、1.5）","定理 1：任意常数逆温 β 下混合时间为 O(N)（t ≤ 常数·N），谱隙 Δ > 0 仅由 d、κ、β 决定（S.M. 式 1.6–1.7）","定理 2：每个平移区域内诱导冗余 |R| > c′L 的 δ′ 次方时，块热浴动力学混合时间为 O(log N)（主文式 5–6）","分割函数比值偏差 ≤ (tanh β) 的 r/(9 的 d 次方·log r) 次幂，且 ε < 0.04（S.M. 式 3.19、3.21）","Haah 立方码与三维层码均取 δ′ = 1，即诱导冗余尺度随盒边长 L 线性增长（End Matter 式 24、S.M. 7.2 节）","每个 check 支撑在边长 κ 的超立方体内，κ ≥ 3 为奇数常数；每顶点至多被 2(2κ−1) 的 d 次方个 check 触及（S.M. 1 节）"],"url":"https://arxiv.org/abs/2611.29689","pdf_url":"https://arxiv.org/pdf/2611.29689","doi":"","review":{"verdict":"小修","confidence":"中高","correctness":"核心链条可信：由边界因子化 (9) 得 SDOC (7)，再由配套工作给出谱隙与 O(N) 混合时间，逻辑闭合。我核对了 (3.16)–(3.19) 的指数形式、(3.21) 中 ε < 0.04 的取法、(4.15)–(4.16) 的 |F| ≤ K|∂B|、以及 (5.9)–(5.11) 里 Hölder–Brascamp–Lieb 的代入，量级自洽。遗留两处需补：Lemma 8 取 K = r/(8 的 d 次方·log r)，而 (3.19)/(5.11) 的最终指数用 9 的 d 次方，中间 m/K 到 r/(9 的 d 次方·log r) 的换算未写出；主文式 (2) 的阈值 (log N) 的 d+1 次方与 S.M. 定理 1 的 (log N)(log log N) 的 d+1 次方关系也未注明。","weaknesses":"· 阈值窗口：多对数判据留下未覆盖区间——最小冗余尺寸在 O(1) 与多对数之间的码既不算“有局部冗余”，也未被定理排除，而这正是三维小码候选的常见形态。\n· 谱隙由 SDOC 推出时依赖配套工作 [2] 的 Corollary 12，本文未自足证明；Δ 只断言存在，未给对 β 的显式依赖，读者无法判断低温下需要多大的 N 才进入渐近区。\n· 定理 2 的验证逐模型进行：Haah 码用最小割 (24)，素数 qudit 用“多出 (p−1) 因子”的论证，层码在 S.M. 7.2 靠缺陷类型个案分析；缺陷类型是否穷尽、坐标奇偶约定是否覆盖所有面，正文没给清单。\n· 全文无有限尺寸数值：对 10 的 3 次方到 6 次方个 qubit 的实际系统，9 的 d 次方、(tanh β) 的幂这类常数会让界低到无意义，作者也没讨论这些码在实验尺度是否真会热化。\n· “fast mixing”只对单格点 Glauber 与块 Davies 类动力学成立；若记忆在偏置或非局域噪声下仍长寿，标题中的“必须”就需要限定语。","overclaim":"标题与摘要称“局部冗余是有限空间维度下长寿命记忆的必要条件”，但证明只覆盖对易稳定子哈密顿量与两类特定热浴动力学，且要求冗余至少多对数大；非对易 Pauli 模型（作者在 Outlook 引 [43]）与其他噪声通道都不在定理内，标题应加“for stabilizer codes under heat-bath dynamics”。摘要说任意常数非零温度下热浴动力学都快速混合、混合时间 O(N)，却未提常数随 β 剧烈变小、也未提该界只在 N 超过由 d、κ、β 决定的巨大阈值后成立，容易读成实验尺度已被验证。","citations":"引用脉络完整：2D/4D toric code 的热稳定性 [7,8]、LDPC 玻璃动力学 [5,19]、Haah 码 [11]、层码 [12]、Newman–Moore [9,10]、近期逐模型反证 [22–24] 与被本文统一的候选 [25–29] 都在。建议补：与 Bravyi–Terhal 二维 no-go 的强弱对比应显式写出，否则读者难判断本文多排除了什么；[30] 的五段链复形构造只作定性引用，缺参数对照；另可引 Yoshida 关于分形子码热不稳定性的一系列结果，说明其判据与本文冗余判据的关系。","questions":"① 若某码的最小冗余尺寸是 O(1)（例如带局部冗余的三维小码），本文判据不适用，作者是否认为这类码才是有希望的候选？② 定理 1 的谱隙对 β 的依赖能否显式给出，例如 β 趋于无穷时 Δ 是否按 e 的 −cβ 次方衰减，从而使 N 阈值随 β 指数增长？③ Lemma 8 的 K = r/(8 的 d 次方·log r) 与 (3.19) 指数中的 9 的 d 次方如何统一，能否补出一行换算？④ 层码验证依赖 S.M. 7.2 的缺陷分类，是否有与缺陷类型无关的统一论证？","basis":"已读 arXiv:2611.29689 全文提取文本（3654 行）：摘要、引言、主文式 (1)–(18) 与图 1–2、End Matter 的最小割计数、S.M. 第 1–7 节（定理 1/2、SDOC 定义、Lemma 5/8/9、定理 10 的 HBL、Haah 码与层码验证）及参考文献；图像本身未逐张查看，所引数字均取自正文与图注文字。"}},{"id":"arxiv-2611.31207","no":10,"topics":["解码器","纠错码","算法"],"source":"arXiv","venue":"arXiv","published":"2026-11-24","title":"Advancing the Theory of Pretty Good Quantum Operations","title_zh":"pretty good 量子操作理论的推进：幂重加权与提升的 Barnum-Knill 界","authors":["Bikun Li","Guo Zheng","Liang Jiang"],"abstract":"Finding optimal quantum measurements or recovery maps is often demanding. Pretty good measurements and Petz maps offer explicit approximations achieving at least the square of optimal performance by the Barnum-Knill bound. We unify these operations in a semidefinite programming framework with a tunable power, extending them to broader quantum tasks. We prove a stronger bound for powers above one up to three that peaks at quadratic power. For structured channels such as stabilizer codes under Pauli noise, large powers steer recovery to a maximum likelihood decoder for maximally mixed inputs.","abstract_zh":"寻找最优的量子测量或恢复映射往往很困难。pretty good 测量与 Petz 映射提供了显式近似，依据 Barnum-Knill 界至少能达到最优性能的平方。我们把这类操作统一到一个带有可调幂次的半定规划框架中，并把它们推广到更广泛的量子任务。我们证明：当幂次大于一且不超过三时存在更强的界，且该界在二次幂处达到峰值。对于结构化的信道，例如 Pauli 噪声下的稳定子码，大的幂次会把恢复引导到最大混合输入下的最大似然解码器。","importance":3,"importance_reason":"对做量子纠错解码与量子信息理论的人有直接参考：给出统一的半定规划视角与更强的显式性能保证，说明二次幂次在该界下最优、大幂次趋近最大似然解码，可作为解码器设计与误差界推导的新起点，但暂无实验或实用解码器的直接结论。","summary":"把幂 PGM、Petz 映射与二次恢复映射统一进半定规划框架：给定代价矩阵与参考矩阵 ζ，按幂次 q 重加权给出显式可行解 \\(X_q\\)（规范化幂 Petz 映射），PGM 与普通 Petz 是其 q=1 特例。证明对所有 \\(q\\ge1\\) 成立的提升版 BK 界：\\(1<q\\le3\\) 时严格强于平方界、\\(q=2\\) 最强，近最优时保证亏损从 \\(2\\eta\\) 降到 \\(5\\eta/4\\)；稳定子码等 SOC 信道下 q 增大使解码收敛到最大似然解码。","problem":"最优量子测量与最优恢复映射一般只能靠半定规划数值求解，缺少闭式解。PGM 与 Petz 映射虽给出显式构造，但 Barnum-Knill 界只保证性能不低于最优值的平方，即 \\(f\\ge(f^{\\mathrm{opt}})^{2}\\)，这在接近最优时把误差放大到约两倍。此前对幂次重加权（二次、三次加权等）的认识是零散的，缺少覆盖测量、恢复与更一般量子优化任务的统一框架，也不知道除 \\(q=1,2\\) 之外哪些幂次仍保留这类普适平方保证。本文要回答两个问题：能否在保持显式性的同时给出可证的更强保证；能否把 pretty good 构造推广到更广的任务类。","method":"把一大类任务写成同一个半定规划 \\(f^{\\mathrm{opt}}=\\max\\{\\mathrm{tr}(CX):X\\succeq0,\\ \\mathrm{tr}_{A}X\\preceq I_{B}\\}\\)，由 \\(C\\) 与 \\(\\zeta\\) 指定任务（态鉴别、纠缠保真度、交互证明等）。令 \\(Z=\\bigoplus_{a}\\zeta_{a}\\otimes I_{B}\\)、\\(H=Z^{-1/2}CZ^{-1/2}\\)，归一化上限 \\(c_{\\zeta}=\\mathrm{tr}H\\)；取种子 \\(G_{q}=Z^{(q-1)/2}H^{q}Z^{(q-1)/2}\\)，用输出边缘 \\(Y_{q}=\\mathrm{tr}_{A}G_{q}\\) 归一化得可行解 \\(X_{q}\\)，即幂重加权 Petz 映射。提升界用 Buzano 不等式与 Hadamard 三线定理证明；SOC 部分用 Choi 谱分解分析大 q 极限。","result":"得到提升版 BK 界：对任意 \\(q\\ge1\\)，\\(\\tilde f^{[q]}\\ge(\\tilde f^{\\mathrm{opt}})^{(q+1)/r(q)}[2/(1+(\\tilde f^{\\mathrm{opt}})^{1/2})]^{2-2/r(q)}\\)，其中 \\(r(q)=\\min\\{q,2\\}\\)。它在 \\(1<q\\le3\\) 严格强于平方界，且 \\(q=2\\) 最强：当 \\(\\tilde f^{\\mathrm{opt}}=1-\\eta\\) 时保证亏损由 \\(2\\eta\\) 降到 \\(5\\eta/4\\)；SM 反例说明该区间之外平方界失效。对 SOC 信道证明 \\(f^{[q]}\\) 关于 q 单调不减，且 \\(q\\to\\infty\\) 时解码器在菱形范数下收敛到最大似然解码器、保真度趋于最优。数值上 Steane 码在去极化噪声下逼近最优，Rains 码等非 SOC 信道在有限 q 取得峰值后仍留有间隙。","contribution":"把幂 PGM、幂重加权 Petz 映射（含普通 Petz 与二次恢复映射）、交互证明的 prover 响应映射与非对称性资源见证统一为“同一个半定规划 + 幂重加权”的构造，并对所有 \\(q\\ge1\\) 给出单一显式性能保证，指出 \\(q=2\\) 是该界下的最优幂次，从而为“二次甜点”提供解释。在纠错一侧引入扇区正交信道（SOC）类，覆盖随机 Pauli 噪声下的稳定子子空间码，证明大 q 重加权在每个扇区内做最大似然判决，把 pretty good 解码器与最大似然解码器联系起来。","limitation":"作者自己承认式 (12) 的界一般不紧，\\(q>1\\) 的精细界以及“二次甜点”是否会随更强界漂移都留作未来工作；SOC 只是充分条件，非 SOC 情形仅有数值证据，且某些带 flag 的比特信道保真度随 q 反而下降。我们另看到：全篇给的是纯下界，没有误差预算，也没有与 Reimpell-Werner 迭代、旋转 Petz 映射等基线的系统对比；SOC 要求精确的扇区正交，连续变量 GKP 码与有限能量正则化被明确排除；大 q 数值需要 160 位算术，却未讨论条件数、数值稳定性与解码复杂度，也未与 MWPM、BP+OSD 等实用解码器比较。","key_numbers":["2η 降到 5η/4：q=2 时近最优情形（归一化最优 1-η）的保证亏损上界，相对普通 PGM/Petz 的两倍误差（引言、式 (12) 后的讨论）","1 到 3：提升界严格强于平方界的精确幂次区间，区间外由 SM 反例否定（Theorem 1、Sec. S2.B 引理 S3 与 S4）","0.740815：Rains ((5,6,2))2 码在 p=0.08 独立去极化噪声下 q 趋于无穷的极限保真度，160 位算术下与数值最优吻合到 1e-79 量级（Sec. S4.A）","q 约为 2.603、3.167、4.677：Steane 码（幅度阻尼）、Rains 码（比特翻转）、二项码（光子损失）观测到的最优幂次（Fig. S1(b)、Sec. S4.B）","3.70e-5、4.22e-4、1.08e-5：上述三个非 SOC 信道在有限 q 峰值处与最优恢复的间隙，q 趋于无穷时分别增大到 1.51e-2、6.08e-4、2.40e-3（Sec. S4.B）"],"url":"https://arxiv.org/abs/2611.31207","pdf_url":"https://arxiv.org/pdf/2611.31207","doi":"","review":{"verdict":"大修","confidence":"中高","correctness":"核心主张基本成立。定理 1（SM 的 Theorem S1）分两段证明：\\(1\\le q\\le2\\) 用 Schatten-Hölder 加 Buzano 不等式与 Hadamard 三线定理，\\(q\\ge2\\) 用矩阵三线定理，衔接处的矩估计（引理 S2：\\(n_q\\le m_q^{q-1}\\)、\\(n_q\\le m_q^{q/2}\\)）我逐行核对过，其概率化写法自洽。手算验证了 q=2 的常数：代入 \\(\\tilde f^{\\mathrm{opt}}=1-\\eta\\) 后指数为 3/2、因子为 \\(2/(1+\\sqrt{1-\\eta})\\)，乘积展开确为 \\(1-5\\eta/4\\)。定理 2（Theorem S5）式 (S60) 的导数确等于 \\(\\frac12\\sum p_{s\\ell}p_{sm}(\\mu_{s\\ell}-\\mu_{sm})(\\log\\mu_{s\\ell}-\\log\\mu_{sm})\\ge0\\)，菱形范数收敛来自有限 Kraus 族内的系数收敛，式 (S58) 的对偶证明 MLD 最优也正确；Sec. S2.B 的反例（引理 S3、S4）结构清楚。问题不在对错，而在界不紧与适用面缺失。","weaknesses":"· 提升界 (12) 明说不紧，却未给任何紧性方向的结果：反例只证明 \\([1,3]\\) 是精确区间，没有说明界能否改进、在什么任务上取等，读者无法判断 \\(5\\eta/4\\) 是真实极限还是证明副产品。\n· “q=2 最强”只对界 (12) 成立，正文却在 Fig. 1 与引言中写成机制性结论；而 Fig. S1(b) 三个非 SOC 信道的实测最优幂次是 2.603、3.167、4.677，作者未解释这一张力。\n· 缺少数值与复杂度分析：大 q 需要 160 位算术，正文与 SM 都没给 \\(Y_q\\) 的条件数随 q 的增长、精度需求或 PPM 解码的经典代价，对一个主打显式可实现的构造这是关键缺口。\n· SOC 判据偏强且检验方式弱：非 SOC 判定只靠输出维数 32 不被逻辑维数 6 整除这类维数论证，未给出可操作的近似 SOC 度量。\n· 参考矩阵 \\(\\zeta\\) 直接影响 \\(c_\\zeta\\) 与界的形式（SM Sec. S1.C.2 已显示 \\(\\zeta=\\rho^{T}\\) 与 \\(\\zeta=\\tau\\) 给出不同解码器），正文没有选 \\(\\zeta\\) 的原则，削弱了统一框架的说服力。","overclaim":"摘要说“We prove a stronger bound for powers above one up to three that peaks at quadratic power”，容易被读成二次幂在实践中最优，实际只是界 (12) 在 \\(q=2\\) 取最大，Fig. S1(b) 里最优幂次可到 4.677；引言称提升界对所有 \\(q\\ge1\\) 成立，而正文自己承认固定 \\(\\tilde f^{\\mathrm{opt}}<1\\) 时该界随 \\(q\\to\\infty\\) 趋于零；摘要末句“large powers steer recovery to a maximum likelihood decoder”未限定 SOC 与最大混合输入，而非 SOC 信道存在持久间隙甚至随 q 变差。","citations":"需补三类对照：一是与旋转/普适 Petz 恢复（Wilde 的 rotated Petz、Junge 等的近似最优恢复）的定量比较，正文只说不知道一般转换关系，却未比较两者在同一 SDP 下的保证强弱；二是 MLD 与 Iyer-Poulin 最优解码、以及 tensor-network/BP+OSD 解码器的性能与复杂度基线，否则“收敛到 MLD”缺少参照；三是 Tyson 的二次恢复映射与 Audenaert-Mosonyi 的幂 PGM 结果（已引 [22,23]）应明确本文哪些结论是新证明、哪些是重述，尤其 q=2 的解码器与 [22] Theorem 44 的关系；此外应核对 Zhou 等 [24] 的无限幂结论是否被本文 SOC 机制覆盖。","questions":"① 式 (12) 的“峰值在 \\(q=2\\)”是界层面还是性能层面？如何与 Fig. S1(b) 中 q 约 2.6 至 4.7 的实测最优幂次自洽，是否说明界在 \\(q>2\\) 严重不紧？\n② 能否给出使式 (12) 取等的任务族？若不能，\\(5\\eta/4\\) 与真实保证亏损相差多大？\n③ SOC 条件可否放宽为 Choi 谱的近似扇区正交？Rains 码在 Sec. S4.A 的渐近最优是否可由更弱的充分条件解释，还是纯属数值巧合？\n④ 大 q 时 \\(Y_q\\) 的条件数与所需精度如何随 q 增长，160 位算术是否必需，PPM 解码的经典代价与 MLD 相比如何？","basis":"全文读的是 arXiv:2611.31207v1 预印本（该条为 arXiv 来源，无出版社排版版），abstract 与该预印本一致。已读正文第 1 至 6 页（Table I、式 (1) 至 (16)、Fig. 1、Theorem 1 与 2）及 SM 的 S1 至 S4（引理 S2 至 S4、式 (S1) 至 (S65)、Fig. S1）；参考文献表仅作检索性浏览，未逐条核对原文。"}},{"id":"arxiv-2611.32805","no":11,"topics":["编译与验证","算法"],"source":"arXiv","venue":"arXiv","published":"2026-11-24","title":"Exploiting SU(2) Symmetry for Efficient Quantum State Preparation of Matrix Product States","title_zh":"利用 SU(2) 对称性高效制备矩阵乘积态的量子初态","authors":["Etienne D'Argenlieu","Alessandro Summer","François Jamet","David P. Tew","Lachlan P. Lindoy"],"abstract":"Quantum computing offers a promising route to simulating strongly correlated systems, particularly for dynamical and spectral quantities whose classical computation can become prohibitively expensive. Fault-tolerant algorithms for these tasks, including real-time dynamics and phase estimation, assume efficient preparation of the initial many-body state, making state preparation an important bottleneck. Matrix product states obtained classically with the density matrix renormalization group can be compiled sequentially into fault-tolerant circuits. We exploit non-Abelian spin SU(2) symmetry in this compilation. By the Wigner-Eckart theorem, only the reduced tensors, which carry the variational information, need generic unitary synthesis. The magnetic structure is restored by Clebsch-Gordan transformations with analytically known angles. We benchmark the method on representative strongly correlated models, including the one-dimensional Hubbard model, quasi-one-dimensional Hubbard geometries, and Anderson impurity models, and perform fault-tolerant resource estimates using the Toffoli count as the primary cost metric. Across the systems considered, exploiting non-Abelian SU(2) symmetry reduces the Toffoli cost roughly threefold relative to U(1)-adapted compilation and by more than an order of magnitude relative to the standard dense compilation method. These results demonstrate how non-Abelian symmetries can substantially reduce the cost of transferring classically tractable many-body ground states to quantum computers, facilitating their use in quantum dynamics and energy estimation.","abstract_zh":"量子计算为模拟强关联体系提供了有前景的途径，尤其是对那些经典计算可能变得极其昂贵的动力学量与谱量。用于这些任务（包括实时动力学与相位估计）的容错算法都假定初始多体态能被高效制备，这使得态制备成为一个重要瓶颈。用密度矩阵重整化群在经典端得到的矩阵乘积态可以被顺序编译成容错线路。我们在这一编译过程中利用非阿贝尔自旋 SU(2) 对称性。依据 Wigner–Eckart 定理，只有携带变分信息的约化张量需要通用酉综合，磁结构则由角度解析已知的 Clebsch–Gordan 变换恢复。我们在若干代表性强关联模型上对该方法做基准测试，包括一维 Hubbard 模型、准一维 Hubbard 几何构型以及 Anderson 杂质模型，并以 Toffoli 数作为主要成本度量给出容错资源估计。在所考虑的各个体系中，利用非阿贝尔 SU(2) 对称性使 Toffoli 成本相对 U(1) 适配编译降低约三倍，相对标准稠密编译方法降低一个数量级以上。这些结果表明，非阿贝尔对称性可以大幅降低把经典可处理的多体基态传输到量子计算机的成本，从而便利其在量子动力学与能量估计中的使用。","importance":3,"importance_reason":"对做容错初态制备与 DMFT 量子求解的读者：它把非阿贝尔对称性从 DMRG 侧带到编译侧，使 Toffoli 预算由自旋多重态数而非磁分量数决定，直接改写千级键维初态的成本估算，并给出先定键维再定位宽的操作准则。","summary":"按 Wigner–Eckart 定理把 SU(2) 对称 MPS 张量拆成约化张量 \\(T^{[k]}\\) 与 Clebsch–Gordan 系数，只用 Clements 综合约化部分，磁分量由角度解析已知的逆 CG 旋转经相干 SELECT 恢复。在 Hubbard 链、柱面与 SrVO3 杂质模型上（χ 从 300 到 6400），b=21 时 Toffoli 数比 U(1) 编译低 2.4–3.7 倍、比稠密编译低 26–68 倍，且增益随键上自旋含量增长。","problem":"容错框架下的实时动力学与相位估计都以“初始多体态已就位”为前提：相位估计的成功率由初态与目标本征态的重叠决定，而 DMFT 自洽循环里每个时间点、每个格林函数分量、每次测量都要重新制备杂质基态，态制备被反复调用。经典端 DMRG 给出的矩阵乘积态可按正则形式顺序编译成线路，但其 Toffoli 成本随键维数增长，在容错情形下直接换算成魔法态蒸馏开销。已有工作利用 U(1) 粒子数与自旋投影对称性把张量分块、按块并行综合，取得 10–30 倍收益；但 SU(2) 对称性不仅限制哪些块非零，还把张量对磁量子数的依赖完全固定，若先展开成全部磁分量再编译，就会去综合一批由对称性而非物理决定的自由度。","method":"从 Wigner–Eckart 分解 \\(A^{[k]}=T^{[k]}\\times C^{\\mathrm{CG}}\\) 出发：键空间按 \\(U(1)\\times SU(2)\\) 分为多重度空间与自旋 \\(J\\) 表示的直积，需综合的维数由 \\(\\sum_q d_{k,q}(2J+1)\\) 降为 \\(D^{\\mathrm{red}}_k=\\sum_q d_{k,q}\\)，只保留 \\(|J_{k-1}-s_k|\\le J_k\\le J_{k-1}+s_k\\) 的块。各扇区约化等距补成酉后，用与 U(1) 相同的 Clements 加 QROM 并行综合，层数由最大块决定。磁结构由逆 CG 变换恢复：\\(s_k=1/2\\) 时化为单个实旋转 \\(\\cos\\theta_{J,M}=\\sqrt{(J+M+1/2)/(2J+1)}\\)，经相干 SELECT 施加 \\(U^{\\dagger}_{\\mathrm{CG}}\\) 再乘约化综合。","result":"表 I（b=21）中 SU(2) 处处最便宜：六腿柱面 χ=6400 的 Toffoli 数为 \\(1.55\\times10^{10}\\)（稠密）、\\(8.36\\times10^{8}\\)（U(1)）、\\(2.29\\times10^{8}\\)（SU(2)），即 68 倍与 3.6 倍；SrVO3 杂质模型 χ=2800 为 55 与 3.7 倍，AIM 相对 U(1) 的增益由 2.8 升到 3.7。成本由 χ 主导：χ=300 时 SU(2) 达 \\(1-F_b\\le10^{-8}\\) 只需 \\(b=14,17,20\\)，U(1) 需 \\(14,18,21\\)，稠密需 \\(16,19,22\\)。误差预算 \\(1-F_{\\mathrm{tot}}\\le(\\sqrt{1-F_\\chi}+\\sqrt{1-F_b})^2\\) 显示 χ=300 时截断误差 \\(1.5\\times10^{-2}\\) 已主导，b 超 12 即浪费。","contribution":"把“非阿贝尔对称性省了什么”拆成两个可分离的机制：块稀疏让 Clements 层数由最大块而非整条键决定，磁简并的消除让每个 \\((N,J)\\) 只留一个块；因此相对稠密编码两个机制叠加，相对已利用块结构的 U(1) 只剩第二项，增益随键上自旋含量增长，这解释了 U/t=0 链只有 2.4，而六腿柱面到 3.6、AIM 到 3.7。与同期 Hennefarth 等（Householder–LKS，主要对稠密编码比较）不同，本文在同一 Clements 框架内给出与 U(1) 的同类对比，并量化了角度位宽对各编码保真度的影响。实用上给出“先按保真度定 χ、再定 b”的预算准则，且约化张量与磁量子数无关，S=3/2 多重态的每个分量由同一线路制备，便于 DMFT 中自旋分辨格林函数的反复制备。","limitation":"作者承认：方法要求严格自旋旋转不变，沿 z 的磁场把对称性降为 \\(U(1)_N\\times U(1)_{S_z}\\)，自旋轨道耦合又破坏 Sz，此时只能退回 U(1) 编译；总自旋必须在 DMRG 之前选定，近简并自旋态只能制备其中之一而非叠加。成本是解析计数而非门级线路：按 Berry 等的模型，边界项 \\(f(D_N)\\)、寄存器换编码、磁标签更新与辅助比特清理都不计费，\\(d-1=3\\) 的因子对三种编码一视同仁，故倍数关系依赖于该成本模型。基准也有限：AIM 在 χ=2800 未完全收敛（丢弃权重 \\(3\\times10^{-5}\\)，外推还差 17 meV），W=8 柱面在 χ=4800 仍远离基态而未进主表；只与精确顺序制备的稠密/U(1) 编码对比，未与变分浅线路、对数深度制备或真实蒸馏开销比较，也没有噪声下的端到端演示。","key_numbers":["表 I：六腿柱面（W=6、χ=6400）Toffoli 数为 \\(1.55\\times10^{10}\\)（稠密）、\\(8.36\\times10^{8}\\)（U(1)）、\\(2.29\\times10^{8}\\)（SU(2)），比值 68 与 3.6（表 I、§IV C）","AIM（SrVO3，33 个空间轨道、S=3/2）χ=2800：\\(8.56\\times10^{8}\\)（稠密）到 \\(5.70\\times10^{7}\\)（U(1)）到 \\(1.54\\times10^{7}\\)（SU(2)），比值 55 与 3.7（表 I、图 4）","角度位宽：χ=300 时 SU(2) 达 \\(1-F_b\\le10^{-8}\\) 需 b=20，U(1) 需 21、稠密需 22；三个保真度目标下 SU(2) 为 14/17/20（图 3、§IV B）","位宽从 14 提到 20 只使 SU(2) 估算成本上升约 18%；χ 从 300 提到 800 使 4×6 柱面成本乘 3.2、AIM 乘 3.3（§IV C）","误差预算：AIM 在 χ=300 相对 χ=2800 的截断误差 \\(1-F_\\chi=1.5\\times10^{-2}\\)，b=12 时 SU(2) 编译误差已低于其 3%（§IV E）","渐近收益：中段截断下相对稠密编码的 Toffoli 降幅为 \\(0.36\\,L^{7/4}\\)（U(1)×SU(2)）与 \\(\\pi L/(2\\sqrt{2})\\)（U(1)×U(1)），L 为空间轨道数（附录 D）"],"url":"https://arxiv.org/abs/2611.32805","pdf_url":"https://arxiv.org/pdf/2611.32805","doi":"","review":{"verdict":"小修","confidence":"中高","correctness":"核心主张成立度较高，我按链路逐条核对。§III A 的 Wigner–Eckart 分解（式 9）与局部轨道三个 \\(U(1)\\times SU(2)\\) 多重态 \\((n,s)=(0,0),(1,1/2),(2,0)\\)（式 8）自洽；约化维数式 (11) 相对式 (10) 恰好去掉 \\(2J+1\\) 因子，而“不丢弃物理自由度”的说明与 §III D 的逆 CG 重构对应得上。逆 CG 部分我复核式 (20)–(21) 的 \\(\\cos\\theta_{J,M}=\\sqrt{(J+M+1/2)/(2J+1)}\\)，与把 \\(|J+1/2,M\\rangle\\) 展开到 \\(|J,M\\mp1/2\\rangle|\\uparrow\\downarrow\\rangle\\) 的标准结果一致，且确实只依赖 \\((J,M)\\)。成本侧式 (26)–(28) 沿用列表型计数，SU(2) 只是换块尺寸再加 CG SELECT 项，我按附录 A 的 \\(O(D^{3/2}b^{1/2})\\) 比例抽查表 I 中 χ=6400 与 AIM 两行，与 D 的相对关系基本对得上；§IV B 的 \\(4^{-b}\\) 拟合（图 3）与“综合的旋转越多越不准”的解释亦合理。","weaknesses":"· 全文只有解析计数，没有展开成 Clifford+T 线路：\\(d-1=3\\) 的因子、辅助比特与磁标签更新都记为常数，若换成实际 T 计数或蒸馏开销，“3 倍/10 倍”可能明显缩水。\n· 公平性存疑：两种编码同框架，但 SU(2) 多出 CG SELECT，其 QROM 成本按式 (27) 用单一 \\(\\Lambda_{\\mathrm{CG}}\\) 估计，且声称与 Clements 侧地址寄存器部分共用（§III E、附录 C），文中未给共享与不共享两种情形的对照。\n· 基准选择性：AIM 的 χ=2800 态本身未收敛（丢弃权重 \\(3\\times10^{-5}\\)、能量外推差 17 meV），W=8 柱面在 χ=4800 仍远离基态而被排除在主表外（附录 B），故“增益随 χ 单调增长”只覆盖易截断的态。\n· 缺关键数值对照：同期 Hennefarth 等（Householder–LKS）只被文字性区别为“不同框架”，没有同态同基准的比较；与 Berry 等的分子案例也未并列。\n· 最大实例仅 33 个空间轨道，与真实多轨道杂质问题相差明显，且全文无噪声、无解码、无蒸馏循环的端到端预算。","overclaim":"摘要说“reduces the Toffoli cost roughly threefold … by more than an order of magnitude”，§V 又反复以“cost”笼统表述，但这些数字来自解析成本模型，不含换编码、辅助比特清理与蒸馏开销，易被读成端到端成本。§V 称 S=3/2 多重态“每个分量由同一线路制备”，这仅在总自旋已知且约化张量固定时成立；作者自己在局限里承认近简并自旋态只能制备其中之一而非叠加。引言把态制备定为“important bottleneck”，却没有给出任何动力学或 DMFT 端到端的成本占比数据来支撑这一判断。","citations":"① 必须补与 Hennefarth 等（arXiv:2611.19728）同态同基准的数值对照，否则无法判断 Clements 与 Householder–LKS 两条路线的优劣；② Ref. [35]（Rupprecht–Wölk 的实值综合）被留作“可组合”的展望，应真正组合并报告收益，才能支撑“约化后仍可用实值综合”的论断；③ 应对 Berry 等（Ref. [17]）与 Yoshioka 等（Ref. [16]）在同一成本模型下并列，说明 \\(d-1\\)、\\(f(D_N)\\) 与 QROM 参数选择是否对三种编码一视同仁；④ 变分/浅线路与对数深度制备（Refs. [19]–[26]）仅被排除在“精确顺序制备”之外，至少应给一条成本曲线说明顺序法在何种 χ 下仍占优；⑤ 建议引张量网络初态在相位估计成功率上的实测工作，以支撑瓶颈论断。","questions":"① 式 (27) 的 CG SELECT 与 Clements 侧 QROM 是否共用地址寄存器与角度寄存器？请给出“共享/不共享”两种情形的表 I 对照，说明 2.4–3.7 倍中有多少来自共享，并把 \\(f(D_N)\\)、换编码与辅助比特清理计入后重算一遍。② 附录 B 中低重叠（保真度约 \\(2\\times10^{-3}\\)）的 W=6/W=8 DMRG 态报出 4.4–5.4 的更高比值，能否把“键上高自旋含量”做成一个在选 χ 之前即可估计收益的判据？③ 若总自旋未知或近简并，多算几个 S 扇区后在同一条线路上制备叠加态需要多少额外成本？能否给出一个 5 轨道 d 壳层杂质的资源估计以说明可扩展性？","basis":"读了 arXiv:2611.32805 预印本全文 txt：§I 引言、§II 顺序制备与式 (1)–(5)、§III 式 (6)–(28) 的 SU(2) 综合与逆 CG、§IV 全部（表 I、图 2–5、位宽与误差预算）、§V 讨论与作者自陈局限、附录 A–D。未运行作者代码，未复核 Block2 的 DMRG 数据；abstract 取自 arXiv 预印本摘要，无出版社排版版。"}},{"id":"arxiv-2611.32388","no":12,"topics":["编译与验证","Pauli 传播","大规模仿真"],"source":"arXiv","venue":"arXiv","published":"2026-11-24","title":"Thermal state preparation with shallow quantum circuits","title_zh":"用浅层量子电路制备热态","authors":["Cenk Tüysüz","Simon Deconihout","Enrico Rinaldi","Michele Grossi"],"abstract":"Preparing thermal states on noisy quantum hardware requires circuits that remain shallow at low temperatures. Even when accurate classical state representations are available, compiling them into suitable circuits can be costly. We introduce PP-VarQITE, combining Pauli propagation with variational quantum imaginary-time evolution to determine circuit parameters entirely classically, with target temperatures encoded in the angles of a fixed circuit architecture. In numerical studies of Ising and frustrated Heisenberg models, we recover low-temperature energies and correlations using up to 100 qubits. Across the frustrated chain and two-dimensional lattice, our circuits are approximately two to ten times shallower than the lowest-depth circuits from sequential tensor-network compilation. These shallow circuits enable us to prepare a 48-site frustrated chain and a $7\\times7$ Ising lattice using 96 and 98 qubits on the Quantinuum Helios trapped-ion quantum processor. We reproduce the development of dimer order and lattice-wide correlations from high to low temperatures, with the lattice circuits requiring at most 42 two-qubit layers. Through classical circuit design, we demonstrate low-temperature state preparation at circuit sizes beyond the practical reach of statevector simulation.","abstract_zh":"在含噪量子硬件上制备热态，要求电路在低温下仍保持浅层。即使已有准确的经典态表示，把它编译成合适的电路也可能代价高昂。我们提出 PP-VarQI
