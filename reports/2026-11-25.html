TE，把 Pauli 传播与变分量子虚时演化结合起来，完全在经典侧确定电路参数，并把目标温度编码进固定电路架构的角度中。在对 Ising 模型与阻挫 Heisenberg 模型的数值研究中，我们在最多 100 个量子比特上恢复了低温能量与关联。在阻挫链与二维格点上，我们的电路比顺序张量网络编译所得的最浅电路浅约 2 到 10 倍。这些浅电路使我们能够在 Quantinuum Helios 离子阱量子处理器上用 96 与 98 个量子比特制备 48 格点阻挫链和 7×7 Ising 格点。我们复现了从高温到低温二聚序与全格点关联的发展，其中格点电路最多需要 42 个双比特层。通过经典电路设计，我们展示了在超出态矢模拟实际可达范围的电路规模上的低温态制备。","importance":3,"importance_reason":"对做热态制备与量子模拟的读者直接可用：把变分虚时演化的度量搬到经典侧算，浅层电路在 96/98 比特硬件上给出可用热关联，动摇了“低温热态必须先深编译”的判断；但模型仍限于可经典验证的自旋体系。","summary":"把 Pauli 传播与变分虚时演化合成 PP-VarQITE：热态用 Bell 对纯化，温度沿虚时 \\(\\beta=2\\tau\\) 编码进固定浅层拟设的角度，度量与演化向量全在经典侧用截断 Pauli 传播组装，由 \\(M\\dot\\theta=v\\) 解出角度，无需任何硬件测量。50 格点阻挫链（100 qubit）与 7×7 Ising 格点电路分别比张量网络编译的最浅电路浅 2.5–3 倍与 6–10 倍；96/98 qubit 实测保留 94–96% 无噪关联。","problem":"低温热态制备是量子模拟的前置步骤，但在含噪硬件上，虚时演化或耗散协议的深度常超出可用相干预算；直接把热密度矩阵做 Pauli 展开时，算符项数随温度降低迅速膨胀。另一条路是先用张量网络算出热态再编译成电路，然而精确编译产生的多比特酉门随键维数变贵，近似编译又要用精度换门数。变分虚时演化本身需在硬件上逐点测量 Gram 矩阵与演化向量，成本随参数个数平方增长。","method":"从 Bell 对纯化的无限温态出发，把电路在参数 \\(\\theta_i\\) 处拆为 \\(U=U_{>i}R_iU_{<i}\\)，把生成元反向传播得 \\(|a_i\\rangle=U_{<i}^\\dagger G_iU_{<i}|0\\rangle\\)，并令 \\(C=[|a_1\\rangle\\cdots|a_p\\rangle]\\)、\\(|b\\rangle=U^\\dagger HU|0\\rangle\\)。用按系数阈值 \\(c_{\\min}\\) 截断的 Pauli 传播得到近似列，组装 \\(M=\\frac14\\mathrm{Re}(C^\\dagger C)\\) 与 \\(v=\\frac12\\mathrm{Im}(C^\\dagger b)\\)，以 Tikhonov 正则最小二乘解 \\(M\\dot\\theta=v\\)，显式 Euler 步长 \\(\\Delta\\tau=0.05\\) 对应 \\(\\Delta\\beta=0.1\\)。","result":"50 格点 TFIM 与 J1–J2 链（100 量子比特）在 \\(c_{\\min}=10^{-4}\\) 下能量密度误差接近每格点 \\(10^{-4}\\)；30 格点阻挫链推进到 \\(\\beta=10\\) 时峰值保留 \\(2.9\\times10^{6}\\) 个 Pauli 项，100 比特轨迹约 1.8 分钟。96 比特 48 格点链用 711 个双比特门、深度 108，98 比特 7×7 格点编译后不超过 1241 门、42 层；硬件上 \\(\\beta=6\\) 时链能量密度 \\(-1.4441\\pm0.0058\\)（无噪 \\(-1.4986\\)），格点在 \\(\\beta=1.5\\) 保留 94–96% 无噪关联。","contribution":"给出一条“经典侧定参、硬件只执行”的热态制备流程：温度被编码为同一固定架构的角度，延长虚时只改角度而不加门，使制备深度与目标温度解耦。方法上把变分虚时演化的度量与演化向量改写成共享 Gram 表示，使截断后的度量仍保持半正定，并把 Pauli 传播的项数增长限制在浅层拟设之内，从而在同一框架里既给出 100 比特级热关联，又给出可直接上硬件的电路。","limitation":"三个基准都是可用自由费米子、精确对角化或热 MPS 独立验证的 Ising/Heisenberg 模型，未涉及费米子符号问题或规范场这类真正需要量子硬件的场景；拟设为逐模型手工设计，浅化倍数也只与作者自己构造的最浅 MPS 编译电路相比。阻挫链存在中间虚时滞后，靠延长演化而非改进拟设来补偿。文中未给 \\(c_{\\min}\\) 与 \\(\\Delta\\tau\\) 的误差预算，硬件每基仅 100 次采样、无噪声模型与误差缓解对照，残余偏差无法归因。","key_numbers":["96 比特 48 格点 J1–J2 链：711 个双比特门、双比特深度 108（表 I、附录 G）","98 比特 7×7 TFIM：L=3 编译后最多 1241 个双比特门、深度 42（表 I、附录 G）","30 格点阻挫链演化到 β=10，峰值保留 Pauli 项 \\(2.9\\times10^{6}\\)（\\(c_{\\min}=10^{-4}\\)，第 VI 节）","100 比特轨迹推进到 β=10 约需 1.8 分钟演化时间（单经典节点，第 IV C 节）","硬件能量密度：链 β=6 为 −1.4441±0.0058，无噪 −1.4986，热 MPS −1.4990（表 II）","7×7 格点 β=1.5：硬件 −1.6943±0.0133，无噪 −1.7511，MPS −1.7510（表 III）"],"url":"https://arxiv.org/abs/2611.32388","pdf_url":"https://arxiv.org/pdf/2611.32388","doi":"","review":{"verdict":"小修","confidence":"中高","correctness":"代数部分可复核：虚时纯化约定 \\(\\beta=2\\tau\\)（附录 A）、由 \\(z^{T}Mz=\\|Cz\\|^{2}/4\\ge0\\) 得到的度量半正定性（第 II B 节）、以及 \\(\\vec b=U^{\\dagger}HU|0\\rangle\\) 的采样式构造自洽；代数值也能对上——表 I 中 48 格点链 L=2 的 711 门与深度 108 恰合 \\(15n-9\\)、\\(2n+8L-4\\)，\\(7\\times7\\) 的 1133/1651 门与式 (C6) 一致；二聚化 \\(D=3\\) 与 \\(E_0=-3J_1n/2\\) 的极限值也对（n=48 时每格点 −1.5，硬件 β=6 的 −1.4441 位于其上）。可议的是精度来源：无噪 PP 能量与热 MPS 的差、以及截断误差始终混在同一张图里，缺一次独立的误差预算。","weaknesses":"· 截断阈值 \\(c_{\\min}\\) 与步长 \\(\\Delta\\tau\\) 只有收敛曲线（附录 F），没有给出对能量密度误差的定量误差界或外推，低温端的偏差究竟来自截断、Euler 偏置还是拟设表达力无法拆开;\n· 硬件与无噪预测的系统性偏移（链 β=6 差 0.055/格点，格点 β=1.5 差 0.057/格点）只用“噪声”解释，未做噪声模型对比、读出校正或误差缓解/动力学解耦的对照，读者无法判断是门错误、泄漏还是态制备本身;\n· 每个基仅 100 次尝试采样，误差条只含采样统计，不含器件漂移与条件化（剔除漏读）带来的系统偏差;\n· 基准模型选择偏向可经典验证而非有量子优势的体系：没有费米子、规范场或带符号问题的例子，而后者才是热态制备的动机;\n· 拟设为逐模型手工设计（附录 C），未与自适应/自动拟设搜索或硬件反馈式 VarQITE 对比，浅化倍数的分母也只是本文自己构造的最浅 MPS 电路;\n· 时序与经典成本只报单节点、单点（1.8 分钟、\\(2.9\\times10^{6}\\) 项），没有给出参数个数 p 增长时 Gram 组装 \\(p(p+1)/2\\) 内积的墙钟外推。","overclaim":"摘要把结果概括为“recover low-temperature energies and correlations”，但二维格点只测到 \\(\\beta=1.5\\)（约 \\(T\\sim0.7|J|\\)），谈不上低温；结论中“leaves most of a noisy processor's coherence budget available”没有给出保真度或相干预算的定量核算，属于未支撑的推论。此外“two to ten times shallower”的分母是作者自建的最浅 MPS 编译电路，若换成其他编译流程倍数会变。","citations":"与本文最相关的是 Note added 里一笔带过的 Santona 等（Majorana 传播 + 算子投影 VarQITE），二者技术路线几乎同源，应给出定量的规模/精度对照而非定性区分；对 Rudolph 等直接传播热密度矩阵的工作应当明确指出本文绕开的正是其项数爆炸，而不是仅一句提及；此外应补与耗散/耦合浴制备、Metts/典型性采样、以及近期在硬件上做热态与 Gibbs 采样的实验工作的比较，否则“实用协议”的定位缺少参照系。","questions":"① 若把 \\(c_{\\min}\\) 从 \\(10^{-4}\\) 继续压低到 \\(10^{-5}\\)，100 比特时的峰值项数与墙钟如何增长，是否存在可控上界？\n② 阻挫链的中间虚时滞后是拟设表达力不足还是截断造成？在 \\(\\beta=10\\) 时残余能量差有多少可归给拟设？\n③ 链与格点的硬件能量分别高出无噪值 0.055 与 0.057/格点，这个量级能否用读取/泄漏模型或简单去极化模型复现？\n④ 参数个数 p 增大时，Gram 组装与传播的经典开销何时会反过来超过 MPS 编译，界限在哪里？","basis":"全文：arXiv:2611.32388v1 预印本（2026-11-24），正文第 I–VI 节与附录 A–G、表 I–III、图 1–19；图为文本抽取，未核矢量原图。"}},{"id":"arxiv-2611.33112","no":13,"topics":["芯片与耦合器","测控与噪声"],"source":"arXiv","venue":"arXiv","published":"2026-11-25","title":"Robust growth of $α$-tantalum on sapphire at room temperature using atomically thin titanium seed layer","title_zh":"超薄钛种子层实现蓝宝石上 α 相钽的室温稳健生长","authors":["Anand Kamlapure","Lucas Hak","Kishore Kumar Thiyagarajan","Hozanna Miro","Marc Beekman","Matvey Finkel","Leonardo DiCarlo"],"abstract":"Tantalum (Ta) based superconducting circuits have attracted attention for their low microwave loss. However, reproducible growth of high-quality $α$-phase Ta films remains challenging because film properties are highly sensitive to growth conditions. We present a robust, room-temperature route for $α$-Ta growth on sapphire substrates using an ultrathin Ti seed layer, which significantly widens the accessible deposition parameter space. We compare this approach to Ta films grown at high temperature without a seed layer and at room temperature with a Nb seed. We assess films using structural and surface characterization and quantify microwave loss with coplanar-waveguide (CPW) resonators measured in the quantum regime. We obtain two-level-system (TLS)-limited quality factors comparable to the state of the art for Ta-on-sapphire CPW resonators with similar geometries. In addition, temperature-dependent measurements reveal that high-temperature-grown films and films subjected to extended buffered-oxide etch treatment exhibit additional temperature activated loss, highlighting the role of growth route and post-processing in microwave performance. Our results establish ultrathin seed-layer engineering as a reliable alternative route to reproducible, low-loss $α$-Ta films and motivate closer study of the interfacial mechanisms that govern Ta phase formation.","abstract_zh":"钽（Ta）基超导电路因其低微波损耗而受到关注。然而，高质量 α 相 Ta 薄膜的可重复生长仍然困难，因为薄膜性质对生长条件高度敏感。我们提出一种稳健的室温工艺，利用超薄 Ti 种子层在蓝宝石衬底上生长 α-Ta，显著拓宽了可及的沉积参数空间。我们将该方案与无种子层的高温生长 Ta 膜、以及以 Nb 为种子层的室温生长 Ta 膜进行对比。我们通过结构与表面表征评估薄膜，并用在量子区测量的共面波导（CPW）谐振器量化微波损耗。对于几何结构相近的蓝宝石基 Ta 共面波导谐振器，我们获得了与当前最优水平相当的两能级体系（TLS）极限品质因子。此外，变温测量显示，高温生长的薄膜以及经过延长缓冲氧化层刻蚀处理的薄膜表现出额外的热激活损耗，凸显了生长路线与后处理在微波性能中的作用。我们的结果确立了超薄种子层工程作为实现可重复、低损耗 α-Ta 薄膜的可靠替代路线，并推动对主导 Ta 相形成的界面机制开展更细致的研究。","importance":3,"importance_reason":"对做 Ta 超导器件工艺的团队直接有用：把 α 相稳定从“高温加精调参数”变成“1 ML Ti 种子加室温”，且跨两台溅射机复现，降低了工艺门槛；Q 与 transmon 数据可作选材参考，但热激活损耗起源未解，暂不改写该方向的物理判断。","summary":"用约 1 ML（2.34 Å）超薄 Ti 种子层在蓝宝石上室温溅射，即可稳定纯 α 相 Ta(110)，把可用 Ar 流量窗口扩到 9–17 sccm（21 sccm 失效），无需加热衬底。20 μm 间隙共面波导谐振器在 20 mK 下 \\(Q_{\\mathrm{TLS},0}>3.0\\times10^{6}\\)；十比特 transmon 平均 \\(T_1=96\\pm19\\ \\mu\\mathrm{s}\\)；高温无种子与延长 BOE 的膜则在 100–150 mK 以上多出热激活损耗。","problem":"α 相 Ta 因稳定的原生氧化层而微波损耗低，是超导量子电路的有力材料，但相纯 α-Ta 的可重复生长困难：其结构与超导性质对衬底、温度、界面质量和生长动力学高度敏感，实践中易得到 α/β 混相，相纯 α-Ta 需要更严格的工艺窗口。已有路线包括加热衬底直接生长、低温沉积、Nb 等种子层以及用 Kr 替代 Ar 作溅射气体，但都把工艺推向窄窗口或引入额外界面。同时，名义相纯也不保证低损耗：HF 去氧化层引起的表面氢化、涡旋运动带来的热激活损耗都能抬高损耗，相纯度、无序与微波损耗之间的关系尚未厘清。","method":"1 ML Ti 定义为名义覆盖等效厚度 2.34 Å，即 Al2O3(0001) 上一个密排 Ti(0001) 原子层；Ti 与 Ta 同腔不破真空溅射，Ta 用 DC 磁控。在两台系统（AC450 平面阴极 4 英寸靶、AJA ATC 1800-V 共焦 2 英寸靶）生长，并以 750 °C 无种子 α-Ta(111) 与室温 Nb 种子膜作对照。XRD/AFM 判相与形貌；制备 7 个 hanger 型 CPW 谐振器（间隙 20 μm 至 4 μm）改变金属–衬底参与比 \\(p_{\\mathrm{MS}}\\)，约 20 mK 下测功率相关 \\(Q_i\\)，按式 (1) 的 TLS 饱和模型拟合 \\(Q_{\\mathrm{TLS},0}\\)；再用 \\(^3\\mathrm{He}\\) 插杆在 250 mK–1 K 拟合 TLS 与准粒子之和，异常样品用 \\(\\exp(-T_{\\mathrm{act}}/T)\\) 描述。","result":"种子层厚度有明确阈值：无种子以 β 相为主并含少量 α，约 0.5 ML 为混相，1 ML 与 2 ML 给出纯 α-Ta(110)；1 ML 下 Ar 流量 9–17 sccm 保持相纯，21 sccm 相分离，第二台系统上 1.4 ML（3.3 ± 0.3 Å）已转为混相。最优清洗的室温膜在 20 μm 间隙谐振器上 \\(Q_{\\mathrm{TLS},0}>3.0\\times10^{6}\\)，与高温 α-Ta(111) 同量级；300 mK 以下由 TLS 模型描述，扩到 1 K 后由 TLS 加准粒子模型描述，由损耗与频移独立提取的 \\(\\alpha_k\\) 落在 2.4%–3.0% 且一致到 10% 以内。部分器件在约 100–150 mK 以上出现两模型都无法解释的额外热激活损耗。十比特平均 \\(T_1=96\\pm19\\ \\mu\\mathrm{s}\\)。","contribution":"给出并验证了一条“原子级界面工程”的替代路线：用 1 ML Ti 把 α-Ta 的相选择从对温度与气流高度敏感变为在宽参数窗口内可复现，且在两套溅射系统、DC/RF 两种种子沉积方式下都成立，降低了对高温工艺的依赖，同时避开 Nb 种子引入的 Nb 氧化物界面。方法学上把 \\(Q_{\\mathrm{TLS},0}\\) 与几何参与比 \\(p_{\\mathrm{MS}}\\) 结合，可在不同薄膜与清洗条件间做半定量比较；并把 20 mK 的 TLS 测量与 250 mK–1 K 的准粒子、热激活分析串起来，指出高温生长与延长 BOE 会引入额外热激活通道，为“相纯不等于低损耗”提供了同一批次内的对照证据。","limitation":"作者自认：Ti 稳定 α 相的微观机制未做第一性原理计算；热激活损耗的微观起源未定，涡旋解释缺少磁场依赖测量；Nb 种子只有单个样品，不能做种子材料的系统对比；transmon 只有一颗芯片，且实测 T1 低于由 \\(p_{\\mathrm{MS}}\\tan\\delta_{\\mathrm{eff}}\\) 估算的 \\(T_1^{\\mathrm{TLS}}\\approx 270\\text{–}420\\ \\mu\\mathrm{s}\\)，说明尚有结工艺等未识别损耗。我们另看出：判相主要靠 XRD 与 AFM，未给 β 相体积分数或成分定量；部分宽间隙谐振器 \\(Q_i\\) 几乎不随功率变化，TLS 拟合欠约束、误差棒很大，削弱了“与高温膜相当”的定量强度；Ti 厚度上界随系统漂移（1.4 ML 对 2 ML），说明“稳健”仍依赖系统标定；也缺少同批次多器件的良率与重复性统计。","key_numbers":["1 ML Ti 定义为名义厚度 2.34 Å，即 Al2O3(0001) 上一个密排 Ti(0001) 原子层（Sec. 2）","α-Ta(110) 衍射峰位于 2θ = 38.2°，略低于文献值，归因于面内压应力（Sec. 2）","1 ML Ti 种子下 Ar 流量 9–17 sccm 保持纯 α-Ta(110)，21 sccm 出现相分离（Fig. 1g–j）","\\(Q_{\\mathrm{TLS},0}>3.0\\times10^{6}\\)：最优清洗的室温 Ti 种子 α-Ta(110)，H1–H3，20 μm 间隙（Fig. 3b）","RMS 粗糙度：室温 α-Ta(110) 约 0.73 nm，高温 α-Ta(111) 约 0.39 nm（Fig. 2）","十比特 transmon：平均 \\(T_1=96\\pm19\\ \\mu\\mathrm{s}\\)、最好 \\(121\\pm23\\ \\mu\\mathrm{s}\\)，\\(T_2^{\\mathrm{echo}}=148\\pm34\\ \\mu\\mathrm{s}\\)（Sec. 5、Fig. S14）"],"url":"https://arxiv.org/abs/2611.33112","pdf_url":"https://arxiv.org/pdf/2611.33112","doi":"","review":{"verdict":"小修","confidence":"中高","correctness":"核心主张——1 ML Ti 可在室温稳定 α-Ta(110) 且微波损耗与高温膜相当——证据链基本成立。Fig. 1a–e 的 XRD 随种子层厚度演化与 AFM 形貌转变自洽，Fig. 1f–j 的 Ar 流量窗口有明确失效点（21 sccm），Table S1 把两台系统的参数与判相结果逐片列出，可复核。我核对式 (1)：其功率饱和形式与 \\(\\tanh(\\hbar\\omega_r/2k_BT)\\) 前置因子与所引 TLS 模型一致，且 \\(Q_{\\mathrm{TLS},0}\\) 用三种提取方法交叉（Sec. S12、Fig. S13），结论一致，做得比多数同类工作扎实。S8 中 \\(1/Q_{\\mathrm{TLS},0}=p_{\\mathrm{MS}}\\tan\\delta_{\\mathrm{eff}}\\) 的化简依赖 \\(c_{SA}\\)、\\(c_{MA}\\) 与几何无关，作者用式 (12) 明示并用 δ0 拟合把衬底项上界压到约 \\(0.8\\times10^{-7}\\)，处理诚实。Fig. 4d–e 的热激活偏离双模型明显，用同一 \\(T_{\\mathrm{act}}\\) 同时解释损耗与频移是最小假设，合理但未排除涡旋。","weaknesses":"· “稳健”的定量支撑不足：Ti 厚度上界在两台系统分别为约 2 ML 与 1.4 ML，说明窗口本身随腔体几何漂移，却未给出可迁移的判据（如 Ti 的实际覆盖度或界面氧化程度）。\n· 判相只靠 XRD 与 AFM，未给 β 相体积分数、ToF-SIMS 或 RBS 成分定量；混相样品（约 0.5 ML）的 β 含量如何界定没有说明，据此画的“相图”是定性的。\n· 微波对比不完整：每个条件只有一个器件级抽样，Fig. 3b 的误差棒来自谐振器间而非批次间离散；宽间隙谐振器 \\(Q_i\\) 近乎不随功率变化，TLS 拟合欠约束（Fig. S6 已承认），此时“与高温膜相当”可能受功率无关损耗项主导。\n· 热激活损耗只作现象报告：Arrhenius 与 TGS 两种解释未用磁场依赖或厚度依赖测量区分，也未给出该通道对 20 mK 下 \\(Q_i\\) 的定量贡献。\n· transmon 数据只有一颗芯片十个比特，实测 \\(T_1\\) 明显低于 \\(T_1^{\\mathrm{TLS}}\\)，缺口全归因于结工艺，但无独立验证（如结面积/氧化条件扫描）。\n· Ti 种子在 CST 参与比仿真中被忽略（S8），虽影响小，仍应给量级估计。","overclaim":"摘要称“significantly widens the accessible deposition parameter space”，但实际只系统扫描了 Ti 厚度与 Ar 流量两个维度，溅射压强、功率、靶基距基本固定（Table S1），按此措辞会被读成整个参数空间的通用结论。摘要与 Sec. 5 反复用“state of the art”，而对比仅限同组自制的三四种膜与文献中几何不同的器件，没有在统一几何与同一制冷机下与已发表最优 Ta-on-sapphire 器件并排测量，只能算同量级而非对等比较。","citations":"应补：Karuppannan 等与 Bu 等的室温/种子层 α-Ta 工作需要给出数值对照表（\\(Q_{\\mathrm{TLS},0}\\)、几何、间隙、膜厚），否则“优于或等同于已有种子层路线”无法判断；Olszewski 等的 Kr 溅射路线是直接竞争方案，应说明为何 Ti 种子在可重复性上更可取；热激活损耗部分应引并对比 Bahrami 等的涡旋损耗模型与 Lozano 等的氢化/界面损耗工作，以及 Chen 等关于 Ta 氧化层微观结构的结论，用以支撑或排除所提机制。","questions":"①给出 Ti 覆盖度的独立标定（XPS/XRR 或 TEM 截面），说明“1 ML”在第二台系统上是否仍是同一覆盖度，以及 1.4 ML 失效是覆盖度还是界面氧化的结果？\n②把宽间隙谐振器的功率无关损耗项 \\(Q_0\\) 单独列表，能否在该项上限内仍断言 Ti 种子膜与高温膜的 \\(Q_{\\mathrm{TLS},0}\\) 无差异？\n③热激活损耗是否随平行磁场增强、是否随 Ta 膜厚变化？若两者都不敏感，涡旋解释如何成立？\n④能否报告同片多器件与多片的 \\(Q_i\\) 分布（而非仅谐振器间误差棒），以支持“可重复”这一核心词？","basis":"全文：arXiv:2611.33112v1 预印本正文 Sec. 1–6（含 Fig. 1–4、式 (1)–(13)）与 Supplementary S1–S13（Table S1–S4、Fig. S1–S14），逐段读到文献列表与补充材料末页；abstract 取自 arXiv 摘要（该工作暂无出版社排版版）。Fig. 3b、S5 的原始数据点未逐点复核，仅核对拟合模型与参数汇总图 S6。"}},{"id":"arxiv-2611.30654","no":14,"topics":["纠错码"],"source":"arXiv","venue":"arXiv","published":"2026-11-23","title":"Quantum Cyclic XYZ Stabilizer Codes","title_zh":"量子循环 XYZ 稳定子码","authors":["Alessio Baldelli","Francisco Lázaro","Davide Orsucci","Massimo Battaglioni"],"abstract":"XYZ codes generalize the Calderbank--Shor--Steane (CSS) framework by adding $\\sym{Y}$-type stabilizers to the usual $\\sym{X}$- and $\\sym{Z}$-type ones. We study XYZ codes whose three classical component codes are binary cyclic codes of odd length~$n$. Assigning disjoint sets of irreducible factors of $x^n-1$ to the three Pauli types fixes the number of encoded logical qubits and ensures that the row spaces of the three parity-check matrices intersect pairwise trivially. Then, a coprimality condition between the factors assigned to each type and the reciprocals of those assigned to the others guarantees the required orthogonality. Cyclotomic cosets give a complete and explicit description of the resulting family. We show that, for odd~$n$, a cyclic stabilizer code admits an XYZ representation with cyclic component codes iff its stabilizer generators are invariant, up to a phase, under the qubit permutation $i\\mapsto 2i\\bmod n$. By fixing the length and the dimension of the code, the proposed cyclic XYZ codes attain the best known minimum distance of stabilizer codes, exceed the minimum distance of the underlying CSS codes, and even exceed the linear-programming upper bounds for general CSS codes.","abstract_zh":"XYZ 码通过在通常的 X 型与 Z 型稳定子之外加入 Y 型稳定子，推广了 Calderbank–Shor–Steane（CSS）框架。我们研究三个经典分量码都是奇长度 \\(n\\) 的二元循环码的 XYZ 码。把 \\(x^{n}-1\\) 的不相交不可约因子集合分配给三个 Pauli 类型，即可固定所编码的逻辑量子比特数，并保证三个校验矩阵的行空间两两交平凡。随后，每种类型所分到的因子与其他类型所分到的因子的互反式之间的互素条件，保证了所需的正交性。分圆陪集给出所得码族的完整而显式的描述。我们证明：对奇 \\(n\\)，一个循环稳定子码存在其分量码为循环码的 XYZ 表示，当且仅当其稳定子生成元在量子比特置换 \\(i\\mapsto 2i\\bmod n\\) 下至多相差一个相位保持不变。在固定码长与维数的条件下，所提出的循环 XYZ 码达到稳定子码的已知最优最小距离，超过其底层 CSS 码的最小距离，甚至超过一般 CSS 码的线性规划上界。","importance":3,"importance_reason":"对做量子码代数构造的读者，它把循环 XYZ 码做成可完全枚举的族，并把“是否存在 XYZ 表示”化为对置换 \\(i\\mapsto 2i\\bmod n\\) 不变性的判定；但两个实例只是追平现有码表，短期不改变参数竞赛方向。","summary":"把 XYZ 码限制到循环分量码：三个二元循环码分别占用 \\(x^{n}-1\\) 的不相交不可约因子，用互反因子的互素条件替代 CSS 正交性，再由分圆陪集把整族码完全枚举，并证明奇 \\(n\\) 循环稳定子码有循环 XYZ 表示当且仅当其在 \\(i\\mapsto 2i\\bmod n\\) 下不变。所得 \\([[43,1,13]]\\) 与 \\([[31,16,5]]\\) 追平同参数已知最优距离，且超过 CSS 线性规划上界 \\(d\\le 11\\) 与 \\(d\\le 4\\)。","problem":"CSS 码只允许 X 型与 Z 型稳定子，在固定 \\((n,k)\\) 下往往比非 CSS 码需要更多物理量子比特（如 \\([[5,1,3]]\\) 对 Steane \\([[7,1,3]]\\)）；XYZ 码引入 Y 型稳定子可压低低重量逻辑算子，但已有 XYZ 框架没有利用经典循环码的代数结构，缺少对整族码的显式枚举、维度公式与存在性判据，也说不清哪些循环稳定子码“本质上”能被写成 XYZ 形式。","method":"取奇长度 \\(n\\)，把 \\(x^{n}-1\\) 分解为 \\(f_{X}f_{Y}f_{Z}g\\)，让三个 Pauli 类型各占互不相交的不可约因子（等价于分圆陪集），并要求 \\(\\gcd(f_{\\sigma},\\tilde{f}_{\\tau})=1\\)（\\(\\sigma\\neq\\tau\\)）以保证 \\(H_{\\sigma}H_{\\tau}^{T}=0\\)；校验矩阵取循环矩阵，校验空间为 \\(\\langle h_{\\sigma}\\rangle\\)，其中 \\(h_{\\sigma}=(x^{n}-1)/f_{\\sigma}\\)。再把上述条件翻译成取反轨道上的选取规则，并用 Frobenius 乘子 \\(\\mu_{2}\\) 给出等价刻画。","result":"命题 1 证明该构造满足正交性、校验空间两两交平凡且 \\(k=\\deg g\\)；命题 2 与推论 1 说明分圆陪集构造穷尽全部循环 XYZ 码，推论 2 给出可逆性判据，推论 4 给出存在性条件。显式得到可逆的 Pauli 对称码 \\([[43,1,13]]\\)（分量码 \\([43,29,6]\\)，底层 CSS \\([[43,15,6]]\\)）与不可逆但 Pauli 对称的 \\([[31,16,5]]\\)（底层 CSS \\([[31,21,3]]\\)）；二者分别达到同 \\((n,k)\\) 已知最优稳定子码距离，并分别超过 CSS 线性规划上界 \\(d\\le 11\\) 与 \\(d\\le 4\\)。","contribution":"把 XYZ 码从零散例子提升为可完全枚举的代数族：给出维度、正交性与可逆性的充要条件，并证明奇长度循环稳定子码存在循环 XYZ 表示等价于其稳定子群在量子比特置换 \\(i\\mapsto 2i\\bmod n\\) 下不变，从而把“能否写成 XYZ 形式”转成可判定的对称性问题；还揭示乘子加 \\(X\\to Y\\to Z\\to X\\) 的 Pauli 对称子类，以及“分裂取反轨道会牺牲可逆性、但换来更多 \\(k\\) 取值”的取舍关系。","limitation":"作者自认的局限：只处理奇长度 \\(n\\)，此时 \\(x^{n}-1\\) 平方自由；偶长度下重根使上述论证失效，未讨论。两个实例只是达到而非超过同 \\((n,k)\\) 的已知最优距离，其中 \\([[43,1,13]]\\) 与已有循环码在 Pauli 类型重标号下相同，故并未推进码表。此外全文只给构造与参数，没有解码器、逻辑门实现或电路级噪声下的逻辑错误率；距离由判定树算法数值给出，缺解析下界与数值精度/误差预算，也没有与其它非 CSS 构造（如一般稳定子码搜索）的规模-复杂度对比。","key_numbers":["\\([[43,1,13]]\\)（例 1）：\\(n=43\\)、\\(k=\\deg g=1\\)、\\(d=13\\)，经典分量码为 \\([43,29,6]\\)","\\([[31,16,5]]\\)（例 2）：由 \\(k=31-3\\cdot 5=16\\) 得 \\(k=16\\)，分量码 \\([31,26,3]\\)，不可逆但 Pauli 对称（\\(t=5\\)）","底层 CSS 码分别为 \\([[43,15,6]]\\) 与 \\([[31,21,3]]\\)，即最小距离 6 与 3（第 IV 节与表 I）","CSS 线性规划上界：\\((n,k)=(43,1)\\) 时 \\(d\\le 11\\)，\\((31,16)\\) 时 \\(d\\le 4\\)（表 I、Remark 1）","维度公式 \\(k=n-|T_{X}|-|T_{Y}|-|T_{Z}|\\)（式 (8)）；例 1 中 \\(x^{43}-1=M_{0}M_{1}M_{3}M_{7}\\)，三个非零分圆陪集各含 14 个元素","Pauli 对称参数：例 1 用 \\(t=6\\) 循环置换三个定义集，例 2 用 \\(t=5\\)（定义 4 与例 2）"],"url":"https://arxiv.org/abs/2611.30654","pdf_url":"https://arxiv.org/pdf/2611.30654","doi":"","review":{"verdict":"小修","confidence":"中高","correctness":"核心结构结果是可靠的。第 III 节命题 1 的证明链我逐步核过：由 \\(\\tilde{h}_{\\tau}=(x^{n}-1)/\\tilde{f}_{\\tau}\\) 与 \\(\\gcd(f_{\\sigma},\\tilde{f}_{\\tau})=1\\) 得 \\(h_{\\sigma}\\tilde{h}_{\\tau}\\) 是 \\(x^{n}-1\\) 的倍式，正交性成立；再由平方自由与 \\(M_{s}\\) 不跨类型复用，得 \\(\\mathrm{row}(H_{\\sigma})\\) 是互不相交的极小理想直和，配合引理 1 给出 \\(k=\\deg g\\)，此步无漏洞。命题 2/推论 1 的穷尽性（式 (7) 三种取法覆盖一个取反轨道内所有可能的 \\(T_{\\sigma}\\)）与推论 2 的可逆性判据也自洽。命题 4 的 \\(\\mu_{2}\\) 刻画是全篇最实质的一步，直线 \\(I_{s}w\\) 在 \\(\\mu_{2}\\) 下不变当且仅当 \\(w\\) 为纯型的分情形论证正确。例 1、例 2 的数值复查过：\\(43=3\\cdot14+1\\) 给 \\(k=1\\)，\\(31-3\\cdot5=16\\) 与表 I 一致；\\(\\tilde{f}_{X}=M_{15}\\)、\\(\\tilde{f}_{Y}=M_{3}\\)、\\(\\tilde{f}_{Z}=M_{11}\\) 与文中分量码吻合。","weaknesses":"· 只有两个实例（\\(n=43,31\\)），且都只是追平而非刷新码表；摘要“attain the best known minimum distance”若不强调是持平，读者会误以为是新纪录，而 Remark 1 自己承认 \\([[43,1,13]]\\) 与 [18] 的循环码在 Pauli 类型重标号下相同。\n· 没有渐近或族层面结论：既然奇长度码可完全枚举，读者期待例如“对哪些 \\(n\\) 存在 \\(d\\) 随 \\(n\\) 线性增长的序列”或一份更长参数表，文中停在两个点。\n· 距离完全依赖 [24] 的判定树算法，未给解析下界、未报告计算耗时与可扩展上限，也未说明 \\(d=13\\) 如何独立复核；对 \\(k=16\\) 的穷举成本本应交代。\n· “genuine”只用 [26] 的工具验证，未给可手工检验的论证，而这是支撑“超过 CSS 线性规划上界”这一卖点的关键前提。\n· 缺解码与实现层面：既无解码器，也无 syndrome 提取或循环移位寄存器编码电路的讨论，而循环结构的主要工程价值恰在此。\n· 存在性判据（推论 4）以取反轨道计数表述，但未给对给定 \\(n\\) 快速判定最大 \\(k\\)、\\(d\\) 可达多少的算法，实用价值被削弱。","overclaim":"最明显的夸大在摘要与引言末段：“exceed the linear-programming upper bounds for general CSS codes”。该 LP 界（[20]–[23]）本身只约束 CSS 码，任何真正的非 CSS 码越过它都是定义使然，并不构成质量证据；真正有信息量的对照是同 \\((n,k)\\) 的已知最优稳定子码距离，而那里只是持平。其次“the proposed cyclic XYZ codes attain the best known minimum distance”用了复数与一般现在时，容易读成“该族普遍达到最优”，实际只验证了两个长度；第 V 节结论沿用了同样措辞。建议把两处改成“在两个实例上达到”，并把超越 CSS 上界明确标为“非 CSS 码的预期现象”，另需说明码表数据取自 2026-10-30 的快照。","citations":"需要补齐或核对的对照：①[18] codetables 与 [19] 的 cyclic 列表只作为查询基准，应明确写出所用快照日期与查询参数，最好给出可复现的查询记录；②与 [5]（同组前作 XYZ 框架）的分工要更清楚——本文相对 [5] 新增的是循环分量码与 \\(\\mu_{2}\\) 刻画，但 [5] 是否已含非循环例子的更优参数未见对比；③非二元/加性循环稳定子码 [11],[12],[17] 与量子 BCH 码 [13]–[16] 只在引言罗列，未给出参数层面的直接比较，尤其是同为 \\(n=31,43\\) 的已知量子 BCH 码；④LP 界的具体形式与求解方式引 [25]，但 [25] 是非对称码语境，应说明如何退化到本文的对称 CSS 情形；⑤缺少与近期 qLDPC/BB 类构造在“同 \\(n\\) 下 \\(k,d\\)”上的定位讨论。","questions":"① 摘要“attain the best known minimum distance”应改为“在两个实例上持平”吗？若作者认为该族普遍成立，请给出支撑的族级命题。\n② 能否给出 \\(n\\) 更大时的参数表（例如 \\(n\\le 100\\) 的全部循环 XYZ 码及其 \\(d\\)），或者说明判定树算法在当前算力下的可处理上限？\n③ \\([[43,1,13]]\\) 与 [18] 的码在 Pauli 重标号下相同，那么本文相对该已知码的实质增益究竟是什么——是统一构造、是 \\(\\mu_{2}\\) 判据，还是新的 \\([[31,16,5]]\\)？请明确区分。\n④ 例 2 的 genuine 性除了 [26] 的工具外，能否给出一个简短的手工论证（例如某个逻辑算子的权/型分布无法由两类纯型生成）？","basis":"读完 arXiv:2611.30654v1 全文（第 I–V 节，含定义 1–4、命题 1–4、推论 1–4、例 1–2、表 I、脚注 1 与参考文献）；该文仅有 arXiv 预印本、无出版社排版版与 DOI，abstract 即预印本摘要。未获取 [24][26] 的代码与 [25] 的 LP 细节，故 \\(d\\le 11\\)、\\(d\\le 4\\) 只作逻辑核对。"}},{"id":"pr-10.1103/rcps-df2n","no":15,"topics":["大规模仿真","经典模拟"],"source":"PRX Quantum","venue":"PRX Quantum","published":"2026-11-24","title":"Lattice field theory for superconducting circuits","title_zh":"超导电路的格点场论方法","authors":["Joshua Lin","Max Hays","Stephen Sorokanich","Julian Bender","Phiala E. Shanahan","Neill C. Warrington"],"abstract":"Large superconducting quantum circuits have a number of important applications in quantum computing. Accurately predicting the performance of these devices from first principles is challenging, as it requires solving the many-body Schrödinger equation. This work introduces a new, general ab-initio method for analyzing large quantum circuits based on lattice field theory, a tool commonly applied in nuclear and particle physics. This method is competitive with state-of-the-art techniques such as tensor networks, but avoids introducing systematic errors due to truncation of the infinite-dimensional Hilbert space associated with superconducting phases. The approach is applied to fluxonium, a specific many-component superconducting qubit with favorable qualities for quantum computation. A systematic study of the influence of impedance on fluxonium is conducted that parallels previous experimental studies, and ground capacitance effects are explored. The qubit frequency and charge noise dephasing rate are extracted from statistical analyses of charge noise, where thousands of instantiations of charge disorder in the Josephson junction array of a fixed fluxonium qubit are explicitly averaged over at the microscopic level. This is difficult to achieve with any other existing method.","abstract_zh":"大型超导量子电路在量子计算中有若干重要应用。要从第一性原理准确预测这些器件的性能并不容易，因为这需要求解多体薛定谔方程。本工作引入一种新的、通用的第一性原理方法，用于分析大型量子电路，其基础是格点场论——一种常用于核物理与粒子物理的工具。该方法与张量网络等最先进技术相比具有竞争力，但不会因截断超导相位所对应的无穷维希尔伯特空间而引入系统误差。作者把该方法应用于 fluxonium，一种具有良好量子计算品质的多组件超导量子比特。文中对阻抗如何影响 fluxonium 做了系统研究，与先前的实验研究相对应，并探讨了接地电容的效应。量子比特频率与电荷噪声退相位率由电荷噪声的统计分析提取，其中对固定 fluxonium 量子比特的约瑟夫森结阵列中数千种电荷无序实现，在微观层面显式地做了平均。这用任何其他现有方法都难以实现。","importance":3,"importance_reason":"给做超导量子比特建模的人一把不截断局域空间的从头算标尺：首次独立校验张量网络的 fluxonium 结果，并首次把接地电容纳入多体计算。但它只算静态量、规模与代价仍受限于单器件，短期是校准工具而非设计主力，故取 3。","summary":"把电路 QED 表述成格点场论：fluxonium 每个结的相位作紧致 U(1) 场，欧氏路径积分用 HMC 加 instanton 更新抽样，由 \\(\\langle O(t)O(0)\\rangle\\) 的谱分解提取多体谱，因而完全避开局域希尔伯特空间截断这一系统误差来源。在 \\(z=0.14\\) 器件上复现张量网络结果，连续极限精度 100–500 kHz；再用重加权对一次抽样显式平均 1024 组门电荷，得退相位率比解析相位滑移模型高约 20%，并首次给出接地电容对频率分布的影响。","problem":"Fluxonium 常含上百个约瑟夫森结，每个结的相位都是一个无界 U(1) 量子变量，直接对角化在存储与时间上指数增长。通用的超电感模型把它压缩成单变量、用 \\(E_L=E_J^{a}/N\\) 近似阵列，无法描述相干量子相位滑移与阵列模式；张量网络虽强，却必须选基并截断局域希尔伯特空间，截断误差难以系统估计，且至今未纳入接地电容。因此需要一个不截断、误差可系统改进、并能显式做电荷无序平均的从头算多体方法。","method":"对任意有限个电容、电感与约瑟夫森结组成的电路，用节点法写出拉格朗日量，在 \\(N_t\\) 个时间片上把 \\(e^{-\\beta H}\\) Trotter 化，转移矩阵满足 \\(H_{\\mathrm{eff}}=H+O(\\Delta t^2)\\)，故离散误差可按 \\(\\Delta t^2\\) 外推消除。欧氏作用量含电容动能 \\(\\tfrac{\\varphi_0^2}{2}\\Delta t\\,\\dot\\phi_x C_{xx'}\\dot\\phi_{x'}\\)、电路势能与门电荷项 \\(i\\hbar\\Delta t\\,q_{gx}\\dot\\phi_{x,t}\\)。用 HMC 加 instanton 更新抽样，对关联函数做谱分解拟合与模型平均；门电荷产生的振荡相位用重加权吸收，一次抽样即可覆盖任意门电荷组；另设单与集体 instanton 提议以压低拓扑扇区自关联时间。","result":"Study 1 取 \\(N=40\\)、\\(z=0.14\\) 器件，11 个门电荷点的 \\(\\nu_{01}\\) 与张量网络逐点吻合，连续极限精度 100–500 kHz，\\(\\Delta t\\) 误差呈预期的二次行为，构成对文献 [49] 的首次独立验证。Study 2 在 \\(z=0.101\\)–0.135 用 1024 组均匀独立门电荷算频率分布，宽度与 \\(\\sigma=\\sqrt{N/2}\\,\\epsilon_{ps}|F_{01}|/h\\) 相比有约 20% 系统偏差，改用数值相位滑移率并重整 \\(E_L\\) 后可定量符合。Study 3 扫 \\(C_g=0\\)–1.0 fF，分布宽度降约 2.5 倍，即接地电容反而降低电荷噪声退相位。","contribution":"给出首个适用于任意有限电路的格点场论从头算框架：抽样直接在紧致 U(1) 场上进行，无需选基与截断，误差可系统改进；一次计算后重加权即可廉价探索邻近器件，本文把 1024 组电荷无序的平均成本压低约 1000 倍，并能直接看到 instanton 与多 instanton 构型。它是张量网络 fluxonium 结果的首次独立校验，也是首个含接地电容的 fluxonium 多体计算，为阵列模式微扰论与相位滑移解析式提供了可对照的定量基准。","limitation":"作者自承只处理静态量：文献 [49] 的实时 Lindblad 演化在当前格点框架下算不动，需借助变分蒙特卡洛或张量网络。Study 2、3 未做连续极限，仅固定 \\(\\Delta t=5\\) ps，靠 \\(z=0.101\\)、0.135 的 10 ps ensemble 估计约 2% 系统效应。阵列结取全同参数，未含结参数无序，也未用有限元得到的真实电容矩阵。我看出的：与实验只做量级一致比较，缺定量拟合；单套 ensemble 约 350 A100 GPU 小时，设计迭代成本仍高；接地电容区间现有解析方法失效，只验证了趋势而非定量。","key_numbers":["Study 1 器件参数：\\(N=40\\)、\\(C_a=7.5\\) fF、\\(E_{Jb}=8.9\\,h\\) GHz、\\(\\hbar\\omega_{pl}=12.5\\,h\\) GHz、\\(z=0.14\\)（式 (23)）","连续极限后量子比特频率精度 100–500 kHz，格点间距误差约几 MHz；\\(\\Delta t\\) 取 1.25–5 ps、\\(N_t=400\\)（图 3、表 II）","Study 2 覆盖 \\(z=0.101\\)–0.135，每个器件用 1024 组独立均匀门电荷；重加权把成本降低约 1000 倍（第四节 B、图 5）","格点结果与解析相位滑移模型的退相位率存在约 20% 系统偏差（第六节结论）","接地电容由 0 增至 1.0 fF 时量子比特频率分布宽度下降约 2.5 倍（第四节 C、图 9）","每套 ensemble 约 350 A100 GPU 小时，\\(N\\sim 50\\)–100 个结；与已报道最大 JJ 阵列模拟（200 结、3200 时间片）相差 8 倍以内（第五节）"],"pdf_url":"https://arxiv.org/pdf/2512.05851","doi":"10.1103/rcps-df2n","url":"https://doi.org/10.1103/rcps-df2n","review":{"verdict":"小修","confidence":"中高","correctness":"核心主张成立。第二节是对标准格点场论（文献 [61,62]）的忠实搬运：式 (13) 的 \\(\\nu_{01}(\\Delta t)=\\nu_{01}+b\\Delta t^2+O(\\Delta t^4)\\) 与 BCH 展开一致，式 (17) 的 \\(N_{\\mathrm{cfg}}^{-1/2}\\) 收敛、式 (18) 的重加权恒等式都正确，且该恒等式确实让 1024 组门电荷共用一条 Markov 链。数值上，图 3(b) 显示 \\(\\nu_{01}(\\Delta t)-\\nu_{01}\\) 对 \\(\\Delta t\\) 呈抛物线、幅度几 MHz，与式 (13) 自洽；图 4 与文献 [49] 在整个 \\(n_g\\in[0,1/2]\\) 区间吻合到误差棒内，是有意义的独立校验。图 6 中格点结果与式 (32) 的宽度系统偏离、而重整后的解析式落在对角线上，逻辑自洽。","weaknesses":"· Study 2、3 只有 \\(\\Delta t=5\\) ps 的单点结果，连续极限仅对两个 \\(z\\) 值核对过；正文承认约 2% 系统效应被略去，而图 6 要分辨的偏差本身只有约 20%，两者之比不足十倍，说服力偏弱。\n· 电荷无序取独立均匀分布是未加论证的假设，实际器件的门电荷可能存在空间关联；图 5 中 \\(z=0.135\\) 的分布已接近均匀，重加权方差如何随分布差异增长未讨论。\n· 与实验文献 [42] 的对照只在一个 \\(z=0.101\\) 点做量级比较，作者自己说需要细粒度参数（尤其接地电容）才能定量，削弱了摘要中“parallels previous experimental studies”的分量。\n· 没有与张量网络在同一含接地电容问题上直接对比，也没有同精度下的计时表；“与最先进 TN 效率相当”只靠一条 private communication（文献 [69]）。\n· 验证器件（\\(N=40\\)、\\(z=0.14\\)）与后续研究器件（\\(z=0.101\\)–0.135）不同，压制区之外的可靠性未被独立证明。","overclaim":"摘要称本方法“avoids introducing systematic errors due to truncation”，易被读成无系统误差，但格点自身有 \\(\\Delta t^2\\) 离散误差与有限统计，且 Study 2、3 根本没做连续极限。摘要“thousands of instantiations ... explicitly averaged over at the microscopic level. This is difficult to achieve with any other existing method”有两处夸大：实际是 1024 组而非数千组；重加权原则上对张量网络与变分蒙特卡洛同样可用，只是更繁琐。结论把“唯一无需截断的多体方法”当作卖点，也把“竞争得过 TN”建立在单器件、无计时数据的比较上。","citations":"主要对照基线引用到位：文献 [49]（张量网络 fluxonium）、[42]（CQPS 退相位实验）、[29]（Basko 等的 QMC 规模基准）、[41,45,46]（阵列模式微扰论）。问题在于 [69] 只是一条 private communication，却被当作“与最先进 TN 效率相当”的唯一依据，应换成可核对的已发表计时。缺失的还有：近年含电容耦合的二维 circuit-QED 张量网络/DMRG 工作；变分蒙特卡洛在电路 QED 的具体实现（正文只在展望处提及）；以及式 (29) 的 Mathieu 渐近式与数值解的原始出处，本文对它的修改需要更明确的引用支撑。","questions":"① 若给 Study 2、3 补 \\(\\Delta t=2.5\\) ps 与 10 ps 的 ensemble 做连续极限，图 6 中的 20% 偏差还剩多少？图 9 的 2.5 倍下降是否稳健？② 门电荷取独立均匀分布是物理假设还是数值方便？若换成有关联的分布，重加权方差是否会让 1024 组不够用？③ 单套 ensemble 约 350 A100 GPU 小时，在同等精度下与文献 [49] 的 TN 相比究竟谁便宜？能否给出同器件、同精度的计时表？","basis":"全文读的是 arXiv:2512.05851v1 预印本（PRX Quantum 出版社排版版未获取），abstract 取自该预印本摘要。已读摘要、第一至六节全文、附录 A（HMC 与 instanton 更新、关联函数拟合与贝叶斯模型平均）与附录 B（相位滑移率模型），以及表 I–II 与图 1–9 的图注文字；图本身未逐张目视核对，参考文献仅通读条目。"}}]}</script>
<script>
(function () {
  "use strict";
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  const META = DATA.meta || {};
  const ARTICLES = Array.isArray(DATA.articles) ? DATA.articles : [];
  const STORE_KEY = "ftqc-digest-v2";
  const STATUS_LABEL = { inbox: "待读", reading: "在读", done: "已提炼" };
  const IMP_LABEL = { 5: "必读", 4: "高", 3: "中", 2: "参考", 1: "低" };
  const IMP_STYLE = {
    5: ["#c62828", "#fdeaea"],
    4: ["#1f4fd1", "#e9efff"],
    3: ["#087a5b", "#e3f6ee"],
    2: ["#9a5b00", "#fff3d6"],
    1: ["#6b7280", "#f0f1f1"]
  };
  const PALETTE = [
    ["#1f4fd1", "#e9efff"],
    ["#c2410c", "#fff0e6"],
    ["#087a5b", "#e3f6ee"],
    ["#6d45c7", "#f0eaff"],
    ["#9a5b00", "#fff3d6"],
    ["#b3266e", "#fde8f2"],
    ["#0e7490", "#e2f5f8"]
  ];
  const SOURCE_STYLE = {
    "arXiv": ["#c2410c", "#fff0e6"],
    "PRX": ["#1f4fd1", "#e9efff"],
    "PRX Quantum": ["#6d45c7", "#f0eaff"]
  };
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const esc = (v) => String(v == null ? "" : v)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  let store = {};
  try { store = JSON.parse(localStorage.getItem(STORE_KEY) || "{}") || {}; } catch (e) { store = {}; }
  const wf = (id) => store[id] || (store[id] = { status: "inbox", note: "" });
  const save = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) { toast("浏览器阻止本地存储，修改仅在当前页有效"); } };
  let toastTimer;
  function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1800); }
  const dateOnly = (v) => String(v || "").slice(0, 10);

  // topic palette, stable by first appearance
  const allTopics = [];
  ARTICLES.forEach(a => (a.topics || []).forEach(t => { if (!allTopics.includes(t)) allTopics.push(t); }));
  const topicColor = {};
  allTopics.forEach((t, i) => { topicColor[t] = PALETTE[i % PALETTE.length]; });
  const sourceCounts = {};
  ARTICLES.forEach(a => { sourceCounts[a.source] = (sourceCounts[a.source] || 0) + 1; });
  const mustRead = ARTICLES.filter(a => a.importance >= 5).length;

  $("#pageTitle").textContent = META.title || "文献速递";
  $("#pageSubtitle").textContent = META.subtitle || "容错量子计算与超导量子计算机仿真";
  $("#issueDate").textContent = META.issue_date || "—";
  const reviewed = ARTICLES.filter(a => a.review).length;
  $("#issueCounts").innerHTML = `${ARTICLES.length} 篇 · 必读 <b>${mustRead}</b> 篇${reviewed ? ` · AI 审稿 ${reviewed}` : ""}`;
  $("#asOf").textContent = META.collection_window || ("数据截至 " + (META.as_of || "—"));
  $("#generatedAt").textContent = META.generated_at || "—";
  $("#scopeLink").href = META.scope_href || "../SCOPE.md";

  const GROUP_STYLE = {
    "arXiv": "#c2410c",
    "PR 系列": "#1f4fd1",
    "Nature 系列": "#087a5b",
    "Quantum": "#6d45c7",
    "Science Advances": "#b3266e",
    "SciPost Physics": "#0e7490",
    "AVS Quantum Science": "#7a4bb5",
    "Quantum Science and Technology": "#9a5b00",
    "Cryptology ePrint Archive": "#8a5200"
  };
  const journalRows = Array.isArray(META.journals) ? META.journals : [];
  const totals = META.coverage_totals || {
    raw: journalRows.reduce((n, r) => n + Number(r.raw || 0), 0),
    deduped: journalRows.reduce((n, r) => n + Number(r.raw || 0), 0),
    screened: journalRows.reduce((n, r) => n + Number(r.screened || 0), 0),
    included: journalRows.reduce((n, r) => n + Number(r.included || 0), 0)
  };
  $("#coverage").innerHTML = `<details class="coverage">
    <summary><span>检索覆盖</span><span class="nums">抓取 ${totals.raw} · 去重 ${totals.deduped} · 关键词初筛 ${totals.screened} · 收录 ${totals.included}</span></summary>
    <div class="coverage-body">
      <table class="coverage-table">
        <thead><tr><th>来源 / 期刊</th><th>状态</th><th class="num">抓取</th><th class="num">关键词初筛</th><th class="num">收录</th></tr></thead>
        <tbody>
          ${journalRows.map(r => {
            const color = GROUP_STYLE[r.label] || GROUP_STYLE[r.group] || "#303030";
            const st = r.status || "ok";
            const stLabel = st === "ok" ? "正常" : st === "partial" ? "部分" : "失败";
            const stCell = `<td><span class="st st-${st}">${stLabel}</span></td>`;
            if (r.kind === "group") {
              return `<tr class="group"><td>${esc(r.label)}</td>${stCell}<td class="num">${r.raw}</td><td class="num">${r.screened}</td><td class="num">${r.included}</td></tr>`;
            }
            return `<tr class="${r.kind === "journal" ? "sub" : "single"}"><td><span class="coverage-source"><span class="source-dot" style="--sc:${color}"></span>${esc(r.label)}</span></td>${stCell}<td class="num">${r.raw}</td><td class="num">${r.screened}</td><td class="num"><b>${r.included}</b></td></tr>`;
          }).join("")}
          <tr class="total"><td>合计（去重后）</td><td>—</td><td class="num">${totals.deduped}</td><td class="num">${totals.screened}</td><td class="num">${totals.included}</td></tr>
        </tbody>
      </table>
    </div>
  </details>`;

  // keyword bar
  const state = { topic: "all" };
  function countTopic(t) { return ARTICLES.filter(a => (a.topics || []).includes(t)).length; }
  function renderKeywordBar() {
    const items = [`<button class="kbtn kbtn-all" data-topic="all" aria-pressed="${state.topic === "all"}">全部<span class="c">${ARTICLES.length}</span></button>`];
    allTopics.forEach(t => {
      const [c, bg] = topicColor[t];
      items.push(`<button class="kbtn" data-topic="${esc(t)}" aria-pressed="${state.topic === t}" style="--tc:${c};--tbg:${bg}">${esc(t)}<span class="c">${countTopic(t)}</span></button>`);
    });
    $("#keywordBar").innerHTML = items.join("");
  }
  renderKeywordBar();

  function impColor(v) { return IMP_STYLE[v] || IMP_STYLE[1]; }
  function sourcePill(source) {
    const [c, bg] = SOURCE_STYLE[source] || ["#4b514c", "#f0f1f1"];
    return `<span class="source-pill" style="--sc:${c};--sbg:${bg}">${esc(source)}</span>`;
  }
  function topicChips(a) {
    return (a.topics || []).map(t => {
      const [c, bg] = topicColor[t] || ["#4b514c", "#f0f1f1"];
      return `<span class="topic" style="--tc:${c};--tbg:${bg}">${esc(t)}</span>`;
    }).join("");
  }


  function reviewPoints(text) {
    let t = String(text || "").trim();
    if (!t) return ["（未提供）"];
    let parts = t.split(/(?=（\d+）)|(?=\(\d+\)\s)/).map(s => s.trim()).filter(Boolean);
    if (parts.length === 1) {
      parts = t.split(/\n+/).map(s => s.trim()).filter(Boolean);
    }
    if (parts.length === 1 && /[；;]/.test(t) && t.length > 120) {
      parts = t.split(/[；;]/).map(s => s.trim()).filter(Boolean);
    }
    if (parts.length === 1) {
      const sentences = t.match(/[^。！？]+[。！？]?/g) || [t];
      if (sentences.length > 1) parts = sentences.map(s => s.trim()).filter(Boolean);
    }
    const expanded = [];
    for (const part of parts) {
      if (part.length > 420 && /[；;]/.test(part)) {
        expanded.push(...part.split(/[；;]/).map(s => s.trim()).filter(Boolean));
      } else {
        expanded.push(part);
      }
    }
    return expanded.map(s => s.replace(/^[（(]?\d+[）)]?\s*/, "").trim()).filter(Boolean);
  }
  function reviewList(text) {
    return `<ul>${reviewPoints(text).map(p => `<li>${esc(p)}</li>`).join("")}</ul>`;
  }
  function reviewHTML(a) {
    const r = a.review;
    if (!r) return "";
    return `<details class="review">
      <summary>AI 审稿</summary>
      <div class="review-body">
        <div class="review-block"><h3>核心主张是否成立</h3>${reviewList(r.correctness)}</div>
        <div class="review-block"><h3>主要缺陷</h3>${reviewList(r.weaknesses)}</div>
        <div class="review-block"><h3>是否夸大</h3>${reviewList(r.overclaim)}</div>
        <div class="review-block"><h3>需要核对的引用 / 实验</h3>${reviewList(r.citations)}</div>
        <div class="review-block"><h3>要作者回答的问题</h3>${reviewList(r.questions)}</div>
        <p class="review-meta">${esc(r.basis)} · AI 生成的批判性审稿，不是同行评审；结论以原文为准。</p>
      </div>
    </details>`;
  }

  function entryHTML(a) {
    const w = wf(a.id);
    const [ic, ib] = impColor(a.importance);
    const opts = Object.entries(STATUS_LABEL).map(([k, v]) => `<option value="${k}"${w.status === k ? " selected" : ""}>${v}</option>`).join("");
    return `<article class="entry" id="p-${String(a.no).padStart(2, "0")}" data-id="${esc(a.id)}" style="--imp:${ic};--imp-bg:${ib}">
      <aside class="rail">
        <div class="no">${String(a.no).padStart(2, "0")}</div>
        <span class="imp-badge" title="${esc(a.importance_reason || "")}" aria-label="重要性 ${a.importance} / 5，${IMP_LABEL[a.importance]}"><span>${a.importance}</span><span class="den">/5</span></span>
        <span class="imp-label">${esc(IMP_LABEL[a.importance] || "")}</span>
      </aside>
      <div class="entry-body">
        <div class="entry-meta">
          ${sourcePill(a.source)}<span class="sep">·</span><time datetime="${esc(dateOnly(a.published))}">${esc(dateOnly(a.published))}</time><span class="sep">·</span><span>${esc(a.venue || "")}</span>
        </div>
        <h2><a href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">${esc(a.title)}</a></h2>
        <p class="title-zh">${esc(a.title_zh)}</p>
        <p class="authors">${esc((a.authors || []).join(" · "))}</p>
        <div class="topics">${topicChips(a)}</div>
        <p class="imp-reason"><b>重要性 ${a.importance}/5 · ${esc(IMP_LABEL[a.importance] || "")}</b> · ${esc(a.importance_reason || "")}</p>
        <p class="summary"><b>结论</b>${esc(a.summary)}</p>
        <div class="analysis">
          <div><h3>问题</h3><p>${esc(a.problem)}</p></div>
          <div><h3>方法</h3><p>${esc(a.method)}</p></div>
          <div><h3>结果</h3><p>${esc(a.result)}</p></div>
          <div><h3>关键贡献</h3><p>${esc(a.contribution)}</p></div>
          <div class="wide"><h3>局限 / 待核验</h3><p>${esc(a.limitation)}</p></div>
        </div>
        <div class="keynums"><span class="label">关键数字</span>${(a.key_numbers || []).map(k => `<span class="kn">${esc(k)}</span>`).join("")}</div>
        <div class="entry-foot">
          <div class="entry-actions">
            <select class="status-select" data-status="${esc(a.id)}" aria-label="阅读状态">${opts}</select>
            <button class="textbtn" type="button" data-note-toggle="${esc(a.id)}">${w.note ? "编辑笔记" : "笔记"}</button>
            <a class="link" href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">原文 ↗</a>
            ${a.pdf_url ? `<a class="link" href="${esc(a.pdf_url)}" target="_blank" rel="noopener noreferrer">PDF</a>` : ""}
            ${a.doi ? `<a class="link" href="https://doi.org/${esc(a.doi)}" target="_blank" rel="noopener noreferrer">DOI</a>` : ""}
          </div>
        </div>
        <details class="abstract"><summary>摘要原文</summary>
          <div class="abstract-block"><div class="abstract-lang">English</div><p>${esc(a.abstract || "摘要待补。")}</p></div>
          ${a.abstract_zh ? `<div class="abstract-block"><div class="abstract-lang">中文翻译</div><p>${esc(a.abstract_zh)}</p></div>` : ""}
        </details>
        ${reviewHTML(a)}
        <div class="note-wrap" data-note-wrap="${esc(a.id)}"${w.note ? "" : " hidden"}>
          <textarea class="note-area" data-note="${esc(a.id)}" placeholder="记录：值得记下的方法、需要核对的数字、与你当前工作的连接…">${esc(w.note)}</textarea>
          <div class="note-meta"><span data-save-status="${esc(a.id)}">${w.note ? "已从本机恢复" : "自动保存在本机"}</span><button class="textbtn" type="button" data-export-one="${esc(a.id)}">导出此条</button></div>
        </div>
      </div>
    </article>`;
  }

  function renderTOC() {
    const list = ARTICLES.slice().sort((a, b) => a.no - b.no);
    $("#tocList").innerHTML = list.map(a => `<li><a href="#p-${String(a.no).padStart(2, "0")}" data-toc-link><span class="toc-no">${String(a.no).padStart(2, "0")}</span><span>${esc(a.title_zh || a.title)}</span></a></li>`).join("");
  }
  function closeTOC() {
    $("#tocPanel").hidden = true;
    $("#tocToggle").setAttribute("aria-expanded", "false");
  }

  function typesetMath() {
    if (!window.MathJax || !MathJax.typesetPromise) return;
    const run = () => MathJax.typesetPromise([$("#entries")]).catch(err => console.warn("MathJax:", err));
    if (MathJax.startup && MathJax.startup.promise) MathJax.startup.promise.then(run);
    else run();
  }

  function render() {
    const list = ARTICLES.filter(a => state.topic === "all" || (a.topics || []).includes(state.topic)).sort((a, b) => a.no - b.no);
    $("#entries").innerHTML = list.map(entryHTML).join("");
    $("#emptyState").innerHTML = ARTICLES.length
      ? `<b>这个关键词下暂无条目</b>点“全部”回到完整列表。`
      : `<b>本轮无新增论文</b>数据时间范围内没有新增条目。`;
    $("#emptyState").classList.toggle("show", list.length === 0);
    $("#listSummary").innerHTML = `显示 <b>${list.length}</b> / ${ARTICLES.length} 篇`;
    $$(".kbtn").forEach(b => b.setAttribute("aria-pressed", String(state.topic === b.dataset.topic)));
    typesetMath();
  }

  $("#keywordBar").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-topic]");
    if (!btn) return;
    state.topic = btn.dataset.topic;
    render();
  });

  $("#entries").addEventListener("click", (e) => {
    const toggle = e.target.closest("[data-note-toggle]");
    if (toggle) {
      const wrap = document.querySelector(`[data-note-wrap="${CSS.escape(toggle.dataset.noteToggle)}"]`);
      if (wrap) { wrap.hidden = !wrap.hidden; if (!wrap.hidden) wrap.querySelector("textarea")?.focus(); }
      return;
    }
    const one = e.target.closest("[data-export-one]");
    if (one) {
      const a = ARTICLES.find(x => x.id === one.dataset.exportOne);
      download(`note-${a.no}-${a.id}.json`, { article: { id: a.id, title: a.title, url: a.url }, workflow: wf(a.id) });
      toast("已导出此条");
    }
  });

  $("#entries").addEventListener("change", (e) => {
    const sel = e.target.closest("[data-status]");
    if (!sel) return;
    const w = wf(sel.dataset.status); w.status = sel.value; save();
    toast("状态已保存：" + STATUS_LABEL[w.status]);
  });
  let noteTimer;
  $("#entries").addEventListener("input", (e) => {
    const ta = e.target.closest("[data-note]");
    if (!ta) return;
    const w = wf(ta.dataset.note); w.note = ta.value;
    const label = document.querySelector(`[data-save-status="${CSS.escape(ta.dataset.note)}"]`);
    if (label) label.textContent = "正在保存…";
    clearTimeout(noteTimer);
    noteTimer = setTimeout(() => {
      save();
      if (label) label.textContent = "已保存 · " + new Date().toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });
    }, 300);
  });

  function download(filename, payload) {
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
  }
  $("#exportBtn").addEventListener("click", () => {
    download(`reading-notes-${META.issue_date || "digest"}.json`, {
      exported_at: new Date().toISOString(), issue: META.issue_date,
      articles: ARTICLES.map(a => ({ id: a.id, no: a.no, title: a.title, topics: a.topics, url: a.url, ...wf(a.id) }))
    });
    toast("已导出全部笔记与公式修改");
  });
  $("#printBtn").addEventListener("click", () => window.print());

  document.addEventListener("toggle", (e) => {
    if (e.target.matches && e.target.matches("details.abstract, details.review")) typesetMath();
  }, true);

  const TOC_POS_KEY = "qc-toc-pos-v1";
  const tocDesktop = window.matchMedia("(hover: hover) and (pointer: fine)");
  let tocDrag = null;
  let tocMoved = false;
  let suppressTocClick = false;
  function isDesktopToc() { return tocDesktop.matches; }
  function setTocPosition(left, top) {
    if (isDesktopToc()) return;
    const box = $("#toc");
    const maxLeft = Math.max(0, window.innerWidth - box.offsetWidth);
    const maxTop = Math.max(56, window.innerHeight - box.offsetHeight - 8);
    const x = Math.max(0, Math.min(maxLeft, Math.round(left)));
    const y = Math.max(56, Math.min(maxTop, Math.round(top)));
    box.style.left = x + "px";
    box.style.top = y + "px";
    box.style.bottom = "auto";
    box.classList.toggle("right", x > window.innerWidth / 2);
    return { left: x, top: y };
  }
  function saveTocPosition() {
    if (!isDesktopToc()) {
      const box = $("#toc");
      const r = box.getBoundingClientRect();
      try { localStorage.setItem(TOC_POS_KEY, JSON.stringify({ left: r.left, top: r.top })); } catch (e) {}
    }
  }
  function snapToc() {
    const box = $("#toc");
    const r = box.getBoundingClientRect();
    const left = (r.left + r.width / 2 < window.innerWidth / 2)
      ? 0
      : Math.max(0, window.innerWidth - r.width);
    const pos = setTocPosition(left, r.top);
    if (pos) { try { localStorage.setItem(TOC_POS_KEY, JSON.stringify(pos)); } catch (e) {} }
  }
  function restoreTocPosition() {
    if (isDesktopToc()) return;
    try {
      const raw = localStorage.getItem(TOC_POS_KEY);
      if (raw) {
        const p = JSON.parse(raw);
        if (typeof p.left === "number" && typeof p.top === "number") setTocPosition(p.left, p.top);
      }
    } catch (e) {}
  }
  function collapseDesktopToc() {
    const box = $("#toc");
    box.classList.add("collapsed");
    document.body.classList.remove("toc-open");
    $("#tocPanel").hidden = true;
    $("#tocToggle").setAttribute("aria-expanded", "false");
  }
  function openDesktopToc() {
    const box = $("#toc");
    box.classList.remove("collapsed");
    document.body.classList.add("toc-open");
    $("#tocPanel").hidden = false;
    $("#tocToggle").setAttribute("aria-expanded", "true");
  }
  function applyTocMode() {
    const box = $("#toc");
    if (isDesktopToc()) {
      box.style.left = "";
      box.style.top = "";
      box.style.bottom = "";
      $("#tocClose").textContent = "收起";
      openDesktopToc();
    } else {
      document.body.classList.remove("toc-open");
      box.classList.remove("collapsed");
      $("#tocClose").textContent = "×";
      closeTOC();
      restoreTocPosition();
    }
  }
  tocDesktop.addEventListener("change", applyTocMode);
  $("#tocToggle").addEventListener("pointerdown", (e) => {
    if (isDesktopToc()) return;
    const box = $("#toc");
    const r = box.getBoundingClientRect();
    tocDrag = { x: e.clientX, y: e.clientY, left: r.left, top: r.top };
    tocMoved = false;
    try { $("#tocToggle").setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  });
  $("#tocToggle").addEventListener("pointermove", (e) => {
    if (!tocDrag) return;
    const dx = e.clientX - tocDrag.x;
    const dy = e.clientY - tocDrag.y;
    if (Math.abs(dx) + Math.abs(dy) > 5) tocMoved = true;
    setTocPosition(tocDrag.left + dx, tocDrag.top + dy);
  });
  $("#tocToggle").addEventListener("pointerup", () => {
    if (!tocDrag) return;
    if (tocMoved) {
      suppressTocClick = true;
      snapToc();
      setTimeout(() => { suppressTocClick = false; }, 150);
    }
    tocDrag = null;
  });
  $("#tocToggle").addEventListener("click", () => {
    if (suppressTocClick) return;
    if (isDesktopToc()) {
      if ($("#toc").classList.contains("collapsed")) openDesktopToc();
      else collapseDesktopToc();
      return;
    }
    if ($("#tocPanel").hidden) {
      $("#tocPanel").hidden = false;
      $("#tocToggle").setAttribute("aria-expanded", "true");
    } else {
      closeTOC();
    }
  });
  $("#tocClose").addEventListener("click", () => {
    if (isDesktopToc()) collapseDesktopToc(); else closeTOC();
  });
  $("#tocPanel").addEventListener("click", (e) => {
    if (e.target.closest("[data-toc-link]") && !isDesktopToc()) closeTOC();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      if (isDesktopToc()) collapseDesktopToc(); else closeTOC();
    }
  });
  window.addEventListener("resize", () => {
    if (isDesktopToc()) return;
    const box = $("#toc");
    const r = box.getBoundingClientRect();
    setTocPosition(r.left, r.top);
  });
  applyTocMode();

  renderTOC();
  render();
})();
</script>
</body>
</html>
