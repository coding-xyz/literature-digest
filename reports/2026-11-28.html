l":"STOC","kind":"conference","raw":0,"screened":0,"included":0,"status":"ok"},{"group":"会议","label":"FOCS","kind":"conference","raw":0,"screened":0,"included":0,"status":"ok"},{"group":"会议","label":"SODA","kind":"conference","raw":0,"screened":0,"included":0,"status":"ok"},{"group":"会议","label":"ICML","kind":"conference","raw":0,"screened":0,"included":0,"status":"ok"},{"group":"会议","label":"NeurIPS (NIPS)","kind":"conference","raw":0,"screened":0,"included":0,"status":"ok"},{"group":"会议","label":"WADS","kind":"conference","raw":0,"screened":0,"included":0,"status":"ok"},{"group":"Quantum","label":"Quantum","kind":"single","raw":3,"screened":0,"included":2,"status":"ok"},{"group":"Science Advances","label":"Science Advances","kind":"single","raw":0,"screened":0,"included":0,"status":"error"},{"group":"SciPost Physics","label":"SciPost Physics","kind":"single","raw":0,"screened":0,"included":0,"status":"error"},{"group":"AVS Quantum Science","label":"AVS Quantum Science","kind":"single","raw":0,"screened":0,"included":0,"status":"error"},{"group":"Quantum Science and Technology","label":"Quantum Science and Technology","kind":"single","raw":0,"screened":0,"included":0,"status":"error"}],"coverage_totals":{"raw":200,"deduped":25,"screened":0,"included":3,"errors":["scienceadv","scipost","avs","qst"]}},"articles":[{"id":"quantum-10.22331/q-2026-11-27-2287","no":1,"topics":["大规模仿真","经典模拟"],"source":"Quantum","venue":"Quantum","published":"2026-11-27","title":"ffsim: faster simulation of fermionic quantum circuits","title_zh":"ffsim：更快的费米子量子线路模拟","authors":["Kevin J. Sung","Inho Choi","Mirko Amico","Bartholomew Andrews","Esra Ayantuna","Hrishikesh Belagali","Yukio Kawashima","Ryan LaRose","Wan-Hsuan Lin","David Omanovic","Samuele Piccinelli","Javier Robledo Moreno","Abdullah Ash Saki","James Shee","Soyoung Shin","Sabyrzhan Tasbolatov","Minh C. Tran","Kento Ueda","Haimeng Zhang","Mario Motta"],"abstract":"We present ffsim, an open-source software library for fast simulation of fermionic quantum circuits. ffsim exploits conservation of particle number and the z component of spin, symmetries present in a wide range of fermionic systems, to dramatically reduce memory usage and simulation time compared to general-purpose quantum circuit simulators. Compared to FQE, a library with similar functionality, ffsim differs in software design and is faster on a representative set of simulation benchmarks. Beyond state vector evolution by basic fermionic gates, ffsim offers a number of additional features including variational ansatzes, Hamiltonian time evolution via Trotter-Suzuki product formulas, efficient sampling of Slater determinants, seamless integration with Qiskit and PySCF, and comprehensive documentation. We demonstrate ffsim's capabilities on scientific applications, including a 64-qubit Hubbard model with 8 electrons. ffsim's source code and documentation are available via https://github.com/Qiskit/ffsim.","abstract_zh":"我们介绍 ffsim，一个用于快速模拟费米子量子线路的开源软件库。ffsim 利用粒子数守恒与自旋 z 分量守恒——这两类对称性广泛存在于费米子系统中——相比通用量子线路模拟器大幅降低了内存占用与模拟时间。与功能相近的 FQE 库相比，ffsim 在软件设计上有所不同，并在代表性基准测试集上更快。除基本费米子门驱动的态矢量演化之外，ffsim 还提供变分拟设、基于 Trotter-Suzuki 乘积公式的哈密顿量时间演化、Slater 行列式的高效采样、与 Qiskit 和 PySCF 的无缝集成以及完整文档。我们在一批科学应用上演示了 ffsim 的能力，包括一个含 8 个电子的 64 比特 Hubbard 模型。ffsim 的源码与文档见 https://github.com/Qiskit/ffsim。","importance":5,"importance_reason":"费米子线路的经典模拟是所有量子化学、材料与 Hubbard 模型硬件实验的对照基线，而通用模拟器要存 \\(2^{2N}\\) 个振幅，32 轨道就已是 64 GiB 量级；ffsim 把存储压到 \\(D=\\binom{N}{N_\\alpha}\\binom{N}{N_\\beta}\\) 的固定粒子数/固定自旋扇区，并给出每个门的精确复杂度（对角库仑演化 \\(O(ND)\\)、轨道旋转 \\(O(N^3+N^2D)\\)），把 64 比特、8 电子的二维 Hubbard 模型 Trotter 误差估计这种此前只能靠界估计的问题变成可实测的数值实验。文中同时给出单线程 2.4×（二次哈密顿量演化）、8.4×（分子哈密顿量作用）、最高 18×（双因子化 Trotter）相对 FQE 的加速，以及 32 轨道 1/2 填充 2.5 GiB、1/4 填充 51 MiB 的内存表，这些数字可以直接用来判断「某个 40–60 比特的费米子算例在本地能不能跑」，属于必须知道的一手工程参数。","summary":"只在固定粒子数与自旋 z 扇区内存储态矢量，维度 \\(D=\\binom{N}{N_\\alpha}\\binom{N}{N_\\beta}\\) 而非 \\(2^{2N}\\)：32 轨道 1/2 填充通用模拟器需 64 GiB、ffsim 只需 2.5 GiB（1/4 填充 51 MiB）；单线程比 FQE 快 2.4×（二次哈密顿量演化）、8.4×（分子哈密顿量作用），双因子化 Trotter 最高 18×，并用 4×8 二维 Hubbard（64 比特、1/8 填充）实测 Trotter 误差。","problem":"通用态矢量模拟器在 Jordan-Wigner 映射下为 \\(2N\\) 个自旋轨道各分配一个比特，态矢量维度固定为 \\(2^{2N}\\)，内存与时间都不随体系的对称性下降；而实际要模拟的费米子线路（UCCSD/LUCJ 拟设、Trotter 化的电子哈密顿量、采样型算法）几乎都守恒粒子数与自旋 z 分量，因此存在大量冗余振幅。FQE 已经利用了这两个守恒量，但它的面向对象接口要为每个态维护专门的类，部分门（如双因子化 Trotter 中的轨道旋转）另有一套 Givens 实现，常数因子偏大，也缺少与 Qiskit/PySCF 的接续、压缩双因子化、Slater 行列式采样等功能。作者要回答的是：在同样利用对称性的前提下，能否把态矢量模拟做成既通用（覆盖常用费米子门与拟设）又快（相对 FQE 有常数倍以上加速）、又能直接接到现有量子化学与硬件工作流上的库，并给出各操作随 \\(N\\)、填充率变化的实测标度。","method":"态矢量写成 \\(|\\Psi\\rangle=\\sum_{I_\\alpha,I_\\beta}\\gamma(I_\\alpha,I_\\beta)|I_\\alpha,I_\\beta\\rangle\\)，其中 \\(I_\\sigma\\) 是固定自旋的电子组态（Slater 行列式），地址映射借 PySCF 的 FCI 模块生成；因为组态数只有 \\(d_\\sigma=\\binom{N}{N_\\sigma}\\)，自旋向上与向下两个扇区各存一个 NumPy 数组，所以旋转库里只需两比特数 \\(D=d_\\alpha d_\\beta\\)。门集合取为三类的特例或组合：数算符和演化（逐振幅乘相位，\\(O(D)\\)）、对角库仑演化（预计算同自旋相位与跨自旋相互作用相位，共 \\(O(N^2(d_\\alpha+d_\\beta))\\)，之后每振幅 \\(O(N)\\)，总计 \\(O(ND)\\)）、与轨道旋转（把 \\(N\\times N\\) 酉矩阵分解为 \\(O(N^2)\\) 个 Givens 旋转与 \\(O(N)\\) 个单轨道相位，每个作用于态矢量 \\(O(D)\\)，总代价 \\(O(N^3+N^2D)\\)；作者另给一条基于 LU 分解的实现，二者同阶但省去列复制）。这些门对「守恒粒子数与自旋 z」的线路是通用的。实现上把热循环写进 Rust 内核并按配置索引并行，Python 侧保持函数式接口（态矢量就是 NumPy 数组）；Qiskit 接口把任意由保持汉明重量的门构成的比特线路转成费米子门序列，分子哈密顿量作用走 PySCF 的 FCI 内核；附加功能包括 LUCJ 等变分拟设、压缩双因子化、Trotter-Suzuki 时间演化、Slater 行列式采样与正规序化工具；性能用 asv 在 M1 Max 与 Ryzen 7 Pro 4750U 两台机器上测，基线与 FQE 0.3.0、Qiskit Aer、DPPy、OpenFermion 对照。","result":"在最大算例（16 空间轨道、1/2 填充，即 32 比特）上 ffsim 全面快于 FQE：单线程 M1 Max 上二次哈密顿量演化 2.4×、对角库仑演化 1.2×、分子哈密顿量作用 8.4×，允许开多线程后前两者升到 4.8× 与 7.5×，双因子化 Trotter 模拟最高 18×；同一算例 Qiskit Aer 因需 64 GiB 存态矢量而跑不动，ffsim 与 FQE 在 1/2 填充只需 2.5 GiB、1/4 填充 51 MiB。附加功能上，Slater 行列式采样比 DPPy 快 3.5×，算符正规序化比 OpenFermion 快 20×。应用方面：用 4×8 二维 Hubbard 模型（32 轨道 = 64 比特、1/8 填充、\\(U/t=8\\)）对 5 个随机初态、二阶 Trotter 公式，给出态矢量误差 \\(\\|\\psi_{\\text{Trotter}}-\\psi_{\\text{exact}}\\|_2\\) 随两比特门数（\\(10^2\\)–\\(10^6\\)）与总时间 \\(t=0.1\\)–\\(0.5\\) 的变化，这是 64 比特规模上的直接误差测度；该 32 轨道算例在 1/8 填充需 19.3 GiB 内存，而同轨道数在 1/2 填充下需约 5 EiB。作者还用 Krylov 量子对角化（KQD）演示了时间步长选择对能量误差的影响，以及用 Trotter 化时间演化替代精确演化时的误差曲线。","contribution":"把「利用粒子数与自旋守恒做费米子线路模拟」从可行性实现推进到可复用的标准工具：给出每个费米子门的精确复杂度与内存表，使 \\(N\\)、填充率与内存的取舍可以事先算清；用 Rust 内核加函数式接口在常数因子上超过 FQE（部分任务快一个数量级）；并把量子化学（PySCF 分子哈密顿量）、硬件工作流（Qiskit 线路、采样型算法）与数值方法（Trotter 误差、KQD）三侧接口打通。对领域而言，它同时提供了一个诚实的天花板刻度：64 比特、8 电子的 Hubbard 模型已经是当前通用硬件演示的量级，而经典侧在这个点上仍可精确对照。","limitation":"对称性只降低常数，不改变指数标度：1/2 填充固定时 \\(D\\sim 2\\cdot 4^N/(\\pi N)\\)，相对全希尔伯特空间只省一个 \\(\\propto N\\) 的因子，低填充率下增长慢一些但仍是指数；固定粒子数而让 \\(N\\) 增长才得到多项式 \\(D=O(N^{N_\\alpha+N_\\beta})\\)，阶数一大仍不可行。态矢量被限制在单一 \\((N,N_\\alpha)\\) 扇区内，改变粒子数或自旋翻转的相互作用无法直接模拟（如某些耗散或掺杂过程）。Qiskit 接口要求线路保持汉明重量且只在末尾测量，中间测量与经典控制不支持；Slater 行列式的紧凑例程只覆盖该类特殊态，相互作用线路产生的关联态仍要完整存态矢量。性能对比只在两个具体型号的机器、单库单版本（ffsim 0.0.79、FQE 0.3.0）上完成，没有跨节点分布式结果；复杂度分析针对稠密轨道旋转，结构化（如局域）哈密顿量可用的更快算法未系统讨论。","key_numbers":["态矢量维度 \\(D=\\binom{N}{N_\\alpha}\\binom{N}{N_\\beta}\\)，单态矢量占 \\(16D\\) 字节","16 轨道 1/2 填充（32 比特）：通用模拟器需 64 GiB，ffsim 2.5 GiB；1/4 填充 51 MiB","单线程加速：二次哈密顿量演化 2.4×、对角库仑演化 1.2×、分子哈密顿量作用 8.4×；多线程 4.8× / 7.5×；双因子化 Trotter 最高 18×","Slater 行列式采样比 DPPy 快 3.5×，正规序化比 OpenFermion 快 20×","4×8 二维 Hubbard（64 比特、1/8 填充、\\(U/t=8\\)）：19.3 GiB；同轨道数 1/2 填充约需 5 EiB","复杂度：对角库仑演化 \\(O(ND)\\)，稠密轨道旋转 \\(O(N^3+N^2D)\\)，振幅更新 \\(O(D)\\) 且可原地并行"],"url":"https://quantum-journal.org/papers/q-2026-11-27-2287/","review":{"verdict":"小修","confidence":"高","correctness":"核心论断有两条，都站得住：一是「在固定粒子数与自旋 z 扇区内存储态矢量」这一表示的正确性——组态取 Slater 行列式、地址映射直接用 PySCF 的 FCI 编号，与 FCI 社区长期做法一致，作者也说明了为何不用组态态函数；二是各门的复杂度计数——对角库仑演化 \\(O(ND)\\)、稠密轨道旋转 \\(O(N^3+N^2D)\\) 的推导在正文中逐步给出，且与 FQE 的 LU 实现在同阶这一点被明确指出，没有把同阶算法说成更优标度。经验部分用两台机器、同一组公开基准（asv）与四个独立基线（FQE、Qiskit Aer、DPPy、OpenFermion）对照，并诚实指出加速来自实现与常数因子而非渐近改进，这类自我限制在软件类论文里并不常见。加速比只给中位数与四分位距，没有给统计检验，但对工程论文是可接受的证据强度。","weaknesses":"· 复杂度分析只覆盖稠密矩阵情形，对结构化哈密顿量（局域哈密顿量、张量网络可压缩的系数）没有讨论更快的算法，读者可能误以为 \\(O(N^2D)\\) 是唯一选择；\n· 基准只在一台 Apple M1 Max 与一台 Ryzen 7 Pro 4750U 上做，线程数、编译选项（-C target-cpu=native）对结论影响很大，缺少 GPU 与多节点结果；\n· 与 FQE 的比较中各库都用自己的最优实现，但 ffsim 用了 Rust 内核而 FQE 是纯 Python/Cython，加速比里混入了语言层面的差异，作者只用一句话承认，未做分解实验；\n· 「64 比特 Hubbard」这一演示算例的 19.3 GiB 只统计态矢量本身，未含地址映射、临时数组与预计算相位表，实际峰值内存会更高，正文只在第 8 节一句带过；\n· 缺少与其他对称性利用方案（如固定 \\(S^2\\) 的组态态函数基、张量网络方法）在同一算例上的对照，也没有精度-内存的完整权衡曲线；\n· Slater 行列式采样与正规序化的 3.5×/20× 只在单个问题规模区间测得（轨道数到 1600、项数到 10^5），未说明小规模下是否仍然占优。","overclaim":"标题里的 faster 是相对同类库的常数倍加速，摘要中 dramatic reduction 相对的是不使用对称性的通用模拟器，读者容易把两者混成「解决了指数墙」；作者在 Limitations 里写得很清楚（只省一个 \\(\\propto N\\) 的因子），但摘要与引言没有同样强度的提醒，建议在摘要末句前加一句指数标度不变的限定。此外「64-qubit Hubbard model」的说法容易被读成通用量子计算机上的 64 比特模拟，实际上它是 32 轨道、8 电子（4 上 4 下）的固定扇区，比特数是 Jordan-Wigner 映射后的计数。","citations":"应并列 FQE（Rubin 等）、Qiskit Aer、PySCF 的 FCI 模块、DPPy、OpenFermion；拟设与 Trotter 一侧需引 LUCJ/UCCSD 的近期工作与双因子化的 Trotter 误差界（含利用粒子数守恒的嵌套对易子界与一维/二维 Hubbard 的高阶界）；KQD 应用需引 Klymko 等的 Krylov 量子对角化与近期硬件演示；对称性利用的历史应追溯到固定 \\(S_z\\) 的 FCI 实现与图形化方法（graphical unitary group approach）。","questions":"① 把 \\(N\\) 从 16 增到 24、32 时，实测墙钟时间是否仍贴合 \\(O(N^2D)\\)，还是逐渐被地址映射与缓存缺失主导？\n② 在 \\(S^2\\) 守恒的组态态函数基上再做一层收缩，能否在相同内存下多算 2–4 个轨道，代价是多少？\n③ 与 FQE 的加速比中，语言与并行实现各占多少？把 FQE 换成同等编译优化后加速比还剩多少？\n④ 64 比特 Hubbard 演示算例的实际峰值内存（含缓存与临时数组）是多少，19.3 GiB 与实测差几倍？\n⑤ 对含中间测量与经典控制的线路（如采样型算法的自适应版本），Qiskit 接口的限制是否可以通过分扇区重映射绕过？","basis":"全文（读的是 Quantum 出版版 PDF 全文，含第 3 节态矢量表示与门应用、第 6 节与 FQE/Aer 的基准、第 7 节三个应用算例、第 8 节 Limitations，以及图表中的计时数据；另用 arXiv 2605.03123v2 的文本层交叉核对了摘要与关键数字，两版一致）"}},{"id":"nature-10.1038/s41534-026-01420-x","no":2,"topics":["测控与噪声","算法"],"source":"Nature 系列","venue":"npj Quantum Information","published":"2026-11-27","title":"Universal sequential quantum hypothesis testing","title_zh":"通用序列化量子假设检验","authors":["Matteo Zecchin","Osvaldo Simeone","Aaditya Ramdas"],"abstract":"Quantum hypothesis testing (QHT) concerns the statistical inference of unknown quantum states. In the general setting of composite hypotheses, the goal of QHT is to determine whether an unknown quantum state belongs to one or another of two classes of states based on the measurement of a number of copies of the state. Prior art on QHT with composite hypotheses focused on a fixed-copy two-step protocol, with state estimation followed by an optimized joint measurement. However, this fixed-copy approach may be inefficient, using the same number of copies irrespective of the inherent difficulty of the testing task. To address these limitations, we introduce the quantum sequential universal test (QSUT), a novel framework for sequential QHT in the general case of composite hypotheses. QSUT builds on universal inference, and it alternates between adaptive local measurements aimed at exploring the hypothesis space and joint measurements optimized for maximal discrimination. QSUT is proven to rigorously control the type-I error. We present two practical instantiations of QSUT, one based on the Holevo-Helstrom test and one leveraging shallow variational quantum circuits. Empirical results across a range of composite QHT tasks demonstrate that QSUT consistently reduces copy complexity relative to state-of-the-art fixed-copy strategies.","abstract_zh":"量子假设检验（QHT）研究的是未知量子态的统计推断。在复合假设的一般情形下，QHT 的目标是依据对未知态若干副本的测量，判断它属于两类态中的哪一类。此前的复合假设 QHT 工作集中在固定副本数的两步协议上：先做态估计，再做优化的联合测量。但这种固定副本方案可能低效——无论检验任务本身多难，都消耗同样多的副本。为克服这些限制，我们提出量子序列化通用检验（QSUT），一个面向复合假设一般情形的序列化 QHT 框架。QSUT 建立在通用推断（universal inference）之上，在用于探索假设空间的自适应局域测量与用于最大区分度的联合测量之间交替。我们证明 QSUT 严格控制第一类错误。我们给出 QSUT 的两种实用实例，一种基于 Holevo-Helstrom 检验，一种借助浅层变分量子线路。在一系列复合 QHT 任务上的实验结果表明，相对于当前最优的固定副本策略，QSUT 能一致地降低副本复杂度。","importance":3,"importance_reason":"态区分与假设检验是读出、层析、基准测试与纠缠验证的共同数学内核，而现有量子检验理论几乎都停在「固定副本数」的两步协议上：先估计再联合测量，任务难度与消耗脱钩。这篇把经典统计里成熟的 e-value / e-process 与通用推断搬到量子复合假设上，用拆分似然比构造出对任意测量策略都成立的 anytime-valid 检验，第一类错误在可选停止下仍被 \\(\\epsilon_0\\) 控制——这正好补上场效应实验里「边测边判、测到显著就停」的做法所缺的理论依据。数值上把平均副本数从百量级压到几十，并且明确给出浅层变分线路这种近期可执行的测量策略，属于方法上可迁移、工程上可落地的一类工作。","summary":"把通用推断的 e-process 搬到量子复合假设：拆分似然比 \\(\\Lambda_t\\) 由估计出的零/备择态 MLE 逐轮更新，对任意测量策略都保证第一类错误不超 \\(\\epsilon_0\\)（可选停止下也成立）；两种实例 aLHT（信息完备测量 + 对 \\(n_H\\) 个副本的 Helstrom-Holevo 联合测量）与 aLVT（浅层变分线路），单比特任务上平均副本数低于 40，固定副本基线约 100。","problem":"复合假设下的量子检验要判定未知态 \\(\\rho\\) 落在 \\(\\mathcal{S}_0\\) 还是 \\(\\mathcal{S}_1\\)，两个集合都含无穷多个态，最优联合测量依赖于未知的 \\(\\rho\\) 本身。已有做法是固定副本数 \\(n\\) 的两步协议：先用一部分副本做态估计，再按估计结果设计最优联合测量（Helstrom-Holevo 或学习型检验）。问题有三：其一，副本数被事先钉死，容易的任务也要付出同样代价；其二，固定 \\(n\\) 的最优性结论不能直接用于「测到显著就停」的自适应实验，可选停止会破坏大多数检验的第一类错误控制；其三，已有的学习型检验只处理简单零假设 \\(\\rho=\\rho_0\\) 或有限个备择态，缺少对两个复合集合都成立的通用框架。作者要给出的是一个既对任意测量策略都保持有效（anytime-valid）、又能把测得的证据累积到停止的序列化检验。","method":"核心量是拆分似然比（split likelihood ratio）\\(\\Lambda_t^{\\text{QSUT}}\\)：第 \\(t\\) 轮已在第 \\(i\\) 步测得 POVM 元 \\(M_{X^i}\\)，对备择假设用截至 \\(i-1\\) 的数据拟合的 MLE \\(\\hat\\rho^{i-1}\\)，对零假设用截至 \\(t\\) 的全部数据拟合的 MLE \\(\\hat\\rho_0^{t}\\)，\\(\\Lambda_t=\\prod_{i=1}^{t}\\mathrm{Tr}[(\\hat\\rho^{i-1})^{\\otimes n}M_{X^i}]\\big/\\mathrm{Tr}[(\\hat\\rho_0^{t})^{\\otimes n}M_{X^i}]\\)。由于分子不含当前轮之后的信息、分母始终用全样本 MLE，\\(\\Lambda_t\\) 在零假设下是 e-process（期望不超过 1，任意停时亦然），于是「\\(\\Lambda_t\\) 超过 \\(1/\\epsilon_0\\) 就拒绝」由 Ville 不等式直接给出第一类错误 \\(\\le\\epsilon_0\\)，且对任何测量策略序列 \\(\\{\\mu_t\\}\\) 成立（定理 4.1，另有双侧版本定理 4.2）。在此框架下作者给出两种测量策略：aLHT 采用分块结构，每块 \\(k\\) 轮做信息完备测量（MIC）以估计 \\(\\hat\\rho_0,\\hat\\rho_1\\)，块末对 \\(n_H\\) 个副本施加由这两个 MLE 构造的 Helstrom-Holevo 双结果 POVM，其中带一个敏感度参数 \\(\\lambda\\)（网格搜索或自适应更新，后者称 aLHT+）；aLVT 把块末的联合测量换成浅层变分线路，用参数化线路的测量结果直接给出观测量，避免对多副本做完整 POVM。实验在单比特态上做：\\(\\omega=90^\\circ\\) 的旋转族构造复合零/备择集，目标第一类错误 \\(\\epsilon_0=0.05\\)，每点 200 次独立运行，与固定副本的 bLVT/LVT 等基线比较平均副本数与检验功效。","result":"在单比特复合检验任务上，aLVT 以接近 1 的检出概率把平均副本数压到 40 以下，而固定副本基线 bLVT 平均需要约 100 个副本；固定副本的 LVT 在同样预算下功效只有约 0.15，序列化之后功效被拉满到接近 1。作者还给出一个经验规律：当任务所需平均副本复杂度超过约 20 时，序列化策略相对固定副本策略开始占优（任务越难，节省越明显），而任务极容易时两者差距缩小。第一类错误在所有任务上都落在 \\(\\epsilon_0=0.05\\) 以下，与定理 4.1 的 anytime-valid 保证一致；aLHT 与 aLHT+ 在 Helstrom-Holevo 测量一侧给出比 MIC 单独使用更高的单轮信息增益，自适应调整 \\(\\lambda\\) 的 aLHT+ 略优于固定 \\(\\lambda\\) 的 aLHT。","contribution":"把 e-value/e-process 这套 anytime-valid 推断引入量子复合假设检验，给出一个对测量策略无假设、在可选停止下仍严格控制第一类错误的通用框架，从而把「固定副本两步协议」的范式换成「边测边估计边判、显著即停」；同时给出两条可执行路径：一条基于多副本 Helstrom-Holevo 联合测量（理论效率高，但需要 \\(n_H\\) 个副本的联合 POVM），一条基于浅层变分线路（对近期硬件友好）。副产物是一族基于拆分似然比的量子检验统计量，可以直接套到态区分、纠缠检测与器件基准测试的序贯实验设计上。","limitation":"所有数值实验都在单比特、理想（无噪声、态完全由参数化族给出）的情形下完成，没有多比特、没有退相干与读出错误、也没有真实器件数据；aLHT 依赖 MLE 的质量，样本少时 MLE 可能落到边界或秩亏（尤其零假设集合是低维流形时），作者只用了 200 次重复的经验结果，未给有限样本下的收敛率；Helstrom-Holevo 联合测量要在 \\(n_H\\) 个副本上做投影，\\(n_H=4\\) 在硬件上已不轻，实际可扩展性未讨论；检验的对立假设集合需要是参数化、可优化的，完全非参数的两个复合集合没有被覆盖；停止规则 \\(\\Lambda_t>1/\\epsilon_0\\) 在 \\(\\epsilon_0=0.05\\) 时阈值是 20，对极难任务可能偏保守，缺少对期望样本量的下界分析；最优测量策略的选择只用网格搜索与浅层变分线路两种启发式，没有理论最优性；两样本（two-sample）情形留作未来工作。","key_numbers":["第一类错误控制在 \\(\\epsilon_0=0.05\\)，阈值 \\(\\Lambda_t>1/\\epsilon_0=20\\)","aLVT 平均副本数 <40，固定副本基线 bLVT 约 100，固定副本 LVT 功效仅约 0.15","序列化在平均副本复杂度 >20 时开始优于固定副本策略","aLHT 分块参数：每块 \\(k=10\\) 轮 MIC + 块末 \\(n_H=4\\) 个副本的 Helstrom-Holevo POVM","数值实验：单比特、旋转角 \\(\\omega=90^\\circ\\)、每点 200 次独立运行"],"url":"https://doi.org/10.1038/s41534-026-01420-x","review":{"verdict":"小修","confidence":"中","correctness":"理论部分的可信度高于实验部分。定理 4.1 的论证路线是标准的通用推断：分子用「过去数据的 MLE」、分母用「全部数据的 MLE」，因此 \\(\\Lambda_t\\) 在零假设下是 e-process，Ville 不等式给出对任意停时的第一类错误控制，这一推导不依赖测量策略，只要 POVM 元可计算即可，逻辑是闭合的。作者也点明了与固定副本学习型检验（LHT）的关系：把 \\(k\\) 轮 MIC 换成一次性估计即退化为已有方法，说明新框架是相容的推广而非另起炉灶。实验部分较弱：只有单比特、无噪声、参数化族构造的复合集合，200 次重复给的是经验均值，没有置信区间，也没有与「已知真实态时的最优 Helstrom 极限」对照，所以 <40 与约 100 的差距只能说明相对改进，不能说明离最优有多远。","weaknesses":"· 数值实验全部是单比特，多比特时 MLE 的样本复杂度与变分线路的可训练性都会显著恶化，论文没有给出任何规模外推的依据；\n· 没有噪声模型：真实器件的读出错误与退相干会同时抬高第一类与第二类错误，而 e-process 的有效性依赖测量算符的准确已知，这一点未讨论；\n· aLHT 需要 \\(n_H=4\\) 个副本上的联合 POVM，实验上实现难度大，作者没有给出用 SWAP 测试或经典阴影等替代方案的可行性与代价；\n· 缺少期望样本量的理论分析（下界或渐近式），只有「复杂度 >20 时占优」的经验观察；\n· 与 bLVT 的比较中两者的测量策略族不同，副本数的差距有多少来自序列化、多少来自变分线路的表达力，没有做消融；\n· 复合假设集合的构造依赖已知的旋转族，非参数或高维集合下的表现完全未知；停止阈值固定为 \\(1/\\epsilon_0\\)，未讨论更紧的 e-process（如 betting 型）是否能进一步降低样本量。","overclaim":"摘要的 universal 指的是「对任意测量策略与任意复合假设集合都有效」，而不是「普遍最优」；正文对此是清楚的，但 abstract 中 consistently reduces copy complexity 容易读成普适的性能优势，实际证据只有单比特、无噪声的几类任务。标题里 sequential 的代价（需要多轮交互、每轮都要更新 MLE 并重设测量）没有在摘要中出现，对实验读者而言这是重要的工程成本。","citations":"通用推断与 e-value 一侧需引 Wasserman、Ramdas 与 Grünwald 的 universal inference / e-process 工作；量子检验一侧需引 Helstrom、Holevo 的经典结果与 Audenaert 等的量子 Chernoff 界、以及 Bubeck 等与 Fujiki 等的学习型（learned）检验；序列化量子检验应引 Kikuchi 与 Hayashi 一系的序列化量子假设检验，以及近期量子 e-value / 序贯纠缠检测的工作；实验落地一侧应引经典阴影与 SWAP 测试文献。","questions":"① 多比特时 \\(\\Lambda_t\\) 的 MLE 需要多少副本才能稳定，样本复杂度是否随维数指数增长？\n② 若测量算符本身有校准误差（例如读出矩阵已知到 1%），第一类错误控制会退化到什么程度，能否用稳健 e-process 修补？\n③ 与 bettor/hedged e-process 相比，当前 \\(1/\\epsilon_0\\) 阈值策略在难任务上多消耗多少副本？\n④ aLVT 的浅层线路在真实器件噪声下，其测量结果还能否保证 \\(\\Lambda_t\\) 的 e-process 性质（需要 POVM 元精确）？\n⑤ 把停止规则改成对两类错误都设限（而非只控第一类），样本量会增加多少？","basis":"全文读的是 arXiv 预印本 2508.21594v1（含第 4 节 QSUT 定义与拆分似然比、定理 4.1/4.2 的陈述、aLHT 分块结构与 aLVT 的变分测量策略、以及第 5 节的单比特数值结果与图 3–5）；npj Quantum Information 的出版页只放出摘要，PDF 请求返回的是 HTML 页面，因此出版社定稿的排版、补充材料与图注未逐字核对，摘要以期刊页面文字为准，正文细节可能与 v1 有差异"}},{"id":"quantum-10.22331/q-2026-11-27-2288","no":3,"topics":["测控与噪声"],"source":"Quantum","venue":"Quantum","published":"2026-11-27","title":"Certification of quantum correlations at arbitrary distances through routed Bell tests","title_zh":"用路由 Bell 检验在任意距离上认证量子关联","authors":["Pavel Sekatski","Jef Pauwels","Edwin Peter Lobo","Stefano Pironio","Nicolas Brunner"],"abstract":"Transmission loss represents a major obstacle to the device-independent certification of quantum correlations over long distances, limiting applications such as device-independent quantum key distribution (DIQKD). In this work, we investigate the recently proposed concept of routed Bell experiments, in which a particle sent to one side can be measured either near or far from the source. We prove that routed Bell tests involving only entangled qubits can certify quantum correlations even in the presence of arbitrary loss on the channel to the distant device. This is achieved by adapting concepts from self-testing and quantum steering to the routed Bell test framework. Finally, as a natural extension of our approach, we outline a DIQKD protocol that, in principle, is secure over arbitrary distances. Talk at QCrypt2025 based on this manuscript.","abstract_zh":"传输损耗是远距离设备无关地认证量子关联的主要障碍，限制了设备无关量子密钥分发（DIQKD）等应用。本文研究近期提出的路由 Bell 实验概念：被送到一侧的粒子既可以在离源近处测量，也可以在远处测量。我们证明，只使用纠缠比特的路由 Bell 检验，即使在通往远端设备的信道上存在任意损耗，也能认证量子关联。这通过把自检验（self-testing）与量子导引（steering）的概念移植到路由 Bell 检验框架而实现。最后，作为方法的自然延伸，我们给出一个原则上在任意距离上都安全的 DIQKD 协议要点。本文基于该手稿在 QCrypt2025 的报告。","importance":3,"importance_reason":"长距离设备无关认证的瓶颈是损耗：标准 Bell 检验要求探测效率超过约 \\(2/3\\) 才能排除局域模型，光纤损耗让这条路在几十公里以上基本走不通。路由 Bell 检验把「近端先测、远端再测」拆开，用近端 CHSH 违背对源的态与 Alice 的测量做部分自检验，把远端问题化成一个只有 \\(B_L\\) 不可信的导引检验，从而把损耗从判据里彻底移除——这是对「效率漏洞」的结构性处理，而不是把阈值往前挪一点。文中给出的路由不等式、显式的 SRQ（短程量子）上界与线性化版本可以直接拿去做有限统计分析与 p 值计算，对做长距离纠缠分发、自由空间链路与 DIQKD 实验设计的组来说是可直接使用的方法论；对容错/测控一侧的意义在于，它把「测量设备可信度分层」这件事写成了可操作的认证协议。","summary":"路由 Bell 检验中远端粒子可由开关送到近端站 \\(B_S\\) 或远端站 \\(B_L\\)：近端 CHSH 违背 \\(S\\) 部分自检验 Alice 的测量，远端问题随即化为只有 \\(B_L\\) 不可信的导引检验，由此得到的路由不等式在 \\(B_L\\) 的任意损耗下仍可违背，从而认证远端量子关联；作者还给出 \\(\\eta>1/n\\) 即在任意低透过率下可出密钥的 DIQKD 协议要点。","problem":"设备无关认证要求观测到 Bell 违背，而 Bell 违背的前提是两路粒子都被有效探测：在标准（无路由）方案里，若远端信道透过率为 \\(\\eta\\)，违背量随 \\(\\eta\\) 线性衰减到零，于是任何非零损耗都会把可认证距离钉死在几十公里内，这也是 DIQKD 长期停留在原理演示的原因。已有绕过办法（事件就绪探测、heralded 方案、量子中继）都需要额外的多光子探测、存储器或复杂 heralding，工程代价高。路由 Bell 实验提供了另一条路：让远端粒子先被路由到近端测一次、再被送到远端测一次，用近端这次检验去约束源的态与近端测量，从而放松对远端探测效率的要求。问题在于，这样的「混合量子-经典」模型（近端可以是量子的、远端只收到经典信息，即 SRQ 关联）能否被一条只依赖可观测量（近端 CHSH 值 \\(S\\)、远端非对称 Bell 值 \\(W_n\\)、远端点击率 \\(T_n\\)）的不等式排除，以及这条不等式是否对任意小的 \\(T_n\\) 都仍然给出可观测的违背。","method":"场景定义：源发出 \\(\\rho_{AB}\\)，\\(A\\) 给近端 Alice（输入 \\(x\\)、二结果），\\(B\\) 经开关按 \\(r\\in\\{S,L\\}\\) 送到近端站 \\(B_S\\)（输入 \\(y\\)、二结果）或远端站 \\(B_L\\)（输入 \\(y\\)、三结果 \\(b\\in\\{0,1,\\varnothing\\}\\)，\\(\\varnothing\\) 记为无点击），\\(B_L\\) 的输入取 \\(n\\) 个「角度」\\(\\theta_y=y\\pi/n\\)，连续输入是其 \\(n\\to\\infty\\) 极限。可观测量取三个：近端 CHSH 值 \\(S=\\sum_{x,y=0,1}(-1)^{xy}\\langle A_xB_y^S\\rangle\\)；远端非对称 Bell 值 \\(W_n=\\frac1n\\sum_{y=0}^{n-1}\\left(\\cos\\theta_y\\langle A_0B_y^L\\rangle+\\sin\\theta_y\\langle A_1B_y^L\\rangle\\right)\\)；以及远端平均点击率 \\(T_n=\\frac1n\\sum_{y=0}^{n-1}\\sum_{b=0,1}p(b|y,r=L)\\)。SRQ 关联定义为：\\(r=S\\) 时是量子的两类关联，\\(r=L\\) 时可以写成 \\(p(a,b|x,y,L)=\\sum_\\lambda p(b|y,\\lambda)\\,\\mathrm{tr}[\\rho_{AB}\\,A_{a|x}\\otimes E_\\lambda]\\)，即远端只拿到经典变量 \\(\\lambda\\)。证明分两步：第一步，近端 CHSH 违背给 Alice 的测量提供部分自检验——\\(S=2\\sqrt2\\) 时 \\(A_x\\) 被自检验为两个反交换的 Pauli 测量，一般 \\(S\\) 时通过 Jordan 引理把 \\(A_x\\) 与 \\(\\rho_{AB}\\) 分解成比特块 \\(A_x=\\bigoplus_i A_x^{\\alpha_i}\\)，得到一组只依赖角度 \\(\\alpha\\) 的导引不等式；第二步，把这些导引不等式在 \\(B_L\\) 不可信的假设下组合，得到路由不等式：对 \\(S\\ge 2\\)、\\(T_n>0\\)，SRQ 关联满足 \\(W_n\\) 不超过「局域界」乘上一个只由 \\(S\\) 决定的因子 \\(\\gamma(S)\\)，\\(\\gamma(2)=1\\)、\\(\\gamma(2\\sqrt2)=\\sqrt2/2\\approx0.71\\)，即近端违背越强、对远端「经典模拟」的限制越紧。作者还证明该界在 \\(n\\to\\infty\\) 时是紧的，并给出线性化形式 \\(W_n+\\mu T_n+\\nu S\\le\\xi\\) 以便做有限统计分析与 p 值计算。最后把近端换成 \\(n\\) 输入的 chained Bell 检验（\\(I_n=\\sum_{y=0}^{n-1}(A_y+A_{y+1})B_y^S\\)，对 \\(|\\Phi^+\\rangle\\) 取到 \\(2n\\cos(\\pi/2n)\\) 的最大违背），用已知自检验结果把源与 Alice 的测量钉成理想形式，远端就退化为「制备-测量」的 RDI-QKD 场景，从而给出可容忍任意损耗的 DIQKD 协议。","result":"主要结论：只使用两比特纠缠源、不需要复杂 heralding，路由 Bell 检验可以在远端信道任意损耗（\\(T_n\\to0\\)）下仍然认证长程量子（LRQ）关联，判据是 \\(W_n\\) 超过 \\(\\gamma(S)\\) 缩放后的 SRQ 上界；由于 \\(\\gamma(S)<1\\) 只要近端 CHSH 违背足够强，允许的 \\(W_n\\) 区间在 \\(T_n\\) 很小时仍非空。局域参考界（忽略近端检验）为 \\(W_n\\le\\sqrt2\\sin(\\tfrac{\\pi}{2}T_n)/[n\\sin(\\tfrac{\\pi}{2n})]\\)，路由版本在此基础上把上限乘上 \\(\\gamma(S)\\in[\\sqrt2/2,1]\\)，因此近端违背既是「必要条件」也是「收紧工具」；\\(n\\to\\infty\\)（连续角度）时该界变紧，说明解析界本身已接近最优。DIQKD 一侧：用 chained Bell 检验做近端自检验后，远端退化为 \\(n\\) 个输入的 RDI-QKD，只要透过率 \\(\\eta>1/n\\) 就能提取正密钥率，于是把 \\(n\\) 取足够大即可在任意低透过率下得到非零密钥率。作者明确这是 on-principle 结果：安全性只在理想情形（chained Bell 不等式被完美违背、器件无瑕疵）下证明。","contribution":"给出第一个「仅用纠缠比特」就能在 \\(T_n\\to0\\) 的任意传输损耗下认证远端量子关联的构造，把问题从「提高探测效率阈值」转成「用近端检验换取远端假设的放松」；技术上贡献了两件可复用的工具：一族紧的比特导引不等式（以 Alice 测量角度 \\(\\alpha\\) 为参数、以 \\(s^\\alpha=2(\\cos\\alpha+\\sin\\alpha)\\) 标定，补足了 Skrzypczyk–Cavalcanti 那一类损耗容忍不等式未覆盖的角度区间），以及一条把任意导引不等式「提升」为路由 Bell 不等式的通用配方（附录 D）。应用上，它把 RDI-QKD 与路由 Bell 检验接起来，给出一个全光子、无需事件就绪探测的长距离 DIQKD 蓝图，并明确列出从它到实用安全证明还差什么。","limitation":"全部结论都是渐近、理想化的：DIQKD 只在 chained Bell 不等式被完美违背、器件无噪声无瑕疵时证明正密钥率，没有有限码长分析、没有对近端检验自身损耗与噪声的鲁棒性处理，也没有给出具体的密钥率数值；路由不等式是针对「近端测量被部分自检验」这一特定结构推导的，若近端检验有损或失败，因子 \\(\\gamma(S)\\) 的收紧作用会被削弱，文中未量化。形式上要求 \\(B_L\\) 的输出包含无点击结果 \\(\\varnothing\\)，即把损耗显式建模为第三种结果，这在实际探测器上对应的是「无点击」而非「暗计数」，暗计数与探测器死时间未讨论；结论限于两比特纠缠与比特测量（Jordan 引理），高维或连续变量版本没有给出；任意损耗的代价是要 \\(n\\) 足够大（DIQKD 需 \\(\\eta>1/n\\)），而 \\(n\\) 增大意味着更多测量设置与更长的统计采集，本文没有给出所需样本量的估计；另外路由开关本身被当作不可信器件，但实际实验中开关的损耗与串扰会同时影响 \\(S\\) 与 \\(T_n\\)，未建模。","key_numbers":["近端 CHSH 值 \\(S\\in[2,2\\sqrt2]\\)，相应因子 \\(\\gamma(S)\\) 从 1 降到 \\(\\sqrt2/2\\approx0.71\\)","\\(B_L\\) 输入 \\(n\\) 个角度 \\(\\theta_y=y\\pi/n\\)，三结果（含无点击 \\(\\varnothing\\)）；\\(n\\to\\infty\\) 为连续输入，界在此极限下紧","局域参考界 \\(W_n\\le\\sqrt2\\sin(\\tfrac{\\pi}{2}T_n)/[n\\sin(\\tfrac{\\pi}{2n})]\\)；路由版本乘 \\(\\gamma(S)\\)","chained Bell 最大违背 \\(I_n=2n\\cos(\\pi/(2n))\\)（对 \\(|\\Phi^+\\rangle\\)）","DIQKD：透过率 \\(\\eta>1/n\\) 即可提密钥，\\(n\\) 取足够大 → 任意低透过率下非零密钥率","线性化判据 \\(W_n+\\mu T_n+\\nu S\\le\\xi\\)，可直接用于有限统计与 p 值计算"],"url":"https://quantum-journal.org/papers/q-2026-11-27-2288/","review":{"verdict":"小修","confidence":"中","correctness":"论证骨架是清晰的、可检验的：近端 CHSH 违背 → Alice 测量的部分自检验（\\(S=2\\sqrt2\\) 时精确到 Pauli，一般 \\(S\\) 时用 Jordan 引理分解成比特块）→ 远端问题变成 \\(B_L\\) 不可信的导引检验 → 组合得到 SRQ 上界。每一步都有对应的引理，且作者把界在 \\(n\\to\\infty\\) 时的紧性单独证明，这说明界不是靠松弛堆出来的。把 \\(B_L\\) 的三结果（含无点击）显式纳入统计量 \\(T_n\\) 也是处理损耗的正确做法，避免了把损耗当成「无结果」而从样本中丢弃这类常见错误。较弱的地方在于结论的适用范围：任意损耗成立的前提是 \\(n\\) 可以取任意大、且近端检验完美；这两条在实际实验中互相拉扯，文中没有给出定量的折中，所以「任意距离」是渐近陈述而非工程保证。DIQKD 部分只到理想情形，作者自己把它标成 proof-of-principle，评审计较合理。","weaknesses":"· 路由不等式的推导依赖近端测量的角度参数化与 Jordan 块的分解，块数可以任意大，但自检验误差随 \\(S\\) 偏离 \\(2\\sqrt2\\) 如何传播到 \\(\\gamma(S)\\) 的收紧量没有误差界；\n· 任意损耗要求 \\(n\\to\\infty\\)，而 \\(n\\) 增大同时要求近端做 \\(n\\) 个输入的 chained Bell 检验（或至少 \\(n\\) 个远端设置），样本量与设置数目的联合优化完全没讨论；\n· DIQKD 只在完美违背、无噪声下证明正密钥率，没有密钥率表达式、没有有限码长、没有对近端损耗的处理，距离实用安全证明还很远；\n· 暗计数、探测器死时间、路由开关的插损与串扰都未建模，而实际长距离实验中这些恰恰是主要误差源；\n· 只处理两比特与比特测量，高维情形（用 Jordan 引理之外的分解）没有讨论，而高维往往能提升损耗容忍度；\n· 与已有的损耗容忍导引不等式、事件就绪 DIQKD、heralded 方案的定量比较缺失，读者难以判断工程代价孰优。","overclaim":"arbitrary distances / arbitrary loss 在数学上是对 \\(T_n>0\\) 任意小成立，但前提是把 \\(n\\) 与近端检验的理想性一起放大，等价于「用测量设置数换损耗容忍」；标题与摘要没有把这个交换关系写出来，容易被读成工程上可以无限拉长链路。DIQKD「in principle secure over arbitrary distances」的措辞也有同样问题：文中实际证明的只是渐近正密钥率，作者在结论里承认需要完整的实用安全性证明，但摘要层面的表述可以更收敛。","citations":"路由 Bell 实验本身应引其提出者（Chaves 一系与 Zapatero 等的近期工作）；设备无关认证与损耗阈值应引 Pearle、Eberhard 的效率判据与 Garg–Mermin；自检验应引 Mayers–Yao、Šupić–Bowler 的综述与 chained Bell 的自检验结果；导引与 LHS 模型应引 Wiseman–Jones–Doherty、Skrzypczyk–Cavalcanti 的损耗容忍导引不等式、以及 Cavalcanti–Jones–Wiseman–Reid 的综述；DIQKD 应引 Acín 等的原始安全性分析、事件就绪方案（Zapatero 等）与 RDI-QKD（其引用的 Ref. 37/38）；Jordan 引理的标准引用也已给出。","questions":"① 当 \\(S\\) 只有 \\(2.4\\)（而非 \\(2\\sqrt2\\)），\\(\\gamma(S)\\) 的收紧还剩多少，能容忍的最小 \\(T_n\\) 是多少？\n② 在固定的总测量次数预算下，\\(n\\) 取多大最优（设置数 vs 每设置样本数的折中）？\n③ 若近端检验本身有 \\(\\eta_S\\) 的损耗，\\(S\\) 的估计偏差如何传播到 SRQ 界的有效性？\n④ 暗计数率 \\(p_d\\) 给定时，链路长度上限随 \\(n\\) 如何变化？\n⑤ 高维（qudit）版本能否在更小的 \\(n\\) 下达到同样的损耗容忍？","basis":"全文（读的是 Quantum 出版版 PDF 全文，含第 2 节场景定义、第 3 节路由不等式与 \\(\\gamma(S)\\)、第 4 节证明思路、第 5 节 routed DIQKD 协议，以及附录 B 的导引不等式、附录 D 的路由不等式证明与紧性；arXiv 2502.12241v4 的文本层交叉核对过摘要与主要结论，两版一致）"}}]}</script>

          ${journalRows.map(r => {
            const color = GROUP_STYLE[r.label] || GROUP_STYLE[r.group] || "#303030";
            const st = r.status || "ok";
            const stLabel = st === "ok" ? "正常" : st === "partial" ? "部分" : "失败";
            const stCell = `<td><span class="st st-${st}">${stLabel}</span></td>`;
            if (r.kind === "group") {
              return `<tr class="group"><td>${esc(r.label)}</td>${stCell}<td class="num">${r.raw}</td><td class="num">${r.screened}</td><td class="num">${r.included}</td></tr>`;
            }
            return `<tr class="${r.kind === "journal" ? "sub" : "single"}"><td><span class="coverage-source"><span class="source-dot" style="--sc:${color}"></span>${esc(r.label)}</span></td>${stCell}<td class="num">${r.raw}</td><td class="num">${r.screened}</td><td class="num"><b>${r.included}</b></td></tr>`;
          }).join("")}
          <tr class="total"><td>合计（去重后）</td><td>—</td><td class="num">${totals.deduped}</td><td class="num">${totals.screened}</td><td class="num">${totals.included}</td></tr>
        </tbody>
      </table>
    </div>
  </details>`;

  // keyword bar
  const state = { topic: "all" };
  function countTopic(t) { return ARTICLES.filter(a => (a.topics || []).includes(t)).length; }
  function renderKeywordBar() {
    const items = [`<button class="kbtn kbtn-all" data-topic="all" aria-pressed="${state.topic === "all"}">全部<span class="c">${ARTICLES.length}</span></button>`];
    allTopics.forEach(t => {
      const [c, bg] = topicColor[t];
      items.push(`<button class="kbtn" data-topic="${esc(t)}" aria-pressed="${state.topic === t}" style="--tc:${c};--tbg:${bg}">${esc(t)}<span class="c">${countTopic(t)}</span></button>`);
    });
    $("#keywordBar").innerHTML = items.join("");
  }
  renderKeywordBar();

  function impColor(v) { return IMP_STYLE[v] || IMP_STYLE[1]; }
  function sourcePill(source) {
    const [c, bg] = SOURCE_STYLE[source] || ["#4b514c", "#f0f1f1"];
    return `<span class="source-pill" style="--sc:${c};--sbg:${bg}">${esc(source)}</span>`;
  }
  function topicChips(a) {
    return (a.topics || []).map(t => {
      const [c, bg] = topicColor[t] || ["#4b514c", "#f0f1f1"];
      return `<span class="topic" style="--tc:${c};--tbg:${bg}">${esc(t)}</span>`;
    }).join("");
  }


  function reviewPoints(text) {
    let t = String(text || "").trim();
    if (!t) return ["（未提供）"];
    let parts = t.split(/(?=（\d+）)|(?=\(\d+\)\s)/).map(s => s.trim()).filter(Boolean);
    if (parts.length === 1) {
      parts = t.split(/\n+/).map(s => s.trim()).filter(Boolean);
    }
    if (parts.length === 1 && /[；;]/.test(t) && t.length > 120) {
      parts = t.split(/[；;]/).map(s => s.trim()).filter(Boolean);
    }
    if (parts.length === 1) {
      const sentences = t.match(/[^。！？]+[。！？]?/g) || [t];
      if (sentences.length > 1) parts = sentences.map(s => s.trim()).filter(Boolean);
    }
    const expanded = [];
    for (const part of parts) {
      if (part.length > 420 && /[；;]/.test(part)) {
        expanded.push(...part.split(/[；;]/).map(s => s.trim()).filter(Boolean));
      } else {
        expanded.push(part);
      }
    }
    return expanded.map(s => s.replace(/^[（(]?\d+[）)]?\s*/, "").trim()).filter(Boolean);
  }
  function reviewList(text) {
    return `<ul>${reviewPoints(text).map(p => `<li>${esc(p)}</li>`).join("")}</ul>`;
  }
  function reviewHTML(a) {
    const r = a.review;
    if (!r) return "";
    return `<details class="review">
      <summary>AI 审稿</summary>
      <div class="review-body">
        <div class="review-block"><h3>核心主张是否成立</h3>${reviewList(r.correctness)}</div>
        <div class="review-block"><h3>主要缺陷</h3>${reviewList(r.weaknesses)}</div>
        <div class="review-block"><h3>是否夸大</h3>${reviewList(r.overclaim)}</div>
        <div class="review-block"><h3>需要核对的引用 / 实验</h3>${reviewList(r.citations)}</div>
        <div class="review-block"><h3>要作者回答的问题</h3>${reviewList(r.questions)}</div>
        <p class="review-meta">${esc(r.basis)} · AI 生成的批判性审稿，不是同行评审；结论以原文为准。</p>
      </div>
    </details>`;
  }

  function entryHTML(a) {
    const w = wf(a.id);
    const [ic, ib] = impColor(a.importance);
    const opts = Object.entries(STATUS_LABEL).map(([k, v]) => `<option value="${k}"${w.status === k ? " selected" : ""}>${v}</option>`).join("");
    return `<article class="entry" id="p-${String(a.no).padStart(2, "0")}" data-id="${esc(a.id)}" style="--imp:${ic};--imp-bg:${ib}">
      <aside class="rail">
        <div class="no">${String(a.no).padStart(2, "0")}</div>
        <span class="imp-badge" title="${esc(a.importance_reason || "")}" aria-label="重要性 ${a.importance} / 5，${IMP_LABEL[a.importance]}"><span>${a.importance}</span><span class="den">/5</span></span>
        <span class="imp-label">${esc(IMP_LABEL[a.importance] || "")}</span>
      </aside>
      <div class="entry-body">
        <div class="entry-meta">
          ${sourcePill(a.source)}<span class="sep">·</span><time datetime="${esc(dateOnly(a.published))}">${esc(dateOnly(a.published))}</time><span class="sep">·</span><span>${esc(a.venue || "")}</span>
        </div>
        <h2><a href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">${esc(a.title)}</a></h2>
        <p class="title-zh">${esc(a.title_zh)}</p>
        <p class="authors">${esc((a.authors || []).join(" · "))}</p>
        <div class="topics">${topicChips(a)}</div>
        <p class="imp-reason"><b>重要性 ${a.importance}/5 · ${esc(IMP_LABEL[a.importance] || "")}</b> · ${esc(a.importance_reason || "")}</p>
        <p class="summary"><b>结论</b>${esc(a.summary)}</p>
        <div class="analysis">
          <div><h3>问题</h3><p>${esc(a.problem)}</p></div>
          <div><h3>方法</h3><p>${esc(a.method)}</p></div>
          <div><h3>结果</h3><p>${esc(a.result)}</p></div>
          <div><h3>关键贡献</h3><p>${esc(a.contribution)}</p></div>
          <div class="wide"><h3>局限 / 待核验</h3><p>${esc(a.limitation)}</p></div>
        </div>
        <div class="keynums"><span class="label">关键数字</span>${(a.key_numbers || []).map(k => `<span class="kn">${esc(k)}</span>`).join("")}</div>
        <div class="entry-foot">
          <div class="entry-actions">
            <select class="status-select" data-status="${esc(a.id)}" aria-label="阅读状态">${opts}</select>
            <button class="textbtn" type="button" data-note-toggle="${esc(a.id)}">${w.note ? "编辑笔记" : "笔记"}</button>
            <a class="link" href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">原文 ↗</a>
            ${a.pdf_url ? `<a class="link" href="${esc(a.pdf_url)}" target="_blank" rel="noopener noreferrer">PDF</a>` : ""}
            ${a.doi ? `<a class="link" href="https://doi.org/${esc(a.doi)}" target="_blank" rel="noopener noreferrer">DOI</a>` : ""}
          </div>
        </div>
        <details class="abstract"><summary>摘要原文</summary>
          <div class="abstract-block"><div class="abstract-lang">English</div><p>${esc(a.abstract || "摘要待补。")}</p></div>
          ${a.abstract_zh ? `<div class="abstract-block"><div class="abstract-lang">中文翻译</div><p>${esc(a.abstract_zh)}</p></div>` : ""}
        </details>
        ${reviewHTML(a)}
        <div class="note-wrap" data-note-wrap="${esc(a.id)}"${w.note ? "" : " hidden"}>
          <textarea class="note-area" data-note="${esc(a.id)}" placeholder="记录：值得记下的方法、需要核对的数字、与你当前工作的连接…">${esc(w.note)}</textarea>
          <div class="note-meta"><span data-save-status="${esc(a.id)}">${w.note ? "已从本机恢复" : "自动保存在本机"}</span><button class="textbtn" type="button" data-export-one="${esc(a.id)}">导出此条</button></div>
        </div>
      </div>
    </article>`;
  }

  function renderTOC() {
    const list = ARTICLES.slice().sort((a, b) => a.no - b.no);
    $("#tocList").innerHTML = list.map(a => `<li><a href="#p-${String(a.no).padStart(2, "0")}" data-toc-link><span class="toc-no">${String(a.no).padStart(2, "0")}</span><span>${esc(a.title_zh || a.title)}</span></a></li>`).join("");
  }
  function closeTOC() {
    $("#tocPanel").hidden = true;
    $("#tocToggle").setAttribute("aria-expanded", "false");
  }

  function typesetMath() {
    if (!window.MathJax || !MathJax.typesetPromise) return;
    const run = () => MathJax.typesetPromise([$("#entries")]).catch(err => console.warn("MathJax:", err));
    if (MathJax.startup && MathJax.startup.promise) MathJax.startup.promise.then(run);
    else run();
  }

  function render() {
    const list = ARTICLES.filter(a => state.topic === "all" || (a.topics || []).includes(state.topic)).sort((a, b) => a.no - b.no);
    $("#entries").innerHTML = list.map(entryHTML).join("");
    $("#emptyState").innerHTML = ARTICLES.length
      ? `<b>这个关键词下暂无条目</b>点“全部”回到完整列表。`
      : `<b>本轮无新增论文</b>数据时间范围内没有新增条目。`;
    $("#emptyState").classList.toggle("show", list.length === 0);
    $("#listSummary").innerHTML = `显示 <b>${list.length}</b> / ${ARTICLES.length} 篇`;
    $$(".kbtn").forEach(b => b.setAttribute("aria-pressed", String(state.topic === b.dataset.topic)));
    typesetMath();
  }

  $("#keywordBar").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-topic]");
    if (!btn) return;
    state.topic = btn.dataset.topic;
    render();
  });

  $("#entries").addEventListener("click", (e) => {
    const toggle = e.target.closest("[data-note-toggle]");
    if (toggle) {
      const wrap = document.querySelector(`[data-note-wrap="${CSS.escape(toggle.dataset.noteToggle)}"]`);
      if (wrap) { wrap.hidden = !wrap.hidden; if (!wrap.hidden) wrap.querySelector("textarea")?.focus(); }
      return;
    }
    const one = e.target.closest("[data-export-one]");
    if (one) {
      const a = ARTICLES.find(x => x.id === one.dataset.exportOne);
      download(`note-${a.no}-${a.id}.json`, { article: { id: a.id, title: a.title, url: a.url }, workflow: wf(a.id) });
      toast("已导出此条");
    }
  });

  $("#entries").addEventListener("change", (e) => {
    const sel = e.target.closest("[data-status]");
    if (!sel) return;
    const w = wf(sel.dataset.status); w.status = sel.value; save();
    toast("状态已保存：" + STATUS_LABEL[w.status]);
  });
  let noteTimer;
  $("#entries").addEventListener("input", (e) => {
    const ta = e.target.closest("[data-note]");
    if (!ta) return;
    const w = wf(ta.dataset.note); w.note = ta.value;
    const label = document.querySelector(`[data-save-status="${CSS.escape(ta.dataset.note)}"]`);
    if (label) label.textContent = "正在保存…";
    clearTimeout(noteTimer);
    noteTimer = setTimeout(() => {
      save();
      if (label) label.textContent = "已保存 · " + new Date().toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });
    }, 300);
  });

  function download(filename, payload) {
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
  }
  $("#exportBtn").addEventListener("click", () => {
    download(`reading-notes-${META.issue_date || "digest"}.json`, {
      exported_at: new Date().toISOString(), issue: META.issue_date,
      articles: ARTICLES.map(a => ({ id: a.id, no: a.no, title: a.title, topics: a.topics, url: a.url, ...wf(a.id) }))
    });
    toast("已导出全部笔记与公式修改");
  });
  $("#printBtn").addEventListener("click", () => window.print());

  document.addEventListener("toggle", (e) => {
    if (e.target.matches && e.target.matches("details.abstract, details.review")) typesetMath();
  }, true);

  const TOC_POS_KEY = "qc-toc-pos-v1";
  const tocDesktop = window.matchMedia("(hover: hover) and (pointer: fine)");
  let tocDrag = null;
  let tocMoved = false;
  let suppressTocClick = false;
  function isDesktopToc() { return tocDesktop.matches; }
  function setTocPosition(left, top) {
    if (isDesktopToc()) return;
    const box = $("#toc");
    const maxLeft = Math.max(0, window.innerWidth - box.offsetWidth);
    const maxTop = Math.max(56, window.innerHeight - box.offsetHeight - 8);
    const x = Math.max(0, Math.min(maxLeft, Math.round(left)));
    const y = Math.max(56, Math.min(maxTop, Math.round(top)));
    box.style.left = x + "px";
    box.style.top = y + "px";
    box.style.bottom = "auto";
    box.classList.toggle("right", x > window.innerWidth / 2);
    return { left: x, top: y };
  }
  function saveTocPosition() {
    if (!isDesktopToc()) {
      const box = $("#toc");
      const r = box.getBoundingClientRect();
      try { localStorage.setItem(TOC_POS_KEY, JSON.stringify({ left: r.left, top: r.top })); } catch (e) {}
    }
  }
  function snapToc() {
    const box = $("#toc");
    const r = box.getBoundingClientRect();
    const left = (r.left + r.width / 2 < window.innerWidth / 2)
      ? 0
      : Math.max(0, window.innerWidth - r.width);
    const pos = setTocPosition(left, r.top);
    if (pos) { try { localStorage.setItem(TOC_POS_KEY, JSON.stringify(pos)); } catch (e) {} }
  }
  function restoreTocPosition() {
    if (isDesktopToc()) return;
    try {
      const raw = localStorage.getItem(TOC_POS_KEY);
      if (raw) {
        const p = JSON.parse(raw);
        if (typeof p.left === "number" && typeof p.top === "number") setTocPosition(p.left, p.top);
      }
    } catch (e) {}
  }
  function collapseDesktopToc() {
    const box = $("#toc");
    box.classList.add("collapsed");
    document.body.classList.remove("toc-open");
    $("#tocPanel").hidden = true;
    $("#tocToggle").setAttribute("aria-expanded", "false");
  }
  function openDesktopToc() {
    const box = $("#toc");
    box.classList.remove("collapsed");
    document.body.classList.add("toc-open");
    $("#tocPanel").hidden = false;
    $("#tocToggle").setAttribute("aria-expanded", "true");
  }
  function applyTocMode() {
    const box = $("#toc");
    if (isDesktopToc()) {
      box.style.left = "";
      box.style.top = "";
      box.style.bottom = "";
      $("#tocClose").textContent = "收起";
      openDesktopToc();
    } else {
      document.body.classList.remove("toc-open");
      box.classList.remove("collapsed");
      $("#tocClose").textContent = "×";
      closeTOC();
      restoreTocPosition();
    }
  }
  tocDesktop.addEventListener("change", applyTocMode);
  $("#tocToggle").addEventListener("pointerdown", (e) => {
    if (isDesktopToc()) return;
    const box = $("#toc");
    const r = box.getBoundingClientRect();
    tocDrag = { x: e.clientX, y: e.clientY, left: r.left, top: r.top };
    tocMoved = false;
    try { $("#tocToggle").setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  });
  $("#tocToggle").addEventListener("pointermove", (e) => {
    if (!tocDrag) return;
    const dx = e.clientX - tocDrag.x;
    const dy = e.clientY - tocDrag.y;
    if (Math.abs(dx) + Math.abs(dy) > 5) tocMoved = true;
    setTocPosition(tocDrag.left + dx, tocDrag.top + dy);
  });
  $("#tocToggle").addEventListener("pointerup", () => {
    if (!tocDrag) return;
    if (tocMoved) {
      suppressTocClick = true;
      snapToc();
      setTimeout(() => { suppressTocClick = false; }, 150);
    }
    tocDrag = null;
  });
  $("#tocToggle").addEventListener("click", () => {
    if (suppressTocClick) return;
    if (isDesktopToc()) {
      if ($("#toc").classList.contains("collapsed")) openDesktopToc();
      else collapseDesktopToc();
      return;
    }
    if ($("#tocPanel").hidden) {
      $("#tocPanel").hidden = false;
      $("#tocToggle").setAttribute("aria-expanded", "true");
    } else {
      closeTOC();
    }
  });
  $("#tocClose").addEventListener("click", () => {
    if (isDesktopToc()) collapseDesktopToc(); else closeTOC();
  });
  $("#tocPanel").addEventListener("click", (e) => {
    if (e.target.closest("[data-toc-link]") && !isDesktopToc()) closeTOC();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      if (isDesktopToc()) collapseDesktopToc(); else closeTOC();
    }
  });
  window.addEventListener("resize", () => {
    if (isDesktopToc()) return;
    const box = $("#toc");
    const r = box.getBoundingClientRect();
    setTocPosition(r.left, r.top);
  });
  applyTocMode();

  renderTOC();
  render();
})();
</script>
</body>
</html>
