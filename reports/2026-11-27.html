},{"group":"会议","label":"SODA","kind":"conference","raw":0,"screened":0,"included":0,"status":"ok"},{"group":"会议","label":"ICML","kind":"conference","raw":0,"screened":0,"included":0,"status":"ok"},{"group":"会议","label":"NeurIPS (NIPS)","kind":"conference","raw":0,"screened":0,"included":0,"status":"ok"},{"group":"会议","label":"WADS","kind":"conference","raw":0,"screened":0,"included":0,"status":"ok"},{"group":"Quantum","label":"Quantum","kind":"single","raw":0,"screened":0,"included":0,"status":"error"},{"group":"Science Advances","label":"Science Advances","kind":"single","raw":0,"screened":0,"included":0,"status":"error"},{"group":"SciPost Physics","label":"SciPost Physics","kind":"single","raw":4,"screened":1,"included":1,"status":"ok"},{"group":"AVS Quantum Science","label":"AVS Quantum Science","kind":"single","raw":0,"screened":0,"included":0,"status":"error"},{"group":"Quantum Science and Technology","label":"Quantum Science and Technology","kind":"single","raw":1,"screened":0,"included":0,"status":"ok"}],"coverage_totals":{"raw":280,"deduped":21,"screened":2,"included":6,"errors":["scienceadv","avs","quantum"]}},"articles":[{"id":"scipost-10.21468/scipostphys.21.5.134","no":1,"topics":["噪声与开放系统","张量网络仿真","测控与脉冲"],"source":"SciPost Physics","venue":"SciPost Physics","published":"2026-11-26","title":"Efficient construction of time-invariant process tensors for simulating high-dimensional non-Markovian open quantum systems","title_zh":"面向高维非马尔可夫开放量子系统的高效时间平移不变过程张量构造","authors":["Émile Cochin","Jonathan Keeling","Brendon W. Lovett","Alex W. Chin"],"importance":5,"importance_reason":"TTI-PT 构造的整体代价由 \\( \\mathcal{O}(d^8) \\) 降为 \\( \\mathcal{O}(d^4) \\)，内存同步降幂，使含 20 级谐振子与 Purcell 滤波谱的色散读出首次可完整模拟；物理结论直接可用：无滤波时驱动降低量子比特衰减率，深滤波下驱动反而增大耗散，Stark 移公式只能定性解释。做超导读出、Purcell 滤波器设计与非马尔可夫数值的读者应精读。","summary":"用中间压缩改造 iTEBD，把时间平移不变过程张量的构造代价从 \\( \\mathcal{O}(d^8) \\) 降到 \\( \\mathcal{O}(d^4) \\)，内存降为 \\( \\chi^2 d^2 \\)，首次完整模拟 20 级谐振子的电路 QED 色散读出，发现深 Purcell 滤波下加强驱动反而加快量子比特衰减。","problem":"开放量子系统的精确数值方法长期受两方面制约：系统维数 d 增大时张量代价迅速爆炸，模拟时长又与时间步数呈平方增长。过程张量把环境影响编码成作用在系统 Liouville 空间上的矩阵乘积算符，原则上给出非马尔可夫动力学的精确结果，并可复用于最优控制、多时间关联与稳态计算；但沿时间方向逐步收缩三角网络的传统构造方式，代价随步数平方增长。近期工作表明，对高斯环境与一般耦合算符可用 iTEBD 把过程张量收缩为只含一个时间无关张量的时间平移不变形式，时长依赖因此降为线性。代价随即转移到系统维数上：每步都要构造 \\( \\chi d^2 \\times \\chi d^2 \\) 的矩阵并做 SVD，时间约 \\( \\mathcal{O}(\\chi^3 d^6) \\)，整体随 d 呈八次方，内存需 \\( \\chi^2 d^4 \\)。结果 d 只能取到十几级，而色散读出的读数腔需要 20 级以上，Purcell 滤波又带来尖锐、非马尔可夫的谱密度，这类问题此前无法用过程张量处理。","method":"对 Feynman-Vernon 影响泛函做离散化：环境取高斯型，初态为系统与热浴的因子化乘积态，耦合算符在自身本征基下对角；由谱密度算出热浴关联函数，进而得到描述单个时间步交换的 b 张量，补齐刘维尔指标后形成三角张量网络。把该网络向无穷远展开并改写为平移不变的形式，用 iTEBD 从记忆深度 k̃ 起、以乘积态为初值反向收缩，最终收缩成单个重复张量，即时间平移不变过程张量；时间步用二阶 Trotter 分解，全局误差为时间步长的平方。增强方案的要点是三步中间压缩。第一步对 b 张量做一次奇异值分解：耦合强度与本征值范围都较小时 b 近似为低秩多项式，很可压缩，其复合维度可从 d 的平方压到较小值。第二步对左右两个三腿块沿复合腿做部分奇异值分解，各截断到较小的中间键维。第三步只在压缩后的块上做决定最终键维的截断奇异值分解，相对阈值控制精度，残余的酉矩阵留到下一步再收缩，内存吃紧时可用矩阵自由方式完成这一步。色散读出部分用 Rabi 哈密顿量加谐振驱动，读出线取带 Purcell 滤波的谱密度，谐振子截断到 20 级，并由量子比特纵向分量的指数衰减拟合提取速率。","result":"基准算例取谐振子经 a+a† 耦合到 ohmic 热浴，η=0.01、ω_c=3、k̃=500、相对阈值 10⁻³。增强方案与原始 iTEBD 给出相同的最终键维，说明额外截断没有丢失信息，三个中间键维都远小于 d 的平方。构造时间由随 d 的八次方改善为四次方，在 d 从 5 到 40 的全部区间都低于原算法，代价只是三次额外的奇异值分解；最大张量内存由四阶降到与最终过程张量同阶的二阶。读出算例取 g=0.211 GHz、ω_q=5.304 GHz、ω_r=7.5 GHz、η=10⁻³、谐振子线宽约 0.068 ns⁻¹，记忆深度 1000、相对阈值 10⁻⁷、时间步长 2πω_r/62、谐振子截断 20 级，模拟到 5(ηω_r)⁻¹ 的量级，即数万个时间步。物理结果是无滤波时驱动越强衰减率越低，与两级截断的 transmon 预期一致；滤波强度从 0.25 升到 0.9 时趋势反转，耗散随驱动增大，更接近实验观察。把交流斯塔克移代入马尔可夫 Purcell 公式只能定性复现这一趋势。与 4200 个玻色模的精确链映射相比，30 级时相对误差约 0.3%，外推到提取速率仍小于 1%；平坦弱谱下与 Lindblad 方程的态失配小于 0.2%。，说明该框架可用于读出脉冲与滤波器的协同设计。","contribution":"相对 Link 等人的 TTI-PT 构造，增量在于把瓶颈从时间步数转到系统维数之后又把它压回去：利用 b 张量的低秩性与两次部分 SVD，把 iTEBD 单步的大 SVD 换成小 SVD，时间代价由八次方降到四次方，内存降两个幂次；实现上只需在原流程里插入三次 SVD，不改变 TTI-PT 的定义与误差控制方式。可迁移价值有三点：过程张量原有能力（最优控制、多时间关联、稳态）随之扩展到十几到几十能级的系统；对超导电路，读数腔、Purcell 滤波器与传输线谱型可作为同一框架内的参数扫描对象；先降秩再做部分 SVD、以及矩阵自由的截断实现，对一般 iTEBD 与 MPO 时间演化同样适用。","limitation":"模型限制明确：量子比特只取两级子空间，未含 transmon 高能级，作者也承认这与把驱动依赖 Purcell 衰减归因于高能级的最新解释尚未分辨；环境为高斯、线性耦合、初态因子化，1/f 通量噪声、非高斯或非线性耗散不在框架内。TTI 要求过程张量时间平移不变，驱动必须并入系统哈密顿量并以谐振形式处理，任意包络的读出脉冲能否照此处理未做验证。精度只由 εrel、k̃ 与 Δt 三个旋钮给出，没有对键维 χ 外推的误差上界，Trotter 误差为二阶。与实验的对比停留在趋势层面，未定量复现 T1，也未讨论读数腔非线性或多能级测量反作用。相对误差约 0.3% 且随时间增长，长时标定量的可信度依赖外推。","key_numbers":["构造代价随系统维数由 \\( \\mathcal{O}(d^8) \\) 降至 \\( \\mathcal{O}(d^4) \\)，在 d=5 至 40 全区间优于原算法","最大张量内存由 \\( \\chi^2 d^4 \\) 降至 \\( \\chi^2 d^2 \\) 量级，与最终过程张量同阶","读出模拟取 N=20 个谐振子能级、k̃=1000、εrel=10⁻⁷、Δt=2πωr/62，时长至 5(ηωr)⁻¹","与 4200 模精确链映射（8400×8400 矩阵对角化）对比，d=30 时相对误差约 0.3%，外推至速率提取小于 1%","平坦弱谱下与 Lindblad 的态失配小于 0.2%，提取的 Purcell 率与解析式相差小于 1%","实验参数 g=0.211 GHz、ωq=5.304 GHz、ωr=7.5 GHz、κ≈0.068 ns⁻¹，滤波强度取 0 至 0.9"],"url":"https://doi.org/10.21468/SciPostPhys.21.5.134","read_depth":"正式版全文（SciPost 开放获取 PDF，21 页）","abstract":"Numerical methods for obtaining exact dynamics of non-Markovian open quantum systems are mostly limited to either small systems or to short-time evolution only. Here, we propose a new algorithm for computing process tensors— matrix product operator (MPO) representations that capture the environment influence— which achieves greatly enhanced computational scalings with system size, while maintaining linear scaling with simulation length. We build on recent developments in the field which allow for long-time evolutions through process tensors which have a time-translational invariance. These can be built for general Gaussian environments and generic coupling operators with the system using infinite time-evolving block decimation (iTEBD). We introduce a modified iTEBD algorithm using intermediate compression steps which bring down the computation time scaling with system size d from O(d^8) to O(d^4), as well as significantly lowering the required memory. To illustrate the power of this method, we apply it to the problem of dispersive qubit readout in circuit QED, which was previously out-of-reach numerically. The full treatment of the measurement resonator, which requires a large system space, combined with the long simulation times precipitated by the separation of timescales between the measurement drive and the environment dissipation, is now possible. The algorithm we introduce not only allows for capturing non-Markovian dynamics in large open quantum systems, but also further extends all the existing capabilities of process tensors to larger system sizes and longer times.","abstract_zh":"非马尔可夫开放量子系统的精确动力学数值方法，大多只适用于小系统或短时演化。本文提出计算过程张量的新算法：过程张量以矩阵乘积算符形式刻画环境影响，新算法大幅改善其随系统维数的标度，同时保持随模拟时长的线性标度。工作基于近期进展：时间平移不变的过程张量可做长时演化，且对一般高斯环境与一般耦合算符可由无穷时演化块消减（iTEBD）构造。作者引入带中间压缩的改进 iTEBD，把计算时间随系统维数 d 的标度从八次方降到四次方，并显著降低内存需求。为展示能力，将其用于此前无法企及的电路 QED 色散读出：需要大系统空间的测量谐振子，以及因时间尺度分离而来的长模拟时间，都不再是障碍。该算法也把过程张量既有能力（量子最优控制、多时间关联、稳态计算）推广到数十能级的系统。","review":{"verdict":"小修","confidence":"高","correctness":"本文旨在降低时间平移不变过程张量（TTI-PT）的 iTEBD 构造代价，使之能处理维度 \\(d\\) 达数十的开放系统。方法链条自洽：先用二阶 Trotter 把系统演化 \\(U_S\\) 与影响泛函因子交替（式 2），再由 \\(\\hat S\\) 的本征基把影响泛函写成式 4 的指数形式与式 3 的三角张量网络，最后用式 7 的四腿张量铺成二维网络交 iTEBD 收缩。这些步骤与既有 PT-MPO 构造一致，\\(C(t)\\) 的实部 \\(\\coth(\\omega\\beta/2)\\)、虚部 \\(-\\sin\\omega t\\) 也符合 Ohmic 谱密度下标准的 Feynman–Vernon 关联函数，未发现推导错误。真正的新意是压缩顺序：旧算法在含 \\(d^4\\) 指标、大小 \\(\\chi^2d^4\\) 的矩阵上做分块 SVD，新算法先对等距张量 \\(U^A,U^B\\) 做 SVD（奇异值全为 1），使待分解矩阵降为 \\(\\chi^2d^2\\alpha\\) 量级；等距变换不改变被截断谱，故改写数学等价，思路可取。但证据强度不均匀：代价降低只是由 \\(d\\le 40\\) 的基准点拟合出约 \\(O(d^4)\\)，而 \\(\\chi\\) 也随 \\(d\\) 增长，贡献未分离；全文没有 \\(\\Delta t\\) 与截断 \\(N\\) 的收敛检验，二阶 Trotter 误差按 \\(\\Delta t^2t\\) 累积，数万步后未必小于压缩误差；附录 A 的精确对照只覆盖无驱动、无耦合的单个谐振子，绕开了第 3 节唯一的新物理算例。","weaknesses":"· 复杂度声明是拟合而非推导：Fig. 4b 只覆盖 \\(d\\le 40\\) 的一个 Ohmic 模型，而 \\(\\chi\\)、\\(\\alpha\\)、\\(\\beta_1\\beta_2\\) 同时随 \\(d\\) 变化，无法把 \\(d^8\\to d^4\\) 的改进单独归因于新算法。建议给出固定 \\(\\chi\\) 的扫描，或按收缩与 SVD 的步数写出解析代价模型。\n· 缺少数值收敛性控制：没有 \\(\\Delta t\\) 减半的收敛曲线，没有谐振子截断 \\(N\\) 的收敛测试（第 3 节固定 \\(N=20\\)），也没有 \\(\\tilde k\\) 与 \\(\\varepsilon_{\\mathrm{rel}}\\) 的敏感性分析。文中最后一个 Θ 的 SVD 用 \\(10^{-3}\\) 截断、新增的三个 SVD 用 \\(10^{-7}\\)，两个口径并存却未说明理由，读者无从判断最终的 \\(\\chi\\) 由哪个精度决定。\n· 新旧算法一致性的证据偏弱：Fig. 3 只比较了最终键维 \\(\\chi\\)，但 \\(\\chi\\) 相同并不等于被截断的奇异值谱相同。应直接给出同一截断精度下两种构造所得 TTI-PT 的相对误差，或用同一初态演化的轨迹保真度衡量。\n· 核心物理结论缺少独立方法的交叉验证：驱动下 Purcell 率的结论只与 Markov 近似（式 (18)、(19)）和 AC-Stark 位移的解析估计对照，而作者自己承认这些展开在出现尖锐 notch 时可能失效（引 [51]）；在最需要独立校验的具体参数点上，没有 HEOM、TEMPO/TEDOPA 或反应坐标映射的计算。\n· 率提取的拟合窗口过短且无误差棒：从 \\(t\\gtrsim 2(\\eta\\omega_r)^{-1}\\) 拟合到 \\(5(\\eta\\omega_r)^{-1}\\)，只有约 \\(3(\\eta\\omega_r)^{-1}\\) 的基线，指数率 \\(\\gamma\\) 与渐近本底 \\(B\\) 强相关；滤波越强 \\(\\gamma\\) 越小、二者的区分度越差。Fig. 6 未给拟合区间与误差棒，也没有改变窗口的稳健性检验。\n· 滤波函数与正文陈述不自洽：文中说明用 qubit 频率处的 notch 建模，却写成 \\(H_p(\\omega)=1-p\\,e^{-\\omega^2/w^2}\\)（中心在零）并称 \\(J_p(\\omega_q)=(1-p)J^{p=0}(\\omega_q)\\)。按给出的 \\(1/w^2=150\\) 与 \\(\\omega_q,\\omega_r\\) 数值，\\(H_p(\\omega_q)\\approx 1\\)，既得不到该关系，也支撑不起后文“驱动使 \\(\\tilde\\omega_q\\) 移出 notch 从而增大 \\(J_p\\)”的解释；且 \\(w\\) 未标单位、未报告 \\(H_p(\\omega_r)\\)，滤波是否同时改变 \\(\\kappa\\) 无法判断。\n· 两个卖点只停留在展望：一是强耦合，压缩依赖 \\(b\\) 张量的低秩性，该性质最可能在 \\(\\eta\\) 增大时失效，而全文唯一基准是 \\(\\eta=0.01\\)；二是多能级 transmon，正文算例中 qubit 只保留两能级（系统维度 2N），并未真正演化 transmon 的高能级，却在摘要与结论中把数十能级作为已实现的能力。","overclaim":"摘要与结论把“代价从 \\(O(d^8)\\) 降到 \\(O(d^4)\\)”与“把过程张量的全部能力（最优控制、多时刻关联、稳态）推广到数十能级”并列陈述，但正文只演示了单次时间演化与一个测量率，其余能力均转述既有工作，未在新维度区间给出新结果。结论里的“数万步”与“30 能级”来自附录 A 的无驱动单谐振子，而第 3 节算例只有 \\(N=20\\)、演化到 \\(5(\\eta\\omega_r)^{-1}\\)，二者不是同一参数区间，易被读成同一成就。把 \\(d\\) 的指数下降称为大幅提升也偏强：该标度出自单模型拟合，且在 \\(\\chi\\) 随 \\(d\\) 增长处未必可分离。至于此前无法触及的读出差弛豫问题，qubit 只取两能级、谐振子截到 20 态，与实验的可比性有限。","citations":"文献覆盖到位：PT-MPO/TTI-PT、Q-ASPEN、TEMPO/TEDOPA、ACE 等主线工作，Ohmic 浴与 Purcell 的经典结果与实验滤波器文献均已引用。建议：一是与 [37,45] 的修正 Purcell 公式对比时应说明展开的小参数有多大，否则“定性一致”缺乏判据；二是应补引 notch 滤波下 Lindblad 型推导失效的定量检验工作（仅引 [51] 一句）；三是与 Q-ASPEN 的内存深度比较应对齐截断精度与口径；四是补引反应坐标映射后强耦合情形的数值结果。","questions":"① 第 3.1 节的滤波函数完整表达式是什么？若 notch 中心在 \\(\\omega_q\\)，请给出统一写法、\\(w\\) 的单位与数值以及 \\(H_p(\\omega_r)\\) 的取值；若不是，请说明 \\(J_p(\\omega_q)=(1-p)J^{p=0}(\\omega_q)\\) 与 AC-Stark 解释如何成立。\n② 请给出 Fig. 6 在 \\(\\Delta t\\) 减半、以及 \\(N\\) 从 20 增到 30 时的 \\(\\gamma/\\gamma_0\\)，以分离 Trotter 误差、谐振子截断误差与 PT 截断误差。\n③ Fig. 6a/6b 的 \\(\\gamma\\) 能否给出误差棒与拟合窗口敏感性？是否可以在固定 \\(\\bar n\\) 的稳恒段长时间拟合，或直接给出 \\(\\langle\\sigma_z(t)\\rangle\\) 曲线供读者自行拟合？\n④ Fig. 6b 的横轴是终态 \\(\\bar n\\)，而 \\(\\bar n\\) 本身随滤波而变，请问改以驱动振幅为横轴时结论是否保持？\n⑤ 在 \\(\\eta\\sim 0.1\\)（反应坐标映射真正有意义的区间）时，\\(b\\) 张量的压缩率 \\(\\alpha/d^2\\) 与总代价如何变化？能否给出这样一个算例？","basis":"本次评审基于 SciPost 正式发表版全文（SciPost Phys. 21, 134 (2026)，对应 data/2026-11-27/pdf/p01.txt）逐节阅读完成，公式、参数与图注均按该版本核对。"}},{"id":"pr-10.1103/v6rn-hyp7","no":2,"topics":["张量网络仿真","随机动力学","大偏差与稀有事件"],"source":"PR 系列","venue":"Physical Review Research","published":"2026-11-26","title":"Matrix-product belief propagation for continuous-state-space variables","title_zh":"面向连续状态空间变量的矩阵乘积置信传播","authors":["Federico Florio","Alfredo Braunstein"],"importance":4,"importance_reason":"把消息在 Hilbert 函数基上截断展开，用基大小 K 与键维 d 分别控制连续化误差与非局部相关，单次迭代代价 \\( \\mathcal{O}((d^6K+d^2K^2)|E|T) \\) ，对边数与时长线性，使度 8 以上的实值耦合网络可算。该模板可用于连续变量或混合 CV-DV 的经典模拟与稀有事件估计；但算例只有经典 Kinetic Ising、无量子演示，故为应读而非必读。","summary":"把矩阵乘积置信传播的消息在 Hilbert 函数基（Fourier 基）上截断展开，使含连续或混合变量的稀疏网络动力学可用键维 d 与基大小 K 控制误差，单次迭代代价 \\( \\mathcal{O}((d^6K+d^2K^2)|E|T) \\)，在 N=100 树与 N=200 图上与蒙特卡洛符合到 10⁻³ 与 10⁻²。","problem":"在大型稀疏网络上计算离散随机（可含条件化）动力学的可观测量，是许多应用的基础。蒙特卡洛能以可控的绝对误差估计这些量，但要达到较小的相对误差往往慢到不可行：研究条件概率与稀有事件时轨迹需要重加权，收敛甚至可指数变慢。平均场与信念传播类半解析方法可以估计边际，多数只在无环图上渐近精确；动态信念传播能处理重加权情形，实际却只对非递归模型的一小类有效。矩阵乘积置信传播用键维 d 的矩阵乘积态表示消息，误差随 d 受控，代价对时间步长与网络规模线性，是较好的折中。但它的高效实现依赖把节点发出的消息对邻域变量做中间变量分解，而中间变量的定义域在耦合为实值随机时随邻域大小指数增长：以 Kinetic Ising 为例，局部场是邻域自旋的加权和、取连续值，枚举式实现到度 8 左右就不可行。因此需要一种对连续状态空间本身可控截断的表示。","method":"核心是把消息看成连续变量的函数，并在一组 Hilbert 函数基上展开。消息的矩阵元是自旋取值的函数；为进入连续域，先用标准差为 σ 的高斯把正负自旋的两个尖峰磨平，再在周期 P 上做傅里叶展开，系数化为两个取值概率之差的余弦与正弦，基函数取复指数，内积为区间平均，基指标截断到绝对值不超过 K。消息于是成为基函数乘积系数的矩阵乘积态。中间变量的消息递推是带 δ 约束的卷积，在傅里叶基下变成逐基指标相乘，免去了对局部场的枚举；单邻域消息由 δ 函数直接给出。出边消息需要把转移因子对局部场积分，该积分存在含高斯超几何函数的闭式，得到不含中间变量的张量，再用一次奇异值分解把相邻时间指标分离，并写成逐时间步张量之积。单次迭代代价对边数与时间步长线性，前置因子依赖键维与基大小。无限图用种群动力学处理，100 条消息、矩阵元在 0 到 1 之间均匀随机初始化。","result":"在 10 个节点的树上与逐状态精确演化对比，取 β=0.5、耦合在负一到一之间均匀、初始磁化 0.7，磁化均方根误差随键维与基大小单调下降，说明误差只来自矩阵乘积与基截断。100 个节点的优先连接树取键维 15、基大小 100，与 10⁶ 样本的蒙特卡洛对比，磁化均方根误差 3.3×10⁻³，与蒙特卡洛自身的抽样误差同量级。200 个节点的配置模型图度分布呈负 0.6 次方、含大量短环，取键维 20、基大小 100，均方根误差 2.0×10⁻²，能量被略微低估，最大偏差出现在参与大量短环的第 8 号节点。无限随机正则图（度 8）与无限 Erdős-Rényi 图（平均度 4）用键维 15、基大小 60 的种群动力学，惯性参数 0.3，得到磁化与自关联；论文指出 10⁻⁴ 量级的自关联要达到 10% 相对精度，需要约 10¹⁰ 个独立样本。重加权算例在度 8 的无限正则图上扫描重加权场，得到末态磁化、Bethe 自由能与大偏差函数；节点数 10³ 时磁化约 0.3 的事件用蒙特卡洛需约 10¹³ 个样本，误差 0.01 则需约 10¹⁷ 个样本。，精度与代价由键维和基大小两个旋钮共同决定。","contribution":"相对原矩阵乘积置信传播，增量是把矩阵乘积态表示扩展为矩阵乘积态乘基展开系数的双层表示：连续变量以 K 截断，非局部相关仍由 d 刻画，两个误差源可分开调节。方法上关键的一步是卷积在 Fourier 基下对角化、出边积分存在闭式，使连续化没有引入数值积分瓶颈，代价仍对边数与时长线性。可迁移之处在于这套模板适用于任何需要对连续或混合变量做张量压缩与消息传递的场合；对稀有事件与大偏差，它把指数多的样本需求换成线性代价的迭代，对有环图仅剩经验精度损失。","limitation":"验证只到经典 Kinetic Ising 一个模型，耦合取均匀分布，对量子系统、复权重与非平衡稳态没有算例，与量子开放系统的联系需要读者自行建立。理论保证有限：只在无环图上 d、K 趋于无穷时精确，有环时没有误差上界，只能靠 N=200 的对比给出 2×10⁻² 量级的经验值，短环多、度高的节点明显变差。连续化本身引入两个超参数：磨平自旋峰的高斯宽度 σ 与周期 P，论文未给出选取准则或敏感性分析。基截断等价于对局部场的带限假设，耦合无序且节点度高时局部场尾部较重，该假设可能不成立。种群动力学在无限图上的收敛判据是观测量目视稳定，没有误差条，每步常数因子较大。","key_numbers":["单次迭代代价 \\( \\mathcal{O}((d^6K+d^2K^2)|E|T) \\)，对边数与时间步长线性","N=100 优先连接树、d=15、K=100：与 10⁶ 样本蒙特卡洛的磁化均方根误差 3.3×10⁻³","N=200 幂律度分布图、d=20、K=100：磁化均方根误差 2.0×10⁻²，能量略被低估","N=10 树、T=4、β=0.5 与精确解对比，误差随 d 与 K 单调下降","度 8 无限正则图、β=1/7、d=10、K=30 估计大偏差函数；N=10³ 时蒙特卡洛需约 10¹³ 个样本，误差 0.01 需约 10¹⁷","10⁻⁴ 量级自关联要达到 10% 相对精度，蒙特卡洛需约 10¹⁰ 个独立样本"],"url":"https://doi.org/10.1103/v6rn-hyp7","read_depth":"预印本全文 arXiv:2605.14522v2","abstract":"Computation of observables in discrete stochastic, possibly conditioned, dynamics over large sparse networks is fundamental for a myriad of applications. The Matrix-Product Belief Propagation method allows a semi-analytical estimation of such observables in tree-like networks with a controlled error that depends on the bond dimension, that is the dimension of the employed square matrices. Its computational cost is linear in the time horizon and the network size for a large family of models with discrete degrees of freedom. Here, a generalization of this method to models with continuous or mixed continuous/discrete degrees of freedom is presented, using a tunable expansion in a Hilbert function basis. For a wide class of models, the computational cost of the method is linear in the network size with a prefactor that depends on the basis size and the bond dimension. The method’s efficacy is demonstrated by employing a Fourier basis for a mixed continuous/discrete representation of the Kinetic Ising dynamics with real-valued random couplings, where intermediate \"local fields\" are treated as continuous. The accuracy of the method is verified via comparison with Monte Carlo simulations. For this model, we calculate time auto-correlations, time evolution of energy and magnetization, and finally we estimate the large deviation function of the magnetization at a given future time.","abstract_zh":"在大型稀疏网络上计算离散随机、可含条件化的动力学可观测量，是许多应用的基础。矩阵乘积置信传播可在树状网络上半解析地估计这类量，误差由键维控制，对一大类离散自由度模型其代价对时间步长与网络规模都是线性的。本文把它推广到含连续或混合连续与离散自由度的模型，做法是在一组 Hilbert 函数基上做可调截断展开；对一大类模型代价对网络规模线性，前置因子依赖基大小与键维。作者以 Fourier 基表示 Kinetic Ising 动力学的混合连续与离散形式，耦合取实值随机、中间局部场按连续量处理，并与蒙特卡洛模拟对比验证精度，随后计算时间自关联、能量与磁化的演化，并估计给定时刻磁化的大偏差函数。","review":{"verdict":"大修","confidence":"高","correctness":"文章把 MPBP 从离散状态变量推广到含连续或连续–离散混合变量的模型：把每条消息 \\(\\mu_{ij}(x_i,x_j)\\) 的矩阵元在函数基上展开，并让 BP 更新在该假设类内闭合；关键技巧是在 Fourier 基下把中间变量 \\(y^A=\\sum_{j\\in A}J_{ji}x_j\\) 的卷积写成可解析求值的积分（附录 D），并把含跃迁权重的积分化为 \\({}_{2}F_{1}\\) 的闭式（附录 E）。用只含 1 度与 3 度因子的改写因子图把代价对度数的依赖变为线性，附录 B 逐式验证了改写与标准 BP 更新等价，这部分未发现错误；附录 C 用 Parseval 与 SVD 的界证明基展开加张量截断的 \\(L_2\\) 误差受 \\(\\varepsilon\\) 控制，但只对单次截断成立，不构成沿 \\(T\\) 步传播的全局误差界——正文用 locally controlled 的措辞是谨慎的，摘要则说得过满。数值校验层次合理：\\(N=10\\) 树与精确解对比、\\(N=100\\) 树与构型模型图同 Monte Carlo 对比（RMSE 约 \\(10^{-3}\\) 与 \\(2\\times10^{-2}\\)）、无限图上的总体动力学，以及 \\(N=7\\) 树上对大偏差律的穷举校验。含短环图上的误差放大 20 倍也被如实报告。可商榷处在于证据与标题的匹配：所谓连续变量实例里动力学变量仍是 Ising 自旋，连续量只是被耦合分布限制在有界区间内的局域场，模型并不产生无界支撑的连续自由度，故标题所说的连续状态空间一般性未被真正演示。","weaknesses":"· 效率主张没有任何实测支撑：正文给出 \\(O((d^6K+d^2K^2)|E|T)\\) 的操作计数，但全文没有一张运行时间、内存或与 Monte Carlo 的墙钟对比表。按文中参数（\\(d=15\\)、\\(K=100\\)）粗估，\\(d^6K\\) 已达 \\(10^{9}\\) 量级每边每步，\\(K^2\\) 项在 \\(K>d^4\\) 后也会主导；读者既无法判断 linear cost 在实际规模上是否优于采样，也无法判断常数因子与理论渐近哪个才是限制因素。\n· 基与周期的选择没有可复现的规则：Fourier 展开需要在 \\([-P/2,P/2]\\) 上周期化并假定消息在边界衰减，而把离散自旋的边缘分布写成两个高斯（式 (11)）又引入宽度 \\(\\sigma\\)。\\(P\\) 与 \\(\\sigma\\) 都直接影响精度（\\(\\sigma\\to0\\) 时 delta 梳的 Fourier 系数不衰减、\\(K\\) 截断失效），却都没有出现在附录 H 的参数表里，也没有给出它们与度数、耦合区间的关系或由此产生的偏差估计。\n· 误差可控只是逐次局部的：附录 C 的界针对单次基展开与单次 SVD 截断，误差在 \\(T\\) 步时间演化与 BP 不动点迭代中如何累积、是否随 \\(T\\) 线性增长，文中没有讨论；而长时间 \\(T\\) 恰恰是该方法宣称相对 Monte Carlo 的优势区间。\n· 无限系统结果缺少量化误差：总体动力学部分以 observables appear visually stable 作为停止判据，图 6、图 7 的曲线与自关联没有误差棒，也没有关于 population 规模（100 条消息）的收敛检验，插图只给了单条曲线随迭代时间的演化；\\(\\rho=0.3\\) 这个惯性参数也没有说明来源。\n· 大偏差结果的校验与主结果不在同一参数点：图 9 的验证是 \\(N=7\\) 树、\\(\\beta=1/2\\)、\\(J\\sim U(0,1)\\)，而图 8 的无限图结果是 \\(\\beta=1/7\\)；作者也承认式 (G5) 的 Vandermonde 反演在有限 \\(N\\) 下病态，无限图改用参数图避开了反演，却也失去了唯一可比的检验，于是图 8 的 \\(g(\\hat m)\\) 实际上没有独立验证。\n· 缺少与其它连续或混合状态空间消息传递方法的对照：线性高斯动力学存在精确的高斯 BP 或 Kalman 解，可直接充当无界连续变量下的解析基准；粒子 BP 与序列 Monte Carlo 也是直接竞争方法。文中既没有精度比较也没有代价比较，virtually impossible with Monte Carlo 的说法停留在样本数估算，而非实测交叉点。\n· 单一模型与单一基：全部实验都是 Kinetic Ising 加 Fourier 基，既然方法的一般性来自任意正交基，至少应给出一个非 Fourier 基（如 Chebyshev 或分段常数）的小例子，以支撑 tunable expansion 的一般性声明，并说明 \\(K\\) 的选择如何随基改变。","overclaim":"摘要称方法把 MPBP 推广到 continuous or mixed continuous/discrete 变量、代价对网络规模线性、精度受键维与基尺寸控制。三点都成立，但措辞放大了证据：唯一的应用实例是 Kinetic Ising，连续量仅由离散自旋线性组合出且支撑有界，无界支撑的连续动力学从未演示；linear in the network size 回避了常数因子，写明的 \\(O((d^6K+d^2K^2)|E|T)\\) 在 \\(d=15\\)、\\(K=100\\) 时前因子极大，而全文没有任何时间或内存数据支撑“可处理以前不可处理的图”；controlled error 在正文中已被限定为局部，摘要未保留该限定，易让读者以为存在沿 \\(T\\) 步的全局误差界。","citations":"脉络引用清楚：动态腔方法（[3,6]）、DBP 与矩阵乘积边消息（[13,14,15]）、前作 MPBP（[16]）、张量列分解（[22]）、无限 MPS 推广（[24]）、状态空间模型的动机性引用（[17–20]）。不足有三：缺与连续状态空间消息传递的直接对比文献，如线性高斯模型上的高斯 BP 或 Kalman 滤波、粒子 BP 与期望传播；除小耦合展开 [5] 外，未引用处理大度数动力学腔的其它近似，使“此前不可解”的判断缺少参照；可补一篇 SVD 截断误差在迭代算法中传播的分析。","questions":"① 附录 H 未列出 Fourier 周期 \\(P\\) 与式 (11) 中高斯平滑宽度 \\(\\sigma\\)。请给出二者的取值与选取规则，以及 \\(K\\) 固定时误差随 \\(\\sigma\\)、\\(P\\) 变化的曲线；\\(\\sigma\\) 是否随 \\(t\\)、度数或 \\(\\beta\\) 调整？\n② 请给出实测代价：\\(d=15\\)、\\(K=100\\)、\\(T=10\\) 时每边每步的墙钟时间与峰值内存，以及在达到同等精度时与 Monte Carlo 或高斯 BP 的交叉点。\n③ 误差如何随 \\(T\\) 增长？把 \\(T\\) 从 10 提到 50 或 100、固定 \\(d\\) 与 \\(K\\) 时，RMSE 是否仍保持在 \\(10^{-3}\\) 量级？\n④ 图 6、图 7 的自关联与图 8 的 \\(g(\\hat m)\\) 能否给出误差棒，或给出 population 数目由 100 增到 400 时的稳定性检验？\n⑤ 能否补一个真正连续状态空间的算例（例如线性高斯动力学，其精确解已知），以验证基展开与张量截断在无界支撑情形下仍然收敛？","basis":"本次评审基于 arXiv:2605.14522v2 预印本全文（对应 data/2026-11-27/pdf/p02.txt；期刊版为 Phys. Rev. Research，DOI 10.1103/v6rn-hyp7）逐节阅读完成，公式、参数与附录均按该预印本核对。"}},{"id":"pr-10.1103/zd6q-9rr3","no":3,"topics":["噪声与开放系统","测控与脉冲","量子模拟"],"source":"PR 系列","venue":"Physical Review Research","published":"2026-11-26","title":"Emulating non-Markovian system-bath dynamics with parametrically driven cavities","title_zh":"用参量驱动腔模拟非马尔可夫系统–浴动力学","authors":["V. Boettcher","F. Pellerin","P. St-Jean","W. A. Coish"],"importance":3,"importance_reason":"把浴谱密度的幂律形状编码进参量驱动波形的傅里叶系数，并对有限模式数、驱动带宽与损耗分别给出误差标度，最后落到任意系统可观测量的偏差上界。对做结构化噪声工程、或用超导腔参量驱动构造合成维度的人，「波形即谱密度」加误差预算可直接搬用；但演示平台是光纤环中的经典相干光，不涉及超导器件，也不触及容错阈值，故评为可读。","summary":"把腔的离散纵模当作合成维度，用周期参量驱动的波形形状直接编码浴谱密度 \\( J(\\omega)\\propto\\omega^{s} \\)；光纤环中以 \\( N=2\\times10^{4} \\) 个模式、\\( N_F=50 \\) 个傅里叶系数即可复现 spin-boson 局域化转变（\\( s<1 \\) 完全衰减、\\( s>1 \\) 部分衰减），并给出任意系统可观测量的系统误差上界。","problem":"马尔可夫近似是 Lindblad 主方程成立的前提，但它抹掉了环境记忆，而记忆效应恰恰是量子热力学、多体热化与容错量子计算中难以纠正的错误来源。要研究非马尔可夫动力学，通常只能在数值上积分真实结构浴，或借助冷原子、超导电路等平台模拟个别模型；这些方案缺少一个把任意浴谱密度当作可编程输入的通用接口。更麻烦的是，spin-boson 模型从完全衰减到部分衰减的局域化转变只在无限模式的热力学极限与足够弱的系统–浴耦合下才严格成立，而实际平台的模式数与驱动带宽都有限。此前既没有定量回答「有限资源下还能看到多少转变」，也没有给出模拟器与理想模型之间针对任意系统可观测量的系统误差界，因而难以判断一次模拟的结果究竟能信到什么程度。","method":"核心是把单个腔的离散纵模当成合成维度上的一维紧束缚链。对腔施加频率 \\( \\Omega \\) 的周期参量调制，模式间产生由波形傅里叶系数决定的长程跃迁；取色散 \\( \\varepsilon(k)\\propto|k|^{1/(s+1)} \\)，态密度即为 \\( \\propto\\varepsilon^{s} \\)，浴谱密度随之连续可调。实验上用电光调制器改变光纤环光程，改写施加电压波形的傅里叶系数即可设定谱指数。装置为两个光纤环：大环即浴环，模式间距 \\( \\Omega \\)、含 \\( N \\) 个模式；小环用滤波器只保留失谐 \\( \\omega_a \\) 的一个模，两环以耦合 \\( \\delta \\) 相连，于是映射到 Wigner–Weisskopf 模型，相干态振幅直接对应原子与浴的概率幅。解析处理在旋转波近似下进行，弱耦合展开给出激发态布居 \\( p_e \\) 的闭式表达，再分别讨论有限 \\( N \\)、有限 \\( N_F \\) 与损耗 \\( \\gamma \\) 的影响；误差界由目标模型与物理模型的浴关联函数之差经两时间积分得到，对任意有界的系统可观测量成立。","result":"参数为 \\( N=2\\times10^{4} \\)、\\( N_F=50 \\)、\\( \\delta/\\omega_c=1/5 \\)、\\( 1/\\gamma=5\\ \\mu\\mathrm{s} \\)，此时 \\( 1/\\Gamma\\approx0.6\\ \\mu\\mathrm{s} \\)，仅勉强短于光纤环寿命。有限尺寸上，\\( s=1 \\) 处的锐利转变需 \\( N\\gg2e^{(\\omega_c/\\delta)^{2}}\\sim10^{11} \\) 个模式；但 \\( N>N^{\\ast} \\) 时 crossover 移到 \\( s^{\\ast}<1 \\)，取 \\( N^{\\ast}\\sim10^{4} \\) 得 \\( s^{\\ast}\\simeq0.64 \\)。\\( s>1 \\) 时布居趋于 \\( [1+\\tfrac{s+1}{s-1}(\\delta/\\omega_c)^{2}]^{-2} \\)，\\( s=1.4 \\) 约 0.65，即部分衰减；亚欧姆侧随模式数代数衰减，Ohmic 点则只随傅里叶系数对数抑制，说明有限带宽比有限模式数更致命。数值上 \\( s=0.1 \\) 的完全衰减与 \\( s=1.4 \\) 的部分衰减均与参考组定性一致，\\( \\tau\\lesssim6\\ \\mu\\mathrm{s} \\) 内偏差小于 \\( p_e \\) 本身。","contribution":"相对此前在冷原子或超导电路中针对特定模型、特定谱的模拟，这里把「浴」抽象成一个可编程的波形：谱指数、态密度形状与耦合强度都写在同一个调制信号里，因而可以级联成模块化的定制浴，且浴本身可通过透射谱直接测量。更实用的是两条可核验的标度：Ohmic 点附近有限 \\( N \\) 需要指数多的模式，而有限 \\( N_F \\) 只带来对数抑制，这直接告诉实验该优先增加驱动带宽而不是模式数；并明确有限资源下转变退化为 \\( s^{\\ast}<1 \\) 的 crossover，而不是假装看到了热力学极限。误差界对任意系统可观测量的形式，使其可用于超导腔参量驱动合成维度的误差预算。","limitation":"演示停留在经典相干光的单激发层面：光纤环中的振幅是相干态振幅而非真正的量子浴，无法展示浴的量子关联、多激发与有限温度效应。要看到 \\( s=1 \\) 处的锐利转变需 \\( 10^{11} \\) 量级模式，远超光纤环可及的 \\( 10^{4} \\)，作者只能用 \\( s^{\\ast}\\simeq0.64 \\) 的 crossover 替代，即「准确模拟局域化转变」在实验上并不成立。损耗条件也只是勉强满足，\\( 1/\\Gamma \\) 与 \\( 1/\\gamma \\) 相差不到一个量级，长时间平台值仍会被侵蚀。旋转波近似在 \\( \\omega_c/\\Omega\\gtrsim1 \\) 失效，而增大 \\( \\omega_c \\) 恰是缩短 \\( 1/\\Gamma \\) 的手段，两者相互制约。给出的误差界是保守上界而非紧界。全文限于线性耦合与单模系统，非线性与强耦合区未讨论。","key_numbers":["\\( N=2\\times10^{4} \\) 个浴模式、\\( N_F=50 \\) 个傅里叶系数即可复现 \\( s=0.1 \\) 完全衰减与 \\( s=1.4 \\) 部分衰减","参数 \\( \\omega_c/2\\pi=1\\ \\mathrm{MHz} \\)、\\( \\Omega/2\\pi=9.8\\ \\mathrm{MHz} \\)、\\( \\delta=\\omega_c/5 \\)、\\( 1/\\gamma=5\\ \\mu\\mathrm{s} \\)，对应 \\( 1/\\Gamma\\approx0.6\\ \\mu\\mathrm{s} \\)","\\( s=1 \\) 处锐利转变需 \\( N\\gg2e^{(\\omega_c/\\delta)^{2}}\\sim10^{11} \\) 个模式","\\( N^{\\ast}\\sim10^{4} \\)、\\( \\delta/\\omega_c=0.2 \\) 时 crossover 移至 \\( s^{\\ast}\\simeq0.64 \\)","\\( s>1 \\) 时 \\( p_e\\simeq[1+\\tfrac{s+1}{s-1}(\\delta/\\omega_c)^{2}]^{-2} \\)，\\( s=1.4 \\) 约 0.65","旋转波近似在 \\( \\omega_c/\\Omega\\lesssim0.2 \\) 内准确，\\( \\omega_c/\\Omega\\gtrsim1 \\) 失效"],"url":"https://doi.org/10.1103/zd6q-9rr3","read_depth":"预印本全文 arXiv:2608.21569v1","abstract":"We introduce and characterize a scheme for emulating non-Markovian quantum system-bath dynamics using the discrete electromagnetic field modes of a parametrically driven cavity. In this scheme, the character of a bosonic bath (the form of the bath spectral density) is tied directly to the shape of the real-time waveform describing periodic parametric cavity modulation. As an explicit example, we demonstrate the feasibility of this scheme for a fiber-loop experiment with currently achievable parameters, supported by numerical simulations and analytical estimates. In particular, we show that a localization transition of the spin-boson model can be accurately emulated in this fiber-loop cavity system. This localization effect is characterized by a sharp transition from partial decay to complete decay for a two-level system coupled to a bosonic bath as the bath spectral density \\(J(\\omega) \\propto \\omega^s\\) is continuously tuned from the sub-ohmic (s < 1) to the super-ohmic (s > 1) regime. The transition is only exactly realized in the thermodynamic limit (for an infinite number of bath modes) and for sufficiently weak system-bath coupling. We highlight a competition between the weak-coupling and thermodynamic limits in this problem and show that challenges in approximately realizing the transition can nevertheless be overcome. Finally, we provide bounds on the systematic error introduced when emulating non-Markovian dynamics for arbitrary system observables. The scheme presented here can enable the realization of a modular platform for engineering custom non-Markovian baths, with potential applications in quantum thermodynamics, thermalization of many-body systems, and resource-efficient quantum simulations of open quantum systems.","abstract_zh":"本文提出并刻画一种用参量驱动腔的离散电磁场模式模拟非马尔可夫系统–浴动力学的方案。要点是：玻色浴的性质（浴谱密度的形式）直接由周期参量腔调制的实时波形形状决定。作者以光纤环实验为例，用当前可达到的参数、数值模拟与解析估计论证可行性，并证明可准确模拟 spin-boson 模型的局域化转变：浴谱密度从亚欧姆连续调到超欧姆时，二能级系统由完全衰转变为部分衰减。该转变只在无限模式的热力学极限与足够弱的耦合下严格成立；作者指出两个极限之间的竞争，并说明近似实现转变的困难仍可被克服。最后给出模拟非马尔可夫动力学时针对任意系统可观测量的系统误差界，该方案可构成工程化定制非马尔可夫浴的模块化平台。","review":{"verdict":"小修","confidence":"高","correctness":"技术链条自洽：把光纤环的色散维度与位置维度拼成二维合成晶格，用 EOM 调制给出沿色散方向的等效跃迁 \\( t_{sl} \\)（式 (40) 与附录 A 的闭式），积掉色散维度后的谱密度 \\( J(\\omega)=\\pi D(\\omega)\\propto\\omega^{s} \\)（式 (36)(38)）确实由调制波形唯一决定，这是方案最漂亮之处；式 (49)–(51) 的归一化把 bath 折叠到源模，式 (52)–(63) 的 Laplace + Bromwich + 留数处理给出 \\( \\omega_a^{*}=\\omega_a+\\Delta_L \\) 的重整化与长时残留，式 (65) 在 \\( s>1 \\) 趋于有限平台、在 \\( s\\to1^{+} \\) 以 \\( 1/(s-1) \\) 发散，符合 Ohmic 边界的预期；附录 B 用 \\( n^{*}=10 \\) 项检验 RWA 反旋项，也是必要的自检。最吃紧的一环不是推导而是极限可达性：式 (75) 的 \\( N^{*}=2[1+|\\epsilon|(\\omega_c/\\delta)^{2}]^{1/|\\epsilon|} \\) 在 \\( \\delta/\\omega_c=1/5 \\) 下要求 \\( N\\gg2e^{(\\omega_c/\\delta)^{2}}\\sim10^{11} \\)，而 Table I 给的是 \\( N=2\\times10^{4} \\)，正文因此只能展示 \\( s^{*}\\simeq0.64 \\) 的 crossover，并把可精确复现的对象退到理想模型的短时瞬态；这个判断本身是对的，只是摘要措辞没有跟着退。另一处需要读者自行核验的是 \\( N\\to\\infty \\) 与 \\( N_F\\to\\infty \\) 的次序：正文以「\\( k=0 \\) 在连续极限下测度为零」为由先取 \\( N\\to\\infty \\)，但有限 \\( N_F \\) 恰恰只在 \\( k\\approx0 \\) 邻域改变 \\( \\varepsilon_s(k) \\)（正文亦承认有限 \\( N_F \\) 时 \\( \\varepsilon_s(0)\\neq0 \\)），而 \\( \\omega_a^{*}\\to0^{-} \\) 时正是该邻域主导式 (70) 的求和，故平台值对 \\( N_F \\) 的敏感度并非「测度为零」可以带过。","weaknesses":"· 量级不可达：摘要称 localization transition 「can be accurately emulated」，而式 (75) 与 Fig. 8(b) 自己给出 \\( \\delta/\\omega_c=1/5 \\) 时须 \\( N\\gg2e^{25}\\sim10^{11} \\) 才见 sharp transition，Table I 的 \\( N=2\\times10^{4} \\) 只够 \\( s^{*}\\simeq0.64 \\) 的 crossover；这是指数级差距，不是调参问题\n· 双重极限的次序未量化：正文以 \\( k=0 \\) 测度为零为由先取 \\( N\\to\\infty \\)，但有限 \\( N_F \\) 只在 \\( k\\approx0 \\) 邻域偏离理想色散，而 \\( \\omega_a^{*}\\to0^{-} \\) 时该邻域主导式 (70)；缺 \\( p_e \\) 平台值随 \\( N_F=50,100,\\infty \\) 的收敛曲线，式 (103) 只是传播子的界而非 \\( p_e \\) 的敏感度\n· 误差界未量化：式 (105) 没有画成随 \\( \\tau \\) 的曲线，也未与 Fig. 9 的数值偏差对照；作者自承 \\( \\propto\\omega_c/\\Omega \\) 项高估，那么该界在 Table I 参数下于哪些 \\( \\tau \\) 内仍小于数个百分点，读者无从判断\n· 可达域未画出：式 (67) 要求 \\( (\\delta/\\omega_c)^{2}\\ll s/(1+s) \\)，而 \\( p_e\\propto(\\omega_c/\\delta)^{4} \\) 又要 \\( \\delta \\) 不太小，两条约束夹出的窗口与 Fig. 8–9 参数点的对应关系没有给出\n· 本质是经典线性波：全部结果都是相干态幅度 \\( \\alpha,\\beta_k \\) 的演化（式 (49)–(51)），等价于单激发线性响应；摘要提到的 quantum thermodynamics 与 many-body thermalization 没有对应算例，\\( T>0 \\) 只出现在 outlook\n· 非平衡阻尼补偿缺数值：式 (82)–(84) 的 \\( \\Delta\\gamma\\neq0 \\) 只有解析界，Table I 与 Fig. 9 均取 \\( \\gamma_S=\\gamma_B \\)，最需要误差预算的情形反而没有算例\n· 拟合在转变点病态：式 (87) 的 \\( A/\\tau^{|s-1|} \\) 在 \\( s\\to1 \\) 退化为常数并与 \\( p_e \\) 简并，而 s=1 恰是判断转变的位置；Ohmic 的有限 \\( N \\) 修正本应对数形式（式 (76) 的 \\( \\ln^{2}(N/2) \\)），用幂律拟合有系统偏差","overclaim":"摘要的「a localization transition ... can be accurately emulated」超出了参数所能支撑的范围：按作者自己的式 (75) 与结论段，sharp transition 需 \\( N\\sim10^{11} \\)，可达的只有 \\( s^{*}\\simeq0.64 \\) 的 crossover 与理想模型的短时瞬态。更准确的写法是「可在 \\( N\\sim10^{4} \\) 下演示衰减的强代数压制与 crossover，并给出达到真正转变所需的 \\( N \\) 标度」。结尾「modular platform ... potential applications in quantum thermodynamics, thermalization of many-body systems」属展望，正文只有单激发线性（经典光）算例，「resource-efficient quantum simulations」中的 quantum 宜限定到 single-excitation/linear 层面。摘要的「bounds on the systematic error ... for arbitrary system observables」是站得住的，但式 (105) 迄今只是未被数值标定的上界，宜写成 analytic upper bounds。","citations":"应把本文的 \\( J(\\omega)\\propto\\omega^{s} \\) 与已有结构化 bath 实现对照：超导 LC 梯形网络/谐振子阵列合成的 Ohmic 与 sub-Ohmic bath，以及离子阱中用可编程噪声谱重构 bath 关联函数的工作，以说明本方案在 \\( N \\)、\\( N_F \\) 与波形可编程性上的增量。s=1 附近的判据宜对照 spin-boson 的 NRG 与 HEOM/PT-TEMPO 结果（含临界耦合 \\( \\alpha_c(s) \\) 曲线），否则无法区分「被模拟对象的转变」与「有限 \\( N \\) 的平滑化」。合成频率维度中 \\( \\varepsilon(k)\\propto|k/\\pi|^{1/(s+1)} \\) 的映射可与光子合成维度文献对照；光纤环已用于非厄米与非马尔可夫模拟，应补充实验平台差异。","questions":"① 在 \\( N=2\\times10^{4} \\)、\\( \\delta/\\omega_c=1/5 \\) 下，式 (75) 与 Fig. 8 显示 \\( s>0.64 \\) 已需 \\( N\\gtrsim10^{11} \\)；能否给出「现有 \\( N \\) 下 \\( s \\) 可达上限随 \\( \\delta/\\omega_c \\) 变化」的等值线，以及这些点上 \\( p_e(\\tau) \\) 与热力学极限解的定量偏差？\n② 式 (70)–(78) 是否依赖先 \\( N\\to\\infty \\) 再 \\( N_F\\to\\infty \\) 的次序？对 Table I 的 \\( (N,N_F)=(2\\times10^{4},50) \\) 与 \\( (2\\times10^{5},\\infty) \\)，\\( p_e \\) 的差异有多少来自 \\( N_F \\) 截断、多少来自 \\( N \\)？\n③ 式 (105) 的上界在 \\( \\tau \\) 多大范围内仍小于 Fig. 9 实际偏差的两倍？能否把它与实际误差画在同一张图上，并注明 \\( \\omega_c/\\Omega \\) 项所占比例？\n④ 谱密度标定式 (42)(43) 的推导中，探测扫过共振的速率与线宽之比需满足什么不等式？按 Table I 的 \\( \\Omega/2\\pi=9.8 \\) MHz 与 \\( \\gamma=1/(5\\,\\mu\\mathrm{s}) \\) 是否满足？\n⑤ 平台上如何观测真正的量子关联而非经典振幅残余？若要展示 \\( s>1 \\) 的局域化，能否给出 \\( \\langle\\sigma_z\\rangle \\) 之外的观测量（如两模关联）及其误差预算？","basis":"预印本全文（arXiv:2608.21569v1 PDF 全文，含 Sec. I–VI、Appendix A–C 与参考文献）；正式版 Phys. Rev. Res. 10.1103/zd6q-9rr3 与预印本的差异未能核验"}},{"id":"pr-10.1103/hm5z-844n","no":4,"topics":["噪声与开放系统","耗散多体动力学","非互易输运"],"source":"PR 系列","venue":"Physical Review Research","published":"2026-11-26","title":"Interaction-mediated non-reciprocal dynamics in open quantum systems: From an exactly solvable model to generic behavior","title_zh":"相互作用介导的开放量子系统非互易动力学：从严格可解模型到普适行为","authors":["Pietro Borchia","Johannes Knolle","Andreas Nunnenkamp"],"importance":3,"importance_reason":"在完整 Lindblad 生成元下给出含相互作用且严格可解的非互易多体模型：只对自旋-↓ 施加非互易损耗，相互作用仍把方向性搬到完全不接浴的 ↑ 扇区，\\( U=4J \\) 时激发由互易扩散转为近似单向传播，谱函数上留下可判读指纹，且机制对局域 Hubbard 相互作用成立。对超导线路的工程耗散与非互易输运（片上隔离器、定向放大）有概念层面的设计价值，并可作为检验非厄米近似的严格基准；但全对全相互作用在当前硬件上没有直接实现，结论限于单粒子线性响应，故为可读而非应读。","summary":"在一维 spin-1/2 费米子链上加入全对全 Hatsugai–Kohmoto 相互作用，并只在自旋-↓ 扇区施加非互易损耗，完整 Lindblad 动力学仍严格可解；相互作用把方向性传递到完全不接浴的 ↑ 扇区，\\( U=4J \\) 时 ↑ 激发由互易扩散变为近似单向传播，二阶自能表明局域 Hubbard 相互作用同样有效。","problem":"开放量子多体系统中的非互易输运通常由储库工程直接写入：把结构化环境耦合到体系，用 Lindblad 耗散打破反演对称。但一旦加入相互作用，Lindblad 层面的可解性几乎立刻丧失，绝大多数工作退回 no-click 近似，用有效非厄米哈密顿量代替完整生成元，代价是丢弃量子跳跃与随机轨迹平均；另一些工作依赖数值积分，体系尺寸受限且难以给出机制层面的解释。由此留下一个明确的问题：相互作用能否把储库赋予某一自由度的非互易性「搬运」到没有直接接浴的自由度上，这种搬运能否在完整 Lindblad 框架内被严格证明，以及它在动量分辨的谱函数上留下什么可测量的印记。此前没有模型能同时满足「含相互作用」「完整 Lindblad」「严格可解」三点，因而该问题一直停留在数值观察。","method":"模型是一维 spin-1/2 费米子链，跃迁 \\( J \\)，并加入全对全的 Hatsugai–Kohmoto 相互作用 \\( U\\sum_k n_{k\\uparrow}n_{k\\downarrow} \\)。它保持质心动量、在每个 \\( k \\) 上耦合两个自旋扇区，因此 Liouvillian 按 \\( k \\) 块对角。耗散只作用在自旋-↓ 扇区：均匀增益 \\( \\kappa_\\downarrow \\) 与两体非互易损耗 \\( \\gamma_{k\\downarrow}=2\\gamma_\\downarrow(1-\\sin k) \\)，后者在 \\( k\\to-k \\) 下不对称。作者不取 no-click 近似，直接在完整生成元下写单粒子算符的运动方程，其中两体项 \\( n_{\\bar\\sigma}c_\\sigma \\) 的方程只依赖自身，层级在此闭合。转到频域后每个 \\( k \\) 化为 2×2 非厄米矩阵，其行列式给出两个极点，推迟格林函数因此是有理函数并写成 \\( G^{R}=[\\omega-\\varepsilon_k-\\Sigma_{\\uparrow}(k,\\omega)]^{-1} \\)，由此定义精确自能。为说明机制不依赖 HK 的特殊性，作者对驱动-耗散 Fermi–Hubbard 链做二阶展开，把相互作用换成粒子–空穴自能。数值取 \\( L=128 \\)。","result":"其一，非互易性可以跨扇区传递：在 \\( \\kappa_\\downarrow=1.5J \\)、\\( \\gamma_\\downarrow=0.5J \\) 且 ↑ 扇区完全不接浴时，\\( U=0 \\) 的激发按紧束缚 Bessel 型轮廓互易扩散；\\( U=4J \\) 时左行光锥被压制，后时演化近似单向右行，一阶矩随 \\( U \\) 单调右移。其二，机制在谱函数上可见：弱而均匀的增益损耗下两支结构仍保留、只是被展宽；换成非互易损耗后，在损耗最小的 \\( k^{\\star}\\simeq\\pi/2 \\) 上支变锐并占主导，远离该点则下支接管并展宽；增益升到 \\( 1.5J \\) 时低能带消失，\\( U\\gg\\kappa_\\downarrow\\gg\\gamma_\\downarrow \\) 极限回到非互易的无相互作用谱。小 \\( U \\) 下 HK 自能的首项正比于 \\( n_{k\\downarrow} \\)、次项为粒子–空穴型，与 Hubbard 结果同构，故自能对 \\( k\\to-k \\) 不对称；取 \\( U=2J \\)、\\( \\gamma_\\downarrow=2J \\)、\\( \\kappa_\\downarrow=0.2J \\) 的 Hubbard 链同样出现方向性传播。值得强调，稳态本身不被相互作用改变，被改变的是对线性扰动的响应。","contribution":"此前非互易多体研究要么停在无相互作用情形（可解析但无相互作用物理），要么用 no-click 近似或数值方法处理相互作用（丢掉完整 Lindblad 或失去解析控制）。本文给出两者兼得的极小模型：HK 相互作用的质心动量守恒使 Liouvillian 块对角，从而在保留全部量子跳跃的前提下严格可解，并把非互易性的来源归结为相干通道与耗散通道在相互作用下的杂化，使得方向性出现在未接浴的扇区。更可迁移的是其归约论证：HK 只是不能传递动量的特例，一般 \\( U(q) \\) 相互作用给出同一粒子–空穴自能结构，因此谱重的不对称再分配与动量选择性线宽变窄可作为判定相互作用介导非互易性的通用指纹。","limitation":"可解性依赖全对全且只依赖质心动量的 HK 相互作用，这在冷原子或超导电路中都没有直接实现，作者也没有给出实验方案或参数估计，「从严格可解模型到普适行为」的后半句是靠二阶微扰论证而非硬件可行性论证。严格结果只覆盖单粒子激发与线性响应：↑ 激发被假设对 ↓ 扇区无 back-action，↓ 稳态取 Gaussian 且粒子数固定，激发密度稍高即失效，多激发、高阶关联与纠缠动力学均未处理。Hubbard 部分只做到二阶，既没有截断的误差控制，也没有与精确对角化或张量网络结果对照。全文限于一维、无无序、无有限温度，损耗取理想化形式。由于稳态不随 \\( U \\) 改变，所有非互易效应都是暂态的，须在有限时间窗口内做时间分辨加动量分辨测量，而这类测量在当前平台上的可行性未被讨论。","key_numbers":["\\( L=128 \\)，\\( \\kappa_\\downarrow=1.5J \\)、\\( \\gamma_\\downarrow=0.5J \\) 时 \\( U=4J \\) 的 ↑ 激发由互易变为有效单向","谱函数交叉点 \\( k^{\\star}\\simeq\\pi/2 \\)：上支 \\( \\varepsilon_k+U \\) 线宽最窄、谱重占优","\\( \\kappa_\\downarrow=1.5J \\) 时低能带消失，\\( U\\gg\\kappa_\\downarrow\\gg\\gamma_\\downarrow \\) 极限回到非互易无相互作用谱","HK 自能二阶项 \\( U^{2}n_{k\\downarrow}(1-n_{k\\downarrow})/(\\omega-\\varepsilon_k+i\\Gamma_{k\\downarrow}) \\)","Hubbard 链 \\( U=2J \\)、\\( \\gamma_\\downarrow=2J \\)、\\( \\kappa_\\downarrow=0.2J \\) 仍出现方向性传播","\\( \\gamma_{k\\sigma}=2\\gamma_\\sigma(1-\\sin k) \\)，\\( n_{k\\downarrow}=\\kappa_\\downarrow/\\Gamma_{k\\downarrow} \\)"],"url":"https://doi.org/10.1103/hm5z-844n","read_depth":"预印本全文 arXiv:2604.07346v1","abstract":"Reservoir engineering has emerged as a powerful paradigm to realize non-reciprocal dynamics in open quantum many-body systems. Here, we show that density-density interactions can transfer bath-induced non-reciprocity between different degrees of freedom. Specifically, we investigate a one-dimensional lattice of spin-1/2 fermions with all-to-all Hatsugai-Kohmoto interactions in the presence of an engineered reservoir. We establish the exact solvability of the Lindbladian dynamics and show that the interplay between non-reciprocity and interactions qualitatively reshapes the dynamics of excitations. Remarkably, interactions induce directional drift even in spin sectors that are not directly coupled to the reservoir. By analyzing a driven-dissipative Fermi-Hubbard chain, we show that the same mechanism persists for local interactions. The Hatsugai-Kohmoto model thus emerges as a minimal, exactly solvable platform for interaction-mediated non-reciprocal many-body dynamics.","abstract_zh":"储库工程已成为在开放量子多体系统中实现非互易动力学的有力范式。本文表明，密度–密度相互作用可以把储库诱导的非互易性在不同自由度之间转移。作者研究一维 spin-1/2 费米子晶格，在人工储库存在下加入全对全 Hatsugai–Kohmoto 相互作用：既证明 Lindblad 动力学严格可解，又显示非互易性与相互作用的竞争定性改变了激发动力学，且即使某些自旋扇区并未直接耦合储库，相互作用也能在其中诱导方向性漂移。通过分析驱动-耗散 Fermi–Hubbard 链，作者进一步表明同一机制对局域相互作用依然成立。Hatsugai–Kohmoto 模型由此成为相互作用介导的非互易多体动力学的极小且严格可解平台。","review":{"verdict":"小修","confidence":"高","correctness":"HK 部分的结果是可靠的：\\( U\\sum_k \\hat n_{k\\uparrow}\\hat n_{k\\downarrow} \\) 在动量空间对角，与 k-对角的跳变算符（\\( \\gamma_{k\\downarrow}=2\\gamma(1-\\sin k) \\)）一起使 Liouvillian 严格按 k 分块，单块 Fock 空间仅 4 维；SM 式 (3)–(22) 表明一阶矩 \\( \\hat c_{k\\uparrow} \\) 与 \\( \\hat n_{k\\downarrow}\\hat c_{k\\uparrow} \\) 的层级精确闭合为式 (5) 的 2×2 非厄米矩阵，无需任何截断，式 (6)(7) 的本征值、QRT 给出的 \\( G^{R}_{\\uparrow}(k,t) \\) 与 \\( A_{\\uparrow}=-2\\,\\mathrm{Im}\\,G^{R}_{\\uparrow} \\) 相互自洽，\\( D_k \\) 的非对角项来自 \\( \\kappa_{\\downarrow} \\)（有增益即无占据也能有源），物理上讲得通，式 (10) 的 HK 自能也确实与式 (16) 的 \\( q\\to0 \\) 极限一致。最吃紧的是 Sec. VI 的 generic 部分：式 (15) 由 \\( O(U^{2}) \\) 截断加 \\( \\rho_{\\mathrm{ref}}=|0\\rangle\\langle0|_{\\uparrow}\\otimes\\rho^{ss}_{\\downarrow} \\)（无 back-action、\\( \\downarrow \\) 取高斯态并施 Wick）得到，在 \\( U=2J \\)（带宽 \\( 4J \\)）下没有 \\( O(U^{3}) \\) 的估计，也没有与任何精确方法对照。此外该式本身有两处需核验：式 (15) 与 SM 式 (74) 中 \\( \\varepsilon_p-\\varepsilon_{p-q} \\) 的符号相反；按 SM 式 (58)(61)(62) 的频域变换，p-h 模衰减率是 \\( (\\Gamma_p+\\Gamma_{p-q})/2 \\)，分母应为 \\( \\omega-\\Omega_{kqp}+i(\\Gamma_p+\\Gamma_{p-q})/2 \\)，而两处都写成 \\( +2i(\\Gamma_p+\\Gamma_{p-q}) \\)，虚部大 4 倍。这会直接改变 \\( A_{\\uparrow} \\) 的线宽不对称度，不是排版问题。","weaknesses":"· 式 (15) 与 SM 式 (74) 内部不一致：\\( \\varepsilon_p-\\varepsilon_{p-q} \\) 符号相反，且由 SM 式 (61)(62) 与 \\( \\partial_t\\to-i\\omega \\) 得到的宽度应为 \\( i(\\Gamma_p+\\Gamma_{p-q})/2 \\) 而非 \\( 2i(\\Gamma_p+\\Gamma_{p-q}) \\)，虚部大 4 倍；需给出正确表达式并说明对 Fig. 4 漂移量的影响\n· 「generic」只有单点证据：Fig. 4 固定 \\( U=2J,\\ \\kappa_{\\downarrow}=0.2J,\\ \\gamma_{\\downarrow}=2J \\)，没有 \\( U \\) 扫描、没有 \\( O(U^{3}) \\) 截断误差估计，也没有与 tDMRG、小尺寸全 Lindblad 对角化或量子轨迹对照，因此 local interaction 下「同一机制」目前是二阶计算的一个参数点\n· 非互易度未量化：全篇用 \\( X_p(t) \\)、\\( X_n(t) \\) 的一阶矩表示右向漂移，未给左右传播权重之比，也未做 \\( \\sin k\\to-\\sin k \\)（或翻转两格点损耗相位）后漂移是否反向的对照，无法排除「非对称线宽导致的包络偏斜」而非真正定向输运\n· 单激发线性响应：\\( \\uparrow \\) 扇区取 \\( \\kappa_{\\uparrow}=\\gamma_{\\uparrow}=0 \\)（Fig. 1）、只放一个 \\( \\uparrow \\) 激发、显式忽略 back-action，没有有限 \\( \\uparrow \\) 密度下的稳态流；摘要的 many-body dynamics 目前没有对应算例\n· 「可解性」来源偏弱：all-to-all 且 k-对角的 HK 使稳态占据 \\( n_{k\\downarrow}=\\kappa_{\\downarrow}/[\\kappa_{\\downarrow}+2\\gamma(1-\\sin k)] \\) 与 \\( U \\) 无关，相互作用只以 Hartree 移动与 \\( n(1-n) \\) 涨落项进入，且 HK 的空间密度本就均匀（Fig. 3 的平坦背景），因果链比标题暗示的窄\n· 结论依赖精确调零：\\( \\gamma_{k\\downarrow}=2\\gamma(1-\\sin k) \\) 在 \\( k=\\pi/2 \\) 恰为零（该模 \\( n^{ss}=1 \\)，涨落因子 \\( n(1-n) \\) 同时为零），漂移的幅度与方向都依赖这个测度零的调零点与 \\( \\sin k \\) 的符号约定；给 \\( \\gamma_k \\) 加有限底值后结论是否保持未讨论\n· Fig. 2 的对照不干净：(a) 取 \\( \\gamma_{\\downarrow}=\\kappa_{\\downarrow}=0.2J \\) 且无 \\( \\gamma_{\\uparrow} \\)，(b)(c) 改为 \\( \\gamma_{\\downarrow}=0.5J \\)、\\( \\kappa_{\\downarrow}=0.5J/1.5J \\) 并额外加 \\( \\gamma_{\\uparrow}=0.4J \\)，于是「只展宽」与「占据重新加权」的差别同时混入了总耗散强度与 \\( \\uparrow \\) 自身展宽","overclaim":"摘要「We establish the exact solvability of the Lindbladian dynamics」偏大：真正精确的是 Liouvillian 按动量分块，以及一阶矩与选定关联函数的闭合层级（\\( D_k \\)、\\( M_{kq} \\)），不是整个 Lindblad 动力学的一般解，宜写成 the Liouvillian block-decomposes in momentum and the first moments close exactly。更要紧的是「we show that the same mechanism persists for local interactions」：证据只有一条 \\( O(U^{2}) \\) 截断的自能在单点的图，既无截断误差控制也无精确对照，宜降为 a second-order calculation indicates that ...。此外「non-reciprocal many-body dynamics」中的 many-body 目前只是「无关联背景上的单个激发」，宜限定为 single-excitation linear response。","citations":"应与已有的相互作用介导非互易性结果对照：激子–声子/电子–光子耦合导致方向性输运的理论工作，以及冷原子中用耗散工程实现 chiral current 的实验，说明本机制与「bath 直接耦合」路线的差别。HK 模型需引用其作为可解非费米液体模型的原始文献及在莫特转变、超导中的应用，并说明开系统语境下是否已有先例。关于 \\( O(U^{2}) \\) 自能，应对照 Fermi–Hubbard 的 DMFT/TPSC 二阶自能与 tDMRG 弛豫数据以标定截断精度；非互易输运的量化宜引用量子输运中 reciprocity 与整流比的标准定义。","questions":"① 式 (15) 与 SM 式 (74) 中 \\( \\varepsilon_p-\\varepsilon_{p-q} \\) 的符号相反，且按 SM 式 (61)(62) 宽度应为 \\( i(\\Gamma_p+\\Gamma_{p-q})/2 \\) 而两处写成 \\( 2i(\\Gamma_p+\\Gamma_{p-q}) \\)；正确的是哪一个，修正后 Fig. 4 的漂移量改变多少？\n② 在 \\( U=2J \\)、带宽 \\( 4J \\) 处，\\( O(U^{3}) \\) 项的相对大小是多少？能否用 tDMRG 或小尺寸全 Lindblad 演化/量子轨迹给出对照？\n③ 若把 \\( \\sin k \\) 换成 \\( -\\sin k \\)（翻转两格点损耗的相对相位），漂移是否严格反向？能否给出左右传播权重之比随 \\( U,\\kappa_{\\downarrow},\\gamma_{\\downarrow} \\) 的标度？\n④ 有限 \\( \\uparrow \\) 密度（如半满 \\( \\uparrow \\)）下是否仍有单向漂移或稳态流？此时 k-分块仍成立，为何不作这个更「many-body」的算例？\n⑤ 实验上如何实现「每个动量模式均匀增益 \\( \\kappa_{\\downarrow} \\)」与 \\( \\gamma_{k\\downarrow} \\) 在 \\( k=\\pi/2 \\) 的精确零点？给 \\( \\gamma_k \\) 加有限底值后漂移还剩多少？","basis":"预印本全文（arXiv:2604.07346v1 PDF 全文，含 Sec. I–VII、Supplemental Material Sec. I–III 与参考文献）；正式版 Phys. Rev. Res. 10.1103/hm5z-844n 与预印本的差异未能核验"}},{"id":"pr-10.1103/7cnx-2krc","no":5,"topics":["噪声与开放系统","芯片与电路量子化","集体辐射与量子存储"],"source":"PR 系列","venue":"Physical Review Research","published":"2026-11-26","title":"Scaling law for optimal excitation storage and superradiant release in waveguide QED systems","title_zh":"波导 QED 系统中最优激发存储与超辐射释放的标度律","authors":["Wei Chen","Kuan-Ting Lin","Guin-Dar Lin","H. H. Jen"],"importance":4,"importance_reason":"研究对象正是超导比特阵列与共用馈线构成的波导 QED 架构，结论给出最优驱动比 \\((\\Omega/\\gamma)_{\\rm max}\\approx 2N_1/\\pi\\)、驱动时长 \\(\\tau\\approx 4/(N_1\\gamma)\\)，可作为集体存储与读出方案的设计公式；关联消失使平均场可用的论证也有方法价值。但它服务激发存储与释放，而非纠错、逻辑门或仿真算法，故评为应读而非必读。","summary":"在半无限波导中放置受驱与存储两个发射体集合，发现受驱集合远大于存储集合时集合间关联趋于零、受驱端可视为经典激发源，最优驱动满足 \\((\\Omega/\\gamma)_{\\rm max}\\approx 2N_1/\\pi\\)；据此提出三阶段存储—释放协议，存储集合反转度按 \\(1-\\langle n_2\\rangle\\propto N_1^{-1.47}\\) 逼近完全反转，单激发释放峰值发射率趋于 \\(2\\gamma\\)。","problem":"在波导 QED 与超导比特阵列中，把激发快速写入受亚辐射保护的存储端并按需读出，是量子存储、量子网络与量子电池的共同需求。受驱集合与存储集合通过波导介导的偶极—偶极相互作用耦合，早期动力学中相干驱动、集体耗散与集合间关联同时起作用；驱动增强后关联迅速积累，平均场描述失效，因此最优转移条件缺乏解析刻画。以往工作多停留在单发射体或小规模集合的数值扫描，没有回答存储端激发数、驱动强度与集合尺寸之间如何标度，也没有给出可直接用于超导电路的设计规则。","method":"考虑 \\(x=0\\) 处为反节点镜面的半无限波导，受驱集合置于驻波反节点 \\(x_i=(i+1/2)\\lambda_0\\)，存储集合置于节点 \\(x_i=(i+3/4)\\lambda_0\\)。马尔可夫近似下写出含集体耗散与偶极—偶极相互作用的主方程，\\(\\gamma_{ij}\\)、\\(g_{ij}\\) 由间距与镜像项给出。引入集体自旋算符后，系统约化为一个受驱耗散自旋与一个无耗散自旋：驱动增强为 \\(\\sqrt{N_1}\\Omega\\)，集体衰减率 \\(2N_1\\gamma\\)，交换耦合 \\(\\sqrt{N_1N_2}g\\)。以连通关联 \\(C_{12}=\\langle S_1^{\\dagger}S_2\\rangle-\\langle S_1^{\\dagger}\\rangle\\langle S_2\\rangle\\) 判断平均场是否可用；在 \\(N_1\\gg N_2\\) 且驱动取特定值时 \\(C_{12}\\approx 0\\)，算符期望可因子化，解析得无耗散最优条件 \\(\\Omega t=\\frac{1}{2}\\arccos(1-2\\pi\\Omega/(gN_1))\\) 及上界 \\(\\Omega/g\\le N_1/\\pi\\)；含耗散时用数值主方程扫描拟合。三阶段协议为：最优方脉冲驱动、以 \\(\\Delta/\\gamma=500\\) 失谐并关断驱动进入存储、恢复共振触发超辐射释放。","result":"对 \\((N_1,N_2)=(12,1)\\)，\\(\\Omega/\\gamma\\approx 7.63\\) 时存储集合激发数逼近 1；\\(\\Omega/\\gamma=20\\) 因交换耦合太弱只余快速 Rabi 振荡，=1 则被 \\(12\\gamma\\) 集体弛豫压制。最优峰值激发随受驱集合增大饱和，拟合得 \\(1-\\langle n_2\\rangle_{\\tau,{\\rm max}}\\propto N_1^{-1.47}\\)；标度律 \\((\\Omega/\\gamma)_{\\rm max}\\approx 2N_1/\\pi\\) 在 \\(N_1\\gg N_2\\) 区与数值吻合，约为无耗散上界 \\(N_1/\\pi\\) 的两倍。最优时长 \\(\\tau\\approx 4/(N_1\\gamma)\\)，取 \\(\\gamma=2\\pi\\times 0.5\\) MHz、\\(N_1=12\\) 得 \\(\\tau=106\\) ns、\\(\\Omega\\approx 2\\pi\\times 3.8\\) MHz。释放峰值发射率在 \\(N_1>N_2\\) 时超过 Dicke 极限 \\(\\gamma_D=N_2(N_2/2+1)\\gamma/2\\)；\\(N_2=1\\) 时解析给出 \\(\\gamma_{\\rm tot,max}/\\gamma\\to 2\\)。非辐射衰减 \\(\\varepsilon=0.05\\) 明显削弱存储。","contribution":"给出了一条可解析的集体系综激发转移标度律：最优驱动比只依赖受驱集合尺寸 \\(N_1\\)，且在大不对称极限下集合间关联消失，使平均场从近似变为可验证的描述。这把此前针对单发射体或小集合的充电—电池式方案推广到可按尺寸标度设计的多体协议，并说明亚辐射保护可由发射体与自身镜像的干涉提供，比依赖空间分离反称叠加的暗态方案更耐纯去相位。对超导比特阵列—馈线架构，文中给出的脉冲强度、时长与失谐量可直接作为实验参数起点。","limitation":"模型限定在一维半无限波导、马尔可夫近似、全同二能级发射体，且位置严格取在节点与反节点；实际电路中的位置无序、耦合色散与非马尔可夫记忆会破坏相消干涉。数值扫描的集合规模有限（正文示例 \\(N_1=12\\)），\\(1-\\langle n_2\\rangle\\propto N_1^{-1.47}\\) 的指数来自拟合而非解析推导，向更大 \\(N_1\\) 外推需谨慎。平均场仅在 \\(t\\le\\tau\\) 的早期窗口成立，存储阶段依赖瞬时大失谐与 10 ns 量级的快速调频，未讨论调频过程中的非绝热误差与串扰。解析的释放极限只对 \\(N_2=1\\) 给出，多激发存储的释放效率、发射光子纯度与多模特性均未量化，也没有实验验证。","key_numbers":["最优驱动比 \\((\\Omega/\\gamma)_{\\rm max}\\approx 2N_1/\\pi\\)，\\(N_1=12\\) 时为 7.63","最优存储的未转移比例 \\(1-\\langle n_2\\rangle_{\\tau,{\\rm max}}\\propto N_1^{-1.47}\\)","最优驱动时长 \\(\\tau\\approx 4/(N_1\\gamma)\\)，\\(\\gamma=2\\pi\\times 0.5\\) MHz、\\(N_1=12\\) 时 \\(\\tau=106\\) ns，\\(\\Omega\\approx 2\\pi\\times 3.8\\) MHz","存储阶段失谐 \\(\\Delta/\\gamma=500\\)，受驱集合可在 10 ns 内完成失谐与关断","\\(N_2=1\\) 时释放峰值发射率 \\(\\gamma_{\\rm tot,max}/\\gamma\\to 2\\)（\\(N_1\\to\\infty\\)），超过单自旋极限","非辐射衰减 \\(\\varepsilon=0.05\\) 时存储阶段激发显著流失，\\(\\varepsilon\\sim 10^{-2.5}\\) 时性能接近无损耗"],"url":"https://doi.org/10.1103/7cnx-2krc","read_depth":"预印本全文 arXiv:2607.17320v1","abstract":"Driven-dissipative quantum emitters provide a powerful platform for controllable excitation storage and release, with promising applications in quantum batteries and quantum storage. Yet, transient excitation transfer in collective many-body systems is often obscured by the intricate interplay among coherent driving, dissipation, and correlation dynamics. Here, we uncover a scalable excitation-storage mechanism in two emitter ensembles coupled to a semi-infinite waveguide. A coherently driven ensemble acts as an effective excitation reservoir, while a second ensemble positioned near a dissipative node serves as a subradiant storage medium. Surprisingly, when the driven ensemble largely exceeds the storage ensemble in size, the transfer dynamics enters a nearly correlation-free regime, allowing the driven ensemble to behave effectively as a classical excitation source. This reveals a simple scaling law for optimal excitation transfer, under which the storage ensemble approaches near-complete population inversion as the driven ensemble size increases. Building on this mechanism, we propose a three-stage storage-and-release protocol enabling fast excitation storage and controllable photon emission. Our results demonstrate how coherent and dissipative collective interactions can be jointly harnessed for quantum energy storage and programmable nonequilibrium dynamics in waveguide QED platforms.","abstract_zh":"受驱耗散量子发射体为可控激发存储与释放提供了平台，可用于量子电池与量子存储；但集体多体系统中的瞬态激发转移常被相干驱动、耗散与关联动力学的交织所掩盖。本文在两个耦合于半无限波导的发射体集合中发现可标度的激发存储机制：受驱集合充当有效激发库，位于耗散节点附近的第二个集合充当亚辐射存储介质。当受驱集合远大于存储集合时，转移进入近乎无关联的区域，受驱集合可视为经典激发源，由此得到最优转移的简单标度律；随着受驱集合增大，存储集合逼近完全反转。基于该机制，作者提出三阶段存储与释放协议，实现快速激发存储与可控光子发射，表明相干与耗散集体相互作用可被联合用于波导 QED 平台的量子能量存储与可编程非平衡动力学。","review":{"verdict":"大修","confidence":"高","correctness":"几何设定可信：驱动系综在 \\( x_i=(i+1/2)\\lambda_0 \\)、存储系综在 \\( (i+3/4)\\lambda_0 \\)，组内均匀耦合、交叉耦合同为 g12 = γ、存储发射体自衰减为零，对波导绝热消除后得式 (4) 的集体主方程，这一步是标准的；⟨n1,2⟩ = (⟨S1,2z⟩ + 1)/2 与 γtot = 2N1γ⟨S1†S1⟩ 的定义也一贯，三阶段（驱动、淬灭存储、回共振释放）的物理图像清楚。最吃紧的是式 (6)–(8)：解 ⟨S1⟩、⟨S2⟩ 时把 ⟨S2z⟩ 冻结在 −1，随后又把解出的 ⟨S2z⟩ 从 −1 走到 +1 当作完全转移判据，故式 (8) 只在相位 φ ≪ 1 时成立；所谓 strict upper bound Ω/g ≤ N1/π 正是该零阶解的自洽性边界而非物理上界，Fig. 2(a) 中间面板的峰值恰在 7.63 附近、等于 2N1/π，正是这一点的直接证据，但正文未把它作为近似失效的信号来讨论。其次 τ ≈ 4/(N1γ) 与式 (9) 联立给出 Ωτ ≈ 8/π ≈ 2.55，与 N1 无关，说明两条标度律实质是同一个固定脉冲面积条件。1−⟨n2⟩ ∝ N1^−1.47 无解析论证。附录 B 初态为系综 2 单激发、系综 1 全基态，故 γtot,max → 2γ 属单激发加镜像增强，与超辐射释放的措辞不符。数值自洽性尚可：N1 = 12、γ = 2π×0.5 MHz 时 τ = 106 ns、Ω ≈ 2π×3.8 MHz 与 7.63 相符；但第 500 行 Ω/γ ≈ π/24 ≈ 7.63 应为 24/π ≈ 7.64。","weaknesses":"· 式 (7) 的推导在 \\( \\langle S_1\\rangle \\)、\\( \\langle S_2\\rangle \\) 方程中把 \\( \\langle S_2^z\\rangle \\) 冻结在 −1，却用其结果反推 \\( \\langle S_2^z\\rangle \\) 走到 +1；请给出该近似的自洽性判据（\\( \\varphi \\) 的二阶修正），并说明 Fig. 3(a) 中「\\( \\Omega/g\\approx 3.82 \\) 处转移唯一最优」是否只是近似的失效线而非物理边界。\n· 由 \\( \\tau\\approx 4/(N_1\\gamma) \\) 与 \\( (\\Omega/\\gamma)_{\\mathrm{max}}\\approx 2N_1/\\pi \\) 直接得到 \\( \\Omega\\tau=8/\\pi\\approx 2.55 \\)，与 N1 无关：Fig. 4 与 Fig. 6 的两条「标度律」不是彼此独立的证据，而是同一个「固定脉冲面积」条件的两种写法。\n· \\( 1-\\langle n_2\\rangle_{\\tau,\\mathrm{max}}\\propto N_1^{-1.47} \\) 是纯数值拟合，未给拟合区间与误差棒，也没有解析论证为何指数是 1.47 而非 1 或 2，而这正是「驱动系综规模决定转移效率」这一核心主张的定量依据。\n· 附录 B 的初态是系综 1 全基态、系综 2 单激发，故 \\( \\gamma_{\\mathrm{tot,max}}\\to 2\\gamma \\) 是单激发被镜像增强的结果，不能支撑「superradiant release / beyond the Dicke limit」；且文中基线 \\( \\gamma_D=N_2(N_2/2+1)\\gamma/2 \\) 在 N2 = 1 时给 0.75γ，与 B7 的严格值 2γ 差近 3 倍，基线口径需统一。\n· 互相关 \\( C_{12} \\) 只在 (N1, N2) = (12, 1) 给出，正文未写出其定义式，也未做 \\( 1/N_1 \\) 归一或标度；而 N2 = 1 恰是量子涨落最大、mean-field 最不可靠的一端，用最不利尺寸去论证「mean-field 严格成立」说服力不足。\n· 只报检索阶段的峰值发射率，未给存储-释放的能量/光子数效率、未扫存储时长（Fig. 7、Fig. 8 固定 \\( \\gamma t=5 \\)）、也未给相位或保真度；对「quantum memory / quantum battery」的定位而言这些是必需指标。\\( \\Delta/\\gamma=500 \\) 时残余交换约 \\( g^2N_1N_2/\\Delta\\approx 0.02\\gamma \\) 与存储阶段 \\( \\langle n_2\\rangle \\) 的衰减量未做定量对照。\n· 图注与正文尺寸不一致：Fig. 7(b,c) 标 N1 = 6, 7, 8 而正文与 Fig. 8 对应处为 5, 6, 7；第 500 行「Ω/γ ≈ π/24 ≈ 7.63」应为 24/π ≈ 7.64；第 244 行「\\( \\sqrt{N_1}\\gamma=12\\gamma \\)」在 N1 = 12 时与 \\( \\sqrt{N_1}\\gamma=3.46\\gamma \\)、集体耗散率 \\( 2N_1\\gamma=24\\gamma \\) 均不自洽，请核对。","overclaim":"摘要与结论有四处表述超出证据。「strict upper bound」应改为零阶 mean-field 解的自洽性条件，并说明它在相位不小时失效；「beyond the Dicke limit」宜限定为 N2 ≥ 3、N1 ≫ N2 的尺寸，并说明 N2 = 1 时基线 0.75γ 本不适用；「near-complete population inversion」在 N2 = 1 时只是单个激发的占据，应改为单激发存储概率趋近 1；量子电池的定位目前只有激发数布居，既无能量与功的定义，也无 ergotropy 与充电功率的量化，更未与已有的 collective charging 结果对比，宜删去或降格；「robust against pure dephasing」应限定为 γφ = γnr = ϵγ 的对角扫描结论，而非一般性质。","citations":"建议与四类结果对照：亚辐射与暗态存储方案在同一 (N1, N2)、同一 γ 下的存储时间与检索效率，用一张表与本文三阶段协议并列；波导 QED 中 collective charging advantage 的判据，用以判断布居转移是否真的带来能量优势；单激发镜像增强与多激发 Dicke 超辐射的严格解，界定 γtot,max → 2γ 的地位；超导波导 QED 器件中 γ、γnr、γφ 的实测分布，用于给出时间预算。另可补引失谐淬灭非绝热激发的既有分析。","questions":"① 式 (7) 在推导 \\( \\langle S_1\\rangle \\)、\\( \\langle S_2\\rangle \\) 时取 \\( \\langle S_2^z\\rangle=-1 \\)，而式 (8) 的转移条件对应 \\( \\langle S_2^z\\rangle=+1 \\)；请给出自洽性判据与 \\( \\varphi \\) 的二阶修正，并说明「\\( \\Omega/g\\le N_1/\\pi \\) 是严格上界」是否仍然成立？\n② \\( \\tau \\) 与 \\( (\\Omega/\\gamma)_{\\mathrm{max}} \\) 的标度合起来给出 \\( \\Omega\\tau\\approx 8/\\pi \\)，与 N1 无关；这是否意味着最优转移本质上只是「固定脉冲面积」？两条标度律还有独立的物理内容吗？\n③ \\( 1-\\langle n_2\\rangle\\propto N_1^{-1.47} \\) 的拟合区间、误差与解析依据是什么？若 N1 增至 10² 量级，转移误差是否仍按此外推？\n④ 附录 B 的单激发初态下 \\( \\gamma_{\\mathrm{tot,max}}\\to 2\\gamma \\) 与正文的「superradiant release、beyond Dicke」如何统一？N2 ≥ 2（尤其 N2 ≫ 1）时峰值发射率与同尺寸 Dicke 值的比值是多少？\n⑤ 若定位为量子存储，请给出 \\( \\gamma t=5 \\) 之后的检索效率、输出光子波包的输入-输出场计算，以及 \\( \\Delta/\\gamma=500 \\) 淬灭引入的寄生激发量。","basis":"仅读到 arXiv:2607.17320v1 预印本全文（含附录 A–C），未核验 PRR 正式版，正式版的式号、数值与附录内容可能不同。"}},{"id":"pr-10.1103/l4my-k76y","no":6,"topics":["测控与脉冲","量子最优控制","光镊与中性原子"],"source":"PR 系列","venue":"Physical Review Research","published":"2026-11-26","title":"Optimal recoil-free state preparation protocols in an optical atom tweezer","title_zh":"光镊中无反冲态制备的最优协议","authors":["Lia Kley","Nicolas Heimann","Aslam Parvej","Lukas Broers","Ludwig Mathey"],"importance":3,"importance_reason":"光镊平台本身不在本刊两个主题内，但论文把 Rabi 脉冲的幅相与可移动势阱放进同一最优控制框架，系统处理了「驱动同时激励运动自由度、造成泄漏」这一与超导门校准同构的问题；三区划分、\\(j=-\\eta\\) 判据与幅值/速度约束的处理可直接迁移到超导脉冲标定与泄漏抑制。方法可迁移性明确，但对象是中性的原子与真实光镊，平台特异性强，故给 3 分。","summary":"针对光镊中单光子 Rabi 脉冲经 Lamb-Dicke 耦合把原子踢出运动基态的问题，用 PEPR 脉冲工程联合优化 Rabi 幅相与光镊位移，在慢、中、快三个参数区分别把 \\(|\\downarrow,0\\rangle\\to|\\uparrow,0\\rangle\\) 的不保真度压到约 \\(10^{-6}\\)、\\(10^{-10}\\) 与 \\(10^{-7}\\)–\\(10^{-4}\\)。","problem":"光镊中的中性原子量子计算要求单比特操作保真度远高于当前水平，而单光子 Rabi 脉冲会通过 Lamb-Dicke 耦合把光子反冲动量交给原子，使系统跃迁出由内态与运动基态构成的逻辑子空间。仅靠初态边带冷却无法解决操作过程中的反冲加热，固定形状的 \\(\\pi\\) 脉冲在有限势阱中必然留下振动态布居。已有最优控制工作多面向超导、离子或里德堡门，针对光镊中反冲—运动耦合的系统性脉冲设计仍然缺位，简单的反冲补偿脉冲也只在部分参数区有效。","method":"把原子建模为两个内态与频率 \\(\\omega_0\\) 的谐波阱，驱动含 Lamb-Dicke 因子 \\(e^{i\\eta(a+a^{\\dagger})}\\)，光镊位置 \\(r(t)\\) 可移动，等效为归一化回复力 \\(f_{\\rm tw}(t)\\)；约束 \\(|\\Omega|\\le\\Omega_{\\rm max}\\)、\\(|\\partial_t r|\\le v_{\\rm max}=500\\) m/s，并以 \\(\\sigma_z\\) 引入去相位 \\(\\gamma_z\\)。目标 \\(|\\downarrow,0\\rangle\\to|\\uparrow,0\\rangle\\)，运动态截断 \\(n_{\\rm max}=3\\)，不保真度 \\(1-F=1-{\\rm Tr}(\\rho_*\\rho(t_f))\\)。用 PEPR 计算保真度对 \\(B_x\\)、\\(B_y\\)、\\(B_f\\) 的敏感度并按正弦基投影更新。对照组为裸 Rabi 脉冲、解析反冲补偿脉冲（\\(\\int f_{\\rm tw}dt=-\\eta\\)）及投影力协议。以 \\(^{171}\\)Yb 取 \\(\\eta=0.505\\)、\\(\\omega_0=2\\pi\\times 50\\) kHz、\\(\\Omega_{\\rm max}=1\\)–\\(10\\) MHz，按 \\(\\Omega_{\\rm max}/\\omega_0\\) 分慢、中、快三区。","result":"无耗散扫描 \\(\\Omega_{\\rm max}\\) 与脉冲面积得到三个高保真平台：慢区 \\(\\Omega_{\\rm max}/\\omega_0\\lesssim 0.3\\)、\\(t_f\\Omega_{\\rm max}/\\pi\\approx 1.3\\) 时不保真度约 \\(10^{-6}\\)；快区 \\(\\gtrsim 3\\)、\\(t_f\\Omega_{\\rm max}/\\pi\\gtrsim 1.1\\) 时 \\(10^{-7}\\)–\\(10^{-4}\\)；中区 \\(\\Omega_{\\rm max}/\\omega_0\\approx 1\\) 可达 \\(10^{-10}\\)，为全局最优。快区光镊位移是主要手段，去掉回复力后反冲抑制基本消失；最优力协议的归一化冲量收敛到 \\(j=-\\eta\\)。相比恒定力，反冲补偿协议把相空间最大动量压低三个数量级、最大位移压低两个数量级。有去相位时不保真度出现约 \\(\\gamma_z t_f\\) 下界；\\(\\gamma_z=2\\times 10^{-7}\\omega_0/2\\pi\\) 时最优协议最多改进六个数量级，\\(2\\times 10^{-4}\\) 时仍改进约三个数量级。\\(t_f\\omega_0\\approx 2\\pi\\)–\\(4\\pi\\) 处存在高保真平台；快区重复正反力协议可在多次操作中把激发限制在逻辑子空间。","contribution":"把 Rabi 幅相与光镊位移放在同一优化框架中，给出覆盖慢、中、快三个区间的无反冲态制备协议，并指出中区（\\(\\Omega_{\\rm max}\\approx\\omega_0\\)）可获得 \\(10^{-10}\\) 量级不保真度这一此前未被强调的工作点。解析的反冲补偿 Rabi 协议在快区已接近数值最优，可确定性写入实验；三区划分与 \\(j=-\\eta\\) 判据为其他存在运动自由度的平台提供了设计直觉。对超导门校准而言，「驱动 + 可调耦合或位移」的联合优化与约束处理思路可直接迁移到泄漏抑制与脉冲标定。","limitation":"模型只含单个原子、两个内态与一维谐波阱，运动态截断在 \\(n_{\\rm max}=3\\)，未包含阱的非谐性、光镊强度噪声与里德堡态有限寿命；耗散只考虑 \\(\\sigma_z\\) 去相位，没有弛豫、电离与黑体辐射引起的损失，因此 \\(10^{-10}\\) 量级的不保真度是理想化下限。为简化，慢区与快区统一取 \\(\\eta=0.505\\)，而文中所述钟跃迁实际 \\(\\eta=0.2158\\)，慢区的定量结论需按真实 \\(\\eta\\) 重算。PEPR 是带随机初值的启发式优化，\\(10^5\\) 次更新与固定正弦模数不保证全局最优，结果对学习率与模数较敏感。所有结论来自数值模拟，未讨论实验中的标定误差、脉冲延迟与光镊位移的闭环控制精度。","key_numbers":["慢区最优不保真度约 \\(10^{-6}\\)（\\(\\Omega_{\\rm max}/\\omega_0\\lesssim 0.3\\)，\\(t_f\\Omega_{\\rm max}/\\pi\\approx 1.3\\)）","中区最优不保真度约 \\(10^{-10}\\)（\\(\\Omega_{\\rm max}/\\omega_0\\approx 1\\)）","快区不保真度 \\(10^{-7}\\)–\\(10^{-4}\\)（\\(\\Omega_{\\rm max}/\\omega_0\\gtrsim 3\\)，\\(t_f\\Omega_{\\rm max}/\\pi\\gtrsim 1.1\\)）","快区最优力协议归一化冲量 \\(j=-\\eta\\)，即 \\(\\int f_{\\rm tw}\\,dt=-\\eta\\)","去相位 \\(\\gamma_z=2\\times 10^{-7}\\omega_0/2\\pi\\) 时最优协议较反冲补偿 Rabi 协议改进至多 6 个数量级","光镊位移速度上限 \\(v_{\\rm max}=500\\) m/s，运动态截断 \\(n_{\\rm max}=3\\)"],"url":"https://doi.org/10.1103/l4my-k76y","read_depth":"预印本全文 arXiv:2411.02262v1（2024-11-04 版，与正式版可能有差异）","abstract":"Quantum computing in atom tweezers requires high-fidelity implementations of quantum operations. Here, we demonstrate the optimal implementation of the transition \\(|\\downarrow\\rangle \\rightarrow |\\uparrow\\rangle\\) of two levels, serving as a qubit, of an atom in a tweezer potential, driven by a single-photon Rabi pulse. The Rabi pulse generates a photon recoil of the atom, due to the Lamb-Dicke coupling between the internal and motional degree of freedom, driving the system out of the logical subspace. This detrimental effect is strongly suppressed in the protocols that we propose. Using pulse engineering, we generate optimal protocols composed of a Rabi pulse protocol and a force protocol, corresponding to dynamically displacing the tweezer. We generate these for a large parameter space, from small to large values of the Rabi frequency, and a range of pulse lengths. We identify three main regimes for the optimal protocols, and discuss their properties. In all of these regimes, we demonstrate infidelity well below the current technological standard, thus mitigating a universal challenge in atom tweezers and other quantum technology platforms.","abstract_zh":"光镊中的量子计算需要高保真度的量子操作。本文演示了光镊中原子两个能级（作为量子比特）之间 \\(|\\downarrow\\rangle\\to|\\uparrow\\rangle\\) 跃迁的最优实现，驱动为单光子 Rabi 脉冲。由于内态与运动自由度之间的 Lamb-Dicke 耦合，Rabi 脉冲会给原子带来光子反冲，使系统偏离逻辑子空间，所提协议显著抑制了这一有害效应。作者用脉冲工程生成由 Rabi 脉冲协议与对应光镊动态位移的力协议组成的最优方案，覆盖从小到大的 Rabi 频率与多种脉冲长度的大参数空间，并识别出三个主要区间及其性质。在所有区间中，不保真度都远低于当前技术标准，从而缓解了光镊及其他量子技术平台面临的普遍难题。","review":{"verdict":"大修","confidence":"高","correctness":"模型写得干净：式 (2) 用 \\( e^{i\\eta(a+a^\\dagger)} \\) 把反冲写进 Rabi 耦合，式 (3) 把光镊位移等价为线性力，式 (5) 用 L = σz 的 Lindblad 项描述退相位；目标是把 |↓,0⟩ 转到 |↑,0⟩，失真为 1−F = 1−Tr(ρ*ρ(tf))。约束写得也明确：18 个振幅模、18 个相位模与 3 个力模，|hx² + hy²| ≤ Ωmax² 与 |∂tr| < 500 m/s 逐点施加。数值可复现：ω0/2π = 50 kHz、η = 0.505，快速区 Ωmax = 1–10 MHz 给 1−F ~ 10^−4 至 10^−7，中间区 10^−10，慢速区 10^−6 且因 Debye-Waller 因子 e^{η²/2} ≈ 1.13 需要更大的脉冲面积，与 Fig. 2 的三区边界自洽；Fig. 10 中 (2n−1) 次序列的振荡相位 nπω0/Ωmax 与极小值位置也能复算。最吃紧的是三处：解析基准（反冲补偿 Rabi，冲量 −η）只是 η 的一阶构造，却在 η = 0.505 的非 Lamb-Dicke 区参与对比；全部失真都在 nmax = 3 的 8 维截断内计算，泄漏到 n > 3 的布居被静默丢弃；式 (23) 取随机构型集合的最小值，最优值本身没有分布信息。此外快速区把 |↑⟩ 取为 Rydberg 态却沿用与 |↓⟩ 相同的阱频与简谐势，慢速区又把 1S0–3P0 时钟跃迁称为微波激光驱动，这两处是模型设定与物理平台之间最需核验的接口。","weaknesses":"· 运动空间截断 \\( n_{\\mathrm{max}}=3 \\)（8 维）且全文无截断收敛性检验，\\( 1-F \\) 未按迹重新归一，泄漏到 \\( n>3 \\) 的布居被直接丢弃；快速区原子来不及跟随驱动的瞬态恰恰最容易越界，请给出 \\( n_{\\mathrm{max}}=5,8,10 \\) 的 \\( 1-F \\) 收敛曲线，或给出截断误差的解析上界。\n· 中间区 \\( 1-F=10^{-10} \\) 是 39 个控制参数（18 个振幅模＋18 个相位模＋3 个力模）在 8 维空间、10⁵ 次随机初值更新后取集合最小值的产物，既无重启次数统计也无收敛分布，且低于任何实验可达的噪声地板；这更像截断模型内的过参数化拟合，建议给 \\( 1-F \\) 的分布分位数而非最小值，并做参数敏感度分析。\n· 「well below current technological standards」「exceed the currently achieved fidelities」未给出该标准的任何具体数值与出处；且对比发生在无光子散射、无激光强度/相位噪声、无 Rydberg 有限寿命的模型内，所比较的对象根本不同。\n· 快速区把 \\( |\\uparrow\\rangle \\) 取为 Rydberg 3S1，却沿用与 \\( |\\downarrow\\rangle=3\\mathrm{P}_0 \\) 相同的 \\( \\omega_0 \\) 与同一简谐势（式 3、式 4）；Rydberg 态在 1064 nm 光镊中通常反俘获、极化率差极大，态依赖阱频与差分光移完全未进入模型，而本文自己引用的 OMGT 架构 [29] 恰以态依赖势阱著称。\n· 慢速区把 1S0–3P0 时钟跃迁写成「由微波激光驱动」，与该跃迁位于 578 nm、且 \\( \\eta=0.2158 \\) 只能由 578 nm 波矢给出的自洽性矛盾；同时全文两区都用 \\( \\eta=0.505 \\)（慢区真实值 0.2158），未给任何 \\( \\eta \\) 依赖的标度，慢区的 \\( 10^{-6} \\) 与 \\( e^{\\eta^2/2} \\) 修正脉冲面积都只是 \\( \\eta=0.505 \\) 的产物。\n· 慢速区最优恢复势的归一化冲量达 17ℏk（解析补偿只需 \\( j=-\\eta=-0.505 \\)），符号相反且量级差约 33 倍；正文只用「\\( \\omega_0t_f>1 \\)」一句带过，未说明其物理来源，也未讨论对应约 \\( 8.6x_0 \\) 的势阱位移在 \\( v_{\\mathrm{max}}=500 \\) m/s 与 50 kHz 阱下的实现代价。\n· 耗散只取 \\( L=\\sigma_z \\) 的纯退相位且 \\( \\gamma_z/\\omega_0 \\) 最大仅到 \\( 2\\times 10^{-4} \\)；按 \\( \\omega_0/2\\pi=50 \\) kHz 与实测约 kHz 量级的运动退相干/加热率，\\( \\gamma_z/\\omega_0 \\) 约 \\( 10^{-2} \\)，比图上最大值高约两个数量级，且模型没有加热项（\\( \\bar{n} \\) 增长）与光子反冲加热，故「耗散只设定下限、优化方案仍优于补偿 Rabi」的结论未覆盖真实参数；此外因补偿按 \\( j=-\\eta \\) 精确标定，未做 \\( \\eta \\)、\\( \\omega_0 \\)、\\( \\Omega_{\\mathrm{max}} \\) 的 ±5% 失配扫描。","overclaim":"三处表述超出证据。「well below current technological standards」与「exceed the currently achieved fidelities」从未给出该标准的数值与出处，且对比发生在无光子散射、无强度与相位噪声、无 Rydberg 寿命的理想模型内。「globally ideal regime」中的 10^−10 只在 nmax = 3 的截断空间成立，建议改为在截断与无噪声模型内的态转移误差，实验可达性未评估。「a universal challenge in atom tweezers」不成立，微波与超精细量子比特的波矢趋于零，本问题并不存在，应限定为光学单光子跃迁量子比特；「recoil-free」宜改为 η 的一阶反冲补偿。若保留这些措辞，正式版需给出同口径的实测误差表。","citations":"建议与五类工作对照：已有无反冲光量子比特门方案（Zhang 等 2024，即本文 [12]），说明补偿 Rabi 与其差异；光镊中运动基态保持门与边带分辨门的实测误差，以及态依赖光镊冷却 [9]，为 technological standard 提供数值；2024–2026 年光镊门的最优控制与闭环学习结果，回答两年间是否已有更优控制；OMGT 架构中 Rydberg 态与基态的差分光移、态依赖阱频实测 [29]；光镊运动加热率与退相干率实测值，把 γz/ω0 扫描推到 10^−2 量级。","questions":"① 把 \\( n_{\\mathrm{max}} \\) 从 3 提到 5、8、10 后，中间区 \\( 10^{-10} \\) 与快速区 \\( 10^{-4}\\sim 10^{-7} \\) 的最优失真分别如何变化？泄漏到 \\( n>3 \\) 的布居占比是多少？\n② 快速区 \\( |\\uparrow\\rangle \\) 取 Rydberg 3S1、\\( |\\downarrow\\rangle \\) 取 3P0 时，1064 nm 光镊中两者极化率差异导致的态依赖阱频与差分光移有多大？若两态阱频相差 10%–50%，快速区最优协议是否仍然有效？\n③ 慢速区把 1S0–3P0 时钟跃迁描述为「微波激光驱动」是否为笔误？若改用真实的 \\( \\eta=0.2158 \\)，慢速区的最优失真与所需脉冲面积如何变化？\n④ 慢速区恢复势的归一化冲量为何是 +17ℏk 而不是解析补偿的 \\( -\\eta=-0.505 \\)？它对应多大的阱位移，能否同时满足 \\( |\\partial_t r|<500 \\) m/s 且仍留在简谐近似内？\n⑤ 从 2024-11 本预印本到 2026 年正式发表约两年间，是否已出现更优的反冲不敏感/无反冲态制备方案（如无反冲光量子比特门、基态保持的最优控制门、态依赖光镊方案）？正式版是否做了定量对比，本文协议相对它们的增益是多少？","basis":"仅读到 arXiv:2411.02262v1（2024-11-04）预印本全文，距 PRR 2026-11 正式发表约两年，正式版的模型设定、截断与数值可能已修改，未能核验正式版。"}}]}</script>

  const STORE_KEY = "ftqc-digest-v2";
  const STATUS_LABEL = { inbox: "待读", reading: "在读", done: "已提炼" };
  const IMP_LABEL = { 5: "必读", 4: "高", 3: "中", 2: "参考", 1: "低" };
  const IMP_STYLE = {
    5: ["#c62828", "#fdeaea"],
    4: ["#1f4fd1", "#e9efff"],
    3: ["#087a5b", "#e3f6ee"],
    2: ["#9a5b00", "#fff3d6"],
    1: ["#6b7280", "#f0f1f1"]
  };
  const PALETTE = [
    ["#1f4fd1", "#e9efff"],
    ["#c2410c", "#fff0e6"],
    ["#087a5b", "#e3f6ee"],
    ["#6d45c7", "#f0eaff"],
    ["#9a5b00", "#fff3d6"],
    ["#b3266e", "#fde8f2"],
    ["#0e7490", "#e2f5f8"]
  ];
  const SOURCE_STYLE = {
    "arXiv": ["#c2410c", "#fff0e6"],
    "PRX": ["#1f4fd1", "#e9efff"],
    "PRX Quantum": ["#6d45c7", "#f0eaff"]
  };
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const esc = (v) => String(v == null ? "" : v)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  let store = {};
  try { store = JSON.parse(localStorage.getItem(STORE_KEY) || "{}") || {}; } catch (e) { store = {}; }
  const wf = (id) => store[id] || (store[id] = { status: "inbox", note: "" });
  const save = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) { toast("浏览器阻止本地存储，修改仅在当前页有效"); } };
  let toastTimer;
  function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1800); }
  const dateOnly = (v) => String(v || "").slice(0, 10);

  // topic palette, stable by first appearance
  const allTopics = [];
  ARTICLES.forEach(a => (a.topics || []).forEach(t => { if (!allTopics.includes(t)) allTopics.push(t); }));
  const topicColor = {};
  allTopics.forEach((t, i) => { topicColor[t] = PALETTE[i % PALETTE.length]; });
  const sourceCounts = {};
  ARTICLES.forEach(a => { sourceCounts[a.source] = (sourceCounts[a.source] || 0) + 1; });
  const mustRead = ARTICLES.filter(a => a.importance >= 5).length;

  $("#pageTitle").textContent = META.title || "文献速递";
  $("#pageSubtitle").textContent = META.subtitle || "容错量子计算与超导量子计算机仿真";
  $("#issueDate").textContent = META.issue_date || "—";
  const reviewed = ARTICLES.filter(a => a.review).length;
  $("#issueCounts").innerHTML = `${ARTICLES.length} 篇 · 必读 <b>${mustRead}</b> 篇${reviewed ? ` · AI 审稿 ${reviewed}` : ""}`;
  $("#asOf").textContent = META.collection_window || ("数据截至 " + (META.as_of || "—"));
  $("#generatedAt").textContent = META.generated_at || "—";
  $("#scopeLink").href = META.scope_href || "../SCOPE.md";

  const GROUP_STYLE = {
    "arXiv": "#c2410c",
    "PR 系列": "#1f4fd1",
    "Nature 系列": "#087a5b",
    "Quantum": "#6d45c7",
    "Science Advances": "#b3266e",
    "SciPost Physics": "#0e7490",
    "AVS Quantum Science": "#7a4bb5",
    "Quantum Science and Technology": "#9a5b00",
    "Cryptology ePrint Archive": "#8a5200"
  };
  const journalRows = Array.isArray(META.journals) ? META.journals : [];
  const totals = META.coverage_totals || {
    raw: journalRows.reduce((n, r) => n + Number(r.raw || 0), 0),
    deduped: journalRows.reduce((n, r) => n + Number(r.raw || 0), 0),
    screened: journalRows.reduce((n, r) => n + Number(r.screened || 0), 0),
    included: journalRows.reduce((n, r) => n + Number(r.included || 0), 0)
  };
  $("#coverage").innerHTML = `<details class="coverage">
    <summary><span>检索覆盖</span><span class="nums">抓取 ${totals.raw} · 去重 ${totals.deduped} · 关键词初筛 ${totals.screened} · 收录 ${totals.included}</span></summary>
    <div class="coverage-body">
      <table class="coverage-table">
        <thead><tr><th>来源 / 期刊</th><th>状态</th><th class="num">抓取</th><th class="num">关键词初筛</th><th class="num">收录</th></tr></thead>
        <tbody>
          ${journalRows.map(r => {
            const color = GROUP_STYLE[r.label] || GROUP_STYLE[r.group] || "#303030";
            const st = r.status || "ok";
            const stLabel = st === "ok" ? "正常" : st === "partial" ? "部分" : "失败";
            const stCell = `<td><span class="st st-${st}">${stLabel}</span></td>`;
            if (r.kind === "group") {
              return `<tr class="group"><td>${esc(r.label)}</td>${stCell}<td class="num">${r.raw}</td><td class="num">${r.screened}</td><td class="num">${r.included}</td></tr>`;
            }
            return `<tr class="${r.kind === "journal" ? "sub" : "single"}"><td><span class="coverage-source"><span class="source-dot" style="--sc:${color}"></span>${esc(r.label)}</span></td>${stCell}<td class="num">${r.raw}</td><td class="num">${r.screened}</td><td class="num"><b>${r.included}</b></td></tr>`;
          }).join("")}
          <tr class="total"><td>合计（去重后）</td><td>—</td><td class="num">${totals.deduped}</td><td class="num">${totals.screened}</td><td class="num">${totals.included}</td></tr>
        </tbody>
      </table>
    </div>
  </details>`;

  // keyword bar
  const state = { topic: "all" };
  function countTopic(t) { return ARTICLES.filter(a => (a.topics || []).includes(t)).length; }
  function renderKeywordBar() {
    const items = [`<button class="kbtn kbtn-all" data-topic="all" aria-pressed="${state.topic === "all"}">全部<span class="c">${ARTICLES.length}</span></button>`];
    allTopics.forEach(t => {
      const [c, bg] = topicColor[t];
      items.push(`<button class="kbtn" data-topic="${esc(t)}" aria-pressed="${state.topic === t}" style="--tc:${c};--tbg:${bg}">${esc(t)}<span class="c">${countTopic(t)}</span></button>`);
    });
    $("#keywordBar").innerHTML = items.join("");
  }
  renderKeywordBar();

  function impColor(v) { return IMP_STYLE[v] || IMP_STYLE[1]; }
  function sourcePill(source) {
    const [c, bg] = SOURCE_STYLE[source] || ["#4b514c", "#f0f1f1"];
    return `<span class="source-pill" style="--sc:${c};--sbg:${bg}">${esc(source)}</span>`;
  }
  function topicChips(a) {
    return (a.topics || []).map(t => {
      const [c, bg] = topicColor[t] || ["#4b514c", "#f0f1f1"];
      return `<span class="topic" style="--tc:${c};--tbg:${bg}">${esc(t)}</span>`;
    }).join("");
  }


  function reviewPoints(text) {
    let t = String(text || "").trim();
    if (!t) return ["（未提供）"];
    let parts = t.split(/(?=（\d+）)|(?=\(\d+\)\s)/).map(s => s.trim()).filter(Boolean);
    if (parts.length === 1) {
      parts = t.split(/\n+/).map(s => s.trim()).filter(Boolean);
    }
    if (parts.length === 1 && /[；;]/.test(t) && t.length > 120) {
      parts = t.split(/[；;]/).map(s => s.trim()).filter(Boolean);
    }
    if (parts.length === 1) {
      const sentences = t.match(/[^。！？]+[。！？]?/g) || [t];
      if (sentences.length > 1) parts = sentences.map(s => s.trim()).filter(Boolean);
    }
    const expanded = [];
    for (const part of parts) {
      if (part.length > 420 && /[；;]/.test(part)) {
        expanded.push(...part.split(/[；;]/).map(s => s.trim()).filter(Boolean));
      } else {
        expanded.push(part);
      }
    }
    return expanded.map(s => s.replace(/^[（(]?\d+[）)]?\s*/, "").trim()).filter(Boolean);
  }
  function reviewList(text) {
    return `<ul>${reviewPoints(text).map(p => `<li>${esc(p)}</li>`).join("")}</ul>`;
  }
  function reviewHTML(a) {
    const r = a.review;
    if (!r) return "";
    return `<details class="review">
      <summary>AI 审稿</summary>
      <div class="review-body">
        <div class="review-block"><h3>核心主张是否成立</h3>${reviewList(r.correctness)}</div>
        <div class="review-block"><h3>主要缺陷</h3>${reviewList(r.weaknesses)}</div>
        <div class="review-block"><h3>是否夸大</h3>${reviewList(r.overclaim)}</div>
        <div class="review-block"><h3>需要核对的引用 / 实验</h3>${reviewList(r.citations)}</div>
        <div class="review-block"><h3>要作者回答的问题</h3>${reviewList(r.questions)}</div>
        <p class="review-meta">${esc(r.basis)} · AI 生成的批判性审稿，不是同行评审；结论以原文为准。</p>
      </div>
    </details>`;
  }

  function entryHTML(a) {
    const w = wf(a.id);
    const [ic, ib] = impColor(a.importance);
    const opts = Object.entries(STATUS_LABEL).map(([k, v]) => `<option value="${k}"${w.status === k ? " selected" : ""}>${v}</option>`).join("");
    return `<article class="entry" id="p-${String(a.no).padStart(2, "0")}" data-id="${esc(a.id)}" style="--imp:${ic};--imp-bg:${ib}">
      <aside class="rail">
        <div class="no">${String(a.no).padStart(2, "0")}</div>
        <span class="imp-badge" title="${esc(a.importance_reason || "")}" aria-label="重要性 ${a.importance} / 5，${IMP_LABEL[a.importance]}"><span>${a.importance}</span><span class="den">/5</span></span>
        <span class="imp-label">${esc(IMP_LABEL[a.importance] || "")}</span>
      </aside>
      <div class="entry-body">
        <div class="entry-meta">
          ${sourcePill(a.source)}<span class="sep">·</span><time datetime="${esc(dateOnly(a.published))}">${esc(dateOnly(a.published))}</time><span class="sep">·</span><span>${esc(a.venue || "")}</span>
        </div>
        <h2><a href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">${esc(a.title)}</a></h2>
        <p class="title-zh">${esc(a.title_zh)}</p>
        <p class="authors">${esc((a.authors || []).join(" · "))}</p>
        <div class="topics">${topicChips(a)}</div>
        <p class="imp-reason"><b>重要性 ${a.importance}/5 · ${esc(IMP_LABEL[a.importance] || "")}</b> · ${esc(a.importance_reason || "")}</p>
        <p class="summary"><b>结论</b>${esc(a.summary)}</p>
        <div class="analysis">
          <div><h3>问题</h3><p>${esc(a.problem)}</p></div>
          <div><h3>方法</h3><p>${esc(a.method)}</p></div>
          <div><h3>结果</h3><p>${esc(a.result)}</p></div>
          <div><h3>关键贡献</h3><p>${esc(a.contribution)}</p></div>
          <div class="wide"><h3>局限 / 待核验</h3><p>${esc(a.limitation)}</p></div>
        </div>
        <div class="keynums"><span class="label">关键数字</span>${(a.key_numbers || []).map(k => `<span class="kn">${esc(k)}</span>`).join("")}</div>
        <div class="entry-foot">
          <div class="entry-actions">
            <select class="status-select" data-status="${esc(a.id)}" aria-label="阅读状态">${opts}</select>
            <button class="textbtn" type="button" data-note-toggle="${esc(a.id)}">${w.note ? "编辑笔记" : "笔记"}</button>
            <a class="link" href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">原文 ↗</a>
            ${a.pdf_url ? `<a class="link" href="${esc(a.pdf_url)}" target="_blank" rel="noopener noreferrer">PDF</a>` : ""}
            ${a.doi ? `<a class="link" href="https://doi.org/${esc(a.doi)}" target="_blank" rel="noopener noreferrer">DOI</a>` : ""}
          </div>
        </div>
        <details class="abstract"><summary>摘要原文</summary>
          <div class="abstract-block"><div class="abstract-lang">English</div><p>${esc(a.abstract || "摘要待补。")}</p></div>
          ${a.abstract_zh ? `<div class="abstract-block"><div class="abstract-lang">中文翻译</div><p>${esc(a.abstract_zh)}</p></div>` : ""}
        </details>
        ${reviewHTML(a)}
        <div class="note-wrap" data-note-wrap="${esc(a.id)}"${w.note ? "" : " hidden"}>
          <textarea class="note-area" data-note="${esc(a.id)}" placeholder="记录：值得记下的方法、需要核对的数字、与你当前工作的连接…">${esc(w.note)}</textarea>
          <div class="note-meta"><span data-save-status="${esc(a.id)}">${w.note ? "已从本机恢复" : "自动保存在本机"}</span><button class="textbtn" type="button" data-export-one="${esc(a.id)}">导出此条</button></div>
        </div>
      </div>
    </article>`;
  }

  function renderTOC() {
    const list = ARTICLES.slice().sort((a, b) => a.no - b.no);
    $("#tocList").innerHTML = list.map(a => `<li><a href="#p-${String(a.no).padStart(2, "0")}" data-toc-link><span class="toc-no">${String(a.no).padStart(2, "0")}</span><span>${esc(a.title_zh || a.title)}</span></a></li>`).join("");
  }
  function closeTOC() {
    $("#tocPanel").hidden = true;
    $("#tocToggle").setAttribute("aria-expanded", "false");
  }

  function typesetMath() {
    if (!window.MathJax || !MathJax.typesetPromise) return;
    const run = () => MathJax.typesetPromise([$("#entries")]).catch(err => console.warn("MathJax:", err));
    if (MathJax.startup && MathJax.startup.promise) MathJax.startup.promise.then(run);
    else run();
  }

  function render() {
    const list = ARTICLES.filter(a => state.topic === "all" || (a.topics || []).includes(state.topic)).sort((a, b) => a.no - b.no);
    $("#entries").innerHTML = list.map(entryHTML).join("");
    $("#emptyState").innerHTML = ARTICLES.length
      ? `<b>这个关键词下暂无条目</b>点“全部”回到完整列表。`
      : `<b>本轮无新增论文</b>数据时间范围内没有新增条目。`;
    $("#emptyState").classList.toggle("show", list.length === 0);
    $("#listSummary").innerHTML = `显示 <b>${list.length}</b> / ${ARTICLES.length} 篇`;
    $$(".kbtn").forEach(b => b.setAttribute("aria-pressed", String(state.topic === b.dataset.topic)));
    typesetMath();
  }

  $("#keywordBar").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-topic]");
    if (!btn) return;
    state.topic = btn.dataset.topic;
    render();
  });

  $("#entries").addEventListener("click", (e) => {
    const toggle = e.target.closest("[data-note-toggle]");
    if (toggle) {
      const wrap = document.querySelector(`[data-note-wrap="${CSS.escape(toggle.dataset.noteToggle)}"]`);
      if (wrap) { wrap.hidden = !wrap.hidden; if (!wrap.hidden) wrap.querySelector("textarea")?.focus(); }
      return;
    }
    const one = e.target.closest("[data-export-one]");
    if (one) {
      const a = ARTICLES.find(x => x.id === one.dataset.exportOne);
      download(`note-${a.no}-${a.id}.json`, { article: { id: a.id, title: a.title, url: a.url }, workflow: wf(a.id) });
      toast("已导出此条");
    }
  });

  $("#entries").addEventListener("change", (e) => {
    const sel = e.target.closest("[data-status]");
    if (!sel) return;
    const w = wf(sel.dataset.status); w.status = sel.value; save();
    toast("状态已保存：" + STATUS_LABEL[w.status]);
  });
  let noteTimer;
  $("#entries").addEventListener("input", (e) => {
    const ta = e.target.closest("[data-note]");
    if (!ta) return;
    const w = wf(ta.dataset.note); w.note = ta.value;
    const label = document.querySelector(`[data-save-status="${CSS.escape(ta.dataset.note)}"]`);
    if (label) label.textContent = "正在保存…";
    clearTimeout(noteTimer);
    noteTimer = setTimeout(() => {
      save();
      if (label) label.textContent = "已保存 · " + new Date().toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });
    }, 300);
  });

  function download(filename, payload) {
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
  }
  $("#exportBtn").addEventListener("click", () => {
    download(`reading-notes-${META.issue_date || "digest"}.json`, {
      exported_at: new Date().toISOString(), issue: META.issue_date,
      articles: ARTICLES.map(a => ({ id: a.id, no: a.no, title: a.title, topics: a.topics, url: a.url, ...wf(a.id) }))
    });
    toast("已导出全部笔记与公式修改");
  });
  $("#printBtn").addEventListener("click", () => window.print());

  document.addEventListener("toggle", (e) => {
    if (e.target.matches && e.target.matches("details.abstract, details.review")) typesetMath();
  }, true);

  const TOC_POS_KEY = "qc-toc-pos-v1";
  const tocDesktop = window.matchMedia("(hover: hover) and (pointer: fine)");
  let tocDrag = null;
  let tocMoved = false;
  let suppressTocClick = false;
  function isDesktopToc() { return tocDesktop.matches; }
  function setTocPosition(left, top) {
    if (isDesktopToc()) return;
    const box = $("#toc");
    const maxLeft = Math.max(0, window.innerWidth - box.offsetWidth);
    const maxTop = Math.max(56, window.innerHeight - box.offsetHeight - 8);
    const x = Math.max(0, Math.min(maxLeft, Math.round(left)));
    const y = Math.max(56, Math.min(maxTop, Math.round(top)));
    box.style.left = x + "px";
    box.style.top = y + "px";
    box.style.bottom = "auto";
    box.classList.toggle("right", x > window.innerWidth / 2);
    return { left: x, top: y };
  }
  function saveTocPosition() {
    if (!isDesktopToc()) {
      const box = $("#toc");
      const r = box.getBoundingClientRect();
      try { localStorage.setItem(TOC_POS_KEY, JSON.stringify({ left: r.left, top: r.top })); } catch (e) {}
    }
  }
  function snapToc() {
    const box = $("#toc");
    const r = box.getBoundingClientRect();
    const left = (r.left + r.width / 2 < window.innerWidth / 2)
      ? 0
      : Math.max(0, window.innerWidth - r.width);
    const pos = setTocPosition(left, r.top);
    if (pos) { try { localStorage.setItem(TOC_POS_KEY, JSON.stringify(pos)); } catch (e) {} }
  }
  function restoreTocPosition() {
    if (isDesktopToc()) return;
    try {
      const raw = localStorage.getItem(TOC_POS_KEY);
      if (raw) {
        const p = JSON.parse(raw);
        if (typeof p.left === "number" && typeof p.top === "number") setTocPosition(p.left, p.top);
      }
    } catch (e) {}
  }
  function collapseDesktopToc() {
    const box = $("#toc");
    box.classList.add("collapsed");
    document.body.classList.remove("toc-open");
    $("#tocPanel").hidden = true;
    $("#tocToggle").setAttribute("aria-expanded", "false");
  }
  function openDesktopToc() {
    const box = $("#toc");
    box.classList.remove("collapsed");
    document.body.classList.add("toc-open");
    $("#tocPanel").hidden = false;
    $("#tocToggle").setAttribute("aria-expanded", "true");
  }
  function applyTocMode() {
    const box = $("#toc");
    if (isDesktopToc()) {
      box.style.left = "";
      box.style.top = "";
      box.style.bottom = "";
      $("#tocClose").textContent = "收起";
      openDesktopToc();
    } else {
      document.body.classList.remove("toc-open");
      box.classList.remove("collapsed");
      $("#tocClose").textContent = "×";
      closeTOC();
      restoreTocPosition();
    }
  }
  tocDesktop.addEventListener("change", applyTocMode);
  $("#tocToggle").addEventListener("pointerdown", (e) => {
    if (isDesktopToc()) return;
    const box = $("#toc");
    const r = box.getBoundingClientRect();
    tocDrag = { x: e.clientX, y: e.clientY, left: r.left, top: r.top };
    tocMoved = false;
    try { $("#tocToggle").setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  });
  $("#tocToggle").addEventListener("pointermove", (e) => {
    if (!tocDrag) return;
    const dx = e.clientX - tocDrag.x;
    const dy = e.clientY - tocDrag.y;
    if (Math.abs(dx) + Math.abs(dy) > 5) tocMoved = true;
    setTocPosition(tocDrag.left + dx, tocDrag.top + dy);
  });
  $("#tocToggle").addEventListener("pointerup", () => {
    if (!tocDrag) return;
    if (tocMoved) {
      suppressTocClick = true;
      snapToc();
      setTimeout(() => { suppressTocClick = false; }, 150);
    }
    tocDrag = null;
  });
  $("#tocToggle").addEventListener("click", () => {
    if (suppressTocClick) return;
    if (isDesktopToc()) {
      if ($("#toc").classList.contains("collapsed")) openDesktopToc();
      else collapseDesktopToc();
      return;
    }
    if ($("#tocPanel").hidden) {
      $("#tocPanel").hidden = false;
      $("#tocToggle").setAttribute("aria-expanded", "true");
    } else {
      closeTOC();
    }
  });
  $("#tocClose").addEventListener("click", () => {
    if (isDesktopToc()) collapseDesktopToc(); else closeTOC();
  });
  $("#tocPanel").addEventListener("click", (e) => {
    if (e.target.closest("[data-toc-link]") && !isDesktopToc()) closeTOC();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      if (isDesktopToc()) collapseDesktopToc(); else closeTOC();
    }
  });
  window.addEventListener("resize", () => {
    if (isDesktopToc()) return;
    const box = $("#toc");
    const r = box.getBoundingClientRect();
    setTocPosition(r.left, r.top);
  });
  applyTocMode();

  renderTOC();
  render();
})();
</script>
</body>
</html>
