\\(I\\) 实现。以该横向 CCZ 为蒸馏单元，推导 Thm 1.3 的蒸馏深度与 Thm 1.4 的魔态喷泉（不做级联、不做解码）。","result":"Thm 1.2：\\(K h\\ge N^{1-\\varepsilon}\\)，\\(D_{X,h},D_{Z,h}\\ge c_\\varepsilon N/\\log^2 N\\)，校验权重 \\(w_\\varepsilon=O_\\varepsilon(1)\\)，码长 \\(N=\\Theta(t^3|H|)\\)、\\(t=\\Theta(\\log N)\\)。Thm 1.3：CCZ 蒸馏深度 \\(D_{\\mathrm{dist}}=\\min_h D_{Z,h}=\\Omega_\\varepsilon(N/\\log^2 N)\\)，输出错误率 \\(O_N(p^{D_{\\mathrm{dist}}})\\)，开销指数 \\(\\gamma\\le\\varepsilon(1+o(1))\\)。Thm 1.4：魔态喷泉产率 \\(r_M=s/N\\ge N^{-\\varepsilon}\\)，且不需要级联与解码。代价是距离损失 \\(t^2\\)、产率损失 \\(t^3\\)。","contribution":"把「可寻址横向非 Clifford 门」从好码上的猜想推进到近乎好码上的显式族，并把魔态开销指数压到任意小 \\(\\varepsilon\\)；同时给出蒸馏与喷泉两条不依赖解码器的协议路径，为 qLDPC 的容错架构提供了新的资源核算基准。","limitation":"核心的 Assumption 1.1（均匀子域乘积膨胀）在文中未证明，只在姊妹手稿中作为出发点；构造带随机性，枚举代价为期望 \\(N^{O_\\varepsilon(1)}\\)；全程没有解码器，无法回答「阈值以下逻辑错误率如何标定」这一工程问题；\\(t^2\\) 与 \\(t^3\\) 的损失让实际码距远低于上界；作者明确声明证明「完全由 AI 生成」并只有部分 Lean 形式化，与并行工作 LLHL26 的比较也只在同一假设下成立。","key_numbers":["距离下界 D_X,h、D_Z,h ≥ c_ε·N/log²N，校验权重 w_ε = O_ε(1)","码长 N = Θ(t³|H|)，t = Θ(log N)，可寻址匹配三元组 s ≥ N^{1−ε}","CCZ 蒸馏深度 D_dist = Ω_ε(N/log²N)，输出错误率 O_N(p^{D_dist})，开销指数 γ ≤ ε(1+o(1))","魔态喷泉产率 r_M = s/N ≥ N^{−ε}，无需级联与解码","距离损失 t²、产率损失 t³；期望枚举代价 N^{O_ε(1)}"],"url":"https://arxiv.org/abs/2611.23762","abstract":"Assuming uniform subfield product expansion, we construct quantum low-density parity-check (qLDPC) codes with distances \\(Ω_ε(N/\\log^2N)\\) and at least \\(N^{1-ε}\\) individually addressable logical CCZ gates on pairwise disjoint triples of logical qubits, for every fixed \\(0<ε<1\\). With all logical qubits outside these triples initialized to \\(|0\\rangle\\), any subset of the corresponding logical CCZ gates can be implemented with a transversal physical CCZ circuit. As applications, we obtain two nearly optimal magic state protocols: CCZ distillation with arbitrarily small overhead exponent \\(γ\\rightarrow 0\\) and error suppression of nearly linear order, and a magic state fountain that directly prepares \\(N^{1-ε}\\) encoded CCZ magic states with nearly linear distance \\(Ω_ε(N/\\log^2N)\\). The construction uses balanced products of expanding graph covers. The assumption concerns Reed--Solomon codes on three subfields of characteristic two and pairwise coprime extension degrees, a local hypothesis studied in a companion manuscript. We design the expanding graph covers to admit many common classical codewords, which yield logical operators whose pairings select the logical CCZ gates independently. Without the product expansion assumption, the graph covers also yield classical LDPC codes over a fixed field with almost linear dimension and linear distance that satisfy a multiplication property: the coordinatewise product of any three codewords lies in a second LDPC code of linear distance.","review":{"verdict":"大修","confidence":"低","correctness":"定理的推导链条本身自洽：子域结构给出匹配三元组、Assumption 1.1 折算成权重与距离、可寻址性靠置零其余逻辑比特，蒸馏与喷泉的标度由 \\(s\\) 与 \\(D_{\\mathrm{dist}}\\) 直接读出。但结论的可信度几乎完全押在 Assumption 1.1 上，而这个假设既未在本稿证明，也只在一篇姊妹手稿里被提出；再加上作者声明证明由 AI 生成、仅部分 Lean 形式化，读者实际拿到的是一个条件性结果。","weaknesses":"· 关键假设 Assumption 1.1 未证明，所有标度都是条件性的，姊妹手稿若被推翻则整篇失效\n· 没有解码器，无法给出阈值或逻辑错误率曲线，「近乎好」只在距离意义上成立\n· 距离损失 \\(t^2\\)、产率损失 \\(t^3\\) 意味着好码的优势在有限 \\(N\\) 下可能被吃掉，正文未给数值实例\n· 可寻址性要求其余逻辑比特处于 \\(|0\\rangle\\)，这在算法中途不成立，实际使用需额外的态制备开销\n· 与 LLHL26 的比较只在共同假设下，未做参数对参数的数值对照","overclaim":"摘要把 \\(\\gamma\\le\\varepsilon(1+o(1))\\) 的「近最优」放在最显眼处，容易让读者忽略这是条件性结论、且常数与 \\(\\varepsilon\\) 的倒数相关；实际 \\(\\varepsilon\\) 越小，距离下界的常数与 \\(t\\) 的标度越差，所谓「任意接近最优」在有限码长上并不免费。","citations":"对 qLDPC 好码、横向门不可能性、魔态蒸馏与子域构造的引用覆盖到位；不足是对已有的横向 CCZ 方案（如二维/三维色码与格点手术）只在引言里点过，没有资源层面的横向对照。","questions":"① Assumption 1.1 在什么样的有限域/子域参数下可被验证？② 加上一个具体解码器后，阈值会落在什么量级？③ 若算法中途其余逻辑比特不在 \\(|0\\rangle\\)，可寻址层还能用吗？④ \\(t^2\\) 损失在 \\(N\\sim10^3\\) 时具体损失多少距离？","basis":"全文（arXiv:2611.23762 PDF，含定理陈述与证明结构）"}},{"id":"2611.23759","no":2,"topics":["解码器","纠错码"],"source":"arXiv","venue":"arXiv","published":"2026-11-18","title":"Parity Push Post-Selection with Soft Parity Constraints for Quantum LDPC Codes","title_zh":"面向量子 LDPC 码的带软奇偶约束的奇偶推挤后选择","authors":["Hong Jun Kim","Gun Sik Min","Seok-Hyung Lee","Jun Heo"],"importance":5,"importance_reason":"把后选择做成解码器无关的一层薄壳：每个可观测量只用 \\(2K\\) 类、每次探测只加一个校验与一个变量节点，就能在约 1% 拒绝率下把 [[72,12,6]] 与 [[144,12,12]] 的逻辑错误率压低 50× 与 75×，这是当下少见的「不改码、不改解码器就能拿到量级收益」的方案。","summary":"提出奇偶推挤后选择（PPPS）：对每次探测重解码并只接受所有重解码结果一致的情形，配合软奇偶约束与间隙判据；在 [[72,12,6]] 与 [[144,12,12]] 上以约 1% 拒绝率把逻辑错误率压低约 50× 与 75×。","problem":"后选择能在不换码的前提下压低逻辑错误率，但既有做法要么依赖额外校验比特与硬件、要么与特定解码器强绑定，且拒绝率与收益的折中不可控。qLDPC 码的 BP+OSD 类解码器本身已接近其能力上限，需要一个廉价、通用、可调拒绝率的后选择层。","method":"把每次探测视为对逻辑类标签的一次独立重解码：给探测加一个校验节点与一个变量节点（软奇偶约束），\\(K\\) 个可观测量共 \\(2K\\) 类；仅当所有重解码回到原逻辑类时接受，否则拒绝。对 DML 解码器额外用间隙 \\(g>\\lambda\\) 判据，并给出失败概率 \\(P(\\text{fail}\\mid g,\\alpha)=\\frac{1+\\alpha}{e^{g}+1+\\alpha}\\)。在 [[72,12,6]]、[[144,12,12]] 上与自适应重加权（AR）等基线做电路级模拟对比，并测试放宽判据的变体。","result":"\\(p=10^{-3}\\) 时 [[72,12,6]] 逻辑错误率降约 50×、拒绝率约 1%；\\(p=3\\times10^{-3}\\) 时 [[144,12,12]] 降约 75×（1% 拒绝），20% 拒绝时约 43×；与 AR 相比 [[72,12,6]] 在 2× 以内、[[144,12,12]] 在 1% 附近领先约 5×；放宽判据（Fig. 5）能在几乎不损失 LER 的情况下进一步降低拒绝率。","contribution":"给出一个可插在任意解码器之后的通用后选择层，把「拒绝率–逻辑错误率」折中显式参数化，并用两个代表性 qLDPC 码量化了收益，工程上可直接叠加在现有 BP+OSD 流水线上。","limitation":"间隙型阈值 \\(\\lambda\\) 只对 DML 解码器给出，通用性受限；[[144,12,12]] 的对比使用了 4× 探测预算，与 [[72,12,6]] 的预算不对等；未与 OSD、decimation 等更强解码策略比较；每次探测都要重解码，硬件延迟随探测数线性增长；某个辅助校验节点涉及 14,264 个故障机制；全部结果是内存模拟，无硬件验证。","key_numbers":["[[72,12,6]]：p = 10⁻³，LER 降约 50×，拒绝率约 1%","[[144,12,12]]：p = 3×10⁻³，LER 降约 75×（1% 拒绝）、43×（20% 拒绝）","与 AR 相比：[[72,12,6]] 在 2× 以内，[[144,12,12]] 在 1% 拒绝附近优于约 5×","K 个可观测量对应 2K 类，每次探测仅增加 1 个校验节点与 1 个变量节点","DML 失败概率 P(fail|g,α) = (1+α)/(e^g + 1 + α)"],"url":"https://arxiv.org/abs/2611.23759","abstract":"Post-selection lowers the logical error rate of a quantum error-correcting code by rejecting unreliable shots. For a code with \\(K\\) logical observables, the logical gap, a standard post-selection criterion, involves \\(2^K\\) logical classes, and existing approximations to it suffer from a non-convergence error floor or a shielding effect. We introduce a decoder-agnostic post-selection strategy for quantum low-density parity-check (qLDPC) codes, called parity push post-selection (PPPS), which re-decodes a shot once per logical observable with a push toward the opposite parity. Each push adds one check node and one variable node to the Tanner graph of the detector error model, and we accept a shot only when every re-decoding returns a solution in the original logical class. We show that, with degenerate maximum-likelihood decoding, PPPS accepts a shot exactly when the logical gap exceeds the push strength \\(λ\\). Applied with the Relay-BP decoder to the [[72,12,6]] bivariate bicycle code at \\(p=10^{-3}\\) and the [[144,12,12]] code at \\(p=3\\times10^{-3}\\) under circuit-level depolarizing noise, PPPS lowers the logical error rate by factors of about 50 and 75, respectively, at rejection rates near 1%. We observe that PPPS rejects failures that prior post-selection strategies cannot reject, and thus shows improved performance.","review":{"verdict":"小修","confidence":"中","correctness":"核心机制简单且可验证：多次重解码的一致性就是对逻辑类的一次多数检验，软奇偶约束把「不一致」翻译成可判定的间隙，失败概率公式在 DML 下自洽。50×/75× 的收益与 1% 拒绝率在同一张曲线上给出，消融（不同拒绝率、与 AR 对比）也做得比较干净。","weaknesses":"· 间隙阈值只对 DML 成立，BP+OSD 等主流解码器上如何取 \\(\\lambda\\) 未给出\n· [[144,12,12]] 用 4× 探测预算换收益，与 [[72,12,6]] 的对比不对等，读者容易高估大码的优势\n· 未与 OSD、decimation、ordered-statistics 后处理比较，无法判断是否只是「多解几次码」的收益\n· 每次探测都要完整重解码，实时解码器上的延迟与吞吐代价未量化\n· 全部为内存模拟，缺少真实综合征序列与泄漏/串扰的影响","overclaim":"摘要把「解码器无关」与「约 1% 拒绝率下 50×–75×」并置，读起来像通用结论；实际上大码的 75× 用了 4 倍探测预算，且拒绝率与码距、噪声模型强相关，换到表面码或硬件噪声下未必复现。","citations":"对 qLDPC 解码、后选择与自适应重加权的引用较完整；不足是缺少对「用多次解码做置信度估计」这类相邻工作的系统对照。","questions":"① 在 BP+OSD 上如何选 \\(\\lambda\\)，还是要另立判据？② 探测预算对齐后，[[144,12,12]] 还剩多少优势？③ 实时解码器上每次探测增加多少纳秒？④ 与 decimation 叠加会不会相互抵消？","basis":"全文（arXiv:2611.23759 PDF，含解码流程、数值曲线与附录）"}},{"id":"2611.23528","no":3,"topics":["容错实验","纠错码"],"source":"arXiv","venue":"arXiv","published":"2026-11-18","title":"Singlet flags: using native entanglement to restore the circuit distance of shuttled qLDPC codes in silicon","title_zh":"单态标志位：用原生纠缠恢复硅中穿梭 qLDPC 码的电路距离","authors":["William Chow","Jonathan Baugh"],"importance":5,"importance_reason":"硅自旋架构里穿梭（shuttling）是不可避免的操作，而它引入的 hook 错误会把 qLDPC 的电路距离打到 1；本文用硅上现成的单态投影做标志位，把 BB [[108,8,10]] 等码的电路距离从 6/7 恢复到 10，并给出电子开销 1.3–1.6× 的完整核算，是少见的「用原生资源换容错裕度」的具体方案。","summary":"用硅自旋原生单态投影作为标志位，探测穿梭中孤立的比特翻转故障并挡住权重达 \\(\\lfloor w/2\\rfloor\\) 的 hook 错误；在 BB [[108,8,10]] 等码上把电路距离从 6/7 恢复到 10，逻辑错误率改善 2–8×。","problem":"硅基自旋量子比特要靠穿梭把离子/电子在陷阱间搬运，途中出现的孤立比特翻转会与其他错误组合成高权重 hook 错误；这类错误让「电路距离」\\(d_{\\mathrm{circ}}\\)（考虑线路级故障的最小逻辑错误权重）远低于码距，CAbLECAR 类布线在 \\(d=8\\)–\\(12\\) 时只能保住 3/8–3/4 的距离。问题是如何在不引入大量辅助比特的前提下恢复电路距离。","method":"定义电路距离 \\(d_{\\mathrm{circ}}=\\min\\{|e|:He=0,\\ Le\\neq0\\}\\) 与可纠错权重 \\(t=\\lfloor(d_{\\mathrm{circ}}-1)/2\\rfloor\\)；单态标志位利用两个自旋的原生单态投影一次性测出奇偶性，判定为单态即标记本次穿梭存在故障并触发重试或修正；在 BB [[108,8,10]]、Gross [[144,12,12]]、[[176,48,10]]、[[180,42,12]] 上做线路级模拟，与 CAbLECAR 比较，并核算电子开销与每电子的逻辑错误率优势。","result":"无标志时权重 12 的穿梭错误可把电路距离压到 1；加标志后权重 8/10 的码恢复 \\(d_{\\mathrm{circ}}\\) 5–6。BB [[108,8,10]] 6/7→10、Gross [[144,12,12]] 7→10、[[176,48,10]] 5&6→7、[[180,42,12]] 8→10。百分比级标志错误下 LER 改善 2–8×（BB）与约 10×（surface）；权重 8 的码在 \\(p\\le10^{-3}\\) 时 X 基 8–24×、Z 基 2.8–5.6×；用精确 MW 解码时 BB72 5–17×、w8 5–70×、w10 13–90×。电子开销为 CAbLECAR 的 1.3–1.6×；带标志的 Gross 码在每 1000 个数据比特 83 个逻辑比特下达到每轮 \\(1.6\\times10^{-7}\\)，每电子优势 7.5×。","contribution":"把单态投影这一硅上原生可用的纠缠资源直接当作故障标志，给出恢复 qLDPC 电路距离的可实施方案，并用电子开销与每电子逻辑错误率两个指标把「值不值」量化出来。","limitation":"放置采用 home-node 启发式，报告的轮时间是上界而非可实现值；当 \\(p_{\\mathrm{sh}}=3.16\\times10^{-3}\\) 时裕度消失；Gross 码的估计把 X 基重复计入，高估约 40–50%（但增益变化小于 5%）；单态标志位假设投影本身低错误率，实际硅器件上的单态保真度与测量时间未纳入。","key_numbers":["无标志时权重 12 的穿梭错误使电路距离降到 1","BB [[108,8,10]]：6/7 → 10；Gross [[144,12,12]]：7 → 10","[[176,48,10]]：5 与 6 → 7；[[180,42,12]]：8 → 10","LER 改善 2–8×（BB）、约 10×（surface）；精确 MW 解码下最高 90×","电子开销 1.3–1.6×；Gross 码每轮 1.6×10⁻⁷，每电子优势 7.5×"],"url":"https://arxiv.org/abs/2611.23528","abstract":"High-rate quantum low-density parity-check (qLDPC) codes could greatly reduce the qubit count of silicon spin-qubit processors, but their checks are long-range and of high weight. Shuttling one ancilla electron through every data qubit of a check measures such checks, but a single fault on the ancilla spreads to several data qubits, so the circuit distance can fall far below the code distance. We make the mobile ancilla one half of a spin singlet whose partner stays at home; a Bell measurement at the end of the check provides a flag for isolated bit-flip faults acquired during the walk. Using new distance-6 codes with check weights 8, 10 and 12, and exact circuit distances from two independent solvers, we show that without the flag the circuit distance falls as check weight grows, to 1 at weight 12, while with it every weight-8 and weight-10 code recovers circuit distance 5 or 6 and corrects as many faults as the code. For codes of distance 8 to 12 the flag raises the circuit distance by one to four, and the Gross code [[144,12,12]] rises from 7 to 10. In circuit-level simulations of shuttled spin qubits, the flag lowers logical error rates by typically 2-10x across bivariate-bicycle, circulant-permutation and surface codes, and the gain survives percent-level flag-readout errors and bit flips on the singlet's electrons. BP+OSD does not reach the full circuit distance of the flagged circuits, so our flagged logical error rates are upper bounds: decoding the same shots exactly raises the flag's gain on the distance-6 codes from 3-7x to 5-17x for the weight-6 BB code, and from 1-12x to 5-90x at weights 8 and 10 for p >= 2.5x10^-4.","review":{"verdict":"小修","confidence":"中","correctness":"电路距离的定义与标志位的作用机制清晰：单态投影给出一次奇偶校验，从而把「一个孤立翻转」变成可探测事件，权重上界 \\(\\lfloor w/2\\rfloor\\) 与恢复后的 \\(d_{\\mathrm{circ}}\\) 数值一致。多码族、多噪声点、两种解码器（含精确 MW）的交叉验证让结论比较可信，作者也主动交代了 Gross 码重复计数导致的高估。","weaknesses":"· 放置用 home-node 启发式，轮时间是上界，真实布局下收益可能缩水\n· 单态投影的保真度、测量时长与串扰被理想化，硅器件上这些恰恰是瓶颈\n· \\(p_{\\mathrm{sh}}=3.16\\times10^{-3}\\) 时裕度消失，说明方案对穿梭错误率相当敏感\n· Gross 码估计把 X 基重复计入，绝对 LER 被高估 40–50%\n· 只考虑比特翻转型穿梭故障，相位型与泄漏型故障未建模","overclaim":"「恢复电路距离」这一说法容易被读成恢复码距；实际上恢复的是 \\(d_{\\mathrm{circ}}\\) 到 10，仍低于码距 10 的完整线路级保证所需，而且部分组合只在理想放置下成立。","citations":"对 qLDPC、硅自旋穿梭与标志位（flag qubit）技术的引用覆盖到位；不足是未与近期基于辅助比特的 flag 方案做开销对开销的比较。","questions":"① 真实单态保真度 99% 时还剩多少收益？② 换成更优放置后轮时间能降多少？③ 相位型穿梭故障要不要另设标志位？④ 标志位本身引入的测量错误如何进入 \\(d_{\\mathrm{circ}}\\) 计算？","basis":"全文（arXiv:2611.23528 PDF，含线路级模拟与附录）"}},{"id":"2611.23469","no":4,"topics":["编译与验证"],"source":"arXiv","venue":"arXiv","published":"2026-11-18","title":"QCCDCert: Formally Verified Compilation for QCCD Co-Design","title_zh":"QCCDCert：面向 QCCD 协同设计的形式化验证编译","authors":["John Zhuoyang Ye","Jens Palsberg","Ke Sun","Hartmut Haeffner"],"importance":5,"importance_reason":"审计三个已发表 QCCD 编译器找出 11 个缺陷，并证明这些缺陷会系统性地把架构比较推向同一个方向——这直接动摇了已发表协同设计结论的可信度；同时用 Lean 4 把编译器正确性组合成单一可机检定理，并给出 66.4% 与 71/75 的量化收益，方法论价值超出 QCCD 本身。","summary":"形式化验证 QCCD 编译器：审计三个公开编译器发现 11 个缺陷且偏差方向一致，用 Lean 4 把各 pass 的正确性组合成端到端定理；最佳设计比同等容量最差设计少 66.4% 建模时间，AI agent 在 71/75 个程序上优于最佳人工设计。","problem":"QCCD 架构的穿梭次数与时序决定了可行性，编译器因此成为架构协同设计的核心工具；但已发表编译器只有测试、没有正确性保证，一旦编译器有缺陷，基于它得出的「哪种陷阱布局更好」的结论可能整体偏斜。需要可机检的正确性证书与可复现的评测基准。","method":"用 Lean 4 形式化 QCCD 的穿梭合法性、时序与并行约束，把若干编译 pass（调度、放置、路由）的正确性组合成一条端到端定理，类比 CompCert 与 CakeML 的做法；对 3 个公开编译器做差分审计；用 75 个基准程序（11–130 比特）与一个 38 陷阱设备（最大 512 比特程序）评测，并把 AI agent 搜索出的设计与人工最佳设计对比。","result":"审计出 11 个缺陷，且缺陷系统性地偏向某一类设计（正文 line 1433）。最佳设计比同等容量的最差设计少 66.4% 的建模时间；AI agent 在 71/75 个程序上优于最佳人工设计（3 个持平、1 个更慢）。在 38 陷阱设备上：GHZ 链 67 s、一层 QAOA 151 s、Bernstein–Vazirani 29 min；把二次的穿梭合法性检查改为线性后，GHZ 链从 57 min 降到 67 s。","contribution":"首个把 QCCD 编译器端到端正确性做成可机检定理的工作，并用可复现的审计证据说明「编译器缺陷会系统性偏置架构比较」；形式化与性能优化（二次→线性检查）结合，使 512 比特规模的协同设计变得可跑。","limitation":"形式化覆盖编译 pass 的语义正确性，不含脉冲级时序、串扰与泄漏等物理层效应；基准程序只有 75 个，规模上限 130 比特（512 比特仅作演示）；审计对象是特定版本的三个编译器，结论不能外推到所有实现；性能数字依赖该团队 38 陷阱模型的假设，且都是建模时间而非硬件实测。","key_numbers":["审计 3 个已发表 QCCD 编译器，发现 11 个缺陷，偏差方向一致","最佳设计比同等容量最差设计少 66.4% 建模时间","AI agent 在 71/75 个基准程序上优于最佳人工设计（3 持平、1 更慢）","38 陷阱设备上 512 比特：GHZ 链 67 s、一层 QAOA 151 s、Bernstein–Vazirani 29 min","二次→线性穿梭合法性检查：GHZ 链 57 min → 67 s"],"url":"https://arxiv.org/abs/2611.23469","abstract":"Quantum charge-coupled device (QCCD) architectures enable scalable trapped-ion quantum computing by dynamically shuttling ions between specialized processing and storage zones. A QCCD can be built with many trap sizes and layouts. Comparing them requires compiling every program under each design's transport, capacity and control constraints, and trusting the target code of each compilation. We present a co-design framework built on one Lean-verified compiler. The hardware description and its operating rules are compiler inputs, so a single theorem covers every candidate design: the target code of every compilation preserves its program's behavior and obeys the hardware rules. Across 75 benchmark programs of 11 to 130 qubits, the best design found takes 66% less modeled execution time on average than the worst design of equal capacity. An AI agent that proposes devices based on our compiler's checked results beats the fastest of these designs on 71 of 75 programs. Our verified compiler provably avoids the 11 defects that we report in three previous compilers. It scales to hundreds of qubits, compiling 512-qubit programs for a 38-trap device in 1 to 29 minutes.","review":{"verdict":"小修","confidence":"高","correctness":"把编译器正确性拆成可组合的 pass 级定理、再用 Lean 4 缝合，是经过 CompCert 验证的成熟路线，可信度高；11 个缺陷的审计有具体复现路径，且作者指出偏差方向一致这一结论对协同设计文献具有直接杀伤力，论证链条完整。66.4%、71/75、29 min 等数字都有明确口径。","weaknesses":"· 形式化不含脉冲级时序与串扰，所谓「正确」只是调度/路由语义层面\n· 75 个基准程序偏少，且 512 比特只做三个演示，规模外推依据不足\n· 审计的三个编译器是特定版本，11 个缺陷中有多少已被上游修复未说明\n· 建模时间与真实硬件时间之间缺少换算，66.4% 的工程含义需读者自行折算\n· AI agent 的比较基线是「最佳人工设计」，未交代人工设计的搜索预算是否对等","overclaim":"标题的「形式化验证编译」容易被读成「编译器在所有物理层面都正确」；实际上验证边界止于 pass 语义，硬件层的时序违例、串扰与泄漏都不在证书范围内。","citations":"对 CompCert/CakeML 传统、QCCD 架构与已有编译器工作的引用完整；不足是对「编译器 bug 导致架构结论偏差」这一现象的既有讨论引用较少。","questions":"① 11 个缺陷里哪些在最新版本已修复？② 加入脉冲级约束后形式化成本会增加多少？③ 人工设计的搜索预算与 AI agent 是否对齐？④ 38 陷阱模型换成真实器件参数后排序会变吗？","basis":"全文（arXiv:2611.23469 PDF，含 Lean 形式化结构、审计表与基准结果）"}},{"id":"10.1103/1nt2-f7gl","no":5,"topics":["芯片与耦合器","纠错码"],"source":"PRX Quantum","venue":"PRX Quantum","published":"2026-11-18","title":"Cavity-Mediated Cross-Cross-Resonance Gate","title_zh":"腔介导的交叉-交叉共振门","authors":["Alexey V. Gorshkov","Or Golan","Daniel Cohen","Arbel Haim","Amit Rotem","Gihwan Kim","Andreas Butler","Connor T. Hann","Oskar Painter","Fernando G. S. L. Brandão","Alex Retzker"],"importance":5,"importance_reason":"把离子阱里成熟的相空间闭合回路思路搬到超导腔上，用一个腔同时驱动两比特，得到可控相位门，并且能在同一超材料腔阵列上并行作用于多对比特——这正是 qLDPC 快速非局域 syndrome 测量所缺的并行门；数值上给出 \\(400\\) ns、\\(\\lesssim10^{-3}\\) 的设计点。","summary":"提出交叉-交叉共振门：两比特被近腔频同时驱动，腔在相空间画出面积依赖两比特状态的闭合回路从而实现 controlled-phase；用「整数」与「花朵」两种路径抵消色散耦合误差，并可在腔阵列上并行作用于多对比特。","problem":"超导两比特门要么只作用一对（cross-resonance），要么依赖可调耦合器而难以并行；更关键的是色散耦合带来的主导误差难以消除。qLDPC 码需要快速、非局域、可并行的 syndrome 测量，现有门方案在「并行度 × 保真度 × 速度」上都不够。","method":"两个非线性元件（transmon）被同一腔以近共振频率同时驱动，腔的相空间轨迹面积由两比特联合状态决定，从而积累条件相位；用两种闭合路径设计抵消主导误差：整数方案（§III A）与花朵方案（§III B），分别处理色散耦合、相邻腔耦合、always-on ZZ 与超材料情形；再推广到腔阵列本征模，使一个驱动同时作用多对比特。用主方程数值模拟给出门时间、infidelity 与衰减系数。","result":"设计参数 \\(\\eta/2\\pi=300\\) MHz、\\(\\Delta/2\\pi\\approx1\\) GHz、\\(\\Omega/2\\pi=100\\) MHz、\\(g/2\\pi=40\\) MHz；\\(P=4\\) 的花朵方案门时间 \\(T\\approx1.45\\pi\\Delta(\\Delta-\\eta)/(g\\Omega\\eta)\\sim400\\) ns，若 \\(T_1^{\\mathrm{cav}}\\gtrsim40\\ \\mu s\\)、\\(T_1^{q}\\gtrsim400\\ \\mu s\\) 则 infidelity \\(\\lesssim10^{-3}\\)。两比特模拟：基础方案 \\(1.3\\times10^{-2}\\)（\\(T=223\\) ns）、\\(P=4\\) 花朵 \\(9.6\\times10^{-4}\\)（\\(T=310\\) ns）；衰减系数 \\(0.84\\,T/T_1^{q}+0.12\\,T/T_1^{\\mathrm{cav}}\\)。四比特两腔并行门（\\(J/2\\pi=-65\\) MHz、\\(g/2\\pi=2\\) MHz、\\(\\Omega/2\\pi=190\\) MHz）达 \\(1.5\\times10^{-3}\\)（\\(T=1389\\) ns）。两个四能级 transmon 的裸门为 \\(5.1\\times10^{-2}\\)，主要来自 \\(M_0\\) 增强的腔布居，可用直接腔 tone 抵消。","contribution":"给出一种可并行的腔介导两比特门构造，把误差抵消转化为「相空间路径形状」的设计问题，并首次量化了同一腔阵列上多对门同时工作时的保真度，为 qLDPC 的非局域 syndrome 测量提供了硬件候选。","limitation":"全部为数值模拟，无硬件演示；同时开启多对门所产生的关联错误被作者明确列为超出本文范围；性能高度依赖腔的 \\(T_1\\) 与驱动强度，两个四能级 transmon 的裸门误差仍达 \\(5.1\\times10^{-2}\\)；并行门时间 1389 ns 相对 syndrome 周期偏长；对腔阵列模式串扰只做了单模分析。","key_numbers":["设计点：η/2π = 300 MHz，Δ/2π ≈ 1 GHz，Ω/2π = 100 MHz，g/2π = 40 MHz","P = 4 花朵方案：T ≈ 400 ns，infidelity ≲ 10⁻³（T₁^cav ≳ 40 μs，T₁^q ≳ 400 μs）","两比特模拟：基础 1.3×10⁻²（223 ns）→ 花朵 9.6×10⁻⁴（310 ns）","四比特两腔并行门：1.5×10⁻³（T = 1389 ns，J/2π = −65 MHz）","两个四能级 transmon 裸门 5.1×10⁻²，主要来自 M₀ 增强的腔布居"],"url":"https://doi.org/10.1103/1nt2-f7gl","abstract":"We propose a cavity-mediated gate between two transmon qubits or other nonlinear superconducting elements. The gate is realized by driving both qubits at a frequency that is near-resonant with the frequency of the cavity. Since both qubits are subject to a cross-resonant drive, we call this gate a cross-cross-resonance gate. In close analogy with gates between trapped-ion qubits, in phase space, the state of the cavity makes a circle whose area depends on the states of the two qubits, thus realizing a controlled-phase gate. We propose two schemes for canceling the dominant error, which is the qubit-cavity dispersive coupling. We also show that this cross-cross-resonance gate allows one to realize simultaneous gates between multiple pairs of qubits coupled via the same metamaterial composed of an array of coupled cavities or other linear mediators.","review":{"verdict":"小修","confidence":"中","correctness":"相空间回路面积决定条件相位的论证在腔 QED 里是标准结果，两种误差抵消方案也给出了解析条件与数值验证；门时间公式与模拟值（\\(\\sim400\\) ns vs 310 ns）大体一致，衰减系数分解 \\(0.84\\,T/T_1^{q}+0.12\\,T/T_1^{\\mathrm{cav}}\\) 说明误差预算被明确拆开。但所有结论都建立在主方程模拟上，缺少对高阶非线性与腔阵列模式杂化的严格处理。","weaknesses":"· 无硬件数据，\\(\\lesssim10^{-3}\\) 完全依赖模拟与理想化的 \\(T_1\\) 假设\n· 并行门之间的关联错误被排除在范围外，而这恰是多对同时工作的主要风险\n· 四能级 transmon 的裸门误差 5.1% 说明该方案对能级结构相当敏感，缓解手段（直接腔 tone）只给了可行性论证\n· 并行门 1389 ns 对 qLDPC 的 syndrome 周期偏慢，文中未与具体码的周期预算对齐\n· 对超材料腔阵列只分析单模，模式间杂化与频率拥挤未量化","overclaim":"摘要强调「可同时作用于多对比特」，但并行门的保真度 \\(1.5\\times10^{-3}\\) 是在两腔四比特、且忽略门间关联错误的条件下得到的；把它当作 qLDPC syndrome 测量的现成方案会低估工程难度。","citations":"对腔介导门、cross-resonance、离子阱相空间门与超材料腔阵列的引用覆盖良好；不足是对已有的多比特腔总线方案缺少同口径的保真度对比表。","questions":"① 若腔阵列模式间隔只有几十 MHz，串扰会把 1.5×10⁻³ 推到多少？② 关联错误在 N 对同时开门时如何标度？③ 直接腔 tone 抵消在实验中如何标定？④ 1389 ns 能否通过提高 Ω 压到 syndrome 预算内？","basis":"全文（PRX Quantum 7, 043034 (2026) PDF，含附录与模拟细节）"}},{"id":"2611.22933","no":6,"topics":["测控与噪声"],"source":"arXiv","venue":"arXiv","published":"2026-11-17","title":"Dynamical Decoupling via Continuous Unitary Design","title_zh":"连续酉设计实现的动力学解耦","authors":["Xiaodong Yang","Jun Li"],"importance":4,"importance_reason":"放弃瞬时脉冲近似，用连续酉设计（CUD）块加自由演化拼出通用解耦序列，并给出抑制 Rabi 幅度误差的闭式相位条件；在 17 比特超导云芯片上用统一的 \\(\\eta\\) 指标与 Free/CPMG/XY/UR 四条基线正面比较，对做长门与长相干时间标定的组有直接参考价值。","summary":"提出连续酉设计动力学解耦（CUDD）：把 CUD 块在四分之一点处与自由演化拼接，得到不依赖瞬时脉冲近似的通用解耦序列，并用闭式相位条件抑制 Rabi 幅度误差；在 17 比特超导芯片上多数 \\(\\tau\\) 点优于 CPMG/XY/UR 基线。","problem":"常规动力学解耦（CPMG、XY、UR 等）建立在理想瞬时 \\(\\pi\\) 脉冲近似上，真实器件里脉冲有有限宽度与幅度误差，近似失效会让解耦效果打折；同时，短 \\(\\tau\\) 区间的误差积累最难压制。需要一套不依赖该近似、且对驱动幅度误差鲁棒的通用序列。","method":"把连续酉设计（CUD）块作为基本单元：\\(u(s)=\\frac{\\Omega}{\\sqrt5}(\\sqrt2\\cos(\\Omega s/\\sqrt5+\\phi_k),\\sqrt2\\sin(\\Omega s/\\sqrt5+\\phi_k),1)\\)，相位 \\(\\phi_k=\\pi/2+(\\pi/2)[(k-1)\\bmod 4]\\)，块间在四分之一点插入自由演化 \\(\\xi=30\\) ns，按闭式相位条件拼接成 CUDD4/CUDD8。在 17 比特超导云芯片 QZ01 的 Q3、Q4、Q13 上测 Ramsey 型衰减，统一用 \\(\\eta=\\left|\\int[P_1(t)-0.5]\\,dt\\right|/\\left|\\int[P_{\\mathrm{free}}(t)-0.5]\\,dt\\right|\\)（\\(T=40\\) 次重复）作为保真度代理，与 Free、CPMG4、XY4、UR4 对比，并在 \\(\\pm5\\) MHz 失谐与 Rabi 幅度误差下扫鲁棒性。","result":"CUDD4 在三个比特上、多数 \\(\\tau\\) 点优于全部四条基线，且在短 \\(\\tau\\) 处增益最大；例外是 Q4 与 Q13 在 \\(\\tau=30\\) ns 处未占优。\\(\\tau=60\\) ns 时 CUDD8 相对 CPMG8/XY8/UR8 在 Q4 上对 Rabi 幅度误差与 \\(\\pm5\\) MHz 失谐最稳健。","contribution":"把「解耦序列」从脉冲级提升到连续驱动级，给出可解析设计的相位条件，使序列对驱动幅度误差不敏感；并在真实超导芯片上以统一指标做了四条基线的横向对比，提供了可复现的评测口径。","limitation":"只测了三个比特（Q3、Q4、Q13）与一个芯片，统计样本小；\\(\\eta\\) 是积分型代理指标而非 T2 或门保真度，具体 T2 数值只放在补充材料里；短 \\(\\tau=30\\) ns 处两个比特未占优，说明增益并非一致；数据需向通讯作者索取，复现门槛较高；未讨论多比特串扰与同时驱动的相互影响。","key_numbers":["17 比特超导云芯片 QZ01，测试比特 Q3、Q4、Q13","CUD 块间隔 ξ = 30 ns，相位 φ_k = π/2 + (π/2)[(k−1) mod 4]","CUDD4 在三个比特多数 τ 点优于 Free/CPMG4/XY4/UR4，短 τ 增益最大","τ = 60 ns 时 CUDD8 对 Rabi 幅度误差与 ±5 MHz 失谐最稳健（Q4）","评测指标 η 取 T = 40 次重复的积分比"],"url":"https://arxiv.org/abs/2611.22933","abstract":"Dynamical decoupling is a cornerstone of quantum control for protecting and engineering quantum systems. However, conventional schemes rely on idealized instantaneous pulses, limiting their performance under realistic finite-duration and imperfect controls. To overcome this limitation, we establish a dynamical decoupling framework based on continuous unitary designs, which intrinsically suppresses arbitrary static noise during continuous control. We further derive closed-form phase conditions to suppress Rabi-amplitude errors, unifying universal decoupling, finite-pulse compatibility, and control-error robustness within a single analytical framework. We experimentally validate our approach on a superconducting quantum cloud platform, demonstrating significantly extended coherence times and the highest robustness against Rabi-amplitude errors and detuning among the tested sequences.","review":{"verdict":"小修","confidence":"中","correctness":"CUD 块在四分之一点接自由演化可解析地抵消一阶噪声，这一构造有闭式相位条件作支撑，比经验性脉冲序列更可解释；四基线横向对比与失谐/幅度误差扫描给出的趋势一致。不过主指标 \\(\\eta\\) 是积分面积比，对慢漂移与读出误差的敏感度未单独评估，T2 数值被放在补充材料里，削弱了主文结论的强度。","weaknesses":"· 只覆盖一个芯片的三个比特，跨芯片、跨比特的一致性未验证\n· \\(\\eta\\) 作为代理指标缺少与 T2/门保真度的标定曲线\n· \\(\\tau=30\\) ns 处 Q4、Q13 未占优，作者未解释机制\n· 数据「可向通讯作者索取」，不满足可复现的最低要求\n· 未讨论多比特同时驱动时的串扰与选择性","overclaim":"摘要的「通用解耦」容易被读成对任意噪声谱都成立；实际只在准静态失谐与 Rabi 幅度误差两类扰动下验证，\\(1/f\\) 低频噪声以外的高频成分未覆盖。","citations":"对动力学解耦、CUD 与超导相干性测量的引用完整；不足是未与近年基于最优控制的鲁棒脉冲（如 BB1、CORPSE 类）做对照。","questions":"① 换成 T2 直接测量后排序是否不变？② \\(\\tau=30\\) ns 的劣势来自脉冲重叠还是读出？③ 相邻比特同时驱动时选择性有多差？④ CUDD8 的时间开销相对 CPMG8 增加多少？","basis":"全文（arXiv:2611.22933 PDF；T2 细节在补充材料，主文以 η 指标呈现）"}},{"id":"2611.24054","no":7,"topics":["纠错码"],"source":"arXiv","venue":"arXiv","published":"2026-11-18","title":"Reliability of quantum communication over erasure channels","title_zh":"擦除信道上量子通信的可靠性","authors":["Hongyu Mao","Kun Fang"],"importance":4,"importance_reason":"对独立擦除信道给出对任意 CPTP 编解码都成立的可靠性上界，并证明在临界速率以上随机编码界与逆定理吻合，从而让「稳定子码是否够用」第一次有了确切答案——这是量子香农理论里少见的把有限码与可达界对齐的结果。","summary":"研究独立擦除信道上的无辅助纠缠传输：给出对任意 CPTP 编解码成立的显式可靠性上界，并证明在容量以下、临界速率 \\([1-(d^2+1)p]/[1+(d^2-1)p]\\) 以上时随机编码界与逆定理吻合，稳定子码与无限制编码的可靠性函数相同。","problem":"擦除信道的量子容量是 \\(\\max\\{1-2p,0\\}\\ln d\\)，但「给定速率下能达到多小的错误率」这一可靠性函数长期只有上界或只对特定编码成立；工程上真正关心的是稳定子码（可用综合征解码实现）能否达到无限制编码的可靠性，此前没有确切答案。","method":"考虑素数局部维度 \\(d\\)、擦除概率 \\(0<p<1/2\\)、接收方已知擦除位置的独立擦除信道，编码把 \\(k\\) 个逻辑系统映到 \\(n\\) 个物理系统、速率 \\(k/n\\ge r\\)。先由上界常数误差界（\\([\\mathrm{MW14},\\ \\text{Thm 2}]\\)，Prop. 3.5）得到容量以上的可靠性上界，再用随机编码加指数剔除构造稳定子编码与综合征解码（Thm 3.1，Props. 3.1、3.3），得到对任意 CPTP 编解码都成立、且可显式计算的可靠性上界——其形式是容量边界处该速率对应的擦除比例与信道实际擦除概率之间的二元相对熵。","result":"（1）在容量以下每个正速率处都给出显式可靠性上界，且对任意 CPTP 编码与恢复成立；（2）在容量以下且速率不低于临界值 \\([1-(d^2+1)p]/[1+(d^2-1)p]\\) 时，随机编码给出的界与逆定理吻合，于是稳定子码与无限制编码的可靠性函数存在且相等（Cor. 3.1）；特别地当 \\(p\\ge1/(d^2+1)\\) 时，该结论对容量以下所有正速率成立。正文第 3 节给出数值示例。","contribution":"把「稳定子码够不够」从猜测变成定理：在临界速率以上二者可靠性函数相同，同时给出对任意编解码都可用的显式可靠性上界，为擦除信道上的码设计提供了紧的基准线。","limitation":"只处理独立擦除信道，且要求接收方已知擦除位置；临界速率以下稳定子码是否仍最优没有回答；结果对素数局部维度成立，复合维度需另行处理；未涉及有限码长下的常数与解码复杂度；也未讨论存在辅助纠缠或反馈时的情形（附录 B 只做了一维比较）。","key_numbers":["容量 max{1−2p, 0}·ln d nats，0 < p < 1/2，素数局部维度 d","临界速率 [1−(d²+1)p] / [1+(d²−1)p]","p ≥ 1/(d²+1) 时，容量以下所有正速率上稳定子可靠性函数与无限制编码相同","上界形式：容量边界处擦除比例与实际擦除概率的二元相对熵","编码 k → n 个 d 维系统，实际速率 k/n ≥ r"],"url":"https://arxiv.org/abs/2611.24054","abstract":"Quantum information can be reliably transmitted at rates below the quantum capacity with an error that vanishes as the number of channel uses grows. The reliability function characterizes the optimal exponential decay rate of this error. For quantum erasure channels with a prime input dimension, we determine the reliability function exactly at all positive communication rates below capacity that meet or exceed an explicit critical rate. Notably, stabilizer coding strategies attain this optimal reliability throughout this regime.","review":{"verdict":"小修","confidence":"高","correctness":"证明结构清晰：上界来自已知的常数误差界，可达性用随机编码 + 指数剔除构造稳定子码，再用综合征解码把「编码存在」转成「可靠性函数相等」。临界速率的表达式与 \\(p\\ge1/(d^2+1)\\) 的推论一致，数值示例也印证了界的形状。属于纯理论结果，正确性主要取决于引理链条，而链条引用的是成熟的量子香农工具。","weaknesses":"· 仅限独立擦除且擦除位置已知，擦除位置未知或相关擦除未覆盖\n· 临界速率以下稳定子码是否最优仍是空白，而这恰是低擦除率区间\n· 结论是存在性，未给构造性编码或解码复杂度\n· 只对素数局部维度，复合维度与 qubit（\\(d=2\\) 素数）之外的实现需另证\n· 数值示例规模小，未与具体 LDPC/表面码的有限长表现对照","overclaim":"摘要的「可靠性函数相同」容易被读成「稳定子码处处最优」；实际上只在临界速率以上成立，低速区仍是开问题，作者在正文里交代了，但摘要没有限定。","citations":"对量子香农、擦除信道容量、稳定子码随机编码的引用扎实（含 [MW14]、[Ost26]、[GKH+21] 等）；不足是对实际码（表面码、qLDPC）在擦除信道上的有限长结果引用较少。","questions":"① 临界速率以下能否构造反例说明稳定子码次优？② 擦除位置未知时上界会松多少？③ 复合局部维度下临界速率如何改写？④ 有限码长下随机编码界与具体 qLDPC 的差距有多大？","basis":"全文（arXiv:2611.24054 PDF，含第 3 节数值与附录 A/B）"}},{"id":"2611.23786","no":8,"topics":["编译与验证"],"source":"arXiv","venue":"arXiv","published":"2026-11-18","title":"QWeaver: Quantum Circuit Cut Workflow with MLIR-based Compiler, Runtime, and Weaver Hybrid Tasks","title_zh":"QWeaver：基于 MLIR 的线路切割编译、运行时与混合任务工作流","authors":["Narasinga Rao Miniskar","Elaine Wong","Vicente Leyton-Ortega","Sharmin Afrose","Jeffrey S. Vetter","Travis S. Humble"],"importance":3,"importance_reason":"把线路切割从「一个 Python 脚本」做成端到端的编译栈：OpenQASM 3 经 MLIR 降到 QIR、用 KaHyPar 做超图划分、QIR-EE 在多后端执行、再按准概率分解重建，并给出 \\(O(8^k)\\) 片段任务与 \\(O(16^k)\\) 采样开销的标度律；对做大规模线路分割与资源估算的组是实用参考。","summary":"QWeaver 用 MLIR 方言承载线路切割：任务图编排 OpenQASM 3 → QIR 片段，KaHyPar 超图划分，QIR-EE 在六个后端执行，再用准概率分解重建；4 比特 GHZ 两处切割的 \\(\\langle Z^{\\otimes n}\\rangle\\) 与理想值差 0.0562。","problem":"线路切割能把大线路拆成可执行的小片段，但现有实现多为脚本级原型：缺少标准中间表示、片段调度与后端执行割裂、重建开销不透明，导致难以判断在给定内存预算下究竟能跑多大线路。","method":"把切割建模成任务图：OpenQASM 3 输入经 MLIR 的 \\(\\texttt{quantum}\\)/\\(\\texttt{qcut}\\) 方言降为 QIR 片段，用 KaHyPar 做超图划分选择割点，片段由 QIR-EE 在 Q-IRIS 上执行，最后的 weave 任务做准概率分解（QPD）重建。以 4 比特 GHZ 两处 wire 切割为基准（3 个两比特片段、\\(8^2=64\\) 组 QPD 实验、192 个片段程序），在 QSIM、XACC 路由的 QPP、Aer、IonQ 等六个模拟/硬件后端上对比，并推导片段数与采样数的标度律；另用 Harris–Ross 铁路实例验证通用性。","result":"编译 1.11–1.14 s、重建 0.16–0.17 s；重建后的 \\(\\langle Z^{\\otimes n}\\rangle\\) 在六个后端上与理想值最大偏差 0.0562；产物是标准 QIR，可移植。标度律：把 \\(O(2^n)\\) 的态矢内存降下来，需要 \\(O(8^k)\\) 的片段任务计划与最多 \\(O(16^k)\\) 的重建采样；在 512 GB 上限下，GHZ-128 在 \\(k=3\\) 时需 33 比特/128 GB，\\(k=4\\) 时 27 比特/<80 GB。","contribution":"给出一个基于标准 IR 的切割编译栈，把「能切多大、代价多少」变成可计算的标度律，并用多后端一致性验证了重建的正确性，使切割从演示走向可移植的工程流程。","limitation":"基准以 4 比特 GHZ 为主，规模偏小；重建偏差 0.0562 对近期待求精度仍偏大；\\(O(16^k)\\) 的采样开销意味着 \\(k\\) 稍大就不可行，实际只在 \\(k\\le4\\) 有意义；六个后端里多数是模拟器，硬件后端只有 IonQ 一类；未与既有切割工具（如 CutQC、Qiskit 切割）做同口径对比。","key_numbers":["4 比特 GHZ + 2 处 wire 切割：3 个两比特片段、64 组 QPD 实验、192 个片段程序","编译 1.11–1.14 s，重建 0.16–0.17 s","重建 ⟨Z^⊗n⟩ 与理想值最大偏差 0.0562（六个后端）","标度律：O(8^k) 片段任务、最多 O(16^k) 重建采样","512 GB 上限：GHZ-128 在 k=3 需 33 比特/128 GB，k=4 需 27 比特/<80 GB"],"url":"https://arxiv.org/abs/2611.23786","abstract":"Quantum computers available today are constrained by limited qubit counts and high noise levels, making the direct execution of large quantum circuits infeasible on a single device, and while quantum circuit cutting addresses this by partitioning a large circuit into smaller subcircuits for independent execution, orchestrating the full end-to-end workflow remains a significant programming challenge. In this paper, we present QWeaver, a task-graph-based programming and orchestration workflow framework for quantum circuit cutting that accepts OpenQASM quantum circuits as input and constructs a directed acyclic task graph. In this graph, the Multi-Level Intermediate Representation (MLIR)-based circuit cut is the first task, responsible for analyzing and partitioning the input circuit into executable fragment representations; the generated fragments are then handed to a set of quantum circuit execution tasks that depend on the cut task and can be dispatched concurrently across available quantum backends via the Quantum Intelligent Runtime System (Q-IRIS). Finally, a weaving task, dependent on all execution tasks, performs classical post-processing that applies quasi-probability reconstruction techniques to combine the sampled measurement outcomes of all fragments and recover an accurate approximation of the original circuit's output distribution. We describe the architecture of QWeaver, its integration with Q-IRIS and the execution engine for the Quantum Intermediate Representation (QIR-EE), validate end-to-end reconstruction on GHZ and Harris-Ross instances, and evaluate systems and width trade-offs on structured GHZ simulator workloads.","review":{"verdict":"小修","confidence":"中","correctness":"用标准 IR 承载切割、把 QPD 重建作为一个任务节点，这套编排是正确的工程化路线；标度律 \\(O(8^k)\\)/\\(O(16^k)\\) 与切割理论的已知指数一致，多后端一致性也说明实现没有明显错误。不过验证规模小，0.0562 的偏差既可能来自采样噪声也可能来自实现细节，文中未做误差分解。","weaknesses":"· 主基准只有 4 比特 GHZ，无法支撑「可扩展到 128 比特」的实践结论\n· 0.0562 的偏差未分解为采样噪声、后端噪声与实现误差\n· \\(O(16^k)\\) 采样使 \\(k\\ge5\\) 基本不可行，摘要未强调这一硬限制\n· 未与 CutQC、Qiskit 切割等既有工具做同口径比较\n· 硬件后端仅 IonQ 一类，超导后端缺失","overclaim":"标题与摘要的「workflow」暗示端到端可用，但实际只在极小线路上验证，且重建开销的指数增长意味着它更像是「可扩展性分析工具」而非生产级切割方案。","citations":"对线路切割、QPD、MLIR/QIR 生态与 KaHyPar 的引用到位；不足是对切割误差随 \\(k\\) 增长的既有理论结果未做定量对照。","questions":"① 20 比特、\\(k=4\\) 时重建偏差会到多少？② 0.0562 里采样噪声占多大比例？③ 与 CutQC 在相同切割数下的总耗时对比如何？④ 超导后端上 QPD 的基旋转误差如何补偿？","basis":"全文（arXiv:2611.23786 PDF，含 MLIR 方言、任务图与标度分析）"}},{"id":"2611.23448","no":9,"topics":["测控与噪声","芯片与耦合器"],"source":"arXiv","venue":"arXiv","published":"2026-11-18","title":"Compute Before You Digitize: ADC-less Mixed-Signal Processing for Scalable Cryogenic Qubit Readout","title_zh":"先计算再数字化：面向可扩展低温比特读出的无 ADC 混合信号处理","authors":["Qirui Zhang","Ben Toby","He Wang","Benjamin Lienhard","David Blaauw","Dennis Sylvester"],"importance":4,"importance_reason":"指出 4 K 级读出里 50%（Nyquist ADC 占 85%）的功耗花在「先数字化再算」上，于是把解调、积分、降采样全部做成模拟域的无源混频 + 乒乓积分器，在 1.12 M 次实验数据上把读出功耗降 50.4%，并换算成码距 +2–6 与 LER 降低 1.6–204×；这是少见的把器件功耗直接折算成纠错收益的工作。","summary":"DIRAC 用无源复混频器做模拟解调、乒乓有源 RC 积分器按比特降采样、时域级再数字化，省掉每比特的 Nyquist ADC；22 nm FD-SOI 在 4 K 下用 1.12 M 次实测验证，750 ns 读出窗口内匹配 FP32 保真度，功耗低 31.6×（对 FxP）与 238×（对 FP32）。","problem":"规模化超导量子计算机的瓶颈之一是 4 K 级功耗：常规低温 RX 基带链路里每物理比特的 4 K 功耗有 50% 花在读出上（Nyquist ADC 占 85%），使得 4 K 系统相对柔性电缆只省 37% 功耗。要在同一制冷预算下装更多比特，必须改变「先数字化」这一架构。","method":"DIRAC 把计算前移到模拟域：无源复混频器完成模拟解调，乒乓有源 RC 积分器按比特对波形降采样，时域级再做数字化；TX–RX 协同设计让混频本振直接由读出 TX 基带导出，省掉逐音 PLL；每条线用校准流程联合训练匹配滤波器与神经网络判决。芯片为 22 nm FD-SOI，在 4 K 下用 1.12 M 次实验采样评测，与 FP32 与定点（FxP）基线在相同读出窗口下比较保真度与能量，并把功耗节省折算为固定逻辑比特数、固定 4 K 预算下的码距与 LER 变化。","result":"在 750 ns 读出窗口内与 FP32 保真度相当，能量低 31.6×（对 FxP）与 238×（对 FP32）；每物理比特 4 K 功耗相对 FxP 降 50.4%、相对室温柔性电缆方案降 68.6%。在固定逻辑比特数与 4 K 预算下：Willow 参数下码距可增大 2–6、LER 降 1.6–7.3×；SI1000（\\(p=10^{-3}\\)）下码距增大 2–6、LER 降 4.9–204×。","contribution":"把「读出链路功耗」这一硬件指标与「码距/LER」这一纠错指标打通，给出可复算的折算方法；无 ADC 架构与 TX–RX 协同设计省掉了逐音 PLL 与 Nyquist ADC，为同一 4 K 预算下装更多比特提供了具体路径。","limitation":"评测基于单一 22 nm FD-SOI 芯片与 1.12 M 次实验，跨工艺与跨比特类型（如 fluxonium）未验证；降低码距/LER 的折算依赖 Willow 与 SI1000 两组具体参数与固定 4 K 预算的假设；神经网络判决引入的训练成本与漂移重训需求未量化；只覆盖读出链路，控制链路功耗未计入；750 ns 窗口之外的长窗口收益下降。","key_numbers":["常规低温 RX 链路：读出占每比特 4 K 功耗 50%，其中 Nyquist ADC 占 85%","DIRAC 在 750 ns 窗口匹配 FP32 保真度，能量低 31.6×（FxP）与 238×（FP32）","每物理比特 4 K 功耗降 50.4%（对 FxP）、68.6%（对室温柔性电缆）","固定逻辑比特数与 4 K 预算：码距 +2–6，LER 降 1.6–7.3×（Willow）","SI1000（p = 10⁻³）：码距 +2–6，LER 降 4.9–204×"],"url":"https://arxiv.org/abs/2611.23448","abstract":"We introduce DIRAC, an ADC-less in-cryostat qubit readout architecture that uses analog computing to redraw the analog-digital boundary. Directly operating on the front-end's analog output, passive complex mixers perform the equivalent of digital demodulation, ping-pong active-RC integrators average their outputs into down-sampled per-qubit traces, and a time-domain stage digitizes them, eliminating Nyquist-rate ADCs. A TX-RX co-design derives the mixers' local oscillators from the readout transmitter's baseband rather than per-tone PLLs. A per-line calibration flow trains the matched filter jointly with the neural network, improving fidelity and enabling low-bit-width, low-voltage digital processing. Designed in 22 nm FD-SOI and evaluated at 4 K on 1.12M experimental shots, DIRAC matches the fidelity of a floating-point (FP32) digital pipeline for readout windows down to 750 ns, at 31.6\\(\\times\\) and 238\\(\\times\\) lower energy than the fixed-point (FxP) and FP32 pipelines. It cuts the total 4 K power per physical qubit by 50.4% and 68.6% relative to FxP and room-temperature flex cables, respectively. At a fixed logical-qubit count and 4 K budget, this yields, against FxP, a code distance larger by 2 to 6 and a 1.6-7.3\\(\\times\\) (Willow) and 4.9-204\\(\\times\\) (SI1000, \\(p = 10^{-3}\\)) lower logical error rate.","review":{"verdict":"接受","confidence":"中","correctness":"功耗分解（读出 50%、ADC 85%）与「先计算再数字化」的替代路径都讲得清楚，1.12 M 次实验让「匹配 FP32 保真度」这一说法有数据支撑；把功耗节省折算成码距与 LER 的链条虽然依赖假设，但每一步都给了公式与参数，可复算。22 nm FD-SOI 的实测数据是本文最硬的部分。","weaknesses":"· 单一芯片、单一批次数据，跨工艺/跨比特类型未验证\n· 码距 +2–6、LER 1.6–204× 高度依赖 Willow 与 SI1000 的具体参数与「固定 4 K 预算」假设\n· 神经网络判决的训练开销、漂移重训与失效模式未讨论\n· 只算读出链路，控制链路与线缆功耗未纳入总账\n· 750 ns 之外的长窗口收益未系统给出","overclaim":"摘要把「码距 +2–6、LER 降 204×」作为结论呈现，容易被读成硬件实测的纠错收益；实际上这是把功耗差按模型折算到码参数上的推演，中间隔着制冷预算分配与码族假设两层。","citations":"对低温 CMOS 读出、4 K 功耗预算与超导纠错资源估算的引用充分；不足是未与近年其他无 ADC/模拟域读出方案做能量–保真度同口径对比。","questions":"① 换到 fluxonium 或更高阻抗器件上，750 ns 还够吗？② 神经网络判决在温度漂移下多久要重训？③ 如果把控制链路也纳入，总节省会降到多少？④ 折算里的「固定 4 K 预算」如何分配到读出与控制？","basis":"全文（arXiv:2611.23448 PDF，含芯片架构、1.12 M 次实测与折算模型）"}},{"id":"2611.23827","no":10,"topics":["测控与噪声","Pauli 传播"],"source":"arXiv","venue":"arXiv","published":"2026-11-18","title":"Covering the Pauli Observables: Sampling Thresholds and the Design Effect of a Measurement Setting","title_zh":"覆盖 Pauli 可观测量：测量设置的采样阈值与设计效应","authors":["Kausthubh Chandramouli","Noah Siekierski","Bojko N. Bakalov","Dror Baron"],"importance":3,"importance_reason":"把「用随机 X/Y/Z 基覆盖全部 Pauli 可观测量」这件事变成可算的阈值问题：每比特的覆盖阈值按 \\(33/4\\) 增长，随机采样的最优性差距小于 1.69；并给出设计效应 \\(D=2^n/\\nu\\) 这一可直接用于实验规划的公式，六比特数值上把测量次数降 7.6–38×。","summary":"研究随机 X/Y/Z 测量设置对全部 Pauli 可观测量的覆盖：证明每比特覆盖阈值以 \\(33/4\\) 增长，自然对数形式等于零失真率失真函数；随机采样在常数 1.69 以内最优，并给出设计效应 \\(D=2^n/\\nu\\) 与无偏估计式，六比特模拟把测量次数降 7.6–38×。","problem":"用少量测量设置覆盖 \\(4^n-1\\) 个 Pauli 可观测量是影子层析与 Pauli 期望估计的共同需求，但「需要多少次随机设置才能覆盖」缺少精确阈值，实验上也说不清随机采样比最优设计差多少、偏差如何修正；缺少可操作的规划公式。","method":"把测量设置看成对 Pauli 群元素的覆盖抽样：对每比特独立均匀抽 X/Y/Z，分析覆盖全部可观测量所需的设置数阈值，并与率失真理论对比（零失真率失真函数）。用设计效应 \\(D=2^n/\\nu\\)（\\(\\nu=(\\sum_b p(b)^2)^{-1}\\) 为有效样本数）刻画「同一设置重复」带来的方差放大，给出无偏估计式（Eq. 39）与置信区间；在 6 比特 GHZ/W/Haar/乘积态上做数值验证，并与 Haar 随机、贪心设计对比。","result":"覆盖阈值按每比特 \\(33/4\\) 增长；自然对数形式恰为零失真率失真函数。随机采样的最优性差距小于 1.69。设计效应：Haar 随机设置的均值小于 2，而 GHZ/W 态可达 \\((1/2)(4/3)^n\\)。六比特数值：随机采样相对逐项测量把运行次数降 7.6–38×；用直方图拟合噪声时误差约减半且覆盖率 93%；在 infidelity \\(3\\times10^{-4}\\) 下仍省 24–76× 运行次数。","contribution":"给出一组可直接写进实验规划的常数（\\(33/4\\)、1.69、\\(D\\) 公式），把「随机设置到底亏不亏」量化为常数因子，并提供含噪直方图拟合的误差修正流程。","limitation":"数值只在 6–7 比特、秩一可观测量上验证，更大系统与高阶 Pauli 未覆盖；态族限于 GHZ/W/Haar/乘积态，缺少有噪声的中等纠缠态；每点 50/20 次试验统计量有限；AMP 阈值经过调优，且双白化 AMP 在乘积态上失效；1.69 只是渐近常数，有限 \\(n\\) 的实际差距未给紧界。","key_numbers":["覆盖阈值每比特以 33/4 增长，自然对数形式 = 零失真率失真函数","随机采样最优性差距 < 1.69","设计效应 D = 2^n/ν，GHZ/W 态可达 (1/2)(4/3)^n，Haar 均值 < 2","六比特：运行次数降 7.6–38×；infidelity 3×10⁻⁴ 时省 24–76×","含噪直方图拟合：误差约减半，覆盖率 93%"],"url":"https://arxiv.org/abs/2611.23827","abstract":"Quantum state tomography and shadow-based estimation rely on measuring Pauli observables. An experiment does not measure them one at a time: it chooses a measurement setting that assigns one of the bases X, Y or Z to each qubit, and a single run in that setting yields estimates of every Pauli observable compatible with it. We say that the setting covers those observables. We determine how many random settings cover a prescribed fraction of all Pauli observables. As the number of settings grows exponentially with the number of qubits, the covered fraction has a sharp threshold at a growth rate of \\(3^{3/4}\\) per qubit, set by the rate-distortion function of covering at zero distortion. We give an explicit expression for the number of settings needed to reach a target fraction, accurate up to a remainder that reduces to a small oscillation for many qubits, and show that random sampling is asymptotically optimal up to a factor of less than 1.69. Coverage does not determine what a setting contributes to an estimator. Observables covered by one setting are estimated from the same outcomes, so their estimates are correlated. We quantify this correlation through the design effect of a setting, which equals the squared Pauli expectation that the setting captures and depends on the target state. We derive its mean over settings in closed form for every state and show that it can be estimated without bias from the measurement data. In simulations on six qubits, measuring settings needs 7.6 to 38 times fewer circuit runs than measuring the same number of observables independently. At high coverage, fitting the outcome histograms instead of averaged estimates roughly halves the reconstruction error, mainly because the fit counts how many settings cover each observable. The correlation itself costs such a fit about a factor of two, and a larger design effect signals more to gain from modeling it.","review":{"verdict":"小修","confidence":"中","correctness":"把覆盖问题与率失真函数对上，是一个干净的等价；\\(33/4\\) 的线性增长与 1.69 的常数界在推导上自洽，数值部分的 7.6–38× 与设计效应公式相互印证。不过数值规模小（6–7 比特）、态族刻意挑选，结论外推到 50–100 比特需要额外论证。","weaknesses":"· 数值只到 6–7 比特、秩一可观测量，未验证高权重 Pauli 与多体关联\n· 态族是 GHZ/W/Haar/乘积四个极端，缺少中等纠缠的有噪态\n· 每点 50/20 次试验，置信区间较宽\n· 双白化 AMP 在乘积态上失效，说明方法的适用范围有隐含条件\n· 1.69 是渐近常数，有限 \\(n\\) 的紧界未给出","overclaim":"摘要的「把运行次数降 7.6–38×」容易被读成普遍收益；实际是在特定态族与 6 比特规模下、相对逐项测量基线的比较，真实硬件上读出错误与设置间漂移会吃掉一部分收益。","citations":"对影子层析、Pauli 估计与率失真理论的引用到位；不足是未与经典 shadow 协议（如 derandomized shadow、classical shadow with priors）做同口径比较。","questions":"① 到 20 比特时随机采样与贪心设计的差距会不会超过 1.69？② 有噪中等纠缠态下 7.6–38× 还剩多少？③ 读出错误如何进入设计效应公式？④ 高权重 Pauli 的覆盖阈值是否仍是 33/4 每比特？","basis":"全文（arXiv:2611.23827 PDF，含定理与六比特数值）"}},{"id":"2611.23975","no":11,"topics":["经典模拟"],"source":"arXiv","venue":"arXiv","published":"2026-11-18","title":"Efficient Spectra and Dynamics with Tangent-Space Chebyshev Tree Tensor Networks","title_zh":"切空间 Chebyshev 树张量网络的高效谱与动力学","authors":["Zhangyu Yang","Xingyao Wu","Shuo Sun","Yu Wang","Weitang Li","Jan von Delft","Christian B. Mendl","Zhigang Shuai"],"importance":3,"importance_reason":"把 Chebyshev 递推、树张量网络与切空间投影合成一个不反复压缩的谱方法：三项递推的内存与阶数无关，GPU 收缩后相对既有 Chebyshev 张量网络加速 46.8×、相对单点 TDVP 加速 13.7×，并撑到 100 分子规模的电荷输运算例。","summary":"TaChe 在单点/两点切空间里用 Chebyshev 递推加最大熵谱分析，避免反复压缩，三项递推内存与阶数无关并支持 GPU 收缩；相对既有 Chebyshev 张量网络加速 46.8×、相对单点 TDVP 加速 13.7×。","problem":"张量网络求谱与动力学时，常规做法（TDVP、反复压缩、Lanczos）在长时演化与大 Hilbert 空间下要么内存爆炸、要么精度随压缩次数衰减；Chebyshev 方法虽能给出宽频谱，但与张量网络的结合一直受限于压缩与投影的开销。","method":"用树张量网络（TTNS）表示态，把 Chebyshev 三项递推放在单点/两点切空间内做，使每次递推只需一次局部收缩而不必反复压缩全网络；递推得到 Chebyshev 矩后用最大熵谱分析重建谱密度；GPU 实现收缩。以乙腈、热聚集体发光、\\(6\\times6\\) 格点电荷输运（最多 100 分子）为算例，与既有 Chebyshev 张量网络、单点 TDVP 比较耗时与精度，\\(D=32\\)、298 K、Lorentzian 半高半宽 140 cm\\(^{-1}\\)，代码开源。","result":"相对既有 Chebyshev 张量网络加速 46.8×，相对单点 TDVP 加速 13.7×；三项递推的内存占用与 Chebyshev 阶数无关；\\(6\\times6\\) 格点、最多 100 分子的电荷输运可算；乙腈与热聚集体发光的谱在 298 K、140 cm\\(^{-1}\\) 展宽下与参考吻合；代码发布于 GitHub（yangz15/TangentChebyshev）。","contribution":"给出一个「递推在切空间、压缩只做一次」的谱方法，把 Chebyshev 方法与树张量网络的结合从概念推到可跑大算例的工程实现，并开源代码与算例，便于在分子聚集体与格点模型上复用。","limitation":"精度依赖参考态与切空间维度的选取，缺少系统的误差–截断维数扫描；向 PEPS 扩展需要合适的范数度量，本文未实现；耗散/有限温度动力学被列为未来工作；算例集中在分子振动与电荷输运，未覆盖强关联格点模型；\\(D=32\\) 对二维强纠缠体系可能不足。","key_numbers":["相对既有 Chebyshev 张量网络 46.8×，相对单点 TDVP 13.7×","三项递推内存与 Chebyshev 阶数无关","6×6 格点电荷输运，最多 100 分子；TTNS 键维 D = 32","298 K、Lorentzian 半高半宽 140 cm⁻¹ 下的谱重建","单点/两点切空间内完成递推，压缩只发生一次"],"url":"https://arxiv.org/abs/2611.23975","abstract":"We present a tangent-space Chebyshev method (TaChe), which combines tree tensor network states with Chebyshev recursion and maximum entropy spectral analysis in a tree tensor network tangent space, for quantum many-body spectra and dynamics. Implemented tensor network state calculations in the tangent space of the ground state, the core advantage of TaChe is that it can substantially reduce the computational complexity, memory usage, and numerical instability associated with tensor network state compression. Implemented on the GPU platform, it produces accurate spectra with speedups of up to \\(46.8\\) over the previous Chebyshev tensor network method and \\(13.7\\) over one-site time-dependent variational principle propagation in the reported benchmarks. Applications to acetonitrile, thermal aggregate emission, finite-temperature charge transport on a \\(6\\times6\\) lattice, and internal conversion in aggregates of up to 100 molecules demonstrate the efficiency and versatility of TaChe in simulating complex molecular systems.","review":{"verdict":"小修","confidence":"中","correctness":"把 Chebyshev 递推移进切空间能避免每次迭代的全网络压缩，这一改动的算法收益是可解释的，46.8×/13.7× 的加速与内存恒定的性质一致；谱重建用最大熵也在方法上稳妥。但缺少截断维数–精度的系统扫描，使「高效」缺少误差侧的对照。","weaknesses":"· 没有误差–键维（\\(D\\)）系统扫描，46.8× 的加速可能以精度为代价\n· 与 TDVP 的比较只给单点变体，未含两点 TDVP 或其它谱方法\n· PEPS 扩展与耗散动力学都留作未来工作，适用面受限\n· 算例偏分子与格点输运，强关联（如 Hubbard、自旋液体）未验证\n· 与既有方法的精度对照图少，读者难判断加速是否「同等精度下」","overclaim":"摘要的「高效」与数十倍加速未限定在同等精度下；若精度对照显示切空间近似引入可见误差，则加速应打折理解。","citations":"对 Chebyshev 谱方法、TTNS 与 TDVP 的引用完整；不足是对近年基于 MPO 压缩的谱方法（如 correction-vector DMRG）缺少耗时对比。","questions":"① 在同等精度下加速还有多少？② 键维降到 16 时谱峰位置偏移多大？③ 二维 Hubbard 模型能否在 \\(D=32\\) 下收敛？④ 有限温度耗散何时能纳入？","basis":"全文（arXiv:2611.23975 PDF，含算法、算例与开源代码链接）"}},{"id":"2611.24105","no":12,"topics":["纠错码"],"source":"arXiv","venue":"arXiv","published":"2026-11-18","title":"Stabilizer models of achiral abelian topological orders","title_zh":"非手性阿贝尔拓扑序的稳定子模型","authors":["Marvin Qi","Wilbur Shirley"],"importance":3,"importance_reason":"给出一个统一的构造：任何非手性二维阿贝尔拓扑序（玻色型与费米型）都能写成连续变量（CV）稳定子码，办法是在 \\(2N\\) 维任意子晶格上凝聚反常自由的 \\(Z_{2N}\\) 1-形式对称性；这把「哪些拓扑序可被稳定子码实现」从举例变成判据，并给出手性情形不可实现的猜想。","summary":"证明每个非手性二维阿贝尔拓扑序（含费米型）都存在连续变量稳定子模型：在 \\(2N\\) 维 dyon 晶格上通过规范化反常自由的 \\(Z_{2N}\\) 1-形式对称性实现凝聚，费米型对应 Majorana-CV 码；并提出非手性等价于可实现的猜想。","problem":"稳定子码能实现哪些拓扑序一直只有零散例子（环面码、\\(Z_N\\) 推广、部分费米型），缺少统一的判据；非手性与可实现性之间的关系、以及手性拓扑序能否用稳定子码实现，都没有系统回答。","method":"从 \\(2N\\) 维 dyon 晶格的规范理论出发，用辛形式 \\(\\langle x,y\\rangle=x^{T}Jy\\)（其中 \\(J\\) 的两个非对角块为 \\(I_N\\)）描述任意子；把 \\(\\varphi_n=1\\) 解释为 \\(2\\pi\\) 磁通，通过在反常自由的 \\(Z_{2N}\\) 1-形式对称性上做规范化实现凝聚，得到 CV 稳定子码；费米型情形引入 Majorana 自由度得到 Majorana-CV 码；并用 \\(N=1\\) 的 \\(2\\times2\\) 偶 K-矩阵与 \\(H=H_R\\otimes H_{Z_2}\\) 作最小例验证。","result":"对每个非手性二维阿贝尔拓扑序（玻色型与费米型）给出显式的 CV 稳定子构造，最小例 \\(N=1\\)、\\(2\\times2\\) 偶 K-矩阵与 \\(H=H_R\\otimes H_{Z_2}\\)（Eq. 44）给出可检验的凝聚图像；并提出猜想：阿贝尔拓扑序非手性 \\(\\Leftrightarrow\\) 可用稳定子码实现，手性情形预期只出现在三维表面。","contribution":"把「稳定子可实现性」从案例推进到覆盖整个非手性阿贝尔类的构造性定理，并给出可证伪的猜想与最小模型，为判断某拓扑序能否用 CV 稳定子码实现提供了统一入口。","limitation":"只覆盖阿贝尔任意子，非阿贝尔拓扑序不在范围内；猜想部分（非手性 \\(\\Leftrightarrow\\) 可实现、手性需三维表面）未证明；CV 稳定子码的物理实现（如 GKP 编码）所需的压缩态质量与误差传播未讨论；费米型的 Majorana-CV 码缺少具体的测量方案与阈值分析。","key_numbers":["任意子晶格维度 2N，辛形式 ⟨x,y⟩ = xᵀJy，J = [[0, I_N], [I_N, 0]]","φ_n = 1 解释为 2π 磁通","最小例 N = 1：2×2 偶 K-矩阵，H = H_R ⊗ H_Z2（Eq. 44）","覆盖全部非手性二维阿贝尔拓扑序（玻色型 + 费米型）","猜想：非手性 ⇔ 稳定子可实现，手性预期仅在三维表面"],"url":"https://arxiv.org/abs/2611.24105","abstract":"We construct continuous-variable stabilizer codes realizing every achiral 2D abelian topological order, both bosonic and fermionic. Starting from an arbitrary signature-zero integer \\(K\\)-matrix, we show that the corresponding topological order can be obtained by condensing a lattice of dyons with trivial pairwise mutual braiding in an \\(\\mathbb{R}^N\\) gauge theory. We implement this condensation microscopically by gauging a non-on-site 1-form symmetry of the \\(\\mathbb{R}^N\\) toric code.","review":{"verdict":"小修","confidence":"中","correctness":"用规范化反常自由的 1-形式对称性来实现任意子凝聚，是凝聚态与拓扑序领域的标准工具，把它落到 CV 稳定子码上这一步论证连贯；\\(2\\times2\\) K-矩阵与 \\(H_R\\otimes H_{Z_2}\\) 的最小例与已知结论一致。属于结构性结果，正确性主要取决于凝聚判据是否完备，这一点文中只给了「反常自由」这一条件。","weaknesses":"· 只覆盖阿贝尔任意子，非阿贝尔类完全未涉及\n· 「非手性 \\(\\Leftrightarrow\\) 可实现」仍是猜想，缺少反例方向的证据\n· CV 稳定子码的物理实现未讨论，GKP 压缩态质量与阈值缺失\n· 费米型 Majorana-CV 码没有给出测量序列或错误模型\n· 与既有 \\(Z_N\\) 环面码、Kitaev 十六倍费米型模型的对应关系只在该文的框架内说明","overclaim":"摘要的「每个非手性阿贝尔拓扑序」是准确限定，但读者容易把「存在 CV 稳定子模型」误当作「存在可容错实现」；论文只证明前者。","citations":"对拓扑序、任意子凝聚、稳定子码与 GKP 的引用扎实；不足是与近期基于 CV 的容错架构工作缺少定量对接。","questions":"① 手性情形能否给出「不可实现」的形式证明？② GKP 压缩有限时该码的阈值在哪里？③ 费米型 Majorana-CV 码的测量序列如何设计？④ 非阿贝尔类需要什么新工具？","basis":"全文（arXiv:2611.24105 PDF，含 §V 讨论与附录 A 最小例）"}},{"id":"2611.23888","no":13,"topics":["大规模仿真","测控与噪声"],"source":"arXiv","venue":"arXiv","published":"2026-11-18","title":"Imaging chiral snake states in a qubit array with programmable gauge fields","title_zh":"用可编程规范场在比特阵列中成像手性蛇形态","authors":["Hanyi Wang","Lijun Sun","Bihao Guo","Weizhi Tao","Jian Ding","Shengbin Wang","Xinfang Zhang","Wei-Yong Zhang","Hantao Sun"],"importance":3,"importance_reason":"在 49 比特超导处理器上用可编程合成规范场做 Harper–Hofstadter 物理：每个 Trotter 步只需一次原生分数 iSWAP，单比特 Z 转动独立设定 36 个 plaquette 磁通，并观测到手性位移约一个晶格常数——这是中等规模比特阵列做拓扑输运实验的一个干净范例。","summary":"在 49 比特超导阵列上用可编程合成规范场实现 Harper–Hofstadter 模型：一次原生分数 iSWAP 完成一步 hopping、36 个 plaquette 磁通独立可调，观测量子霍尔式手性位移与磁反射，并给出不同 iSWAP 幂次下的手征性对比。","problem":"在超导比特阵列上模拟规范场与拓扑输运，难点在于 hop 的相位要能逐 plaquette 独立编程、且 Trotter 步数要少到能在相干时间内看到手性效应；已有实现多为固定磁通或依赖多脉冲合成，难以同时满足可编程性与低线路深度。","method":"用一步原生分数 iSWAP（\\(\\mathrm{iSWAP}^{1/6}\\)、\\(\\mathrm{iSWAP}^{1/3}\\) 等幂次）实现一个 Trotter 步的 hop，用单比特 Z 转动给 36 个 plaquette 独立设定磁通 \\(\\Phi\\)；制备单激发态并通过后选择 \\(\\sum m_i=1\\) 抑制泄漏，读出用响应矩阵做误差缓解；观测 Aharonov–Bohm 抑制、无序致慢化、磁反射与场反向时的方向反转，并用连续模型对比手征位移 \\(C\\)。","result":"手性位移在一次十轮 Trotter 后约为一个晶格常数，对称破缺残差 \\(<0.05\\) 晶格常数；\\(\\Phi=\\pi/4\\)、\\(Jt=14\\pi/12\\) 时连续模型给出 \\(C=1.18\\)，\\(\\mathrm{iSWAP}^{1/6}\\) 实现得 \\(1.15\\)，\\(\\mathrm{iSWAP}^{1/3}\\) 只得到 \\(0.44\\)，说明 hop 的分数化程度直接决定手征性；并观测到磁反射与场反向后方向反转。","contribution":"把「可编程规范场」落到只需一次原生门/Trotter 步的实现上，用 36 个独立 plaquette 磁通展示了 Harper–Hofstadter 的主要输运现象，并量化了门分数化对手征性的影响，为更大规模拓扑输运实验提供了线路深度可接受的模板。","limitation":"单激发子空间与后选择 \\(\\sum m_i=1\\) 把多体效应排除在外，本质是单粒子量子行走；49 比特里实际参与输运的区域有限；\\(\\mathrm{iSWAP}^{1/3}\\) 下 \\(C\\) 跌到 0.44 说明结果对手性门质量敏感；读出缓解依赖响应矩阵标定，漂移下会退化；未测量拓扑不变量本身，只测位移代理。","key_numbers":["49 比特超导处理器，36 个 plaquette 磁通独立编程","十轮 Trotter 后手性位移约 1 个晶格常数，对称破缺残差 < 0.05","Φ = π/4、Jt = 14π/12：连续模型 C = 1.18，iSWAP^{1/6} 得 1.15，iSWAP^{1/3} 得 0.44","单 Trotter 步仅需一次原生分数 iSWAP","后选择 Σm_i = 1 抑制泄漏，响应矩阵做读出缓解"],"url":"https://arxiv.org/abs/2611.23888","abstract":"Spatially varying magnetic fields steer charged particles along directed paths. Where a field reverses sign, particles follow snake-like orbits along the reversal line, in a direction set by both the field orientation and the sign of their energy. Transport measurements have detected such snake states, but imaging their dynamics in a reprogrammable field landscape remains challenging. Here we digitally simulate the Harper--Hofstadter model with programmable synthetic magnetic fields on a 49-qubit superconducting processor. In each Trotter step, every hopping term is one native fractional-iSWAP gate, and single-qubit \\(Z\\) rotations set all 36 plaquette fluxes independently, without additional entangling gates. Uniform, random, and stepped flux landscapes reveal Aharonov--Bohm suppression of diagonal propagation, disorder-induced slowing, and magnetic reflection. At a field reversal, bonding and antibonding initial states, which carry opposite energy biases, propagate in opposite directions, and both directions reverse when the field is inverted. A symmetry analysis of these reversals yields a chiral displacement of nearly one lattice spacing after ten Trotter rounds, with symmetry-breaking residuals below 0.05 lattice spacings. Bond-resolved flux programming with site-resolved imaging thus provides a quantitative tool for synthetic gauge fields and a route to time-dependent gauge fields and interacting particles.","review":{"verdict":"小修","confidence":"中","correctness":"一次分数 iSWAP 对应一次 hop、Z 转动设定 plaquette 磁通，这套映射在 Harper–Hofstadter 的单粒子极限下是精确的；\\(C=1.15\\) 与连续模型 \\(1.18\\) 的吻合，以及 \\(\\mathrm{iSWAP}^{1/3}\\) 下跌到 0.44 的对照，共同说明测到的是真实的手征输运而非拟合产物。后选择与响应矩阵缓解也交代得具体。","weaknesses":"· 单激发子空间 + 后选择，实际是单粒子行走，不能声称模拟了多体拓扑态\n· 只测手性位移这一代理量，未直接测 Chern 数或边缘流\n· 结果对手性门质量高度敏感（\\(\\mathrm{iSWAP}^{1/3}\\) 时 \\(C\\) 掉到 0.44）\n· 响应矩阵缓解在漂移下的稳定性未评估\n· 49 比特中真正参与输运的区域与有效格点尺寸未清楚交代","overclaim":"摘要的「成像手性蛇形态」容易让人以为看到了多体拓扑边缘态；实际上是在单激发子空间里追踪波包位移，作者在正文限定了，但标题的修辞强于证据。","citations":"对 Harper–Hofstadter、合成规范场与超导阵列模拟的引用到位；不足是未与冷原子/光子阵列的同类手征位移实验做定量对比。","questions":"① 多激发下后选择失效时还能看到手征性吗？② 直接测 Chern 数需要多少 Trotter 步？③ \\(\\mathrm{iSWAP}^{1/3}\\) 的退化为线性自旋波模型时 C 会是多少？④ 响应矩阵多久需要重标定？","basis":"全文（arXiv:2611.23888 PDF，含线路、后选择与输运数据）"}}]}</script>
<script>
(function () {
  "use strict";
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  const META = DATA.meta || {};
  const ARTICLES = Array.isArray(DATA.articles) ? DATA.articles : [];
  const STORE_KEY = "ftqc-digest-v2";
  const STATUS_LABEL = { inbox: "待读", reading: "在读", done: "已提炼" };
  const IMP_LABEL = { 5: "必读", 4: "高", 3: "中", 2: "参考", 1: "低" };
  const IMP_STYLE = {
    5: ["#c62828", "#fdeaea"],
    4: ["#1f4fd1", "#e9efff"],
    3: ["#087a5b", "#e3f6ee"],
    2: ["#9a5b00", "#fff3d6"],
    1: ["#6b7280", "#f0f1f1"]
  };
  const PALETTE = [
    ["#1f4fd1", "#e9efff"],
    ["#c2410c", "#fff0e6"],
    ["#087a5b", "#e3f6ee"],
    ["#6d45c7", "#f0eaff"],
    ["#9a5b00", "#fff3d6"],
    ["#b3266e", "#fde8f2"],
    ["#0e7490", "#e2f5f8"]
  ];
  const SOURCE_STYLE = {
    "arXiv": ["#c2410c", "#fff0e6"],
    "PRX": ["#1f4fd1", "#e9efff"],
    "PRX Quantum": ["#6d45c7", "#f0eaff"]
  };
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const esc = (v) => String(v == null ? "" : v)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  let store = {};
  try { store = JSON.parse(localStorage.getItem(STORE_KEY) || "{}") || {}; } catch (e) { store = {}; }
  const wf = (id) => store[id] || (store[id] = { status: "inbox", note: "" });
  const save = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) { toast("浏览器阻止本地存储，修改仅在当前页有效"); } };
  let toastTimer;
  function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1800); }
  const dateOnly = (v) => String(v || "").slice(0, 10);

  // topic palette, stable by first appearance
  const allTopics = [];
  ARTICLES.forEach(a => (a.topics || []).forEach(t => { if (!allTopics.includes(t)) allTopics.push(t); }));
  const topicColor = {};
  allTopics.forEach((t, i) => { topicColor[t] = PALETTE[i % PALETTE.length]; });
  const sourceCounts = {};
  ARTICLES.forEach(a => { sourceCounts[a.source] = (sourceCounts[a.source] || 0) + 1; });
  const mustRead = ARTICLES.filter(a => a.importance >= 5).length;

  $("#pageTitle").textContent = META.title || "文献速递";
  $("#pageSubtitle").textContent = META.subtitle || "容错量子计算与超导量子计算机仿真";
  $("#issueDate").textContent = META.issue_date || "—";
  const reviewed = ARTICLES.filter(a => a.review).length;
  $("#issueCounts").innerHTML = `${ARTICLES.length} 篇 · 必读 <b>${mustRead}</b> 篇${reviewed ? ` · AI 审稿 ${reviewed}` : ""}`;
  $("#asOf").textContent = META.collection_window || ("数据截至 " + (META.as_of || "—"));
  $("#generatedAt").textContent = META.generated_at || "—";
  $("#scopeLink").href = META.scope_href || "../SCOPE.md";

  const GROUP_STYLE = {
    "arXiv": "#c2410c",
    "PR 系列": "#1f4fd1",
    "Nature 系列": "#087a5b",
    "Quantum": "#6d45c7",
    "Science Advances": "#b3266e",
    "SciPost Physics": "#0e7490",
    "AVS Quantum Science": "#7a4bb5",
    "Quantum Science and Technology": "#9a5b00",
    "Cryptology ePrint Archive": "#8a5200"
  };
  const journalRows = Array.isArray(META.journals) ? META.journals : [];
  const totals = META.coverage_totals || {
    raw: journalRows.reduce((n, r) => n + Number(r.raw || 0), 0),
    deduped: journalRows.reduce((n, r) => n + Number(r.raw || 0), 0),
    screened: journalRows.reduce((n, r) => n + Number(r.screened || 0), 0),
    included: journalRows.reduce((n, r) => n + Number(r.included || 0), 0)
  };
  $("#coverage").innerHTML = `<details class="coverage">
    <summary><span>检索覆盖</span><span class="nums">抓取 ${totals.raw} · 去重 ${totals.deduped} · 关键词初筛 ${totals.screened} · 收录 ${totals.included}</span></summary>
    <div class="coverage-body">
      <table class="coverage-table">
        <thead><tr><th>来源 / 期刊</th><th>状态</th><th class="num">抓取</th><th class="num">关键词初筛</th><th class="num">收录</th></tr></thead>
        <tbody>
          ${journalRows.map(r => {
            const color = GROUP_STYLE[r.label] || GROUP_STYLE[r.group] || "#303030";
            const st = r.status || "ok";
            const stLabel = st === "ok" ? "正常" : st === "partial" ? "部分" : "失败";
            const stCell = `<td><span class="st st-${st}">${stLabel}</span></td>`;
            if (r.kind === "group") {
              return `<tr class="group"><td>${esc(r.label)}</td>${stCell}<td class="num">${r.raw}</td><td class="num">${r.screened}</td><td class="num">${r.included}</td></tr>`;
            }
            return `<tr class="${r.kind === "journal" ? "sub" : "single"}"><td><span class="coverage-source"><span class="source-dot" style="--sc:${color}"></span>${esc(r.label)}</span></td>${stCell}<td class="num">${r.raw}</td><td class="num">${r.screened}</td><td class="num"><b>${r.included}</b></td></tr>`;
          }).join("")}
          <tr class="total"><td>合计（去重后）</td><td>—</td><td class="num">${totals.deduped}</td><td class="num">${totals.screened}</td><td class="num">${totals.included}</td></tr>
        </tbody>
      </table>
    </div>
  </details>`;

  // keyword bar
  const state = { topic: "all" };
  function countTopic(t) { return ARTICLES.filter(a => (a.topics || []).includes(t)).length; }
  function renderKeywordBar() {
    const items = [`<button class="kbtn kbtn-all" data-topic="all" aria-pressed="${state.topic === "all"}">全部<span class="c">${ARTICLES.length}</span></button>`];
    allTopics.forEach(t => {
      const [c, bg] = topicColor[t];
      items.push(`<button class="kbtn" data-topic="${esc(t)}" aria-pressed="${state.topic === t}" style="--tc:${c};--tbg:${bg}">${esc(t)}<span class="c">${countTopic(t)}</span></button>`);
    });
    $("#keywordBar").innerHTML = items.join("");
  }
  renderKeywordBar();

  function impColor(v) { return IMP_STYLE[v] || IMP_STYLE[1]; }
  function sourcePill(source) {
    const [c, bg] = SOURCE_STYLE[source] || ["#4b514c", "#f0f1f1"];
    return `<span class="source-pill" style="--sc:${c};--sbg:${bg}">${esc(source)}</span>`;
  }
  function topicChips(a) {
    return (a.topics || []).map(t => {
      const [c, bg] = topicColor[t] || ["#4b514c", "#f0f1f1"];
      return `<span class="topic" style="--tc:${c};--tbg:${bg}">${esc(t)}</span>`;
    }).join("");
  }


  function reviewPoints(text) {
    let t = String(text || "").trim();
    if (!t) return ["（未提供）"];
    let parts = t.split(/(?=（\d+）)|(?=\(\d+\)\s)/).map(s => s.trim()).filter(Boolean);
    if (parts.length === 1) {
      parts = t.split(/\n+/).map(s => s.trim()).filter(Boolean);
    }
    if (parts.length === 1 && /[；;]/.test(t) && t.length > 120) {
      parts = t.split(/[；;]/).map(s => s.trim()).filter(Boolean);
    }
    if (parts.length === 1) {
      const sentences = t.match(/[^。！？]+[。！？]?/g) || [t];
      if (sentences.length > 1) parts = sentences.map(s => s.trim()).filter(Boolean);
    }
    const expanded = [];
    for (const part of parts) {
      if (part.length > 420 && /[；;]/.test(part)) {
        expanded.push(...part.split(/[；;]/).map(s => s.trim()).filter(Boolean));
      } else {
        expanded.push(part);
      }
    }
    return expanded.map(s => s.replace(/^[（(]?\d+[）)]?\s*/, "").trim()).filter(Boolean);
  }
  function reviewList(text) {
    return `<ul>${reviewPoints(text).map(p => `<li>${esc(p)}</li>`).join("")}</ul>`;
  }
  function reviewHTML(a) {
    const r = a.review;
    if (!r) return "";
    return `<details class="review">
      <summary>AI 审稿</summary>
      <div class="review-body">
        <div class="review-block"><h3>核心主张是否成立</h3>${reviewList(r.correctness)}</div>
        <div class="review-block"><h3>主要缺陷</h3>${reviewList(r.weaknesses)}</div>
        <div class="review-block"><h3>是否夸大</h3>${reviewList(r.overclaim)}</div>
        <div class="review-block"><h3>需要核对的引用 / 实验</h3>${reviewList(r.citations)}</div>
        <div class="review-block"><h3>要作者回答的问题</h3>${reviewList(r.questions)}</div>
        <p class="review-meta">${esc(r.basis)} · AI 生成的批判性审稿，不是同行评审；结论以原文为准。</p>
      </div>
    </details>`;
  }

  function entryHTML(a) {
    const w = wf(a.id);
    const [ic, ib] = impColor(a.importance);
    const opts = Object.entries(STATUS_LABEL).map(([k, v]) => `<option value="${k}"${w.status === k ? " selected" : ""}>${v}</option>`).join("");
    return `<article class="entry" id="p-${String(a.no).padStart(2, "0")}" data-id="${esc(a.id)}" style="--imp:${ic};--imp-bg:${ib}">
      <aside class="rail">
        <div class="no">${String(a.no).padStart(2, "0")}</div>
        <span class="imp-badge" title="${esc(a.importance_reason || "")}" aria-label="重要性 ${a.importance} / 5，${IMP_LABEL[a.importance]}"><span>${a.importance}</span><span class="den">/5</span></span>
        <span class="imp-label">${esc(IMP_LABEL[a.importance] || "")}</span>
      </aside>
      <div class="entry-body">
        <div class="entry-meta">
          ${sourcePill(a.source)}<span class="sep">·</span><time datetime="${esc(dateOnly(a.published))}">${esc(dateOnly(a.published))}</time><span class="sep">·</span><span>${esc(a.venue || "")}</span>
        </div>
        <h2><a href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">${esc(a.title)}</a></h2>
        <p class="title-zh">${esc(a.title_zh)}</p>
        <p class="authors">${esc((a.authors || []).join(" · "))}</p>
        <div class="topics">${topicChips(a)}</div>
        <p class="imp-reason"><b>重要性 ${a.importance}/5 · ${esc(IMP_LABEL[a.importance] || "")}</b> · ${esc(a.importance_reason || "")}</p>
        <p class="summary"><b>结论</b>${esc(a.summary)}</p>
        <div class="analysis">
          <div><h3>问题</h3><p>${esc(a.problem)}</p></div>
          <div><h3>方法</h3><p>${esc(a.method)}</p></div>
          <div><h3>结果</h3><p>${esc(a.result)}</p></div>
          <div><h3>关键贡献</h3><p>${esc(a.contribution)}</p></div>
          <div class="wide"><h3>局限 / 待核验</h3><p>${esc(a.limitation)}</p></div>
        </div>
        <div class="keynums"><span class="label">关键数字</span>${(a.key_numbers || []).map(k => `<span class="kn">${esc(k)}</span>`).join("")}</div>
        <div class="entry-foot">
          <div class="entry-actions">
            <select class="status-select" data-status="${esc(a.id)}" aria-label="阅读状态">${opts}</select>
            <button class="textbtn" type="button" data-note-toggle="${esc(a.id)}">${w.note ? "编辑笔记" : "笔记"}</button>
            <a class="link" href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">原文 ↗</a>
            ${a.pdf_url ? `<a class="link" href="${esc(a.pdf_url)}" target="_blank" rel="noopener noreferrer">PDF</a>` : ""}
            ${a.doi ? `<a class="link" href="https://doi.org/${esc(a.doi)}" target="_blank" rel="noopener noreferrer">DOI</a>` : ""}
          </div>
        </div>
        <details class="abstract"><summary>摘要原文</summary>
          <div class="abstract-block"><div class="abstract-lang">English</div><p>${esc(a.abstract || "摘要待补。")}</p></div>
          ${a.abstract_zh ? `<div class="abstract-block"><div class="abstract-lang">中文翻译</div><p>${esc(a.abstract_zh)}</p></div>` : ""}
        </details>
        ${reviewHTML(a)}
        <div class="note-wrap" data-note-wrap="${esc(a.id)}"${w.note ? "" : " hidden"}>
          <textarea class="note-area" data-note="${esc(a.id)}" placeholder="记录：值得记下的方法、需要核对的数字、与你当前工作的连接…">${esc(w.note)}</textarea>
          <div class="note-meta"><span data-save-status="${esc(a.id)}">${w.note ? "已从本机恢复" : "自动保存在本机"}</span><button class="textbtn" type="button" data-export-one="${esc(a.id)}">导出此条</button></div>
        </div>
      </div>
    </article>`;
  }

  function renderTOC() {
    const list = ARTICLES.slice().sort((a, b) => a.no - b.no);
    $("#tocList").innerHTML = list.map(a => `<li><a href="#p-${String(a.no).padStart(2, "0")}" data-toc-link><span class="toc-no">${String(a.no).padStart(2, "0")}</span><span>${esc(a.title_zh || a.title)}</span></a></li>`).join("");
  }
  function closeTOC() {
    $("#tocPanel").hidden = true;
    $("#tocToggle").setAttribute("aria-expanded", "false");
  }

  function typesetMath() {
    if (!window.MathJax || !MathJax.typesetPromise) return;
    const run = () => MathJax.typesetPromise([$("#entries")]).catch(err => console.warn("MathJax:", err));
    if (MathJax.startup && MathJax.startup.promise) MathJax.startup.promise.then(run);
    else run();
  }

  function render() {
    const list = ARTICLES.filter(a => state.topic === "all" || (a.topics || []).includes(state.topic)).sort((a, b) => a.no - b.no);
    $("#entries").innerHTML = list.map(entryHTML).join("");
    $("#emptyState").innerHTML = ARTICLES.length
      ? `<b>这个关键词下暂无条目</b>点“全部”回到完整列表。`
      : `<b>本轮无新增论文</b>数据时间范围内没有新增条目。`;
    $("#emptyState").classList.toggle("show", list.length === 0);
    $("#listSummary").innerHTML = `显示 <b>${list.length}</b> / ${ARTICLES.length} 篇`;
    $$(".kbtn").forEach(b => b.setAttribute("aria-pressed", String(state.topic === b.dataset.topic)));
    typesetMath();
  }

  $("#keywordBar").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-topic]");
    if (!btn) return;
    state.topic = btn.dataset.topic;
    render();
  });

  $("#entries").addEventListener("click", (e) => {
    const toggle = e.target.closest("[data-note-toggle]");
    if (toggle) {
      const wrap = document.querySelector(`[data-note-wrap="${CSS.escape(toggle.dataset.noteToggle)}"]`);
      if (wrap) { wrap.hidden = !wrap.hidden; if (!wrap.hidden) wrap.querySelector("textarea")?.focus(); }
      return;
    }
    const one = e.target.closest("[data-export-one]");
    if (one) {
      const a = ARTICLES.find(x => x.id === one.dataset.exportOne);
      download(`note-${a.no}-${a.id}.json`, { article: { id: a.id, title: a.title, url: a.url }, workflow: wf(a.id) });
      toast("已导出此条");
    }
  });

  $("#entries").addEventListener("change", (e) => {
    const sel = e.target.closest("[data-status]");
    if (!sel) return;
    const w = wf(sel.dataset.status); w.status = sel.value; save();
    toast("状态已保存：" + STATUS_LABEL[w.status]);
  });
  let noteTimer;
  $("#entries").addEventListener("input", (e) => {
    const ta = e.target.closest("[data-note]");
    if (!ta) return;
    const w = wf(ta.dataset.note); w.note = ta.value;
    const label = document.querySelector(`[data-save-status="${CSS.escape(ta.dataset.note)}"]`);
    if (label) label.textContent = "正在保存…";
    clearTimeout(noteTimer);
    noteTimer = setTimeout(() => {
      save();
      if (label) label.textContent = "已保存 · " + new Date().toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });
    }, 300);
  });

  function download(filename, payload) {
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
  }
  $("#exportBtn").addEventListener("click", () => {
    download(`reading-notes-${META.issue_date || "digest"}.json`, {
      exported_at: new Date().toISOString(), issue: META.issue_date,
      articles: ARTICLES.map(a => ({ id: a.id, no: a.no, title: a.title, topics: a.topics, url: a.url, ...wf(a.id) }))
    });
    toast("已导出全部笔记与公式修改");
  });
  $("#printBtn").addEventListener("click", () => window.print());

  document.addEventListener("toggle", (e) => {
    if (e.target.matches && e.target.matches("details.abstract, details.review")) typesetMath();
  }, true);

  const TOC_POS_KEY = "qc-toc-pos-v1";
  const tocDesktop = window.matchMedia("(hover: hover) and (pointer: fine)");
  let tocDrag = null;
  let tocMoved = false;
  let suppressTocClick = false;
  function isDesktopToc() { return tocDesktop.matches; }
  function setTocPosition(left, top) {
    if (isDesktopToc()) return;
    const box = $("#toc");
    const maxLeft = Math.max(0, window.innerWidth - box.offsetWidth);
    const maxTop = Math.max(56, window.innerHeight - box.offsetHeight - 8);
    const x = Math.max(0, Math.min(maxLeft, Math.round(left)));
    const y = Math.max(56, Math.min(maxTop, Math.round(top)));
    box.style.left = x + "px";
    box.style.top = y + "px";
    box.style.bottom = "auto";
    box.classList.toggle("right", x > window.innerWidth / 2);
    return { left: x, top: y };
  }
  function saveTocPosition() {
    if (!isDesktopToc()) {
      const box = $("#toc");
      const r = box.getBoundingClientRect();
      try { localStorage.setItem(TOC_POS_KEY, JSON.stringify({ left: r.left, top: r.top })); } catch (e) {}
    }
  }
  function snapToc() {
    const box = $("#toc");
    const r = box.getBoundingClientRect();
    const left = (r.left + r.width / 2 < window.innerWidth / 2)
      ? 0
      : Math.max(0, window.innerWidth - r.width);
    const pos = setTocPosition(left, r.top);
    if (pos) { try { localStorage.setItem(TOC_POS_KEY, JSON.stringify(pos)); } catch (e) {} }
  }
  function restoreTocPosition() {
    if (isDesktopToc()) return;
    try {
      const raw = localStorage.getItem(TOC_POS_KEY);
      if (raw) {
        const p = JSON.parse(raw);
        if (typeof p.left === "number" && typeof p.top === "number") setTocPosition(p.left, p.top);
      }
    } catch (e) {}
  }
  function collapseDesktopToc() {
    const box = $("#toc");
    box.classList.add("collapsed");
    document.body.classList.remove("toc-open");
    $("#tocPanel").hidden = true;
    $("#tocToggle").setAttribute("aria-expanded", "false");
  }
  function openDesktopToc() {
    const box = $("#toc");
    box.classList.remove("collapsed");
    document.body.classList.add("toc-open");
    $("#tocPanel").hidden = false;
    $("#tocToggle").setAttribute("aria-expanded", "true");
  }
  function applyTocMode() {
    const box = $("#toc");
    if (isDesktopToc()) {
      box.style.left = "";
      box.style.top = "";
      box.style.bottom = "";
      $("#tocClose").textContent = "收起";
      openDesktopToc();
    } else {
      document.body.classList.remove("toc-open");
      box.classList.remove("collapsed");
      $("#tocClose").textContent = "×";
      closeTOC();
      restoreTocPosition();
    }
  }
  tocDesktop.addEventListener("change", applyTocMode);
  $("#tocToggle").addEventListener("pointerdown", (e) => {
    if (isDesktopToc()) return;
    const box = $("#toc");
    const r = box.getBoundingClientRect();
    tocDrag = { x: e.clientX, y: e.clientY, left: r.left, top: r.top };
    tocMoved = false;
    try { $("#tocToggle").setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  });
  $("#tocToggle").addEventListener("pointermove", (e) => {
    if (!tocDrag) return;
    const dx = e.clientX - tocDrag.x;
    const dy = e.clientY - tocDrag.y;
    if (Math.abs(dx) + Math.abs(dy) > 5) tocMoved = true;
    setTocPosition(tocDrag.left + dx, tocDrag.top + dy);
  });
  $("#tocToggle").addEventListener("pointerup", () => {
    if (!tocDrag) return;
    if (tocMoved) {
      suppressTocClick = true;
      snapToc();
      setTimeout(() => { suppressTocClick = false; }, 150);
    }
    tocDrag = null;
  });
  $("#tocToggle").addEventListener("click", () => {
    if (suppressTocClick) return;
    if (isDesktopToc()) {
      if ($("#toc").classList.contains("collapsed")) openDesktopToc();
      else collapseDesktopToc();
      return;
    }
    if ($("#tocPanel").hidden) {
      $("#tocPanel").hidden = false;
      $("#tocToggle").setAttribute("aria-expanded", "true");
    } else {
      closeTOC();
    }
  });
  $("#tocClose").addEventListener("click", () => {
    if (isDesktopToc()) collapseDesktopToc(); else closeTOC();
  });
  $("#tocPanel").addEventListener("click", (e) => {
    if (e.target.closest("[data-toc-link]") && !isDesktopToc()) closeTOC();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      if (isDesktopToc()) collapseDesktopToc(); else closeTOC();
    }
  });
  window.addEventListener("resize", () => {
    if (isDesktopToc()) return;
    const box = $("#toc");
    const r = box.getBoundingClientRect();
    setTocPosition(r.left, r.top);
  });
  applyTocMode();

  renderTOC();
  render();
})();
</script>
</body>
</html>
