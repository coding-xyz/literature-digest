的高品质全微波量子比特门","authors":["Wan-Peng Gao","Xiao-Liang He","Zheng-Qi Niu","Si-Qi Li","Da-Qiang Bao","Kuang Liu","Jian-Qiang You","Jaw-Shen Tsai","Zhen Wang","Zhi-Rong Lin"],"abstract":"High-fidelity entangling gates are essential for realizing large-scale fault-tolerant superconducting quantum computing, yet existing approaches are limited: frequency-tuning techniques induce decoherence, while all-microwave-driven schemes suffer the trade-off between gate speed and leakage rate. Here, we introduce an energy-level engineering technique that employs the Autler-Townes effect to manipulate the nonlinearity of qubits without perturbing the computational subspace or degrading coherence time. This approach enables an experimentally validated, fast (97 ns) and high-fidelity (99.40(9)%) CZ gate, where error analysis reveals that gate errors arise mainly from static decoherence. The scheme facilitates fast, high-quality all-microwave gate operations with a simple topology and can be applied across various quantum platforms.","importance":3,"importance_reason":"全微波固定频率 CZ 的可行实验演示（97 ns、IRB 99.40(9)%）对频率拥挤、忌磁通噪声的芯片有吸引力；但为单对器件、无泄漏与串扰定量、coupler 方案仅理论示意，维持 3。","summary":"在两颗固定频率 Xmon（g/2π=5.9 MHz）上用 Autler-Townes 效应调制 Q1 的有效非谐性，将 AT 双线 |+⟩ 调至与 Q2 的 |1⟩ 共振，经 |11⟩↔|+0⟩ 循环演化实现 97 ns 全微波非绝热 CZ；交织 RB（300 序列/长度、95% 置信）给 F=99.40(9)%（r=0.0060(9)），误差预算称静态退相干占约 78%；AT 驱动下 T1/T2e 几乎不变，≲2 MHz 频率漂移以 virtual-Z 补偿。","problem":"固定频率超导比特的全微波双比特门存在门速度与泄漏的折中，而磁通调频方案损失相干性与抗磁通噪声能力；需要一种不（显著）扰动计算子空间、不劣化相干时间、又能快速产生受控相位的能级工程手段，并可嵌入固定频率拓扑与主流 coupler 架构。","method":"理论：两耦合 Duffing 振子（Eq. 1，l.79-97），对 Q1 施加靠近其 |2⟩↔|3⟩ 跃迁（ωd/2π=4.904 GHz）的 AT 驱动，|2⟩、|3⟩ 混合成 AT 双线 |±⟩（附录 A1 给出 tanθ 与 ω±），调节幅值 ΩAT 使 |+0⟩（或 |−0⟩）与 |11⟩ 共振（\\(\\sqrt{2}g\\lesssim\\tilde{g}\\lesssim\\sqrt{3}g\\)，l.203-208），经非绝热半交换加循环演化几何相位实现 CZ；实验：Nb/Ta-Xmon 对，双音谱验证 AT 劈裂与避免交叉（Fig. 2），Chevron 校准工作点（偏离中点补偿残余 ZZ），参照/交织 RB（每长度 300 序列、95% 置信）提取保真度并按退相干加寄生 X 旋转做误差预算。","result":"双音谱观测到随 ΩAT 增大的 AT 劈裂及 |+0⟩–|11⟩ 避免交叉（gmea/2π≈5.9 MHz，l.490）；AT 驱动下 Q1 的 T1/T2e 几乎不变、仅 ≲2 MHz 频率漂移（Fig. 2d, l.491-497）；Chevron 显示 |11⟩↔|20⟩ 相干交换（Fig. 3），得 97 ns CZ；IRB 给 \\(p_ref=0.9575(7)\\)、\\(p_int=0.9498(9)\\)，\\(r_CZ=0.0060(9)\\)、F=99.40(9)%（l.641-655）；误差预算：退相干 0.0047（约 78%）加寄生 X 旋转（0.08 rad）0.0013（约 22%）（l.656-679）；另给出三步 AT-coupler 方案与 Toffoli 等价的构想（Fig. 5, l.681-702）。","contribution":"演示了用 AT 效应做非谐性工程实现全微波 CZ 的新机制：不动工作频率即可在 97 ns 内产生受控相位，规避磁通调频的相干代价与标准微波门的泄漏-速度折中；AT 驱动下相干时间不变的谱学证据与 99.4% 量级 IRB 保真度是全微波门控路线的有效概念验证；AT-coupler 构想若验证成立，可与主流 coupler 架构兼容并扩展到 Toffoli 类多比特门。","limitation":"单对器件演示；无门后泄漏布居与 Q2 串扰激励的定量测量；误差预算系数不透明、未含泄漏/漂移等系统效应；AT-coupler 与 Toffoli 扩展仅为示意；多比特频率分配下 AT 驱动的选择性约束未评估。","key_numbers":["97 ns CZ","F=99.40(9)% (r=0.0060(9))","g12/2π=5.9 MHz","T1=27/17 µs, T2e=36/22 µs","退相干约78% / 寄生旋转约22%"],"url":"https://arxiv.org/abs/2611.07967","pdf_url":"https://arxiv.org/pdf/2611.07967v1","doi":"","review":{"verdict":"小修","confidence":"中高","correctness":"核心实验主张（AT 能级工程实现 97 ns 全微波 CZ、IRB 保真度 99.40(9)%）在其测量范围内成立，但支撑无泄漏代价与误差主要来自静态退相干这两点的证据不完整。(i) 机制验证：Fig. 2(a) 显示随 ΩAT 增大的 AT 双线劈裂，Fig. 2(b,c) 显示 |+0⟩–|11⟩ 避免交叉及 |10⟩↔|11⟩ 跃迁被推开（l.251-301），Fig. 2(d) 显示 T1/T2e 随 ΩAT 几乎不变（l.491-493）——调制有效非谐性而不劣化（idle）相干有谱学证据。(ii) CZ 与保真度：Chevron（Fig. 3, l.481-514）证明 |11⟩↔|20⟩ 相干交换与循环演化几何相位；IRB 每长度 300 序列、95% 置信（l.600-604），\\(p_ref=0.9575(7)\\)、\\(p_int=0.9498(9)\\)，\\(r_CZ=(3/4)(1−p_int/p_ref)=0.0060(9)\\)（txt 中系数被抽取为 43，应为 (4−1)/4），数值自洽（由 p 值及误差传播复算得 0.00603(88)）。(iii) 误差预算可核查性弱：退相干公式系数在抽取文本中不可辨（\\(r_relaxation\\) 与 \\(r_dephasing\\) 的前因子，l.659），纯退相干时间 Tφ 未在 Table A1 报告（只能由 T2e 反推：Q1≈108 µs、Q2≈62 µs），且 0.0047+0.0013=0.0060 与 IRB 总误差精确闭合，疑似对总误差的反推式分解而非独立估算；预算不含泄漏、准静态漂移（自报 ≲2 MHz，l.493-497）与串扰诱发的非 Markov 误差，而这些恰会系统性扭曲 IRB 提取。(iv) 泄漏未量化：方案卖点是对微波门速度-泄漏折中的规避，但全文没有门后 |2⟩/泄漏布居的直接测量；工作点偏离完全交换中点以补偿残余 ZZ（l.512-514）意味着门周期内 |20⟩ 布居非零，其残存量只能从插值/平滑后的 Fig. 3 目测。(v) Q2 串扰：AT 驱动（4.904 GHz）距 Q2 的 |1⟩↔|2⟩ 跃迁（≈4.919 GHz）仅约 15 MHz，作者以 virtual-Z 补偿 Z 误差（l.496-501）但未给出 Q2 上寄生激励的测量或模型估计。综合：保真度数字可信（IRB 统计规范、误差传播自洽），机制演示可信；误差主要来自静态退相干是对预算的解读而非分解证明，without perturbing the computational subspace 被自报的漂移与寄生旋转（0.08 rad, l.676-678）部分削弱。","weaknesses":"1. 泄漏无定量测量：与引言宣称的 all-microwave 方案泄漏-速度折中（l.50-52）正对垒的核心优势没有任何 leakage 数据（门后 |2⟩ 布居、leakage-sensitive RB 或同时激发测量）；IRB 模型假设无泄漏，若门周期残留 |20⟩ 布居不可忽略，F=99.40% 的解读会失真。Chevron 数据经插值加平滑展示（l.486-488），无法从中提取残漏。\n2. 误差预算不透明且可能循环：退相干系数（抽取为 52 与 25，应为分数）与 [36] 的对应关系未写明；Tφ 未报告；0.0047+0.0013 恰等于 IRB 总误差 0.0060，二者并非独立测量；寄生 X 旋转 0.08 rad→0.0013 的 simple calculation（l.676-678）无细节（dressed 态、驱动波形、平均保真度公式均未给出）。误差主要来自静态退相干（摘要 l.29-30、结论 l.710）实为预算解读而非测量分解。\n3. 相干性表征只在 idle：Fig. 2(d) 的 T1/T2e vs ΩAT 是静态驱动下测量；97 ns 门内强 AT 驱动期间的退相干（驱动诱导去相干、|2⟩ 态 T1、光子数依赖噪声）未表征，预算用 idle 值外推门内误差，而 |2⟩ 的 T1 通常短于 |1⟩。\n4. 串扰/频率选择性未刻画：AT 驱动距 Q2 |1⟩↔|2⟩ 仅约 15 MHz、距 Q1 |3⟩↔|4⟩ 约 166 MHz；除 virtual-Z 补 Q2 的 Z 误差外，无 Q2 寄生激励测量、无多比特环境下驱动线分配与频率拥挤分析；simple topology 与 scalable（l.74-75, l.713-715）缺少多对器件数据支撑。\n5. AT-coupler 与 Toffoli 仅示意：Fig. 5 的三步 coupler 门与 Toffoli 等价声明（l.681-702）无数值模拟保真度、无实验；步骤 I/III 的完全布居交换对参数误差的敏感性未评估，却已进入摘要级卖点（l.76-77）。\n6. 与最优水平比较缺失：99.40(9)% 低于当前最优 CZ（约 99.5–99.9%，磁通调频+coupler，refs [12-16]）；surpasses the surface code threshold（l.654-655）以 0.6% 对约 1% 阈值，未计路由开销与 QEC 所需余量，作为容错论证偏弱。器件 T1=27/17 µs 也限制高性能表述——作者自己指出改善相干时间是首要途径（l.660-662）。\n7. 统计与漂移：IRB 只报拟合不确定度 (9)；自测 ≲2 MHz 频率漂移为准静态误差，会破坏 IRB 的 Markov 假设，应报告跨时段重复 IRB 的重复性或独立交叉验证（如 XEB/GST 子集）。\n8. 呈现：Fig. 3 数据 interpolated 加 smoothing（l.486-488）降低可读性；关键工作点参数（CZ 点的 ΩAT 幅值、AT 脉冲上升/下降时间、门周期内 |20⟩ 峰值布居、残余 ZZ 量值）未在文本给出。","overclaim":"1. 摘要 l.28-29 without perturbing the computational subspace or degrading coherence time：实测 ≲2 MHz 频率漂移（l.493-497）与 0.08 rad 寄生 X 旋转（l.676-678）表明计算子空间确被离共振驱动扰动，只是可用 virtual-Z/脉冲优化补偿；应改为扰动可补偿而非 without perturbing。\n2. 摘要 l.27-28 existing approaches are limited: frequency-tuning techniques induce decoherence：磁通调频+可调 coupler 的当前最优 CZ（99.5%+，refs [12-16]）并不普遍劣化到不可用；该二分法为突出本文方案而简化。\n3. l.654-655 surpasses the surface code error correction threshold [35]：单门 0.6% 低于约 1% 阈值不等于对容错计算有用（还需计路由、泄漏、相关误差与余量），以最低标准自证的表述应弱化。\n4. l.67 the system's large anharmonicity ensures that irrelevant states remain unaffected：Q1 的 α=−178 MHz 并不大；AT 驱动对 |1⟩↔|2⟩（190 MHz 失谐）与 Q2 |1⟩↔|2⟩（仅 15 MHz 失谐）的影响正是需要补偿的项，与自报漂移矛盾。\n5. 结论 l.713-715 applicable to other quantum platforms 与 holds promise to propel large-scale fault-tolerant quantum computing：未给出任何非超导平台分析；以单对器件与未验证的 coupler 示意支撑大规模容错展望，属过度外推。","citations":"1. R. Li, Kubo, Ho, Yan, Nakamura, Goto, PRX 14, 041050 (2024) [36]（l.866-867）：退相干误差公式（\\(r_relaxation\\)、\\(r_dephasing\\) 的系数）的出处，需核对系数定义与适用条件；该文亦是近期相关 CZ 工作，应核对其保真度/门时长以定位本文 97 ns、99.40% 的实际水平。\n2. Córcoles et al., PRA 87, 030301 (2013) [34]（l.861-863）与 Barends et al., Nature 508, 500 (2014) [11]（l.774-777）：IRB 方法学出处；核对交织 RB 公式（(d−1)/d 因子）与统计口径（300 序列、95% 置信）的一致性。\n3. Autler & Townes (1955) [26]、Abi-Salloum (2010) [27]、Sun et al. (2014) [28]、Novikov et al. (2013) [29]（l.844-849）：AT 双线公式（附录 A1）与超导实现前序；核对本文 Eq. (2)/A1 的强泵浦 |2⟩↔|3⟩ 参数化与这些工作的对应及新颖性边界。\n4. Noguchi et al. PRA 102, 062408 (2020) [21]、Shirai et al. PRL 130, 260601 (2023) [24]、Setiawan et al. PRApplied 19, 034071 (2023) [25]（l.832-843）：微波驱动能级工程/双线调控前序；本文声称 novel energy-level engineering，需核对这些工作已实现的内容以界定增量。\n5. Sung et al. PRX 11, 021058 (2021) [14]、Collodo [13]、Xu [12]、Stehlik [16]、Wang SCPMA 68, 220312 (2025) [17]（l.778-784, l.823-824）：当前 CZ 保真度水平（约 99.5%+）的对照，支撑或检验 all-microwave 路线的竞争力声明。\n6. Fowler et al. PRA 86, 032324 (2012) [35]（l.864-865）：表面码阈值取值（电路级噪声下约 0.5–1%），核对 surpasses threshold 的口径。\n7. F. Yan et al. PRApplied 10, 054062 (2018) [37]（l.868-869）：coupler 架构出处，核对 AT-coupler 与主流 coupler 可集成性声明。","questions":"1. 门终态的泄漏是多少？请给出 CZ 后 Q1/Q2 的 |2⟩ 布居直接测量（或 leakage-sensitive 基准），以及门周期内 |20⟩ 峰值布居与残余 ZZ 补偿偏置的数值。\n2. 误差预算的退相干系数与 Tφ 取值是什么？0.0047+0.0013 与 IRB 总误差精确一致是否为独立估算？寄生 X 旋转 0.08 rad 的计算细节（驱动波形、dressed 态、平均保真度公式）能否给出？\n3. AT 驱动在 Q2 上（|1⟩↔|2⟩ 仅失谐约 15 MHz）的寄生激励有多大？多比特扩展时各 AT 驱动频率与其他 qubit 跃迁的频率分配如何避免冲突？\n4. IRB 在 ≲2 MHz 准静态漂移下的可重复性如何？是否有跨时段重复 IRB 或独立保真度交叉验证（XEB/GST）？","basis":"用 read 完整读取 1165 行（l.1-1165），含正文 Sec. 1–5、图注文本、参考文献与附录 A1（AT 公式，l.871-944）、A2（工艺与 Table A1 参数，l.946-1078）、A3（低温系统，l.1106-1165）。关键数字（频率/非谐性/T1/T2/g/IRB 拟合/误差预算）均在文本与 Table A1。图 1–5 与图 A6 本体不可见（抽取仅坐标轴与图例残片，如 l.122-192、l.217-256、l.279-336、l.481-488、l.517-604、l.665-674），Chevron 工作点位置、RB 拟合质量与 Fig. 2(d) 曲线形态无法直接核对；正文 IRB 系数与误差预算系数在抽取中乱码（43 应为 (4−1)/4，52、25 应为分数），已按数值反推确认 r_CZ=0.0060(9) 自洽。未运行任何脚本，论文未提供代码/数据声明。"}},{"id":"arxiv-2611.08586","no":12,"topics":["纠错码"],"source":"arXiv","venue":"arXiv:2611.08586 [quant-ph]","published":"2026-11-05","title":"Magic Is in the Eye of the Measure","title_zh":"Magic 取决于度量：SRE 与三种稳定子态优化型 magic 度量的两比特对比","authors":["Zhi-Heng Shen","Zhewei Yin","Hao-Lin Zhang"],"abstract":"Magic, or nonstabilizerness, is the quantum resource behind universal quantum computation. Its applications in high-energy and nuclear physics rely almost exclusively on the stabilizer Rényi entropy (SRE), although magic has no unique measure. For two qubits, we compare the SRE with three measures defined through optimizations over stabilizer states: the min- and max-relative entropies of magic and the logarithmic free robustness. We determine the maximal-magic states of all four measures, with exact proofs, and find that they depend on the measure. In the determination of the weak mixing angle from minimal magic in Møller scattering, the min-relative entropy gives an energy-dependent value that differs from that of the SRE, whereas the max-relative entropy and the logarithmic free robustness give $\\sin^2θ_W=1/4$ at all energies. We trace this difference to the non-analytic structure of the optimization-based measures. Physical conclusions drawn from extremizing magic can thus depend on the measure.","importance":2,"importance_reason":"对容错资源理论有方法学价值——首次精确证明两比特上四种常用 magic 度量的最大 magic 态互不相同（M2/LR 此前只有数值结果），并以弱混合角为例证明极值化 magic 的物理结论依赖度量；但物理应用是背景性再分析且限于两比特树图级，未触及纠错/解码主线，维持指定重要级 2。","summary":"两比特上精确证明四种 magic 度量的最大 magic 态互不相同：\\(M_2=\\log_2(16/7)\\)（480 态）、\\(D_{min}=D_{max}=\\log_2(6/(2+\\sqrt3))\\)（640 态）、\\(LR=\\log_2((1+\\sqrt5)/2)\\)（192 平面）。Møller 散射定 \\(\\sin^{2}\\theta_W\\) 时，Dmax/LR 因 \\(g_V=0\\) 线性尖点恒给 1/4，M2/Dmin 给能量依赖值（M2 在 mZ 给 0.2317），源于优化型度量的非解析结构。","problem":"高能与核物理中的 magic 应用几乎全用单一度量 SRE，而 magic 并无唯一规范度量；本文问：换用基于稳定子多面体优化的度量（min/max 相对熵、log 自由鲁棒性），『最大 magic 态』是谁、『极值化 magic』给出的物理结论（以 Møller 散射中弱混合角的确定为例）是否不变，并把结论差异归因到度量的解析结构（优化型度量的非解析性 vs SRE 的光滑性）。","method":"先用 Clifford 对称把两比特参数空间约化 1/768（App A：振幅全置换+对角 Clifford 相位格，单元体积 \\(\\pi^{3}/4=(2\\pi)^{3}/32\\)），数值搜索候选极大点，再分度量构造精确证书：M2 用 Pauli 期望值多项式的 SOS 半定规划、有理取整与整数同余验证（App C）；Dmin 经对偶范数化归为证 \\(F_{STAB}\\ge(2+\\sqrt3)/6\\)，用 9 个活跃稳定子的内切半径尖点分析加精确有理 branch-and-bound（约 \\(4.4\\times10^{6}\\) 盒，App D）；LR 用 LP 对偶化归为 120 面多面体顶点的精确枚举与 \\(\\mathbb{Q}(\\sqrt5)\\) 中的谱检验（App E）。物理部分按 [45] 的协议对 60 个稳定子入态与立体角平均（Eq 12）。","result":"\\(M_2^{max}=\\log_2(16/7)\\approx1.193\\)（480 态，concurrence 仅 1/√2 与 1/2）；\\(D_{min}^{max}=D_{max}^{max}=\\log_2(6/(2+\\sqrt3))\\approx0.6850\\)，同一 640 态单 Clifford 轨道（64 个乘积 \\(|T\\rangle\\otimes|T\\rangle\\)、576 个 concurrence 2/3 的缠态）；\\(LR^{max}=\\log_2((1+\\sqrt5)/2)\\approx0.6942\\)（鲁棒性 \\(R=\\sqrt5\\)），极大点为 192 个二维平面（含混态）。三组极大点两两不交，最近 FS 距离 \\(\\pi/12\\)。Møller 散射：Dmax/LR 的极小是 \\(s_W^{2}=1/4\\) 处的尖点（\\(g_V=2(s_W^{2}-1/4)\\)，singlet 出态恒为稳定子、magic 线性增长），所有能量不动；M2/Dmin 为光滑极小，M2 在 mZ 给 0.2317（测量值 0.23122），Dmin 低 7%。","contribution":"首次给出两比特四种常用 magic 度量最大值与全部极大点的精确证明（M2 与 LR 之前只有数值结果 [7,53]），确立『最大 magic 态』是度量相关概念；在弱混合角应用中把度量选择的后果具体化（1/4 常数 vs 能量依赖），并把机制追溯到优化型度量的锥形非解析性（Danskin 定理给出 kink 方向：max 型向上、Dmin 向下、M2 无 kink）。对 HEP 中『最小 magic』类主张是必要警示，其 SOS/LP 证书方法可推广到检验更多比特与 qudit 的极大 magic 猜想。","limitation":"全部结论限于两比特与树图级 Møller 散射；尖点钉扎与 Dmin 浅极小都依赖 \\(g_V=0\\) 处出态恰为稳定子态的精确树图性质，作者自认对高阶修正不稳健；无重整化尺度与高阶不确定度讨论；三个证书均为计算辅助精确证明，依赖补充材料数据；SRE 的替代度量在多体体系不可扩展，削弱警示的可操作性。","key_numbers":["\\(M_2^{max}=\\log_2(16/7)\\approx1.193\\)（480 态）","\\(D_{min}=D_{max}^{max}=\\log_2(6/(2+\\sqrt3))\\approx0.685\\)（640 态）","\\(LR^{max}=\\log_2((1+\\sqrt5)/2)\\approx0.694\\)（192 平面，R=√5）","\\(s_W^2\\)：M2→0.2317 vs Dmax/LR→1/4","1/768 约化域；\\(4.4\\times10^6\\) 盒 branch-and-bound"],"url":"https://arxiv.org/abs/2611.08586","pdf_url":"https://arxiv.org/pdf/2611.08586v1","doi":"","review":{"verdict":"小修","confidence":"中高","correctness":"核心主张成立到很高程度，且大量数字可独立复核。(1) App A 的 1/768 约化自洽：相位格单元 \\(\\pi^{3}/4=(2\\pi)^{3}/32\\) 乘 1/4!；Clifford 恒等式 [−i(S⊗\\(I)]^{3}=diag(i,i,1,1)\\) 等逐条验算无误。(2) 数值自洽链完整：D 极大点处 M2=log2(9/4)、LR=log2((3+2√3)/4)；LR 平面上 M2=log2(25/12)、Dmin∈[log2(10/(5+√5)),0.5787]、Dmax≤0.6585——归一化后与 Table I 的 0.981/0.997/0.888、[0.68,0.84]、[0.84,0.96] 全部吻合；LR 次大特征值 (1+2√3)/2≈2.232 与 |T⟩|T⟩（D 极大点）的 LR 值 0.997×0.6942 一致；640 态含 64 个乘积态与 8 个单比特 T-型态、π/12 最小距离（App D 的隔离球半径）互洽。(3) App G 可独立重推：稳定子态附近 \\(D_{min}=\\zeta^{2}/\\ln2+O(\\zeta^{4})\\)、\\(M_2=4\\zeta^{2}/\\ln2+O(\\zeta^{4})\\)——用 \\(\\sum_{P\\in g}P=2^{n}\\Pi_{s_0}\\) 与 \\(\\langle\\chi|\\Pi_{s_0}|\\chi\\rangle=0\\) 即得普适系数 4，与 l.1259-1270 相符；Danskin 的 kink 方向论证（max 型泛函向上、Dmin 向下、M2 无 kink）正确；singlet 的 \\(\\alpha_1=4\\Delta_Z/(3\\Delta_\\gamma+\\Delta_Z)\\) 结构合理，但旋量代数本身无法从文本核验。(4) M2 的 SOS 证书方法论严密：核为 480 极大点张成的 225 维、补空间 526 维（751 个单项式自洽）、有理取整+整数同余到严格对角占优阵；唯一性论证（γ·m 强制 \\(T_P\\in\\{0,\\pm1/2\\}\\) 后穷举纯度检验）结构完整。未决问题：式(7)按抽取文本（对 \\(|\\psi\\rangle=\\sum_s a_s|s\\rangle\\) 的无约束复系数分解取 min \\(Σ|a_s|^{2}\\)）与全文不自洽——稳定子态构成紧框架（Clifford 作用不可约 ⇒ \\(\\sum_s|s\\rangle\\langle s|\\propto I\\)：n=1 为 3I、n=2 为 15I，cf. 其自引 [54]），该极小化对所有纯态给出常数，无法重现 Dmax 在稳定子态为零、App B 的态依赖闭式与 l.306-311 的对偶论证；疑为定义/排版笔误，但 \\(D_{max}=\\log_2\\xi\\) 是 Dmax 全部结论的支点，必须更正或加约束说明。此外 Dmax/LR 在所有能量给 1/4 依赖其余 58 个入态在 gV=0 处也产生向上 kink 的断言（l.626-628、l.1216-1217），App G 只对 singlet 完成证明级处理。","weaknesses":"1. 定义级缺陷：式(7)（stabilizer extent）如抽取文本所示与全文不自洽（紧框架 ⇒ 常数极小值，见 correctness）；对偶范数配对 \\({F_STAB, ξ^{1/2}}\\)（l.306-311）在现文本下不成立，App D 『证 \\(F_STAB\\) 下界即得 Dmax 最大』的链条需以更正后的定义重述。这是全文唯一可能动摇结论的硬伤，但大概率是笔误级、可局部修复。2. at all energies 的完备性：尖点钉扎需要每个入态在 gV=0 处最优 witness 恰好并列（kink 存在）；文中只对 singlet 给出解析证明（App G），对其余 58 个入态仅一句断言（l.626-628）加 l.1246 的数值核对（且该核对只针对 rescaled amplitudes 非零）；应逐输入或按解析结构分类给出证明或系统性数值证据。3. 物理不确定度缺失：M2 的 0.2317 与 0.23122(6) 的 sub-percent 吻合是树图级极值对 MS-bar 跑动值的比较，无重整化尺度 μ 变差、无高阶阶数估计；Dmin 极小被作者自述 very shallow 且其 kink should not be regarded as robust（l.561-564）——浅极小对树图以上修正是一阶敏感，此时报告 7% 偏差与 0.2317 无统计含义。4. 极小化窗口与系综的任意性：\\(s_W^{2}\\in[0.15,0.35]\\)（Fig 3 题注 l.603-604）、60 个稳定子入态、固定自旋量化轴（ẑ 沿束流、ŷ 垂直散射面）均继承自 [45]，未做敏感性讨论；窗口若不含 1/4，Dmax/LR 的结论形式会变。5. 计算辅助证明的可复现性：App C 的 SDP（no certificate of this type exists at degree 6，l.911-912，无不可行性证书）、App D 的 \\(4.4×10^{6}\\) 盒 branch-and-bound、App E 的 626,626 顶点/44 轨道枚举，全部依赖作者实现与补充材料 [66]，无独立复验说明。6. 细节未解释：App C 唯一性步骤 315 个候选 Pauli 向量的来源未说明；App E any commuting triple contains exactly one element of each set（l.1079-1081）的组合断言无证明；Table III 的 concurrence 数值未给推导。7. 自引集中：[23][24][45][46][53] 为共同作者（Yin）的前作；本文是对自身 [45] 的度量敏感性再分析（科学上正当），但对 [45] tracks running up to the TeV scale 的复述未在本文独立验证。8. 范围与实用性边界：全部结论限于两比特；SRE 之所以统治 HEP 应用正因其无需优化的可计算性，而 Dmin/Dmax/LR 在多体体系不可扩展——文中承认 SRE 的 practical advantage（l.54-56），但未讨论：在无法计算优化型度量的体系里，换度量检验结论实际不可操作，这削弱其警示的现实约束力。","overclaim":"1. 摘要 with exact proofs（l.16-17）：三个证书中两个是计算机辅助的精确算术证明（SDP 有理取整、branch-and-bound、顶点枚举），exact 成立但未标明计算辅助性质，易被读成纸笔解析证明。2. 摘要 the max-relative entropy and the logarithmic free robustness give sin2θW = 1/4 at all energies（l.19-20）：这是树图级、且依赖未经逐输入证明的 kink 并列；正文自己写明 may not be robust against higher-order corrections（l.632-635、l.1213-1219），摘要未加任何限定。3. 摘要/引言把 [45] 的 measured weak mixing angle tends to minimize the magic（l.46-47）作为既定事实复述：那是树图级极值-参数巧合、无误差棒，宜加 at tree level。4. including the maxima of the SRE and of LR, which were previously known only numerically [7, 53]（l.72-74）：[7] 是否真的只给数值需核对（若其已有解析论证则此说法过强）。5. 摘要 Physical conclusions drawn from extremizing magic can thus depend on the measure（l.21-22）：由单一过程（Møller）、单一参数、两比特、树图级证据支撑；正文已收敛为 may depend（l.657-659），摘要断言口吻偏强。","citations":"1. [7] Howard & Campbell, PRL 118, 090501 (2017)：R=√5 的原始出处，也是 previously known only numerically 的对象；须核对其结论形式（数值搜索还是解析论证）及 \\(R=1+2\\tilde R\\) 关系的方向与记号。2. [53] Liu, Low, Yin, QST 11, 015035 (2026)：480 个 M2 极大态、concurrence 1/√2 与 1/2、log2(16/7) 的数值来源；核对态计数与取值。3. [45] Liu, Low, Yin, arXiv:2509.18251：Møller 协议（60 入态、量化轴、Eq 12 平均、极小化窗口、mZ/TeV 结论）全部承自它；须核对本文与其平均定义一致及 tracks running up to TeV 的原始论证层级。4. [16] CMS Collaboration, CMS-PAS-TOP-25-001：Observation of magic states of top quark pairs——PAS 是否使用该措辞、其 magic 判据是什么，须核对（被用于论证 magic 已进入实验，l.38-40）。5. [62] PDG 2026（F. Takahashi et al.）：作者名单与 \\(\\hat s_W^{2}(m_Z)=0.23122(6)\\) 数值及 MS-bar 跑动方案须核对。6. [51][60] Regula 系列（对偶范数）与 [8] Bravyi et al.（stabilizer extent）：l.306-311 的对偶配对表述与 [51] 命题、式(7)与 [8] 原定义是否一致——直接关系到 correctness 中指出的式(7)问题。7. [39] Cervera-Lierta et al., SciPost Phys. 3, 036 (2017)：\\(e^+e^-\\to\\mu^+\\mu^-\\) 极大纠缠给出 \\(s_W^{2}=1/4\\) 的说法是否准确（l.610-612）。8. [69] Danskin (1966)：单侧导数不等式方向（\\(f'(g^-)\\le f'(g^+)\\) 对 max 型泛函）的引用是否精确。","questions":"1. 式(7)：请给出 stabilizer extent 的精确定义并说明与 [8] 一致。按抽取文本（对无约束复系数分解取 min \\(Σ|a_s|^{2}\\)），由紧框架性（\\(\\sum_s|s\\rangle\\langle s|=15I\\)，n=2）该量对所有纯态恒为 1/15，与 \\(D_{max}\\) 在稳定子态为零、App B 闭式及对偶论证矛盾；实际使用的是否为 \\(\\xi=(\\min\\sum_s|a_s|)^{2}\\) 或其他等价形式？2. all energies：能否对 60 个入态逐一给出 gV=0 处最优 witness 并列（kink 存在）的解析或系统数值证据？该论证在哪些能量/参数区间是完整的？3. 加入单圈修正（或对 \\(\\alpha_1\\) 做跑动耦合替换）后，Dmax/LR 的 1/4 尖点预计移动多少？是否存在某种截断方案使其仍严格钉在 1/4？4. App C 唯一性中 315 个候选 Pauli 向量如何产生？degree 6 不存在此类证书能否给出不可行性证书？","basis":"分两次完整读取 txt l.1–1713（正文 I–V、附录 A–G、致谢与 69 条参考文献）。Table I–III 数字完整并已交叉核对；Fig 1–5 仅见图题/坐标/图注残片（l.176–179、l.433–477、l.598–606、l.1388–1389、l.1488–1495），曲线形状及 0.2317、7% below、kink near 280 GeV 等读数只能采信正文；公式上下标/根号普遍受损（如 l.95–97 的 4n 应为 \\(4^n\\)、l.318–320 的 LRmax 分式），本文对式(7)与 App B/G 的判断按可见片段重构并用数值一致性交叉验证；补充材料 [66] 与 [7][45][53] 原文未读。"}},{"id":"qst-aebe5f","no":13,"topics":["测控与噪声","容错实验"],"source":"Quantum Science and Technology","venue":"Quantum Science and Technology","published":"2026-11-05","title":"Unveiling the Action of Randomized Compiling on Quantum States: A Geometric Perspective","title_zh":"随机编译到底做了什么：从广义 Bloch 矢量看相干误差的方向性偏置","authors":["Kai Tang","Chao Zhan","Yao Song","Pei-Ling Huang","Yuxuan Zhou","Song Liu","Junkai Zeng","Jiansheng Wu","Tongxing Yan","Xiu-Hao Deng","Yuanzhen Chen"],"abstract":"Randomized compiling (RC) converts coherent errors into stochastic Pauli noise, but this conversion alone does not imply isotropic contraction of the output state. Here we use the generalized Bloch vector (GBV) representation to examine the cumulative effect of RC on state purity and orientation in multi-layer circuits. For the independent, isotropically distributed weak coherent errors considered here, the accumulated ensemble-averaged RC channel lies close to the depolarizing direction, producing a state-level near-isotropic contraction that sacrifices a small amount of purity to achieve a substantial suppression of orientational deviation. When dephasing coexists, RC suppresses the coherent-error contribution but leaves a residual deviation dominated by dephasing, setting a limit that we term the ``dephasing wall.'' We experimentally validate these findings on a superconducting quantum processor through GHZ state preparation and phase estimation in a simulation of topological braiding. The results confirm that RC's effectiveness stems from its ability to suppress the orientational bias of coherent errors—a structural transformation not resolved by fidelity alone but directly visible through GBV diagnostics.","importance":4,"importance_reason":"把 RC 从“保真度提升”拆成 purity 与方向性偏置，并给出超导实验验证；对相干误差诊断有直接参考。","summary":"用广义 Bloch 矢量（GBV）把随机编译（RC）的作用拆成纯度收缩与方向性偏置；在超导处理器上用 GHZ 态制备和拓扑编织的相位估计做实验验证，并提出去相干与 RC 共存时的“dephasing wall”。","problem":"RC 通常被说成“把相干误差转成随机 Pauli 噪声”，但转换本身并不保证输出态各向同性收缩；仅有保真度也无法区分纯度损失和方向性偏置。","method":"用 GBV 表示多层线路中 RC 的累积通道；在独立、各向同性弱相干误差模型下分析 purity 与 orientation；在超导处理器上用 GHZ 态制备与 phase estimation 做实验。","result":"摘要报告：累积 RC 通道接近去极化方向，以少量纯度代价显著压低方向性偏置；存在 dephasing 时 RC 只压掉相干部分，残余由 dephasing 主导，形成“dephasing wall”。具体数值与误差预算未在摘要给出。","contribution":"把 RC 的效果从单一保真度指标扩展为 GBV 诊断：区分“纯度损失”和“方向性偏置”，并给出 dephasing 与 RC 共存时的结构极限。","limitation":"只基于 IOP accepted manuscript 摘要与页面元数据；PDF 在截稿时需订阅，未核验全文推导、实验误差棒和统计量。","key_numbers":["one superconducting processor","GHZ + phase estimation","GBV diagnostics"],"url":"https://doi.org/10.1088/2058-9565/aebe5f","pdf_url":"","doi":"10.1088/2058-9565/aebe5f","review":{"verdict":"大修","confidence":"中","correctness":"摘要层面的核心主张——RC 不只是把相干误差变成随机 Pauli 噪声，还会在广义 Bloch 矢量（GBV）中造成纯度收缩与方向性偏置的不同组合；当 dephasing 存在时会留下残余偏置（作者称为 dephasing wall）——与现有 RC 理论方向一致。但全文 PDF 在截稿时不可得，无法核验 GBV 推导、实验误差预算与统计显著性，因此只能确认“摘要声明自洽”，不能确认“已被严格证明/实验证实”。","weaknesses":"1) 证据基础不足：只读到 IOP accepted manuscript 的摘要和页面元数据，未读正文、补充材料或数据；所有定量结论都未核验。2) 误差模型偏理想：摘要明确只考虑独立、各向同性的弱相干误差；真实超导器件的 crosstalk、leakage、关联噪声和漂移可能让 GBV 的“近各向同性收缩”失效。3) 实验范围窄：只在一个超导处理器上做 GHZ 态制备与 phase estimation，缺少多器件、不同 RC 组数/深度/误差强度的系统扫描；摘要没有给出保真度、纯度、偏置抑制的具体数值和误差棒。4) “dephasing wall”目前只是摘要中的概念性命名，缺少可证伪的定量定义、边界条件与与现有 RC 理论的逐项比较。5) 与已有 RC/相干误差抑制文献的差异没有在摘要中界定，难以判断新颖性是“新诊断量”还是“新实验观察”。","overclaim":"标题“Unveiling”与摘要“experimentally validate these findings”应限定为：在单一超导处理器、特定弱相干误差模型下的摘要级验证。当前证据不足以支持“揭示了 RC 的普遍作用机制”或“GBV 诊断优于保真度”的强主张；应改为“提出并用一个器件初步检验”。","citations":"需核对 Wallman & Emerson 的 RC 原始理论、Hashim et al. 等超导 RC 实验、以及关于 coherent error 方向性偏置/GBV 的既有工作；还要核对作者是否引用了 dephasing 与 RC 共存时“残余偏置”的已有结果，避免把已知现象重新命名。","questions":"1) 能否提供全文/补充材料，给出 GBV 推导的完整假设、实验的 RC 组数、每层误差模型、误差棒与统计量？2) “dephasing wall”的定量定义是什么，能否给出随 dephasing 强度、线路深度和 RC 组数变化的相图，并与已有理论逐项比较？3) 在存在 crosstalk/leakage/关联噪声时，GBV 的近各向同性收缩是否仍成立；若不成立，实验上如何识别？","basis":"只读到 IOPscience accepted manuscript 页面（2026-11-05 online）摘要、作者/日期/DOI 元数据；PDF 在截稿时需订阅，未读正文、图、补充材料或数据。"}}]}</script>

  };
  $("#coverage").innerHTML = `<details class="coverage">
    <summary><span>检索覆盖</span><span class="nums">抓取 ${totals.raw} · 去重 ${totals.deduped} · 关键词初筛 ${totals.screened} · 收录 ${totals.included}</span></summary>
    <div class="coverage-body">
      <table class="coverage-table">
        <thead><tr><th>来源 / 期刊</th><th>状态</th><th class="num">抓取</th><th class="num">关键词初筛</th><th class="num">收录</th></tr></thead>
        <tbody>
          ${journalRows.map(r => {
            const color = GROUP_STYLE[r.label] || GROUP_STYLE[r.group] || "#303030";
            const st = r.status || "ok";
            const stLabel = st === "ok" ? "正常" : st === "partial" ? "部分" : "失败";
            const stCell = `<td><span class="st st-${st}">${stLabel}</span></td>`;
            if (r.kind === "group") {
              return `<tr class="group"><td>${esc(r.label)}</td>${stCell}<td class="num">${r.raw}</td><td class="num">${r.screened}</td><td class="num">${r.included}</td></tr>`;
            }
            return `<tr class="${r.kind === "journal" ? "sub" : "single"}"><td><span class="coverage-source"><span class="source-dot" style="--sc:${color}"></span>${esc(r.label)}</span></td>${stCell}<td class="num">${r.raw}</td><td class="num">${r.screened}</td><td class="num"><b>${r.included}</b></td></tr>`;
          }).join("")}
          <tr class="total"><td>合计（去重后）</td><td>—</td><td class="num">${totals.deduped}</td><td class="num">${totals.screened}</td><td class="num">${totals.included}</td></tr>
        </tbody>
      </table>
    </div>
  </details>`;

  // keyword bar
  const state = { topic: "all" };
  function countTopic(t) { return ARTICLES.filter(a => (a.topics || []).includes(t)).length; }
  function renderKeywordBar() {
    const items = [`<button class="kbtn kbtn-all" data-topic="all" aria-pressed="${state.topic === "all"}">全部<span class="c">${ARTICLES.length}</span></button>`];
    allTopics.forEach(t => {
      const [c, bg] = topicColor[t];
      items.push(`<button class="kbtn" data-topic="${esc(t)}" aria-pressed="${state.topic === t}" style="--tc:${c};--tbg:${bg}">${esc(t)}<span class="c">${countTopic(t)}</span></button>`);
    });
    $("#keywordBar").innerHTML = items.join("");
  }
  renderKeywordBar();

  function impColor(v) { return IMP_STYLE[v] || IMP_STYLE[1]; }
  function sourcePill(source) {
    const [c, bg] = SOURCE_STYLE[source] || ["#4b514c", "#f0f1f1"];
    return `<span class="source-pill" style="--sc:${c};--sbg:${bg}">${esc(source)}</span>`;
  }
  function topicChips(a) {
    return (a.topics || []).map(t => {
      const [c, bg] = topicColor[t] || ["#4b514c", "#f0f1f1"];
      return `<span class="topic" style="--tc:${c};--tbg:${bg}">${esc(t)}</span>`;
    }).join("");
  }


  function reviewPoints(text) {
    let t = String(text || "").trim();
    if (!t) return ["（未提供）"];
    let parts = t.split(/(?=（\d+）)|(?=\(\d+\)\s)/).map(s => s.trim()).filter(Boolean);
    if (parts.length === 1) {
      parts = t.split(/\n+/).map(s => s.trim()).filter(Boolean);
    }
    if (parts.length === 1 && /[；;]/.test(t) && t.length > 120) {
      parts = t.split(/[；;]/).map(s => s.trim()).filter(Boolean);
    }
    if (parts.length === 1) {
      const sentences = t.match(/[^。！？]+[。！？]?/g) || [t];
      if (sentences.length > 1) parts = sentences.map(s => s.trim()).filter(Boolean);
    }
    const expanded = [];
    for (const part of parts) {
      if (part.length > 420 && /[；;]/.test(part)) {
        expanded.push(...part.split(/[；;]/).map(s => s.trim()).filter(Boolean));
      } else {
        expanded.push(part);
      }
    }
    return expanded.map(s => s.replace(/^[（(]?\d+[）)]?\s*/, "").trim()).filter(Boolean);
  }
  function reviewList(text) {
    return `<ul>${reviewPoints(text).map(p => `<li>${esc(p)}</li>`).join("")}</ul>`;
  }
  function reviewHTML(a) {
    const r = a.review;
    if (!r) return "";
    return `<details class="review">
      <summary>AI 审稿</summary>
      <div class="review-body">
        <div class="review-block"><h3>核心主张是否成立</h3>${reviewList(r.correctness)}</div>
        <div class="review-block"><h3>主要缺陷</h3>${reviewList(r.weaknesses)}</div>
        <div class="review-block"><h3>是否夸大</h3>${reviewList(r.overclaim)}</div>
        <div class="review-block"><h3>需要核对的引用 / 实验</h3>${reviewList(r.citations)}</div>
        <div class="review-block"><h3>要作者回答的问题</h3>${reviewList(r.questions)}</div>
        <p class="review-meta">${esc(r.basis)} · AI 生成的批判性审稿，不是同行评审；结论以原文为准。</p>
      </div>
    </details>`;
  }

  function entryHTML(a) {
    const w = wf(a.id);
    const [ic, ib] = impColor(a.importance);
    const opts = Object.entries(STATUS_LABEL).map(([k, v]) => `<option value="${k}"${w.status === k ? " selected" : ""}>${v}</option>`).join("");
    return `<article class="entry" data-id="${esc(a.id)}" style="--imp:${ic};--imp-bg:${ib}">
      <aside class="rail">
        <div class="no">${String(a.no).padStart(2, "0")}</div>
        <span class="imp-badge" title="${esc(a.importance_reason || "")}" aria-label="重要性 ${a.importance} / 5，${IMP_LABEL[a.importance]}"><span>${a.importance}</span><span class="den">/5</span></span>
        <span class="imp-label">${esc(IMP_LABEL[a.importance] || "")}</span>
      </aside>
      <div class="entry-body">
        <div class="entry-meta">
          ${sourcePill(a.source)}<span class="sep">·</span><time datetime="${esc(dateOnly(a.published))}">${esc(dateOnly(a.published))}</time><span class="sep">·</span><span>${esc(a.venue || "")}</span>
        </div>
        <h2><a href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">${esc(a.title)}</a></h2>
        <p class="title-zh">${esc(a.title_zh)}</p>
        <p class="authors">${esc((a.authors || []).join(" · "))}</p>
        <div class="topics">${topicChips(a)}</div>
        <p class="imp-reason"><b>重要性 ${a.importance}/5 · ${esc(IMP_LABEL[a.importance] || "")}</b> · ${esc(a.importance_reason || "")}</p>
        <p class="summary"><b>结论</b>${esc(a.summary)}</p>
        <div class="analysis">
          <div><h3>问题</h3><p>${esc(a.problem)}</p></div>
          <div><h3>方法</h3><p>${esc(a.method)}</p></div>
          <div><h3>结果</h3><p>${esc(a.result)}</p></div>
          <div><h3>关键贡献</h3><p>${esc(a.contribution)}</p></div>
          <div class="wide"><h3>局限 / 待核验</h3><p>${esc(a.limitation)}</p></div>
        </div>
        <div class="keynums"><span class="label">关键数字</span>${(a.key_numbers || []).map(k => `<span class="kn">${esc(k)}</span>`).join("")}</div>
        <div class="entry-foot">
          <div class="entry-actions">
            <select class="status-select" data-status="${esc(a.id)}" aria-label="阅读状态">${opts}</select>
            <button class="textbtn" type="button" data-note-toggle="${esc(a.id)}">${w.note ? "编辑笔记" : "笔记"}</button>
            <a class="link" href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">原文 ↗</a>
            ${a.pdf_url ? `<a class="link" href="${esc(a.pdf_url)}" target="_blank" rel="noopener noreferrer">PDF</a>` : ""}
            ${a.doi ? `<a class="link" href="https://doi.org/${esc(a.doi)}" target="_blank" rel="noopener noreferrer">DOI</a>` : ""}
          </div>
        </div>
        <details class="abstract"><summary>摘要原文</summary><p>${esc(a.abstract || "摘要待补。")}</p></details>
        ${reviewHTML(a)}
        <div class="note-wrap" data-note-wrap="${esc(a.id)}"${w.note ? "" : " hidden"}>
          <textarea class="note-area" data-note="${esc(a.id)}" placeholder="记录：值得记下的方法、需要核对的数字、与你当前工作的连接…">${esc(w.note)}</textarea>
          <div class="note-meta"><span data-save-status="${esc(a.id)}">${w.note ? "已从本机恢复" : "自动保存在本机"}</span><button class="textbtn" type="button" data-export-one="${esc(a.id)}">导出此条</button></div>
        </div>
      </div>
    </article>`;
  }

  function renderTOC() {
    const list = ARTICLES.slice().sort((a, b) => a.no - b.no);
    $("#tocList").innerHTML = list.map(a => `<li><a href="#p-${String(a.no).padStart(2, "0")}" data-toc-link><span class="toc-no">${String(a.no).padStart(2, "0")}</span><span>${esc(a.title_zh || a.title)}</span></a></li>`).join("");
  }
  function closeTOC() {
    $("#tocPanel").hidden = true;
    $("#tocToggle").setAttribute("aria-expanded", "false");
  }

  function typesetMath() {
    if (!window.MathJax || !MathJax.typesetPromise) return;
    const run = () => MathJax.typesetPromise([$("#entries")]).catch(err => console.warn("MathJax:", err));
    if (MathJax.startup && MathJax.startup.promise) MathJax.startup.promise.then(run);
    else run();
  }

  function render() {
    const list = ARTICLES.filter(a => state.topic === "all" || (a.topics || []).includes(state.topic)).sort((a, b) => a.no - b.no);
    $("#entries").innerHTML = list.map(entryHTML).join("");
    $("#emptyState").classList.toggle("show", list.length === 0);
    $("#listSummary").innerHTML = `显示 <b>${list.length}</b> / ${ARTICLES.length} 篇`;
    $$(".kbtn").forEach(b => b.setAttribute("aria-pressed", String(state.topic === b.dataset.topic)));
    typesetMath();
  }

  $("#keywordBar").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-topic]");
    if (!btn) return;
    state.topic = btn.dataset.topic;
    render();
  });

  $("#entries").addEventListener("click", (e) => {
    const toggle = e.target.closest("[data-note-toggle]");
    if (toggle) {
      const wrap = document.querySelector(`[data-note-wrap="${CSS.escape(toggle.dataset.noteToggle)}"]`);
      if (wrap) { wrap.hidden = !wrap.hidden; if (!wrap.hidden) wrap.querySelector("textarea")?.focus(); }
      return;
    }
    const one = e.target.closest("[data-export-one]");
    if (one) {
      const a = ARTICLES.find(x => x.id === one.dataset.exportOne);
      download(`note-${a.no}-${a.id}.json`, { article: { id: a.id, title: a.title, url: a.url }, workflow: wf(a.id) });
      toast("已导出此条");
    }
  });

  $("#entries").addEventListener("change", (e) => {
    const sel = e.target.closest("[data-status]");
    if (!sel) return;
    const w = wf(sel.dataset.status); w.status = sel.value; save();
    toast("状态已保存：" + STATUS_LABEL[w.status]);
  });
  let noteTimer;
  $("#entries").addEventListener("input", (e) => {
    const ta = e.target.closest("[data-note]");
    if (!ta) return;
    const w = wf(ta.dataset.note); w.note = ta.value;
    const label = document.querySelector(`[data-save-status="${CSS.escape(ta.dataset.note)}"]`);
    if (label) label.textContent = "正在保存…";
    clearTimeout(noteTimer);
    noteTimer = setTimeout(() => {
      save();
      if (label) label.textContent = "已保存 · " + new Date().toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });
    }, 300);
  });

  function download(filename, payload) {
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
  }
  $("#exportBtn").addEventListener("click", () => {
    download(`reading-notes-${META.issue_date || "digest"}.json`, {
      exported_at: new Date().toISOString(), issue: META.issue_date,
      articles: ARTICLES.map(a => ({ id: a.id, no: a.no, title: a.title, topics: a.topics, url: a.url, ...wf(a.id) }))
    });
    toast("已导出全部笔记与公式修改");
  });
  $("#printBtn").addEventListener("click", () => window.print());

  document.addEventListener("toggle", (e) => {
    if (e.target.matches && e.target.matches("details.abstract, details.review")) typesetMath();
  }, true);

  $("#tocToggle").addEventListener("click", () => {
    const open = $("#tocPanel").hidden;
    $("#tocPanel").hidden = !open;
    $("#tocToggle").setAttribute("aria-expanded", String(open));
  });
  $("#tocClose").addEventListener("click", closeTOC);
  $("#tocPanel").addEventListener("click", (e) => {
    if (e.target.closest("[data-toc-link]")) closeTOC();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !$("#tocPanel").hidden) closeTOC();
  });

  renderTOC();
  render();
})();
</script>
</body>
</html>
