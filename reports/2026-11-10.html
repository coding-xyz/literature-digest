 on the fly. We prove that our scheme has a threshold under a local stochastic circuit-level noise model and discuss how to generalize it to implement topological logical gates.","importance":5,"importance_reason":"首次对任意2D非手征（含一般非阿贝尔）拓扑相给出显式综合征提取电路、在线解码器与局域随机线路噪声下的完整阈值证明，填补了此前仅有 D4/S3 等可解模型或唯象噪声结果的空白（l.142-164）。","summary":"对任意2D非手征拓扑相构造 Turaev–Viro 路径积分综合征提取电路与聚类在线解码器，并证明电路级局域随机噪声阈值：\\(\\epsilon<\\epsilon^*\\) 时逻辑失败概率 ≤ \\((\\epsilon/\\epsilon^*)^{\\exp(c\\log R/\\log\\log R)}\\)（Thm 2），burst 半径上界 \\(\\frac{L-2}{800\\lambda_C Q}\\)（Eq 44）；方格电路每单元胞每周期 10 步 gluing（Eq 40）。","problem":"对一般（不必可解的）非阿贝尔拓扑相，此前没有严格的端到端线路级阈值证明，也缺少构造显式综合征提取电路与解码器的通用方法：已有工作或限于 D4/S3 量子双倍 [9,10]，或只给出非循环任意子模型在唯象噪声下 RG 解码器的证明梗概 [15]，或对 double-Fibonacci 仅有无测量错误、单错误假设下的数值证据 [20,21]。本文要为任意 2D 非手征拓扑相补齐记忆的容错证明，并把框架延伸到逻辑门协议。","method":"以 Turaev–Viro 路径积分为骨架（F-张量满足五边形/不可约/标准形公理，任意子世界线由管代数表示的 ρ-张量给出，辅以任意子排除与完备性公理），把 2+1D 路径积分逐层实现为电路：融合空间恢复层、综合征提取层（\\(F^{(22)}/F^{(13)}/ρ\\) 均被验证为量子 instrument，Props 1–3）、修正层（Props 4–5，用 ρ/S 算符按解码器指令移动并融合任意子），方格上每单元胞 10 步 gluing（Prop 6, Eq 40）。解码器（Alg 1–2）对全部非平凡测量结果（含假阳性）按 β(r)=3r 聚类，把每个簇的任意子逐步移向 base point。证明分三步：contractible damage ⇒ 无逻辑错误（Props 7–8，纯路径积分公理）；超线性分离的 burst 分解（\\(γ(r)=Cγ·r·log^{3/2}(e+r)\\)，Def 5）⇒ damage contractible（Thm 1，经 dominant burst 聚合体按层级归纳控制，Lemma 1–5）；非 burst 可分解构型由 Gács 型稀疏性界控制（Lemma 6，App B 二叉树见证计数），合成 Thm 2。","result":"Thm 2：存在 ϵ*>0 与常数 c、R*，对任意 ϵ-bounded 局域随机线路噪声及满足 \\(L−2≥800λ_C·Q·R*\\) 的 L，逻辑失败概率 ≤ \\(|G|·(ϵ/ϵ*)^{exp(c·log R/log log R)}\\)，其中 \\(R(L)=(L−2)/(800λ_C Q)\\)；Prop 7/8 严格证明 contractible damage 无逻辑错误、损伤簇整体电中性；Sec V 把电路/解码器推广到含边界、域墙、计算任意子的时空流形，给出两条因果约束（缺陷移动速度须 <O(1)、禁 constriction 事件），但门阈值仅以概述形式断言（l.3661-3665）。","contribution":"把非阿贝尔拓扑码的容错分析从可解模型+唯象噪声推进到一般非手征相+线路级噪声，且证明完全自洽于路径积分公理、不借助任何子物理输入；统一的电路构造与 just-in-time 聚类解码器为 double-Fibonacci 等候选非阿贝尔存储体提供可证明基线；把 contractible damage、损伤中性等常被物理动机化的命题公理化，并与 Gács/Toom 型 burst 论证缝合，形成可复用的阈值证明工具箱，对理论组后续构造逻辑门协议或模型专用优化电路有直接参考价值。","limitation":"阈值常数完全非构造（\\(Cγ=10^{19}\\)、\\(λ_T\\)≈\\(5.7×10^{6}\\)），无数值阈值估计，也无到双比特门层的电路实现；逻辑门与态制备/读出不在定理内，Sec V 仅为概述。","key_numbers":["准拉伸指数 (ϵ/ϵ*)^{exp(c·log R/log log R)}（Thm 2）","burst 半径上界 (L−2)/(800λ_C Q)（Eq 44）","每单元胞每周期 10 步 gluing：9 四面体+1 任意子圆柱（Eq 40）","解码移动速度下界 v∞=1/2（Eq 52）；分离函数 γ(r)=Cγ·r·log^{3/2}(e+r)","Lemma 9 常数：Cγ=10^19、Q=10^6、λ_C=7173、λ_T=5,738,400"],"url":"https://arxiv.org/abs/2611.08488","pdf_url":"https://arxiv.org/pdf/2611.08488v1","doi":"","review":{"verdict":"小修","confidence":"中高","correctness":"记忆阈值这一核心主张的证明链完整且自洽。Sec II 的 Props 1–5 用路径积分公理（拓扑不变、不可约、标准形、任意子排除/完备、融合空间完备）验证 \\(F^{(22)}/F^{(13)}/ρ/S\\) 均为合法量子 instrument，Eq (24)(29)(33) 的归一化逐条依赖相应公理，推理闭合；Prop 6 给出方格上 10 步 gluing 的显式顺序（step 0 增两个三角形、step 9 减两个复原）。Sec IV：Prop 7 由 \\(S^{2}×[0,1]\\) 的不可约公理严格给出 contractible damage ⇒ 恒等；Thm 1 的关键 Lemma 5（l.2765-2988）按 level 归纳同时证明聚合体含于 syndrome box 与解码簇分离，Lemma 2/Cor 1/Lemma 3/Lemma 4 分别处理 guard box 外聚类、reconnecting time 后 base point 固定、含捷径的移动速度界（Eq 52/55/56）与有限时间融合；App C（Lemma 9，rows (a)–(l)）逐条核验常数，抽查 Eq (61)(63)(87)(94)(95) 与常数一致。Lemma 6/Thm 2 的 App B 二叉树见证论证（\\(2^{n}\\) 个互异叶点、Eq B7–B9 计数、ϵ* 在 Eq B14 定义）重现 Gács 界，逻辑闭合。保留意见：逻辑门阈值（Sec V E）明确只是 outline；boundary 的公理验证自认未给出（l.3298-3299）；全文无任何数值验证。","weaknesses":"1. 物理可实现性缺口：综合征提取算符是 F/ρ 张量收缩构成的量子 instrument，每个 instrument 如何分解为局域双比特门+单比特测量+前馈未给出；每周期 10 步 gluing 是张量网络层级的深度，实际电路深度、辅助比特与辅助任意子制备开销均未估计（l.213-215 与 toric code NWSE 电路的类比掩盖了这一差别）。以线路级阈值为主张的论文缺少门级实例化，是最实质的缺陷。 2. 阈值非构造：Lemma 9 的 \\(Cγ=10^{19}\\)、\\(λ_T=5,738,400\\) 等使 ϵ* 仅在数学上为 O(1)；全文无任何数值实验给出可用的阈值量级或解码器实际性能（对比 [20,21] 至少有数值阈值证据）。 3. 定理只覆盖记忆：Def 3（l.1611-1632）用假想的 O(L) 步无噪恢复定义逻辑错误率，不含态制备与读出；Sec V 排除时间垂直边界与 constriction（l.3476-3487、l.3565-3576），过去朝向的时间垂直边界被判定不可容错解码，而 Sec V E 的推广仅一句 generalizes fairly straightforwardly（l.3661-3665），无对应定理编号。 4. 解码器复杂度未分析：Alg 1 每时间步对全历史重聚类，朴素实现每步 \\(O(|S|^{2})\\)、总复杂度至少随 T 平方增长；正文只说 polynomial time（l.193-194），且 l.1520-1523 承认可限制在 O(L) 时间窗但为简化讨论采用全历史，窗口化下 Thm 2 是否逐字成立未证。 5. 噪声与控制模型假设强：错误事件定义为替换任意（经典受控）信道（l.1404-1407），并假设经典处理快而免费、无误（l.194-195）；damage 定义把前馈效应吸收进损伤（l.1688-1690）本身正确，但对非阿贝尔模型解码决策错误的后果比环面码敏感，该假设的稳健性值得显式讨论。 6. 相对同期工作的增量：证明骨架（Gács 稀疏性 [37,38]、Toom 式 burst [39,40]、聚类修正）承袭已知，电路 generalize [20] 与 [9,29–33]；新意主要在用路径积分公理统一并推广到一般非手征相，相对 [9,10] 的技术推进集中于有限任意子移动速度的处理。 7. 细节瑕疵：l.1455 拼写（sddition）、Eq (61) 括号不配，图 2–6 仅存 caption 残片无法核对几何声明；不影响正确性但影响可读性。","overclaim":"1. 结论 l.3669-3671 断言对任意 ϵ-bounded 噪声存在阈值且逻辑错误率准拉伸指数衰减，省略了 Thm 2 的大尺寸条件 \\(L−2≥800λ_C\\) Q R*（l.3094-3101），小尺寸不在保证范围。 2. 引言 l.211-212 称 contractible damage 无逻辑错误与损伤中性 usually not mathematically proven in the literature——对 D4/S3 已有完整电路级证明 [9,10]，应限定为对一般非阿贝尔相。 3. l.192-194 断言解码器 polynomial time：全文无复杂度定理，Alg 1 全历史聚类每步至多 \\(O(|S|^{2})\\)，该句是未证明的实现声明。 4. l.213-215 把方格电路类比 toric code NWSE 电路：概念类比成立，但每个 gluing 是一般融合范畴的 instrument 而非 Pauli 稳定子测量，门级开销可能相差巨大，类比易导致浅读。 5. 摘要 discuss how to generalize it to implement topological logical gates 措辞准确，但 l.3128-3129 出现 enabling universal quantum computation in addition to memory，而因果约束已排除若干标准协议（仅对 [9] 的时间垂直域墙有豁免，l.3617-3622），普适性覆盖面未被验证。","citations":"[10] Lyons–Brown（arXiv:2602.11258，2026）：与本文主题几乎重叠（任意子的容错量子计算），必须核对其噪声模型与证明范围，直接影响本文首次一般非阿贝尔线路级阈值的优先权表述（l.135-136、l.3787-3788）。 [9] Davydova 等（arXiv:2503.15751）：最近邻先行工作，需核对本文电路相对其 type-III twisted DW 电路（l.3714-3721 自认）的增量及 D4 阈值证明的覆盖差异。 [15] Dauphinais–Poulin（arXiv:1607.02159）：正文称其证明无法推广到循环任意子模型（l.150-155），需核对原文的确切假设。 [20,21] Schotte 等：vastly generalize（l.199-200）需对照其 Fibonacci 电路与噪声假设（无测量错误/单错误，l.156-164）。 [37,38,39,41] Gács 及 Durand 等：Lemma 6 声称即 Gács 稀疏性界，App B 自含，但 \\(γ(r)=Cγ·r·log^ζ\\) 分离函数与文献标准形式的对应值得核对。 [28] Bauer 博士论文：公理体系（含 anyon completeness）的主要出处，需核对本文表述与其 Sec 6.2 的等价性。","questions":"1. 请对 double-Fibonacci 给出单单元胞 10 步 gluing 的门级分解：每个 F/ρ/S instrument 需要多少辅助比特/辅助任意子、多少层最近邻双比特门？由此估计每轮真实电路深度与错误位置数，并讨论阈值结论对该开销的敏感性。 2. 在你们的常数下 ϵ* 的量级如何（乐观估计亦可）？能否对小尺寸做数值模拟给出逻辑错误率-物理错误率曲线，与 [20,21] 的数值阈值对比？ 3. 解码器每步对全历史聚类的最坏时间/空间复杂度是多少？若改用 l.1520-1523 的 O(L) 时间窗，Lemma 2/Cor 1/Lemma 5 的论证需改动何处，Thm 2 是否仍成立？ 4. Sec V 的因果约束下，哪些已知非阿贝尔逻辑门协议（域墙接口 [45,46]、测量型方案）可以满足？请给出 double-Fibonacci 上一个满足约束的完整通用门集候选。","basis":"全文 4474 行完整读毕（1–800 引言与路径积分、801–1600 电路与解码、1601–2400 容错证明主体、2401–3200 Lemma 5–Thm 2、3201–4000 Sec V 与结论、4001–4474 App A–C 含 Lemma 9 常数核验）；实际行数 4474，多于任务描述的 3783。图 1–6 与张量图（Eq 1/2/5/6、Eq 37–40 等）仅有文字残片，图本身不可见，gluing 顺序与 Fig 3–5 的几何声明无法目验；无代码/数据附件。"}},{"id":"arxiv-2611.09538","no":2,"topics":["纠错码"],"source":"arXiv","venue":"arXiv:2611.09538 [quant-ph]","published":"2026-11-06","title":"Twisted Compactification, Quotient Quantum Codes and Logical Gates","title_zh":"扭转紧化、商码与逻辑门","authors":["Po-Shen Hsin"],"abstract":"Many quantum codes, including balanced-product, bivariate-bicycle and genon codes and the five-qubit code, are quotient codes: a larger code folded onto itself by identifying each check with its image under a deck transformation composed with a symmetry. We show that this is the lattice form of twisted compactification, in which a theory on $X\\times F$ carries a symmetry background along $F$, and we use the correspondence in both directions. For monomial quotients of Pauli stabilizer codes, a transfer theorem gives the logical qudits, logical operators and distance bounds from those of the parent, with a Tate cohomology group counting the logical operators that are new. For higher-form and cup-product symmetries the twist is an entangling diagonal circuit; when a finite cover trivializes the background, the code is a dressed quotient, so abelian Pauli codes give non-abelian topological order such as $D(D_4)$. The dressings have Clifford level at most one less than the degree of the twist, and for cubic twists the code dimension is a count of solutions of quadratic equations in cup products, which certifies that the code is not a Pauli stabilizer code when it is not a power of two; on tori and slabs the distance is linear in the size. Twists also create logical gates: three toric codes on $S^3$ have no logical qubits, but on $\\mathbb{RP}^3$ the same circuit is a logical $CCZ$. A quarter-turn twist of the 3D fermionic toric code gives codes of linear distance, from $[[768,2,9]]$ up, whose $p+ip$ pump is an explicit finite-time quasi-local evolution that preserves the code space exactly; using the spin-topological response formula of Barkeshli, Hsin and Kobayashi, we identify its logical action as $T$ up to Clifford factors. Finally, twisting abelian gauge theories reach only the quantum doubles $D(G)$ with $[G,G]$ central.","importance":5,"importance_reason":"把 balanced-product/BB/genon/五比特码等主要码族统一为扭转紧化的商码，并给出转移定理、非 Pauli 维数证书、RP³ 上逻辑 CCZ 与 [[768,2,9]] 线性距离逻辑 T 族等新结果，属码构造理论层面的框架性工作。","summary":"证明商码（balanced product/BB/genon/五比特码）即扭转紧化的格点形式：转移定理（Thm 3.4）以 Tate 上同调 \\(\\hat H^{0}(\\Gamma;S)\\) 计数缠绕扇区；CZ/CCZ 缠绕给 dressed quotient，三次扭维数是杯积二次方程解数（Thm 3.21），22 非 2 幂即证书排除 Pauli 稳定子码（Cor D.4）；D(D4) 码 \\([[15L^{2}, log₂22, Θ(L)]]\\)；四分之一扭给 [[768,2,9]] 族与逻辑 T（Prop 4.24）。","problem":"商码各家族（balanced product、lifted product、bivariate-bicycle、genon、五比特码等）各自独立地计算参数与逻辑门，缺乏统一构造与统一参数理论；且格点码构造此前只用置换类（monomial）粘合，原则上到不了非阿贝尔拓扑序。本文要建立扭转紧化与商码的对应并在两个方向使用：从场论出发设计码与逻辑门，从码出发给出紧化理论的显式格点实现。","method":"四步法。Lift：取平凡化背景的有限覆盖 F̃→F；Identify：deck 群复合对称性作商——monomial 时为 Def 3.1 的商，cup-product 对称性（CZ/CCZ 型纠缠线路）时为 Def 3.18 的 dressed quotient；Compute：Thm 3.4 转移定理给出 k′、逻辑算符与距离界，Tate 群 Ĥ\\(^{0}(Γ\\);S) 计数缠绕扇区，Thm 3.11 谱序列处理平坦背景，Thm 3.20/3.21 给二次/三次扭转的维数计数（后者为杯积二次方程解数），Thm 3.27/Cor 3.28 给距离 ≥(L−3)/10；Descend：Prop 4.1 下降判据、Prop 4.7 扭转扇区上的门为 bordism 不变量 \\(⟨(B_φ)*ω,\\) \\(c_*[M]⟩\\)、Prop 4.22/4.24 证明费米泵精确下降。技术核心是立方杯积（Eq 6）+Stokes+局部上链引理（Lemma B.3），App C 给完整证明，App D 给非 Pauli 证书，App E 给 T1–T25 数值与精确检验。","result":"统一了 Table 6 所列已知码族；新结果包括：带 Tate 项的转移定理（Thm 3.4，运行例子 [[20,2,4]]→[[5,1,3]] 的全部数字有独立证书）、纠缠扭转的 dressed quotient（Thm 3.19）、三次扭转维数点计数 22/92/1576 及非 Pauli 证书（Thm 3.21、Cor D.4）、D(D4) 码 \\([[15L^{2}, log₂22, Θ(L)]]\\)（Cor 3.28）、\\(RP^{3}\\) 上逻辑 CCZ（Prop 4.7，检验 T6）、四分之一扭费米环面码族 [[768,2,9]]–[[6144,2,17]]（Table 4，\\(d=Θ(min(L,L_z))\\)，小例精确值 9–17）及准局域 p+ip 泵实现的逻辑 T（Prop 4.24）、no-go：所述扭转只达 [G,G] 中心的量子双倍（Props 2.3/2.4）。","contribution":"对理论组：把码设计化为选母码+选对称性+选内部空间的搜索，转移定理与谱序列把参数计算归约为母码上的上同调计算；明确扭转与 gauging 的分界（nilpotency class ≤2），划清两者到达范围；dressed quotient 机制证明阿贝尔 Pauli 母码经 CCZ 型纠缠粘合可得非阿贝尔序，并给出 2D 局域约束（Bravyi–König）之外非 Clifford 门的系统来源；四分之一扭费米泵给出现有最完整的 3D 线性距离逻辑 T 构造之一（精确码空间保持+准局域性+距离界）。","limitation":"所有新码速率趋零（k≤log₂22 或 k=2），全文无解码/阈值分析；三次扭转的逻辑算符无公式（open problem 1）；逻辑 T 的识别依赖场论输入 [1, eq.(26)] 未在格点证明；多处数值检验为双精度。","key_numbers":["转移定理 Thm 3.4 与 Tate 群 Ĥ⁰(Γ;S) 计数缠绕扇区","D(D4) 码 [[15L², log₂22, Θ(L)]]；点计数 22/92/1576（Cor D.4 证书）","四分之一扭族 [[768,2,9]]…[[6144,2,17]]，d=Θ(min(L,L_z))，小例 d=4J+1","距离下界 (L−3)/10（Thm 3.27/Cor 3.28）","运行例子：[[20,2,4]] → [[5,1,3]]，仅 20/360 自同构下降"],"url":"https://arxiv.org/abs/2611.09538","pdf_url":"https://arxiv.org/pdf/2611.09538v1","doi":"","review":{"verdict":"小修","confidence":"中高","correctness":"主定理证据链总体扎实。Thm 3.4（转移）在 App C.2 是干净的 norm 映射/Ĥ⁰ 短正合列论证；运行例子的全部数字（dim \\(S^Γ=5\\)、dim N(S)=4、Ĥ⁰ 维数 1、\\(d_wind=3\\)、d′=3、20/360 自同构下降）在 App E.1 有独立于正文的证书（l.5912-5991）。Thm 3.20 的二次计数与约 50 例格点计算一致（l.1789-1790）；Thm 3.21 的点计数 22/92/1576 与群论 \\(|Hom(Z_n,G)|/|G|\\) 及 30 例格点一致（l.1851-1856）；Cor D.4 的非 Pauli 证书逻辑严密，Thm D.2 的迹论证正确，Prop D.3 以 Warning 第二定理给条件性下界并构造反例说明假设必要（l.5498-5502）。距离侧 Thm 3.27 的局部填充论证完整（盒中相对上同调/同调为零），Cor 3.28 的 (L−3)/10 下界与长 L 的 Z-循环上界匹配；Prop 4.24(a)(b)(d) 证明严格（Lemma B.15 的解析核估计+[75] Lieb–Robinson 外推到指数衰减相互作用在 l.5365-5371 有专门论证）。薄弱点：Prop 4.24(c) 的逻辑 T 以 [1, eq.(26)] 的场论公式为输入，作者明言这是唯一未在格点上完成的一步（l.5376-5380），T21 的 \\(2\\times10^{-15}\\) rad 数值检验是证据而非证明；Prop 2.4 不覆盖 EM 对偶 holonomy（l.802-804 自认）；Thm 3.19(b) 对非线性 ω 需要 covering 在闭立方上单射的假设，其必要性论证较间接。","weaknesses":"1. 与量子纠错主线的距离：全部新码为拓扑型低速率码（D(D4) 码 k=log₂22≈4.46 对 \\(15L^{2}\\) 比特；四分之一扭族 k=2 对 \\(n=24L^{2}J\\)，[[768,2,9]] 速率 2/768）；框架虽把 good qLDPC 纳入词典（Table 6），但对 qLDPC 无新码或新参数界；全文无解码算法、综合征结构或阈值分析，对解码/阈值方向的读者可直接使用的输出有限。 2. 三次扭转的可计算性与逻辑算符缺失：Thm 3.21 的维数是杯积二次方程组的解数，一般情形的计数代价未讨论；dressed 码的逻辑算符没有公式（open problem 1，l.3291-3297），距离只有常数未优化的下界 1/10（Thm 3.27，l.2025），Remark 3.29 自认对增长 X 或小内部空间情形定理失效。 3. 逻辑 T 闭环不完整：Prop 4.24(c) 依赖 [1, eq.(26)]，l.5376-5380 明言 the one step of the proof not carried out on the lattice；T21（双精度、L=4–8、J=2,4）支持但不证明；\\(S^{3}/Q8\\) 上的 CS 评估根本没有泵构造（l.3260-3264 no pump is known），摘要与 Table 2 将其并列为结果有拉旗之嫌。 4. 数值检验的证据等级：T17–T21 为双精度浮点，App E 自我声明属 evidence on the instances computed, not proofs（l.5553-5556）；正文个别处（如 l.4477 的 \\(V=T^{±1}CZ_{τz}Z^ε\\)）引用这些结果时未一贯标注等级。 5. Prop 2.4 的覆盖缺口与摘要不符：no-go 只对 gauge group 自同构 holonomy、higher-form 与 cup-polynomial 扭转证明；EM 对偶 holonomy（正是五比特码与 3D 费米环面码的机制）未覆盖且作者自认 expect the same conclusion but have not shown it（l.802-804），摘要的 blanket 断言未加限定。 6. 新颖性边界拥挤：与 [33]（Cups and gates II）、[37]（KZH）、[38,39]（作者本人的非阿贝尔 qLDPC 系列）、[1]（BHK）高度交叠；Table 2 多行的门为已知结果的重新解读（l.2517-2526 自认 T6/T7 的门非新），论文增值集中于统一表述与 Prop 4.7/4.9/4.19/4.24 的公式化，需逐项核对新增清单。 7. 可读性：正文+附录约 80 页，主结果散布于 box、表 1、表 2；Thm 3.19 的 multilinearity/单射假设、Prop 2.4 的适用范围等关键限定埋在定理陈述与附录中，易被过读。","overclaim":"1. 摘要 abelian Pauli codes give non-abelian topological order such as D(D4)：成立但需 Thm 3.19 的可平凡化覆盖假设（否则退化为 Def 3.14 的 dressed Gauss-law 定义，Remark B.4），摘要未提条件。 2. 摘要 we identify its logical action as T up to Clifford factors：该识别以 [1, eq.(26)] 为输入，独立验证 T21 是双精度数值；宜写 consistent with 或标注依赖；同句中 explicit finite-time quasi-local evolution that preserves the code space exactly 有完整证明（Prop 4.24(a)(b)），无问题。 3. Three toric codes on \\(S^{3}\\) … on \\(RP^{3}\\) the same circuit is a logical CCZ：T6 确认，但作者自认这是 [43,1] 已研究门的 bosonic 类比、非新门（l.2519-2522），摘要未注明来源等级。 4. Clifford level 至多低一级（Prop 3.16）正确，但紧随的维数非 2 幂证书只排除 Pauli 稳定子描述，不排除与其他非 Pauli 码的常数深度等价（l.5522-5524），摘要表述尚准确但易被过读为相位层面的证明。 5. twisting abelian gauge theories reach only the quantum doubles D(G) with [G,G] central：见 weakness 5，证明未覆盖对偶 holonomy，断言过宽。","citations":"[1] Barkeshli–Hsin–Kobayashi（SciPost Phys. 16, 122，2024）：Prop 4.24(c) 与 CS/T 评估的逻辑作用全部来自其 eq.(26)，是本文最关键外部输入，须核对该自旋拓扑响应公式的适用条件（Clifford 模糊度、framing 约定）与四分之一扭空间的匹配。 [33] Breuckmann–Davydova–Eberhardt–Hallwirth–Tantivasadakarn（arXiv:2610.05214）：Prop 4.9 自认是其 twisted cup products 的实例化（l.2405、l.4140-4142），需核对以界定本文新意。 [37] Kobayashi–Zhu–Hsin（PRL 136, 250802，2026）：Clifford-hierarchy 码与 2D 逻辑 T 的出处；Prop 4.14/Ex 4.15 复现其 eq.(6) 电路且 up to inversion（l.2656-2658），须核对等价声明。 [38,39] Zhu–Kobayashi–Hsin（arXiv:2601.06736、2609.31541）：同期非阿贝尔 qLDPC，本文把其 twisted codes 改称 dressed codes（l.1499-1501），优先权需核对。 [34] Fidkowski–Hastings（PRB 109, 235142，2024）：Z8 泵与 \\(T^{3}\\) 上 CCZ 的出处，泵定义需核对一致。 [75] Haah–Hastings–Kothari–Low（arXiv:1801.03922）：其定理对有限程相互作用陈述，本文外推到指数衰减核（l.5365-5371），应核对外推论证。 [16,18,19,23]：确认 Table 6 对商码/好码谱系的归类无错标。","questions":"1. Prop 4.24(c)：能否在格点上从泵的微观定义直接导出逻辑 T（不借助 [1, eq.(26)]），至少对 \\(TL^{2}\\)⋊C4 \\(S^{1}\\) 给出 Fock 空间相位的解析计算，把 T21 从数值证据升级为定理？ 2. 对 D(D4) slab 码，能否给出 22 维码空间的一组显式逻辑算符及权重，检验距离是否达到上界 L（目前只有 Z-循环上界与 (L−3)/10 下界）？ 3. Thm 3.19(b) 中 covering 在闭立方上单射的假设对非线性 ω 是否可去？若不可去，请给出不满足假设且 dressed Gauss laws 偏离投影公式的最小反例。 4. Prop 2.4 的对偶 holonomy 空白：环面码与费米环面码本身 class ≤2，能否把 Prop 2.3 的论证推广到对偶 holonomy 以补全摘要断言？若不能，指出可能的反例方向。","basis":"全文 6164 行完整读毕：1–486 摘要与引言（含 1.3 主结果、1.4 文献）、487–1569 Sec 2–3.5.1、1570–2297 Sec 3.5.2–4.3、2298–3097 Sec 4.4–4.11 与讨论、3098–3897 Sec 5+App A/B（含 B.7/B.15/B.16）、3898–4697 App B.3/C 前半、4698–5497 App C 后半/D、5498–6164 App E（T1–T25、E.1 证书）与参考文献；实际行数 6164，多于任务描述的 5472。图 1–5 与表 1–7 的文字内容在文本中，但图表排版本身不可见；App E 称脚本 available upon request，本会话未获得任何代码或数据文件。"}},{"id":"arxiv-2611.08907","no":3,"topics":["编译与验证","算法"],"source":"arXiv","venue":"arXiv:2611.08907 [quant-ph]","published":"2026-11-06","title":"Shared Lookups and Lazy Residues: Fewer Toffoli Gates for Factoring RSA-2048","title_zh":"共享查找表与惰性余数：用更少 Toffoli 门分解 RSA-2048","authors":["Monit Sharma","Hoong Chuin Lau"],"abstract":"Gidney's 2025 construction for factoring RSA-2048 with few logical qubits spends most of its Toffoli gates on discrete-log table lookups and residue uncomputation. We reduce both costs. Shared lookups return entries for several primes of a residue number system at once because they have the same address. Retained intermediate residues remove recomputation during cleanup and enable lazy arithmetic with a single final modular reduction. We prove output preservation and estimate resources with an open benchmark built on the reference simulator. Against the best reference setting within the same logical-qubit budget, using the published model for the reference and benchmark counts for our circuits, we obtain $15\\%$ fewer Toffolis at $1{,}461$ qubits ($5.08 \\times 10^{9}$ per factoring) and $46\\%$ fewer at $1{,}806$ qubits ($2.55 \\times 10^{9}$). A matched ablation finds $28.8\\%$ fewer Toffolis from three-prime sharing at fixed window and checkpoint settings. Architecture-specific timing determines how much becomes a runtime saving.","importance":5,"importance_reason":"在当前最优的 Gidney 2025 RSA-2048 容错分解构造上，把同等逻辑比特预算下的 Toffoli 总量降低 15%–46%，并以精确复现 published 数字的开放基准与附录 A 输出保持证明支撑，是该方向可直接引用的参照级进展，故维持 importance=5。","summary":"在 Gidney 2025 构造上做三处算术改动：RNS 多素数共享 lookup、保留 loop-3 中间余数（checkpoint）、惰性余数免去逐次模归约。同等逻辑比特预算下 Toffoli 减少 15%（1,461 比特，\\(5.08\\times10^{9}\\)）与 46%（1,806 比特，\\(2.55\\times10^{9}\\)）；匹配消融中三素数共享省 28.8%；并发布可复核的开源基准。","problem":"Gidney 2025 的 RSA-2048 逻辑构造中约 85% 的 Toffoli 集中在 loop-1 离散对数表查找（55%）与 loop-3 清理（30%，Fig. 1）：后者因删除中间余数而必须在清理时重计算，且每次表加法都伴随模归约。论文要解决的问题是：在同等逻辑比特预算下，能否通过算术层改动降低每分解一次 RSA-2048 的 Toffoli 总量，并以可复核的核算方式与预算内最强的参照参数设置比较，而非只与单一 published 配置比较。","method":"三项可复合的改动：(1) 共享 lookup——同一指数窗口为 k 个素数寻址，一次查找返回打包表项，表存跨素数链累积离散对数的差分，telescoping 保证寄存器还原参照值（附录 A1，l.1207-1219）；(2) checkpoint——保留 loop-3 中间余数 \\(r_{j-1}\\)，清理时按保留值精确减去建值，免去逆乘重计算（Bennett 时空折中，l.296-299）；(3) 惰性余数——保留全部 5 个 checkpoint 后余数无需规范化，按普通整数累加、末尾仅 R−ℓ=3 步长除法归约，界 \\(r_j<W3·p≤2^{R}\\)（A3，l.1227-1257）。另配 29 比特截断离散对数寄存器（A2）与更大的 w1=8 查找窗。正确性由命题 1（A1–A5，含相位清理 A5）与小镇路显式门审计（附录 C）支撑。","result":"基准精确复现 published 模型的 6,497,351,306 Toffoli/1,399 比特（l.397-398）；同电路基准计数为 \\(6.55\\times10^{9}\\)/1,435。等预算比较（参照用 published 模型、己方用基准计数，Table 1）：1,461 比特 \\(5.08\\times10^{9}\\)（−15.0%）、1,699 比特 \\(2.78\\times10^{9}\\)（−41.3%）、1,806 比特 \\(2.55\\times10^{9}\\)（−46.2%）；相对 benchmark 计数 published 配置最多 −61.1%（Table 6）。匹配消融：5 checkpoint 省 15.5%、惰性再省 5.4%、k=1→3 省 28.8%（Table 5）。11 个入围配置 8 次重复 95% CI≤0.15%。运行时：表面码 −60%，空间高效中性原子反而 +36.6%（Table 7）。","contribution":"把 RSA-2048 容错成本优化从架构层拉回算术层：证明共享 lookup、checkpoint 与惰性余数可复合且与参照电路输出等价（命题 1+A1–A5），给出在任意逻辑比特预算下与最强参照设置比较的方法学（534,240 设置打分），并发布封堵 \\(scatter_script\\) 计费漏洞的开放基准与全部代码/数据，为后续分解资源工作提供可复核基线；架构迁移分析还给出宽查找字利好表面码、不利于空间高效中性原子的可检验判断。","limitation":"正确性验证依赖分支模拟与小镇路审计，未做全规模干涉模拟；参照曲线用 published 模型计费而己方用基准计数，且 534,240 设置的打分除一点外无独立校验；全规模成本由采样素数仿射外推，仅一个 330 比特校验点；运行时与物理比特为条件性外推，3/5 候选需扩张未计价的内存；Cain 空间高效模型重构存在 51.1 对约 43 的未解释偏差。","key_numbers":["1,461 比特 −15.0%（5.08×10^9 Toffoli）","1,806 比特 −46.2%（2.55×10^9）","三素数共享匹配消融 −28.8%","534,240 个参照参数设置打分","精确复现 published 模型 6,497,351,306 Toffoli"],"url":"https://arxiv.org/abs/2611.08907","pdf_url":"https://arxiv.org/pdf/2611.08907v1","doi":"","review":{"verdict":"小修","confidence":"中高","correctness":"核心主张有二：(1) 改动后的电路与参照电路计算同一输出（命题 1 与附录 A1–A5）；(2) 同等逻辑比特预算下 Toffoli 更少（Sec. 5.1、Table 1、Fig. 2）。关于 (1)：A1 的共享寄存器不变量用跨素数差分表的 telescoping 求和论证（l.1207-1219），前提是源表按 mod \\(2^{32}\\) 存储且 L≤32，对任意共享数 k 自洽；A2 的截断界 \\(V_b<W1(2^ℓ−1)<2^{L}\\) 与长除法条件 \\(W1≤2^{(L−ℓ)}\\) 只对打分参数逐点验证（l.1224-1226），是网格内事实而非一般定理；A3 的惰性界 \\(r_j≤W3(p−1)<2^{R}\\) 在 ℓ=21、w3b=3、R=24 处恰好取等（\\(W3=8=2^{3}\\)），无余量但方向正确；A5 证明每个测量转录的条件映射为 \\(K_μ=c_μ·V_ref\\) 且 \\(|c_μ|=1\\)（l.1281-1295），在解析层面补上了分支模拟不直接验证干涉的缺口。附录 C 的显式门审计（模 3/5/7/13、36 例、GF(2) 相位系数逐项核对、Kraus 抽查）支持实现正确，且诚实报告惰性方案在小模数下不总更省（模 5 静态 180/120/132，l.1375-1376）。关于 (2)：基准精确复现 published 模型的 6,497,351,306 Toffoli 与 1,399 比特（l.397-398、l.1343），采样素数投影在 330 比特完整实例上校验（要求 ≤1%、实测均值 ≤0.18%，Table 11），11 个入围配置 8 次重复的 95% CI≤0.15%（l.671-675）。三个头条数字口径不同但均有明示：−15.0%/−46.2% 是同预算最优参照（published 模型计费）对己方（基准计数）（Table 1/4）；−28.8% 是 w1=6+截断寄存器+5 checkpoint 下仅改 k=1→3 的匹配对照（5.382→3.830，Table 5，我复核 1−3.830/5.382≈28.8%）。计费不对称（参照侧少 36 逻辑比特与 0.8% 门，l.512-515）方向偏向参照，故 −15%/−46% 偏保守。未发现内部矛盾；主要保留是全部等价断言限于同一参照配置（l.1196-1199），跨参数重调按各自近似契约检验，不在命题覆盖范围内。","weaknesses":"1) 比较依赖双计费体系，参照侧网格不可独立复核。等预算比较中参照曲线用 published 成本模型、己方用基准计数（Table 4，l.406-424），同一电路两套口径相差 36 逻辑比特与 0.8% 门（l.512-515）；作者论证偏差方向偏向参照、使 −15%/−46% 保守，但灰线来自作者重跑 archived 参照代码对 534,240 个设置打分（l.504-509），除 published 配置一点外没有任何第二校验点，第三方无法脱离作者代码复核灰线；开放基准只覆盖蓝线一侧。 2) 三个头条百分比口径不同且不可加：−15.0%/−46.2% 是等预算前沿差（Table 1），−28.8% 是固定 w1=6、截断、5 checkpoint 的候选间匹配对照（Table 5），Table 6 另有相对 benchmark 计数 published 配置的 −61.1%。作者注明条件效应不是等预算前沿增益的可加分解（l.665），且摘要已给 28.8% 加了 fixed window and checkpoint settings 限定，但三数并列仍易被读成同一口径的分解。 3) 全规模成本的采样外推只有一个校验点：以约 24/120 个采样素数做仿射外推（附录 B，l.1326-1337），仿射性仅在一次 330 比特完整实例上验证；跨 ℓ、w1、k 的其他配置没有第二个全规模校验点，构造错误与价格公式等系统偏差不在 95% CI 覆盖范围内（l.754-755）。 4) 架构结论依赖含未解释偏差的计时重构：Cain 空间高效处理器每 Toffoli 手术数重构为 51.1、原文约 43（l.1405-1407，作者承认未隔离原因），而最优电路取决于硬件的关键反转（Table 7 中 lazy k=6/8 在该平台 +36.6%）正建立在其查找公式上；Table 9 的 batched 敏感性只算了两个 k=1 候选，未覆盖反转主角。且 Table 7 中 3/5 候选（lazy k=6/8、lazy k=1）需超过 1,480 比特内存且扩张未计价（l.783-786），比较天然偏向参照。 5) 物理层与迁移数字是高度条件性情景：每新增逻辑比特一个热补丁、无布线成本的布局假设（l.1053-1055）；cat 迁移固定 H=H0，H=2H0 时 k=8 反而比双引擎比较点慢 6.9%（l.1036-1038），且该场景比比较点多用约 485 个物理比特（29,488 对 29,003）；Pinnacle 迁移假定已公开的时序与逻辑错误模型可外推到更宽处理单元（l.1040-1044）。作者均标注为情景，但这些数字脱离限定被引用的风险高。 6) 正确性验证的边界：命题 1 的三个宽度不等式（L≤32、\\(W1≤2^{(L−ℓ)}\\)、\\(W3≤2^{(R−ℓ)}\\)）为逐参数人工核验而非通用引理（l.1224-1226）；每候选 128 分支×5 实例的测试不覆盖全部输入（l.1200-1203）；严格核算层自认不能把任意 Python 变成形式验证的可逆线路语言（l.1316-1318）。","overclaim":"1) 摘要 we prove output preservation：证明以固定参照配置与三个逐点验证的宽度不等式为前提（命题 1，l.1172-1176），重调窗口/素数规模的候选按各自近似契约检验（l.1196-1199、l.1349-1351）；正文 Scope 段有这些限定，摘要未携带。 2) 摘要虽然写明了参照用 published 模型、己方用基准计数的双计费（l.16-18），但未说明参照曲线（534,240 设置打分）本身不在开放基准的可复核范围内；open benchmark 的可复核性只及于己方数字与 published 配置这一个校验点。 3) closes several cost-accounting loopholes：附录 B 封堵的是潜在漏洞并以故意作弊候选自测（l.1313-1318），并未证明 published 数字实际受益于这些漏洞；表述无错，但易被二手引用放大为原模拟器计数偏低。 4) Sec. 6 的架构排序结论：Table 7 中 3/5 候选带 †（内存未计价），空间高效模型存在约 19% 的未解释重构偏差（l.1405-1407）；定性结论（宽查找字不利于空间高效中性原子）可信，但 0.40×/1.37× 一类具体倍数不应脱离这些限定引用。 5) 对照组：Sec. 7 的 s=4 外推（约 −26%）与冷存储情景均明确标注非评分结果、非演示布局（l.1057-1067），处理得当，列入以资对照。","citations":"[2] Gidney 2025（arXiv:2505.15917）：published 配置 1,399 比特\\(/6.50×10^{9}\\)（Table 5）、成本公式、loop 份额 55%/30%、模型不计 carry/bookkeeping 比特（l.1343-1346）——本文所有比较的锚点，必须逐项核对。 [5] Chevignard et al.（IACR 2024/222）：RNS 近似余数算术与 f=33 截断累加器来源，惰性方案的 reference error budget 继承自此，需确认误差预算定义一致。 [6] Ekerå–Håstad：s=8 对应 m=1280、s+1 次执行的约定与 pkeep=0.9875 的出处（l.197-203、l.425-431）。 [3] Pinnacle（arXiv:2602.11457）Table VI 四个预算（94,000/94,000/135,000/381,000）：作者称 0.5% 内复现（l.1693-1697），需核对版本（v2 含 Eqs. 26-31）与四舍五入口径。 [4] Cain et al.（arXiv:2603.28627）：1,480 比特内存、148 比特处理器、附录 E.3 查找公式、about 10/about 43 手术数、原子数 13,255/11,033——空间高效反转结论的源头，必须核对公式与均值口径。 [8] Pappalardo et al.（arXiv:2610.37839）：Table XXV/XXVII 调用数、Eqs. (C36)/(C38)/(C52)/(C59-C61)、Table XXXV 运行点（29,003 比特/38.1 小时双引擎点）——cat 迁移重建（22,593 比特、7.841 小时/shot、3.137 天）需对表验证。 [7] Bennett 1989 为标准引用。另：本文自身代码/数据的 Zenodo DOI 在正文缺失（仅写 available at Zenodo，l.1122-1123），开放基准可复核性依赖该链接，必须补齐。","questions":"1) 参照灰线的可复核性：534,240 个设置的逐设置打分结果是否随 Zenodo 一起发布？除 published 配置外，是否在其他若干设置上用基准计数交叉验证过 published 模型，以排除重实现带来的系统偏差？ 2) 等预算比较中参照在 s、f、ℓ、w3、w4 全网格上调参，而候选固定 s=8、ℓ=21、f=33（仅动 w1/寄存器，Table 10 显示匹配参照用 s=4–7）；若把候选也在同等网格上打分（作者只做了 ℓ∈{19,21,23} 敏感性，l.1061-1064），蓝线还能降多少？这是否系统性低估了候选侧？ 3) 空间高效处理器 51.1 对约 43 手术/Toffoli 的重构偏差：能否隔离查找份额差异（60% 对约 50%，l.1407-1409）的贡献，并给出 lazy k=6/8 在 batched 计时下的敏感性（补全 Table 9），以支撑架构反转结论？ 4) cat 迁移中 H 的物理合理范围：能否给出测量/移动/制备调度的构造性估计或编译尝试，使 H/H0∈[0.5,2] 的情景选择有依据（尤其 k=8 在 H=2H0 时反输 6.9%，l.1036-1038）？","basis":"通读了全文 1,792 行（l.1-1792），含附录 A（输出保持，l.1168-1295）、B（基准细节，l.1297-1351）、C（验证与计时敏感性，l.1353-1459）、D（迁移模型，l.1677-1788）及 Table 10/11。图 1-5 仅有文字残片（标签、轴、图注），曲线与数据点不可见，Fig. 2 灰蓝曲线的逐点位置无法直接核验。Table 5/6/7 的行列在 pdftotext 中被压平，个别行-列对应按上下文重构（如 28.8% 的配对 5.382→3.830；Table 7 的 † 归属以表文字为准）；附录 B 的投影公式括号在 txt 中丢失。未运行任何代码；Zenodo 仓库无 DOI，未核验。"}},{"id":"arxiv-2611.08235","no":4,"topics":["测控与噪声"],"source":"arXiv","venue":"arXiv:2611.08235 [quant-ph]","published":"2026-11-05","title":"Persistent level-resolved transmon population after dispersive readout, and the limits of its open-system description","title_zh":"色散读出后持续存在的逐能级 transmon 布居及其开放系统描述的局限","authors":["Sinan Bugu"],"abstract":"We calculate the level-resolved transmon population remaining after dispersive readout with a converged open-system model. The drive and qubit-cavity coupling use the rotating-wave approximation, while the cavity is a quantized mode in a frame displaced by its classical trajectory. At a readout occupation of 80, the model leaves a persistent distribution across the first transmon levels, with p2 = 1.02 x 10^-3 and p3 = 4.10 x 10^-5 at the end of readout. These populations survive an additional drive-off wait: over 73 ns each level decays by less than 3 percent and follows its own relaxation rate, not the near-factor-of-two drop in residual cavity photons. This identifies the population as bare-level occupation rather than coherent dressing. Channel-removal and bath-model controls attribute p2 mainly to dephasing and p3 and above mainly to relaxation, unchanged across bath models though absolute values vary by up to 15 percent. We also test the coherent drive truncation. In dissipation-free transmon-only benchmarks driven by the classical cavity trajectory, the nearest-neighbour RWA drive underestimates the full charge-operator result while the drive is on. At switch-off for occupation 80, where coherent populations are hundreds of times larger than the residual values, p2(RWA)/p2(full) = 0.905 and p3(RWA)/p3(full) = 0.759, with larger discrepancies at deeper levels. One source is a parity-allowed non-nearest-neighbour charge matrix element omitted by the drive operator. A naive beyond-RWA extension with bare-basis Lindblad dissipators fails a zero-drive ground-state test and serves only as a diagnostic. A dressed-basis (secular) construction instead leaves the dressed ground state stationary at zero drive. The result is a converged RWA prediction of readout-induced population plus direct tests of where the approximation loses quantitative reliability.","importance":5,"importance_reason":"超导测控仿真的方法论核心：给出色散读出残留逐能级布居的首个收敛定量预测（n̄LP=80 时 p2≈1.0×10⁻³、p3≈4.1×10⁻⁵），并附收敛自查、通道/浴对照与 RWA 截断误差定量（p2 比值 0.905、p3 比值 0.759），直接约束重复读出/QEC 循环仿真中的模型选择与泄漏种子误差估计，编辑部据全文质量由 4 上调为必读 5。","summary":"在由经典参考轨迹位移的框架中传播 Lindblad 主方程（RWA 截断），计算色散读出后的逐能级残留布居：n̄LP=80 时 \\(p_2=1.02\\times10^{-3}\\)、\\(p_3=4.10\\times10^{-5}\\)；drive-off 等待 73 ns 各能级按自身 Purcell+T1 速率衰减 <3% 而非随残余腔光子数近减半，模型内判定为裸能级占据；通道对照归因 p2≈去相干、p3+≈弛豫；无耗散基准显示最近邻 RWA 驱动低估 p2/p3（比值 0.905/0.759）。","problem":"色散读出通常只用单发保真度评价，读出脉冲结束后在 |2⟩、|3⟩ 等高能级残留多少布居、是否以可持久存在的裸能级占据（而非随驱动消失的相干 dressing）形式留下、由哪种耗散通道逐能级产生，以及常用 RWA/位移框架在 n̄ 接近 ncrit 时的可靠性边界，此前缺乏系统定量的回答。","method":"transmon 写在电荷基（EC/h=0.25 GHz、EJ/h=12.5 GHz、EJ/EC=50），腔保留为量子模式，在按初始态匹配的参考轨迹 \\(α_ref(t)\\) 位移的框架中传播 Lindblad 方程（Eq. 2，l.223-242）：驱动与耦合取激发守恒（RWA、最近邻 Δk=+1）截断，弛豫按电荷矩阵元分配（平浴）、纯去相干为线性对角算符；沿 Fock 截断 Nf、步长 dt、能级数 nlev、电荷基截断 Nc 四方向做七个细化收敛检验；用逐案通道移除、浴模型替换与 |g⟩ 初态对照归因；再以无耗散 transmon-only 加经典腔轨迹基准检验最近邻驱动截断，并以零驱动基态一致性测试诊断裸基 Lindblad 的 beyond-RWA 扩展，最后实现 dressed-basis（secular）修正。","result":"n̄LP=80（≈ncrit=78）时收敛值 \\(p2=1.0240×10^{-3}\\)、\\(p3=4.1015×10^{-5}\\)（Nf=60；n̄LP=20 为 \\(2.388×10^{-4}/1.165×10^{-6}\\)）；73 ns 等待后各能级比值 0.972–0.998，紧随逐能级 Purcell+T1 预测而远离 nres 比值 0.545–0.571。去 Tϕ 使 p2 降至 0.251 倍、去 T1 使 p3 降至 0.034 倍；浴模型替换不改变归因但绝对值散布达 9.5–15.5%。无耗散强驱动基准：\\(p2^{RWA}/p2^{full}=0.905\\)、p3=0.759、p4=0.544，结构性原因是被略去的宇称允许元 ⟨4|n̂|1⟩/n01=0.0796；裸基 Lindblad beyond-RWA 模型通不过零驱动测试（p1 以 \\(2.3×10^{-6}/ns\\) 泵升），dressed-basis 修正使 dressed 基态稳定到 \\(<10^{-11}\\)。","contribution":"把读出后残留布居从单发保真度不可见的效应变为可收敛计算的逐能级模型预测，为重复读出与 QEC 泄漏建模提供 p2≈\\(10^{-3}\\)、p3≈\\(10^{-5}\\) 的量化基准与能级-通道归因；方法论上给出四方向收敛检验、逐案通道对照、浴模型稳健性与零驱动基态一致性测试的完整流程，明确划定 RWA 驱动截断与裸基 Lindblad 的失效位置，对测控与开放系统建模组是直接可复用的范本。","limitation":"结论全部限于单一器件参数（EJ/EC=50、n̄LP/ncrit≈1.03）与单一脉冲形状（\\(sin^{2}\\) 60 ns 上升、abrupt switch-off、仅 |1⟩ 初态）的 RWA 模型；对耗散性 p2/p3 的 RWA 截断误差未定界，浴模型敏感性达 10–15%，且无任何实验对比。","key_numbers":["p2=1.02e-3, p3=4.10e-5 (n̄LP=80)","73 ns 等待各能级衰减<3%","p2^RWA/p2^full=0.905, p3=0.759","⟨4|n̂|1⟩/n01=0.0796","浴模型敏感性 9.5–15.5%"],"url":"https://arxiv.org/abs/2611.08235","pdf_url":"https://arxiv.org/pdf/2611.08235v1","doi":"","review":{"verdict":"小修","confidence":"高","correctness":"核心主张在其明确声明的模型范围内成立，论证质量高，但范围限定在引用时必须严格执行。(i) 数值收敛：Sec. II C 与附录 A（l.262-286, l.1241-1253）沿 Nf/dt/nlev/Nc 四方向做七个细化比较，最大变化 \\(2.68×10^{-5}\\)（Nf 20→40），p3 每步 \\(≤5.9×10^{-7}\\)，另有双积分器无耗散一致性检验给出 p3 专属阈值 \\(1.139×10^{-6}\\)；Nf 40→60 对 p2/p3/p4 的相对变化为 0.0012%/0.169%/1.53%，均小于浴模型敏感性（9.48%/10.73%/15.46%）——数值收敛成立，且作者把收敛严格限定在 RWA 模型（l.1180-1189）。(ii) 裸能级占据判定（Sec. III, l.484-503）：73 ns 等待后各能级比值 0.972–0.998 紧跟独立计算的 Purcell+T1 速率、远离残余腔场比值 0.545–0.571；在 RWA 模型内 switch-off 后体系本征态即裸能级，且等待已至 \\(|αref|^{2}<10^{-3}\\)、静态 dressing 已消失，故模型内该判定严格；但它只排除了布居跟随腔场的图像，n̄LP/ncrit≈1.03（l.1208-1209）处 beyond-RWA 的 MIST/电离通道（refs [17,19]）在此框架内无法排除，作者承认尚无经过验证的 beyond-RWA 模型（l.1190-1194）。(iii) 通道归因（Sec. IV, Fig. 3）：逐案独立传播而非减法的设计合理，p2 去相干主导（去 Tϕ 剩 0.251 vs 去 T1 剩 0.770）、p3 弛豫主导（剩 0.034）在平浴/Ohmic/频权去相干三种浴下一致（l.644-659）；但双通道移除后的残差未获归因（l.657-659），|g⟩ 初态对照自标 indicative rather than converged（l.636-637）。(iv) RWA 截断检验（Sec. V）：低占据 n̄=2 时 p2 比值已 0.74、p4 已 \\(2.1×10^{-11}\\)（l.783-790），强驱动点 0.905/0.759/0.544 且数值稳定（nlev 10→12 变化 <0.006%、norm 守恒 \\(5.2×10^{-6}\\)，l.812-816）；作者明确拒绝把比值当修正因子或误差界（l.825-834）。综上：模型内结论可靠；作为真实器件预测证据不足，作者的限定声明基本到位但摘要语气偏强。","weaknesses":"1. 头条数字的系统误差无界：生产预测在 n̄LP/ncrit≈1.03 处取得，而 Sec. V 证明同一点位最近邻 RWA 驱动使相干布居被低估 9.5%（p2）、24%（p3）、46%（p4）、96.5%（p5）（l.795-824）；作者正确拒绝外推这些比值为耗散性预测的修正因子（l.825-834），但这也等于承认 \\(p2=1.02×10^{-3}\\)、\\(p3=4.10×10^{-5}\\) 的模型系统误差完全未定量化。对一个以 converged 预测为卖点的工作，缺少哪怕一个粗界（例如在全电荷算符驱动加经典场的 transmon-only 基准中加入与主模型同型的唯象耗散并重复通道分析）是最大缺口。\n2. 无实验对标且不扫参数：文中引用 Hazra [27]、Bengtsson [28] 等重复读出基准实验，却不把 p2≈\\(10^{-3}\\) 与任何实测逐读出泄漏比较；T1=100 µs、Tϕ=150 µs、κ/2π=5 MHz、\\(sin^{2}\\) 60 ns ring-up、abrupt switch-off、仅 |1⟩ 初态的单点设置没有沿失谐、功率、脉冲形状（尤其 ramp-down）与初始态扫描，普适性与对真实器件的可迁移性无从判断。\n3. 位移框架条件化的敏感性未检验：参考轨迹按初始态匹配（|1⟩ 运行用 χe、|g⟩ 对照用 χg，l.171-174, l.632-634）；布居泄漏到 |2⟩/|3⟩ 后真实条件腔幅偏离单一 \\(α_ref\\)，而 \\(p3=4.10×10^{-5}\\) 仅 1.5 倍于全局分辨率阈值 \\(2.68×10^{-5}\\)（l.480-483），对此类系统偏差的余量很小，文中未做 χk 匹配替换或双轨迹对照。\n4. 归因链条的两处中断：双通道移除后 p2 残 1.5%、p3 残 \\(1.6×10^{-4}\\) 未获解释（l.630-631, l.657-659）；|g⟩ 初态对照（0.011/0.023）自标 indicative rather than converged（l.636-637）。虽不撼动主导归因，但削弱了逐能级机制已被完全确定的表述强度。\n5. beyond-RWA 部分只有负面结果：裸基 Lindblad 失败（p1 以 \\(2.3×10^{-6}/ns\\) 泵升，l.1121-1127）、静态 dressed 基修正只通过零驱动测试（l.1155-1165），驱动情形需要 Floquet-dressed 耗散结构并被留作未来工作（l.1167-1174）；附录 B 还显示 n̄LP=80 的 beyond-RWA 截断梯子出现布居倒挂（\\(p5=8.5×10^{-4}\\)、\\(p6=4.2×10^{-4}\\) 反超 p3/p4，l.1436-1439）——核心问题（ncrit 附近读出残留的真实物理）实际上没有答案，论文对此诚实但价值相应受限。\n6. 呈现瑕疵：Fig. 6 图注混入 Overleaf URL 字样（l.1339）；附录 B 截断梯子的 dt 各档不一致（图注自述，l.1432-1434）；自引 [36] 为预印本 arXiv:2602.22174（l.1566-1567）。图本体不可见（txt 抽取），Fig. 2(b,c) 的逐能级比值散点与 Fig. 4(a) 直方图无法逐一核对。","overclaim":"1. 摘要 converged open-system model（l.13-14, l.40-42）：收敛仅指数值收敛于 RWA 模型；同一点位相干基准实测模型偏差 9.5–24%（Sec. V）且对耗散预测无界，converged 易被读成物理收敛。正文限定明确（l.98-102, l.1188-1189），摘要未以同强度传达。\n2. 摘要 this behavior identifies the remaining population as bare-level occupation rather than coherent dressing（l.20-21）：正文有 Within the model 限定（l.500-503），但摘要句式为确定性判定；ncrit 附近的 beyond-RWA dressing 并未被排除，只是不可计算。\n3. 引言 allowing higher-level populations to be resolved down to \\(10^{-6}\\)（l.84-85）：仅对 p3 的水平专属阈值 \\(1.139×10^{-6}\\) 成立；更保守的全局阈值 \\(2.68×10^{-5}\\) 下 p3 只有 1.5 倍余量（l.480-483），\\(10^{-6}\\) 量级的普适分辨率声明过强。\n4. 引言 l.75-77 把残留布居与 cannot be refocused by echo、can seed errors in later operations 关联，但全文没有任何回波或后续门传播的模拟支持该后果陈述，属动机性外推。\n5. l.90-92 以 preserves the joint vacuum exactly and can be converged numerically [30] 支撑收敛性：真空保持是 RWA 的解析性质，与文中实际的四方向数值收敛检验是两回事，引用方式略含混。","citations":"1. Sank et al., PRL 117, 190503 (2016) [17]（MIST beyond RWA，l.1501-1504）：本文把 n̄LP=80 定位在接近 ncrit、beyond-RWA 效应重要的区域，需核对该文测得的临界功率与失谐标度和本文 ncrit≈78、Δ/2π=−1.765 GHz 参数的对应，以确认强驱动点确属 MIST 活跃区。\n2. Dumas et al., PRX 14, 041023 (2024) [19] 与 Shillito et al., PRApplied 18, 034031 (2022) [20]（transmon 电离）：应核对电离阈值理论对 EJ/EC=50、g/2π=100 MHz 器件在 n̄≈80 的预测，确认 RWA 模型在该点仍有意义（未进入电离区）。\n3. Beaudoin et al., PRA 84, 043832 (2011) [31]、Boutin et al. [33]、Gautier et al. [34]（dressed/大系统耗散构造）：核对本文静态 dressed-basis 构造（l.1155-1165）与文献 secular 近似条件的关系；本文 g/Δ≈0.057 并非超强耦合，裸基失败是否纯由 detailed balance 破缺主导值得对照。\n4. Hazra et al., PRL 134, 100601 (2025) [27]（l.1536-1538）与 Bengtsson et al., PRL 132, 100603 (2024) [28]（l.1541-1545）：读出基准/重复测量实验，是 p2≈\\(10^{-3}\\) 预测最直接的对标对象，应核对其逐读出泄漏量级与本文预测的可比性。\n5. Féchant et al., PRL 135, 180603 (2025) [23]（offset charge 依赖，l.1519-1522）：本文固定 ng=0 使宇称定则严格、⟨4|n̂|1⟩ 分析成立；需核对该文对 ng≠0 时宇称禁阻矩阵元激活的定量描述，以评估 RWA 检验结论对真实器件（ng 漂移）的普适性。\n6. 自引 S. Bugu, arXiv:2602.22174 (2026) [36]（l.1566-1567）：前序 Chernoff 吞吐优化工作为预印本，需核实其存在、内容与本文声称的衔接（l.131-134）。","questions":"1. 能否给出 RWA 驱动截断对耗散性 p2/p3 影响的任何定量界？例如在 transmon-only 加经典场基准中加入与主模型同型的唯象耗散并重复通道归因，或在 RWA 模型中把最近邻驱动算符补上 ⟨4|n̂|1⟩ 项，报告 p2、p3 的变化方向与量级。\n2. 位移参考轨迹按初始态匹配；若改用泄漏后主导能级（如 χ2）匹配的轨迹，p2、p3 变化多少？把 abrupt switch-off 换成有限斜率 ramp-down 后，残留布居与 bare-level 判定是否改变？\n3. 全局分辨率阈值 \\(2.68×10^{-5}\\) 由 Nf 20→40 贡献而 Nf 40→60 骤降约三个量级；生产运行取 Nf=20 的理由是什么？是否检验过 Nf 60→80 以确认 Nf=60 一侧已收敛？\n4. 双通道移除后残余的 p2（1.5%）与 p3（\\(1.6×10^{-4}\\)）来自何处——ring-down 期间未完全绝热返回的相干贡献，还是数值底噪？该残差是否随停止判据 \\(|αref|^{2}<10^{-3}\\) 的取值变化？","basis":"用 read 完整读取全文 1573 行（l.1-1573），含摘要、Sec. I–VIII、附录 A/B 与参考文献；所有关键数字（p2/p3、阈值、比值、误差预算、泵升速率）均见于正文与图注文本。图 1–7 本体不可见（pdftotext 仅余轴标/图例残片，如 l.307-473、l.505-619、l.1007-1108、l.1272-1439），故 Fig. 2(b,c) 逐能级比值的散点分布、Fig. 4(a) 直方图与 Fig. 5 曲线形态只能按图注核对；未运行任何代码，论文未提供代码/数据可用性声明。"}},{"id":"arxiv-2611.06260","no":5,"topics":["纠错码","解码器"],"source":"arXiv","venue":"arXiv:2611.06260 [quant-ph]","published":"2026-11-04","title":"Connection of surface code patches based on entanglement distillation without postselection","title_zh":"基于无后选择纠缠蒸馏的 surface code patch 连接","authors":["Moeto Mishima","Toshihiko Sasaki","Yasunari Suzuki","Koji Azuma","Masato Koashi"],"abstract":"Distributed quantum computing is a promising approach for overcoming the scalability limitations of fault-tolerant quantum computing. Entanglement distillation, a process that extracts higher-fidelity entangled states from noisy ones, plays a key role in distributed quantum computing. However, simple distillation protocols typically rely on postselection, which poses practical challenges for implementation. Here, we propose a scheme for distributed surface-code quantum computing that benefits from entanglement distillation even without postselection. Numerical simulations show that the logical error rates in the proposed scheme are lower than those in the setting without distillation. Additionally, we demonstrate that the logical error rates can be suppressed further by exploiting the asymmetry between spacelike and timelike errors in the surface code. The proposed scheme offers a practical and simple approach to distributed quantum computing with surface codes.","importance":4,"importance_reason":"方案实用且机制新颖（蒸馏成败作为软信息入 MWPM、蒸馏变体比例与综合征轮数 q/r 联合调度），但只在现象学噪声与单一基准任务内验证、缺等配对预算基线，未改变阈值层面的定量认知，维持 importance=4。","summary":"保留 2-to-1 检测蒸馏电路但不做后选择：成败记录作为软信息写入 MWPM 边权，X/Z 蒸馏变体按概率 q 混选，并与综合征轮数 r 联合优化。现象学模拟（每点 \\(10^{7}\\) shots）显示逻辑错误率低于直接用原始 Bell 对，仅链噪时阈值从 15% 升至 18%（p=0），加大 r 可进一步压制类时错误。","problem":"分布式 surface code 需要跨芯片的远程 lattice surgery，其性能受共享 Bell 对质量限制。现有做法要么直接用原始 Bell 对（阈值有限），要么先做纠缠蒸馏：检测型蒸馏（如 2-to-1）必须后选择，失败时需等待重试或结果依赖的路由调度；纠错型蒸馏（如 [[5,1,3]]）无需后选择但需要更多输入对与更深电路。论文要解决的是：能否用最简单的检测型蒸馏、完全不做后选择，仍降低远程手术的逻辑错误率。","method":"保留 2-to-1 蒸馏电路不改，但无论成败都把输出对用于跨缝非局域 CNOT：成功输出条件错误概率更低，失败输出为最大混合态；把每个缝位点每轮的成败记录作为软信息写入 MWPM 边权 \\(w_i=\\log((1-p_i)/p_i)\\)（l.442-447、l.482-487）。X 蒸馏与 Z 蒸馏两变体按概率 q 与 1−q 混选，控制对 X/Z 错误的信息量；再把综合征轮数 r 与 q 联合优化——加大 r 指数压制类时（Z）缝错误（缝上最短类时链长 r 对类空 d，l.426-430），从而允许提高 q。评估任务为跨缝移动逻辑比特（对 X/Z 两类逻辑错误机制均敏感）；现象学噪声下传播后的链错误归结为缝上更高的数据/测量错误率（l.453-475）。","result":"Stim 模拟、每点 \\(10^{7}\\) shots（l.489-490）：对称设置（r=d、q=0.5）下无后选择蒸馏在全部距离（d=3,5,7）上低于用原始 Bell 对，仅链噪（p=0）时阈值从 15% 升至 18%（l.527-531）；p=0.5% 时低失真区 \\(r_opt\\)≈d、失真升高时 \\(r_opt\\) 增大（模拟至 r≤3d，Fig. 9），优化 (q,r) 在 d=5,7、失真约 2% 以上区间带来额外抑制，但几乎不改变阈值（l.636-637）；对称设置中 \\(p_{L,X}≥p_{L,Z}\\) 恒成立（l.533-536）。","contribution":"给出检测型蒸馏不做后选择+成败信息入解码器+蒸馏变体比例与综合征轮数联合调度的最小可行方案：避免后选择的等待与结果依赖路由，每缝位点每轮固定供应 2 对 Bell 对即可维持固定时间表（l.304-307、l.327-333）；把 surface code 类空/类时错误不对称转化为可调参数（q、r）的联合优化目标，为模块化超导平台的链路误差处理提供了介于直接用对与完全纠错蒸馏之间的新工作点。","limitation":"现象学噪声模型且蒸馏电路本身假定理想（局域操作与测量无错误，l.185-187），无链路损耗与非 Bell 对角错误；每缝位点每轮消耗 2 对 Bell 对（翻倍于原始对方案），未与同等配对预算基线比较；阈值仅在 p=0 提取且无置信区间；数值只覆盖移动逻辑比特任务，真实远程手术门与 magic state 未模拟；电路级噪声明确留作未来工作（l.686-689）。","key_numbers":["链噪阈值 15%→18%（p=0）","每点 10^7 shots（Stim）","r 扫描至 3d","每缝位点每轮 2 对 Bell 对","d=3,5,7"],"url":"https://arxiv.org/abs/2611.06260","pdf_url":"https://arxiv.org/pdf/2611.06260v1","doi":"","review":{"verdict":"大修","confidence":"中","correctness":"核心主张有三：(i) Table I 的条件概率结构；(ii) 无后选择蒸馏+软信息解码优于原始 Bell 对（Fig. 6，仅链噪时阈值 15%→18%）；(iii) r 与 q 联合优化的类空/类时机制。关于 (i)：我复核了表格内部一致性——若成功行 X 错误为 \\(ϵ^{2}/Ps\\)（txt 抽取把上标丢失为 ϵ/Ps），则 \\(Ps·(ϵ^{2}/Ps)+(1−Ps)/2=ϵ\\) 与 Total 行吻合；Z 侧 Ps·(ϵ(1−ϵ)/Ps)+(1−Ps)/2=2ϵ(1−ϵ) 亦吻合（l.202-243），故表自洽；但成功行取值依赖具体电路：若成败判定只测 X 型奇偶，条件 Z 错误应为 ϵ 而非 ϵ(1−ϵ)/Ps，后者的成立意味着 Z 错误经电路（Fig. 3a，不可见）影响成败位，需对照原文核实。关于 (ii)：机制清楚——无后选择时平均 X 错误保持 ϵ、平均 Z 错误升至 2ϵ(1−ϵ)（Table I），收益全部来自条件概率进入 MWPM 边权（l.482-487）而非平均保真度改善（作者自认平均保真度更低，l.264-265）；该主张在其噪声模型内由 Stim、每点 \\(10^{7}\\) shots 支持（l.489-490），未发现内部矛盾。关于 (iii)：解码图论证（缝上最短类空/类时逻辑链分别为 d 与 r，l.426-430）正确；Fig. 8 显示 q=1 时 \\(p_{L,Z}\\) 随 r 快降、\\(p_{L,X}\\) 缓升，与存在有限 \\(r_opt\\) 的解释一致，但 p=0 时在 r≤3d 内未见交叉、作者承认 \\(r_opt\\) 可能超出扫描范围（l.574-590）。主要保留：阈值提取方法（尺寸、判据、置信区间）正文未述；引言称远程手术 Bell 对阈值约 10%（l.48-50，引自 [19]）而结果称原始对阈值 15% 与 [19,30] 一致（l.531），两处口径未调和。","weaknesses":"1) 基线不全，比较公平性存疑。蒸馏方案每缝位点每轮消耗 2 对 Bell 对（l.304-307），原始对基线只耗 1 对；论文未做同等配对预算的对照：例如原始对+每轮 2 对（独立双缝或翻倍 r）、后选择 2-to-1 加固定缓冲、[[5,1,3]] 纠错蒸馏。特别是原始对+更大 r 同样压制类时 Z 缝错误，Fig. 10 的原始对基线似乎固定在 r=d；若原始对也在 r=3d 运行，蒸馏的净收益可能显著缩水。Ref. [21] 本身是 distill-or-not 的资源比较，本文却未做等资源对照。 2) 噪声模型理想化。蒸馏电路内局域操作与测量假定理想（l.185-187）；输入为独立等保真度 isotropic 态，无损耗、无相干错误、无存储退化；现象学模型把每轮当作一个时间粒度，掩盖了蒸馏电路深度——真实系统中更深的缝层操作意味着 bulk 空转更久、每轮 bulk 错误累积更多，该效应完全未建模。作者承认电路级噪声留作未来工作（l.686-689），但这正是 practical 主张的要害。 3) 阈值统计薄弱。15%→18% 只在 p=0（无 bulk 噪声）给出（l.527-531）；阈值由小尺寸曲线交叉提取的方法、有限尺寸外推与误差棒均未报告；\\(10^{7}\\) shots 对约 3 个百分点的阈值移动是否足够未做功效分析。优化 (q,r) 在大量参数点上重复使用同一批模拟数据，存在 winner's curse，未见多重比较处理；以 error bars overlap 作为最优点判据（l.597-599）不够严格。 4) 任务与结论之间有距离。数值只覆盖跨缝移动逻辑比特这一特殊任务（l.380-400）；真实远程手术两比特门、跨芯片 magic state 注入、多缝并发均未模拟，只有类比论证（l.359-364）。实时解码要求蒸馏结果在解码前可用，离线解码无碍，在线解码的时延代价未讨论。 5) 软信息利用不完整。MWPM 只按成败调整单边权（l.442-447、l.482-487）；同位点两种蒸馏变体的互补信息（X 蒸馏失败同时意味着该对 X 与 Z 错误概率均为 1/2，Table I failure 行）是否进入互补基解码器未说明；X/Z 两图独立解码丢弃 CSS 关联，也未与 BP/OSD 等更强解码基线比较。作为最小实现可以接受，但报告的增益因此只是该思路的下界，与更强解码器组合的收益未知。 6) 内部口径未调和：引言称远程手术对物理 Bell 对的阈值约 10%（l.48-50，引自 [19]），结果又称原始对阈值 15% 与 [19,30] 一致（l.531）；若为任务/噪声定义差异（isotropic 保真度对逐 Pauli 错误率），正文应说明。","overclaim":"1) 摘要 benefits from entanglement distillation even without postselection 成立，但收益来源应读作条件信息而非更好的对：无后选择输出的平均 X 错误不变（Total=ϵ）、平均 Z 错误升至 2ϵ(1−ϵ)（Table I），平均保真度低于输入（作者自认，l.264-265）；摘要未提 Z 错误上升与配对消耗翻倍这两个代价。 2) Numerical simulations show that the logical error rates ... are lower than those ... without distillation：成立范围是现象学噪声+理想蒸馏电路+移动逻辑比特任务；摘要未加范围限定词。 3) threshold against infidelity ... increases from 15% to 18%（引言 l.106-108）只在 p=0 成立；p=0.5% 时（Fig. 6b）阈值改善未给出数字，引言表述未带 p=0 限定。 4) offers a practical and simple approach：简单成立；practical 依赖理想蒸馏电路、每缝位点每轮 2 对的即时供应率（l.304-307）与软信息可离线使用；引言自己指出当前微波链路错误率距 10% 阈值尚远（l.51-53），方案在当前器件上的可行性未被论证。 5) 引言把贡献定位为打破检测蒸馏须后选择与纠错蒸馏低效的两难（l.73-78），但未与两难两侧的定量代表（后选择+缓冲的等待时间、[[5,1,3]] 的配对数与深度）做数值对比，目前只是在概念层面打破。","citations":"[19] Ramette et al.（npj QI 10, 58, 2024）：缝/bulk 架构与远程手术 Bell 对阈值约 10% 的出处；需核对 10% 的任务与噪声定义，调和与本文 15% 的差异。 [21] Liu et al.（arXiv:2603.06513）：distill-or-not 资源比较；需确认其是否已考虑把蒸馏结果作为软信息入解码器（影响本文新颖性表述），以及其结论与本文工作点的相对位置。 [23,24] Bennett et al. 1996（PRA 54, 3824；PRL 76, 722）：2-to-1 蒸馏协议原始定义；需对照 Fig. 3 电路核实 Table I 推导（尤其 Z 错误是否进入成败判定）。 [25] Gidney（Quantum 6, 786, 2022）：类时逻辑错误机制与 memory 任务低估 Z 错误的论断（l.365-372）依据，需核对。 [38] Schmidt et al.（arXiv:2609.03048）：独立相关工作中的一般框架（Note added，l.695-703）；需核对其是否已覆盖条件概率入匹配解码与 (q,r) 联合优化，以划清增量。 [30] Li & Benjamin 2016：原始对 15% 阈值一致性出处，需核对。 [28] PyMatching 2 与 [29] Stim：标准工具但未给版本号，可复现性要求补充。","questions":"1) Table I 的成功行 X 错误按 Total 行自洽应为 \\(ϵ^{2}/Ps\\)（txt 抽取丢失上标），请确认；其电路（Fig. 3a）的成败判定是否依赖 Z 错误（若只测 X 型奇偶，条件 Z 错误应为 ϵ 而非 ϵ(1−ϵ)/Ps）？解码器是否使用了互补基信息（如 X 蒸馏失败意味着该对 Z 错误概率为 1/2）？ 2) 在同等 Bell 对预算下的定量比较：(a) 原始对且 r=3d；(b) 后选择 2-to-1 加固定深度缓冲；(c) [[5,1,3]] 纠错蒸馏——各自与所提方案的逻辑错误率与时间开销如何？蒸馏电路深度导致的每轮额外 bulk 错误在现象学模型中如何体现？ 3) 阈值 15%/18% 如何提取（哪些 d、何种交叉判据、是否做有限尺寸外推），95% 置信区间是多少？引言的约 10%（[19]）与本文 15% 的差异源于何处？ 4) p=0 时优化曲线在 r≤3d 内未饱和（l.574-590）：能否用 \\(p_{L,X}\\) 随 r 近似线性积累与 \\(p_{L,Z}\\) 指数压制的交叉给出 \\(r_opt\\) 与最优 \\(p_L\\) 的解析估计，并说明高失真区 \\(r_opt\\) 是否超出 3d？","basis":"通读了全文 824 行（l.1-824），含全部正文、结论、Note added 与参考文献表。图 1-10 仅有图注文字，曲线、数据点与误差棒均不可见；Table I 的上标在 txt 中丢失（成功行 X 错误应为 ϵ²/Ps，由 Total 行自洽推得），Fig. 3 的蒸馏电路不可见，故成败判定与 Z 错误的关系无法直接核实。模拟代码未提供链接（正文无 data availability 段），10^7 shots 设置无法独立核验；阈值提取细节（尺寸、判据）未在正文报告。"}},{"id":"arxiv-2611.07017","no":6,"topics":["纠错码","解码器"],"source":"arXiv","venue":"arXiv:2611.07017 [quant-ph]","published":"2026-11-04","title":"Threshold-Free Symmetry-Enriched Topological Quantum Memory","title_zh":"无阈值的对称性富集拓扑量子记忆","authors":["Abhijat Sarma","Ruochen Ma","Cenke Xu"],"abstract":"We show that non-Abelian symmetry enrichment can protect a toric code memory against incoherent electric noise at any bond error probability $p\\in[0,1]$. For a toric code on the honeycomb lattice coupled to $Sp(N)$ rotors, with electric anyons carrying the fundamental representation, we construct an efficient minimum-weight decoder whose logical error probability decays exponentially with system size for $N\\ge40$, a conservative sufficient bound. The same decoder also rules out strong-to-weak spontaneous symmetry breaking in the fundamental channel of $Sp(N)$ under the corresponding local decoherence in two dimensions. The construction extends to other symmetries, including $SU(N)$.","importance":4,"importance_reason":"首次给出对 p∈[0,1] 全区间可解码的对称性富集拓扑记忆的充分条件并把可解码性与 2d Mermin-Wagner 直觉衔接，概念贡献清晰；但模型限定单轮电噪声+理想奇偶读出+三价格子，N=40 处保证衰减率近零且无数值支撑，维持 importance=4。","summary":"honeycomb toric code 每顶点耦合 Sp(N) rotor，电噪声产生携带基础表示的电任意子；顶点 irrep 读出在 N→∞ 完全报数错误边度数。基于自回避行走数与连通常数 \\(\\mu=\\sqrt{2+\\sqrt2}\\) 的 Peierls 界给出：\\(N\\ge40\\) 时最小权解码器对一切 \\(p\\in[0,1]\\) 指数可解码（\\(q_c\\approx0.0068\\)），并排除基本通道的 2D SW-SSB。","problem":"拓扑量子记忆在非相干噪声超过阈值后不可解码：噪声无相地增殖任意子，对应密度矩阵 ket-bra 系综中任意子束缚态的凝聚，并与 2d 经典统计力学模型的有限温相变及强-弱自发对称性破缺（SW-SSB）相连。已知对称性富集可提高阈值但无人给出对全部噪声强度 p∈[0,1] 可解码的构造。论文要解决：非阿贝尔连续对称性（大 N 的 Sp(N)/SU(N)）能否借助 Mermin-Wagner 型机制完全禁止任意子增殖，从而消除解码阈值。","method":"honeycomb 格子上的 toric code 每个顶点耦合 Sp(N) rotor；电噪声以概率 p 独立激活每条边，Kraus 算符在两端产生携带基础表示 F 的电任意子并保持强 Sp(N) 对称（Eq. 2-4，l.95-148）。综合征为顶点 irrep 测量：N→∞ 时 irrep 完全确定顶点错误边度数（perfect degree heralding，l.199-206）；有限 N 时仅发生配对隐藏（2→0、3→1，概率 \\(O(1/N^{2})\\)），度数奇偶始终精确（l.351-360）。解码取与测得综合征相容的最小权边集；对真值与猜测的分歧环 C=E⊕E′ 做 Peierls 计数：环必交替 R/A 边（l.218-229），自回避行走数以连通常数 μ=√(2+√2)<2 增长（l.230-236）；有限 N 时最小权条件保证至少半数中断为真实隐藏对（Eq. 10），再以附录 A 的 q(N) 界合拢。同一最小权解码器推广为荷解码假设检验，经保真度单调性排除基本通道 SW-SSB（Sec. V）。","result":"失败概率 \\(P_{fail}\\le e^{o(L)}[\\mu(1+\\sqrt q)/2]^{L}\\)（Eq. 15），当 \\(q(N)<q_c=(2/\\mu-1)^{2}\\approx0.0068\\) 时对一切 \\(p\\in[0,1]\\) 指数衰减（Eq. 16-18）；附录 A 给 \\(q(N)=3N^{1/3}/(N(N-2))\\)（含闭 RR-环增强 \\((N^{2})^{m/6}\\) 与投影子重叠 \\((1-2/N)^{-m}\\) 修正），得偶数 \\(N\\ge40\\) 充分，SU(N) 相应界为 \\(N\\ge31\\)。荷解码错误 \\(P_e(r)\\) 以同一基率指数衰减（Eq. 22），从而对一切 p 排除基本通道的 2D SW-SSB；中心中性探针通道未决（l.613-617）。","contribution":"给出首个对全噪声强度区间 p∈[0,1] 可解码的对称性富集拓扑记忆构造，把 MW 定理禁止 2d 有限温非阿贝尔连续对称破缺的直觉落成可验证的解码-计数证明，并以蜂窝格子连通常数 μ<2 这一严格结果为定量支点；荷解码任务与保真度关联函数的联接把 TQM 可解码性与 SW-SSB 判据双向打通，构造可推广到 SU(N) 与 Schwinger 玻色/部分子表述，为大 N 自旋液体平台的噪声稳定性研究提供理论模板。","limitation":"只处理单轮施加的电学非相干噪声与一次性理想 irrep 读出（仅要求奇偶精确，l.478-479），多轮动力学记忆、读出错误、磁通型噪声与电路级噪声均未覆盖；限于三价 honeycomb 与周期边界；最小权解码器的多项式算法未给出构造与复杂度；N=40 处保证的衰减基率约 0.9998，实用尺寸上无约束力；全文无数值模拟，真实 Nc 未知。","key_numbers":["Nc ≤ 40（Sp(N)，偶）","Nc ≤ 31（SU(N)）","qc ≈ 0.0068","μ = √(2+√2) ≈ 1.848","q(40) ≈ 0.00675（对 qc 余量 0.57%）"],"url":"https://arxiv.org/abs/2611.07017","pdf_url":"https://arxiv.org/pdf/2611.07017v1","doi":"","review":{"verdict":"大修","confidence":"中高","correctness":"核心定理链我逐段复核：(1) N=∞ 完美度数报数下的 Peierls 界（Eq. 7-9）：真值与猜测在每顶点度数相同，故分歧环 C=E⊕E′ 交替 R/A 边，固定长 ℓ 环的交替概率 \\(2[p(1−p)]^{(ℓ/2)}≤2^{(1−ℓ)}\\)；自回避行走数以连通常数 μ=√(2+√2)≈1.84776<2 增长（引 [35]，常数正确），得 \\(P_fail≤e^{o(L)}[μ\\)√\\((p(1−p))]^{L}\\)，对一切 p 衰减——算术无误。(2) 有限 N：度数奇偶精确（隐藏对只成对隐藏），C 仍为闭环；最小权解码给出 \\(n_R≥n_A\\)（E 自身相容故 |E′|≤|E|），故至少半数中断为 RR；Eq. (10) 的等式按其自身计数规则差因子 2（见 weaknesses 6），但不影响不等号方向。(3) Eq. (12)-(14)：\\(q^{nRR}=q^{(t/2)}(\\)√\\(q)^{(nR−nA)}\\) 与 \\([p(1−p)]^{nA}\\) (p√\\(q)^{(nR−nA)}\\) 的分解正确，条件 q≤1/4 由 q(N)<qc≈0.0068 满足，界对一切 p 一致。(4) 附录 A：基线 \\((3/N^{2})^{m}\\)、闭 RR-环增强上限 \\((N^{2})^{(m/6)}\\)（蜂窝围长 6 保证每个闭组元至少 6 个选定顶点）、三对单态子空间 Gram 矩阵特征值 1−2/N（单重）与 1+1/N（二重）——我验算正确——给出 \\((1−2/N)^{(−m)}\\)；合成 \\(q(N)=3N^{(1/3)}/(N(N−2))\\)。代入 qc 解得偶数 N≥40、SU(N)（\\(q=2N^{(1/3)}/(N(N−1))\\)）解得 N≥31：数值复核成立（q(40)≈0.006750 对 qc≈0.006788，余量 0.57%；q(38)≈0.00737 已超；\\(q_SU(31)\\)≈0.006756）。(5) SW-SSB 部分：保真度数据处理不等式与 F≤2√Pe 链条成立（中间等式排版有误，见 weaknesses 6），\\(P_e(r)\\) 以同一基率衰减（Eq. 22），排除基本通道 SW-SSB 的结论在其定义域内成立。整体：论证自洽、多处边界取得保守、未发现致命漏洞；但最小权解码器的多项式构造缺失、附录 A 关键乘积步压缩成一句话（见 weaknesses 1/4），是两处需要补强的实质缺口。","weaknesses":"1) 解码器效率断言无构造。摘要与正文以 efficient minimum-weight decoder 为核心卖点，但全文没有算法：N=∞ 时度数完全已知、任何相容 E′ 权重相同（l.167-171），最小权条件平凡；有限 N 时最小化 |E′| 等价于最小化隐藏对数（l.361-364），这是带逐点允许度数集合（如测得单态允许 {0,2}、测得基础表示允许 {1,3}）的度约束子图问题，虽可归入 b-匹配/f-因子一类多项式框架，但论文未写出归约、未引文献、未给对 L×L 格子的复杂度。以可高效解码为贡献的理论工作必须补齐。 2) N=40 处保证的衰减率几乎为零。qc 的取得依赖 μ<2 的微小余量：q=q(40) 时基率 μ(1+√q)/2≈0.9998，衰减长度约 \\(5×10^{3}\\) 个格点，\\(e^{o(L)}\\) 前因子在该尺度完全主导。定理保证渐近指数衰减，但在任何可想象的记忆尺寸上没有实用约束力；作者称真实 Nc 可能远小于 40 并推迟数值工作（l.473-474、l.598-599），但摘要的表述未传达 N=40 处保证趋近于零的事实。 3) 模型范围窄而 memory 语境宽：只处理单轮施加的电学非相干噪声（Eq. 3）加一次性理想 irrep 读出（仅要求奇偶精确，l.478-479）；多轮连续噪声与读出的动力学版本、读出错误、磁通型（magnetic）噪声、电路级噪声均未涉及，正文仅在 l.478-479 与讨论段一句带过；限于三价 honeycomb 与周期边界（度数 ≤3 的隐藏对分类在此完备），方格格子度 4 顶点的融合分类与开边界未讨论。 4) 附录 A 的关键步骤被压缩：\\(3^{m}\\) 项展开中每一项的联合配对投影概率由 Eq. (A2) 界定，RR-环增强只授予闭回路（六边形最短，c≤m/6），开链/树形选对结构按乘积 \\((1/N^{2})^{\\#\\mathrm{pairs}}\\) 处理，其正当性仅由 required local projectors act at distinct vertices 一句支撑（l.843-845）；鉴于 N=40 处 qc 余量仅 0.57%，任何被遗漏的 O(1) 级关联都会移动 Nc，该步需要显式的 Haar 积分或指标收缩论证。 5) 与先行工作的增量划界不足：对 [16]（同组前作，通道原型与中心有序化解码层级）与 [33]（受 MW 启发的 charge-informed 解码）总共只有两句对比（l.53-56），未说明为何其框架不能取大 N 极限得到同样的 threshold-free 结论。 6) 成稿瑕疵：Eq. (10) 按文中每 RR 顶点比 RA 多一条红边的计数应为 nRR−nAA=(nR−nA)/2（差因子 2，不影响方向）；l.534-537 的保真度等式缺一项和式（应为 √((1−a)b)+√(a(1−b))，终界 2√Pe 不受影响）；Eq. (1) 附近 rotor 态记号排版残缺（l.74-116）。","overclaim":"1) 摘要 protect a toric code memory against incoherent electric noise at any bond error probability p∈[0,1]：成立但隐含三个前提——单轮噪声、irrep 奇偶读出精确、三价 honeycomb 格子——均未在摘要出现；memory 一词暗示的多轮动态存续场景未被证明。 2) we construct an efficient minimum-weight decoder：efficient 只有一句多项式时间断言（l.167-168），无算法构造、无文献引用、无复杂度标度；补足前该形容词应弱化或给出支撑。 3) N≥40, a conservative sufficient bound：conservative 指对真实 Nc 的上界保守，但在 N=40 处保证的衰减基率约 0.9998（衰减长度约 \\(5×10^{3}\\)），实用尺寸上无约束力；摘要未提示这一点，易被读成 N=40 即可实用。 4) The same decoder also rules out SW-SSB in the fundamental channel：范围限定（基本通道、2d、该噪声）在摘要中有，表述克制；正文 l.613-617 亦承认中心中性探针未决，此项不算夸大，列出以资对照。 5) The construction extends to other symmetries, including SU(N)：扩展成立但仅有附录 A 末尾数行（l.985-988）与有向通道的一段讨论（l.149-183），与摘要的并列分量不相称。","citations":"[35] Duminil-Copin & Smirnov（Ann. Math. 175, 1653, 2012）：蜂窝格子连通常数 μ=√(2+√2) 是整个定量界的支点；原文给出的是连通常数恒等式与触接概率，直接用作自回避行走计数上界需引用其推论形式或补自筛论证，应核对。 [18] Lessa et al.（PRX Quantum 6, 010344, 2025）：SW-SSB 的保真度关联函数判据；l.538-540 称本文荷解码保真度 precisely 该判据，需对定义核对。 [11] Jing et al.（PRL 136, 120405, 2026）与 [12] Sala et al.（PRX 15, 031002, 2025）：intrinsic heralding 概念来源；[16] Sala et al.（arXiv:2610.06692）：本噪声通道的原型（l.128-129 称本文为大 N 推广），需核对 Kraus 与 irrep 综合征定义的对应。 [33] Temkin et al.（arXiv:2512.22119）与 [34] He & Thorngren（arXiv:2610.37791）：对称富集 toric code 解码阈值的先行工作；需确认其框架不能经大 N 极限直接得到本文结论（l.53-56 的对比过简）。 [1] Dennis et al. 2002：可解码性定义与随机键 Ising 映射基准；需核对本文 decodable 判据（最小权解码器失败概率趋于零）与 [1] 的一致性。 [43,44] Wen 1991、Read-Sachdev 1991：大 N 自旋液体实现背景，存在性核对即可。","questions":"1) 最小权解码器的多项式算法：能否写出有限 N 情形（每顶点允许度数集合如 {0,2}/{1,3}，目标最小化隐藏对数）到 b-匹配/f-因子的显式归约并给出复杂度？N=∞ 情形（度数已知、权重恒等）是否只需 f-因子存在性？ 2) N=40（及 SU(N) 的 31）处定理保证的衰减基率 μ(1+√q)/2≈0.9998 意味着衰减长度约 \\(5×10^{3}\\)：能否对 N=40/60/100 给出基率表，或对小尺寸做数值估计以支撑 conservative（真实 Nc 远小于 40）的说法？ 3) 附录 A 把 \\((N^{2})^{(m/6)}\\) 的 RR-环增强只授予闭回路，而 \\(3^{m}\\) 项展开中开链/树形选对结构的联合投影概率按乘积处理，其正当性仅由 required local projectors act at distinct vertices 一句支撑（l.843-845）：能否给出 Haar 积分/指标收缩层面的论证，说明开放结构没有 O(1) 级的额外关联？考虑到 N=40 处 qc 余量仅 0.57%，此点直接决定 Nc 的数值。 4) 动力学版本：若 irrep 读出逐轮重复、每轮重新注入电噪声（读出只保证奇偶精确），可解码性是否逐轮保持？磁通型噪声（不产生顶点电荷）在何种强度下恢复有限阈值？","basis":"通读了全文 990 行（l.1-990），含正文 Sec. I-VI 与附录 A（l.750-988）。图 1-3 仅有图注与内嵌文字标签（如 Fig. 3 的顶点编号、m=14、c=2），图形不可见；Eq. (1)-(2) 的 rotor 态定义在 txt 中排版残缺（l.74-116），我按上下文重构理解。本文无任何数值数据可看。我对关键算术做了独立复核：qc=(2/μ−1)²≈0.006788、q(40)≈0.006750（余量 0.57%）、q(38)≈0.00737、q_SU(31)≈0.006756，均与文中 Nc≤40/Nc≤31 一致；附录 A 的 Gram 矩阵特征值（1−2/N 与 1+1/N）亦验算无误。"}},{"id":"arxiv-2611.08744","no":7,"topics":["纠错码"],"source":"arXiv","venue":"arXiv:2611.08744 [quant-ph]","published":"2026-11-05","title":"Random encoders and expurgation improve 1,873 entries of the Grassl qubit code tables","title_zh":"随机编码器与 expurgation 改进 Grassl 量子码表 1873 项","authors":["Marin Girard"],"abstract":"I report 192 explicit binary stabilizer codes $[[n,k,d]]$ with $53\\le n\\le 254$ and $5\\le d\\le 13$ whose minimum distance exceeds the lower bound listed in Grassl's code tables at the same $(n,k)$: 161 codes by one and 31 by two. Through the standard propagation rules they raise 1,873 entries of the table. For 190 of the codes, a random Clifford encoder is followed by expurgation: every logical operator of weight below the target distance is enumerated, and a few logical operators are promoted to stabilizers so that each low-weight one anticommutes with at least one of them. The other two are obtained by puncturing a code from the table and repairing it in the same way. All 192 distances are exact: the lower bound is certified by exhaustive meet-in-the-middle enumeration of up to $4\\times10^{13}$ Pauli operators, and the upper bound by an explicit logical operator of weight $d$. A first-moment count explains the results. Expurgated random codes have about eight more logical qubits than a typical random code of the same length and distance, so they beat the table wherever its best known codes are no better than random. The largest gains, up to nine logical qubits, are at $d\\ge9$ and $n\\gtrsim170$, where the table often gives a lower bound without an explicit code. The same count predicts improvements at 619 further pairs $(n,d)$. The search was run by AI agents. The codes, their certificates and an independent checker are public.","importance":4,"importance_reason":"192 个经穷举认证的 [[n,k,d]] 码把码表下界推进 1,873 项（含 485 个原无显式码的条目），是码表层面的实质数据更新，但方法为稠密稳定子码+超算穷举、无概念新框架，故定 4 而非 5。","summary":"以 16–20 层随机 Clifford 编码器加 expurgation（把低重量逻辑算符提升为稳定子）构造 192 个 [[n,k,d]] 码（53≤n≤254，5≤d≤13）：161 个超表值 +1、31 个 +2，经传播规则抬高 1,873 个表条目；距离以 meet-in-the-middle 穷举（最多 \\(4.2×10^{13}\\) 个 Pauli）认证为精确值；一阶矩计数预言另有 619 对 (n,d) 可改进；搜索由 AI agent 在 Aurora 上执行，码与证书公开。","problem":"Grassl 码表在 n≥100 处超过一半条目（15,011/27,946，k≥1）只有下界而无显式构造，且现有下界多来自 BCH/循环类码；本文要检验：在循环类码不在场的参数区间，随机稳定子码加 expurgation 能否系统性超过表中下界，并以可复核的穷举证书给出精确距离，同时给出解释与外推。","method":"父码由 16–20 层随机两比特 Clifford 门（作用于 K 个逻辑比特与 n−K 个 |0⟩ ancilla）生成，实测 683 个父码的低重量逻辑类数与随机码期望 Eq (2) 偏差约 1%；expurgation 固定目标距离 D，精确枚举所有重量 <D 的逻辑类 W，找 q 维迷向子空间 U⊆L 使 \\(W∩U^{\\perp}⊆U\\)（Eq 1），把 U 的生成元并入稳定子得 [[n,K−q,D]]；另 2 个码由表码打孔后同法修复。距离下界用 meet-in-the-middle：重量 ≤D−1 的 Pauli 分解为不交支撑的 wt(B)≤b=⌊(D−1)/2⌋ 与 wt(A)≤a=D−1−b 两半，同 syndrome 对的乘积精确核验（枚举量与 Eq 11 封闭式对账）；上界由显式重量 d 逻辑算符给出。一阶矩计数（Eq 5–10）解释可达超额并校准预测器。","result":"Table I：192 个码覆盖 d=5–13，d=9 处 73 个；在自身 (n,k) 处 161 个超表 +1、31 个 +2；固定 (n,d) 的最大增益 +9（[[180,131,9]]、[[213,156,10]]、[[212,149,11]]）与 +8（[[104,46,12]]、[[112,48,13]]）；传播后 1,873 项被抬高（1,748 项 +1、125 项 +2），其中 485 项原无显式码；在 70 个表值无构造的条目上平均增益 8.2 个逻辑比特（有构造处 3.5）；预测器精确命中 147/192、±1 命中 178/192，预言 619 对可继续改进（其中 192 对增益 6–9，178 对所在表条目无显式码）。","contribution":"给 qubit 稳定子码表提供一批带完整穷举证书的新下界，尤其在 d≥9、n≳170 表中只有下界无构造的长条带上把参数推到随机码水平之上 6–9 个逻辑比特；码、证书与独立校验器公开，可被码表维护者直接吸收；一阶矩计数给出 expurgated random codes 比同参数随机码约多 8 个逻辑比特的定量解释，并划清该方法与循环类码各自占优的区域；AI-agent 编排大规模搜索+穷举认证的工作流是可复用范例。","limitation":"码为稠密生成元、非 LDPC，无容错/解码价值；认证成本随 \\(n^{d/2}\\) 增长，n≈250、d≈13 已需超算（[[124,58,13]] 需约 26 TB 存储）；预测器由早期运行校准两个偏移量，存在过拟合风险。","key_numbers":["192 个新码（161 个 +1、31 个 +2），传播抬高 1,873 项表条目","最大增益 +9：[[180,131,9]]（表值 k=122）、[[213,156,10]]、[[212,149,11]]","穷举认证最多 4.2×10^13 个 Pauli（[[188,121,12]]）；[[124,58,13]] 存储约 26 TB","90% 新码超额 X∈[6.1,8.9]，中位 7.7","预测另有 619 对 (n,d) 可改进（192 对增益 6–9）"],"url":"https://arxiv.org/abs/2611.08744","pdf_url":"https://arxiv.org/pdf/2611.08744v1","doi":"","review":{"verdict":"接受","confidence":"中高","correctness":"核心主张（192 个码的距离为精确值并改进表下界）的文内证据充分。距离下界的 meet-in-the-middle 论证正确：wt≤D−1 的 P 分解为不交支撑的 B（wt≤b=⌊(D−1)/2⌋）与 A（wt≤a=D−1−b），P∈N(S) 当且仅当 A、B 同 syndrome（l.430-437）；A 侧枚举 wt≤b 与恰为 a（a=b+1 时）确实覆盖所有 w≤a+b 的分裂（b<w≤2b 时取 |B|=w−b 得 |A|=b；w=2b+1 时 |A|=a），无遗漏；每次运行的枚举计数与 Eq (11) 封闭式对账（l.625-627）。上界由显式重量 d 逻辑算符加线性代数核验（l.426-429）。认证分层：搜索期两个 certifier 认证 190 个，无共享代码的独立实现认证 32 个（含剩余 2 个），30 个码有双份证书（l.628-637）。expurgation 的代数（Eq 1：d(S′)≥D ⟺ W∩\\(U^{\\perp}\\)⊆U）正确；Table I 行列加和（192=161+31；各 d 行）自洽。预测 Eq (8)–(10) 四步推导自洽，[[180,131,9]] 的 X≲10.3 对 8.1 的落差被诚实归因于一阶矩乐观与搜索不完全（l.275-287）。保留意见：父码随机性仅有 683 样本约 1% 的经验支持（l.74-78），无混合充分性的理论论证；全部计算本审稿无法重放，最终正确性依赖公开仓库的证书与 run 记录。","weaknesses":"1. 独立复核覆盖低：无共享代码的独立 certifier 只复核了 32/192 个码（l.633-636），d≥10 的 73 个码中大部分仅有搜索期实现自身的证书；Re-checking … needs a cluster（l.636-638）未给出成本量化。对以穷举认证为卖点的论文，独立复核比例与重认证成本应明示。 2. 预测器校准与过拟合风险：两个偏移量（对 q 取最小满足 log₂N≥0 后 +1、对 k 取 max 后 −1）固定于 early runs（l.291-295），147/192 精确命中是 in-sample 统计；仅 3 个前瞻预测点（l.296-301），619 对外推应标注为启发式。 3. 表对比的时间敏感与新颖性边界：一切比较基于 2026-11-04 的 codetables.de 快照（l.421、l.688），复现 1,873 计数需同一快照；全文引用仅 8 条，未对照任何先前以随机/计算搜索改进量子码表的工作，新颖性声明缺少参照系。 4. 1,873 项构成未分解：只给出 485 项原无显式码（l.418-421），未统计其余 1,388 项中有多少是循环类码已有构造的条目；两类改进（存在性界→显式码 vs +1 量变）的信息增量不同，摘要笼统并列易夸大影响面。 5. 与容错无关：作者自认 not low-density parity-check codes; their interest lies in their parameters（l.46-47），稠密生成元对解码/阈值方向无直接用途，该定位应更前置以免误读。 6. AI-agent 工作流可追溯性：Sec VII 描述 agent 写搜索并管理 Aurora 作业，但父码生成种子、搜索轨迹与失败尝试是否入库未说明（仓库仅列码、证书、比较与检查程序，l.709-719）；none did better than random parents 等否定性结论作者亦自认只是实现层面结果（l.683-685）。 7. 理论与校准不可分：Eq (7) 的子空间计数带 \\(2^{O(q)}\\) 因子、Eq (2) 的 \\(2^{-(n-k)}\\) 对非独立生成元是近似；预测器两个经验偏移恰好吸收这类系统误差，使 Eq (8)–(10) 的解释力与拟合自由度在证据上难以区分。","overclaim":"1. 标题与摘要 improve 1,873 entries：准确，但其中 485 项是从仅存在性下界到显式码的质变，其余多为 +1 量变，摘要与引言未区分两类改进的分量。 2. Expurgated random codes have about eight more logical qubits than a typical random code（l.21-23）：这是 192 个成功码的描述统计（90% 的 X∈[6.1,8.9]，中位 7.7，l.287-290），不是被证明的普适性质；Eq (10) 只给可达超额的上界，have about eight more 措辞过强。 3. The same count predicts improvements at 619 further pairs：基于带两个经验偏移的一阶矩预测器，且预测增益 6–9 的 192 对中 178 对恰是表上无显式码的最弱区域（l.322-325），应标注启发式与目标区域偏置。 4. All 192 distances are exact：文内证据支持（穷举下界+显式上界+计数对账），但外部可验证性依赖仓库 run 记录而非可独立重放的证明对象，宜附注独立复核比例（32/192）。","citations":"[1] Grassl codetables.de：全部比较的基线，须核对 2026-11-04 快照与线上当前版本的差异，以及 15,011/27,946、485/1,873 等计数是否有可复现脚本。 [3] Calderbank–Rains–Shor–Sloane（IEEE Trans. Inf. Theory 44, 1369，1998）：传播规则与量子 expurgation 作为标准构造的出处（l.81-82），需核对其中把逻辑算符提升为稳定子的原始表述。 [4] Ekert–Macchiavello（PRL 77, 2585，1996）：两处被引作量子 GV 界（l.42、l.170），需核对其中非简并随机稳定子码 GV 论述的确切形式。 [6,7] Cao–Gullans–Lackey–Wang（PRX Quantum 5, 030313，2024）与 Cao–Lackey（PRX Quantum 3, 020332，2022）：Sec VI 引以对比张量网络码的距离计算（代价随割尺寸而非 n 指数，l.656-657），需核对该复杂度表述及与 Random encoders have no small cuts 对比的公允性。 [8] GitHub 仓库 qubit-stabilizer-codes-2026：核心证据所在，应核对每码 run 记录是否含 Eq (11) 对账与 certifier 标识。 另：应补检索先前以随机或计算搜索改进量子码表的工作，以划清新颖性。","questions":"1. 独立 certifier 复核 32/192；请给出 d≥10 的 73 个码逐个重认证的成本估计（节点时/内存/墙钟），并说明是否计划对至少 5–10 个发布第三方可复核的证书哈希或重放脚本。 2. 预测器两个偏移量在哪些 early runs 上固定？去掉偏移后 192 码的命中统计与 619 对预测如何变化？能否做留一法验证？ 3. 1,873 项被抬高条目中，原为 lower bound only 与已有显式构造的各占多少？是否已提交 codetables.de 维护者、结果如何？ 4. 683 个父码与随机码期望约 1% 一致的具体统计量（逐码最大偏差还是均值）是什么？16–20 层随机 Clifford 在 n≈250 时每比特期望参与门次数不足 1，混合充分性的理论或经验依据是什么？","basis":"全文 745 行一次读毕（1–97 摘要与引言、98–330 构造与一阶矩计数/预测器、330–455 表 I 与结果、424–645 距离认证与图 1 残片、645–745 AI 角色/其他尝试/数据可用性/参考文献）。图 1 仅存文字残片（轴刻度、图例），曲线本身不可见；GitHub 仓库 [8] 与 Aurora 运行记录未随文提供，本审稿无法重放任何距离认证；无未读章节。"}},{"id":"arxiv-2611.06139","no":8,"topics":["编译与验证"],"source":"arXiv","venue":"arXiv:2611.06139 [quant-ph]","published":"2026-11-04","title":"Pauli Gadget Synthesis for Gatesets with Arbitrary Even Arity Clifford Gates","title_zh":"面向含任意偶数元 Clifford 门门集的 Pauli gadget 合成","authors":["Leo Becker","Arianne Meijer - van de Griend"],"abstract":"We propose an algorithm that can synthesize circuits to gate sets consisting of a 2n-arity Clifford gate and arbitrary single qubit rotations. To do this, we represent the circuit as a sequence of Pauli gadgets and jointly synthesize them by placing the multi-qubit Clifford in the synthesized circuit and pushing its adjoint through the remaining gadgets such that some qubits are disconnected from some gadgets. The pushed gadgets are collected in a Clifford tableau, which is decomposed afterwards. With the help of our algorithm we run experiments where we synthesize circuits to varying sizes of target multi-qubit gates. These experiments indicate that increases in gate size can lead to smaller output circuits, and that different connectivity constraints have meaningful differences in how higher arity gates effect the circuit sized.","importance":3,"importance_reason":"首次把 Pauli-gadget 推移+tableau 再合成的编译范式适配到『只有一种偶数元 Clifford 门+单比特旋转』的非标准门集并处理超图连接约束，是编译/验证组做高元门资源评估的直接工具；但因属未经验证的原型且无基线，保持指定重要级 3。","summary":"将线路表示为 Pauli gadget 序列，用原生 \\(e^{\\pm i\\pi/4 O}\\) 型偶数元 Clifford 门把 gadget 约化为单比特旋转，Clifford 收进 tableau 再分解；门数公式 \\(k=\\lceil(l-n)/(n-1)\\rceil+p\\)。实验（arity 2–20、100 条随机线路）显示提高门元数可减少多比特门数：全连接下 \\(HCl_JW_sto3g\\) 由 2-Q 5186 门降至 10-Q 864 门，最优元数依赖连接约束。","problem":"现有编译器与合成算法默认硬件只提供至多两比特门，而超导、离子阱等平台可能原生实现更高元（2n 元）Clifford 门；目前缺乏针对『单一固定元数偶数元 Clifford 门+任意单比特旋转』这一门集的线路合成方法，也无法评估提高原生门元数对输出线路规模的真实收益，导致新型硬件被现有编译软件不公平地低估。","method":"把目标线路写成（可经 Trotter 重排的）Pauli gadget 无序序列存入 Storage；对每个 gadget 用若干原生元数 n 的 \\(e^{\\pm i\\pi/4 O}\\) 门逐步把其 Pauli 串约化为单比特 gadget——每步恰好改变奇数量 arity（奇偶性论证，l.266-283），由此得门数公式；推过剩余 gadget 的 Clifford 收进末端 Clifford tableau，之后按行求解分解（剩余 2..n−1 个未解 qubit 时改用附录 B 穷举搜索出的四类固定序列）；连接约束用超图的 Explosion 图加（近似）Steiner 树逐叶处理（3.3 节）。","result":"算法在 arity 2–20、1–700 个 gadget、最多 100 qubit 的随机线路（100 次平均）及 29 个分子 UCCSD 数据（单次运行）上运行。全连接与线性连接下 2→4 元门门数骤降、之后收益递减；方格连接的拐点在 4→6 元；Tableau 分解门数在输入增大后趋于常数。Table 1 全连接中 \\(HCl_JW_sto3g\\) 为 2-Q 5186 / 4-Q 2113 / 6-Q 1426 / 10-Q 864 / 20-Q 1109（20 元反而回升，非单调）。未与任何外部基线比较。","contribution":"为『高元 Clifford 门+单比特旋转』门集给出首个系统性的 Pauli-gadget 合成算法与可复用的连接约束处理（Explosion 图+Steiner 树），证明 odd-arity 原生门原则上不足以约化 even-arity gadget（3.1 节），并用量化实验提示『最优原生门元数依赖连接拓扑』；对门集—硬件协同设计与高元门芯片的资源估算提供了起点和开源实现。","limitation":"假设原生非 Clifford 门只有单比特门、多比特门同为一一种元数且形为 \\(e^{\\pm i\\pi/4 O}\\)；算法未做门数/运行时间优化；输出线路未做任何正确性验证；分子数据为单次运行且含 Steiner 树随机性；总 qubit 数接近 n 的边界情形未论证。","key_numbers":["arity 2–20（原生门元数）","1–700 gadgets、≤100 qubit、100 次平均","k=ceil((l−n)/(n−1))+p","HCl_JW_sto3g 全连接 5186→864→1109（2-Q/10-Q/20-Q）","29 个分子 × {2,4,6,10,20} 元"],"url":"https://arxiv.org/abs/2611.06139","pdf_url":"https://arxiv.org/pdf/2611.06139v1","doi":"","review":{"verdict":"大修","confidence":"中高","correctness":"核心机制成立但证明与验证有实质缺口。(1) 推移规则结论正确而证明有错：anticommuting 情形实为标准 Clifford 共轭 \\(Ue^{i\\theta P}U^{\\dagger}=e^{i\\theta\\, UPU^{\\dagger}}\\)（共轭作用在指数上），而附录 A 的 Eq 13（l.709、l.724）把它写成 \\(e^{i\\theta}\\exp(\\mp i\\pi/4O)P\\exp(\\pm i\\pi/4O)\\)，即『标量 × 被共轭算符』，一般不成立；且被推 gadget 记作 \\(e^{\\pm i\\theta OP}\\) 时 OP 为反厄米算符积，按字面非幺正（取 O=X、P=Z 直接矩阵验算得 \\(e^{\\theta Y}\\) 型实指数因子）。规则在『OP 取逐位乘积 Pauli 串、\\(\\pm i\\) 相位并入正负号』的约定下可救，但论文未建立该约定，Eq 5 的现行证明不成立。(2) 门数公式自洽：每次推移改变奇数量 arity（a 奇、n 偶 ⇒ 改变量 c−b 为奇，l.266-283），k 与 l 异奇偶的要求正确，n=4 的四个例子（8→5→4→1 等，l.345-349）复核无误，且 arity-2 gadget 单步 2→1 确不可达（受 O 元数恰为 n 约束）。(3) tableau 主循环（多于 n 个 qubit 时逐位消去，l.450-491）合理；但收尾 2..n−1 位的四类序列（附录 B）只有排版破碎的逐例演示，未证明当 uninvolved/dirty qubit 不足（总 qubit 数接近 n）时仍完备，全文也没有『输出幺正=输入幺正』的定理或数值验证。(4) 实验数字内部一致：Table 1 中 \\(HCl_JW_sto3g\\) 全连接 5186→2113→1426→864→1109，与正文『2→4 骤降、之后递减』相符，且 20-Q 回升与正文只讲 diminishing returns 的表述有张力；线性表 \\(NH_BK\\) 4557→863 同趋势。图 2–4 的 3D 曲线在 txt 中不可见，sweetspot 等定量结论只能采信正文。","weaknesses":"1. 输出正确性零验证：全文没有对合成线路做幺正等价检验、测试集或任何形式验证（第 3、4 节与附录均无）。对一个自述目标是『先做出来』（l.516-517）的原型算法，至少应在随机与分子实例上报告 \\(U_{synth}\\) 与输入幺正的偏差；附录 B 四类收尾序列目前只是逐例演示而非证明全部覆盖。2. 无外部基线，核心实验主张不公允：『更大 arity → 更小线路』仅在算法自身不同 arity 之间比较；没有与 CNOT 基合成器（如其直接基础 PauliSteinerGraySynth [6]，实验分子集即取自它，l.1319-1321）在同一数据上的输出对比，也没有 Paulihedral [7] 等基线。结论只能读作『本算法 n=4 优于本算法 n=2』，而摘要与引言（l.44-47）把它表述为门元数本身的收益。3. 度量忽略 arity 代价：只统计多比特门个数，把 2 元门与 20 元门按 1:1 计数（l.528-532）；无按错误率（如 \\(\\epsilon^{\\lceil n/2\\rceil}\\)）、时长或面积的加权模型，也无单比特门数；Table 1 自身显示 20-Q 门数可高于 10-Q（\\(HCl_JW\\)：864 vs 1109），说明『元数越大越好』在其自家数据上即不成立，但正文仅以 diminishing returns 带过。4. 附录 A 证明错误（Eq 13，l.709/l.724）：指数共轭被写成标量乘算符共轭，被推 gadget 记号 \\(e^{\\pm i\\theta OP}\\) 在 OP 反厄米时非幺正；这是第 3.1 节全部 arity 论证的入口，按现行文本该推导不成立。5. 完备性边界未论证：l.489-491 的消去条件（『more than n qubits left』）与 l.491-502 的收尾四类序列衔接含糊；总 qubit 数为 n 或 n+1、可用 u/d qubit 不足时四类序列是否总有解未证明；Steiner 树用『approximate』但近似算法与质量未说明（l.404、l.1322-1324）。6. 复杂度/可扩展性分析缺失：无算法运行时间分析（Steiner 树计算、推移次数、tableau 分解耗时均未报告）；贪心选 gadget 的次序规则未定义（l.338-340 只说可以用 arity），影响可复现性与结果稳定性。7. 实验报告不完整：随机线路的 qubit 总数未明确（l.518-521 仅说 gadget 作用于 1–100 qubits，语义含糊）；分子实验为单次运行且作者自认有随机性（l.1322-1324）却无方差或多重运行；深度结果在附录图中不可见。8. 编辑问题：正文 l.539 称深度图在附录 C，但实际两个附录都标 Appendix D（l.1307、l.1319）；negligable（l.100）、expection（l.222）等笔误；图 2–4 为定性 3D 图，无数值表对应。","overclaim":"1. 摘要 These experiments indicate that increases in gate size can lead to smaller output circuits（l.20-22）：只在该未优化算法内部、且只对多比特门计数成立；lead to 未加算法相对性限定，易被读成硬件层面的普适结论。2. 引言 l.44-47 与结论 l.578-580 supporting higher arity gates can greatly improve circuit size / can be used to start resource estimation：greatly 建立在无 arity 加权的计数上；作为资源估算起点却不建模不同元数门的错误率与时长，也不计单比特门数量，资源含义存疑。3. 摘要 l.22-23 different connectivity constraints have meaningful differences：仅 3 种约束（无/线性/方格）、不可见的 3D 图、无统计量，meaningful 无支撑。4. 全文未声明输出线路未经正确性验证，读者会默认合成正确。5. l.100-101 称重排 Trotter 项造成的误差变化 negligible w.r.t. the error reduction：无任何误差分析或引用支撑，属断言。6. l.201-205 的 minimal overlap 超图性质是特定 hypernode 添加方式的推论，文中表述像一般性质。","citations":"1. [6] Huang, Winderl, Meijer-van de Griend, Yeung（QCE 2024, arXiv:2408.00354）：方法与分子数据集的直接来源；须核对其把 Clifford 推进 tableau 的存储阶段细节与本文 3.2 节是否一致，并取其输出门数作公平基线。2. [13] Winderl et al.（arXiv:2309.08972）：『tableau 分解规模随输入趋于常数』（l.557-559）的支撑，须核对是定理还是经验观察。3. [9] Patel-Markov-Hayes（2008）：线性可逆线路综合，同上用于常数性论断。4. [3] Goubault de Brugière & Martiel（arXiv:2404.03280）：Trotter 项重排技巧出处与误差说法的支撑。5. [10] Roy et al.（PRApplied 14, 014072，原生三比特超导门）与 [11] Schindler et al.（离子阱）：作为高元门可行性动机；须核对 [10] 的原生三比特门是否可归入本文要求的 \\(e^{\\pm i\\pi/4 O}\\) 型 Clifford 门集（若为 Toffoli/CCZ 类还需额外处理）。6. [12] Villoria et al.（QST 11, 015040, 2026）：与『任意 qubit 子集全局门』工作的区分表述（l.42-43）是否准确。7. 附录 A 引 zxcalc book v1.3.0（GitHub 链接，l.726）作为 \\(e^{\\pm i\\pi/4 O}\\) 展开的证明来源：非正式文献，且其自证有误（见 correctness），应替换为正式推导。","questions":"1. 正确性：是否对随机与分子实例做过输出幺正等价的数值验证（角度离散化后精确比较或 Haar 采样保真度）？附录 B 四类收尾序列在总 qubit 数 = n、n+1（uninvolved/dirty 不足）时是否仍然完备？可否给出正式的『算法输出 = 输入幺正』定理并说明证明依赖？2. 基线：可否在相同 29 个分子上运行 [6] 的 CNOT 版合成并统一到可比口径，给出跨 arity 外部对照？至少给出『每 gadget 独立分解』的朴素基线，以证明收益来自联合合成而非元数本身。3. 代价模型：若按错误率或时长对多比特门加权（例如 20 元门折合若干个 2 元门误差），sweetspot 随连接拓扑变化的结论是否保持？可否同时以数值表报告 count 与 depth（而非仅附录 3D 图）？4. 附录 A：请修正或重述 Eq 13——正确表述是否应为 \\(e^{\\pm i\\pi/4 O}e^{i\\theta P}=e^{i\\theta Q}e^{\\pm i\\pi/4 O}\\)（Q 为带符号逐位乘积 Pauli 串）？按现文本 \\(e^{\\pm i\\theta OP}\\) 如何解释才幺正？","basis":"用 read 分两次完整读取 txt l.1–2352：正文与摘要（l.1–582）、参考文献（l.592–623）、附录 A（l.629–728）、附录 B 四类序列（l.734–1302）、附录 C/D 深度图（l.1307–1313）、分子数据三表（l.1319–2351）。图 1–7 及全部 3D 图仅见图题与坐标残片（l.432–448、l.541–551、l.1309–1313），曲线与具体数值不可见；附录 B 的验算列因 pdftotext 排版破碎只能核对结构、无法逐列复核；GitHub 实现（l.545）与任何补充材料未获取。公式上下标普遍受损（如 l.232–241 的 Eq 5、l.151–158 的 Eq 4），相关判断已用具体数值例交叉验证。"}},{"id":"arxiv-2611.08310","no":9,"topics":["解码器","测控与噪声"],"source":"arXiv","venue":"arXiv:2611.08310 [quant-ph]","published":"2026-11-05","title":"Recovery gates as a resource in repetition-code process tomography: exhaustive gate-optimal designs for three, five and seven qubits","title_zh":"恢复门作为重复码过程层析中的资源：三、五、七比特的穷举门最优设计","authors":["Long Huang"],"abstract":"Process tomography built on stabilizer codes compares the logical channel of a repetition code with a reference channel, and the decoder that produces that channel is almost always fixed to the standard minimum-weight one. We ask how many physical single-qubit Pauli gates the decoder actually needs when the measurement basis is fixed---the constraint under which the count is a resource rather than a bookkeeping artefact. Exhaustive enumeration of every recovery design for $n=3$, $5$ and $7$ qubits, with rank decided by exact modular arithmetic at two primes, gives minimal counts of $0$, $1$ and $5$ gates, against $6$, $10$ and $14$ for first-order decoding and $6$, $50$ and $308$ for full minimum-weight decoding. The count depends only on how many sites are corrected and never on which, so the two halves of the design problem separate. Correcting more sites is not monotonically better: at $n=7$ full decoding loses three dimensions of rank, and under a calibration-residual floor the precision curve at $n=3$ is U-shaped. The three-gate design is $9.5$ times more precise than the standard six-gate decoder at the median of $40$ sampled working points, and more precise at every one of them ($1.8$ to $88$ times); the size of that factor belongs to the working point, the ordering does not. Reaching a $10$\\,mrad rms error then costs $1.2\\times10^{7}$ shots in $65$\\,s on a current superconducting device at a well-conditioned point, while $n\\ge5$ stays out of reach for conditioning reasons rather than gate-count reasons. Finally, the optimal designs are not covariant under chain reversal: they separate the mirror pair of arXiv:2610.19779 by $1.3\\times10^{-3}$ while leaving the Jacobian at full rank.","importance":3,"importance_reason":"首次把解码器/恢复门计数当作稳定子码层析实验的显式设计资源，给出可证明式的最小门数表与精度-门数 U 形曲线，直接服务于解码器感知的实验设计；但结论限于 n≤7、固定测量基前提与式(4)设计族，且秩的下界方向未被其精确流程证明，维持指定重要级 3。","summary":"固定测量基约束下穷举 n=3,5,7 重复码的全部恢复设计（设计族 \\((S,w)\\)），秩用 p=65521/65519 模算术判定：最小恢复门数 0/1/5，对比一阶解码 6/10/14、全最小权重解码 6/50/308；n=7 全解码秩仅 24/27。n=3 三门设计在 40 个工作点全部优于标准六门解码（中位 9.5 倍，逐点 1.8–88 倍）；10 mrad 目标在良态工作点需 \\(1.2\\times10^{7}\\) shots/65 s。","problem":"稳定子码过程层析中，产生逻辑信道的解码器几乎总是沿用纠错惯例取标准最小权重解码；本文问：在测量基固定（16 设置表编译一次、各综合征共用）的前提下，解码器到底需要多少个物理单比特 Pauli 门，以及『纠正更多综合征』是否买来更多参数信息——即把恢复门作为显式实验资源加以最小化，并量化纠正努力与可辨识信息之间的非单调关系。","method":"把恢复设计参数化为 \\((S,w)\\)：位点集加阶帽，每个综合征对 \\(\\mathrm{rep}(s)\\cap S\\) 施用 Pauli 乘积；Lemma 1 证明门数只依赖 \\(|S|\\)（每码 \\(G=|S|\\sum_k\\binom{n-1}{k-1}\\)，l.160-191），把设计分解为预算与选址两问；对每个预算 B 穷举全部设计对，用 split-complex 代数把 Jacobian 映到 \\(\\mathbb{F}_p\\)（p=65521，p=65519 复核）以模子式判定秩；精度用带校准残差 floor 的 GLS 协方差在 40 个（n=5 为 10 个）采样工作点评估；另证镜像反演协方差引理（Lemma 2）并评估非协变设计对碰撞点简并的影响。","result":"最小门数 \\(B^*=0/1/5\\)（n=3/5/7），较全解码（308 门）省 98.4% 且秩反而更满；n=7 全解码秩 24/27（三块 3+9+12 无成对重叠）。n=3 精度-门数曲线 U 形：0/1/2/3/4/5/6 门的中位 rms 为 0.543/0.111/0.0358/0.0300/0.0320/0.116/0.284 rad，3 门设计在 40 个工作点全部优于 6 门标准解码（中位 9.5 倍、逐点 1.8–88 倍）；10 mrad 在 sc-best 参考点需 \\(1.27\\times10^{8}\\) shots/707 s，在良态点 sc-cur 需 \\(1.2\\times10^{7}\\) shots/65 s；n≥5 受条件数而非门数限制（n=5 最好 floor 18.9 rad，sc-cur）。","contribution":"给出『解码器是层析设计变量』这一定位的首个可证明式量化：位置无关引理把设计问题分解为预算+选址；固定基约束下的穷举最小门数表（0/1/5）与全解码反而丢秩的非单调机制（纠正过多把指纹投影到解码器决定子空间）；证明门最优设计破坏链反演协方差、从而与伴随论文的简并结论相互独立；并提供可复现的模算术秩引擎与成本模型，为解码器感知的稳定子码实验设计建立模板。","limitation":"穷举仅限式(4)族（每纠正综合征恰一个取自最小权重代表元的 Pauli 门）；秩的亏缺方向（24/27、14/15 及 B* 下界）按文中流程未被模算术严格证明；精度结论强依赖工作点与噪声模型（GLS+常数残差 floor）；成本模型不计深度、中途测量时延与漏电；固定测量基前提不成立时所有门数归零。","key_numbers":["B*=0/1/5（n=3/5/7）","一阶 6/10/14 vs 全解码 6/50/308","全解码秩 24/27（n=7）","9.5×（1.8–88×，40 工作点）","\\(1.2\\times10^7\\) shots/65 s（sc-cur 良态点）"],"url":"https://arxiv.org/abs/2611.08310","pdf_url":"https://arxiv.org/pdf/2611.08310v1","doi":"","review":{"verdict":"大修","confidence":"中高","correctness":"机制层面成立且大量数字可独立复核：Lemma 1（l.160-191）证明正确——重复码是完美码，重量 \\(\\le\\lfloor n/2\\rfloor\\) 的错误与综合征一一对应，含位 i 的 k 重错误 ↔ 其余 n−1 位取 k−1 个；c 值 3/25/154（每码）与 6/50/308（双码）按 \\(\\sum_k\\binom{n-1}{k-1}\\) 复核无误；B*=5 的枚举数 2002=C(14,5)、n=5 的 10=C(10,1) 与 945/2002 等计数自洽；固定基前提的换基论证（Eq 1，l.61-76）成立。U 形与排序数字自洽：0.543/0.0300≈18、6.36/0.0168≈379、0.284/0.0300≈9.5、3.71e−1/1.11e−2≈33、A/B 翻转比 2.46/1.29 均与 Table 2/3 吻合。但『精确秩』主张有一个方向性缺口：模 p 算术只能证明『存在 mod p 非零子式 ⇒ 有理数秩 ≥ 该值』（认证满秩的 attainment 方向，l.277-279 也如实声明 one-sided）；而三条关键主张需要相反方向——(i) n=7 在 B≤4 无满秩设计（B*=5 作为下界，l.294-297 却称 proved, not sampled）；(ii) 全解码秩恰为 24/27（摘要、Table 1 末列、l.305-311 的 3+9+12 块结构）；(iii) n=5 bit 侧单门秩 14 或 15。有理数上非零的子式可以在两个固定素数上同时归零，故按文中流程（精确有理算术仅在 n=3,5 抽查，l.282-284）这些上界/亏缺方向未被严格证明；需补精确有理判定、显式有理零向量或高度界+多素数论证。噪声模型（Eq 7-8，l.329-351）为标准 GLS 近似：方差取 1/N 而非 \\((1-R_{ij}^{2})/N\\)、忽略分量间协方差、平台表中的 p₂ 未出现在任何公式——影响绝对值，大概率不动排序。另有内部计数矛盾：Sec 2.2 称征综合征需 2(n−1) 个 CX（l.199-201，n=3 应为 4），Sec 5 协议为 8 个 CX（l.645）；Table 4 题注分支公式 16(2n+1)=112 与正文 9 分支×16 设置=144 不符（l.645-646 vs l.654）。","weaknesses":"1. 秩认证的方向性缺口（最核心）：摘要 rank decided by exact modular arithmetic at two primes 与 l.294 The minimum is small and it is proved, not sampled 把单侧认证表述为双侧证明。模算术只能认证满秩（attainment），不能认证亏缺与下界；这直接牵动两条卖点：B*=0/1/5 是『最小』（需要 B 以下全部否定）与『全解码丢 3 个秩』。修复可行（对 B≤4 共约 1471 个否定案例做精确有理判定，或给出显式有理零向量证书），但按当前文本这是完备性缺口。2. 穷举是族内穷举：式(4)限定每纠正综合征恰一个 Pauli、取自最小权重代表元、按码型固定为 X/Z；Y 门、部分纠正（rep(s)∩S 的真子集）、非最小权重代表元、两比特恢复门均不在设计空间内。Limitations（l.892-895）已声明，但摘要 Exhaustive enumeration of every recovery design 无此限定。3. U 形与『3 门最优』的模型依赖性未做敏感性分析：\\(σ_res\\) 变化（含 →0 的纯 shot 极限）下 U 形是否存在、最优点是否移动未报告；逐分量二项方差、16 设置与 9 分支间的统计关联、设置表自身误差均未进入模型；n=3 用 40 个工作点、n=5 只用 10 个（l.622），样本量不一致且无区间估计。4. 缺少与标准表征法的对比：只在码基协议内部比较设计。n=3 协议需 9 分支×16 设置；与直接 3 比特过程层析（64 设置）或 RB 类方法的 shot 与门开销对比缺失，『省 5 个门』的整体性价比无法评估。5. 成本模型的现实性：wall clock ≈ shots×cycle time（Table 4：1.27e8×5 µs≈637 s，报告 707 s，差值未解释），不含读出/复位/编译开销、中途再校准与漂移；\\(σ_res\\) 作为常数 floor 在长扫描中的漂移相关性未建模；平台参数 representative, not device-specific（l.357），但摘要把 \\(1.3×10^{8}\\) shots/12 min 当可执行预算引用。6. 外推过度：n ≥ 5 is out of reach on any platform for conditioning reasons（摘要 l.34-35）基于 n=5 仅 10 个采样点、n=7 扫描在 12 门截断且未到拐点（l.898-900）；Limitations 自己写明 no floor computed here is a bound on the protocol（l.906），摘要未反映。7. 强依赖伴随论文 [1]：指纹构造、碰撞点、112 分量映射、镜像简并分类全部承自 [1]，Sec 6 的『两组主张互不传递』使本文单独可读性下降；[1] 未随文提供。8. 细节矛盾与符号问题：2(n−1) CX vs 8 CX；16(2n+1) vs 9 分支；cycle times 5 µs and 200 µs respectively 对应三个平台两个数（l.361）；p₂ 在模型中无着落；Table 2 的 canonical 列（1.68e−2）与 Table 4 的 floor（1.66e−2）/1e10-shot 列口径接近但未互引，交叉阅读易混淆。","overclaim":"1. 摘要 Exhaustive enumeration of every recovery design ... gives minimal counts of 0, 1 and 5（l.19-21）：双重弱化未标明——穷举限于式(4)族；且『最小』的下界方向按其认证流程未被证明（两素数模算术是单侧的）。2. 摘要 at n = 7 full decoding loses three dimensions of rank（l.25-26）：亏缺方向（≤24）未被其精确流程证明；浮点证据与块结构强烈暗示结论为真，但 exact 措辞超出已证内容。3. 摘要 n ≥ 5 is out of reach on any platform for conditioning reasons rather than gate-count reasons（l.34-35）：把两个刻意选取的极端工作点加有限采样外推为全平台、全参数域论断；Limitations 的限定未进入摘要。4. 摘要 Reaching a 10 mrad rms parameter error costs \\(1.3×10^{8}\\) shots in 12 minutes（l.32-33）：这是模型估算（representative 参数+理想 wall clock），摘要当作实验成本陈述。5. l.29-31 the ordering does not [transfer]: three gates beats six at every point tested：仅在小角度采样域（λ≤0.05、40 点）内成立，摘要未说明采样域；且 9.5× 是逐点选位型的收益，预固定布线只有 3.1–6.4×（l.378-383），摘要给 9.5 有取上包络之嫌。","citations":"1. [4] Knill, Nature 434, 39 (2005)：被引支撑『逐综合征选基可把解码器吸收进基表』（l.71-72）。Knill 2005 是容错方案论文，与层析设置表的关系需要核对，疑似不贴切引用。2. [3] Nielsen & Chuang：被引为 standard minimum-weight decoder 惯例出处（l.52）；N&C 不含码基层析的解码惯例，应改引重复码/纠错解码文献。3. [6] van der Meer et al., arXiv:2606.07377：支撑『重复码实验已在逻辑保真度层面如此表征』（l.46-47）；须核对该实验是否确实使用逐综合征固定的设置表——这决定固定基前提的现实相关性。4. [1] L. Huang, arXiv:2610.19779（伴随论文）：碰撞点、112 分量映射、镜像简并分类与 Lemma 2 的应用场景全部来自它；须核对 [1] 中 covariant recovery 假设的原始表述、112 分量构成与本文 Table 5 的 3.3e−16/1.33e−3/5.59e−2 数值。5. [5] L. Huang, arXiv:2610.31007 与 [2] von Lüpke et al., PRX Quantum 1, 010305 (2020)：支撑『两码取向探测互补 Pauli 轴』（l.45）；核对归属与内容。6. 平台参数 \\((10^{-3},10^{-2},\\)…) 标为 representative 但无来源；建议注明参照设备或文献。","questions":"1. 秩认证：对 n=7 中 B≤4 的全部 1471 个设计对以及全解码设计，是否做过精确有理算术判定或给出显式有理零向量？若无，仅凭 p=65521 与 p=65519 如何排除『某 27×27 子式的分子恰被两素数整除』的漏检？可否提供 Hadamard 高度界加随机多素数（或精确有理）的证明版本并归档？2. U 形稳健性：\\(σ_res\\)∈\\({0,10^{-4},10^{-3},10^{-2}}\\) 以及逐分量方差 \\((1-R_{ij}^{2})/N\\)、分量间协方差下，n=3 的 U 形与最优预算、以及 3 门 vs 6 门排序是否不变？3. 设计空间：允许 Y 门、每综合征纠正 rep(s)∩S 的真子集、或两码不同阶帽时，B* 是否会低于 0/1/5？若会，文中最小门数的表述应如何限定？4. 现实相关性：现有重复码逻辑信道实验（如 [6]）是否真的受固定 16 设置表、逐综合征不可换基约束？若逐综合征换基代价可忽略，本文资源结论对它们的可迁移性如何？","basis":"一次性完整读取 txt l.1–936（摘要、第 1–7 节、Limitations、数据/代码可用性声明、LLM 披露、6 条参考文献）。Table 1–5 与正文数字完整并已交叉核对；图 1 与图 2(a)(b) 只有图题、坐标与标注残片（l.452-524、l.652-787），曲线细节与 floor is 2-3 decades above the target 等标注不可见；公式上下标有抽取损失。补充档案（模算术秩引擎、float 失败管线、镜像协方差检查）未随文提供，无法独立复跑；[1][5][6] 原文未读。"}},{"id":"arxiv-2611.07802","no":10,"topics":["测控与噪声"],"source":"arXiv","venue":"arXiv:2611.07802 [quant-ph]","published":"2026-11-05","title":"Multirobust Control Pulses Designed by Iterative Quantum Kolmogorov-Arnold-Moser Algorithm","title_zh":"用迭代量子 Kolmogorov-Arnold-Moser 算法设计多重鲁棒控制脉冲","authors":["Meri Harutyunyan","Stéphane Guérin"],"abstract":"We introduce a multi-robust quantum control strategy designed to suppress multilevel leakage outside the computational qubit space while simultaneously ensuring robustness against unknown inhomogeneities in control parameters. It is based on a reformulation of the Derivative Removal by Adiabatic Gate (DRAG) technique which allows for the full incorporation of control pulses originally designed for two-level models by using the iterative quantum Kolmogorov-Arnold-Moser (KAM) algorithm. We apply it for optimal robust control designed by inverse optimization (RIO), referred to as RDK pulses. We analyze the performance of RDK pulses on various durations, iterations, and robustness types. We show that the two-level robustness is restored after only a few iterations with an asymptotic exponential approximation (i.e. as a superasymptotic series), even for relatively short pulse durations and that the resulting pulses are near optimal in terms of energy compared to the optimal RIO pulses defined in the qubit subspace. Such pulses are well suited for superconducting transmons as well as other forms of qubits embedded in a multi-level structure. By effectively reproducing a two-level dynamics within a multi-level system, this approach is versatile thanks to its compatibility with two-level control strategies under conditions (smoothness, duration) that are analyzed.","importance":3,"importance_reason":"方法学进展：把 DRAG 统一进 KAM 迭代框架并使之与两能级鲁棒最优化（RIO）兼容，对超导多能级泄漏-鲁棒性联合设计有实用价值；但无实验验证、缺标准 DRAG 基线对比，属有用工具而非即时突破，维持 3。","summary":"把 DRAG 的块对角化目标改写为逐阶量子 KAM 接触变换，使两能级鲁棒最优化脉冲（RIO）经时间重参数化后整体嵌入多能级系统（RDK）：π 脉冲 σ=0.75σ0、α-RIO σ=2σ0、αδ-RIO σ=2.5σ0 即达 \\(10^{-4}\\) 非保真度，3 次迭代恢复两能级 α/δ 鲁棒轮廓，误差呈 \\(e^{-C/\\varepsilon_\\sigma}\\) 超渐近标度（C≈2.5/0.7）；RDK+GRAPE 名义非保真度再降一个量级、收敛快 8 倍。","problem":"同时抑制多能级泄漏并抵御未知控制参数（幅值不均匀性 α 与失谐偏差 δ）的脉冲设计长期缺乏不依赖脉冲 ansatz、不需要梯度优化的统一方法：DRAG 擅长压泄漏但难以直接容纳为两能级设计（幅值边界非零）的鲁棒控制解，泄漏防护与参数鲁棒性通常只能分开处理。","method":"以 H0+εV 分解三能级（可推广）系统，用逐阶 KAM 变换 \\(e^{ε^{N} W_N}\\) 同时：消去计算子空间与泄漏子空间的耦合项（cohomology 方程定 \\(W_N\\)），并令计算块逐阶严格复现原始两能级控制（\\(V(N)=−[H_{N−1,t}]_ij\\)，End Matter Eq. 9-11，l.644-720）；自由参数 κ（b∝−κΩ(1)/2）调节保真度-鲁棒性折衷；RIO 解经保面积的时间重参数化 t=g(τ) 满足 Ω 边界为零后嵌入；对 π 脉冲、α-RIO、αδ-RIO 及 |1⟩–|2⟩ 双侧泄漏（四能级）情形做迭代收敛、鲁棒轮廓、谱截止、GRAPE 精修与 T1/T2 Lindblad 开放系统检验。","result":"π 脉冲在 σ=0.75σ0（d/2π=−300 MHz 时约 2.5 ns）即达约 \\(10^{-4}\\) 非保真度，泄漏在 N=2 最小；α-RIO/αδ-RIO 分别在 σ=2σ0/2.5σ0 达 −4，3 次迭代恢复两能级 RIO 的 α（与 δ）鲁棒轮廓；最优迭代后误差呈指数标度 \\(e^{−C/εσ}\\)（拟合 C=2.5/0.7），适用至 ε≈0.5；RDK 相对 RIO 的脉冲能量改动 <5%（Gaussian）–10%（hyper-Gaussian）；谱截止需求 146–250 MHz；RDK+GRAPE 比 RIO+GRAPE 名义非保真度低约一个量级且 9 vs 70 次迭代收敛；T1=200 µs/T2=135 µs 的 Lindblad 模拟给约 −3.5。","contribution":"提供了一个无脉冲 ansatz、无梯度的多重鲁棒脉冲构造框架：任何足够光滑的两能级协议（演示了 π 脉冲与 RIO 族）都可经 KAM 迭代嵌入多能级系统并同时获得泄漏抑制，且给出指数收敛的经验刻画与开源代码；对超导 transmon 短门控的泄漏-鲁棒性联合设计是可行路线，RDK 作为 GRAPE 种子能显著加速优化，|1⟩–|2⟩ 情形还给出单步处理双侧泄漏的方案。","limitation":"无实验验证；未与标准/高阶/递归 DRAG 在同条件下定量对比；保真度指标对门相位不敏感；开放系统非保真度数值比退相干极限估计大近一个量级且未解释；鲁棒范围（α 至 ±0.4）对超导平台的现实性存疑。","key_numbers":["σ=0.75σ0(π)/2σ0(α-RIO)/2.5σ0(αδ-RIO) 达 1e-4","C=2.5(π), 0.7(α-RIO)","能量改动 <5%–10%","RDK+GRAPE 9 vs 70 次迭代","谱截止 146–250 MHz"],"url":"https://arxiv.org/abs/2611.07802","pdf_url":"https://arxiv.org/pdf/2611.07802v1","doi":"","review":{"verdict":"大修","confidence":"中高","correctness":"核心方法主张（迭代 DRAG-KAM 能在多能级系统中复现两能级控制并恢复 RIO 鲁棒性）在演示范围内成立且推导自洽：(i) 算法定义完整：End Matter Eq. (9)-(11)（l.644-720）逐阶同时钉住计算块（V(N) 条件）并消去泄漏耦合（\\(W_N\\) 条件），SM Sec. II（l.897-1206）给出三能级逐步推导，第一迭代确等价于无修正系统（l.1025-1028），逻辑闭合，代码公开 [38]（l.552）。(ii) 数值结果内部一致：Fig. 1/3/5 显示 3–4 次迭代后 α/δ 鲁棒轮廓与两能级 RIO 重合；−4 所需 σ（π 0.75σ0、α-RIO 2σ0、αδ-RIO 2.5σ0）随失谐修正增大而增大、与 ε≲0.5 适用域自洽（l.363-372）；|1⟩–|2⟩ 双侧泄漏以四能级实现，σ 仅需 +0.2–0.3σ0（l.1484-1488）。(iii) 超渐近声明是经验性的：C=2.5/0.7 由拟合得到（l.300-306），理论依据仅是渐近级数一般性质 [32-34]，且作者自承使用非超指数的简化迭代（l.129-131），故 superasymptotic 属类比而非定理，措辞大体克制。(iv) 关键缺口：全文未与标准一阶/二阶 DRAG [21-23] 或递归 DRAG 在同条件（同 σ、d、带宽）下对比，对照系只有 N=1 与两能级 RIO 自身，重构带来的增益无法量化。(v) 开放系统结果存疑：Fig. 10（l.1843-1919）σ=2–4σ0（6.7–13.3 ns）时开放系统非保真度 −3.65 至 −3.45；按 T1=200 µs、T2=135 µs 估算，10 ns 级门的退相干误差应约 3–\\(7×10^{-5}\\)（≤−4.2），报告值大近一个量级且无解释；|2⟩ 无退化近似（l.1890-1894）与向量化实现（Eq. 35）需复核。(vi) 指标 \\(1−|⟨1|ψ(tf)⟩|^{2}\\)（l.268-270）对相位盲，门层面的多鲁棒性未覆盖相位通道。综合：演示正确自洽，作为普适方法与量化优势的论证不完整。","weaknesses":"1. 缺基线对比（最关键）：论文定位是 DRAG 的重构与推广，但没有任何标准 DRAG（Motzoi-Gambetta 一阶导数修正 [21]）、高阶 DRAG [23] 或递归/多导数 DRAG 在相同 σ、d、κ、滤波带宽下的曲线；无法判断 RDK 相对成熟方法在同等资源下好多少。文中对复合脉冲 [25] 与 Fourier 型方案 [26] 的非最优性指称也未做数值对照。\n2. 鲁棒性度量与现实性：主图 α 扫到 ±0.4（Fig. 3, l.345-357）、δ/Ωmax 扫到 ±0.4（Fig. 5, l.859-869），这继承自系综/原子物理的 RIO 设定；超导 transmon 门控的幅值/频率校准误差典型在百分位量级，而 GRAPE 部分实际只优化 α∈[−0.05,0.05]、δ/Ωmax∈[−0.13,0.13]（l.1691-1694），两处范围相差近一个量级，对超导语境下未知控制参数不均匀性的定义需收窄并说明。\n3. 时间重参数化的副作用被低估：Eq. (12)-(16)（l.727-786）承认 δ 鲁棒性受损，且其论证显示退化源于对 Δ 偏差的注入方式（两 frame 各加 x·max|Ω|）而非物理失谐误差；一个物理静态失谐误差在两 frame 间按 ḡ(τ) 变换，与 Eq. (14) 的注入并不等价（Eq. 16）。因此 Fig. 4(bottom) 的差异部分是协议产物，物理 δ-鲁棒性的传递程度需用统一的物理误差定义重新给出。\n4. 相位盲指标：\\(log10(1−|⟨φT|φ(tf)⟩|^{2})\\)（l.268-270）不含相位；RIO 两能级解的相位结构在 KAM 变换与重参数化后如何变化、virtual-Z 能否补偿，全文未评估。摘要与结论以 quantum computing applications 定位（l.21-25, l.316-317），但演示的是布居转移而非含相位的门。\n5. 开放系统模拟存疑：|2⟩ 设为无退化（l.1890-1894）虽有论证，但快门控中瞬态 |2⟩ 布居正是泄漏问题本身；Fig. 10 数值与退相干极限的量级矛盾（见 correctness (v)）至少需复核或解释；且开放系统只给名义非保真度-时长曲线，没有鲁棒轮廓。\n6. 超渐近/收敛声明证据薄：C 只在两类脉冲上拟合，未展示拟合点数、残差与最优迭代数 N* 随 ε 的变化；摘要 asymptotic exponential approximation (i.e. as a superasymptotic series)（l.18-19）的术语与 Berry-Howls/Boyd 的定义有滑动，建议降格为指数型经验标度。\n7. κ=0.5 的选择与敏感性未给出：仅述 best fidelity-robustness compromise（l.280-283），无 κ 扫描数据，可复现性与最优性声明受限。\n8. 呈现与引用卫生：SM 引用为 See Supplemental Material at [URL] 占位（l.560-563）；主文与 SM 参考文献独立编号；主文 l.412 与 SM l.1889 引 [3] 标注 transmon 相干时间，但主文 [3] 是 Sangouard et al. 的绝热 SWAP 文（l.452-454），引文与内容错位。","overclaim":"1. 摘要 l.18-19 the two-level robustness is restored after only a few iterations：对 α 成立（3 次迭代，l.376-379），但 δ 的恢复经由时间重参数化后带系统退化（Fig. 4 bottom, l.751-754），摘要未提。\n2. 摘要 l.20-21 与结论 near optimal in terms of energy compared to the optimal RIO pulses defined in the qubit subspace（l.382-390）：只与两能子空间最优比较，多能级真最优未知；10%（hyper-Gaussian）的面积/能量改动称 near optimal 偏强，且未定义能量口径（峰值幅值 vs ∫\\(Ω^{2}dt\\)）。\n3. l.22-25, l.432-434 compatibility with any two-level control strategy / versatile：只演示了 π 脉冲与 RIO 族；复合脉冲、几何方法等未验证，any 过度。\n4. l.415-419 converging up to eightfold faster and reaching a nominal infidelity two orders of magnitude lower：8 倍是与 RIO+GRAPE 达到不同目标值（70 步到 \\(10^{-4}·^{18}\\) vs 9 步到 \\(10^{-3}·^{73}\\)，l.1738-1747）的比较，不是同精度收敛速度；两量级优势仅在名义点（α=δ=0）。\n5. l.314-317 an infidelity as low as −4 is attainable, corresponding to a typical ultra-high fidelity required for quantum computing applications：−4（99.99%）远超当前实用需求（99.9% 量级），且开放系统下只剩约 −3.5，该表述抬高了闭环指标。","citations":"1. Motzoi et al. PRL 103, 110501 (2009) [21]、Gambetta et al. PRA 83, 012308 (2011) [22]、Theis et al. EPL 123, 60001 (2018) [23]（l.501-507）：标准 DRAG 系列，是 reformulation 的对照原点；必须核对其一阶修正（Ωy∝−Ω̇/(2d) 类）与本文第二迭代物理修正 V(2) 的显式关系——若 RDK 的首个物理修正即标准 DRAG，创新定位需重述。\n2. Dridi, Liu, Guérin PRL 125, 250403 (2020) [18]（l.492-494）与 Laforgue et al. [19,20]（l.495-500）：RIO 的原始与后续文献；正文 RIO 处反复引 [4,19,20]，而 [4] 是 Vitanov 的 STIRAP 综述（l.455-458）、Single-Shot Shaped Pulse
