码 \\(G=[G_0|G_1]\\) 决定测量顺序并保证全部结果可解码，在 Q70/Q102 行走猫架构上把猫态测量数降到 Viterbi 方法的约 \\(1/3\\)，配合 CliNR 变体在随机 Clifford 电路上最高提速 \\(74.4\\times\\)。","problem":"qLDPC 码靠高编码率把容错所需的比特开销压得远低于表面码，但同一个码块里同时操作多个逻辑比特会更困难：以往做法是为逻辑测量专门设计复杂的资源态（或按 Viterbi 方式逐个测量），资源态制备本身成为主导成本，逻辑操作的并行度被测量次数吃掉。","method":"作者把逻辑测量归约为只消耗猫态（cat state）的方案，并针对 \\(\\ell\\) 个对易逻辑算符设计调度码：把每个逻辑算符对应的猫态测量序列写成矩阵 \\(G=[G_0|G_1]\\)，它的行给出各轮参与测量的猫态，列约束保证测量结果能线性组合出全部 \\(\\ell\\) 个逻辑本征值，因而调度码同时充当测量顺序表和解码矩阵。作者给出 MEDM 与 MECM 两类协议，并在行走猫（walking cat）架构上以 Q70（6 个逻辑比特）与 Q102 两个 qLDPC 码做蒙特卡洛仿真，物理错误率固定为 \\(p_F=6.3\\times10^{-3}\\)，统计每个逻辑测量平均消耗的猫态数与逻辑错误率；再把该协议与 CliNR 部分纠错方案的一个新变体组合，测量随机 Clifford 电路与 Toffoli 门的整体时间。","result":"\\(\\ell=10\\) 与 \\(\\ell=20\\) 时，单次逻辑测量平均消耗 2.1 与 1.7 个猫态，相对 Viterbi 方法的加速为 \\(2.31\\times\\)、\\(2.41\\times\\)（\\(\\ell=10\\)）与 \\(2.81\\times\\)、\\(2.96\\times\\)（\\(\\ell=20\\)），即测量数减少近 \\(3\\times\\)；配合 CliNR 变体后，Toffoli 门加速 \\(4.2\\times\\)（Q70）与 \\(5.0\\times\\)（Q102），随机 Clifford 电路加速 \\(18.5\\times\\)（Q70）与 \\(74.4\\times\\)（Q102）。加速幅度随码块规模与 \\(\\ell\\) 增大而变大，说明调度码摊薄了猫态制备的固定开销。","contribution":"首次把 qLDPC 的多逻辑测量从“设计复杂资源态”转为“设计简单的猫态测量调度”，给出可证明可解码的调度码构造，并在真实码族上把资源态开销与逻辑操作时间同时量化，为 qLDPC 的容错编译提供了可复用的调度层抽象。","limitation":"全部结论来自行为级蒙特卡洛仿真，猫态制备与注入按固定的物理错误率 \\(p_F\\) 建模，未包含猫态本身的制备失败与测量串扰细节；CliNR 变体的收益只对 Clifford 部分成立，非 Clifford 门（Toffoli）加速明显更小；行走猫架构所需的离子/中性原子/氦上电子平台尚未在该码规模下演示，调度码在更大 \\(\\ell\\) 与更低错误率下的解码复杂度也未给出标度分析。","key_numbers":["调度码 G = [G0|G1]，ℓ = 10 / 20 个对易逻辑算符","平均 2.1（ℓ=10）/ 1.7（ℓ=20）个猫态每次逻辑测量","逻辑测量加速 2.31×、2.41×（ℓ=10），2.81×、2.96×（ℓ=20）","随机 Clifford 电路 18.5×（Q70）/ 74.4×（Q102）","Toffoli 4.2×（Q70）/ 5.0×（Q102），固定 pF = 6.3×10⁻³"],"url":"https://doi.org/10.1103/vz2d-jq2z","abstract":"Quantum LDPC codes provide a substantial reduction in qubit overhead required for fault-tolerant quantum computation compared to surface code, thanks to their high encoding rate. However, operating simultaneously on multiple logical qubits encoded in the same block is more challenging and may slow down logical operations. Prior work addresses this problem by designing complex resource states to perform logical measurements in LDPC codes. Here, we propose an approach that only consumes cat states. Whereas previous work on cat-based measurements focuses on a single logical measurement, we design a protocol for the joint measurement of ℓ commuting logical operators. The key ingredient is the design of a scheduler code determining the measurement sequence and allowing for the decoding of all logical measurement outcomes. Numerical simulations with the LDPC codes Q70 and Q102 of the walking cat architecture show a reduction of nearly 3 × in the number of cat-based measurements required versus the Viterbi method for measuring ℓ = 20 commuting logical operators. Combining our logical measurement protocols with a new variant of the CliNR partial error correction scheme, we achieve a reduction of up to 73 × versus the Viterbi method for random Clifford circuits. Our approach also applies to non-Clifford gates, producing a reduction of up to 5 × versus the Viterbi method for Toffoli gates.","review":{"verdict":"小修","confidence":"高","correctness":"调度码的构造与“可解码”论证自洽：\\(G=[G_0|G_1]\\) 的行列关系直接对应测量轮次与逻辑本征值组合，Q70/Q102 上 2.1/1.7 个猫态与 2.31×–2.96× 的加速在两组 \\(\\ell\\) 下互相印证；CliNR 组合后的 18.5× 与 74.4× 差异也可由码块规模与每轮并行度解释。","weaknesses":"· 全部为行为级仿真，猫态制备/注入错误被压成一个常数 \\(p_F\\)，缺少制备失败率的敏感性分析\n· 非 Clifford 门只演示 Toffoli，5× 与 Clifford 的 74× 差距未展开讨论\n· 调度码在 \\(\\ell\\) 继续增大时的解码复杂度与所需猫态并行度没有标度曲线\n· 行走猫架构的硬件假设（猫态可在码块间移动）只在附录一笔带过","overclaim":"摘要强调“只用简单资源态”，但实际仍需高质量猫态注入与可移动的猫态总线；把 \\(74.4\\times\\) 作为代表性数字容易掩盖非 Clifford 场景下加速仅 4–5× 的事实。","citations":"与 Viterbi 方法、既有猫态单逻辑测量工作以及 CliNR 原始方案的对比充分；对别的 qLDPC 码族（如超图乘积码之外的构造）与表面码的端到端开销比较缺失。","questions":"① 若猫态制备成功率降到 99%，加速比还剩多少？② 调度码能否与晶格手术式的逻辑门组合，而不只是逻辑测量？③ \\(\\ell\\) 增大到 50 以上时解码是否仍是多项式时间？","basis":"全文（arXiv:2607.16166 PDF，含附录与数值细节）"}},{"id":"pr-10.1103/psqn-dt4d","no":2,"topics":["测控与噪声","编译与验证"],"source":"PRApplied","venue":"Physical Review Applied","published":"2026-11-17","title":"Quantum noise suppression at scale with crosstalk-robust gate sets","title_zh":"用抗串扰门集合在大规模下抑制量子噪声","authors":["Andy J. Goldschmidt","Emilio Peláez Cisneros","Ryan Sitler","Kevin Olsson","Kaitlin N. Smith","Gregory Quiroz"],"importance":5,"importance_reason":"把“抗串扰门集合”写成可扩展的最优控制问题（利用串扰算符的成对结构），并在 IBM 云端设备上给出并行随机电路与四比特 TFIM 模拟的实测收益（中位数 4×），是少见的把门级最优控制、硬件标定与算法级性能连起来的工作。","summary":"作者把串扰的成对算符结构写进最优控制目标，一次性合成抗串扰门集合（CRGS）：在 IBM Quantum 平台上，四比特横场 Ising 模拟的中位性能提升 \\(4\\times\\)，并行单比特电路的保真度改善最高 1.6%，并给出把两比特门时间减半的数值证据。","problem":"串扰（尤其 \\(ZZ\\) 型）在并行执行时把闲置比特也拖进相干错误，传统动力学解耦只保护空闲时段，无法覆盖计算过程中的门操作；而已有的串扰感知控制多为逐门或小规模优化，缺乏在真实多比特设备上可扩展、能与其他标定流程兼容的方案。","method":"作者从串扰哈密顿量的成对结构出发，把任意两比特串扰项记成 \\(\\sum_{i<j} J_{ij}\\,Z_iZ_j\\) 形式，利用其只依赖比特对的性质把全局最优控制问题分解为可并行求解的小问题，从而在门集合层面同时优化单比特脉冲的包络与相位；门集合在 IBM Quantum 平台的超导设备上标定，通过误差抑制序列与最多八比特的并行随机单比特电路验证，并以四比特横场 Ising 模型的哈密顿量模拟作为算法级基准，与使用同一套标定流程的高斯脉冲门集合对比。","result":"在四比特随机 Clifford 电路上，CRGS 相对基线取得约 16% 的保真度提升（\\(1.016\\times\\)）；四比特 TFIM 哈密顿量模拟的中位性能提升 \\(4\\times\\)；并行随机单比特电路上同时随机基准（simultaneous RB）改善最高 1.6%，单比特门错误率增加不超过 0.5%。数值上还表明优化后的门集合允许更大的比特间耦合 \\(J\\)，可把两比特门时间缩短一半。","contribution":"给出一个只依赖串扰成对结构的可扩展最优控制表述，使抗串扰门集合能在云端设备上按现有标定流程落地，并把收益从门级保真度一路量化到算法级（TFIM 模拟 4×），为硬件–软件协同设计提供了可操作的接口。","limitation":"实验规模限于四比特算法基准与八比特并行单比特电路，尚未展示在含两比特门的深层电路上的端到端收益；串扰模型以 \\(ZZ\\) 为主，失谐量假定在设备统计涨落（约 0.2 MHz）范围内成立；两比特门时间减半只是数值证据，未在硬件上实现；依赖 IBM 云端标定接口，脉冲级可编程性受限的平台无法直接迁移。","key_numbers":["四比特随机 Clifford 保真度提升约 16%（1.016×）","四比特 TFIM 模拟中位性能提升 4×","并行单比特电路 simultaneous RB 改善最高 1.6%","单比特门错误率增加 ≤ 0.5%，验证规模最多 8 比特","数值上两比特门时间可减半"],"url":"https://doi.org/10.1103/psqn-dt4d","abstract":"We introduce crosstalk-robust gate sets, which are obtained using a novel, scalable optimal control problem exploiting quantum crosstalk’s pairwise operator structure. Crosstalk-robust gate sets suppress quantum crosstalk throughout arbitrary computations, whereas conventional dynamical decoupling primarily targets idle periods. We use the IBM Quantum Platform as a testbed for our gate sets, where we study their efficacy via error suppression protocols and randomized parallel single-qubit circuits of up to eight qubits. Using a Hamiltonian simulation of a four-qubit transverse field Ising model, we show that crosstalk-robust gate sets enhance median algorithmic performance by a factor of four over baseline Gaussian gates using the same calibration procedures. Lastly, we provide numerical evidence that crosstalk-robust gate sets can enable larger qubit-qubit coupling strengths that can cut two-qubit gate times in half, demonstrating how hardware-software co-design using quantum optimal control can create new opportunities for quantum computing architectures.","review":{"verdict":"小修","confidence":"高","correctness":"把串扰的成对算符结构转化为可并行的最优控制子问题，推导与实现一致；16%（Clifford）、4×（TFIM）与 1.6%（simultaneous RB）三组数字来自不同层级基准，量级关系合理，且作者明确说明使用的是同一套标定流程做对照，比较是公平的。","weaknesses":"· 算法级演示只有四比特 TFIM，未涉及带两比特门的深层线路\n· 两比特门时间减半仅为数值结论，无硬件验证\n· 串扰模型局限于 ZZ 与小幅失谐，未讨论泄漏与微波串扰\n· 依赖云端标定，脉冲自由度被平台限制，迁移性讨论不足","overclaim":"标题强调 “at scale”，但真实实验规模为 4–8 比特；4× 的中位提升来自单一算法基准，宜注明规模与电路族。","citations":"对动力学解耦、串扰感知编译与最优控制门合成三条线的引用较完整；与同期用脉冲级控制抑制 ZZ 的工作缺少定量对比。","questions":"① 在含两比特门的随机电路上，CRGS 的收益能否保持？② 门集合重标定的开销与漂移鲁棒性如何？③ 若把耦合 \\(J\\) 提高一倍，两比特门保真度是否仍能维持？","basis":"全文（arXiv:2603.15758 PDF）"}},{"id":"pr-10.1103/mhhs-c3x9","no":3,"topics":["芯片与耦合器","算法"],"source":"PRResearch","venue":"Physical Review Research","published":"2026-11-17","title":"Cavity-mediated two-qubit gate: Tuning to optimal performance with NISQ-era quantum simulations","title_zh":"腔介导两比特门：用 NISQ 时代的量子模拟调至最优性能","authors":["Shreekanth S. Yuvarajan","Vincent Iglesias-Cardinale","David Hucul","Herbert F. Fotso"],"importance":5,"importance_reason":"把 Tavis–Cummings 模型整体映射到 3 比特线路（两个发射体 + 一个腔模），在不用 RWA、不用 Schrieffer–Wolff 微扰的前提下扫出腔介导两比特门的保真度地图，给出中间失谐区约 99% 的态转移保真度以及“非对称耦合到远失谐腔”的提升机制，对腔/光子介导门的设计有直接指导意义。","summary":"作者把两个比特加一个腔模的 Tavis–Cummings 哈密顿量映射成 3 比特线路，用 Suzuki–Trotter 演化扫描失谐、耦合与腔耗散，得到中间失谐区约 \\(99\\%\\) 的态转移保真度，并发现把两个比特以不等耦合接到远失谐腔可在彼此适度失谐时显著提升保真度。","problem":"腔（光子）介导的两比特门是多种可扩展平台的共同基础，但其最优工作点往往落在解析方法失效的区域：RWA 在超强耦合下崩溃，Schrieffer–Wolff 等微扰展开在深色散区不可靠，而经典数值方法在多模、多发射体情形下又受维度限制，于是“哪些参数区真正最优”长期缺少系统性答案。","method":"作者先做逆 Holstein–Primakoff 变换把 Tavis–Cummings 哈密顿量写成“比特化”形式，使腔模只占一个辅助比特（腔截断到最多 3 个激发），再用 Suzuki–Trotter 分解 \\(e^{-iH\\delta t}\\approx e^{-iA\\delta t}e^{-iB\\delta t}\\) 把演化拆成 \\(R_Z\\)、\\(R_{XX}\\) 等标准门，步长按 \\(1-F\\le 10^{-3}\\) 的系统误差预算选取；腔耗散通过 Kraus 算符的振幅阻尼通道接到腔比特上。全部线路在 Python + Qiskit 的态矢量模拟器上执行，扫描两个比特与腔的失谐 \\(\\Delta_1,\\Delta_2\\)、耦合 \\(g_1,g_2\\)、腔阻尼 \\(\\kappa\\)，并以解析结果（RWA 加 Schrieffer–Wolff）作对照验证。","result":"扫描给出完整保真度地图：在中间失谐区态转移保真度可达约 \\(99\\%\\)；当两个比特彼此适度失谐时，把二者以不相等的耦合接到远失谐腔（如 \\(\\omega_c\\approx 100g\\)）能带来明显保真度提升，作者把这一机制归因于非对称耦合对不需要的激发路径的抑制。接近超强耦合与深色散区时，模拟与 RWA 解析结果系统性分离，定量给出 RWA 失效的边界；腔阻尼 \\(\\kappa\\) 增大则整体压低保真度并改变最优失谐位置。","contribution":"提供了一个只用少量比特、与 NISQ 器件兼容的腔介导门表征流程：不依赖 RWA 与微扰展开即可扫出参数地图并定位最优点，同时明确指出非对称耦合这一被忽视的设计自由度，为腔阵列、多发射体等经典不可解体系的扩展留出接口。","limitation":"所谓“量子算法”实际在 Qiskit 态矢量模拟器上执行，全部结果仍属经典可解的三比特体系，未在真实量子处理器上运行；腔被截断到 3 个激发，强驱动/超强耦合下截断误差未系统标定；耗散只用振幅阻尼通道近似，未含腔的加热与比特退相位；保真度定义为态转移保真度而非门过程的平均保真度，也未做门层级的 RB 或 QPT 对照。","key_numbers":["3 比特映射：2 个发射体 + 1 个腔模（腔截断 ≤ 3 激发）","中间失谐区态转移保真度约 99%","Trotter 步长按 1−F ≤ 10⁻³ 选取","远失谐腔 ωc ≈ 100g，非对称耦合带来保真度提升"],"url":"https://doi.org/10.1103/mhhs-c3x9","abstract":"A variety of photon-mediated operations are critical to the realization of scalable quantum information processing platforms and their accurate characterization is essential for the identification of optimal regimes and their experimental realizations. Such light-matter interactions are often studied with a broad variety of analytical and computational methods that are constrained by approximation techniques or by computational scaling. Quantum processors present a new avenue to address these challenges. Here, we develop and implement an algorithm compatible with NISQ (noisy intermediate scale quantum) devices that allows a comprehensive characterization of cavity mediated two-qubit gates over a broad parameter space. In particular, we investigate the underlying quantum state transfer between the qubits, and illustrate its efficiency as a function of the detunings and couplings between the qubits and the cavity, and as a function of the damping factor of the cavity. Our algorithm is validated by a comparison with analytical results where applicable. The algorithm allows us to identify underexplored regimes of optimal performance, from which we report two insightful findings—one where we observe a state transfer fidelity of about 99 % in the intermediate detuning regime, and the other where we observe a significant boost in fidelity with qubits that are moderately detuned from each other by coupling them unequally to a far-detuned cavity. Furthermore, we illustrate the breakdown of the rotating wave approximation as we approach the ultrastrong coupling and the deep-dispersive regimes. While the current paper addresses a system that only involves a few qubits and can be solved using classical numerical methods, the algorithm can be readily extended to study a variety of systems and processes in quantum information processing that employ cavity- or photon-mediated coupling between qubits, particularly larger systems such as many-emitter ensembles, cavity arrays, and multimode cavities, that are classically intractable. See 8 more figures","review":{"verdict":"小修","confidence":"中","correctness":"比特化映射与 Trotter 分解的推导清晰，与 RWA + Schrieffer–Wolff 解析结果的对照在适用区吻合、在超强耦合区按预期分离，这本身就是对实现正确性的有力检验；99% 的保真度与失谐、耦合的依赖趋势也在多组扫描中一致。","weaknesses":"· 全部线路跑在 Qiskit 态矢量模拟器上，与“量子处理器”叙事的落差需要在正文更明确\n· 腔截断到 3 个激发，强耦合下截断误差未量化\n· 只用振幅阻尼近似耗散，缺少比特退相位与腔加热\n· 保真度为态转移保真度，未给门过程的平均保真度或 RB/QPT 数据","overclaim":"“NISQ-era quantum simulations”容易被读成硬件实验，实际为兼容 NISQ 的线路化算法在经典模拟器上的执行；“量子处理器提供新途径”的表述宜弱化为算法层面的准备。","citations":"对腔 QED、Tavis–Cummings 与 RWA 有效性的文献覆盖充分；对已有腔介导门实验（如微波腔耦合超导比特）的定量对照较少。","questions":"① 把腔截断提高到 5–6 个激发后，99% 的结论是否保持？② 若加入比特退相位，非对称耦合的优势是否仍存在？③ 该线路在含噪声的真实器件上需要多少 Trotter 步才能保住 1% 误差？","basis":"全文（arXiv:2512.12030 PDF）"}},{"id":"pr-10.1103/b14p-xpg1","no":4,"topics":["纠错码","测控与噪声"],"source":"PRA","venue":"Physical Review A","published":"2026-11-17","title":"Bias-tailored Clifford deformations for surface codes","title_zh":"面向偏置噪声的表面码 Clifford 形变","authors":["Jaemin Kim","Jeongseok Ha"],"importance":4,"importance_reason":"偏置噪声（\\(\\eta=10\\sim10^{3}\\)）是超导与某些自旋平台的现实工况，而高阈值并不等于有限码距下低逻辑错误率；本文用逻辑算符结构与新指标系统搜索可扩展的重复单元，给出在 \\(\\eta=10,10^{2},10^{3}\\) 上优于 XZZX、XY 与随机 Clifford 形变的构造，是偏置定制码设计里少见的可扩展工程路线。","summary":"作者提出按偏置噪声定制的表面码 Clifford 形变构造：用小尺寸形变图案作重复单元系统生成大码距码，并引入基于逻辑算符结构的逻辑错误率估计指标，在 \\(\\eta=10,10^{2},10^{3}\\) 的 \\(Z\\) 偏置噪声下逻辑错误率低于 XZZX、XY 与随机形变，阈值接近或超过哈希界。","problem":"Clifford 形变表面码（如 XZZX、XY 码）在 \\(Z\\) 偏置噪声下阈值很高，但“高阈值”并不保证实际关注的有限偏置区间（\\(\\eta=10\\sim10^{3}\\)）与有限码距下逻辑错误率更低；同时形变空间极大，如何系统构造在 \\(\\eta\\) 取典型值的高性能码，缺少可扩展的搜索与评估方法。","method":"作者利用表面码的拓扑结构，把小尺寸的形变图案作为重复单元，按周期性拼接生成任意大码距的 Clifford 形变表面码（CDSC），从而把搜索空间压缩到单元层级；为在无法穷举的情况下评估候选单元，作者分析偏置噪声下 CDSC 的逻辑算符结构，并据此提出一个新的逻辑错误率估计指标（由逻辑算符的权重与几何排布近似 \\(P_{L}\\)），再用该指标为 \\(\\eta=10,10^{2},10^{3}\\) 三个代表性偏置值挑选重复单元。数值上在理想综合征提取下用蒙特卡洛比较各构造的逻辑错误率与阈值。","result":"在 \\(Z\\) 偏置噪声、理想综合征提取的假设下，所提出的 CDSC 在 \\(\\eta=10,10^{2},10^{3}\\) 上逻辑错误率均低于既有 CDSC（含 XZZX、XY 与随机 Clifford 形变），阈值接近或超过哈希界（hashing bound）；基于逻辑算符结构的新指标与蒙特卡洛结果趋势一致，可作为重复单元筛选的廉价代理。","contribution":"把“高阈值”的目标换成“给定偏置与码距下的低逻辑错误率”，并给出两条可工程化的抓手：由小图案拼接的重复单元构造，以及只依赖逻辑算符结构的错误率估计指标，使偏置定制码的设计从手工试错转为可搜索的流程。","limitation":"本篇仅读到 APS 摘要页（accepted 版本），未取得全文与数值细节，以下需以全文核实：仿真假定理想综合征提取，未含测量错误与解码器时延；\\(\\eta\\) 只取 10、10^{2}、10^{3} 三个点，偏置连续变化时构造是否稳定未知；新指标与蒙特卡洛的定量偏差、以及阈值的具体数值均无法从摘要判断；实际器件中偏置比会随偏置点漂移，构造的鲁棒性未在摘要中说明。","key_numbers":["偏置 η = 10、10²、10³（Z 偏置噪声）","由小形变图案（重复单元）拼接生成任意码距 CDSC","理想综合征提取下阈值接近或超过哈希界","对比基线：XZZX、XY、随机 Clifford 形变"],"url":"https://doi.org/10.1103/b14p-xpg1","abstract":"Clifford deformations of surface codes provide a promising approach for designing quantum error-correcting codes tailored to biased Pauli noise. Variants of surface codes, such as the X Z Z X and X Y codes, achieve improved threshold performance under Z -biased noise by deforming the stabilizers of the surface code through single-qubit Clifford operations. However, high threshold performance does not necessarily translate into low logical error rates at finite code distances over a range of bias values. Specifically, we consider the finite-bias regime of practical interest, ranging from 10 to 10 3 . Furthermore, identifying high-performing Clifford-deformed surface codes (CDSCs) remains challenging due to the large space of possible Clifford deformations. To address these challenges, we propose a practical construction of CDSCs tailored to biased noise by leveraging the topological structure of surface codes. In particular, larger-distance CDSCs are systematically generated from carefully designed small deformation patterns, referred to as , enabling scalable code construction. To design repeating units, we analyze the logical operator structures of CDSCs under biased noise and introduce a new metric for estimating logical error rates. Using the logical operator structures and the proposed metric, we identify repeating units for constructing high-performing CDSCs tailored to representative bias values η = 10 , 10 2 , and 10 3 . Numerical results demonstrate that, under Z -biased noise with ideal syndrome extraction, the proposed CDSCs achieve lower logical error rates than existing CDSCs, including the X Z Z X , X Y , and random CDSCs, while achieving thresholds near or exceeding the hashing bound.","review":{"verdict":"小修","confidence":"低","correctness":"仅据摘要评估：以“有限偏置下的逻辑错误率而非阈值”为目标、以重复单元压缩搜索空间、以逻辑算符结构做代理指标，这三步在逻辑上自洽，也与偏置定制码的既有经验一致；但具体构造与数值无法核对。","weaknesses":"· 仅读到摘要页，未取得全文，全部数值结论未经核对\n· 摘要假定理想综合征提取，未提测量错误与解码器\n· \\(\\eta\\) 只取三个离散值，偏置漂移下的鲁棒性未知\n· 新指标与蒙特卡洛的一致性只有定性表述","overclaim":"摘要称阈值“接近或超过哈希界”，该表述依赖理想综合征提取与特定解码器，需全文确认；在未读全文的情况下不宜把该结论当作已确立。","citations":"无法评估（未读全文）；摘要层面与 XZZX、XY、随机 CDSC 的比较对象选择合理。","questions":"① 重复单元的周期对解码图有何影响，是否需要配套解码器？② 加入测量错误后阈值下降多少？③ \\(\\eta\\) 在 10–10³ 之间连续变化时，同一构造是否仍占优？","basis":"仅 APS 摘要页（accepted 版）；无 arXiv 镜像、Semantic Scholar 未收录、APS 未提供可下载 PDF，故未做任何数值全文核对"}},{"id":"pr-10.1103/vnfp-pk5m","no":5,"topics":["算法","测控与噪声"],"source":"PRResearch","venue":"Physical Review Research","published":"2026-11-17","title":"Quantum expectation value estimation by doubling the number of qubits","title_zh":"通过加倍比特数估计量子期望值","authors":["Hiroshi Yano","Masaya Kohda","Shoichiro Tsutsui","Ryosuke Imai","Keita Kanno","Kosuke Mitarai","Yuya O. Nakagawa"],"importance":4,"importance_reason":"把 Bell 采样从“估计纯态重叠”扩展到“一次测量所有 Pauli 串的期望值”，给出与 QWC 分组互补的采样复杂度权衡，并在 12 比特分子哈密顿量上量化了何时占优、符号未知时偏差多大，对变分算法与哈密顿量模拟的测量预算有直接参考价值。","summary":"作者用两份态副本上的 Bell 采样一次性估计所有 Pauli 串的 \\(|\\langle P\\rangle|\\)：比特数加倍但采样次数按 \\(O(1/\\epsilon^{4})\\) 而非逐项估计的 \\(O(1/\\epsilon^{2})\\) 增长，在 12 比特分子哈密顿量上，当目标精度达数十毫哈特里时优于 QWC 分组，即使符号未知亦然。","problem":"变分量子算法与哈密顿量模拟的瓶颈之一是把大量 Pauli 串的期望值估到给定精度：逐项测量需要 \\(O(1/\\epsilon^{2})\\) 次采样乘以项数，QWC 分组虽能并行但仍受限于组数；而已有的 Bell 采样只用于估计两拷贝间的重叠（如纯态保真度），未被用来批量估计一般 Pauli 期望值。","method":"作者在 \\(2n\\) 个比特上制备两份 \\(n\\) 比特态副本并做 Bell 基测量，利用测量结果的关联统计直接读出各 Pauli 串期望值的绝对值 \\(|\\langle P\\rangle|\\)；对需要符号的情形，作者分析以经典方式（如 CISD 近似）提供符号时的偏差，并把总采样复杂度与 QWC 分组、逐项测量在相同精度下比较。数值实验取分子哈密顿量（最多 12 比特，含 \\(\\mathrm{H}_4\\)），统计不同目标精度下各方法的采样次数与估计误差。","result":"一次性 Bell 采样可同时给出全部 Pauli 串的 \\(|\\langle P\\rangle|\\)，采样次数随精度按 \\(O(1/\\epsilon^{4})\\) 标度，而逐项估计为 \\(O(1/\\epsilon^{2})\\) 乘项数；在 12 比特以内的分子哈密顿量上，当目标精度为数十毫哈特里量级时，即使符号完全未知，Bell 采样所需采样数也少于 QWC 分组。用 CISD 估计符号时 \\(\\mathrm{H}_4\\) 仍可工作，但估计偏差随精度要求提高而增大。","contribution":"把 Bell 采样重新定位为“全 Pauli 串一次测量”的工具，明确其 \\(O(1/\\epsilon^{4})\\) 与 \\(O(1/\\epsilon^{2})\\) 的交叉点，并给出符号未知/近似已知两种现实情形下的偏差行为，为测量预算分配提供了除分组之外的第二种选择。","limitation":"需要两份态副本，比特数加倍且要求副本间可做 Bell 基测量，硬件开销与连通性要求都高于单副本方案；\\(O(1/\\epsilon^{4})\\) 的标度意味着高精度区间会被逐项或分组方法反超，交叉点依赖哈密顿量的项数与系数分布；符号只能靠经典近似给出，偏差随精度增长而没有系统误差界；数值仅到 12 比特，未含器件噪声与读出错误。","key_numbers":["比特数加倍（2n 比特，两份副本）","Bell 采样 O(1/ε⁴) vs 逐项 O(1/ε²)","分子哈密顿量数值最大 12 比特（含 H4）","数十毫哈特里精度以上优于 QWC 分组"],"url":"https://doi.org/10.1103/vnfp-pk5m","abstract":"Expectation value estimation is ubiquitous in quantum algorithms. The expectation value of a Hamiltonian, which is essential in various practical applications, is often estimated by measuring a large number of Pauli strings on quantum computers and performing classical post-processing. In the case of n -qubit molecular Hamiltonians in quantum chemistry calculations, it is necessary to evaluate O ( n 4 ) Pauli strings, requiring a large number of measurements for accurate estimation. To reduce the measurement cost, we assess an existing idea that uses two copies of an n -qubit quantum state of interest and coherently measures them in the Bell basis, which enables the simultaneous estimation of the absolute values of expectation values of all the n -qubit Pauli strings. The signs of those expectation values are determined separately using conventional measurement methods or inexpensive classical quantum chemistry calculations, such as configuration interaction with single and double excitations (CISD), thereby enabling estimation of the expectation value of the whole Hamiltonian. We numerically investigate the efficiency of energy estimation for molecular Hamiltonians of up to 12 qubits. The results show that, when the target precision is no smaller than tens of milli-Hartree, this method requires fewer measurements than conventional sampling methods even when the signs of Pauli expectation values are determined using conventional measurements. Although a target precision of tens of milli-Hartree is insufficient for precise quantum chemistry calculations, the method investigated here may be used for rough estimation of the Hamiltonian expectation value, which is often required in the early stages of variational quantum algorithms, as well as in other applications where moderate precision is sufficient.","review":{"verdict":"小修","confidence":"中","correctness":"Bell 基测量读出 Pauli 期望值绝对值的推导是标准的，\\(O(1/\\epsilon^{4})\\) 与 \\(O(1/\\epsilon^{2})\\) 的标度对比自洽；12 比特以内的数值与“数十毫哈特里以上占优”的结论在给出的数据范围内一致，符号偏差随精度上升的趋势也符合预期。","weaknesses":"· 需要两份态副本，硬件代价（比特数加倍、跨副本 Bell 测量）在摘要层面被淡化\n· 只给绝对值，符号依赖经典近似，缺少系统误差上界\n· 数值仅到 12 比特且无器件噪声模型\n· 与 QWC 的交叉点只对特定分子给图，未给通用判据","overclaim":"“优于分组方法”只在数十毫哈特里精度与所测分子上成立；对化学精度（毫哈特里）区间，\\(O(1/\\epsilon^{4})\\) 反而更差，摘要对此未加限定。","citations":"对 Bell 采样、QWC 分组与经典影子等测量方案的引用较完整；与 shadow tomography 的采样复杂度对比只在附录简要出现。","questions":"① 在含读出错误与两比特门噪声的器件上，加倍比特的代价能否被采样节省抵消？② 符号用 CISD 近似时，能否给出可计算的误差界？③ 对强关联体系（项数与系数分布更差）交叉点会怎样移动？","basis":"全文（arXiv:2412.14466 PDF）"}},{"id":"pr-10.1103/hxdq-dnz8","no":6,"topics":["芯片与耦合器","测控与噪声"],"source":"PRApplied","venue":"Physical Review Applied","published":"2026-11-17","title":"Universal Hamiltonian control in a planar trimon circuit","title_zh":"平面 trimon 电路中的通用哈密顿量控制","authors":["Vivek Maurya","Daria Kowsari","Kumar Saurav","S. A. Shanto","R. Vijay","Daniel A. Lidar","Eli M. Levenson-Falk"],"importance":4,"importance_reason":"用一个平面三模（trimon）器件把强而可控的全对全 \\(ZZ\\) 耦合变成资源：既做出 40 ns 内 99.93% 的条件旋转与 99.6% 的单比特门，又能用多音驱动合成全部 16 个两比特 Pauli 乘积，还演示了 \\(d=8\\) 的 qudit，是把“串扰”翻转为“哈密顿量工程”的代表性硬件工作。","summary":"作者用三个强耦合的 transmon 型模式构成平面 trimon：全对全 \\(ZZ\\) 耦合达 211–270 MHz，40 ns 条件旋转随机基准保真度 \\(99.93\\%\\)，60 ns 单比特 X 门 QPT 保真度 \\(99.56\\%\\)，并用多音驱动实现全部 16 个两比特 Pauli 乘积与 \\(d=8\\) 的 qudit 操控。","problem":"固定耦合的超导多比特体系中，\\(ZZ\\) 型静态耦合通常被视为串扰而需要抑制；但若要实现通用哈密顿量控制（任意多比特相互作用），恰恰需要一个强、可寻址且全对全的 \\(ZZ\\) 资源。如何在同一器件里同时保住长相干、快速条件操作与对全部 Pauli 乘积的可控性，是硬件层面的核心矛盾。","method":"器件由三个频率分别为 4.709、5.174、5.940 GHz 的 transmon 型模式组成，两两之间的静态 \\(ZZ\\) 耦合为 \\(2J_{AB}/2\\pi=211\\) MHz、\\(2J_{BC}/2\\pi=270\\) MHz、\\(2J_{CA}/2\\pi=243\\) MHz，强到足以在纳秒尺度完成条件相位积累。作者用多音微波驱动同时作用于多个模式，通过选择驱动频率组合与相位分别激活不同的两比特 Pauli 乘积项，从而在 15 维无迹空间中合成任意哈密顿量；并用随机基准、量子过程层析（QPT）、单发读出与拉比/拉姆齐类测量标定相干性与门保真度，最后把三个模式当作一个 \\(d=8\\) 的 qudit 做相干性对比。","result":"三个模式的 \\(T_1\\) 为 54/38/33 \\(\\mu\\)s、Hahn 回波 \\(T_2\\) 为 45/34/30 \\(\\mu\\)s、腔线宽 \\(\\kappa/2\\pi\\) 为 1.69/1.27 MHz；40 ns 的条件旋转（CCR）随机基准保真度 \\(99.93\\%\\)，60 ns 无条件 X 门 QPT 保真度 \\(99.56\\%\\)，\\(\\sqrt{i\\mathrm{SWAP}}\\) 与 \\(i\\mathrm{bSWAP}\\) 的 QPT 保真度（经 SPAM 校正）为 \\(99.19\\%\\) 与 \\(99.59\\%\\)；多音驱动实现全部 16 个两比特 Pauli 乘积，虚拟受控相位可在三比特空间实现任意对角酉操作；\\(d=8\\) 叠加态的相干时间仅比单比特短约 \\(2\\times\\)，而线性标度的 transmon 方案会退化快得多；单发 \\(|000\\rangle\\) 读出保真度约 \\(98\\%\\)。","contribution":"把强 \\(ZZ\\) 耦合从“要消除的串扰”转为“可编程资源”，在一个平面器件上同时展示高保真条件门、全 Pauli 乘积合成与 qudit 操控，为哈密顿量工程与量子模拟提供了比门级编译更直接的硬件接口。","limitation":"\\(T_2\\) 只有 30–45 \\(\\mu\\)s 量级，且作者怀疑低频磁通噪声是主要退相位来源，长线路仍受相干时间限制；多音驱动的参数空间随模式数增长很快，扩展到四个及以上模式时频率拥挤与选择定则会更严峻；门保真度多数经 SPAM 校正，未校正值更低；qudit 只演示到 \\(d=8\\) 的相干性，未做完整的 qudit 门层析。","key_numbers":["三模式频率 4.709 / 5.174 / 5.940 GHz","ZZ 耦合 2J/2π = 211 / 270 / 243 MHz（全对全）","T1 = 54 / 38 / 33 μs，T2(Hahn) = 45 / 34 / 30 μs","40 ns 条件旋转 RB 保真度 99.93%，60 ns X 门 QPT 99.56%","√iSWAP 99.19%、ibSWAP 99.59%（SPAM 校正）","全部 16 个两比特 Pauli 乘积；qudit 至 d = 8"],"url":"https://doi.org/10.1103/hxdq-dnz8","abstract":"Multimode circuits provide an avenue for flexible control of single- and multiqubit gates. In this work, we implement a multimode circuit known as a trimon integrated in a planar geometry. The trimon features three transmonlike modes with strong all-to-all Z Z coupling. We demonstrate high-fidelity operations on the trimon, achieving flexible control of its rich state space. This includes qubit rotations conditioned on one or both other qubits, unconditional single-qubit rotations, and both excitation-conserving and double-excitation two-qubit entangling gates. Through multitone driving, we are able to implement all 16 two-qubit Pauli operators in the two-qubit space. We further demonstrate using the trimon as a qudit with up to eight states and higher coherence than typical transmon-based implementations. Our results show a compact, highly controllable device that can potentially replace transmons in standard superconducting processor architectures.","review":{"verdict":"小修","confidence":"高","correctness":"器件参数（频率、\\(ZZ\\) 耦合、\\(T_1/T_2\\)、\\(\\kappa\\)）彼此自洽：强 \\(ZZ\\) 与 40 ns 条件门时间一致，\\(T_2\\) 与退相位来源的判断也吻合；99.93% 的 RB 与 99.56% 的 QPT 量级相当，16 个 Pauli 乘积的合成与虚拟受控相位的结论有层析数据支撑。","weaknesses":"· 多数门保真度经 SPAM 校正，原始值未系统列出\n· \\(T_2\\) 偏低，作者把退相位归因于低频磁通噪声但未给噪声谱测量\n· 多音驱动的可扩展性只讨论到三模式，四模式以上的频率拥挤未量化\n· qudit 演示限于相干性对比，缺少 qudit 门层析或算法级应用","overclaim":"标题“universal Hamiltonian control”指三模式内可合成任意哈密顿量，但受驱动带宽与频率选择定则限制，实际可实现的项集合需要正文限定；把它读成任意规模通用控制会过度。","citations":"对 \\(ZZ\\) 耦合抑制、哈密顿量工程与 qudit 三条线的引用充分；与用可调耦合器实现类似相互作用的方案缺少定量对比。","questions":"① 低频磁通噪声能否通过偏置点或屏蔽进一步压低？② 扩展到四模式时多音驱动需要多少个频率分量？③ 未校正的门保真度是多少，误差主要来自 SPAM 还是门本身？","basis":"全文（arXiv:2603.04566 PDF，含附录中的器件参数与标定细节）"}},{"id":"pr-10.1103/zyln-zqn7","no":7,"topics":["算法","芯片与耦合器"],"source":"PRApplied","venue":"Physical Review Applied","published":"2026-11-17","title":"Variational adiabatic eigensolver for band structure excited states","title_zh":"用于能带激发态的变分绝热本征求解器","authors":["Xingrui Liu","Liyang Sui","Tianqi Cai","Zhiwen Zong","Kunliang Bu","Wenyan Jin","Bowen Chen","Xutao Zhang","Yufan Li","Zhihao Gong","Yicong Zheng","Shengyu Zhang","Jianlan Wu","Yi Yin"],"importance":3,"importance_reason":"把绝热演化与变分优化（相位型损失）结合，在超导处理器上以 4 比特规模制备硅的价带与导带本征态，单发保真度 \\(>96\\%\\)、能量偏差经拟合降到 0.01 eV 以下；作为“用 NISQ 器件算真实材料能带”的原理演示有价值，但截断与后拟合带来的解释空间需要在阅读时留意。","summary":"作者提出变分绝热本征求解器（VAE）：用绝热演化提供初态、用相位型损失做变分优化，在超导处理器上用 4 个比特模拟硅的能带，价带与导带本征态单发保真度 \\(>96\\%\\)，能量期望偏差 0.5 eV 以内，经单频振荡拟合后降到 0.01 eV 以下。","problem":"在 NISQ 器件上求激发态能量有两难：传统绝热方法需要构造长线路且对演化时间敏感，变分量子本征求解器（VQE）对激发态精度低、容易收敛到错误本征态；而真实材料（如硅）的能带计算又需要在有限比特下处理周期性体系的连续动量。","method":"作者以近自由电子（NFE）模型加经验赝势描述硅，把倒空间截断到 15 个倒格矢，得到只含 \\(2^{4}\\) 维的实哈密顿量，从而用 4 个比特（含 1 个辅助“哑”态）表示；线路采用硬件高效拟设，绝热演化部分按 Suzuki–Trotter 分解成标准门，损失函数设计为相位型（比较演化前后相位而非仅比较能量），以同时锁定本征态与相位；实验在超导量子处理器上执行，通过单发读出统计布居并拟合能量。","result":"在超导处理器上成功制备硅的价带与导带本征态，单发读出下态保真度超过 \\(96\\%\\)；能量期望值与理论能带的偏差在 0.5 eV 以内，进一步用单频振荡拟合后偏差降到 0.01 eV 以下；数值模拟与实验结果在相同线路下定性一致。","contribution":"给出一个“绝热提供先验 + 变分精修 + 相位型损失”的激发态求解模板，并把它真正跑在超导硬件上处理一个材料能带问题，为 NISQ 阶段的电子结构计算提供了可复制的实验范式。","limitation":"体系被压缩到 4 比特、15 个倒格矢，只能给出极粗的能带采样，且用的是 NFE 加经验赝势而非第一性原理；0.5 eV 的原始能量偏差相当大，0.01 eV 的结论来自对单频振荡的事后拟合，存在把系统误差吸收进拟合参数的风险；只演示了硅的价带顶与导带底附近，未覆盖整个布里渊区；硬件噪声、读出错误与拟设表达能力对保真度的影响缺少消融实验。","key_numbers":["4 比特（含 1 个辅助态，2⁴ = 16 维）","倒空间截断 15 个倒格矢（NFE + 经验赝势）","价带/导带本征态单发保真度 > 96%","能量偏差 0.5 eV 以内，拟合后 < 0.01 eV"],"url":"https://doi.org/10.1103/zyln-zqn7","abstract":"Addressing the critical challenge of excited-state preparation in semiconductor band structure calculations, this work presents a variational adiabatic eigensolver (VAE) protocol that combines adiabatic evolution with variational optimization to prepare high-fidelity eigenstates on noisy intermediate-scale quantum (NISQ) devices. Our approach utilizes multi-qubit parameterized circuits and a phase-based loss function to circumvent the limitations of conventional methods, such as the difficulty of constructing quantum circuits in traditional adiabatic methods and the reduced accuracy of variational quantum eigensolvers for excited states. Through rigorous numerical simulations and experimental implementation on a superconducting quantum processor, we successfully prepare the valence-band and conduction-band eigenstates of silicon. Experimental results demonstrate state fidelities exceeding 96% in single-shot readout, while energy expectations agree with theoretical band energies within 0.5 eV. Subsequent refinement through single-frequency oscillation fitting further reduces the energy deviation to below 0.01 eV. This framework offers a valuable pathway for accurate electronic structure determinations in quantum materials.","review":{"verdict":"大修","confidence":"中","correctness":"线路构造（绝热 Trotter 分解 + 硬件高效拟设 + 相位型损失）与 4 比特哈密顿量的规模匹配，96% 以上的态保真度在超导器件上属合理量级；但 0.5 eV 到 0.01 eV 的跳跃完全依赖单频拟合，这一处理在物理上等价于用一个自由参数吸收误差，其可靠性需要独立验证。","weaknesses":"· 0.01 eV 的精度来自事后单频拟合，缺少不依赖拟合的误差估计\n· 4 比特、15 个倒格矢的截断过于粗糙，能带色散几乎无法分辨\n· 用 NFE + 经验赝势而非 DFT，削弱了“材料计算”的说服力\n· 未做拟设深度、噪声、读出错误的消融实验","overclaim":"摘要以“ accurate electronic structure”定位，但 0.5 eV 的原始偏差远大于化学精度，0.01 eV 是拟合产物；宜明确写成原理性演示并给出拟合前后的对照与置信区间。","citations":"对绝热方法、VQE 激发态与量子化学映射的引用较完整；对近期在硬件上做能带/材料模拟的其他工作缺少横向比较。","questions":"① 若不做单频拟合，能量偏差的统计误差是多少？② 增加倒格矢数目后 4 比特是否还够，需要多少辅助比特？③ 相位型损失对噪声的敏感度是否优于能量型损失？","basis":"全文（arXiv:2606.16604 PDF）"}},{"id":"2611.21086","no":8,"topics":["解码器","纠错码"],"source":"arXiv","venue":"arXiv","published":"2026-11-16","title":"Closing the loop on memory: accurate, shallow and transferable decoding of quantum LDPC codes","title_zh":"闭环记忆：量子 LDPC 码的高精度、浅迭代与可迁移解码","authors":["Zhou You","Ying Li","Xiao Yuan","Yuan Yao"],"importance":5,"importance_reason":"在 gross 码（\\([[144,12,12]]\\)）与含闲置的电路级噪声、\\(p=0.4\\%\\) 下，把单次逻辑失败率从 BP+OSD+CS-10 的 2.51% 压到 0.73%，且固定一套参数即可在 12 个工作点与另外 4 个码族上不重调参地工作——解码器层面少见的“既更准又更浅、还能迁移”的改动，直接对应实时解码的 FPGA 预算。","summary":"TEMPO-BP 用本地反馈让每个变量的记忆强度随解码状态自适应：gross 码在电路级噪声 \\(p=0.4\\%\\) 下单次逻辑失败率 0.73%（BP+OSD+CS-10 为 2.51%），10–15 路并行实例与跨码族迁移均无需重新调参。","problem":"置信传播是多数 qLDPC 解码器的基础，但在电路级噪声下（综合征不满足校验图模型的假设、错误在时空上相关）常常不收敛。给 BP 加“记忆”能改善收敛，可是记忆强度是个全局超参数：对不同综合征、不同码、不同物理错误率都要重调，且记忆太强会把解码动力学推入振荡，太弱则等于没有记忆。此前 Relay-BP 一类做法靠串行多轮、以迭代次数换收敛，难以满足实时解码的时延预算。","method":"作者提出 TEMPO-BP：把每个变量的记忆强度从固定超参数改成一个由本地反馈驱动的状态量，逐迭代根据该变量邻近校验的残差与对数似然更新，控制间隔取 \\(K=4\\)（BB-72 码取 \\(K=8\\)），因此整段解码在单次运行内完成，不需要串行重启。实验以双变量自行车码 \\([[144,12,12]]\\)（gross 码）为主，电路级噪声含闲置（idling）错误，物理错误率 \\(p=0.4\\%\\)，与 BP+OSD+CS-10、纯 BP、Relay-BP-1/Relay-BP-5 以及最优固定记忆 BP 对比；再在 12 个工作点与 4 个额外码族上测试参数可迁移性，并用 loop-gain 分析刻画解码动力学中的特定放大模式，另给出 FPGA 实现估计。","result":"单次运行逻辑失败率 0.73%，对比 BP+OSD+CS-10 的 2.51%（失败率约 \\(3.4\\times\\) 更低），纯 BP 为 9.84%；平均 16 次迭代收敛，而 Relay-BP-1 需要 126 次。10–15 个并发实例组成的集合在全部 10 个工作点上失败次数不高于 Relay-BP-5，且每个实例的迭代上限至少低 10 倍：集合口径 1,205 次失败对 18,080 次（约 \\(15\\times\\)）。不做任何重调参，gross 码参数在另外 4 个码族上仍优于 Relay-BP-5 在其公开 gross 配置下的结果；最优固定记忆场在同一条件下失败次数约多 9 倍，McNemar 检验 \\(P<10^{-300}\\)。按 \\(400\\) 次迭代、单次 30 ns 估计，FPGA 上单轮解码周期约 \\(1\\ \\mu\\mathrm{s}\\)，可支撑 12 轮综合征提取。","contribution":"把“记忆强度”由需要调参的全局超参数改造为由本地反馈闭环控制的逐变量状态，从而同时获得更低的逻辑失败率、更浅的迭代深度与跨码族可迁移性；并给出可解释的 loop-gain 振荡分析与面向实时解码的硬件时延估计，使记忆型 BP 第一次具备“一套参数上多码族”的工程可用性。","limitation":"结论全部来自经典解码器仿真与 FPGA 时延估算，没有在真实 FPGA/ASIC 上跑通端到端；与 OSD 类后处理的组合只在单一基线（CS-10）上比较，未讨论与 BP+OSD 高阶变体的叠加收益；测试码族以双变量自行车码为主，更高码率或带测量偏置的 qLDPC 码族尚未系统覆盖；McNemar 显著性只针对单个主工作点报告。","key_numbers":["gross 码 [[144,12,12]]，电路级噪声（含闲置），p = 0.4%","单次逻辑失败率 0.73% vs BP+OSD+CS-10 的 2.51%，纯 BP 9.84%","收敛迭代 16 次 vs Relay-BP-1 的 126 次","10–15 实例集合：1,205 vs 18,080 次失败（约 15×）","控制间隔 K = 4（BB-72 码 K = 8），McNemar P < 10⁻³⁰⁰"],"url":"https://arxiv.org/abs/2611.21086","abstract":"Quantum low-density parity-check (qLDPC) codes have attracted interest for fault-tolerant quantum computing because their high-rate constructions offer a route to reduced qubit overhead. Realizing this potential requires reliable decoding. Belief propagation (BP) forms the basis of many qLDPC decoders, but can fail to converge under circuit-level noise. Memory-based variants can improve convergence, yet selecting memory strengths that work reliably across different syndromes remains challenging. Here we introduce TEMPO-BP, which adapts each variable's memory strength to the evolving decoding state through local feedback. On the gross code at a physical error rate of 0.4%, single-run TEMPO-BP achieves a per-shot logical failure rate of 0.73%, compared with 2.51% for BP+OSD+CS-10. Ensembles of 10-15 concurrent instances match or lower failure counts relative to Relay-BP-5 at all ten tested operating points, with per-instance iteration caps at least tenfold lower than its serial limit. Without retuning, the gross-code parameters yield fewer observed failures than Relay-BP-5 in its published gross-code configuration across four additional code families. Ablations support state-dependent memory control, while a loop-gain analysis characterizes specific amplification modes in the decoding dynamics.","review":{"verdict":"小修","confidence":"高","correctness":"方法链条自洽：逐变量记忆强度由本地残差反馈驱动，控制间隔 \\(K\\) 固定，属于单次运行内的在线控制，与 Relay-BP 的串行重启在结构上不同，因此“迭代上限低 10 倍”不是把工作量藏到别处。0.73%/2.51%/9.84% 三个数在 \\(p=0.4\\%\\) 同一噪声模型下可比，集合口径 1,205 对 18,080 的对比也给出了并发数，统计上可信。","weaknesses":"· 与 OSD 类后处理只比了 CS-10 一个基线，未给出与当前最强 BP+OSD 组合的叠加曲线\n· 4 个额外码族的“不重调参”只报了观测失败次数，没有给每族的码距、噪声模型与统计量\n· FPGA 时延是估算（30 ns/迭代、400 次迭代），缺少综合后时序报告\n· loop-gain 分析是定性刻画特定放大模式，未变成可调的稳定性判据","overclaim":"标题里的 shallow 容易读成“迭代少所以一定快”，但实际时延取决于 FPGA 上每迭代的并行度与访存；\\(15\\times\\) 是集合口径（10–15 个实例）的失败次数，不是单实例等价加速，摘要中已注明但摘要外容易被误引。","citations":"对 BP、BP+OSD、Relay-BP 系列与双变量自行车码的引用齐全，与固定记忆 BP 的消融对比是本轮最有说服力的证据；相对薄弱的是缺少与神经解码器、有序统计解码等完全不同范式的对照。","questions":"① 与 BP+OSD 组合后增益是否仍然保持 3 倍以上？② 在测量错误占主导（偏置 erasure）的噪声下记忆反馈是否仍有效？③ FPGA 上一次迭代真实的并行度能做到多少，1 μs 的周期是否含访存？","basis":"全文（arXiv:2611.21086 PDF，含附录与数值细节）"}},{"id":"2611.22260","no":9,"topics":["纠错码","解码器"],"source":"arXiv","venue":"arXiv","published":"2026-11-17","title":"Logical error prediction and geometry selection for rectangular surface codes under biased circuit-level noise","title_zh":"偏置电路级噪声下矩形表面码的逻辑错误预测与几何选型","authors":["Youshin Chung","Yujin Kang","Jun Heo"],"importance":5,"importance_reason":"偏置噪声在电路级只作用于部分操作、且不会等比传给逻辑错误，本文用无偏置电路算出的“逻辑敏感度”定义响应系数、不拟合有限偏置数据，就把预测误差压到中位 1.09 倍；据此在 \\(p=0.004\\)、目标 \\(10^{-3}\\) 下把物理比特开销最多降 42.4% 与 26.2%。对需要按硬件偏置选码距与长宽比的超导团队，这是可直接套用的选型流程。","summary":"用无偏置电路的逻辑敏感度定义响应系数，预测偏置电路级噪声下矩形表面码的逻辑错误率（中位偏差 1.09 倍），并在 \\(p=0.004\\) 时把物理比特开销最多降低 42.4%（SD）与 26.2%（SI）。","problem":"真实硬件有偏置噪声，但在电路级，偏置往往只落在部分操作（例如闲置）上，且不会等比例传递到逻辑错误；另一方面表面码的几何（长宽比、朝向）决定了同一码距下需要多少物理比特。于是问题变成：在没有大量有限偏置仿真数据的前提下，如何预测任意偏置条件下的逻辑错误率，并据此挑出最省比特的矩形几何。","method":"作者先由无偏置电路级仿真建立几何相关的逻辑错误率模型 \\(F_Z(L_1,L_2,p)\\) 与 \\(F_X(L_1,L_2,p)\\)，再用“逻辑敏感度”刻画逻辑错误对两类扰动的响应：局部闲置偏置与全局物理错误率变化，从而在不拟合有限偏置数据的情况下定义依赖逻辑错误类型的响应系数，并通过有效错误参数并入模型。仿真使用 Stim + PyMatching（MWPM 解码）+ Sinter，每个数据点至少 \\(10^6\\) 次采样，覆盖 9 种几何、\\(\\eta\\in\\{3,5\\}\\)、\\(0.003\\le p\\le 0.008\\)，每个模型 66 个条件；随后用直接的偏置电路级仿真验证模型选出的几何。","result":"在全部有限偏置条件下中位 fold error 为 1.09，即预测与真值的比值中位仅偏 9%；若忽略偏置响应系数则升到 1.28，若把闲置通道的变化整体迁移则升到 3.18。以 \\(p=0.004\\)、目标逻辑错误率 \\(10^{-3}\\)、\\(\\eta\\in\\{1,2,3\\}\\) 做几何选择，相对正方形表面码的物理比特开销最多降低 42.4%（SD 模型）与 26.2%（SI 模型）；例如 \\(\\eta=3\\)、\\(p=0.004\\) 时选出的矩形 \\(17\\times 25\\)（1617 比特）替代 \\(27\\times 27\\)（2025 比特）。模型推荐的几何均通过直接偏置仿真验证。","contribution":"把“偏置会不会改变最优码几何”这一工程问题转化为可用无偏置仿真数据计算的敏感度问题，给出 1.09 倍中位精度的预测器与可验证的选型流程，并量化了矩形几何在偏置噪声下相对正方形的比特开销收益；方法本身不依赖特定解码器或码距，可直接移植到别的表面码变体与硬件偏置模型。","limitation":"只研究未旋转（unrotated）矩形表面码与 MWPM 解码，未覆盖旋转码、XZZX 类偏置专用码与更高性能解码器；偏置被限制在闲置操作，测量错误偏置与读出串扰没有进入模型；响应系数的可迁移性只在 SD/SI 两种噪声模型内验证，跨工艺或跨芯片是否仍成立未知；\\(10^6\\) 采样在接近 \\(10^{-3}\\) 目标时统计量尚可，但外推到更低错误率区域会吃紧。","key_numbers":["中位 fold error 1.09（忽略偏置响应 1.28，整体迁移 3.18）","p = 0.004，目标逻辑错误率 10⁻³，η ∈ {1,2,3}","物理比特开销最多降低 42.4%（SD）与 26.2%（SI）","矩形 17×25（1617 比特）替代正方形 27×27（2025 比特）","每个数据点 ≥ 10⁶ 次采样，每模型 66 个条件，9 种几何"],"url":"https://arxiv.org/abs/2611.22260","abstract":"Realistic quantum hardware often exhibits biased noise, but at the circuit level this bias may affect only a subset of operations and need not be transferred uniformly to logical errors. The logical response to a given physical bias is therefore central to selecting resource-efficient surface code geometries. Here, we study unrotated rectangular surface codes under standard depolarizing and superconducting-inspired circuit-level noise models. We first construct geometry-dependent logical error rate models from unbiased circuit-level simulations. We then use logical sensitivities to compare the responses to localized idle-bias and global physical error perturbations, defining logical-error-type-dependent response coefficients from an unbiased reference circuit without fitting to finite-bias data. These coefficients are incorporated through effective error parameters, yielding a median fold error of 1.09 over the evaluated finite-bias conditions. Geometries selected by the model are validated through direct biased circuit-level simulations. At a physical error rate of 0.004 and a target logical error rate of 10^{-3}, the validated rectangular codes reduce physical qubit overhead by up to 42.4% and 26.2% under the two noise models, respectively, relative to unrotated square codes. These results provide a practical link between circuit-level bias response and resource-efficient surface code design.","review":{"verdict":"小修","confidence":"中","correctness":"逻辑敏感度取自无偏置参考电路的微扰响应，再以有效错误参数并入几何模型，这一路线避免了在小样本偏置数据上过拟合，1.09 的中位 fold error 与两个对照（1.28、3.18）形成了清晰的消融证据；42.4%/26.2% 的收益是在 \\(p=0.004\\)、目标 \\(10^{-3}\\) 的固定工作点与两种噪声模型下给出，并与直接仿真交叉验证，口径一致。","weaknesses":"· 只做未旋转矩形码与 MWPM，未比较旋转码、XZZX 与 Tesseract 等更强解码器\n· 偏置只加在闲置操作，测量/读出偏置缺失，而这两者在超导里往往同样有偏\n· 66 个条件/模型集中在 \\(0.003\\le p\\le 0.008\\)，靠近阈值时模型外推能力未验证\n· 42.4% 是“最多”值，正文未给全部 \\(\\eta\\) 与几何下的分布，读者难判断典型收益","overclaim":"摘要把 42.4% 与 26.2% 并列，容易被读成普适收益；实际上它依赖固定的目标 \\(10^{-3}\\) 与 \\(p=0.004\\)，且是相对未旋转正方形码这一较弱基线，换基线后收益会缩水。","citations":"对偏置噪声、矩形/旋转表面码几何优化与超导噪声模型的引用覆盖到位；不足是对已有的偏置专用码（XZZX、偏置换算）只用一句话带过，未量化对比其比特开销。","questions":"① 换成旋转码后矩形几何还有多少收益？② 若闲置与测量同时偏置，响应系数是否仍能由无偏置电路算出？③ 目标错误率降到 \\(10^{-6}\\) 时模型是否还准？","basis":"全文（arXiv:2611.22260 PDF，含附录与数值细节）"}},{"id":"2611.22035","no":10,"topics":["容错实验","纠错码"],"source":"arXiv","venue":"arXiv","published":"2026-11-17","title":"Magic state cultivation with lattice-surgery escape on superconducting hardware","title_zh":"超导硬件上以晶格手术逃逸实现的魔态培育","authors":["Haoran Liao","Michael Schutzman","William Munizzi","Pranav Mundada","Gavin Hartnett","Yuval Baum"],"importance":4,"importance_reason":"首次在公开可用的 IBM Nighthawk 上实验演示“晶格手术逃逸”这一魔态培育方案：注入角 T 态逻辑错误 \\(2.0\\times10^{-5}\\)（保留约 30 万 shots 中 6 次错误），比前次实验低近 10 倍；逃逸后十轮 T 态保真度仍 >0.99。它把非 Clifford 资源态的制备成本与保真度同时推进了一步，且给出了与嫁接逃逸的同条件对比。","summary":"在 IBM Nighthawk 上首次实验实现魔态培育的晶格手术逃逸：注入角逻辑错误 \\(2.0\\times10^{-5}\\)，逃逸十轮后 T 态保真度仍 >0.99（约 5% 保留率），每稳定子轮逻辑错误约 0.14%（约 11% 保留率）。","problem":"魔态培育（MSC）把 T 态先在小编码（如 Steane 码）里低开销地“养”出来，再逃逸到更大的码中以获得更强的纠错，是近期最有希望的低开销非 Clifford 资源制备路线。但逃逸方式本身有取舍：晶格手术逃逸此前只有理论提案，嫁接逃逸虽已实验演示，却因嫁接区域的可匹配性限制，保真度随轮次下降较快。到底哪种逃逸在真实硬件上更划算，缺少同芯片、同解码、同后选择的公平对比。","method":"作者在公开的 IBM Nighthawk 处理器上实现两种 MSC 变体，目标都是距离 5 码上的魔态：T 态在 Steane 码（qubit 0–6）上容错培育后，经隐形传态送入 \\([[25,1,5]]\\) 旋转表面码。第一种是晶格手术逃逸（Hirano 等提出，本文首次实验研究），merge/split 共 3 轮；第二种是嫁接逃逸（Rosenfeld 等演示），本文把 switch 并入可匹配码以扩展其能力。两种方案都在按硬件噪声校准的电路级错误模型上用 MWPM 或 Tesseract 解码，并采用基于解码器置信度的互补间隙后选择（CGP）；每个注入角 1,200,000 shots，每个层析基 500,000 shots。","result":"晶格手术逃逸在注入角给出 T 态逻辑错误概率 \\(2.0\\ [1.2,3.2]\\times10^{-5}\\)（300,462 个保留 shots 中 6 次错误），比之前实验低近 10 倍，而保留率约为其 3 倍；同条件下嫁接逃逸每稳定子轮的逻辑错误率低 2 倍且保留率更高。在相同执行条件与 CGP 下，晶格手术逃逸进入表面码后十轮仍保持 T 态保真度 >0.99（约 5% 保留率），而可匹配 switch 嫁接在相近保留率下已跌到 0.95 以下；晶格手术逃逸每稳定子轮逻辑错误率约 0.14%（平均保留约 11%），不用 CGP 时保留 30.1% 的 shots，CGP 下保留 16% 时保真度仍为 0.99。","contribution":"给出晶格手术逃逸的首次实验演示，并在同一硬件、同一解码与后选择条件下与嫁接逃逸做公平对比，说明“直接过渡到表面码”的逃逸在保真度保持上明显更优；报告了迄今最低的 MSC 逻辑错误与最高的表面码魔态保真度，把非 Clifford 容错 gadget 从原理验证推进到可复现的硬件配方。","limitation":"全部结果在单颗距离 5 码、单芯片、Steane 培育码 + \\([[25,1,5]]\\) 表面码的组合上取得，未外推到距离 7 及以上，因此看不到“逃逸后码距增长”带来的标度收益；CGP 后选择丢掉了 70%–90% 的 shots，端到端资源开销需要与培育码的并行度一起算；解码依赖按硬件校准的电路级模型，若噪声漂移模型会失配；T 态层析在低保留率下统计量有限（300,462 shots 中仅 6 次错误，置信区间较宽）。","key_numbers":["T 态逻辑错误 2.0 [1.2, 3.2] × 10⁻⁵（300,462 保留 shots，6 次错误）","比前次实验低近 10×，保留率约 3×","晶格手术逃逸十轮后保真度 > 0.99（约 5% 保留率）","每稳定子轮逻辑错误约 0.14%（平均保留约 11%）","每注入角 1,200,000 shots，每层析基 500,000 shots"],"url":"https://arxiv.org/abs/2611.22035","abstract":"Magic state cultivation (MSC) is a low-overhead protocol for fault-tolerantly preparing logical magic states. In this work, we implement two MSC variants to prepare a magic state in a distance-5 code on a publicly available IBM Nighthawk processor. The first is a lattice-surgery escape, recently proposed by Hirano et al. and experimentally studied here for the first time. The second is a grafting escape, previously demonstrated by Rosenfeld et al., and extended here by incorporating a switch into a matchable code. Both protocols begin with fault-tolerant cultivation of a T state on a color code, followed by an escape into a larger code. We decode the results using minimum-weight perfect matching or Tesseract on circuit-level error models calibrated to the hardware noise. Compared with the previous experiment, our cultivated T state achieves a logical error probability of 2e-5 at the T-state injection angle, nearly 10x lower with about 3x the retainment. Moreover, our execution of the grafting escape has a 2x lower logical error rate per stabilizer round at a higher retainment. When comparing the two protocols under identical execution conditions and complementary gap postselection based on decoder confidence, lattice-surgery escape into the surface code preserves a T-state fidelity above 0.99 ten rounds after escape at about 5% retainment. By contrast, matchable-switched grafting drops below 0.95 fidelity at comparable retainment. Furthermore, the lattice-surgery escape reaches a logical error rate per stabilizer round of about 0.14% with around 11% average shot retainment. These results establish lattice-surgery escape as a practical MSC protocol that benefits from a direct transition into a surface code, and demonstrate the lowest MSC error and the highest surface-code magic-state fidelity reported to date, advancing the experimental realization of fault-tolerant non-Clifford gadgets.","review":{"verdict":"小修","confidence":"中","correctness":"两种逃逸在同一芯片、同一解码器族（MWPM/Tesseract）、同一 CGP 规则下对比，公平性比此前跨实验比较强得多；\\(2.0\\times10^{-5}\\) 由 300,462 保留 shots 中 6 次错误给出，量级可信但统计误差不小（置信区间 [1.2, 3.2]）。保真度 >0.99 与 <0.95 的对比是本文最有信息量的结论，因为它在低保留率下仍成立。","weaknesses":"· 只有距离 5 码，没有距离 7 的标度点，无法判断逃逸方案在更大码上的相对优势\n· CGP 后选择保留率低至约 5%，端到端开销（含重复制备）没有与不后选择的方案在同等 shots 成本下比较\n· 300,462 shots 中仅 6 次错误，\\(10^{-5}\\) 量级的结论对系统误差敏感\n· 解码依赖硬件校准模型，噪声漂移下结论稳健性未讨论","overclaim":"“lowest MSC error and highest surface-code magic-state fidelity reported to date” 依赖不同实验的 shots 口径与后选择强度，跨实验比“最低”容易受保留率影响；正文对同一实验内部的对比更可靠。","citations":"对 MSC 原始提案、Hirano 等的晶格手术逃逸、Rosenfeld 等的嫁接逃逸引用准确，CGP 与 Tesseract 解码的出处也齐全；缺少与“直接蒸馏”路线在同等硬件上的资源对比。","questions":"① 距离 7 时晶格手术逃逸的优势是否还保持？② 若不用 CGP 而用更多 shots 换统计量，每轮逻辑错误率是否仍优于嫁接？③ 逃逸后的表面码能否直接接入逻辑门（而非只做存储）？","basis":"全文（arXiv:2611.22035 PDF，含附录与数值细节）"}},{"id":"2611.21906","no":11,"topics":["解码器","容错实验"],"source":"arXiv","venue":"arXiv","published":"2026-11-17","title":"Probing the real-time decoding accuracy bounds in trapped ion architectures","title_zh":"离子阱架构中实时解码精度上限的探索","authors":["Arianna Meinking","Evangelia Takou","Kenneth R. Brown"],"importance":4,"importance_reason":"离子阱的毫秒级纠错周期本来让“低时延”不再是硬约束，但此前没人把这笔时间预算换成精度。本文用“弱解码器跑全部窗口 + 低置信窗口罕见切换到强解码器”的混合滑窗方案，在离子噪声模型的 BB 码上比 BP-LSD 降低 3–4 个数量级、比 Beamsearch 低 2–3 个数量级逻辑错误率，且时延不超过 Beamsearch——直接改变了“离子平台该配哪种解码器”的结论。","summary":"混合滑窗解码：弱解码器处理所有窗口，仅把低置信窗口罕见地交给强解码器；在离子噪声模型的 BB 码上比 BP-LSD 降低 3–4 个数量级逻辑错误率，比 Beamsearch 低 2–3 个数量级，时延相当或更低。","problem":"实时解码器要求处理综合征的速度快于纠错周期。超导平台周期约 1 μs，时延是硬约束；离子阱的周期在毫秒量级，本可以让解码器“多想一会儿”，但已有仿真与实验仍沿用为超导设计的低时延策略（BP-LSD、Beamsearch），没有把这多出来的经典处理时间转化为逻辑错误抑制。关键问题：在毫秒预算内，如何组合弱/强解码器才能逼近精度上限，同时保证时延不超标？","method":"作者提出混合滑窗解码：所有窗口都由低精度解码器处理，只有被判定为低置信的窗口才不频繁地切换到高精度解码器。他们给出对任意 qLDPC 码都高效的软输出提取办法（以 cluster norm 作为置信度量），从而能识别低置信窗口。弱解码器取 BP-LSD 或 union-find，强解码器取 Tesseract 或 Relay-BP；在双变量自行车码 \\([[72,12,6]]\\)、\\([[90,8,10]]\\)、\\([[126,8,10]]\\)、\\([[144,12,12]]\\)、\\([[162,8,14]]\\) 上仿真存储实验，噪声取按 IonQ 蓝图构造的离子阱模型（全连接退极化、Pauli+泄漏、Pauli+擦除）。","result":"在纯 Pauli 噪声、\\(p=2\\times10^{-3}\\) 下，逻辑错误率比 BP-LSD 低 3 个数量级以上，比 Beamsearch 低 2–3 个数量级；Pauli+泄漏噪声下 Relay-BP 作为强解码器在未做泄漏约化时不稳定，而 Tesseract 稳健；Pauli+擦除噪声下用 union-find 作弱解码器还能再降最多 3 个数量级。混合方案的整体时延与 Beamsearch 相当或更好，且物理错误率越低，达到同等增益所需的强解码器调用比例越低。","contribution":"把“离子阱毫秒级周期”这一硬件特性转成解码算法设计自由度：给出可对任意 qLDPC 码使用的软输出置信度量、弱/强解码器的混合调度规则，并系统量化了不同离子噪声通道下“精度—时延”的取舍，说明离子平台不必在解码精度上向超导的时延约束妥协。","limitation":"全部为仿真，未在真实离子阱上验证；假设强解码器可被随时调用，且窗口切换的经典调度开销可忽略；噪声模型虽按 IonQ 蓝图构造，但不含真实测量串扰、漂移与离子输运误差；切换阈值（何谓低置信）未做最优搜索，只给了经验设定；结论依赖毫秒级周期，若离子平台周期缩短到几十微秒，强解码器调用余量会迅速消失。","key_numbers":["BB 码 [[72,12,6]]、[[90,8,10]]、[[126,8,10]]、[[144,12,12]]、[[162,8,14]]","Pauli 噪声 p = 2×10⁻³：比 BP-LSD 低 > 3 个数量级","比 Beamsearch 低 2–3 个数量级逻辑错误率","Pauli+擦除 + union-find 弱解码：再降最多 3 个数量级","离子纠错周期约 ms，超导约 1 μs"],"url":"https://arxiv.org/abs/2611.21906","abstract":"Fault tolerant quantum computers will rely on real-time decoders that process syndromes faster than the QEC cycle duration. The millisecond cycle times offered by trapped ion platforms relax low-latency decoding demands, but simulations and experiments have not yet exploited this time budget to reach maximum logical error suppression. We show how a hybrid sliding window decoding scheme composed of a lower-accuracy and a higher-accuracy decoder can yield substantially improved logical error rates, while preserving low latency. All windows are handled by the lower-accuracy decoder, with some windows being infrequently switched to the higher-accuracy decoder. We extract soft-output information from the lower-accuracy decoder efficiently for any QLDPC code, which allows us to identify decoding windows of low confidence. We simulate memory experiments of bivariate bicycle (BB) codes, using trapped-ion informed noise models. Depending on the physical error rate and BB code, we find up to 3-4 orders of magnitude logical error rate reduction compared to the BP-LSD decoder, and up to 2-3 orders of magnitude lower logical error rate compared to the Beamsearch decoder. By leveraging available classical processing time, our decoding protocol significantly boosts decoding accuracy, ultimately reducing the demands on increasing code size.","review":{"verdict":"小修","confidence":"中","correctness":"混合调度与软输出置信度的组合逻辑清楚：弱解码器给出的 cluster norm 反映窗口可靠性，只有低置信窗口升级，因此平均时延由弱解码器主导，这与“时延与 Beamsearch 相当”的结论自洽。3–4 个数量级的提升在纯 Pauli 噪声下跨度很大，作者用多个 BB 码与两个弱解码器交叉验证，可信度尚可。","weaknesses":"· 纯仿真，离子噪声模型虽按蓝图构造但未与任何实测综合征统计对齐\n· 切换阈值与“不频繁”的具体比例缺少敏感性分析\n· 泄漏噪声下 Relay-BP 失效、Tesseract 稳健这一结论只在一两个工作点展示\n· 时延估计未含窗口间调度的经典开销与内存带宽","overclaim":"“up to 3-4 orders” 是跨码、跨错误率的最优值，摘要没强调它出现在哪个码与哪个 \\(p\\)；把毫秒周期当成固定前提，若离子平台加速到微秒级，方案的主要优势即消失。","citations":"对 BP-LSD、Beamsearch、Tesseract、Relay-BP 与 BB 码的引用完整，离子噪声建模引用了 IonQ 蓝图；缺少与“单强解码器全窗口”基线在同等时延预算下的直接对照。","questions":"① 若把时延预算固定为 1 ms，最优的强弱解码器比例是多少？② 真实离子阱的测量串扰会怎样改变低置信窗口的判定？③ 窗口长度对增益的影响有多大？","basis":"全文（arXiv:2611.21906 PDF，含附录与数值细节）"}},{"id":"2611.21709","no":12,"topics":["纠错码","经典模拟"],"source":"arXiv","venue":"arXiv","published":"2026-11-17","title":"QEDist: Practical Exact Distance Certification for Stabilizer Codes","title_zh":"QEDist：稳定子码的实用精确距离认证","authors":["Jong Yeon Lee"],"importance":4,"importance_reason":"很多候选 qLDPC 码的距离此前只有上界，选码时无法判断是否真达到设计值。QEDist 用“已满足 + 未满足校验”双重下界配合对称性、稳定子等价与 LP 张量块分解，把精确距离认证做到几千比特码、单核数秒，并在本文给出 \\([[2075,87]]\\) 的 \\(d=34\\)、\\([[975,195]]\\) 的 \\(d=24\\) 等被确定下来的距离——这是选码与优化码族的工具级进展。","summary":"QEDist 用已满足与未满足校验共同给出的权重下界剪枝，结合验证对称性、稳定子等价与 LP 张量块分解，在单核数秒内精确认证几千比特码的距离：\\([[2075,87]]\\) 的 \\(d=34\\)、\\([[975,195]]\\) 的 \\(d=24\\) 均被确定。","problem":"稳定子码的实际纠错能力由最小逻辑算符权重（距离）决定，但精确求距离在最坏情况下是 NP 难问题：既有工具要么只能给上界（构造出一个逻辑算符），要么在几百比特以上就超时。qLDPC 码族（尤其 lifted product 与非阿贝尔构造）规模动辄上千比特，若不能确认距离，码的性能评估与几何优化都失去基准。","method":"作者在树搜索框架上构建 QEDist：逐比特扩展候选逻辑算符，用稀疏校验结构、稳定子等价（同一陪集内只保留代表）与已验证的对称性削减分支。核心改进是双向下界——满足一个校验可能违反另一个，因此同时使用已满足校验与未满足校验来给出“完成该逻辑算符至少还需多少权重”的下界，凡下界超过剩余预算的分支立即剪掉。对 lifted product 码，再用乘积结构把部分全码搜索替换为在经典分量上的小规模搜索（张量块分解）。给定阈值 \\(W\\)，搜索完成时要么找到权重不超过 \\(W\\) 的非平凡逻辑算符，要么证明不存在。","result":"在 Apple M3 Pro 单核上，排除时间 \\(0.17\\)–\\(7.94\\) s；加权校验下界把中位搜索量降低 \\(3.1\\)–\\(8.1\\times\\)；在 11 个单项式输入上比通用 CSS 精确搜索中位快 \\(2.59\\times\\)（\\(d_Z\\approx20\\)）。具体认证了 \\([[2075,87]]\\) 的 \\(d=34\\)、\\([[975,195]]\\) 非阿贝尔 LP（mitten）码的 \\(d=24\\)，以及 BB 码 \\([[360,12,24]]\\)、\\([[756,16,34]]\\)、两个 TT 码的距离 14 与 16、\\([[180,12,8]]\\) 的 \\((d_X,d_Z)=(20,8)\\)、\\([[432,12,12]]\\) 的 \\((36,12)\\)；并确认 \\([[144,12,12]]\\) 码综合征提取电路的故障距离为 10。","contribution":"把精确距离认证从“几百比特、需要分钟级甚至超时”推进到“几千比特、单核数秒”，并首次确定了一批此前只有上界的 qLDPC 码距离（含非阿贝尔 lifted product）；同时把认证能力从码距离扩展到综合征提取电路的故障距离，使选码、码族优化与电路级验证可以共用一套工具。","limitation":"最坏情况仍是指数复杂度，剪枝质量取决于下界紧度与对称性数量，对随机化程度高、对称性少的码收益有限；系统基准集中在 CSS 码，非 CSS 只做了形式化推广而未给实验；与 MILP/整数规划类精确求解器只在部分实例上比较，缺少统一时限下的大规模横评；故障距离认证目前只演示了单个 \\([[144,12,12]]\\) 电路。","key_numbers":["[[2075,87]] 认证 d = 34；[[975,195]] 非阿贝尔 LP 码 d = 24","BB [[360,12,24]]、[[756,16,34]]；TT 码距离 14 与 16","[[180,12,8]]: (dX,dZ) = (20,8)；[[432,12,12]]: (36,12)","排除时间 0.17–7.94 s（Apple M3 Pro 单核）","加权校验下界使中位搜索量降低 3.1–8.1×","[[144,12,12]] 综合征提取电路故障距离 = 10"],"url":"https://arxiv.org/abs/2611.21709","abstract":"We present QEDist, a method and software package that certifies the distance of qubit stabilizer codes. Building on tree-search methods, QEDist constructs candidate logical operators one qubit at a time, using sparse parity checks, stabilizer equivalence, and verified symmetries to reduce the work. For a cutoff \\(W\\), a completed search either finds a nontrivial logical operator of weight at most \\(W\\) or proves that none exists. Because satisfying one check can violate another, we use both satisfied and unsatisfied checks to lower-bound the weight needed to complete a logical operator, and prune branches whose bound exceeds the remaining budget, which substantially reduces net search time. We benchmark QEDist mainly on Calderbank-Shor-Steane (CSS) codes; the same formulation extends to non-CSS codes and to the fault distance of syndrome-extraction circuits. For lifted-product (LP) codes, we further exploit the product structure to replace part of the full-code search with a smaller search on a classical constituent. We establish exact distances for codes with up to several thousand qubits, including Abelian and non-Abelian LP codes whose distances were previously reported only as upper bounds. In several seconds of search on one laptop core, QEDist certifies exact distances up to 20 for many of these codes and fault distance 10 for the syndrome-extraction circuit of the \\([[144,12,12]]\\) code. With orders-of-magnitude speedups over the tested exact solvers, QEDist makes exact distance certification a practical tool for selecting and optimizing finite-length quantum codes.","review":{"verdict":"小修","confidence":"高","correctness":"“精确认证”是强命题，作者用“搜索完成要么找到 ≤ W 的逻辑算符、要么证明不存在”定义了可验证的判定语义，并且下界由已满足与未满足校验共同给出，逻辑上不依赖启发式。具体距离值与 LP/BB 码的已知构造一致，\\([[144,12,12]]\\) 的故障距离 10 也与该电路已有结果吻合，交叉印证较好。","weaknesses":"· 剪枝效率强依赖码的对称性与稀疏结构，随机码上的表现未系统给出\n· 非 CSS 码只有形式化推广，没有任何数值结果\n· 与 MILP/ILP 类求解器的对比只在部分实例、且时限设置未统一\n· 软件包的接口与可复现脚本在正文中描述较简，读者复现成本偏高","overclaim":"“orders-of-magnitude speedups over the tested exact solvers” 是相对被测试的那几个求解器，而非全部精确方法；对数以千比特的码，搜索时间仍随 \\(W\\) 指数增长，摘要未强调这一点。","citations":"树搜索、稳定子等价与 LP 码构造的引用完整，也引用了此前只给上界的结果以便对照；不足是缺少与基于 MILP 的距离证明工作在同一硬件、同一组码上的正面对比。","questions":"① 在对称性很弱的随机 qLDPC 码上，QEDist 的加速比还剩多少？② 能否把故障距离认证扩展到多轮综合征提取电路的整段时空距离？③ 与 MILP 方法在统一超时下的胜率如何？","basis":"全文（arXiv:2611.21709 PDF，含附录与数值细节）"}},{"id":"2611.23009","no":13,"topics":["编译与验证","芯片与耦合器"],"source":"arXiv","venue":"arXiv","published":"2026-11-18","title":"PRISM: A Logical-Physical Boundary Compiler for Dual-Rail Qubits","title_zh":"PRISM：面向双轨量子比特的逻辑—物理边界编译器","authors":["Evan McKinney","Kun Liu","Harshvardhan K. Babla","Robert J. Schoelkopf","Yongshan Ding"],"importance":3,"importance_reason":"双轨腔比特上一个逻辑门有多种等价物理实现，先定实现再布线会强制多余的 SWAP。PRISM 把“选实现”推迟到布线到达可执行布局时，25 个负载上少 20.4–30.8% SWAP、深度低 8.8–10.1%，16 逻辑比特下每次保留 shot 的尝试少 44.3%——这是容错编译里少见的、同时给出形式化与量化收益的边界优化。","summary":"PRISM 让每个逻辑门的等价物理实现一直保持开放，直到布线到达可执行布局时才提交；25 个负载、三种器件图上比“先定实现再布线”的贪心少 20.4–30.8% SWAP、物理深度低 8.8–10.1%。","problem":"编码把每个逻辑比特摊到多个物理自由度上，编译器要把逻辑门翻成原生指令；同一个逻辑门往往有多种等价实现，它们通过不同的物理连线交互。布线会移动这些连线，于是“先选实现”可能逼出另一个实现本可避免的 SWAP——码扩展与物理布线因此构成一个阶段顺序（phase-ordering）问题。对双轨腔比特，逻辑 \\(\\mathrm{CR}_z\\) 就有四种允许光子损耗的实现，各自占用不同的轨道配对。","method":"PRISM 把每个门的实现集合跨“逻辑—物理”边界保持开放，只有当布线把线路带到某个可执行该门的布局时才提交具体实现。作者形式化了三件事：哪些物理电路实现某个逻辑门、其中哪些满足容错错误模型、编译器最终保留哪些；并定义了“某门在某布局下可执行”的判定条件。对双轨腔比特，他们证明逻辑 \\(\\mathrm{CR}_z\\) 的四种允许损耗实现各对应一种轨道配对，其逻辑可用图恰是“被占据器件图按轨道对取商”的简单商图。实验覆盖 25 个负载、7–25 个逻辑比特、三种器件图（含 grid 与 hex），并与“先固定实现再布线”的贪心搜索对比；另在三轮 Steane 存储电路上评估跳过门泄漏下的解码逻辑错误。","result":"相对贪心基线，PRISM 减少 20.4%–30.8% 的布线 SWAP、物理深度降低 8.8%–10.1%；在 grid 与六角晶格上，SWAP 缩减在 32 个逻辑比特内仍成立。由于路径更短，器件模型上的光子损耗下降，16 个逻辑比特时每次保留 shot 所需的尝试次数（按负载与器件图的几何平均）减少 44.3%；在三轮 Steane 存储、跳过门泄漏的场景下，解码后的逻辑错误也更低；擦除检查可识别超过 99% 的光子损失。","contribution":"把“逻辑门实现选择”与“物理布线”从串行两阶段改造成可共同优化的边界问题，给出实现可用性的形式化刻画与可执行判定，并在双轨腔这一具体架构上证明该优化有可测量的 SWAP、深度与损耗收益；同时说明收益在更大逻辑比特数下仍持续，为容错编译提供了“延迟提交”这一通用设计模式。","limitation":"结果以编译层计数（SWAP 数、深度、尝试次数）与器件级模型仿真为主，未含真实双轨腔门保真度与腔间串扰；\\(\\mathrm{CR}_z\\) 的四种实现依赖资源态消耗，文中未把资源态开销折算进总成本；与其它边界策略（如分层调度、基于 SMT 的联合优化）缺少端到端保真度对比；负载集合虽为 25 个，但来源与分布未详细说明。","key_numbers":["SWAP 减少 20.4%–30.8%，物理深度降低 8.8%–10.1%","25 个负载，7–25 个逻辑比特，三种器件图","16 逻辑比特时每次保留 shot 的尝试次数少 44.3%","逻辑 CRz 有 4 种允许损耗的实现（每种对应一种轨道配对）","grid/hex 上 SWAP 缩减保持到 32 个逻辑比特"],"url":"https://arxiv.org/abs/2611.23009","abstract":"Quantum computers can encode each logical qubit across multiple physical degrees of freedom so that errors on the physical qubits can be detected or corrected. A compiler must then translate each logical gate into native instructions, and one gate can have several equivalent realizations that interact through different wires. Routing moves those wires, so a realization chosen before routing can force SWAPs that another would avoid, making code expansion and physical routing a phase-ordering problem. PRISM therefore keeps each gate's realizations open across the logical--physical boundary and commits to one only when routing reaches a layout that can execute it. We formalize which physical circuits implement a gate, which respect the fault model, and which the compiler keeps, and define when a gate can execute under a layout. For dual-rail cavity qubits, logical \\(\\mathrm{CR}_z\\) has four loss-admissible realizations, one per rail pairing, and its logical availability graph is exactly the simple quotient of the occupied device graph by the rail pairs. Across 25 workloads with 7 to 25 logical qubits on three device graphs, PRISM reduces routing SWAPs by 20.4--30.8\\% and physical depth by 8.8--10.1\\% relative to a greedy search that fixes each realization before routing. On the grid and hexagonal lattice, the SWAP reductions hold through 32 logical qubits. By shortening routes, PRISM also reduces photon loss on device models and therefore needs 44.3\\% fewer attempts per retained shot at 16 logical qubits, as a geometric mean over workloads and device graphs, and it lowers decoded logical error in a three-round Steane memory under skip-gate leakage.","review":{"verdict":"小修","confidence":"中","correctness":"把实现选择推迟到布线阶段、并在布局可达时提交，这个 formulation 与“逻辑可用图 = 器件图按轨道对取商”的代数刻画一致，\\(\\mathrm{CR}_z\\) 的四种实现正好对应四种配对，因此 20%–30% 的 SWAP 缩减有明确来源，不是调参结果。深度降低与尝试次数减少的方向也彼此吻合。","weaknesses":"· 全部收益是编译层/模型层指标，没有真实双轨腔门保真度或腔串扰数据\n· 资源态消耗没有折算进总成本，四种实现的实际代价被隐含为相等\n· 与 SMT 联合优化、分层调度等替代方案缺少对比\n· 25 个负载的选取标准与代表性未说明","overclaim":"标题与摘要强调 logical-physical boundary 的通用性，但量化结果几乎全部来自双轨腔 \\(\\mathrm{CR}_z\\) 的置换对称性；对没有这种对称结构的架构（如中性原子 zoned 架构）收益可能小得多。","citations":"对容错编译、双轨腔比特、表面码布线的工作引用到位，相位顺序问题也引了相关调度文献；缺少与“编译器层面已有实现选择延迟”方法的直接对比。","questions":"① 把资源态开销算进去后 SWAP 缩减还剩多少？② 在真实双轨腔器件上，跳过门泄漏下的逻辑错误收益是否保持？③ 该框架能否扩展到多比特门与魔术态注入的联合调度？","basis":"全文（arXiv:2611.23009 PDF，含附录与数值细节）"}},{"id":"2611.23083","no":14,"topics":["大规模仿真","容错实验"],"source":"arXiv","venue":"arXiv","published":"2026-11-18","title":"Performance of Fusion-Based Quantum Computing with Imperfect Photon Indistinguishability","title_zh":"光子不可分辨性不完美时聚变式量子计算的性能","authors":["Katia Hakem","Grégoire de Gliniasty","Nathan Shettell","Paul Hilaire","Stephen C. Wein"],"importance":4,"importance_reason":"光子容错的阈值通常按“理想资源态”算，本文把资源态生成与聚变测量中的部分不可分辨性纳入硬件启发噪声模型，得到反直觉结论：全光子构造下，Shor(2,2) 编码反而把不可分辨阈值从 0.136% 压到 0.080%，而 RUS 构造两者相当。这直接否定了“编码一定提升容错裕度”的默认假设，对光子路线选资源态方案有指导价值。","summary":"在硬件启发的光子不可分辨噪声下，全光子构造的 Shor(2,2) 编码把不可分辨阈值从 0.136% 降到 0.080%，而 RUS 构造的编码/未编码阈值相当（0.271%/0.256%）：编码是否有益取决于资源态制备方式。","problem":"聚变式量子计算（FBQC）用小纠缠资源态加线性光学聚变测量来构建容错光子计算，逻辑编码能显著提升对光子损耗的容忍度，但这是否也适用于其它噪声并不清楚。真实单光子源的光子之间并非完全不可分辨，部分可分辨性会在聚变测量中引入有效错误；若资源态本身由有噪声的源制备，编码带来的额外光子与门数可能反而放大这类错误。","method":"作者为资源态生成与聚变测量分别建立硬件启发的噪声模型，把部分光子不可分辨性映射为聚变接口上的有效错误，再在 6-ring 聚变网络上做容错阈值与逻辑错误率评估。比较对象是未编码资源态与 Shor(2,2) 编码资源态，各自又分两种制备方式：全光子构造与 emitter-assisted 的 repeat-until-success（RUS）构造。噪声含 heralded 失败与损耗，用 Stim 采样后解码，得到各组合的不可分辨阈值与每光子损耗阈值。","result":"全光子构造下，编码把不可分辨度阈值从 0.136% 降到 0.080%，即编码反而使容错对不可分辨性更敏感；RUS 构造下未编码与编码的阈值相当，分别为 0.256% 与 0.271%，编码没有明显收益但也没有恶化。在增强聚变（boosted fusion）模型下，每光子损耗阈值 \\(p^{\\star}_{\\mathrm{loss}}=2.7\\%\\)。结论是资源态生成方式会实质性地决定光子架构的容错能力，仅按理想资源态评估编码方案会给出误导性结论。","contribution":"给出把部分光子不可分辨性纳入 FBQC 容错评估的可操作方法，并在 6-ring 网络上定量说明“编码是否提升裕度取决于资源态制备方式”：全光子路线中编码反而降低阈值，RUS 路线中编码收益中性。这为光子容错的架构选择提供了反例与判据，也解释了为什么不同文献对编码收益的结论会互相矛盾。","limitation":"只在 6-ring 聚变网络与特定聚变电路上评估，未覆盖更一般的 3D 拓扑或不同环数的网络；单光子源参数（不可分辨度、效率）取代表值而非扫描全部硬件参数；噪声模型不含探测器暗计数、非马尔可夫失相与温度漂移；阈值由有限码距外推得到，报告的是阈值而非具体逻辑错误率曲线；未讨论 RUS 构造的 heralding 开销与时间成本。","key_numbers":["全光子：阈值 0.136%（未编码）→ 0.080%（Shor(2,2) 编码）","RUS：0.256%（未编码）与 0.271%（编码）","每光子损耗阈值 p*_loss = 2.7%（boosted fusion）","6-ring 聚变网络，Stim 采样 heralded 噪声与失败"],"url":"https://arxiv.org/abs/2611.23083","abstract":"Fusion-based quantum computation (FBQC) is a promising route to fault-tolerant photonic quantum computing, connecting small entangled resource states through linear-optical fusion measurements. While logical encoding can substantially improve resilience to photon loss, whether these benefits extend to other noise remain an open question. In this work, we show that this is not generally the case when accounting for partial photon distinguishability during resource state generation and fusion measurement. We develop hardware-motivated noise models to capture these effects and investigate their impact on fault tolerance in the 6-ring fusion network. We compare unencoded and Shor(2,2)-encoded resource states prepared using all-photonic and emitter-assisted repeat-until-success (RUS) schemes. For the all-photonic construction, encoding reduces the distinguishability threshold from 0.136% to 0.08%. In contrast, the RUS construction tolerates more distinguishability, with comparable unencoded and encoded thresholds (0.256% and 0.271%, respectively). These results expose a fundamental limitation of evaluating logical encodings under idealized resource-state assumptions and demonstrate that resource-state generation can critically determine the fault tolerance of photonic architectures.","review":{"verdict":"小修","confidence":"中","correctness":"把不可分辨性折算成聚变接口上的有效错误，再在统一的 6-ring 网络上比较四种组合，口径一致；编码阈值下降而非上升，说明编码引入的额外光子/门数与不可分辨错误之间的权衡被真实捕捉到了，这个反直觉结果是可信的。RUS 下 0.256% 与 0.271% 相差很小，作者也只说“可比”，表述克制。","weaknesses":"· 只评估了 6-ring 网络一种拓扑，结论对网络形状与外环数的依赖未知\n· 单光子源参数只取代表值，没有给阈值随不可分辨度/效率的完整相图\n· 未含暗计数、失相与探测效率不匹配等真实缺陷\n· 只报阈值，未给固定码距下的逻辑错误率曲线，工程可用性差一层","overclaim":"“show that this is not generally the case” 的语气强于证据范围（单一网络、单一聚变电路、代表参数），若换拓扑后编码仍有收益，结论需要收窄。","citations":"对 FBQC 原始提案、6-ring 网络、Shor 编码与 RUS 构造的引用完整，也引用了损耗阈值相关工作；缺少与“融合测量中不可分辨性误差建模”其它做法的定量对照。","questions":"① 换成更大环数或 3D 拓扑后，编码是否仍降低阈值？② 不可分辨度与光子效率同时恶化时阈值如何移动？③ RUS 的 heralding 时间开销在系统层面是否抵消其容错优势？","basis":"全文（arXiv:2611.23083 PDF，含附录与数值细节）"}},{"id":"2611.22057","no":15,"topics":["芯片与耦合器","经典模拟"],"source":"arXiv","venue":"arXiv","published":"2026-11-17","title":"QCap: a physics-corrected graph neural network for the capacitance matrix of any planar superconducting device layout","title_zh":"QCap：面向任意平面超导器件版图的物理修正图神经网络电容矩阵模型","authors":["Sadman Ahmed Shanto","Saikat Das","Eli M. Levenson-Falk"],"importance":3,"importance_reason":"电容矩阵直接决定 \\(E_C\\)、从而决定比特频率与耦合强度，而 Ansys Q3D 一次要几分钟到几小时、9 比特器件要 228 GB 内存。QCap 用“矩量法粗解当物理先验 + 图神经网络修正”在笔记本上 12 秒给出同精度结果（4009 个留出设计中位误差 0.177%），并开源模型与数据——对需要反复迭代版图的超导设计流程是实用的加速器。","summary":"QCap 把版图转成通用图表示、以矩量法粗解为物理先验再由图神经网络修正，秒级预测任意平面超导器件的麦克斯韦电容矩阵：4009 个留出设计中位误差 0.177%，9 比特器件 12 秒（Ansys 需 19.9 h/228 GB）。","problem":"从器件版图提取电容矩阵需要进行电磁仿真，计算量大，是电路器件精确设计的主要瓶颈。机器学习可以绕过仿真，但已有方法只适用于使用特定部件的版图，而且需要针对同样的部件做上千次仿真来生成训练数据，既不通用于任意版图，也没有摆脱“为新部件重新造数据”的循环。","method":"QCap 先用一种新的设计嵌入算法把版图转换成通用图表示，使模型可以处理任意工具创建的任意版图；再用快速矩量法（method of moments）仿真得到一个粗略的电容先验，让网络学习修正这个先验而不是从零回归，从而提高精度。训练/评估覆盖 4,009 个从训练数据中留出的设计，并单独测试从未见过的部件族；此外用 9 比特器件与 100 比特、781 导体器件演示规模化能力。模型与数据开源在 SQuADDS 与 Hugging Face。","result":"在 4,009 个留出设计上，模型输出与 Q3D 仿真一致到中位误差 0.177%；在未见过的部件族上误差仍低于 1%。9 个超导比特器件的电容矩阵在笔记本上 12 秒得到，误差不到 1%，而 Ansys 需要 19.9 小时与 228 GB 内存；对大到无法直接仿真的 100 比特、781 导体器件，3.4 分钟即可给出电容。","contribution":"把“物理先验 + 学习修正”的组合用于电容提取，用通用图嵌入打通了任意版图的适用性，从而摆脱了按部件族重造训练数据的限制；给出可复现的开源模型与数据，并用两个数量级的规模化案例证明该方法能处理传统仿真无法处理的大器件。","limitation":"只处理平面版图与准静态近似，未覆盖三维互连、倒装焊与超导 TSV；训练目标来自 Q3D 仿真而非实测，模型继承了 Q3D 的系统偏差；在极低电容、强耦合或存在大块接地金属的边缘情形误差可能上升；只预测电容矩阵，不含电感、损耗与表面介质损耗，而这些同样影响比特相干。","key_numbers":["4,009 个留出设计：中位误差 0.177%","未见过部件族：误差 < 1%","9 比特器件：12 秒（笔记本）vs Ansys 19.9 h / 228 GB","100 比特、781 导体器件：3.4 分钟"],"url":"https://arxiv.org/abs/2611.22057","abstract":"Electromagnetic simulations of device layouts to extract capacitance are computationally intensive, a major obstacle to accurate design of circuit devices. Machine learning models can bypass these simulations, but previous approaches have been restricted to layouts using only particular components, and require thousands of simulations of those same components as training data. We present QCap, a model that accurately predicts the Maxwell capacitance matrix of an arbitrary superconducting device layout in seconds, compared to minutes to hours of Ansys Q3D simulations. We develop a novel design-embedding algorithm that converts the layout into a universal graph format, allowing the model to work with any layout created with any tool. To achieve high accuracy, we obtain a coarse physics prior from a fast method of moments simulation of capacitance, then train the model to correct this prior. On 4,009 test designs withheld from training data the model outputs agree with Q3D simulations to a median error of 0.177%, and on never-seen component families it stays below 1% error. We demonstrate the model's scaling by obtaining the capacitance matrix of a 9-superconducting-qubit device in 12 seconds on a laptop (compared to 19.9 h and 228 GB of memory in Ansys) with sub-percent error, and capacitance of a (too large to simulate) 100-qubit, 781-conductor device in 3.4 min on a laptop. We provide the open-source models and data on SQuADDS and Hugging Face. Our results provide a powerful tool for large-scale accurate circuit design and guide the development of models to bypass other physical simulations.","review":{"verdict":"小修","confidence":"中","correctness":"以矩量法粗解为残差起点、让网络只学修正量，这一归纳偏置与电容问题的长程库仑核匹配，0.177% 的中位误差和“未见部件族 < 1%”的泛化结果互为支撑；9 比特器件 12 秒对 19.9 小时是可直接核验的工程数字，量级可信。","weaknesses":"· 基准真值是 Q3D 仿真而非实测，无法排除双方共享的系统偏差\n· 只覆盖平面、准静态情形，三维互连与倒装焊未涉及\n· 0.177% 是中位数，缺少误差分布的尾部（最坏设计）信息\n· 100 比特案例无真值可比，只能说明可算出，不能说明准确","overclaim":"“any planar superconducting device layout” 的 any 依赖训练分布覆盖，未见部件族虽 <1% 但仍是对“同类版图风格”的泛化；标题中的 physics-corrected 实际只是矩量法先验，并未嵌入麦克斯韦方程约束。","citations":"对 Q3D 电容提取、矩量法、图神经网络用于器件建模的引用齐全，也引用了 SQuADDS 数据基础设施；缺少与其它 ML 电容模型的同数据集定量对比。","questions":"① 误差分布的长尾有多重，最坏设计偏差多少？② 加入三维互连后模型需要多少新数据？③ 用实测电容校准后模型偏差是否仍为 0.177%？","basis":"全文（arXiv:2611.22057 PDF，含附录与数值细节）"}},{"id":"2611.21389","no":16,"topics":["纠错码"],"source":"arXiv","venue":"arXiv","published":"2026-11-17","title":"Vanishing Relative Distance of Uniformly Random CSS LDPC Codes Built from Permutation Matrices","title_zh":"置换矩阵构造的均匀随机 CSS LDPC 码相对距离趋于零","authors":["Kenta Kasai"],"importance":3,"importance_reason":"量子 LDPC 码的很多候选来自“若干置换矩阵拼成的 CSS 校验矩阵”（双变量自行车码、部分 lifted product 都属于此类）。本文证明在固定列重 \\(J\\ge3\\)、偶数行重 \\(L>2J\\) 下，若置换均匀随机，相对最小距离以概率趋于零；这给出了“随机抽这类构造通常不好”的负面基准，也说明好码必须靠结构化设计而非随机采样。","summary":"证明由 \\(P\\times P\\) 置换矩阵均匀随机拼成的 CSS LDPC 码（固定列重 \\(J\\ge3\\)、偶数行重 \\(L>2J\\)）相对最小距离以概率趋于 0，且每个固定相对权重上都有指数多非平凡逻辑代表，指数下界 \\(h_2(\\alpha)/2\\)。","problem":"经典随机正则 LDPC 码的最小距离可以随码长线性增长，这让人期待“随机生成的量子 CSS LDPC 码”也能有好距离，实际构造中常直接随机采样置换矩阵。但量子情形下稳定子约束（行间必须交换）改变了权重枚举的结构，随机采样是否仍能得到线性距离，此前没有定论。","method":"作者研究由任意 \\(P\\times P\\) 置换矩阵排成完整 \\(J\\times L\\) 阵列、并在满足交换条件下均匀随机采样得到的 CSS 校验矩阵，固定列重 \\(J\\ge3\\) 与固定的偶数行重 \\(L>2J\\)，码长 \\(n=LP\\)。分析工具是权重枚举：先排除稳定子，统计所有非平凡逻辑代表的计数，再给出逐系数（coefficientwise）的下界，证明在偶数权重序列上、每个固定相对权重 \\(0<\\alpha<1\\) 处都有指数多个这样的代表；其典型值与均值的指数下界为 \\(h_2(\\alpha)/2\\)（\\(h_2\\) 为二元熵）。随后把该下界与经典 LDPC、稠密 CSS 码的平均权重分布指数作比较，并由“每个固定目标权重 \\(\\delta n\\) 之下都以高概率存在逻辑算符”推出距离结论。","result":"对固定 \\(J\\ge3\\) 与偶数 \\(L>2J\\)，相对最小距离在 \\(P\\to\\infty\\) 时依概率收敛到零，即 \\(d/n\\to0\\)，而码率仍满足 \\(R\\ge1-2J/L>0\\)。也就是说，可以同时有正的码率与趋零的相对距离——随机置换构造在距离意义上几乎必然失败。这一负面结果与“存在结构化好 CSS 码族”的已知结论并不矛盾，反而说明结构设计不可省略。","contribution":"给出随机置换矩阵 CSS LDPC 构造的第一个相对距离趋零的严格证明，并把失败机制定位到权重枚举层面（每个固定相对权重上都有指数多逻辑代表），从而解释为什么随机采样这类构造无法复现经典 LDPC 的线性距离，为量子 LDPC 码的构造搜索提供了明确的负面基准与理论判据。","limitation":"结论只针对“均匀随机”的置换采样，不影响结构化构造（如特定双变量自行车码、lifted product）可以有好距离；\\(J\\)、\\(L\\) 的常数与阈值未做最优估计，\\(h_2(\\alpha)/2\\) 是下界而非精确指数；证明是渐近概率性的，对有限 \\(P\\)（例如 \\(P\\sim 10\\)–\\(100\\) 的实际码）不给出定量预测；未讨论带偏置或非 CSS 的类似构造。","key_numbers":["固定列重 J ≥ 3，偶数行重 L > 2J，码长 n = LP","相对最小距离 d/n → 0（依概率，P → ∞）","码率下界 R ≥ 1 − 2J/L > 0","逻辑代表计数的指数下界 h₂(α)/2"],"url":"https://arxiv.org/abs/2611.21389","abstract":"Classical random regular low-density parity-check codes can have minimum distance growing linearly with block length. We study CSS check matrices formed as full \\(J\\times L\\) arrays of arbitrary \\(P\\times P\\) permutation matrices, sampled uniformly subject to commutation. For fixed column weight \\(J\\ge3\\) and fixed even row weight \\(L>2J\\), we prove that the relative minimum distance converges to zero in probability as \\(P\\to\\infty\\), with block length \\(n=LP\\). We analyze the weight enumerators that count all nontrivial logical representatives after excluding stabilizers. A coefficientwise lower bound shows that, at every fixed relative weight \\(0<\\alpha<1\\) along even-weight sequences, exponentially many such representatives exist with high probability. Their typical and mean counts have exponent lower bound \\(h_2(\\alpha)/2\\), where \\(h_2\\) is the binary entropy function. We compare this bound with the classical LDPC and dense CSS mean weight-distribution exponents. The existence, with high probability, of a logical operator below every fixed target weight \\(\\delta n\\) yields the distance conclusion.","review":{"verdict":"接受","confidence":"高","correctness":"论证路径清楚且不依赖数值：权重枚举在排除稳定子后统计逻辑代表，逐系数下界给出每个固定相对权重上的指数多代表，再由“任意 \\(\\delta n\\) 之下高概率存在逻辑算符”推出 \\(d/n\\to0\\)。结论与已知的“结构化好码族存在”不冲突，说明作者清楚自己结论的边界。","weaknesses":"· 只覆盖均匀随机置换采样，实际构造多为结构化，负面结论不直接适用于工程选码\n· \\(h_2(\\alpha)/2\\) 是下界，真实指数可能更大，作者未讨论紧性\n· 渐近结论对有限 \\(P\\) 无定量预测，而实际码 \\(P\\) 往往只有几十\n· 未讨论带测量偏置或非 CSS 的类似随机构造","overclaim":"标题与摘要都限定了“uniformly random”，表述严谨；但读者容易把结论外推成“置换矩阵构造的 qLDPC 码距离都差”，这与双变量自行车码等结构化构造的实测结果相反，需要在阅读时自行区分。","citations":"对经典随机正则 LDPC 距离、量子 CSS 构造、权重枚举方法的引用到位，也与稠密 CSS 均值权重分布做了指数比较；缺少与具体 qLDPC 码族距离上界的数值对照。","questions":"① 若置换采样改为受约束（如双变量自行车码的循环结构），距离结论如何变化？② 有限 \\(P=10\\)–\\(100\\) 时逻辑代表计数的实际量级是多少？③ 该下界能否推广到带偏置噪声的 XZZX 类构造？","basis":"全文（arXiv:2611.21389 PDF，含附录与数值细节）"}}]}</script>
<script>
(function () {
  "use strict";
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  const META = DATA.meta || {};
  const ARTICLES = Array.isArray(DATA.articles) ? DATA.articles : [];
  const STORE_KEY = "ftqc-digest-v2";
  const STATUS_LABEL = { inbox: "待读", reading: "在读", done: "已提炼" };
  const IMP_LABEL = { 5: "必读", 4: "高", 3: "中", 2: "参考", 1: "低" };
  const IMP_STYLE = {
    5: ["#c62828", "#fdeaea"],
    4: ["#1f4fd1", "#e9efff"],
    3: ["#087a5b", "#e3f6ee"],
    2: ["#9a5b00", "#fff3d6"],
    1: ["#6b7280", "#f0f1f1"]
  };
  const PALETTE = [
    ["#1f4fd1", "#e9efff"],
    ["#c2410c", "#fff0e6"],
    ["#087a5b", "#e3f6ee"],
    ["#6d45c7", "#f0eaff"],
    ["#9a5b00", "#fff3d6"],
    ["#b3266e", "#fde8f2"],
    ["#0e7490", "#e2f5f8"]
  ];
  const SOURCE_STYLE = {
    "arXiv": ["#c2410c", "#fff0e6"],
    "PRX": ["#1f4fd1", "#e9efff"],
    "PRX Quantum": ["#6d45c7", "#f0eaff"]
  };
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const esc = (v) => String(v == null ? "" : v)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  let store = {};
  try { store = JSON.parse(localStorage.getItem(STORE_KEY) || "{}") || {}; } catch (e) { store = {}; }
  const wf = (id) => store[id] || (store[id] = { status: "inbox", note: "" });
  const save = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) { toast("浏览器阻止本地存储，修改仅在当前页有效"); } };
  let toastTimer;
  function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1800); }
  const dateOnly = (v) => String(v || "").slice(0, 10);

  // topic palette, stable by first appearance
  const allTopics = [];
  ARTICLES.forEach(a => (a.topics || []).forEach(t => { if (!allTopics.includes(t)) allTopics.push(t); }));
  const topicColor = {};
  allTopics.forEach((t, i) => { topicColor[t] = PALETTE[i % PALETTE.length]; });
  const sourceCounts = {};
  ARTICLES.forEach(a => { sourceCounts[a.source] = (sourceCounts[a.source] || 0) + 1; });
  const mustRead = ARTICLES.filter(a => a.importance >= 5).length;

  $("#pageTitle").textContent = META.title || "文献速递";
  $("#pageSubtitle").textContent = META.subtitle || "容错量子计算与超导量子计算机仿真";
  $("#issueDate").textContent = META.issue_date || "—";
  const reviewed = ARTICLES.filter(a => a.review).length;
  $("#issueCounts").innerHTML = `${ARTICLES.length} 篇 · 必读 <b>${mustRead}</b> 篇${reviewed ? ` · AI 审稿 ${reviewed}` : ""}`;
  $("#asOf").textContent = META.collection_window || ("数据截至 " + (META.as_of || "—"));
  $("#generatedAt").textContent = META.generated_at || "—";
  $("#scopeLink").href = META.scope_href || "../SCOPE.md";

  const GROUP_STYLE = {
    "arXiv": "#c2410c",
    "PR 系列": "#1f4fd1",
    "Nature 系列": "#087a5b",
    "Quantum": "#6d45c7",
    "Science Advances": "#b3266e",
    "SciPost Physics": "#0e7490",
    "AVS Quantum Science": "#7a4bb5",
    "Quantum Science and Technology": "#9a5b00",
    "Cryptology ePrint Archive": "#8a5200"
  };
  const journalRows = Array.isArray(META.journals) ? META.journals : [];
  const totals = META.coverage_totals || {
    raw: journalRows.reduce((n, r) => n + Number(r.raw || 0), 0),
    deduped: journalRows.reduce((n, r) => n + Number(r.raw || 0), 0),
    screened: journalRows.reduce((n, r) => n + Number(r.screened || 0), 0),
    included: journalRows.reduce((n, r) => n + Number(r.included || 0), 0)
  };
  $("#coverage").innerHTML = `<details class="coverage">
    <summary><span>检索覆盖</span><span class="nums">抓取 ${totals.raw} · 去重 ${totals.deduped} · 关键词初筛 ${totals.screened} · 收录 ${totals.included}</span></summary>
    <div class="coverage-body">
      <table class="coverage-table">
        <thead><tr><th>来源 / 期刊</th><th>状态</th><th class="num">抓取</th><th class="num">关键词初筛</th><th class="num">收录</th></tr></thead>
        <tbody>
          ${journalRows.map(r => {
            const color = GROUP_STYLE[r.label] || GROUP_STYLE[r.group] || "#303030";
            const st = r.status || "ok";
            const stLabel = st === "ok" ? "正常" : st === "partial" ? "部分" : "失败";
            const stCell = `<td><span class="st st-${st}">${stLabel}</span></td>`;
            if (r.kind === "group") {
              return `<tr class="group"><td>${esc(r.label)}</td>${stCell}<td class="num">${r.raw}</td><td class="num">${r.screened}</td><td class="num">${r.included}</td></tr>`;
            }
            return `<tr class="${r.kind === "journal" ? "sub" : "single"}"><td><span class="coverage-source"><span class="source-dot" style="--sc:${color}"></span>${esc(r.label)}</span></td>${stCell}<td class="num">${r.raw}</td><td class="num">${r.screened}</td><td class="num"><b>${r.included}</b></td></tr>`;
          }).join("")}
          <tr class="total"><td>合计（去重后）</td><td>—</td><td class="num">${totals.deduped}</td><td class="num">${totals.screened}</td><td class="num">${totals.included}</td></tr>
        </tbody>
      </table>
    </div>
  </details>`;

  // keyword bar
  const state = { topic: "all" };
  function countTopic(t) { return ARTICLES.filter(a => (a.topics || []).includes(t)).length; }
  function renderKeywordBar() {
    const items = [`<button class="kbtn kbtn-all" data-topic="all" aria-pressed="${state.topic === "all"}">全部<span class="c">${ARTICLES.length}</span></button>`];
    allTopics.forEach(t => {
      const [c, bg] = topicColor[t];
      items.push(`<button class="kbtn" data-topic="${esc(t)}" aria-pressed="${state.topic === t}" style="--tc:${c};--tbg:${bg}">${esc(t)}<span class="c">${countTopic(t)}</span></button>`);
    });
    $("#keywordBar").innerHTML = items.join("");
  }
  renderKeywordBar();

  function impColor(v) { return IMP_STYLE[v] || IMP_STYLE[1]; }
  function sourcePill(source) {
    const [c, bg] = SOURCE_STYLE[source] || ["#4b514c", "#f0f1f1"];
    return `<span class="source-pill" style="--sc:${c};--sbg:${bg}">${esc(source)}</span>`;
  }
  function topicChips(a) {
    return (a.topics || []).map(t => {
      const [c, bg] = topicColor[t] || ["#4b514c", "#f0f1f1"];
      return `<span class="topic" style="--tc:${c};--tbg:${bg}">${esc(t)}</span>`;
    }).join("");
  }


  function reviewPoints(text) {
    let t = String(text || "").trim();
    if (!t) return ["（未提供）"];
    let parts = t.split(/(?=（\d+）)|(?=\(\d+\)\s)/).map(s => s.trim()).filter(Boolean);
    if (parts.length === 1) {
      parts = t.split(/\n+/).map(s => s.trim()).filter(Boolean);
    }
    if (parts.length === 1 && /[；;]/.test(t) && t.length > 120) {
      parts = t.split(/[；;]/).map(s => s.trim()).filter(Boolean);
    }
    if (parts.length === 1) {
      const sentences = t.match(/[^。！？]+[。！？]?/g) || [t];
      if (sentences.length > 1) parts = sentences.map(s => s.trim()).filter(Boolean);
    }
    const expanded = [];
    for (const part of parts) {
      if (part.length > 420 && /[；;]/.test(part)) {
        expanded.push(...part.split(/[；;]/).map(s => s.trim()).filter(Boolean));
      } else {
        expanded.push(part);
      }
    }
    return expanded.map(s => s.replace(/^[（(]?\d+[）)]?\s*/, "").trim()).filter(Boolean);
  }
  function reviewList(text) {
    return `<ul>${reviewPoints(text).map(p => `<li>${esc(p)}</li>`).join("")}</ul>`;
  }
  function reviewHTML(a) {
    const r = a.review;
    if (!r) return "";
    return `<details class="review">
      <summary>AI 审稿</summary>
      <div class="review-body">
        <div class="review-block"><h3>核心主张是否成立</h3>${reviewList(r.correctness)}</div>
        <div class="review-block"><h3>主要缺陷</h3>${reviewList(r.weaknesses)}</div>
        <div class="review-block"><h3>是否夸大</h3>${reviewList(r.overclaim)}</div>
        <div class="review-block"><h3>需要核对的引用 / 实验</h3>${reviewList(r.citations)}</div>
        <div class="review-block"><h3>要作者回答的问题</h3>${reviewList(r.questions)}</div>
        <p class="review-meta">${esc(r.basis)} · AI 生成的批判性审稿，不是同行评审；结论以原文为准。</p>
      </div>
    </details>`;
  }

  function entryHTML(a) {
    const w = wf(a.id);
    const [ic, ib] = impColor(a.importance);
    const opts = Object.entries(STATUS_LABEL).map(([k, v]) => `<option value="${k}"${w.status === k ? " selected" : ""}>${v}</option>`).join("");
    return `<article class="entry" id="p-${String(a.no).padStart(2, "0")}" data-id="${esc(a.id)}" style="--imp:${ic};--imp-bg:${ib}">
      <aside class="rail">
        <div class="no">${String(a.no).padStart(2, "0")}</div>
        <span class="imp-badge" title="${esc(a.importance_reason || "")}" aria-label="重要性 ${a.importance} / 5，${IMP_LABEL[a.importance]}"><span>${a.importance}</span><span class="den">/5</span></span>
        <span class="imp-label">${esc(IMP_LABEL[a.importance] || "")}</span>
      </aside>
      <div class="entry-body">
        <div class="entry-meta">
          ${sourcePill(a.source)}<span class="sep">·</span><time datetime="${esc(dateOnly(a.published))}">${esc(dateOnly(a.published))}</time><span class="sep">·</span><span>${esc(a.venue || "")}</span>
        </div>
        <h2><a href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">${esc(a.title)}</a></h2>
        <p class="title-zh">${esc(a.title_zh)}</p>
        <p class="authors">${esc((a.authors || []).join(" · "))}</p>
        <div class="topics">${topicChips(a)}</div>
        <p class="imp-reason"><b>重要性 ${a.importance}/5 · ${esc(IMP_LABEL[a.importance] || "")}</b> · ${esc(a.importance_reason || "")}</p>
        <p class="summary"><b>结论</b>${esc(a.summary)}</p>
        <div class="analysis">
          <div><h3>问题</h3><p>${esc(a.problem)}</p></div>
          <div><h3>方法</h3><p>${esc(a.method)}</p></div>
          <div><h3>结果</h3><p>${esc(a.result)}</p></div>
          <div><h3>关键贡献</h3><p>${esc(a.contribution)}</p></div>
          <div class="wide"><h3>局限 / 待核验</h3><p>${esc(a.limitation)}</p></div>
        </div>
        <div class="keynums"><span class="label">关键数字</span>${(a.key_numbers || []).map(k => `<span class="kn">${esc(k)}</span>`).join("")}</div>
        <div class="entry-foot">
          <div class="entry-actions">
            <select class="status-select" data-status="${esc(a.id)}" aria-label="阅读状态">${opts}</select>
            <button class="textbtn" type="button" data-note-toggle="${esc(a.id)}">${w.note ? "编辑笔记" : "笔记"}</button>
            <a class="link" href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">原文 ↗</a>
            ${a.pdf_url ? `<a class="link" href="${esc(a.pdf_url)}" target="_blank" rel="noopener noreferrer">PDF</a>` : ""}
            ${a.doi ? `<a class="link" href="https://doi.org/${esc(a.doi)}" target="_blank" rel="noopener noreferrer">DOI</a>` : ""}
          </div>
        </div>
        <details class="abstract"><summary>摘要原文</summary>
          <div class="abstract-block"><div class="abstract-lang">English</div><p>${esc(a.abstract || "摘要待补。")}</p></div>
          ${a.abstract_zh ? `<div class="abstract-block"><div class="abstract-lang">中文翻译</div><p>${esc(a.abstract_zh)}</p></div>` : ""}
        </details>
        ${reviewHTML(a)}
        <div class="note-wrap" data-note-wrap="${esc(a.id)}"${w.note ? "" : " hidden"}>
          <textarea class="note-area" data-note="${esc(a.id)}" placeholder="记录：值得记下的方法、需要核对的数字、与你当前工作的连接…">${esc(w.note)}</textarea>
          <div class="note-meta"><span data-save-status="${esc(a.id)}">${w.note ? "已从本机恢复" : "自动保存在本机"}</span><button class="textbtn" type="button" data-export-one="${esc(a.id)}">导出此条</button></div>
        </div>
      </div>
    </article>`;
  }

  function renderTOC() {
    const list = ARTICLES.slice().sort((a, b) => a.no - b.no);
    $("#tocList").innerHTML = list.map(a => `<li><a href="#p-${String(a.no).padStart(2, "0")}" data-toc-link><span class="toc-no">${String(a.no).padStart(2, "0")}</span><span>${esc(a.title_zh || a.title)}</span></a></li>`).join("");
  }
  function closeTOC() {
    $("#tocPanel").hidden = true;
    $("#tocToggle").setAttribute("aria-expanded", "false");
  }

  function typesetMath() {
    if (!window.MathJax || !MathJax.typesetPromise) return;
    const run = () => MathJax.typesetPromise([$("#entries")]).catch(err => console.warn("MathJax:", err));
    if (MathJax.startup && MathJax.startup.promise) MathJax.startup.promise.then(run);
    else run();
  }

  function render() {
    const list = ARTICLES.filter(a => state.topic === "all" || (a.topics || []).includes(state.topic)).sort((a, b) => a.no - b.no);
    $("#entries").innerHTML = list.map(entryHTML).join("");
    $("#emptyState").innerHTML = ARTICLES.length
      ? `<b>这个关键词下暂无条目</b>点“全部”回到完整列表。`
      : `<b>本轮无新增论文</b>数据时间范围内没有新增条目。`;
    $("#emptyState").classList.toggle("show", list.length === 0);
    $("#listSummary").innerHTML = `显示 <b>${list.length}</b> / ${ARTICLES.length} 篇`;
    $$(".kbtn").forEach(b => b.setAttribute("aria-pressed", String(state.topic === b.dataset.topic)));
    typesetMath();
  }

  $("#keywordBar").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-topic]");
    if (!btn) return;
    state.topic = btn.dataset.topic;
    render();
  });

  $("#entries").addEventListener("click", (e) => {
    const toggle = e.target.closest("[data-note-toggle]");
    if (toggle) {
